name: TEMP Port Anneessens School Latest

on:
  push:
    paths:
      - ".github/workflows/_tmp_port_anneessens_school.yml"

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: visual/anneessens-school-8de7f36
      - name: Port exact lot files from clean prior branch
        run: |
          git fetch origin visual/anneessens-school-8f3e5ee
          git checkout origin/visual/anneessens-school-8f3e5ee -- \
            grand-bruxelles-game/project.godot \
            grand-bruxelles-game/data/osm/anneessens_school_256375327.game.json \
            grand-bruxelles-game/game/scripts/anneessens_school_hero.gd \
            grand-bruxelles-game/game/tests/anneessens_school_visual_ab_test.gd \
            grand-bruxelles-game/tests/test_anneessens_school_source.py \
            grand-bruxelles-game/tools/fetch_anneessens_school_source.py \
            .github/workflows/grand-bruxelles-anneessens-school-source.yml \
            .github/workflows/grand-bruxelles-anneessens-school-visual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/project.godot grand-bruxelles-game/data/osm/anneessens_school_256375327.game.json grand-bruxelles-game/game/scripts/anneessens_school_hero.gd grand-bruxelles-game/game/tests/anneessens_school_visual_ab_test.gd grand-bruxelles-game/tests/test_anneessens_school_source.py grand-bruxelles-game/tools/fetch_anneessens_school_source.py .github/workflows/grand-bruxelles-anneessens-school-source.yml .github/workflows/grand-bruxelles-anneessens-school-visual.yml
          git diff --cached --quiet || git commit -m "feat(anneessens): port school landmark onto latest main"
          git push origin HEAD:visual/anneessens-school-8de7f36
