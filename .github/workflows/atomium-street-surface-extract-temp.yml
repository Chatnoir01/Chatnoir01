name: One-shot Atomium StreetSurface extraction

on:
  push:
    branches: ["integration/atomium-street-surface-extract-temp-v2"]
    paths:
      - "grand-bruxelles-game/data/_scratch/atomium_street_surfaces_source.json"
      - ".github/workflows/atomium-street-surface-extract-temp.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Atomium subset and self-clean
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          src_path=Path('grand-bruxelles-game/data/_scratch/atomium_street_surfaces_source.json')
          dtm_path=Path('grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json')
          out_path=Path('grand-bruxelles-game/data/urbis/laeken_jette/atomium_street_surfaces.game.json')
          prov_path=Path('grand-bruxelles-game/data/sources/laeken_jette/atomium_street_surfaces_provenance.json')
          src=json.loads(src_path.read_text()); dtm=json.loads(dtm_path.read_text())
          features=src.get('features',[]) if isinstance(src,dict) else src
          if not isinstance(features,list): raise SystemExit('StreetSurface source features missing')
          origin_e=float(dtm['game_origin_e']); origin_n=float(dtm['game_origin_n'])
          anchor_e=float(dtm['atomium_reference']['e']); anchor_n=float(dtm['atomium_reference']['n'])
          d=dtm['bounds_epsg31370']; radius=300.0
          target={'min_e':max(float(d['min_e']),anchor_e-radius),'max_e':min(float(d['max_e']),anchor_e+radius),'min_n':max(float(d['min_n']),anchor_n-radius),'max_n':min(float(d['max_n']),anchor_n+radius)}
          def coords_flat(o):
            if isinstance(o,(list,tuple)):
              if len(o)>=2 and isinstance(o[0],(int,float)) and isinstance(o[1],(int,float)): yield float(o[0]),float(o[1])
              else:
                for x in o: yield from coords_flat(x)
          def to_en(a,b): return (a,b) if abs(a)>10000 and abs(b)>10000 else (origin_e+a,origin_n-b)
          kept=[]; detected=None
          for f in features:
            geom=f.get('geometry',{}) if isinstance(f,dict) else {}; pts=list(coords_flat(geom.get('coordinates',[])))
            if not pts: continue
            if detected is None:
              a,b=pts[0]; detected='EPSG:31370' if abs(a)>10000 and abs(b)>10000 else 'project-local-metre'
            en=[to_en(a,b) for a,b in pts]; min_e=min(x for x,y in en); max_e=max(x for x,y in en); min_n=min(y for x,y in en); max_n=max(y for x,y in en)
            if max_e<target['min_e'] or min_e>target['max_e'] or max_n<target['min_n'] or min_n>target['max_n']: continue
            kept.append(f)
          if len(kept)<3: raise SystemExit(f'Impact gate failed: only {len(kept)} StreetSurface features intersect target')
          out={'schema':1,'format':'grand-bruxelles-urbis-street-surfaces-atomium-v1','source':'Paradigm UrbIS StreetSurfaces','source_layer':'urbisvector:StreetSurfaces','source_crs':'EPSG:31370','workspace_source_blob_sha':'773befce25bcf78357805571f7f2f8accf983e6a','workspace_source_feature_count':len(features),'workspace_coordinate_encoding_detected':detected,'filter':{'atomium_radius_bbox_m':radius,'bounds_epsg31370':target,'clipped_to_validated_dtm_bounds':True},'feature_count':len(kept),'features':kept}
          text=json.dumps(out,separators=(',',':'),ensure_ascii=False); out_path.parent.mkdir(parents=True,exist_ok=True); out_path.write_text(text)
          prov={'schema':1,'dataset':'Atomium StreetSurface current-main extraction','authority':'Paradigm / UrbIS','source_layer':'urbisvector:StreetSurfaces','crs':'EPSG:31370','source_workspace_branch':'zone-laeken-jette','source_workspace_blob_sha':'773befce25bcf78357805571f7f2f8accf983e6a','extraction_base_main_sha':'b588088aaf9aad9fd7ebc4f3635b4644a76ebe0a','license_note':'Preserve UrbIS/Paradigm source attribution; runtime geometry is source-bounded and no feature geometry is fabricated.','feature_count':len(kept),'subset_sha256':hashlib.sha256(text.encode()).hexdigest(),'runtime_approved':False,'realism_complete':False}
          prov_path.parent.mkdir(parents=True,exist_ok=True); prov_path.write_text(json.dumps(prov,indent=2,ensure_ascii=False)+'\n')
          print('ATOMIUM_STREETSURFACE_EXTRACT_OK', 'source=',len(features),'kept=',len(kept),'encoding=',detected,'bounds=',target,'sha256=',prov['subset_sha256'])
          PY
          rm grand-bruxelles-game/data/_scratch/atomium_street_surfaces_source.json
          rm .github/workflows/atomium-street-surface-extract-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data(laeken): extract Atomium StreetSurface subset"
          git push origin HEAD:integration/atomium-street-surface-extract-temp-v2
