name: One-shot Atomium player context patch

on:
  push:
    branches: ["integration/atomium-street-surface-context-current"]
    paths:
      - ".github/workflows/atomium-street-surface-patch-temp.yml"

permissions:
  contents: write

jobs:
  patch-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mount StreetSurface context in direct Atomium spawn
        run: |
          python3 - <<'PY'
          from pathlib import Path
          player=Path('grand-bruxelles-game/game/scripts/player_controller.gd')
          text=player.read_text()
          preload='const ATOMIUM_REFLECTION_SCRIPT := preload("res://game/zones/laeken_jette/atomium_hero_reflection_environment.gd")\n'
          if 'ATOMIUM_STREET_SURFACE_SCRIPT' not in text:
              if preload not in text: raise SystemExit('player preload marker missing')
              text=text.replace(preload,preload+'const ATOMIUM_STREET_SURFACE_SCRIPT := preload("res://game/zones/laeken_jette/atomium_street_surface_context.gd")\n',1)
          marker='''    if not bool(terrain.get("terrain_loaded")):\n        push_error("Atomium direct spawn: official DTM failed to load")\n        return\n\n    var hero := ATOMIUM_HERO_SCRIPT.new()\n'''
          replacement='''    if not bool(terrain.get("terrain_loaded")):\n        push_error("Atomium direct spawn: official DTM failed to load")\n        return\n\n    var street_context := ATOMIUM_STREET_SURFACE_SCRIPT.new()\n    street_context.name = "AtomiumDirectStreetSurfaceContext"\n    world.add_child(street_context)\n    if not bool(street_context.call("build_on_terrain", terrain)):\n        push_error("Atomium direct spawn: official StreetSurface context failed to build")\n        return\n\n    var hero := ATOMIUM_HERO_SCRIPT.new()\n'''
          if 'AtomiumDirectStreetSurfaceContext' not in text:
              if marker not in text: raise SystemExit('player Atomium terrain marker missing')
              text=text.replace(marker,replacement,1)
          player.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/game/scripts/player_controller.gd
          git commit -m "world(laeken): mount official Atomium StreetSurface context"
          git push origin HEAD:integration/atomium-street-surface-context-current
