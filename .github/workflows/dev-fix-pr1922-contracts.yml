# Triggered after workflow existed on branch; self-deletes after canonical fix.
name: DEV Fix PR1922 stale contracts and visibility ordering

on:
  push:
    branches:
      - env/tree-foliage-multimesh-reuse-c392d33
    paths:
      - .github/workflows/dev-fix-pr1922-contracts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair visibility ordering and migrate exact contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd')
          source = runtime.read_text(encoding='utf-8')
          old = '''    if instance == null:\n        instance = MultiMeshInstance3D.new()\n        instance.name = name_value\n        instance.set_meta("source_dimensions_measured", false)\n        add_child(instance)\n        _owned_batches.append(instance)\n    instance.multimesh = multimesh\n    instance.visible = _batches_visible\n'''
          new = '''    var is_new := instance == null\n    if is_new:\n        instance = MultiMeshInstance3D.new()\n        instance.name = name_value\n        instance.set_meta("source_dimensions_measured", false)\n    instance.multimesh = multimesh\n    instance.visible = _batches_visible\n    if is_new:\n        add_child(instance)\n        _owned_batches.append(instance)\n'''
          if source.count(old) != 1:
              raise SystemExit('expected exactly one current batch creation block')
          runtime.write_text(source.replace(old, new, 1), encoding='utf-8')

          row_test = Path('grand-bruxelles-game/game/tests/test_osm_environment_tree_lod_row_reuse_contract.py')
          body = row_test.read_text(encoding='utf-8')
          old_call = 'assert "_build_tree_foliage_batches(_rendered_trees, anchor)" in refresh_lod, ('
          new_call = 'assert "_build_tree_foliage_batches(_rendered_trees, anchor, true)" in refresh_lod, ('
          if body.count(old_call) != 1:
              raise SystemExit('expected one stale row-reuse call assertion')
          body = body.replace(old_call, new_call, 1)
          row_test.write_text(body, encoding='utf-8')

          visibility_test = Path('grand-bruxelles-game/game/tests/test_osm_environment_batch_visibility_cache_contract.py')
          body = visibility_test.read_text(encoding='utf-8')
          old_sig = 'batch_start = source.index("func _batch(name_value: String, mesh: Mesh, transforms: Array) -> void:")'
          new_sig = 'batch_start = source.index("func _batch(")'
          if body.count(old_sig) != 1:
              raise SystemExit('expected one stale batch signature lookup')
          body = body.replace(old_sig, new_sig, 1)
          visibility_test.write_text(body, encoding='utf-8')
          PY
          python3 grand-bruxelles-game/game/tests/test_osm_environment_tree_foliage_multimesh_reuse_contract.py
          python3 grand-bruxelles-game/game/tests/test_osm_environment_tree_lod_row_reuse_contract.py
          python3 grand-bruxelles-game/game/tests/test_osm_environment_batch_visibility_cache_contract.py

      - name: Commit canonical fix and remove dev workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dev-fix-pr1922-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd \
            grand-bruxelles-game/game/tests/test_osm_environment_tree_lod_row_reuse_contract.py \
            grand-bruxelles-game/game/tests/test_osm_environment_batch_visibility_cache_contract.py \
            .github/workflows/dev-fix-pr1922-contracts.yml
          git commit -m "fix(env): preserve batch visibility before tree insertion"
          git push origin HEAD:env/tree-foliage-multimesh-reuse-c392d33
