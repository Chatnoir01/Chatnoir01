name: Dev Tree Foliage Lobe Patcher

on:
  push:
    branches:
      - env/tree-foliage-lobe-allocation-6a0d066

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: env/tree-foliage-lobe-allocation-6a0d066
      - name: Apply allocation-free lobe emission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd')
          text = path.read_text()
          old = '''        var lobe_indices: Array = []
          if distance_sq <= full_detail_radius_sq:
              near_count += 1
              for index in range(BrusselsStreetTreeAsset.FOLIAGE_LOBE_COUNT):
                  lobe_indices.append(index)
          else:
              far_count += 1
              lobe_indices.assign(TREE_FAR_FOLIAGE_LOBE_INDICES)
          for index_variant in lobe_indices:
              var index := int(index_variant)
              var transform := BrusselsStreetTreeAsset.foliage_lobe_transform(base, osm_id, index)
              (light if BrusselsStreetTreeAsset.foliage_is_light(index) else dark).append(transform)
          '''
          new = '''        if distance_sq <= full_detail_radius_sq:
              near_count += 1
              for index in range(BrusselsStreetTreeAsset.FOLIAGE_LOBE_COUNT):
                  var transform := BrusselsStreetTreeAsset.foliage_lobe_transform(base, osm_id, index)
                  (light if BrusselsStreetTreeAsset.foliage_is_light(index) else dark).append(transform)
          else:
              far_count += 1
              for index_variant in TREE_FAR_FOLIAGE_LOBE_INDICES:
                  var index := int(index_variant)
                  var transform := BrusselsStreetTreeAsset.foliage_lobe_transform(base, osm_id, index)
                  (light if BrusselsStreetTreeAsset.foliage_is_light(index) else dark).append(transform)
          '''
          if old not in text:
              raise SystemExit('expected foliage allocation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run causal regression contract
        run: python3 grand-bruxelles-game/game/tests/test_osm_environment_tree_foliage_lobe_allocation_contract.py
      - name: Remove development patcher and commit canonical runtime
        run: |
          rm .github/workflows/dev-tree-foliage-lobe-patcher.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd .github/workflows/dev-tree-foliage-lobe-patcher.yml
          git commit -m 'perf(env): emit tree foliage lobes without transient arrays'
          git push origin HEAD:env/tree-foliage-lobe-allocation-6a0d066
