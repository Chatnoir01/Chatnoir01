name: DEV Apply Tree Foliage MultiMesh Reuse

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/dev/apply_tree_foliage_multimesh_reuse.py'
      - '.github/workflows/dev-tree-foliage-multimesh-reuse-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'env/tree-foliage-multimesh-reuse-3eb18be'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: env/tree-foliage-multimesh-reuse-3eb18be
          fetch-depth: 0
      - name: Apply exact runtime patch
        run: python3 grand-bruxelles-game/tools/dev/apply_tree_foliage_multimesh_reuse.py
      - name: Run regression contract
        run: python3 grand-bruxelles-game/game/tests/test_osm_environment_tree_foliage_multimesh_reuse_contract.py
      - name: Remove development-only patcher
        run: git rm grand-bruxelles-game/tools/dev/apply_tree_foliage_multimesh_reuse.py .github/workflows/dev-tree-foliage-multimesh-reuse-apply.yml
      - name: Commit canonical runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd
          git commit -m "perf(env): reuse tree foliage MultiMesh across LOD refresh"
          git push origin HEAD:env/tree-foliage-multimesh-reuse-3eb18be
