name: Discover Brussels open-data boundaries

on:
  push:
    branches: [zone-reste-bruxelles]
    paths:
      - '.github/workflows/discover-brussels-opendata-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-brussels-opendata-boundaries
  cancel-in-progress: true

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zone-reste-bruxelles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test discovery logic
        working-directory: grand-bruxelles-game
        run: python -m unittest tests.test_discover_brussels_opendata_boundaries -v

      - name: Search official Brussels open-data catalog
        working-directory: grand-bruxelles-game
        run: |
          python tools/discover_brussels_opendata_boundaries.py \
            --output data/processed/brussels_city_remaining/opendata_boundary_candidates.json

      - name: Validate evidence-only candidate manifest
        working-directory: grand-bruxelles-game
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/processed/brussels_city_remaining/opendata_boundary_candidates.json')
          d=json.loads(p.read_text())
          assert d['format']=='grand-bruxelles-opendata-boundary-discovery-v1'
          assert d['source'].startswith('https://opendata.brussels.be/')
          assert d['candidate_count']==len(d['candidates'])
          assert d['candidate_count']>0
          assert 'no candidate is production-approved' in d['purpose']
          assert all(item['dataset_id'] for item in d['candidates'])
          print('Candidate datasets:',d['candidate_count'])
          for item in d['candidates'][:30]:
              print(item['dataset_id'],'|',item['title'],'|',item['matched_terms'],'| records=',item['records_count'])
          PY

      - name: Commit catalog discovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grand-bruxelles-game/data/processed/brussels_city_remaining/opendata_boundary_candidates.json
          if git diff --cached --quiet; then
            echo 'Open-data candidate manifest unchanged.'
            exit 0
          fi
          git commit -m 'data: discover official Brussels boundary datasets'
          git pull --rebase origin zone-reste-bruxelles
          git push origin HEAD:zone-reste-bruxelles
