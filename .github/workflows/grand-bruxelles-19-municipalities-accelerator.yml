name: Grand Bruxelles 19 Municipalities Accelerator

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/grand-bruxelles-19-municipalities-accelerator.yml"
      - "grand-bruxelles-game/tools/citygen/test_regional_acceleration_contract.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_municipality_balance.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_source_completeness.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_regional_source_contract.py"
      - "grand-bruxelles-game/tools/citygen/bootstrap_cell_maturity.py"
      - "grand-bruxelles-game/tools/citygen/autonomous_citygen.py"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-19-municipalities-accelerator.yml"
      - "grand-bruxelles-game/tools/citygen/test_regional_acceleration_contract.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_municipality_balance.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_source_completeness.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen_regional_source_contract.py"
      - "grand-bruxelles-game/tools/citygen/bootstrap_cell_maturity.py"
      - "grand-bruxelles-game/tools/citygen/build_brussels_regional_grid.py"
      - "grand-bruxelles-game/tools/citygen/autonomous_citygen.py"
      - ".github/workflows/grand-bruxelles-autonomous-citygen.yml"
      - ".github/workflows/grand-bruxelles-citygen-source-repair-frontier.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: grand-bruxelles-19-municipalities-accelerator
  cancel-in-progress: false

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 19-municipality acceleration contract
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_regional_acceleration_contract.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_municipality_balance.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_source_completeness.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_regional_source_contract.py

  dispatch-regional-citygen:
    if: github.event_name != 'pull_request'
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch governed source repair frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/grand-bruxelles-citygen-source-repair-frontier.yml/dispatches" \
            -f ref=main
          echo "REGIONAL_SOURCE_REPAIR_DISPATCH_OK batch=32 writer_lock=shared chained_citygen=true promotion_bypass=false"
