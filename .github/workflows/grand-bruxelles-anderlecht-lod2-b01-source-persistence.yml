name: Grand Bruxelles Anderlecht LoD2 B01 Source Registry

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/materialize_urbis_lod2_source_batch.py"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B01.manifest.json"
      - ".github/workflows/grand-bruxelles-anderlecht-lod2-b01-source-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source reader dependencies
        run: python -m pip install --disable-pip-version-check pyshp shapely

      - name: Regenerate immutable B01 directly from official UrbIS source
        run: |
          python grand-bruxelles-game/tools/materialize_urbis_lod2_source_batch.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --registry grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B01.manifest.json \
            --output "$RUNNER_TEMP/anderlecht_E145500_N169000_B01.source.ndjson" \
            --report "$RUNNER_TEMP/anderlecht_E145500_N169000_B01.materialization.json"

      - name: Prove registry reproduces the exact source batch
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("grand-bruxelles-game")
          manifest = json.loads((
              root / "data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B01.manifest.json"
          ).read_text())
          generated_path = Path(os.environ["RUNNER_TEMP"]) / "anderlecht_E145500_N169000_B01.source.ndjson"
          report_path = Path(os.environ["RUNNER_TEMP"]) / "anderlecht_E145500_N169000_B01.materialization.json"
          generated = generated_path.read_bytes()
          report = json.loads(report_path.read_text())
          sha = lambda payload: hashlib.sha256(payload).hexdigest()

          assert manifest["schema"] == "grand-bruxelles-urbis-lod2-source-batch-registry-v2"
          assert manifest["storage_policy"] == "regenerate_from_locked_official_source"
          assert manifest["runtime_authorized"] is False
          assert manifest["runtime_mount_authorized"] is False
          assert manifest["collision_authorized"] is False
          assert manifest["geometry_modified"] is False
          assert report["runtime_authorized"] is False
          assert report["runtime_mount_authorized"] is False
          assert report["geometry_modified"] is False

          expected_source = manifest["source"]
          actual_source = report["source"]
          assert actual_source["revision"] == expected_source["revision"]
          assert actual_source["package_sha256"] == expected_source["package_sha256"]
          assert actual_source["building_solids_shp_sha256"] == expected_source["building_solids_shp_sha256"]
          assert actual_source["building_solids_dbf_sha256"] == expected_source["building_solids_dbf_sha256"]
          assert actual_source["building_faces_shp_sha256"] == expected_source["building_faces_shp_sha256"]
          assert actual_source["building_faces_dbf_sha256"] == expected_source["building_faces_dbf_sha256"]

          expected_selection = manifest["selection"]
          owner_ids = expected_selection["owner_ids"]
          assert len(owner_ids) == expected_selection["owner_count"] == 250
          assert len(owner_ids) == len(set(owner_ids))
          assert owner_ids == sorted(owner_ids, key=int)
          assert owner_ids[0] == expected_selection["first_building_id"]
          assert owner_ids[-1] == expected_selection["last_building_id"]
          owner_digest = sha(("\n".join(owner_ids) + "\n").encode())
          assert owner_digest == expected_selection["selected_owner_ids_sha256"]

          actual_selection = report["selection"]
          for key in [
              "owner_count", "solid_count", "face_count", "point_count", "part_count",
              "first_building_id", "last_building_id", "selected_owner_ids_sha256",
              "face_type_counts",
          ]:
              assert actual_selection[key] == expected_selection[key], (key, actual_selection[key], expected_selection[key])

          payload = manifest["generated_payload"]
          assert payload["artifact_only"] is True
          assert len(generated) == payload["bytes"]
          assert sha(generated) == payload["sha256"]
          assert report["output"]["bytes"] == payload["bytes"]
          assert report["output"]["sha256"] == payload["sha256"]
          assert expected_selection["face_type_counts"] == {
              "GROUNDSURFACE": 251,
              "OUTERCEILING": 1,
              "ROOFSURFACE": 1095,
              "WALLSURFACE": 2848,
          }

          print(
              "ANDERLECHT_LOD2_B01_SOURCE_REGISTRY_OK: "
              f"owners={expected_selection['owner_count']} solids={expected_selection['solid_count']} "
              f"faces={expected_selection['face_count']} bytes={len(generated)} "
              f"sha256={payload['sha256']}"
          )
          PY

      - name: Publish source registry summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path(
              "grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B01.manifest.json"
          ).read_text())
          s = manifest["selection"]
          p = manifest["generated_payload"]
          lines = [
              "## Anderlecht B01 immutable official LoD2 source registry",
              "",
              f"- Locked owners: **{len(s['owner_ids']):,}**",
              f"- Solids: **{s['solid_count']:,}**",
              f"- Faces: **{s['face_count']:,}**",
              f"- Points: **{s['point_count']:,}**",
              f"- Reproduced source payload: **{p['bytes']:,} bytes**",
              f"- Source SHA-256: `{p['sha256']}`",
              "",
              "Registry/materializer only — runtime/collision/mount authorization remains false.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload regenerated source proof
        uses: actions/upload-artifact@v4
        with:
          name: anderlecht-e145500-n169000-b01-source-registry-proof
          path: |
            ${{ runner.temp }}/anderlecht_E145500_N169000_B01.source.ndjson
            ${{ runner.temp }}/anderlecht_E145500_N169000_B01.materialization.json
          if-no-files-found: error
