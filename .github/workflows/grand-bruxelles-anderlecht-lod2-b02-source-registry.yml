name: Grand Bruxelles Anderlecht LoD2 B02 Source Registry

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/region_lod2_batches/anderlecht_E145500_N169000_B02.contract.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B02.manifest.json"
      - ".github/workflows/grand-bruxelles-anderlecht-lod2-b02-source-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source reader dependencies
        run: python -m pip install --disable-pip-version-check pyshp shapely

      - name: Regenerate immutable B02 from official UrbIS source
        run: |
          python grand-bruxelles-game/tools/materialize_urbis_lod2_source_batch.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --registry grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B02.manifest.json \
            --output "$RUNNER_TEMP/anderlecht_E145500_N169000_B02.source.ndjson" \
            --report "$RUNNER_TEMP/anderlecht_E145500_N169000_B02.materialization.json"

      - name: Require exact locked B02 reproduction
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          registry = json.loads(Path(
              "grand-bruxelles-game/data/urbis/remaining_brussels/lod2_source_batches/anderlecht_E145500_N169000_B02.manifest.json"
          ).read_text())
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "anderlecht_E145500_N169000_B02.materialization.json").read_text())

          assert registry["runtime_authorized"] is False
          assert registry["runtime_mount_authorized"] is False
          assert registry["collision_authorized"] is False
          assert registry["geometry_modified"] is False
          assert report["runtime_authorized"] is False
          assert report["runtime_mount_authorized"] is False
          assert report["geometry_modified"] is False

          for key in [
              "revision", "package_sha256", "building_solids_shp_sha256",
              "building_solids_dbf_sha256", "building_faces_shp_sha256",
              "building_faces_dbf_sha256",
          ]:
              assert report["source"][key] == registry["source"][key], key

          for key in [
              "owner_count", "solid_count", "face_count", "point_count", "part_count",
              "first_building_id", "last_building_id", "selected_owner_ids_sha256",
              "face_type_counts",
          ]:
              assert report["selection"][key] == registry["selection"][key], key

          assert report["output"]["bytes"] == registry["generated_payload"]["bytes"]
          assert report["output"]["sha256"] == registry["generated_payload"]["sha256"]
          print(
              "ANDERLECHT_LOD2_B02_SOURCE_REGISTRY_OK: "
              f"owners={report['selection']['owner_count']} solids={report['selection']['solid_count']} "
              f"faces={report['selection']['face_count']} bytes={report['output']['bytes']} "
              f"sha256={report['output']['sha256']}"
          )
          PY

      - name: Upload B02 deterministic proof
        uses: actions/upload-artifact@v4
        with:
          name: anderlecht-e145500-n169000-b02-source-registry-proof
          path: |
            ${{ runner.temp }}/anderlecht_E145500_N169000_B02.source.ndjson
            ${{ runner.temp }}/anderlecht_E145500_N169000_B02.materialization.json
          if-no-files-found: error
