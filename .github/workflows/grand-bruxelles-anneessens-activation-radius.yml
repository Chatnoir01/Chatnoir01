name: Grand Bruxelles Anneessens Activation Radius

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-activation-radius.yml"
      - "grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_osm_activation_radius_contract_test.gd"
      - "grand-bruxelles-game/game/tests/anneessens_osm_lazy_activation_build_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-radius-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact PR head and base ancestry
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$EXPECTED_BASE"
          test "$(git merge-base HEAD FETCH_HEAD)" = "$EXPECTED_BASE"
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-activation-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-activation-import.log; then exit 1; fi
      - name: Prove frozen activation radius fails closed
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_osm_activation_radius_contract_test.gd 2>&1 | tee /tmp/anneessens-activation-radius.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_OSM_ACTIVATION_RADIUS_FAIL" /tmp/anneessens-activation-radius.log; then exit 1; fi
          grep -q "ANNEESSENS_OSM_ACTIVATION_RADIUS_OK" /tmp/anneessens-activation-radius.log
      - name: Prove far players do not allocate Anneessens furniture
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_osm_lazy_activation_build_test.gd 2>&1 | tee /tmp/anneessens-lazy-activation.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_OSM_LAZY_ACTIVATION_FAIL" /tmp/anneessens-lazy-activation.log; then exit 1; fi
          grep -q "ANNEESSENS_OSM_LAZY_ACTIVATION_OK" /tmp/anneessens-lazy-activation.log
