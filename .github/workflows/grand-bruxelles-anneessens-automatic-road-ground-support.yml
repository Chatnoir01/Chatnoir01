name: Grand Bruxelles Anneessens Automatic Road Ground Support

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/game/tests/anneessens_automatic_road_ground_support_test.gd"
      - ".github/workflows/grand-bruxelles-anneessens-automatic-road-ground-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-ground-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry and exact checked-out head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "checked_out_head=$checked_out_head"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
          printf 'ANNEESSENS_VALIDATED_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'ANNEESSENS_VALIDATED_HEAD_SHA=%s\n' "$checked_out_head" >> "$GITHUB_ENV"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          rm -rf /tmp/godot /tmp/godot.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          godot_version="$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version)"
          printf '%s\n' "$godot_version" | grep -E '^4\.7\.1\.stable\.'
          printf 'ANNEESSENS_GODOT_VERSION=%s\n' "$godot_version" >> "$GITHUB_ENV"
          printf 'ANNEESSENS_GODOT_ZIP_SHA256=%s\n' "$GODOT_ZIP_SHA256" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-ground-support-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-ground-support-import.log; then exit 1; fi
      - name: Prove exact support collider below automatic Anneessens spawn
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/anneessens-ground-support.log
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_automatic_road_ground_support_test.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_AUTOMATIC_ROAD_GROUND_SUPPORT_FAIL" "$log"; then exit 1; fi
          grep -q "ANNEESSENS_AUTOMATIC_ROAD_GROUND_SUPPORT_GREEN" "$log"
      - name: Seal exact support proof identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          current_head="$(git rev-parse HEAD)"
          test "$current_main" = "$ANNEESSENS_VALIDATED_BASE_SHA"
          test "$current_head" = "$ANNEESSENS_VALIDATED_HEAD_SHA"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          log = pathlib.Path('/tmp/anneessens-ground-support.log')
          imp = pathlib.Path('/tmp/anneessens-ground-support-import.log')
          receipt = {
              'schema': 'grand-bruxelles-anneessens-ground-support-proof-v1',
              'base_sha': os.environ['ANNEESSENS_VALIDATED_BASE_SHA'],
              'head_sha': os.environ['ANNEESSENS_VALIDATED_HEAD_SHA'],
              'godot_version': os.environ['ANNEESSENS_GODOT_VERSION'],
              'godot_zip_sha256': os.environ['ANNEESSENS_GODOT_ZIP_SHA256'],
              'runtime_log_sha256': hashlib.sha256(log.read_bytes()).hexdigest(),
              'import_log_sha256': hashlib.sha256(imp.read_bytes()).hexdigest(),
              'destination_advertisable': False,
              'jouable_authorized': False,
          }
          pathlib.Path('/tmp/anneessens-ground-support-proof.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          cat /tmp/anneessens-ground-support-proof.json
      - name: Upload exact support proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anneessens-automatic-road-ground-support
          path: |
            /tmp/anneessens-ground-support.log
            /tmp/anneessens-ground-support-import.log
            /tmp/anneessens-ground-support-proof.json
          if-no-files-found: error
