name: Grand Bruxelles Anneessens Automatic Road Ground Support

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/game/tests/anneessens_automatic_road_ground_support_test.gd"
      - ".github/workflows/grand-bruxelles-anneessens-automatic-road-ground-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-ground-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-ground-support-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-ground-support-import.log; then exit 1; fi
      - name: Prove exact support collider below automatic Anneessens spawn
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/anneessens-ground-support.log
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_automatic_road_ground_support_test.gd 2>&1 | tee "$log"
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_AUTOMATIC_ROAD_GROUND_SUPPORT_FAIL" "$log"; then exit 1; fi
          grep -q "ANNEESSENS_AUTOMATIC_ROAD_GROUND_SUPPORT_GREEN" "$log"
      - name: Upload exact support proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anneessens-automatic-road-ground-support
          path: |
            /tmp/anneessens-ground-support.log
            /tmp/anneessens-ground-support-import.log
          if-no-files-found: error
