name: Grand Bruxelles Anneessens Automatic Road Player Witness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_automatic_road_direct_spawn_witness_test.gd"
      - "grand-bruxelles-game/game/tests/anneessens_automatic_road_player_witness_contract_test.py"
      - "grand-bruxelles-game/game/tests/validate_anneessens_player_witness_evidence.py"
      - "grand-bruxelles-game/game/tests/test_validate_anneessens_player_witness_evidence.py"
      - "grand-bruxelles-game/game/tests/validate_anneessens_trace_samples.py"
      - "grand-bruxelles-game/game/tests/test_anneessens_trace_sample_contract.py"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-anneessens-automatic-road-player-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require branch built from live main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          printf '%s\n' "$live_main" > /tmp/anneessens-live-main-sha
          printf '%s\n' "$PR_HEAD_SHA" > /tmp/anneessens-pr-head-sha
          test "$merge_base" = "$live_main"
      - name: Prove Anneessens witness contract
        run: |
          python3 grand-bruxelles-game/game/tests/anneessens_automatic_road_player_witness_contract_test.py
          python3 grand-bruxelles-game/game/tests/test_validate_anneessens_player_witness_evidence.py
          python3 grand-bruxelles-game/game/tests/test_anneessens_trace_sample_contract.py
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-auto-road-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-auto-road-import.log; then exit 1; fi
      - name: Capture source-backed Anneessens road-1382734012 player witness
        run: |
          set -o pipefail
          log=/tmp/anneessens-auto-road-player-witness.log
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_automatic_road_direct_spawn_witness_test.gd 2>&1 | tee "$log"
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_AUTOMATIC_ROAD_PLAYER_WITNESS_FAIL" "$log"; then exit 1; fi
          grep -q "ANNEESSENS_AUTOMATIC_ROAD_PLAYER_WITNESS_GREEN" "$log"

          python3 grand-bruxelles-game/game/tests/validate_anneessens_trace_samples.py "$log"
          trace_count="$(grep -c 'ANNEESSENS_VISUAL_BLOCKER_TRACE: sample=' "$log" || true)"
          building_hits="$(grep -c 'ANNEESSENS_VISUAL_BLOCKER_TRACE: .*hit=true .*collider_name=Building_' "$log" || true)"
          echo "anneessens_trace_count=$trace_count building_hits=$building_hits"
          test "$trace_count" -eq 3
          if [[ "$building_hits" -ge 1 && "$building_hits" -le 2 ]]; then
            echo "ANNEESSENS_VISUAL_REVIEW_REQUIRED: candidate_meets_frozen_ray_rule=true building_hits=$building_hits"
          else
            echo "ANNEESSENS_VISUAL_REVIEW_REQUIRED: candidate_meets_frozen_ray_rule=false building_hits=$building_hits human_reject_preserved=true"
          fi
      - name: Stage exact Anneessens player-view evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          png="grand-bruxelles-game/artifacts/visual/automatic_road_1382734012_player.png"
          log="/tmp/anneessens-auto-road-player-witness.log"
          source="grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
          stage="/tmp/anneessens-auto-road-player-evidence"
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$log" "$stage/runtime.log" 2>/dev/null || true
          if [[ -s "$png" ]]; then
            python3 - "$png" <<'PY'
          import struct, sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              assert f.read(8)==b'\x89PNG\r\n\x1a\n'
              n=struct.unpack('>I',f.read(4))[0]; kind=f.read(4)
              assert n==13 and kind==b'IHDR'
              w,h=struct.unpack('>II',f.read(8))
          assert (w,h)==(1280,720), (w,h)
          print('ANNEESSENS_AUTOMATIC_ROAD_PLAYER_FRAME_OK', w, h)
          PY
            cp "$png" "$stage/automatic_road_1382734012_player.png"
          fi

          if [[ ! -s /tmp/anneessens-live-main-sha ]]; then
            git fetch --no-tags origin main
            git rev-parse origin/main > /tmp/anneessens-live-main-sha
          fi
          if [[ ! -s /tmp/anneessens-pr-head-sha ]]; then
            git rev-parse HEAD > /tmp/anneessens-pr-head-sha
          fi

          python3 - "$log" "$source" "$stage/evidence-manifest.json" "$(cat /tmp/anneessens-pr-head-sha)" "$(cat /tmp/anneessens-live-main-sha)" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path

          log_path, source_path, out_path, pr_head_sha, live_main_sha = sys.argv[1:]
          out_path = Path(out_path)
          stage = out_path.parent
          frame_path = stage / 'automatic_road_1382734012_player.png'
          runtime_log_path = stage / 'runtime.log'
          log = Path(log_path).read_text(encoding='utf-8', errors='replace') if Path(log_path).exists() else ''
          source_bytes = Path(source_path).read_bytes()
          traces = re.findall(r'ANNEESSENS_VISUAL_BLOCKER_TRACE: sample=\([^\n]+', log)
          building_hits = sum('hit=true' in row and 'collider_name=Building_' in row for row in traces)
          source_match = re.search(r'source_sha=([0-9a-f]{64})', log)
          computed_source_sha = hashlib.sha256(source_bytes).hexdigest()
          emitted_source_sha = source_match.group(1) if source_match else None
          source_sha_matches = emitted_source_sha == computed_source_sha
          visual_acceptance = len(traces) == 3 and 1 <= building_hits <= 2 and source_sha_matches
          frame_sha = hashlib.sha256(frame_path.read_bytes()).hexdigest() if frame_path.is_file() else None
          runtime_log_sha = hashlib.sha256(runtime_log_path.read_bytes()).hexdigest() if runtime_log_path.is_file() else None
          payload = {
              "schema": "grand-bruxelles-anneessens-player-witness-v1",
              "road_osm_id": 1382734012,
              "pr_head_sha": pr_head_sha,
              "live_main_sha": live_main_sha,
              "source_path": "grand-bruxelles-game/data/osm/vertical_slice_01.game.json",
              "source_sha256": computed_source_sha,
              "emitted_source_sha256": emitted_source_sha,
              "source_sha_matches": source_sha_matches,
              "trace_count": len(traces),
              "building_hits": building_hits,
              "visual_acceptance": visual_acceptance,
              "destination_advertisable": False,
              "jouable_authorized": False,
              "human_review_required": True,
              "frame_width": 1280,
              "frame_height": 720,
              "frame_sha256": frame_sha,
              "runtime_log_sha256": runtime_log_sha,
          }
          out_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('ANNEESSENS_WITNESS_MANIFEST_WRITTEN', json.dumps(payload, sort_keys=True))
          PY

          cd "$stage"
          find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt
      - name: Validate exact staged Anneessens evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/validate_anneessens_trace_samples.py \
            /tmp/anneessens-auto-road-player-evidence/runtime.log
          python3 grand-bruxelles-game/game/tests/validate_anneessens_player_witness_evidence.py \
            /tmp/anneessens-auto-road-player-evidence \
            "$(cat /tmp/anneessens-pr-head-sha)" \
            "$(cat /tmp/anneessens-live-main-sha)"
      - name: Upload exact Anneessens player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-1382734012-player-witness
          path: /tmp/anneessens-auto-road-player-evidence/
          if-no-files-found: error
