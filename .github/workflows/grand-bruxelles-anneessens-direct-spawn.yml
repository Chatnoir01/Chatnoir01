name: Grand Bruxelles Anneessens Direct Spawn

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/direct_spawn_presentation.gd"
      - "grand-bruxelles-game/game/tests/anneessens_direct_spawn_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - ".github/workflows/grand-bruxelles-anneessens-direct-spawn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-direct-spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed Anneessens direct entry
        run: |
          mkdir -p grand-bruxelles-game/artifacts/anneessens
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/anneessens_direct_spawn_test.gd
      - name: Upload player witness
        uses: actions/upload-artifact@v4
        with:
          name: anneessens-direct-spawn-witness
          path: grand-bruxelles-game/artifacts/anneessens/anneessens_direct_spawn.png
          if-no-files-found: error
          retention-days: 30
