name: Grand Bruxelles Anneessens Footprint Detail Zone

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/tests/osm_city_builder_anneessens_footprint_detail_zone_test.gd"
      - "grand-bruxelles-game/game/tests/test_anneessens_footprint_detail_zone_project_root_contract.py"
      - ".github/workflows/grand-bruxelles-anneessens-footprint-detail-zone.yml"

permissions:
  contents: read

jobs:
  anneessens-footprint-detail-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require branch built from live main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Lock Godot project-root preload contract
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/test_anneessens_footprint_detail_zone_project_root_contract.py
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.7.1-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      - name: Import project scripts and resources
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path grand-bruxelles-game/game --editor --quit-after 600
      - name: Prove Anneessens footprint-edge facade detail continuity
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path grand-bruxelles-game/game --script res://tests/osm_city_builder_anneessens_footprint_detail_zone_test.gd