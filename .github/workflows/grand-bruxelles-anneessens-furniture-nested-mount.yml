name: Grand Bruxelles Anneessens Furniture Nested Mount

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd'
      - 'grand-bruxelles-game/game/tests/anneessens_osm_furniture_nested_mount_test.gd'
      - '.github/workflows/grand-bruxelles-anneessens-furniture-nested-mount.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-furniture-nested-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: Anneessens nested-mount witness checked out stale/merge ref" >&2
            exit 1
          }
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-furniture-nested-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/anneessens-furniture-nested-import.log
      - name: Validate dormant absence then nested Main binding
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/anneessens_osm_furniture_nested_mount_test.gd 2>&1 | tee /tmp/anneessens-furniture-nested.log
          grep -q 'ANNEESSENS_OSM_FURNITURE_NESTED_MOUNT_OK' /tmp/anneessens-furniture-nested.log
