name: Grand Bruxelles Anneessens Godot Import Diagnostic

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/tests/test_anneessens_midi_sidewalk_*.py"
      - ".github/workflows/grand-bruxelles-anneessens-import-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-import-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import exact project and expose parser diagnostics
        id: godot_import
        shell: bash
        run: |
          set -uo pipefail
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          godot_rc=${PIPESTATUS[0]}
          set -e
          echo "godot_import_exit_code=${godot_rc}"
          echo "--- Godot import diagnostics ---"
          grep -nE "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script|Warning treated as error|anneessens_midi_sidewalk_runtime" /tmp/godot-import.log || true
          echo "--- End diagnostics ---"
          {
            echo "## Godot 4.7.1 import diagnostics"
            echo
            echo "Exact head: \`$(git rev-parse HEAD)\`"
            echo "Exit code: \`${godot_rc}\`"
            echo
            echo '```text'
            grep -nE "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script|Warning treated as error|anneessens_midi_sidewalk_runtime" /tmp/godot-import.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=${godot_rc}" >> "$GITHUB_OUTPUT"
          if [ "${godot_rc}" -ne 0 ]; then
            exit "${godot_rc}"
          fi
          if grep -qE "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi
      - name: Upload exact-head Godot import log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anneessens-godot-import-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/godot-import.log
          if-no-files-found: error
          retention-days: 7
