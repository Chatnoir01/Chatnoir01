name: Grand Bruxelles Anneessens Midi Sidewalk Teardown

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_teardown_contract_test.py"
      - ".github/workflows/grand-bruxelles-anneessens-midi-sidewalk-teardown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teardown-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Confirm pull-request base lacks teardown guard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd" > /tmp/anneessens-midi-sidewalk-base.gd
          if grep -Fq 'if parent != null and not _tearing_down:' /tmp/anneessens-midi-sidewalk-base.gd; then
            echo 'Base already contains teardown guard; this lot must be rebuilt/re-scoped.' >&2
            exit 1
          fi
          echo 'RED base confirmed: teardown guard absent.'
      - name: Prove Anneessens Midi sidewalk teardown ownership contract
        run: |
          python - <<'PY'
          import runpy
          ns = runpy.run_path('grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_teardown_contract_test.py')
          ns['test_sidewalk_owned_root_never_detaches_synchronously_during_exit_tree']()
          print('GREEN: Anneessens Midi sidewalk teardown contract holds')
          PY
