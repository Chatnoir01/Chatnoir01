name: Grand Bruxelles Anneessens Midi Sidewalk

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-midi-sidewalk.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact current main ancestry and checked-out head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          readonly GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          readonly GODOT_SHA256="c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          curl --fail --location --retry 3 --retry-delay 3 --proto '=https' --tlsv1.2 -o /tmp/godot.zip "$GODOT_URL"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-sidewalk-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-sidewalk-import.log; then exit 1; fi
      - name: Anneessens 1280x720 player-eye toggle witness
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_midi_sidewalk_witness_test.gd 2>&1 | tee /tmp/anneessens-sidewalk.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_MIDI_SIDEWALK_FAIL" /tmp/anneessens-sidewalk.log; then exit 1; fi
          grep -q "ANNEESSENS_MIDI_SIDEWALK_OK" /tmp/anneessens-sidewalk.log
      - name: Require and stage complete evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          readonly BEFORE="grand-bruxelles-game/artifacts/visual/anneessens_sidewalk_before.png"
          readonly AFTER="grand-bruxelles-game/artifacts/visual/anneessens_sidewalk_after.png"
          readonly BUNDLE="$RUNNER_TEMP/anneessens-midi-sidewalk-evidence"
          test -s "$BEFORE"
          test -s "$AFTER"
          test -s /tmp/anneessens-sidewalk.log
          test -s /tmp/anneessens-sidewalk-import.log
          file "$BEFORE" | grep -q 'PNG image data, 1280 x 720'
          file "$AFTER" | grep -q 'PNG image data, 1280 x 720'
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE"
          cp "$BEFORE" "$BUNDLE/anneessens_sidewalk_before.png"
          cp "$AFTER" "$BUNDLE/anneessens_sidewalk_after.png"
          cp /tmp/anneessens-sidewalk.log "$BUNDLE/anneessens-sidewalk.log"
          cp /tmp/anneessens-sidewalk-import.log "$BUNDLE/anneessens-sidewalk-import.log"
          (
            cd "$BUNDLE"
            sha256sum anneessens_sidewalk_before.png anneessens_sidewalk_after.png anneessens-sidewalk.log anneessens-sidewalk-import.log > anneessens-sidewalk-evidence.sha256
            sha256sum --check --strict anneessens-sidewalk-evidence.sha256
            test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          )
      - name: Upload Anneessens evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anneessens-midi-sidewalk-evidence
          path: ${{ runner.temp }}/anneessens-midi-sidewalk-evidence/
          if-no-files-found: error
