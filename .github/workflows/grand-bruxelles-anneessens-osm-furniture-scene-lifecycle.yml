name: Grand Bruxelles Anneessens OSM Furniture Scene Lifecycle

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd'
      - 'grand-bruxelles-game/tests/test_anneessens_osm_furniture_scene_lifecycle.py'
      - '.github/workflows/grand-bruxelles-anneessens-osm-furniture-scene-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run Anneessens furniture lifecycle regression
        working-directory: grand-bruxelles-game
        run: python -m pytest -q tests/test_anneessens_osm_furniture_scene_lifecycle.py
