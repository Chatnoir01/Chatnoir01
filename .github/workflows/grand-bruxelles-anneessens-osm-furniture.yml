name: Grand Bruxelles Anneessens OSM Furniture

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-osm-furniture.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/osm/anneessens_environment_points.game.json"
      - "grand-bruxelles-game/data/osm/zones/anneessens/environment.game.json"
      - "grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_tree_asset.gd"
      - "grand-bruxelles-game/game/tests/anneessens_osm_furniture_test.gd"
      - "grand-bruxelles-game/game/tests/anneessens_osm_furniture_player_loss_test.gd"
      - "grand-bruxelles-game/game/tests/anneessens_street_tree_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  furniture-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact PR head and base ancestry
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$EXPECTED_BASE"
          test "$(git merge-base HEAD FETCH_HEAD)" = "$EXPECTED_BASE"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-furniture-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-furniture-import.log; then exit 1; fi
      - name: Validate source-backed furniture runtime
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_osm_furniture_test.gd 2>&1 | tee /tmp/anneessens-furniture-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_OSM_FURNITURE_FAIL" /tmp/anneessens-furniture-runtime.log; then exit 1; fi
          grep -q "ANNEESSENS_OSM_FURNITURE_OK" /tmp/anneessens-furniture-runtime.log
      - name: Prove fail-closed Player-anchor lifecycle
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_osm_furniture_player_loss_test.gd 2>&1 | tee /tmp/anneessens-furniture-player-loss.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_OSM_FURNITURE_PLAYER_LOSS_FAIL|Condition \"!is_inside_tree\(\)\" is true" /tmp/anneessens-furniture-player-loss.log; then exit 1; fi
          grep -q "ANNEESSENS_OSM_FURNITURE_PLAYER_LOSS_OK" /tmp/anneessens-furniture-player-loss.log
      - name: Anneessens 1280x720 street-tree player A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_street_tree_witness_test.gd 2>&1 | tee /tmp/anneessens-tree-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_STREET_TREE_FAIL|Parent node is busy adding/removing children" /tmp/anneessens-tree-visual.log; then exit 1; fi
          grep -q "ANNEESSENS_STREET_TREE_OK" /tmp/anneessens-tree-visual.log
      - name: Upload Anneessens street-tree evidence
        uses: actions/upload-artifact@v4
        with:
          name: anneessens-street-tree-ab
          path: |
            grand-bruxelles-game/artifacts/visual/anneessens_tree_before.png
            grand-bruxelles-game/artifacts/visual/anneessens_tree_after.png
          if-no-files-found: error
