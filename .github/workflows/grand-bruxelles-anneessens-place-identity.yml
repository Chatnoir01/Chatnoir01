name: Grand Bruxelles Anneessens Place Identity

on:
  push:
    branches: ["visual-centre/anneessens-place-identity-d6c62135"]
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-place-identity.yml"
      - "grand-bruxelles-game/tools/fetch_urbis_anneessens_place.py"
      - "grand-bruxelles-game/data/urbis/anneessens/**"
      - "grand-bruxelles-game/game/scripts/anneessens_place_identity.gd"
      - "grand-bruxelles-game/game/tests/anneessens_place_identity*.gd"
      - "grand-bruxelles-game/project.godot"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official Anneessens surface
        working-directory: grand-bruxelles-game
        run: |
          python3 -m py_compile tools/fetch_urbis_anneessens_place.py
          python3 tools/fetch_urbis_anneessens_place.py
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Run production identity contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_place_identity_test.gd 2>&1 | tee /tmp/anneessens-place-identity.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_PLACE_IDENTITY_FAIL" /tmp/anneessens-place-identity.log; then exit 1; fi
          grep -F "ANNEESSENS_PLACE_IDENTITY_OK" /tmp/anneessens-place-identity.log
      - name: Run frozen natural-exposure A/B
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_place_identity_visual_test.gd 2>&1 | tee /tmp/anneessens-place-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_PLACE_IDENTITY_VISUAL_FAIL" /tmp/anneessens-place-visual.log; then exit 1; fi
          grep -F "ANNEESSENS_PLACE_IDENTITY_VISUAL_OK" /tmp/anneessens-place-visual.log
      - name: Stage review evidence
        run: |
          mkdir -p /tmp/anneessens-evidence
          cp grand-bruxelles-game/data/urbis/anneessens/place_identity.game.json /tmp/anneessens-evidence/
          cp /tmp/anneessens_before.png /tmp/anneessens_after.png /tmp/anneessens-evidence/
          cp /tmp/anneessens-place-visual.log /tmp/anneessens-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: anneessens-place-identity-evidence
          path: /tmp/anneessens-evidence
          if-no-files-found: error
