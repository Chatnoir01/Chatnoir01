name: Grand Bruxelles Anneessens Player View A/B

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-player-view.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_player_view_capture.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-base-head-player-view:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve exact revisions
        id: revs
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            EXPECTED_HEAD="${{ github.event.pull_request.head.sha }}"
            test "$HEAD_SHA" = "$EXPECTED_HEAD"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA"
          echo "head_sha=$HEAD_SHA"
      - name: Install deterministic software-renderer dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 python3-pil
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Prepare exact base with revision-neutral witness
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/anneessens-base "${{ steps.revs.outputs.base_sha }}"
          mkdir -p /tmp/anneessens-base/grand-bruxelles-game/game/tests
          cp grand-bruxelles-game/game/tests/anneessens_player_view_capture.gd /tmp/anneessens-base/grand-bruxelles-game/game/tests/anneessens_player_view_capture.gd
      - name: Import exact base
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path /tmp/anneessens-base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-base-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-base-import.log; then exit 1; fi
      - name: Capture exact base player view
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/anneessens-base
          ANNEESSENS_CAPTURE_PATH="res://artifacts/visual/anneessens_base.png" timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_player_view_capture.gd 2>&1 | tee /tmp/anneessens-base.log
          grep -q "ANNEESSENS_PLAYER_VIEW_CAPTURE_OK" /tmp/anneessens-base.log
      - name: Import exact head
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-head-import.log; then exit 1; fi
      - name: Capture exact head player view
        shell: bash
        run: |
          set -o pipefail
          ANNEESSENS_CAPTURE_PATH="res://artifacts/visual/anneessens_head.png" timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/anneessens_player_view_capture.gd 2>&1 | tee /tmp/anneessens-head.log
          grep -q "ANNEESSENS_PLAYER_VIEW_CAPTURE_OK" /tmp/anneessens-head.log
      - name: Seal camera/source invariants and measure A/B
        shell: bash
        run: |
          set -euo pipefail
          BASE_LOG="$(grep 'ANNEESSENS_PLAYER_VIEW_CAPTURE_OK' /tmp/anneessens-base.log | tail -1)"
          HEAD_LOG="$(grep 'ANNEESSENS_PLAYER_VIEW_CAPTURE_OK' /tmp/anneessens-head.log | tail -1)"
          BASE_INVARIANTS="$(printf '%s\n' "$BASE_LOG" | sed -E 's/^.*size=/size=/; s/ output=[^ ]+//')"
          HEAD_INVARIANTS="$(printf '%s\n' "$HEAD_LOG" | sed -E 's/^.*size=/size=/; s/ output=[^ ]+//')"
          test "$BASE_INVARIANTS" = "$HEAD_INVARIANTS"
          mkdir -p grand-bruxelles-game/artifacts/visual/anneessens-player-view-ab
          cp /tmp/anneessens-base/grand-bruxelles-game/artifacts/visual/anneessens_base.png grand-bruxelles-game/artifacts/visual/anneessens-player-view-ab/base.png
          cp grand-bruxelles-game/artifacts/visual/anneessens_head.png grand-bruxelles-game/artifacts/visual/anneessens-player-view-ab/head.png
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageEnhance
          from pathlib import Path
          import json
          root = Path('grand-bruxelles-game/artifacts/visual/anneessens-player-view-ab')
          a = Image.open(root/'base.png').convert('RGB')
          b = Image.open(root/'head.png').convert('RGB')
          if a.size != (1280, 720) or b.size != (1280, 720):
              raise SystemExit(f'unexpected dimensions: {a.size} {b.size}')
          total = a.size[0] * a.size[1]
          changed3 = changed8 = 0
          minx, miny = a.size[0], a.size[1]
          maxx = maxy = -1
          pa, pb = a.load(), b.load()
          for y in range(a.size[1]):
              for x in range(a.size[0]):
                  d = max(abs(pa[x,y][i]-pb[x,y][i]) for i in range(3))
                  if d > 3:
                      changed3 += 1
                      minx, miny = min(minx,x), min(miny,y)
                      maxx, maxy = max(maxx,x), max(maxy,y)
                  if d > 8:
                      changed8 += 1
          bbox = None if maxx < 0 else [minx,miny,maxx,maxy]
          metrics = {
              'base_sha': '${{ steps.revs.outputs.base_sha }}',
              'head_sha': '${{ steps.revs.outputs.head_sha }}',
              'width': a.size[0], 'height': a.size[1],
              'changed_gt3_pixels': changed3,
              'changed_gt3_fraction': changed3/total,
              'changed_gt8_pixels': changed8,
              'changed_gt8_fraction': changed8/total,
              'changed_gt3_bbox': bbox,
              'camera_changed': False,
              'source_geometry_changed': False,
              'threshold_changed': False,
              'visual_acceptance': False,
              'jouable_authorized': False,
          }
          (root/'metrics.json').write_text(json.dumps(metrics, indent=2)+'\n')
          diff = ImageChops.difference(a,b)
          ImageEnhance.Brightness(diff).enhance(4.0).save(root/'diff_x4.png')
          print('ANNEESSENS_PLAYER_VIEW_AB_METRICS:', json.dumps(metrics, sort_keys=True))
          PY
      - name: Revalidate exact revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.revs.outputs.head_sha }}"
          test "$(git -C /tmp/anneessens-base rev-parse HEAD)" = "${{ steps.revs.outputs.base_sha }}"
      - name: Upload exact base-head player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anneessens-exact-base-head-player-view
          path: |
            grand-bruxelles-game/artifacts/visual/anneessens-player-view-ab/
            /tmp/anneessens-base.log
            /tmp/anneessens-head.log
            /tmp/anneessens-base-import.log
            /tmp/anneessens-head-import.log
          if-no-files-found: warn
