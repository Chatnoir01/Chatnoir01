name: Grand Bruxelles Anneessens Population HUD

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-population-hud.yml"
      - "grand-bruxelles-game/game/scripts/visible_city_runtime.gd"
      - "grand-bruxelles-game/game/scripts/anneessens_lab_life.gd"
      - "grand-bruxelles-game/game/tests/anneessens_population_hud_test.gd"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  population-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-population-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-population-import.log; then exit 1; fi
      - name: Validate Anneessens local population HUD
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_population_hud_test.gd
