name: Grand Bruxelles Anneessens School Source

on:
  push:
    paths:
      - "grand-bruxelles-game/tools/fetch_anneessens_school_source.py"
      - "grand-bruxelles-game/tests/test_anneessens_school_source.py"
      - "grand-bruxelles-game/data/osm/anneessens_school_256375327.game.json"
      - ".github/workflows/grand-bruxelles-anneessens-school-source.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/fetch_anneessens_school_source.py"
      - "grand-bruxelles-game/tests/test_anneessens_school_source.py"
      - "grand-bruxelles-game/data/osm/anneessens_school_256375327.game.json"
      - ".github/workflows/grand-bruxelles-anneessens-school-source.yml"

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire exact OSM school footprint
        run: python grand-bruxelles-game/tools/fetch_anneessens_school_source.py --output /tmp/anneessens_school_256375327.game.json
      - name: Compare live source with committed snapshot
        run: cmp /tmp/anneessens_school_256375327.game.json grand-bruxelles-game/data/osm/anneessens_school_256375327.game.json
      - name: Validate source contract without external test dependency
        run: |
          python - <<'PY'
          import runpy
          namespace = runpy.run_path('grand-bruxelles-game/tests/test_anneessens_school_source.py')
          namespace['test_school_landmark_is_committed_from_exact_osm_way']()
          namespace['test_heritage_contract_only_claims_documented_frontage_traits']()
          print('ANNEESSENS_SOURCE_CONTRACT_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anneessens-school-source
          path: /tmp/anneessens_school_256375327.game.json
