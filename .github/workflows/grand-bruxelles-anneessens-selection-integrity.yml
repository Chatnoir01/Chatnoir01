name: Grand Bruxelles Anneessens Selection Integrity

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd'
      - 'grand-bruxelles-game/data/osm/zones/anneessens/environment.game.json'
      - 'grand-bruxelles-game/game/tests/anneessens_osm_selection_integrity_contract_test.py'
      - '.github/workflows/grand-bruxelles-anneessens-selection-integrity.yml'

permissions:
  contents: read

jobs:
  selection-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact PR head and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"

      - name: Prove live base preserves selection-integrity contract
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          RUNTIME="grand-bruxelles-game/game/scripts/anneessens_osm_furniture_runtime.gd"

          # Selection integrity shipped to main in #2034. For later Environment
          # lots this workflow is a preservation gate, not a synthetic RED gate.
          # Run the exact PR-head regression against the exact live-base runtime;
          # it must stay GREEN or the base/contract relationship is inconsistent.
          git checkout "$BASE_SHA" -- "$RUNTIME"
          python3 grand-bruxelles-game/game/tests/anneessens_osm_selection_integrity_contract_test.py

          # A path checkout mutates both worktree and index. Restore the exact
          # raw PR head before the head proof and require a completely clean tree.
          git reset --hard "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Prove exact head is GREEN
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          python3 grand-bruxelles-game/game/tests/anneessens_osm_selection_integrity_contract_test.py
