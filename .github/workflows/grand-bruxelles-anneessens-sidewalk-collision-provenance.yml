name: Grand Bruxelles Anneessens Sidewalk Collision Provenance

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-sidewalk-collision-provenance.yml"
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_collision_provenance_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact current main base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          EVENT_BASE="${{ github.event.pull_request.base.sha }}"
          LIVE_MAIN="$(git rev-parse origin/main)"
          RAW_HEAD="$(git rev-parse HEAD)"
          test "$EVENT_BASE" = "$LIVE_MAIN"
          test "$RAW_HEAD" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$RAW_HEAD" "$LIVE_MAIN")" = "$LIVE_MAIN"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4.7.1.stable'
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Prove authored proxy cannot own unverified collision
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_midi_sidewalk_collision_provenance_test.gd 2>&1 | tee /tmp/collision-provenance.log
          if grep -q "ANNEESSENS_SIDEWALK_COLLISION_PROVENANCE_FAIL" /tmp/collision-provenance.log; then exit 1; fi
          grep -q "ANNEESSENS_SIDEWALK_COLLISION_PROVENANCE_OK" /tmp/collision-provenance.log
