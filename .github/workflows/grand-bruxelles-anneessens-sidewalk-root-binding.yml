name: Grand Bruxelles Anneessens Sidewalk Root Binding

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-anneessens-sidewalk-root-binding.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_root_binding_test.gd"
      - "grand-bruxelles-game/game/tests/anneessens_midi_sidewalk_player_anchor_type_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anneessens-sidewalk-root-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/anneessens-sidewalk-root-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/anneessens-sidewalk-root-import.log; then exit 1; fi
      - name: Validate root-instantiated Anneessens sidewalk binding
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_midi_sidewalk_root_binding_test.gd 2>&1 | tee /tmp/anneessens-sidewalk-root.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_MIDI_SIDEWALK_ROOT_BIND_FAIL" /tmp/anneessens-sidewalk-root.log; then exit 1; fi
          grep -q "ANNEESSENS_MIDI_SIDEWALK_ROOT_BIND_OK" /tmp/anneessens-sidewalk-root.log
      - name: Reject malformed Player anchor type
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/anneessens_midi_sidewalk_player_anchor_type_test.gd 2>&1 | tee /tmp/anneessens-sidewalk-player-anchor-type.log
          if grep -E "SCRIPT ERROR|Parse Error:|ANNEESSENS_MIDI_SIDEWALK_PLAYER_ANCHOR_TYPE_FAIL" /tmp/anneessens-sidewalk-player-anchor-type.log; then exit 1; fi
          grep -q "ANNEESSENS_MIDI_SIDEWALK_PLAYER_ANCHOR_TYPE_OK" /tmp/anneessens-sidewalk-player-anchor-type.log
