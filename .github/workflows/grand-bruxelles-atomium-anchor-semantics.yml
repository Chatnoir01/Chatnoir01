name: Grand Bruxelles Atomium Anchor Semantics

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-anchor-semantics.yml"
      - "grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json"
      - "grand-bruxelles-game/data/qa/photo_match/atomium_anchor_semantics_evidence.json"
      - "grand-bruxelles-game/tools/audit_atomium_anchor_semantics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install projection dependency
        run: python -m pip install --disable-pip-version-check pyproj==3.7.2
      - name: Prove current Atomium anchor semantics
        run: python3 grand-bruxelles-game/tools/audit_atomium_anchor_semantics.py
