name: Grand Bruxelles Atomium Base Pavilion Envelope

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-base-pavilion-envelope.yml"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_hero_core_evidence.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_base_pavilion_envelope.gd"
      - "grand-bruxelles-game/game/tests/atomium_base_pavilion_envelope_test.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pavilion-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-bounded pavilion envelope and capture
        shell: bash
        run: |
          set -o pipefail
          START=$(date +%s%3N)
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/atomium_base_pavilion_envelope_test.gd 2>&1 | tee /tmp/atomium-pavilion-envelope.log
          END=$(date +%s%3N)
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_BASE_PAVILION_ENVELOPE_FAIL" /tmp/atomium-pavilion-envelope.log; then exit 1; fi
          grep -F "ATOMIUM_BASE_PAVILION_ENVELOPE_OK" /tmp/atomium-pavilion-envelope.log
          echo "atomium_base_pavilion_envelope_ms=$((END-START))" | tee /tmp/atomium-pavilion-envelope-performance.txt
          test -f grand-bruxelles-game/artifacts/atomium/atomium_base_pavilion_envelope.png
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-base-pavilion-envelope-evidence
          path: |
            grand-bruxelles-game/artifacts/atomium/atomium_base_pavilion_envelope.png
            /tmp/atomium-pavilion-envelope.log
            /tmp/atomium-pavilion-envelope-performance.txt
          if-no-files-found: error
