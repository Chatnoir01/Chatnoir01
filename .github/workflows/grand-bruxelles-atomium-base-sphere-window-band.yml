name: Grand Bruxelles Atomium Base Sphere Window Band

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-base-sphere-window-band.yml"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_base_sphere_window_band_evidence.json"
      - "grand-bruxelles-game/data/runtime/modules/atomium_base_sphere_window_band.json"
      - "grand-bruxelles-game/game/scripts/atomium_base_sphere_window_band_runtime.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_base_sphere_window_band.gd"
      - "grand-bruxelles-game/game/tests/atomium_base_sphere_window_band_player_ab_test.gd"
      - "grand-bruxelles-game/game/tests/atomium_hero_ground_oblique_test.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_reflection_environment.gd"
      - "grand-bruxelles-game/game/scripts/atomium_arrival_presentation_runtime.gd"
      - "grand-bruxelles-game/game/scripts/grand_brussels_runtime_bootstrap.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1 and Pillow
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          python3 -m pip install --disable-pip-version-check pillow
      - name: Validate permanent runtime registry
        run: python3 grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/atomium-window-band-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/atomium-window-band-import.log; then exit 1; fi
      - name: Preserve existing Atomium hero contract
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --script res://game/tests/atomium_hero_ground_oblique_test.gd \
            2>&1 | tee /tmp/atomium-window-band-regression.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_HERO_GROUND_OBLIQUE_FAIL" /tmp/atomium-window-band-regression.log; then exit 1; fi
          grep -F "ATOMIUM_HERO_GROUND_OBLIQUE_OK" /tmp/atomium-window-band-regression.log
      - name: Capture true-player Atomium BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/atomium_base_sphere_window_band_player_ab_test.gd \
            2>&1 | tee /tmp/atomium-window-band-player-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_BASE_SPHERE_WINDOW_BAND_PLAYER_AB_FAIL" /tmp/atomium-window-band-player-ab.log; then exit 1; fi
          grep -F "ATOMIUM_BASE_SPHERE_WINDOW_BAND_PLAYER_AB_OK" /tmp/atomium-window-band-player-ab.log
          test -s grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/before.png
          test -s grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/after.png
      - name: Measure frozen player-visible gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          root = Path('grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band')
          before = Image.open(root / 'before.png').convert('RGB')
          after = Image.open(root / 'after.png').convert('RGB')
          if before.size != after.size or before.size != (1280, 720):
              raise SystemExit('ATOMIUM_BASE_SPHERE_WINDOW_BAND_AB_FAIL: capture size mismatch')

          a, b = before.load(), after.load()
          xs3, ys3, gt8 = [], [], 0
          for y in range(before.height):
              for x in range(before.width):
                  delta = max(abs(a[x, y][i] - b[x, y][i]) for i in range(3))
                  if delta > 3:
                      xs3.append(x)
                      ys3.append(y)
                  if delta > 8:
                      gt8 += 1

          total = before.width * before.height
          ratio3 = 100.0 * len(xs3) / total
          ratio8 = 100.0 * gt8 / total
          if xs3:
              bbox = (min(xs3), min(ys3), max(xs3) + 1, max(ys3) + 1)
              bw = bbox[2] - bbox[0]
              bh = bbox[3] - bbox[1]
              bbox_area = 100.0 * bw * bh / total
          else:
              bbox = (0, 0, 0, 0)
              bw = bh = 0
              bbox_area = 0.0

          ImageChops.difference(before, after).save(root / 'diff.png')
          passed = (
              ratio3 >= 0.08 and ratio8 >= 0.05 and
              bw >= 70 and bh >= 16 and
              ratio3 <= 5.0 and bbox_area <= 15.0
          )
          line = (
              f'ATOMIUM_BASE_SPHERE_WINDOW_BAND_AB_METRICS: changed_gt3={ratio3:.6f}% '
              f'changed_gt8={ratio8:.6f}% bbox={bbox} bbox_size={bw}x{bh} '
              f'bbox_area={bbox_area:.4f}% floor3=0.08% floor8=0.05% '
              f'bbox_floor=70x16 changed_ceiling=5.0% bbox_ceiling=15.0% '
              f'numerical_gate={"PASS" if passed else "FAIL"}\n'
          )
          (root / 'metrics.log').write_text(line, encoding='utf-8')
          print(line, end='')
          PY
          cp /tmp/atomium-window-band-player-ab.log grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/player-ab.log
          cp /tmp/atomium-window-band-regression.log grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/hero-regression.log
          cp /tmp/atomium-window-band-import.log grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/import.log
      - name: Upload full-frame player A-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-base-sphere-window-band-player-ab
          path: grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band
          if-no-files-found: error
      - name: Enforce frozen numerical gate
        run: grep -F "numerical_gate=PASS" grand-bruxelles-game/artifacts/qa/atomium_base_sphere_window_band/metrics.log
