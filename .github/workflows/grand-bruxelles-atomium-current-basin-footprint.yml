name: Grand Bruxelles Atomium Current Basin Footprint

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-current-basin-footprint.yml"
      - "grand-bruxelles-game/data/environment/laeken_jette/atomium_current_basin_footprint.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_current_basin_footprint.gd"
      - "grand-bruxelles-game/game/tests/atomium_current_basin_footprint_test.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basin-footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/atomium-current-basin-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/atomium-current-basin-import.log; then exit 1; fi
      - name: Validate 2024 basin footprint smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/atomium_current_basin_footprint_test.gd 2>&1 | tee /tmp/atomium-current-basin-footprint.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_CURRENT_BASIN_FOOTPRINT_FAIL" /tmp/atomium-current-basin-footprint.log; then exit 1; fi
          grep -F "ATOMIUM_CURRENT_BASIN_FOOTPRINT_OK" /tmp/atomium-current-basin-footprint.log
