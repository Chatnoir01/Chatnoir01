name: Grand Bruxelles Atomium Ground Context

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-ground-context.yml"
      - "grand-bruxelles-game/data/urbis/laeken_jette/manifest.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/street_surfaces.game.json"
      - "grand-bruxelles-game/game/tests/atomium_street_surface_source_probe_test.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_street_surface_context.gd"
      - "grand-bruxelles-game/game/tests/atomium_ground_context_capture_test.gd"
      - "grand-bruxelles-game/game/tests/atomium_ground_context_ab_compare_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Probe official street surfaces near Atomium
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/atomium_street_surface_source_probe_test.gd 2>&1 | tee /tmp/atomium-ground-probe.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_STREET_SURFACE_PROBE_FAIL" /tmp/atomium-ground-probe.log; then exit 1; fi
          grep -F "ATOMIUM_STREET_SURFACE_PROBE_OK" /tmp/atomium-ground-probe.log
      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: atomium-ground-source-probe
          path: /tmp/atomium-ground-probe.log
          if-no-files-found: error
