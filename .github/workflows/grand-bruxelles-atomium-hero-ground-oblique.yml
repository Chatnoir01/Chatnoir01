name: Grand Bruxelles Atomium Hero Ground Oblique

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-hero-ground-oblique.yml"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_hero_core_evidence.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/tests/atomium_hero_ground_oblique_test.gd"
      - "grand-bruxelles-game/game/tests/atomium_direct_spawn_test.gd"
      - "grand-bruxelles-game/game/tests/atomium_showcase_spawn_test.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/scripts/location_label_controller.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-ground-oblique:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate Atomium hero and capture
        shell: bash
        run: |
          set -o pipefail
          START=$(date +%s%3N)
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/atomium_hero_ground_oblique_test.gd 2>&1 | tee /tmp/atomium-hero.log
          END=$(date +%s%3N)
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_HERO_GROUND_OBLIQUE_FAIL" /tmp/atomium-hero.log; then exit 1; fi
          grep -F "ATOMIUM_HERO_GROUND_OBLIQUE_OK" /tmp/atomium-hero.log
          echo "atomium_hero_ground_oblique_ms=$((END-START))" | tee /tmp/atomium-hero-performance.txt
          test -f grand-bruxelles-game/artifacts/atomium/atomium_hero_ground_oblique.png
      - name: Validate direct playable Atomium spawn
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/atomium_direct_spawn_test.gd 2>&1 | tee /tmp/atomium-direct-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_DIRECT_SPAWN_FAIL" /tmp/atomium-direct-spawn.log; then exit 1; fi
          grep -F "ATOMIUM_DIRECT_SPAWN_OK" /tmp/atomium-direct-spawn.log
          test -f grand-bruxelles-game/artifacts/atomium/atomium_direct_spawn.png
      - name: Validate Atomium showcase spawn
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/atomium_showcase_spawn_test.gd 2>&1 | tee /tmp/atomium-showcase-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_SHOWCASE_SPAWN_FAIL" /tmp/atomium-showcase-spawn.log; then exit 1; fi
          grep -F "ATOMIUM_SHOWCASE_SPAWN_OK" /tmp/atomium-showcase-spawn.log
          test -f grand-bruxelles-game/artifacts/atomium/atomium_showcase_spawn.png
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-hero-ground-oblique-evidence
          path: |
            grand-bruxelles-game/artifacts/atomium/atomium_hero_ground_oblique.png
            grand-bruxelles-game/artifacts/atomium/atomium_direct_spawn.png
            grand-bruxelles-game/artifacts/atomium/atomium_showcase_spawn.png
            /tmp/atomium-hero.log
            /tmp/atomium-hero-performance.txt
            /tmp/atomium-direct-spawn.log
            /tmp/atomium-showcase-spawn.log
          if-no-files-found: error
