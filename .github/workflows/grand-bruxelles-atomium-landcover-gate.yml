name: Grand Bruxelles Atomium LandCover Gate

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-landcover-gate.yml"
      - "grand-bruxelles-game/data/environment/laeken_jette/atomium_landcover_context.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_landcover_context.gd"
      - "grand-bruxelles-game/game/tests/atomium_landcover_context_test.gd"

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe official Paradigm INSPIRE LandCover in accepted Atomium camera corridor
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import json, math, pathlib, urllib.parse, urllib.request

          anchor_e = 148093.22038698208
          anchor_n = 176091.76722726133
          camera_e = anchor_e + 120.0
          camera_n = anchor_n
          vertical_fov_deg = 48.0
          aspect = 16.0 / 9.0
          horizontal_half_fov_deg = math.degrees(math.atan(math.tan(math.radians(vertical_fov_deg/2.0))*aspect))
          bbox = (147980.0, 175930.0, 148330.0, 176260.0)

          attempts=[]
          payload=None
          accepted_url=None
          endpoints=[
              "https://geoservices-urbis.irisnet.be/geoserver/ows",
              "https://geoservices-urbis.irisnet.be/geoserver/inspirevector/ows",
          ]
          variants=[
              ("2.0.0","typeNames","inspire:LandCover","application/json","count"),
              ("1.1.0","typeName","inspire:LandCover","application/json","maxFeatures"),
              ("1.1.0","typeName","inspire:LandCover","json","maxFeatures"),
          ]
          for endpoint in endpoints:
              for version,type_key,type_name,output,count_key in variants:
                  params={
                      "service":"WFS","version":version,"request":"GetFeature",
                      type_key:type_name,"outputFormat":output,"srsName":"EPSG:31370",
                      "bbox":",".join(map(str,bbox)) + ",EPSG:31370",count_key:"500",
                  }
                  url=endpoint+"?"+urllib.parse.urlencode(params)
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Grand-Bruxelles-source-gate/1.1","Accept":"application/json,application/geo+json,*/*"})
                      with urllib.request.urlopen(req,timeout=45) as response:
                          raw=response.read()
                          ctype=response.headers.get("Content-Type","")
                      preview=raw[:800].decode("utf-8","replace").replace("\n"," ")
                      attempts.append({"url":url,"content_type":ctype,"bytes":len(raw),"preview":preview})
                      if raw.lstrip().startswith((b"{",b"[")):
                          candidate=json.loads(raw)
                          if isinstance(candidate,dict) and isinstance(candidate.get("features"),list):
                              payload=candidate; accepted_url=url; break
                  except Exception as exc:
                      attempts.append({"url":url,"error":repr(exc)})
              if payload is not None:
                  break

          pathlib.Path("artifacts/atomium").mkdir(parents=True,exist_ok=True)
          if payload is None:
              pathlib.Path("artifacts/atomium/landcover_probe.json").write_text(json.dumps({"status":"wfs_negotiation_failed","attempts":attempts},indent=2),encoding="utf-8")
              for attempt in attempts:
                  print("WFS_ATTEMPT",json.dumps(attempt,ensure_ascii=False))
              raise SystemExit("Official LandCover WFS did not return GeoJSON; source gate cannot proceed")

          def polys(geom):
              if not isinstance(geom,dict): return []
              c=geom.get("coordinates",[])
              if geom.get("type")=="Polygon": return [c]
              if geom.get("type")=="MultiPolygon": return c
              return []
          def area_ring(r):
              if len(r)<4:return 0.0
              return abs(sum(r[i][0]*r[i+1][1]-r[i+1][0]*r[i][1] for i in range(len(r)-1)))*0.5
          def area_geom(g):
              total=0.0
              for p in polys(g):
                  if not p: continue
                  total += area_ring(p[0])
                  total -= sum(area_ring(h) for h in p[1:])
              return max(0.0,total)
          def pts(g):
              out=[]
              for p in polys(g):
                  for r in p:
                      out.extend(q for q in r if isinstance(q,list) and len(q)>=2)
              return out

          rows=[]; keys=set()
          for feature in payload.get("features",[]):
              props=feature.get("properties") or {}; keys.update(props.keys())
              geom=feature.get("geometry") or {}; pp=pts(geom)
              if not pp: continue
              min_e=min(p[0] for p in pp); max_e=max(p[0] for p in pp)
              min_n=min(p[1] for p in pp); max_n=max(p[1] for p in pp)
              ce=(min_e+max_e)/2; cn=(min_n+max_n)/2
              angles=[]
              for e in (min_e,max_e):
                  for n in (min_n,max_n):
                      forward=camera_e-e
                      if forward>0: angles.append(math.degrees(math.atan2(n-camera_n,forward)))
              visible=bool(angles) and max(angles)>=-horizontal_half_fov_deg and min(angles)<=horizontal_half_fov_deg
              rows.append({
                  "id":feature.get("id"),"properties":props,"geometry_type":geom.get("type"),
                  "area_m2":round(area_geom(geom),3),
                  "bbox_epsg31370":[round(min_e,3),round(min_n,3),round(max_e,3),round(max_n,3)],
                  "camera_distance_m":round(math.hypot(ce-camera_e,cn-camera_n),3),
                  "angular_span_deg":[round(min(angles),3),round(max(angles),3)] if angles else [180.0,180.0],
                  "intersects_horizontal_fov":visible,
              })
          rows.sort(key=lambda r:(not r["intersects_horizontal_fov"],r["camera_distance_m"],-r["area_m2"]))
          out={
              "status":"ok","source":"Paradigm INSPIRE vector Brussels WFS","source_url":accepted_url,
              "layer":"inspire:LandCover","crs":"EPSG:31370","query_bbox_epsg31370":bbox,
              "atomium_anchor_epsg31370":[anchor_e,anchor_n],"camera_epsg31370":[camera_e,camera_n],
              "vertical_fov_deg":vertical_fov_deg,"horizontal_half_fov_deg":horizontal_half_fov_deg,
              "feature_count":len(rows),"property_keys":sorted(keys),"features":rows,"negotiation_attempts":attempts,
          }
          pathlib.Path("artifacts/atomium/landcover_probe.json").write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding="utf-8")
          print("ATOMIUM_LANDCOVER_PROBE_OK","features=",len(rows),"keys=",sorted(keys),"half_hfov=",round(horizontal_half_fov_deg,3),"url=",accepted_url)
          for row in rows[:30]: print("LANDCOVER_CANDIDATE",json.dumps(row,ensure_ascii=False,separators=(",",":")))
          if not any(r["intersects_horizontal_fov"] and r["area_m2"]>=500.0 for r in rows):
              raise SystemExit("No >=500m2 LandCover polygon intersects the accepted horizontal FOV; reject before runtime")
          PY

      - name: Upload source-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomium-landcover-source-gate
          path: grand-bruxelles-game/artifacts/atomium/landcover_probe.json
          if-no-files-found: ignore
