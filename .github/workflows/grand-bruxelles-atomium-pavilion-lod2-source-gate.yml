name: Grand Bruxelles Atomium Pavilion LoD2 Source Gate

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-pavilion-lod2-source-gate.yml"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
      - "grand-bruxelles-game/tools/extract_urbis_3d_hero.py"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_pavilion_lod2.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_pavilion_lod2.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/tests/atomium_pavilion_lod2_visual_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pavilion-lod2-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and image-analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Download bounded official UrbIS 3D tile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urbis3d grand-bruxelles-game/artifacts/atomium/pavilion-lod2
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148176_20260808.zip"
          echo "$URL" > /tmp/package-url.txt
          curl -fL --retry 3 --retry-delay 3 --max-time 90 -o /tmp/urbis3d.zip "$URL"
          sha256sum /tmp/urbis3d.zip | tee /tmp/package-sha256.txt
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148176_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source-root.txt
      - name: Re-extract and lock exact central pavilion LoD2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source-root.txt)"
          SHA="$(cut -d' ' -f1 /tmp/package-sha256.txt)"
          URL="$(cat /tmp/package-url.txt)"
          python3 grand-bruxelles-game/tools/extract_urbis_3d_context.py \
            --source-root "$ROOT" --prefix UrbISBuildings3D_148176 \
            --building-id "https://databrussels.be/id/building/1651628" \
            --context-id "atomium_pavilion_candidate_1651628" \
            --name "Atomium central pavilion LoD2 candidate 1651628" \
            --package-url "$URL" --package-sha256 "$SHA" \
            --package-revision "2026-08-08" --accessed-at "2026-08-14" \
            --origin-e 148093.22038698208 --origin-n 176091.76722726133 \
            --world-x 0 --world-z 0 \
            --output /tmp/1651628.reextract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a_path=Path('/tmp/1651628.reextract.json')
          b_path=Path('grand-bruxelles-game/data/sources/laeken_jette/atomium_pavilion_lod2.game.json')
          a=json.loads(a_path.read_text(encoding='utf-8'))
          b=json.loads(b_path.read_text(encoding='utf-8'))
          def counts(d):
              out={}
              for f in d['faces']:
                  out[f['id']] = (f['type'], len(f.get('triangles', [])))
              return out
          print('ATOMIUM_PAVILION_TOPOLOGY_SOURCE', counts(a))
          print('ATOMIUM_PAVILION_TOPOLOGY_COMMITTED', counts(b))
          print('ATOMIUM_PAVILION_TRIANGLES_SOURCE', sum(len(f.get('triangles',[])) for f in a['faces']))
          print('ATOMIUM_PAVILION_TRIANGLES_COMMITTED', sum(len(f.get('triangles',[])) for f in b['faces']))
          amap={f['id']:f for f in a['faces']}; bmap={f['id']:f for f in b['faces']}
          for fid in sorted(set(amap)|set(bmap)):
              af=amap.get(fid); bf=bmap.get(fid)
              if af != bf:
                  print('ATOMIUM_PAVILION_FACE_DIFF', fid)
                  print('SOURCE_FACE', json.dumps(af, separators=(',',':'), ensure_ascii=False))
                  print('COMMITTED_FACE', json.dumps(bf, separators=(',',':'), ensure_ascii=False))
          if a != b:
              raise SystemExit('exact committed pavilion payload differs from deterministic official re-extraction')
          PY
      - name: Enforce source-confidence and projected-size pre-gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          p='grand-bruxelles-game/data/sources/laeken_jette/atomium_pavilion_lod2.game.json'
          d=json.load(open(p,encoding='utf-8')); e=d['evidence']; bbox=e['source_bbox_xy']
          w=bbox[2]-bbox[0]; depth=bbox[3]-bbox[1]
          cx=(bbox[0]+bbox[2])/2; cy=(bbox[1]+bbox[3])/2
          anchor=(148093.22038698208,176091.76722726133)
          offset=math.hypot(cx-anchor[0],cy-anchor[1]); types=e['face_type_counts']; height=float(e['height_m'])
          vfov=math.radians(48.0); hfov=2*math.atan(math.tan(vfov/2)*(16/9)); distance=120.0
          area=(2*math.atan(max(w,depth)/(2*distance))/hfov)*(2*math.atan(height/(2*distance))/vfov)
          print(f'ATOMIUM_PAVILION_LOD2_SOURCE building=1651628 envelope={w:.3f}x{depth:.3f} height={height:.3f} offset={offset:.3f} area_proxy={area:.6f}')
          assert types.get('WALLSURFACE') == 16 and types.get('ROOFSURFACE') == 2
          assert e['triangle_count'] == 60 and offset <= 25 and area >= 0.005
          assert d['source']['package_sha256'] == 'ed94f066fc2c869d8b2cb5755a6116d839111ec6d0f03239e1af8a6c9272ddbe'
          assert d['source']['license'] == 'CC0-1.0' and d['source']['crs'] == 'EPSG:31370'
          PY
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic hero and direct-player A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/atomium_pavilion_lod2_visual_test.gd 2>&1 | tee /tmp/pavilion-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_PAVILION_LOD2_VISUAL_FAIL" /tmp/pavilion-visual.log; then exit 1; fi
          grep -F "ATOMIUM_PAVILION_LOD2_VISUAL_OK" /tmp/pavilion-visual.log
      - name: Enforce player-facing anti-micro A/B
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          pairs=[('hero',Path('grand-bruxelles-game/artifacts/atomium/pavilion_lod2_hero_before.png'),Path('grand-bruxelles-game/artifacts/atomium/pavilion_lod2_hero_after.png'),0.006),('player',Path('grand-bruxelles-game/artifacts/atomium/pavilion_lod2_player_before.png'),Path('grand-bruxelles-game/artifacts/atomium/pavilion_lod2_player_after.png'),0.006)]
          for name,a,b,min_frac in pairs:
            ia=Image.open(a).convert('RGB'); ib=Image.open(b).convert('RGB'); assert ia.size==ib.size
            changed=sum(1 for x,y in zip(ia.getdata(),ib.getdata()) if max(abs(x[i]-y[i]) for i in range(3))>3)
            total=ia.width*ia.height; frac=changed/total
            print(f'ATOMIUM_PAVILION_AB {name} changed={changed} total={total} fraction={frac:.6f}')
            if frac < min_frac: raise SystemExit(f'{name} anti-micro failed: {frac:.6f} < {min_frac:.6f}')
          PY
      - name: Upload source and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-pavilion-lod2-evidence
          path: |
            grand-bruxelles-game/data/sources/laeken_jette/atomium_pavilion_lod2.game.json
            grand-bruxelles-game/artifacts/atomium/pavilion_lod2_hero_before.png
            grand-bruxelles-game/artifacts/atomium/pavilion_lod2_hero_after.png
            grand-bruxelles-game/artifacts/atomium/pavilion_lod2_player_before.png
            grand-bruxelles-game/artifacts/atomium/pavilion_lod2_player_after.png
            /tmp/package-sha256.txt
            /tmp/pavilion-visual.log
          if-no-files-found: error
