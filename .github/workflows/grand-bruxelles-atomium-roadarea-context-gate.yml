name: Grand Bruxelles Atomium RoadArea Context Gate

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-roadarea-context-gate.yml"
      - "grand-bruxelles-game/tools/probe_atomium_roadarea_context.py"
      - "grand-bruxelles-game/data/environment/laeken_jette/atomium_roadarea_context.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_roadarea_context.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/tests/atomium_roadarea_context_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and image-analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Probe official INSPIRE RoadArea with exact geometry
        working-directory: grand-bruxelles-game
        run: python3 tools/probe_atomium_roadarea_context.py
      - name: Lock selected runtime geometry to fresh official WFS
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import hashlib,json
          probe=json.load(open('artifacts/atomium/roadarea_context_probe.json',encoding='utf-8'))
          locked=json.load(open('data/environment/laeken_jette/atomium_roadarea_context.game.json',encoding='utf-8'))
          assert probe['source']['crs'] == locked['source']['crs'] == 'EPSG:31370'
          assert probe['source']['layer'] == locked['source']['layer'] == 'TN.RoadTransportNetwork.RoadArea'
          assert probe['feature_count'] == locked['selection']['source_feature_count'] == 24
          assert abs(probe['witness']['ground_wedge_coverage_fraction']-locked['accepted_player_witness']['ground_wedge_coverage_fraction']) < 1e-12
          hit_ids=sorted({i for sample in probe['samples'] for i in sample[2]})
          assert hit_ids == locked['selection']['selected_feature_ids']
          by_id={x['id']:x for x in probe['features']}
          canonical=[]
          for feature in locked['features']:
              fresh=by_id[feature['id']]
              assert fresh['geometry'] == feature['geometry'], feature['id']
              assert abs(float(fresh['area_m2'])-float(feature['area_m2'])) < 0.001
              canonical.append({'id':fresh['id'],'area_m2':fresh['area_m2'],'geometry':fresh['geometry']})
          canonical.sort(key=lambda x:x['id'])
          digest=hashlib.sha256(json.dumps(canonical,separators=(',',':'),sort_keys=True,ensure_ascii=False).encode()).hexdigest()
          assert digest == '0f35010e61c570c00315215bc04e7e06547e62c5c9f0656b6b5b31c833ef1aff'
          assert locked['source']['license'] == 'CC-BY-4.0'
          assert locked['source']['attribution'].startswith('Paradigm')
          assert locked['runtime_policy']['geometry_exact_from_wfs']
          assert not locked['runtime_policy']['material_photometry_resolved']
          assert probe['witness']['ground_wedge_coverage_fraction'] >= 0.20
          print('ATOMIUM_ROADAREA_SOURCE_LOCK_OK',len(hit_ids),probe['witness']['ground_wedge_coverage_fraction'],digest)
          PY
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic hero and direct-player RoadArea A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/atomium_roadarea_context_test.gd 2>&1 | tee /tmp/roadarea-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_ROADAREA_CONTEXT_FAIL" /tmp/roadarea-visual.log; then exit 1; fi
          grep -F "ATOMIUM_ROADAREA_CONTEXT_OK" /tmp/roadarea-visual.log
      - name: Enforce player-facing anti-micro A/B
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          pairs=[
            ('hero',Path('artifacts/atomium/roadarea_hero_before.png'),Path('artifacts/atomium/roadarea_hero_after.png'),0.005),
            ('player',Path('artifacts/atomium/roadarea_player_before.png'),Path('artifacts/atomium/roadarea_player_after.png'),0.020),
          ]
          for name,a,b,min_frac in pairs:
              ia=Image.open(a).convert('RGB'); ib=Image.open(b).convert('RGB'); assert ia.size==ib.size
              changed=sum(1 for x,y in zip(ia.getdata(),ib.getdata()) if max(abs(x[i]-y[i]) for i in range(3))>3)
              total=ia.width*ia.height; frac=changed/total
              print(f'ATOMIUM_ROADAREA_AB {name} changed={changed} total={total} fraction={frac:.6f}')
              if frac < min_frac:
                  raise SystemExit(f'{name} anti-micro failed: {frac:.6f} < {min_frac:.6f}')
          PY
      - name: Upload exact source and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomium-roadarea-context-evidence
          path: |
            grand-bruxelles-game/artifacts/atomium/roadarea_context_probe.json
            grand-bruxelles-game/artifacts/atomium/roadarea_hero_before.png
            grand-bruxelles-game/artifacts/atomium/roadarea_hero_after.png
            grand-bruxelles-game/artifacts/atomium/roadarea_player_before.png
            grand-bruxelles-game/artifacts/atomium/roadarea_player_after.png
            /tmp/roadarea-visual.log
          if-no-files-found: ignore
