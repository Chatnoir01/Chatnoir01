name: Grand Bruxelles Atomium Sphere Skin Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-sphere-skin-visual.yml"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_hero_core_evidence.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_core.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_sphere_skin_semantics.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_hero_reflection_environment.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/game/tests/atomium_sphere_skin_capture_test.gd"
      - "grand-bruxelles-game/game/tests/atomium_sphere_skin_ab_compare_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-sphere-skin-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install identical capture harness in base checkout
        run: |
          cp head/grand-bruxelles-game/game/tests/atomium_sphere_skin_capture_test.gd \
             base/grand-bruxelles-game/game/tests/atomium_sphere_skin_capture_test.gd
      - name: Import base and head projects
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/base-import.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/base-import.log /tmp/head-import.log; then exit 1; fi
      - name: Capture deterministic BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path base/grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/atomium_sphere_skin_capture_test.gd -- /tmp/atomium-sphere-before.png 2>&1 | tee /tmp/base-capture.log
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path head/grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/atomium_sphere_skin_capture_test.gd -- /tmp/atomium-sphere-after.png 2>&1 | tee /tmp/head-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_SPHERE_SKIN_CAPTURE_FAIL" /tmp/base-capture.log /tmp/head-capture.log; then exit 1; fi
          grep -F "ATOMIUM_SPHERE_SKIN_CAPTURE_OK" /tmp/base-capture.log
          grep -F "ATOMIUM_SPHERE_SKIN_CAPTURE_OK" /tmp/head-capture.log
          test -f /tmp/atomium-sphere-before.png
          test -f /tmp/atomium-sphere-after.png
      - name: Reject invisible or global visual deltas
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path head/grand-bruxelles-game \
            --script res://game/tests/atomium_sphere_skin_ab_compare_test.gd -- \
            /tmp/atomium-sphere-before.png /tmp/atomium-sphere-after.png 2>&1 | tee /tmp/atomium-sphere-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_SPHERE_SKIN_AB_FAIL" /tmp/atomium-sphere-ab.log; then exit 1; fi
          grep -F "ATOMIUM_SPHERE_SKIN_AB_OK" /tmp/atomium-sphere-ab.log
      - name: Stage witness evidence
        run: |
          mkdir -p head/grand-bruxelles-game/artifacts/qa/atomium_sphere_skin_ab
          cp /tmp/atomium-sphere-before.png head/grand-bruxelles-game/artifacts/qa/atomium_sphere_skin_ab/before.png
          cp /tmp/atomium-sphere-after.png head/grand-bruxelles-game/artifacts/qa/atomium_sphere_skin_ab/after.png
          cp /tmp/atomium-sphere-ab.log head/grand-bruxelles-game/artifacts/qa/atomium_sphere_skin_ab/metrics.log
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-sphere-skin-ab
          path: head/grand-bruxelles-game/artifacts/qa/atomium_sphere_skin_ab
          if-no-files-found: error
