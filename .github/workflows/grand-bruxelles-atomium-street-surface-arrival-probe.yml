name: Grand Bruxelles Atomium StreetSurface Arrival Probe

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-street-surface-arrival-probe.yml"
      - "grand-bruxelles-game/game/tests/atomium_street_surface_arrival_probe_test.gd"
      - "grand-bruxelles-game/data/urbis/laeken_jette/manifest.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/street_surfaces.game.json"
      - "grand-bruxelles-game/data/environment/laeken_jette/atomium_landcover_context.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/atomium-ground-probe-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/atomium-ground-probe-import.log; then exit 1; fi
      - name: Probe official StreetSurface arrival coverage
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/atomium_street_surface_arrival_probe_test.gd 2>&1 | tee /tmp/atomium-ground-probe.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_STREET_SURFACE_ARRIVAL_PROBE_FAIL" /tmp/atomium-ground-probe.log; then exit 1; fi
          grep -F "ATOMIUM_STREET_SURFACE_ARRIVAL_PROBE_OK" /tmp/atomium-ground-probe.log
          grep -F "ATOMIUM_STREET_SURFACE_ARRIVAL_PROBE_METRICS" /tmp/atomium-ground-probe.log
