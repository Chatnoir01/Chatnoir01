name: Grand Bruxelles Atomium StreetSurface Arrival

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-street-surface-arrival.yml"
      - "grand-bruxelles-game/data/runtime/modules/atomium_street_surface_context.json"
      - "grand-bruxelles-game/game/scripts/atomium_street_surface_runtime.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_street_surface_context.gd"
      - "grand-bruxelles-game/game/tests/atomium_street_surface_arrival_witness_test.gd"
      - "grand-bruxelles-game/data/urbis/laeken_jette/manifest.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/street_surfaces.game.json"
      - "grand-bruxelles-game/data/environment/laeken_jette/atomium_landcover_context.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/atomium_dtm_terrain.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/scripts/grand_brussels_runtime_bootstrap.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1 and Pillow
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          python3 -m pip install --disable-pip-version-check pillow
      - name: Validate permanent runtime registry
        run: python3 grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/atomium-ground-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/atomium-ground-import.log; then exit 1; fi
      - name: Capture legitimate Atomium arrival BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/atomium_street_surface_arrival_witness_test.gd \
            2>&1 | tee /tmp/atomium-ground-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_STREET_SURFACE_ARRIVAL_WITNESS_FAIL" /tmp/atomium-ground-witness.log; then exit 1; fi
          grep -F "ATOMIUM_STREET_SURFACE_ARRIVAL_WITNESS_OK" /tmp/atomium-ground-witness.log
          test -s grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival/before.png
          test -s grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival/after.png
      - name: Measure locked player-visible gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          root = Path('grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival')
          before = Image.open(root / 'before.png').convert('RGB')
          after = Image.open(root / 'after.png').convert('RGB')
          if before.size != after.size or before.size != (1280, 720):
              raise SystemExit('ATOMIUM_STREET_SURFACE_ARRIVAL_AB_FAIL: capture size mismatch')

          a, b = before.load(), after.load()
          gt3_x, gt3_y, gt8 = [], [], 0
          for y in range(before.height):
              for x in range(before.width):
                  d = max(abs(a[x, y][i] - b[x, y][i]) for i in range(3))
                  if d > 3:
                      gt3_x.append(x); gt3_y.append(y)
                  if d > 8:
                      gt8 += 1

          total = before.width * before.height
          ratio3 = 100.0 * len(gt3_x) / total
          ratio8 = 100.0 * gt8 / total
          if gt3_x:
              bbox = (min(gt3_x), min(gt3_y), max(gt3_x) + 1, max(gt3_y) + 1)
              bw, bh = bbox[2] - bbox[0], bbox[3] - bbox[1]
              bbox_area = 100.0 * bw * bh / total
          else:
              bbox = (0, 0, 0, 0); bw = bh = 0; bbox_area = 0.0

          ImageChops.difference(before, after).save(root / 'diff.png')
          passed = (
              ratio3 >= 1.50 and ratio8 >= 0.75 and
              ratio3 <= 35.0 and bw >= 500 and bh >= 180 and bbox_area <= 60.0
          )
          line = (
              f'ATOMIUM_STREET_SURFACE_ARRIVAL_AB_METRICS: changed_gt3={ratio3:.6f}% '
              f'changed_gt8={ratio8:.6f}% bbox={bbox} bbox_size={bw}x{bh} '
              f'bbox_area={bbox_area:.4f}% floor3=1.50% floor8=0.75% '
              f'bbox_floor=500x180 changed_ceiling=35.0% bbox_ceiling=60.0% '
              f'numerical_gate={"PASS" if passed else "FAIL"}\n'
          )
          (root / 'metrics.log').write_text(line, encoding='utf-8')
          print(line, end='')
          PY
          cp /tmp/atomium-ground-witness.log grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival/witness.log
      - name: Upload full-frame A-B evidence
        uses: actions/upload-artifact@v4
        with:
          name: atomium-street-surface-arrival-player-ab
          path: grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival
          if-no-files-found: error
      - name: Enforce locked numerical gate
        run: grep -F "numerical_gate=PASS" grand-bruxelles-game/artifacts/qa/atomium_street_surface_arrival/metrics.log
