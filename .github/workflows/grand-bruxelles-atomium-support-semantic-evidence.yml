name: Grand Bruxelles Atomium Support Semantic Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-atomium-support-semantic-evidence.yml"
      - "grand-bruxelles-game/data/sources/laeken_jette/atomium_support_semantic_evidence.json"
      - "grand-bruxelles-game/game/tests/atomium_support_semantic_evidence_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-support-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate Atomium support semantics
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/atomium_support_semantic_evidence_test.gd 2>&1 | tee /tmp/atomium-support-evidence.log
          if grep -E "SCRIPT ERROR|Parse Error:|ATOMIUM_SUPPORT_EVIDENCE_FAIL" /tmp/atomium-support-evidence.log; then exit 1; fi
          grep -F "ATOMIUM_SUPPORT_EVIDENCE_OK" /tmp/atomium-support-evidence.log
      - name: Upload evidence log
        uses: actions/upload-artifact@v4
        with:
          name: atomium-support-semantic-evidence
          path: /tmp/atomium-support-evidence.log
          if-no-files-found: error
