name: Grand Bruxelles Auderghem Road Source Acquisition

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/source_plans/brussels_missing_road_source_acquisition_evidence.lock.json'
      - 'grand-bruxelles-game/tests/test_brussels_missing_road_source_acquisition_evidence_lock.py'
      - '.github/workflows/grand-bruxelles-auderghem-road-source-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-locked-auderghem-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate immutable Auderghem acquisition evidence
        run: python -m pytest -q tests/test_brussels_missing_road_source_acquisition_evidence_lock.py

  reacquire-auderghem-road-source:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-locked-auderghem-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reacquire source-backed Auderghem roads explicitly
        run: |
          python tools/city_machine/acquire_municipality_road_source.py \
            --manifest data/source_plans/auderghem_road_source_acquisition.json \
            --raw-output artifacts/auderghem_road_source.raw.json \
            --game-output artifacts/auderghem_road_source.game.json \
            --receipt-output artifacts/auderghem_road_source.receipt.json
      - name: Upload explicit reacquisition candidate
        uses: actions/upload-artifact@v4
        with:
          name: auderghem-road-source-reacquisition
          path: |
            grand-bruxelles-game/artifacts/auderghem_road_source.raw.json
            grand-bruxelles-game/artifacts/auderghem_road_source.game.json
            grand-bruxelles-game/artifacts/auderghem_road_source.receipt.json
          if-no-files-found: error
          retention-days: 30
