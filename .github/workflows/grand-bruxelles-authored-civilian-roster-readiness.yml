name: Grand Bruxelles Authored Civilian Roster Readiness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/assets/characters/civilians/**"
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/data/qa/authored_civilian_roster_readiness_contract.json"
      - "grand-bruxelles-game/tools/tests/test_authored_civilian_roster_readiness_contract.py"
      - ".github/workflows/grand-bruxelles-authored-civilian-roster-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-civilian-roster-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify CIV-1 provenance and runtime readiness contract
        working-directory: grand-bruxelles-game
        run: python3 tools/tests/test_authored_civilian_roster_readiness_contract.py

      - name: Verify repository remained clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
