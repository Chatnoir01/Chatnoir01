name: Grand Bruxelles Automatic Road Collision Owner

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_collision_owner_test.gd"
      - ".github/workflows/grand-bruxelles-automatic-road-collision-owner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-owner-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "${{ github.event.pull_request.base.sha }}"

      - name: Install exact official Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Prove road-scoped collision ownership
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://game/tests/automatic_road_collision_owner_test.gd 2>&1 | tee /tmp/automatic-road-collision-owner.log
          grep -F 'AUTOMATIC_ROAD_COLLISION_OWNER_GREEN:' /tmp/automatic-road-collision-owner.log
