name: Grand Bruxelles Automatic Road Player Witness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_direct_spawn_witness_test.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_359177328_source_context_balance_test.gd"
      - "grand-bruxelles-game/tests/test_automatic_road_359177328_source_context_workflow_contract.py"
      - "grand-bruxelles-game/data/qa/corridor/automatic_road_359177328_human_review.json"
      - "grand-bruxelles-game/tests/test_automatic_road_359177328_human_review_veto.py"
      - "grand-bruxelles-game/tests/test_automatic_road_player_witness_workflow_contract.py"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-automatic-road-player-witness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require branch built from live main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main" || { echo "AUTOMATIC_ROAD_PLAYER_WITNESS_STALE_MAIN live_main=$live_main pr_head=$PR_HEAD_SHA merge_base=$merge_base"; exit 1; }
      - name: Require player-witness workflow contract
        working-directory: grand-bruxelles-game
        run: python3 tests/test_automatic_road_player_witness_workflow_contract.py
      - name: Bind canonical human veto before capture
        working-directory: grand-bruxelles-game
        run: |
          python3 tests/test_automatic_road_359177328_human_review_veto.py
          echo "AUTOMATIC_ROAD_359177328_HUMAN_VETO_BOUND"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/Godot_v4.7.1-stable_linux.x86_64.zip
          GODOT_DIR=/tmp/godot
          GODOT_URL=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          rm -f "$GODOT_ZIP"; rm -rf "$GODOT_DIR"; mkdir -p "$GODOT_DIR"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 "$GODOT_URL" --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64"
          "$GODOT_DIR/Godot_v4.7.1-stable_linux.x86_64" --version
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/automatic-road-witness-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/automatic-road-witness-import.log; then exit 1; fi
      - name: Capture source-backed road-359177328 player witness
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/automatic_road_direct_spawn_witness_test.gd 2>&1 | tee /tmp/automatic-road-player-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_DIRECT_SPAWN_WITNESS_FAIL" /tmp/automatic-road-player-witness.log; then exit 1; fi
          grep -q "AUTOMATIC_ROAD_DIRECT_SPAWN_WITNESS_GREEN" /tmp/automatic-road-player-witness.log
          grep -F "animation_driver=" /tmp/automatic-road-player-witness.log
      - name: Stage exact player-view evidence
        if: always()
        run: |
          set -euo pipefail
          png="grand-bruxelles-game/artifacts/visual/automatic_road_359177328_player.png"
          diagnostic="grand-bruxelles-game/artifacts/visual/automatic_road_359177328_player_animation_diagnostic.json"
          stage="/tmp/automatic-road-player-evidence"
          rm -rf "$stage"; mkdir -p "$stage"
          if [[ -s /tmp/automatic-road-player-witness.log ]]; then cp /tmp/automatic-road-player-witness.log "$stage/automatic-road-player-witness.log"; else printf '%s\n' "AUTOMATIC_ROAD_PLAYER_WITNESS_DIAGNOSTIC_MISSING: runtime log was not produced" > "$stage/automatic-road-player-witness.log"; fi
          if [[ -s "$diagnostic" ]]; then cp "$diagnostic" "$stage/automatic_road_359177328_player_animation_diagnostic.json"; else printf '%s\n' '{"schema":"grand-bruxelles-automatic-road-player-animation-diagnostic-v1","status":"diagnostic_missing","qa_witness_accepted":false,"playability_claimed":false,"destination_advertisable":false,"jouable_authorized":false}' > "$stage/automatic_road_359177328_player_animation_diagnostic.json"; fi
          python3 - "$stage/automatic_road_359177328_player_animation_diagnostic.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("schema")=="grand-bruxelles-automatic-road-player-animation-diagnostic-v1"
          for key in ("qa_witness_accepted","playability_claimed","destination_advertisable","jouable_authorized"): assert d.get(key) is False,key
          PY
          if [[ -s "$png" ]]; then cp "$png" "$stage/automatic_road_359177328_player.png"; fi
          cd "$stage"
          find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt
          test "$(wc -l < evidence-sha256.txt)" -ge 2
          sha256sum --check evidence-sha256.txt
      - name: Upload exact player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-359177328-player-witness
          path: /tmp/automatic-road-player-evidence/
          if-no-files-found: error
