name: Grand Bruxelles Automatic Road Player Witness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_direct_spawn_witness_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-automatic-road-player-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require branch built from live main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main" || {
            echo "AUTOMATIC_ROAD_PLAYER_WITNESS_STALE_MAIN live_main=$live_main pr_head=$PR_HEAD_SHA merge_base=$merge_base"
            exit 1
          }
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/automatic-road-witness-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/automatic-road-witness-import.log; then exit 1; fi
      - name: Capture source-backed road-359177328 player witness
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/automatic_road_direct_spawn_witness_test.gd 2>&1 | tee /tmp/automatic-road-player-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_DIRECT_SPAWN_WITNESS_FAIL" /tmp/automatic-road-player-witness.log; then exit 1; fi
          grep -q "AUTOMATIC_ROAD_DIRECT_SPAWN_WITNESS_GREEN" /tmp/automatic-road-player-witness.log
      - name: Stage exact player-view evidence
        run: |
          set -euo pipefail
          png="grand-bruxelles-game/artifacts/visual/automatic_road_359177328_player.png"
          test -s "$png"
          python3 - "$png" <<'PY'
          import struct, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              sig = f.read(8)
              if sig != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit("witness is not a PNG")
              length = struct.unpack(">I", f.read(4))[0]
              kind = f.read(4)
              if kind != b"IHDR" or length != 13:
                  raise SystemExit("missing PNG IHDR")
              width, height = struct.unpack(">II", f.read(8))
          if (width, height) != (1280, 720):
              raise SystemExit(f"unexpected witness dimensions: {width}x{height}")
          print(f"AUTOMATIC_ROAD_PLAYER_WITNESS_FILE_OK: {width}x{height} path={p}")
          PY
          rm -rf /tmp/automatic-road-player-evidence
          mkdir -p /tmp/automatic-road-player-evidence
          cp "$png" /tmp/automatic-road-player-evidence/automatic_road_359177328_player.png
          cp /tmp/automatic-road-player-witness.log /tmp/automatic-road-player-evidence/automatic-road-player-witness.log
          test -s /tmp/automatic-road-player-evidence/automatic_road_359177328_player.png
      - name: Upload exact player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-359177328-player-witness
          path: /tmp/automatic-road-player-evidence/
          if-no-files-found: error
