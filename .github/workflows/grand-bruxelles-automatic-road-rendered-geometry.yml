name: Grand Bruxelles Automatic Road Rendered Geometry

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_rendered_geometry_test.gd"
      - ".github/workflows/grand-bruxelles-automatic-road-rendered-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-geometry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          live_main="$(git rev-parse origin/main)"
          base="$(git merge-base HEAD origin/main)"
          echo "live_main=$live_main"
          echo "merge_base=$base"
          test "$base" = "$live_main"

      - name: Install exact official Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/Godot_v4.7.1-stable_linux.x86_64.zip
          GODOT_URL=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          rm -f "$GODOT_ZIP"
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 "$GODOT_URL" --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Prove rendered-road geometry contract
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://game/tests/automatic_road_rendered_geometry_test.gd 2>&1 | tee /tmp/automatic-road-rendered-geometry.log
          grep -F 'AUTOMATIC_ROAD_RENDERED_GEOMETRY_GREEN:' /tmp/automatic-road-rendered-geometry.log
