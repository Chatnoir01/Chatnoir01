name: Grand Bruxelles Automatic Road Source Lookup

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd'
      - 'grand-bruxelles-game/game/tests/automatic_road_source_lookup_auth_test.gd'
      - 'grand-bruxelles-game/tests/test_automatic_road_source_lookup_workflow.py'
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/city_machine/road_cell_coverage_candidates.json'
      - 'grand-bruxelles-game/data/osm/vertical_slice_01.game.json'
      - '.github/workflows/grand-bruxelles-automatic-road-source-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automatic-road-source-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: automatic road source lookup checked out merge-ref/stale commit instead of exact PR head" >&2
            echo "actual=$(git rev-parse HEAD) expected=${{ github.event.pull_request.head.sha }}" >&2
            exit 1
          }
      - name: Require exact live-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD || {
            echo "RED: automatic road source lookup candidate does not contain live main" >&2
            echo "live_main=$LIVE_MAIN_SHA head=$(git rev-parse HEAD)" >&2
            exit 1
          }
          echo "AUTOMATIC_ROAD_SOURCE_LOOKUP_LIVE_MAIN_OK: live_main=$LIVE_MAIN_SHA head=$(git rev-parse HEAD)"
      - name: Run automatic road workflow contract regression
        shell: bash
        run: python grand-bruxelles-game/tests/test_automatic_road_source_lookup_workflow.py
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/automatic-road-source-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/automatic-road-source-import.log
      - name: Validate source-only indexed road binding
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/automatic_road_source_lookup_auth_test.gd 2>&1 | tee /tmp/automatic-road-source-lookup.log
          grep -q 'AUTOMATIC_ROAD_SOURCE_LOOKUP_AUTH_OK' /tmp/automatic-road-source-lookup.log
          grep -q 'source_lookup_only=true' /tmp/automatic-road-source-lookup.log
          grep -q 'playable_catalog=false' /tmp/automatic-road-source-lookup.log
          grep -q 'current_source_bound=true' /tmp/automatic-road-source-lookup.log
          grep -q 'fail_closed=true' /tmp/automatic-road-source-lookup.log
          grep -q 'player_unchanged=true' /tmp/automatic-road-source-lookup.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script|AUTOMATIC_ROAD_SOURCE_LOOKUP_AUTH_FAIL' /tmp/automatic-road-source-lookup.log
