name: Grand Bruxelles Automatic Road Source Tradeoff Handoff Contract

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/grand-bruxelles-automatic-road-source-longitudinal-safety-tradeoff.yml"
      - ".github/workflows/grand-bruxelles-automatic-road-source-tradeoff-handoff-contract.yml"
      - "grand-bruxelles-game/game/tests/test_automatic_road_source_tradeoff_handoff_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "${{ github.event.pull_request.base.sha }}"

      - name: Verify byte-bound fail-closed source blocker handoff
        shell: bash
        run: python3 grand-bruxelles-game/game/tests/test_automatic_road_source_tradeoff_handoff_contract.py
