name: Grand Bruxelles Automatic Road Source Urban Context Longitudinal Coverage

on:
  pull_request:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_source_urban_context_longitudinal_coverage_test.gd"
      - ".github/workflows/grand-bruxelles-automatic-road-source-urban-context-longitudinal-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-urban-context-longitudinal-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "${{ github.event.pull_request.base.sha }}"

      - name: Install exact official Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project for deterministic class/resource state
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path . --quit-after 1

      - name: Probe balanced player context along exact Anneessens source geometry
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script res://game/tests/automatic_road_source_urban_context_longitudinal_coverage_test.gd 2>&1 | tee /tmp/automatic-road-source-urban-context-longitudinal-coverage.log
          grep -F 'AUTOMATIC_ROAD_SOURCE_URBAN_CONTEXT_LONGITUDINAL_COVERAGE_GREEN:' /tmp/automatic-road-source-urban-context-longitudinal-coverage.log

      - name: Persist exact longitudinal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-source-urban-context-longitudinal-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/automatic-road-source-urban-context-longitudinal-coverage.log
          if-no-files-found: error
          retention-days: 14
