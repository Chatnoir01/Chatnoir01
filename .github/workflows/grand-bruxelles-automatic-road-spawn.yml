name: Grand Bruxelles Automatic Road Spawn

on:
  pull_request:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_direct_spawn_test.gd"
      - "grand-bruxelles-game/game/tests/validate_automatic_road_player_authority.gd"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/data/osm/**"
      - "grand-bruxelles-game/tools/test_automatic_road_player_visual_gate.py"
      - ".github/workflows/grand-bruxelles-web.yml"
      - ".github/workflows/grand-bruxelles-automatic-road-spawn.yml"

permissions:
  contents: read

jobs:
  automatic-road-spawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify live-main continuity
        shell: bash
        env:
          GB_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GB_EVIDENCE_HEAD_SHA"
          git fetch --no-tags origin main
          GB_EVIDENCE_BASE_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$GB_EVIDENCE_BASE_SHA" "$GB_EVIDENCE_HEAD_SHA"; then
            echo "AUTOMATIC_ROAD_RUNTIME_FAIL: candidate does not contain live main: base=$GB_EVIDENCE_BASE_SHA head=$GB_EVIDENCE_HEAD_SHA" >&2
            exit 1
          fi
          echo "AUTOMATIC_ROAD_RUNTIME_BASE_OK base=$GB_EVIDENCE_BASE_SHA head=$GB_EVIDENCE_HEAD_SHA"

      - name: Enforce route-vs-player-review separation contract
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/test_automatic_road_player_visual_gate.py

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 xvfb

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/automatic-road-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/automatic-road-import.log; then exit 1; fi

      - name: Prove authoritative Player ownership topology
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/validate_automatic_road_player_authority.gd \
            2>&1 | tee /tmp/automatic-road-player-authority.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_PLAYER_AUTHORITY_FAIL" /tmp/automatic-road-player-authority.log; then exit 1; fi
          grep -F "AUTOMATIC_ROAD_PLAYER_AUTHORITY_OK" /tmp/automatic-road-player-authority.log

      - name: Prove source-backed rendered-road and collision readiness
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/automatic_road_direct_spawn_test.gd \
            2>&1 | tee /tmp/automatic-road-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_DIRECT_SPAWN_FAIL" /tmp/automatic-road-spawn.log; then exit 1; fi
          grep -F "AUTOMATIC_ROAD_RUNTIME_READY_GREEN" /tmp/automatic-road-spawn.log
          grep -F "lookup=deterministic_runtime_index" /tmp/automatic-road-spawn.log
          grep -F "playability_claimed=false" /tmp/automatic-road-spawn.log
          grep -F "AUTOMATIC_ROAD_PLAYER_WITNESS_HOLD" /tmp/automatic-road-spawn.log
          grep -F "qa_witness_accepted=false" /tmp/automatic-road-spawn.log
          grep -F "destination_advertisable=false" /tmp/automatic-road-spawn.log
          grep -F "jouable=false" /tmp/automatic-road-spawn.log

      - name: Verify safe Web request grammar
        run: |
          grep -F "const DIRECT_SPAWN_ROAD = /^road-[1-9][0-9]{0,17}$/.test(DIRECT_SPAWN || '');" .github/workflows/grand-bruxelles-web.yml
          grep -F "const DIRECT_SPAWN_STREETAXIS = /^streetaxis-[1-9][0-9]{0,17}$/.test(DIRECT_SPAWN || '');" .github/workflows/grand-bruxelles-web.yml
          grep -F "if (DIRECT_SPAWN_STATIC || DIRECT_SPAWN_ROAD || DIRECT_SPAWN_STREETAXIS)" .github/workflows/grand-bruxelles-web.yml
          ! grep -E "spawn=.*(x=|y=|z=|lat=|lon=)" .github/workflows/grand-bruxelles-web.yml