name: Grand Bruxelles Automatic Road Spawn

on:
  pull_request:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_direct_spawn_test.gd"
      - "grand-bruxelles-game/data/osm/**"
      - ".github/workflows/grand-bruxelles-web.yml"
      - ".github/workflows/grand-bruxelles-automatic-road-spawn.yml"

permissions:
  contents: read

jobs:
  automatic-road-spawn:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 xvfb

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/automatic-road-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/automatic-road-import.log; then exit 1; fi

      - name: Prove generic source-backed road destinations
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/automatic_road_direct_spawn_test.gd \
            2>&1 | tee /tmp/automatic-road-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_DIRECT_SPAWN_FAIL" /tmp/automatic-road-spawn.log; then exit 1; fi
          grep -F "AUTOMATIC_ROAD_DIRECT_SPAWN_GREEN" /tmp/automatic-road-spawn.log

      - name: Verify safe Web request grammar
        run: |
          grep -F "const DIRECT_SPAWN_ROAD = /^road-[1-9][0-9]{0,17}$/.test(DIRECT_SPAWN || '');" .github/workflows/grand-bruxelles-web.yml
          grep -F "if (DIRECT_SPAWN_STATIC || DIRECT_SPAWN_ROAD)" .github/workflows/grand-bruxelles-web.yml
          ! grep -E "spawn=.*(x=|y=|z=)" .github/workflows/grand-bruxelles-web.yml

      - name: Upload gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-spawn-evidence
          path: |
            /tmp/automatic-road-import.log
            /tmp/automatic-road-spawn.log
          if-no-files-found: error
          retention-days: 14
