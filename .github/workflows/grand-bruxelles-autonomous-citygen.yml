name: Grand Bruxelles Autonomous CityGen

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum regional cells to advance in this pass"
        required: false
        default: "4"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/autonomous_citygen.py"
      - "grand-bruxelles-game/tools/citygen/test_autonomous_citygen.py"
      - "grand-bruxelles-game/tools/citygen/build_cell_candidate_package.py"
      - "grand-bruxelles-game/tools/citygen/test_build_cell_candidate_package.py"
      - "grand-bruxelles-game/tools/citygen/build_brussels_regional_grid.py"
      - "grand-bruxelles-game/tools/citygen/test_build_brussels_regional_grid.py"
      - "grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py"
      - "grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py"
      - "grand-bruxelles-game/tools/citygen/build_cell_elevation_requirements.py"
      - "grand-bruxelles-game/tools/citygen/test_build_cell_elevation_requirements.py"
      - "grand-bruxelles-game/tools/citygen/resolve_cell_elevation_sources.py"
      - "grand-bruxelles-game/tools/citygen/test_resolve_cell_elevation_sources.py"
      - "grand-bruxelles-game/tools/citygen/validate_cell_elevation_archives.py"
      - "grand-bruxelles-game/tools/citygen/test_validate_cell_elevation_archives.py"
      - ".github/workflows/grand-bruxelles-autonomous-citygen.yml"

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-autonomous-citygen
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Autonomous scheduler regression
        run: python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen.py
      - name: Per-cell candidate package regression
        run: python3 grand-bruxelles-game/tools/citygen/test_build_cell_candidate_package.py
      - name: Regional target-grid regression
        run: python3 grand-bruxelles-game/tools/citygen/test_build_brussels_regional_grid.py
      - name: Missing-source materialization regression
        run: python3 grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py
      - name: Cell elevation-requirements regression
        run: python3 grand-bruxelles-game/tools/citygen/test_build_cell_elevation_requirements.py
      - name: Cell elevation-source resolution regression
        run: python3 grand-bruxelles-game/tools/citygen/test_resolve_cell_elevation_sources.py
      - name: Cell elevation-archive validation regression
        run: python3 grand-bruxelles-game/tools/citygen/test_validate_cell_elevation_archives.py
      - name: Existing city-generation guardrails
        run: |
          python3 grand-bruxelles-game/tools/city_generation/test_generate_facade_candidates.py
          python3 grand-bruxelles-game/tools/city_generation/test_apply_facade_rules.py
          python3 grand-bruxelles-game/tools/city_generation/test_build_mass_candidate_manifest.py
          python3 grand-bruxelles-game/tools/city_generation/test_build_candidate_qa_queue.py

  scheduled-pass:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover durable scheduler state and accumulated caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-prev
          if git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state 2>/dev/null; then
            git show origin/citygen-autonomous-state:grand-bruxelles-game/data/qa/autonomous_citygen_state.json > /tmp/citygen-prev/state.json || true
            for CACHE in autonomous_sources autonomous_candidates; do
              if git ls-tree -r --name-only origin/citygen-autonomous-state -- "grand-bruxelles-game/data/qa/${CACHE}" | grep -q .; then
                git archive origin/citygen-autonomous-state "grand-bruxelles-game/data/qa/${CACHE}" | tar -x -C /tmp/citygen-prev
              fi
            done
            if [ -d /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources ]; then
              mkdir -p grand-bruxelles-game/data/urbis/remaining_brussels/cells
              cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources/. grand-bruxelles-game/data/urbis/remaining_brussels/cells/
            fi
          fi
      - name: Derive official Brussels regional target grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-boundaries /tmp/citygen-out
          python3 grand-bruxelles-game/tools/citygen/build_brussels_regional_grid.py \
            --boundary-dir /tmp/citygen-boundaries \
            --fetch-official \
            --output /tmp/citygen-out/brussels_regional_target_grid.json
      - name: Select next Brussels cells fail-closed
        shell: bash
        env:
          INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          BATCH="${INPUT_BATCH_SIZE:-4}"
          STATE_ARGS=()
          if [ -s /tmp/citygen-prev/state.json ]; then STATE_ARGS=(--state /tmp/citygen-prev/state.json); fi
          python3 grand-bruxelles-game/tools/citygen/autonomous_citygen.py \
            --source-root grand-bruxelles-game/data/urbis/remaining_brussels/cells \
            --maturity-root grand-bruxelles-game/data/cell_manifests \
            --target-grid /tmp/citygen-out/brussels_regional_target_grid.json \
            "${STATE_ARGS[@]}" \
            --output-dir /tmp/citygen-out \
            --batch-size "$BATCH"
          cat /tmp/citygen-out/worklist.txt
      - name: Extract missing-source work with canonical bboxes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/citygen-out/autonomous_citygen_report.json').read_text())
          selected=set(report['selected_batch'])
          rows=[]
          for cell in report['cells']:
              if cell['cell_id'] in selected and cell['state']=='MISSING_SOURCE':
                  bbox=cell.get('bbox')
                  if not isinstance(bbox,list) or len(bbox)!=4:
                      raise SystemExit(f"missing source has no canonical bbox: {cell['cell_id']}")
                  rows.append(cell['cell_id']+'\t'+','.join(str(v) for v in bbox))
          Path('/tmp/citygen-out/missing_source_worklist.tsv').write_text(''.join(row+'\n' for row in rows))
          print(f'MISSING_SOURCE_WORKLIST_OK cells={len(rows)}')
          PY
      - name: Materialize selected missing UrbIS source cells
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r CELL BBOX; do
            [ -n "$CELL" ] || continue
            python3 grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py \
              --cell-id "$CELL" \
              --bbox "$BBOX" \
              --output-dir "grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
          done < /tmp/citygen-out/missing_source_worklist.tsv
      - name: Derive elevation evidence requirements for selected cells
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            CELL_DIR="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            [ -f "${CELL_DIR}/manifest.json" ] || { echo "selected source missing after materialization: ${CELL}"; exit 1; }
            python3 grand-bruxelles-game/tools/citygen/build_cell_elevation_requirements.py \
              --cell-dir "$CELL_DIR" \
              --output "${CELL_DIR}/elevation_requirements.json"
          done < /tmp/citygen-out/worklist.txt
      - name: Resolve exact official elevation archives for selected cells
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/citygen-out/elevation-resolution-errors
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            CELL_DIR="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            for KIND in dsm dtm; do
              ERROR="/tmp/citygen-out/elevation-resolution-errors/${CELL}-${KIND}.txt"
              if python3 grand-bruxelles-game/tools/citygen/resolve_cell_elevation_sources.py \
                --requirements "${CELL_DIR}/elevation_requirements.json" \
                --kind "$KIND" \
                --output "${CELL_DIR}/elevation_${KIND}_resolution.json" >"${ERROR}.log" 2>&1; then
                rm -f "$ERROR" "${ERROR}.log"
              else
                { echo "resolution_pending kind=${KIND} cell=${CELL}"; cat "${ERROR}.log"; } > "$ERROR"
                rm -f "${CELL_DIR}/elevation_${KIND}_resolution.json"
                echo "ELEVATION_SOURCE_RESOLUTION_PENDING ${CELL} ${KIND}"
              fi
            done
          done < /tmp/citygen-out/worklist.txt
      - name: Download hash and structurally validate resolved elevation archives
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/citygen-elevation-archive-cache /tmp/citygen-out/elevation-archive-errors
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            CELL_DIR="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            for KIND in dsm dtm; do
              RESOLUTION="${CELL_DIR}/elevation_${KIND}_resolution.json"
              [ -f "$RESOLUTION" ] || continue
              ERROR="/tmp/citygen-out/elevation-archive-errors/${CELL}-${KIND}.txt"
              if python3 grand-bruxelles-game/tools/citygen/validate_cell_elevation_archives.py \
                --resolution "$RESOLUTION" \
                --work-dir /tmp/citygen-elevation-archive-cache \
                --output "${CELL_DIR}/elevation_${KIND}_archive_validation.json" >"${ERROR}.log" 2>&1; then
                rm -f "$ERROR" "${ERROR}.log"
              else
                { echo "archive_validation_pending kind=${KIND} cell=${CELL}"; cat "${ERROR}.log"; } > "$ERROR"
                rm -f "${CELL_DIR}/elevation_${KIND}_archive_validation.json"
                echo "ELEVATION_ARCHIVE_VALIDATION_PENDING ${CELL} ${KIND}"
              fi
            done
          done < /tmp/citygen-out/worklist.txt
      - name: Build authoritative candidate package for each selected cell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-out/candidates
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            MATURITY="grand-bruxelles-game/data/cell_manifests/${CELL}.json"
            MATURITY_ARGS=()
            if [ -f "$MATURITY" ]; then MATURITY_ARGS=(--maturity "$MATURITY"); fi
            python3 grand-bruxelles-game/tools/citygen/build_cell_candidate_package.py \
              --cell-dir "grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}" \
              "${MATURITY_ARGS[@]}" \
              --output "/tmp/citygen-out/candidates/${CELL}.json"
          done < /tmp/citygen-out/worklist.txt
      - name: Cross-check generated package count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          work=[x.strip() for x in Path('/tmp/citygen-out/worklist.txt').read_text().splitlines() if x.strip()]
          packages=sorted(p.stem for p in Path('/tmp/citygen-out/candidates').glob('*.json'))
          if sorted(work) != packages:
              raise SystemExit(f'candidate package mismatch work={sorted(work)} packages={packages}')
          print(f'AUTONOMOUS_CELL_PACKAGES_OK selected={len(work)} packages={len(packages)}')
          PY
      - name: Stage selected source cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-selected-sources
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            cp -a "grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}" "/tmp/citygen-selected-sources/${CELL}"
          done < /tmp/citygen-out/worklist.txt
      - name: Persist autonomous progress off main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C citygen-autonomous-state
          mkdir -p grand-bruxelles-game/data/qa/autonomous_candidates grand-bruxelles-game/data/qa/autonomous_sources
          cp /tmp/citygen-out/autonomous_citygen_state.json grand-bruxelles-game/data/qa/autonomous_citygen_state.json
          cp /tmp/citygen-out/autonomous_citygen_report.json grand-bruxelles-game/data/qa/autonomous_citygen_latest_report.json
          cp /tmp/citygen-out/worklist.txt grand-bruxelles-game/data/qa/autonomous_citygen_worklist.txt
          cp /tmp/citygen-out/brussels_regional_target_grid.json grand-bruxelles-game/data/qa/brussels_regional_target_grid.json
          cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_candidates/. grand-bruxelles-game/data/qa/autonomous_candidates/ 2>/dev/null || true
          cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources/. grand-bruxelles-game/data/qa/autonomous_sources/ 2>/dev/null || true
          cp /tmp/citygen-out/candidates/*.json grand-bruxelles-game/data/qa/autonomous_candidates/ 2>/dev/null || true
          cp -a /tmp/citygen-selected-sources/. grand-bruxelles-game/data/qa/autonomous_sources/ 2>/dev/null || true
          git add grand-bruxelles-game/data/qa/autonomous_citygen_state.json grand-bruxelles-game/data/qa/autonomous_citygen_latest_report.json grand-bruxelles-game/data/qa/autonomous_citygen_worklist.txt grand-bruxelles-game/data/qa/brussels_regional_target_grid.json grand-bruxelles-game/data/qa/autonomous_candidates grand-bruxelles-game/data/qa/autonomous_sources
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "citygen: persist autonomous scheduler pass"
          git push --force-with-lease origin citygen-autonomous-state
      - name: Upload CityGen pass evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-citygen-pass-${{ github.run_number }}
          path: /tmp/citygen-out/
          retention-days: 30
