name: Grand Bruxelles Autonomous CityGen

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum regional cells to advance in this pass"
        required: false
        default: "4"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/**"
      - ".github/workflows/grand-bruxelles-autonomous-citygen.yml"

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-autonomous-citygen
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Autonomous CityGen regressions
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_post_mutation_refresh.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_elevation_requirement_isolation.py
          python3 grand-bruxelles-game/tools/citygen/test_build_cell_candidate_package.py
          python3 grand-bruxelles-game/tools/citygen/test_build_brussels_regional_grid.py
          python3 grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py
          python3 grand-bruxelles-game/tools/citygen/test_build_cell_elevation_requirements.py
          python3 grand-bruxelles-game/tools/citygen/test_resolve_cell_elevation_sources.py
          python3 grand-bruxelles-game/tools/citygen/test_validate_cell_elevation_archives.py
          python3 grand-bruxelles-game/tools/citygen/test_validate_cell_elevation_rasters.py
          python3 grand-bruxelles-game/tools/citygen/test_assess_cell_elevation_values.py
          python3 grand-bruxelles-game/tools/citygen/test_build_cell_elevation_candidate_frontier.py
          python3 grand-bruxelles-game/tools/citygen/test_derive_cell_building_height_candidates.py
      - name: Existing city-generation guardrails
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/city_generation/test_generate_facade_candidates.py
          python3 grand-bruxelles-game/tools/city_generation/test_apply_facade_rules.py
          python3 grand-bruxelles-game/tools/city_generation/test_build_mass_candidate_manifest.py
          python3 grand-bruxelles-game/tools/city_generation/test_build_candidate_qa_queue.py

  scheduled-pass:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover durable scheduler state and accumulated caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-prev
          if git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state 2>/dev/null; then
            git show origin/citygen-autonomous-state:grand-bruxelles-game/data/qa/autonomous_citygen_state.json > /tmp/citygen-prev/state.json || true
            for CACHE in autonomous_sources autonomous_candidates; do
              if git ls-tree -r --name-only origin/citygen-autonomous-state -- "grand-bruxelles-game/data/qa/${CACHE}" | grep -q .; then
                git archive origin/citygen-autonomous-state "grand-bruxelles-game/data/qa/${CACHE}" | tar -x -C /tmp/citygen-prev
              fi
            done
            if [ -d /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources ]; then
              mkdir -p grand-bruxelles-game/data/urbis/remaining_brussels/cells
              cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources/. grand-bruxelles-game/data/urbis/remaining_brussels/cells/
            fi
          fi

      - name: Derive official Brussels regional target grid
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-boundaries /tmp/citygen-out
          python3 grand-bruxelles-game/tools/citygen/build_brussels_regional_grid.py \
            --boundary-dir /tmp/citygen-boundaries \
            --fetch-official \
            --output /tmp/citygen-out/brussels_regional_target_grid.json

      - name: Select next Brussels evidence frontier
        run: |
          set -euo pipefail
          ARGS=(
            --source-root grand-bruxelles-game/data/urbis/remaining_brussels/cells
            --maturity-root grand-bruxelles-game/data/qa/citygen
            --target-grid /tmp/citygen-out/brussels_regional_target_grid.json
            --output-dir /tmp/citygen-out
            --batch-size "${{ inputs.batch_size || '4' }}"
          )
          if [ -s /tmp/citygen-prev/state.json ]; then
            ARGS+=(--state /tmp/citygen-prev/state.json)
          fi
          python3 grand-bruxelles-game/tools/citygen/autonomous_citygen.py "${ARGS[@]}"

      - name: Materialize selected missing UrbIS cells
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/citygen-out/autonomous_citygen_report.json').read_text())
          rows={row['cell_id']:row for row in report['cells']}
          for cell in report['selected_batch']:
              row=rows[cell]
              if row['state']!='MISSING_SOURCE':
                  continue
              import subprocess
              cmd=[
                  'python3','grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py',
                  '--cell-id',cell,
                  '--bbox',*[str(v) for v in row['bbox']],
                  '--output-dir',f'grand-bruxelles-game/data/urbis/remaining_brussels/cells/{cell}',
              ]
              subprocess.run(cmd,check=True)
          PY

      - name: Derive and resolve elevation requirements
        run: |
          set -u
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            python3 grand-bruxelles-game/tools/citygen/build_cell_elevation_requirements.py \
              --cell-dir "$D" --output "$D/elevation_requirements.json" || { rm -f "$D/elevation_requirements.json"; continue; }
            python3 grand-bruxelles-game/tools/citygen/resolve_cell_elevation_sources.py \
              --requirements "$D/elevation_requirements.json" \
              --dsm-output "$D/elevation_dsm_resolution.json" \
              --dtm-output "$D/elevation_dtm_resolution.json" || { rm -f "$D/elevation_dsm_resolution.json" "$D/elevation_dtm_resolution.json"; continue; }
          done < /tmp/citygen-out/worklist.txt

      - name: Download hash and structurally validate official archives
        run: |
          set -u
          mkdir -p /tmp/citygen-archives /tmp/citygen-archive-extract
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            DSM="$D/elevation_dsm_resolution.json"; DTM="$D/elevation_dtm_resolution.json"
            [ -f "$DSM" ] && [ -f "$DTM" ] || continue
            python3 grand-bruxelles-game/tools/citygen/validate_cell_elevation_archives.py \
              --dsm-resolution "$DSM" --dtm-resolution "$DTM" \
              --archive-dir /tmp/citygen-archives --extract-dir /tmp/citygen-archive-extract \
              --dsm-output "$D/elevation_dsm_archive_validation.json" \
              --dtm-output "$D/elevation_dtm_archive_validation.json" || {
                rm -f "$D/elevation_dsm_archive_validation.json" "$D/elevation_dtm_archive_validation.json"; continue;
              }
          done < /tmp/citygen-out/worklist.txt

      - name: Prepare raster value stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy
          python3 - <<'PY'
          try:
              import rasterio  # noqa
          except Exception:
              raise SystemExit(0)
          Path('/tmp/citygen-rasterio-ready').write_text('1')
          PY
        shell: bash

      - name: Validate georasters and assess source values
        run: |
          set -u
          mkdir -p /tmp/citygen-raster-extract
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            DA="$D/elevation_dsm_archive_validation.json"; TA="$D/elevation_dtm_archive_validation.json"
            [ -f "$DA" ] && [ -f "$TA" ] || continue
            python3 grand-bruxelles-game/tools/citygen/validate_cell_elevation_rasters.py \
              --dsm-validation "$DA" --dtm-validation "$TA" --extract-root /tmp/citygen-raster-extract \
              --output "$D/elevation_raster_validation.json" || { rm -f "$D/elevation_raster_validation.json"; continue; }
            python3 grand-bruxelles-game/tools/citygen/assess_cell_elevation_values.py \
              --raster-validation "$D/elevation_raster_validation.json" --extract-root /tmp/citygen-raster-extract \
              --output "$D/elevation_value_evidence.json" || { rm -f "$D/elevation_value_evidence.json"; continue; }
          done < /tmp/citygen-out/worklist.txt

      - name: Build authoritative candidate packages and elevation frontiers
        run: |
          set -u
          mkdir -p /tmp/citygen-out/candidates
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            python3 grand-bruxelles-game/tools/citygen/build_cell_candidate_package.py \
              --cell-dir "$D" --output "/tmp/citygen-out/candidates/${CELL}.json" || true
            if [ -f "$D/elevation_value_evidence.json" ] && [ -f "$D/elevation_raster_validation.json" ]; then
              python3 grand-bruxelles-game/tools/citygen/build_cell_elevation_candidate_frontier.py \
                --value-evidence "$D/elevation_value_evidence.json" \
                --raster-validation "$D/elevation_raster_validation.json" \
                --output "$D/elevation_candidate_frontier.json" || rm -f "$D/elevation_candidate_frontier.json"
            fi
          done < /tmp/citygen-out/worklist.txt

      - name: Derive per-building DSM DTM height candidates
        run: |
          set -u
          mkdir -p /tmp/citygen-out/building-height-errors
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            VALUE="$D/elevation_value_evidence.json"; FRONTIER="$D/elevation_candidate_frontier.json"; RASTER="$D/elevation_raster_validation.json"
            if [ ! -f "$VALUE" ] || [ ! -f "$FRONTIER" ] || [ ! -f "$RASTER" ]; then
              rm -f "$D/building_height_candidates.json" "$D/terrain_lod_evidence.json"
              continue
            fi
            LOG="/tmp/citygen-out/building-height-errors/${CELL}.log"
            if python3 grand-bruxelles-game/tools/citygen/derive_cell_building_height_candidates.py \
              --cell-dir "$D" \
              --value-evidence "$VALUE" \
              --frontier "$FRONTIER" \
              --raster-validation "$RASTER" \
              --extract-root /tmp/citygen-raster-extract \
              --output "$D/building_height_candidates.json" >"$LOG" 2>&1; then
              rm -f "$LOG"
            else
              rm -f "$D/building_height_candidates.json" "$D/terrain_lod_evidence.json"
              echo "BUILDING_HEIGHT_CANDIDATES_PENDING ${CELL}"
            fi
          done < /tmp/citygen-out/worklist.txt

      - name: Evaluate source-faithful DTM terrain LOD
        run: |
          set -u
          [ -f /tmp/citygen-rasterio-ready ] || { echo "raster stack unavailable; terrain LOD remains pending"; exit 0; }
          mkdir -p /tmp/citygen-out/terrain-lod-errors
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            VALUE="$D/elevation_value_evidence.json"; RASTER="$D/elevation_raster_validation.json"; HEIGHTS="$D/building_height_candidates.json"
            if [ ! -f "$VALUE" ] || [ ! -f "$RASTER" ] || [ ! -f "$HEIGHTS" ]; then
              rm -f "$D/terrain_lod_evidence.json"
              continue
            fi
            LOG="/tmp/citygen-out/terrain-lod-errors/${CELL}.log"
            if python3 grand-bruxelles-game/tools/citygen/evaluate_cell_dtm_lod.py \
              --raster-validation "$RASTER" \
              --value-evidence "$VALUE" \
              --extract-root /tmp/citygen-raster-extract \
              --output "$D/terrain_lod_evidence.json" >"$LOG" 2>&1; then
              rm -f "$LOG"
            else
              rm -f "$D/terrain_lod_evidence.json"
              echo "TERRAIN_LOD_EVIDENCE_PENDING ${CELL}"
            fi
          done < /tmp/citygen-out/worklist.txt

      - name: Stage selected source cache
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-selected-sources
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            cp -a "grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}" "/tmp/citygen-selected-sources/${CELL}"
          done < /tmp/citygen-out/worklist.txt

      - name: Persist autonomous progress off main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C citygen-autonomous-state
          mkdir -p grand-bruxelles-game/data/qa/autonomous_candidates grand-bruxelles-game/data/qa/autonomous_sources
          cp /tmp/citygen-out/autonomous_citygen_state.json grand-bruxelles-game/data/qa/autonomous_citygen_state.json
          cp /tmp/citygen-out/autonomous_citygen_report.json grand-bruxelles-game/data/qa/autonomous_citygen_latest_report.json
          cp /tmp/citygen-out/worklist.txt grand-bruxelles-game/data/qa/autonomous_citygen_worklist.txt
          cp /tmp/citygen-out/brussels_regional_target_grid.json grand-bruxelles-game/data/qa/brussels_regional_target_grid.json
          cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_candidates/. grand-bruxelles-game/data/qa/autonomous_candidates/ 2>/dev/null || true
          cp -a /tmp/citygen-prev/grand-bruxelles-game/data/qa/autonomous_sources/. grand-bruxelles-game/data/qa/autonomous_sources/ 2>/dev/null || true
          cp /tmp/citygen-out/candidates/*.json grand-bruxelles-game/data/qa/autonomous_candidates/ 2>/dev/null || true
          cp -a /tmp/citygen-selected-sources/. grand-bruxelles-game/data/qa/autonomous_sources/ 2>/dev/null || true
          git add grand-bruxelles-game/data/qa
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "citygen: persist autonomous scheduler pass"
          git push --force-with-lease origin citygen-autonomous-state

      - name: Upload CityGen pass evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-citygen-pass-${{ github.run_number }}
          path: /tmp/citygen-out/
          retention-days: 30
