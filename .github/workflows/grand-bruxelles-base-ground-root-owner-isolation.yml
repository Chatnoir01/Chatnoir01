name: Grand Bruxelles Base Ground Root Owner Isolation

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_base_ground_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_base_ground_root_owner_isolation_test.gd'
      - '.github/workflows/grand-bruxelles-base-ground-root-owner-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-ground-root-owner-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact PR head and live-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD
          echo "BASE_GROUND_ROOT_OWNER_EXACT_HEAD_OK head=$(git rev-parse HEAD) live_main=$LIVE_MAIN_SHA"

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/base-ground-owner-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/base-ground-owner-import.log; then exit 1; fi

      - name: Validate root-owner isolation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_base_ground_root_owner_isolation_test.gd 2>&1 | tee /tmp/base-ground-owner.log
          grep -q 'BRUSSELS_BASE_GROUND_ROOT_OWNER_ISOLATION_OK' /tmp/base-ground-owner.log
