name: Grand Bruxelles Bilingual Street Sign Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bilingual-street-sign-visual.yml"
      - "grand-bruxelles-game/game/scripts/brussels_bilingual_street_sign.gd"
      - "grand-bruxelles-game/game/tests/brussels_bilingual_street_sign_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_bilingual_street_sign_witness_test.gd"
      - "grand-bruxelles-game/data/provenance/brussels_bilingual_street_sign.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-street-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate reusable bilingual plaque
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/brussels_bilingual_street_sign_test.gd 2>&1 | tee /tmp/bilingual-street-sign.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_BILINGUAL_STREET_SIGN_FAIL" /tmp/bilingual-street-sign.log; then exit 1; fi
          grep -F "BRUSSELS_BILINGUAL_STREET_SIGN_OK" /tmp/bilingual-street-sign.log
      - name: Capture production witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/brussels_bilingual_street_sign_witness_test.gd 2>&1 | tee /tmp/bilingual-street-sign-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_BILINGUAL_STREET_SIGN_WITNESS_FAIL" /tmp/bilingual-street-sign-witness.log; then exit 1; fi
          grep -F "BRUSSELS_BILINGUAL_STREET_SIGN_WITNESS_OK" /tmp/bilingual-street-sign-witness.log
          test -f grand-bruxelles-game/artifacts/visual/brussels_bilingual_street_sign_witness.png
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-street-sign-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_bilingual_street_sign_witness.png
            /tmp/bilingual-street-sign.log
            /tmp/bilingual-street-sign-witness.log
          if-no-files-found: error
