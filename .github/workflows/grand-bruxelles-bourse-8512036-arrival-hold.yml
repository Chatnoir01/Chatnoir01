name: Grand Bruxelles Bourse 8512036 Arrival Hold Stability

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-arrival-hold.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_arrival_hold_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-arrival-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'ARRIVAL_HOLD_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'ARRIVAL_HOLD_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/arrival-hold-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/arrival-hold-import.log

      - name: Prove stable physical arrival hold
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_arrival_hold_test.gd 2>&1 | tee /tmp/arrival-hold-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_ARRIVAL_HOLD_FAIL" /tmp/arrival-hold-runtime.log
          grep -q 'BOURSE_8512036_ARRIVAL_HOLD_GREEN' /tmp/arrival-hold-runtime.log

      - name: Seal fail-closed arrival-hold receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-arrival-hold-evidence
          receipt=grand-bruxelles-game/artifacts/qa/bourse_8512036_arrival_hold.json
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/arrival-hold-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/arrival-hold-runtime.log "$stage/runtime.log" 2>/dev/null || true
          test -s "$receipt"
          cp "$receipt" "$stage/receipt.json"
          python3 - "$stage/receipt.json" <<'PY'
          import json, math, os, pathlib, sys
          def reject_constant(v): raise ValueError(v)
          def finite_float(v):
              x=float(v)
              if not math.isfinite(x): raise ValueError(v)
              return x
          def no_dupes(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(k)
                  out[k]=v
              return out
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(),parse_constant=reject_constant,parse_float=finite_float,object_pairs_hook=no_dupes)
          def finite(k):
              v=d[k]; assert type(v) in (int,float) and not isinstance(v,bool) and math.isfinite(v); return float(v)
          assert d['schema']=='grand-bruxelles-bourse-8512036-arrival-hold-v2'
          assert type(d['road_osm_id']) is int and d['road_osm_id']==8512036
          assert d['lookup_mode']=='deterministic_runtime_index'
          assert d['source_path']==os.environ['LOCKED_SOURCE_PATH'] and d['source_sha256']==os.environ['LOCKED_SOURCE_SHA256']
          assert type(d['physics_hz']) is int and d['physics_hz']==60
          move_limit=d['movement_step_limit']; assert type(move_limit) is int and not isinstance(move_limit,bool) and move_limit==180
          hold_required=d['hold_step_count']; assert type(hold_required) is int and not isinstance(hold_required,bool) and hold_required==60
          assert finite('hold_duration_seconds') == 1.0
          radius=finite('authoritative_capsule_radius_m'); assert radius>0
          assert d['hold_tolerance_derivation']=='authoritative_player_capsule_radius'
          first=d['first_target_plane_step']; assert type(first) is int and not isinstance(first,bool) and 1 <= first <= move_limit
          hold=d['post_target_frames']; assert type(hold) is int and not isinstance(hold,bool) and hold==hold_required
          grounded=d['post_target_grounded_frames']; canonical=d['post_target_canonical_support_frames']; within=d['post_target_within_capsule_frames']
          for v in (grounded,canonical,within): assert type(v) is int and not isinstance(v,bool) and v==hold_required
          assert finite('max_post_target_distance_m') <= radius + 1e-6
          assert type(d['first_post_target_failure_step']) is int and d['first_post_target_failure_step']==0
          assert d['full_hold_duration_completed'] is True
          assert d['post_target_stable_on_requested_road'] is True
          assert d['support_mode']=='characterbody_capsule_test_motion'
          assert d['canonical_owner_id']=='generic_osm_surface_collision_runtime'
          assert d['requested_osm_id_owned_every_hold_frame'] is True
          assert d['actual_character_body_move_and_slide'] is True
          for k in ('source_geometry_changed','collision_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized'): assert d[k] is False
          PY
          sha256sum "$stage/receipt.json" "$stage/runtime.log" > "$stage/SHA256SUMS"

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$ARRIVAL_HOLD_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$ARRIVAL_HOLD_HEAD_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -

      - name: Upload arrival-hold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-arrival-hold
          path: /tmp/bourse-arrival-hold-evidence
          if-no-files-found: error
