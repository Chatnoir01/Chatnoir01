name: Grand Bruxelles Bourse 8512036 Exact-Head Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-exact-head-evidence.yml"
      - "grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_evidence.py"
      - "grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_safety_contract.py"
      - "grand-bruxelles-game/game/tests/bourse_8512036_corridor_masked_visual_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-exact-head-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind run to exact current main and exact head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          fi
          git fetch origin main --no-tags
          BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$BASE_SHA")" = "$BASE_SHA"
          echo "$LOCKED_SOURCE_SHA256  grand-bruxelles-game/data/osm/vertical_slice_01.game.json" | sha256sum -c -
          printf 'EVIDENCE_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"
          printf 'EVIDENCE_BASE_SHA=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"
          printf 'head_sha=%s\nbase_sha=%s\n' "$HEAD_SHA" "$BASE_SHA" | tee /tmp/exact-head-identity.log

      - name: Compile exact-head provenance validators
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_evidence.py \
            grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_safety_contract.py

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/exact-head-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/exact-head-import.log

      - name: Produce real player-visible Bourse receipt
        shell: bash
        run: |
          set -o pipefail
          timeout 180s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/bourse_8512036_corridor_masked_visual_test.gd 2>&1 | tee /tmp/exact-head-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_CORRIDOR_MASKED_VISUAL_FAIL" /tmp/exact-head-runtime.log
          test "$(grep -c 'BOURSE_8512036_CORRIDOR_MASKED_VISUAL_OK' /tmp/exact-head-runtime.log)" -eq 1

      - name: Strict-parse, seal and validate exact run provenance
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=grand-bruxelles-game/artifacts/qa/bourse_8512036_corridor_masked_visual/receipt.json
          VALIDATOR=grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_evidence.py
          SAFETY_VALIDATOR=grand-bruxelles-game/tests/validate_bourse_8512036_exact_head_safety_contract.py
          python3 "$VALIDATOR" \
            --receipt "$RECEIPT" \
            --expected-head-sha "$EVIDENCE_HEAD_SHA" \
            --expected-base-sha "$EVIDENCE_BASE_SHA" \
            --seal-provenance \
            --self-test | tee /tmp/exact-head-validator.log
          grep -q 'BOURSE_8512036_EXACT_HEAD_EVIDENCE_GREEN' /tmp/exact-head-validator.log
          grep -q "head_sha=$EVIDENCE_HEAD_SHA" /tmp/exact-head-validator.log
          grep -q "base_sha=$EVIDENCE_BASE_SHA" /tmp/exact-head-validator.log
          grep -q 'strict_preseal_json=true' /tmp/exact-head-validator.log
          grep -q 'closed_receipt_schema=true' /tmp/exact-head-validator.log
          grep -q 'promotion_authorized=false' /tmp/exact-head-validator.log
          python3 "$SAFETY_VALIDATOR" \
            --receipt "$RECEIPT" \
            --expected-head-sha "$EVIDENCE_HEAD_SHA" \
            --expected-base-sha "$EVIDENCE_BASE_SHA" \
            --self-test | tee /tmp/exact-head-safety-validator.log
          grep -q 'BOURSE_8512036_EXACT_HEAD_SAFETY_CONTRACT_GREEN' /tmp/exact-head-safety-validator.log
          grep -q 'predecessor_fail_open_proven=true' /tmp/exact-head-safety-validator.log
          grep -q 'safety_contract_bound=true' /tmp/exact-head-safety-validator.log
          grep -q 'promotion_authorized=false' /tmp/exact-head-safety-validator.log

      - name: Upload exact-head evidence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-exact-head-evidence
          path: |
            /tmp/exact-head-identity.log
            /tmp/exact-head-import.log
            /tmp/exact-head-runtime.log
            /tmp/exact-head-validator.log
            /tmp/exact-head-safety-validator.log
            grand-bruxelles-game/artifacts/qa/bourse_8512036_corridor_masked_visual/receipt.json
            grand-bruxelles-game/artifacts/qa/bourse_8512036_corridor_masked_visual/road-8512036-corridor-masked.png
          if-no-files-found: error
          retention-days: 7
