name: Grand Bruxelles Bourse 8512036 Floor Normal Continuity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-floor-normal-continuity.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_floor_normal_continuity_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-floor-normal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'FLOOR_NORMAL_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'FLOOR_NORMAL_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/floor-normal-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/floor-normal-import.log

      - name: Prove three-second canonical and CharacterBody floor-normal continuity
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_floor_normal_continuity_test.gd 2>&1 | tee /tmp/floor-normal-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_FLOOR_NORMAL_CONTINUITY_FAIL" /tmp/floor-normal-runtime.log
          grep -q 'BOURSE_8512036_FLOOR_NORMAL_CONTINUITY_GREEN' /tmp/floor-normal-runtime.log

      - name: Seal fail-closed floor-normal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-floor-normal-evidence
          receipt=grand-bruxelles-game/artifacts/qa/bourse_8512036_floor_normal_continuity.json
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/floor-normal-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/floor-normal-runtime.log "$stage/runtime.log" 2>/dev/null || true
          test -s "$receipt"
          cp "$receipt" "$stage/receipt.json"
          python3 - "$stage/receipt.json" <<'PY'
          import copy, json, math, os, pathlib, sys
          def reject_constant(v): raise ValueError(v)
          def finite_float(v):
              x=float(v)
              if not math.isfinite(x): raise ValueError(v)
              return x
          def no_dupes(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(k)
                  out[k]=v
              return out
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(),parse_constant=reject_constant,parse_float=finite_float,object_pairs_hook=no_dupes)
          def validate(r):
              def integer(k):
                  v=r[k]; assert type(v) is int and not isinstance(v,bool); return v
              def finite(k):
                  v=r[k]; assert type(v) in (int,float) and not isinstance(v,bool) and math.isfinite(v); return float(v)
              assert r['schema']=='grand-bruxelles-bourse-8512036-floor-normal-continuity-v7'
              assert integer('road_osm_id')==8512036
              assert r['lookup_mode']=='deterministic_runtime_index'
              assert r['source_path']==os.environ['LOCKED_SOURCE_PATH'] and r['source_sha256']==os.environ['LOCKED_SOURCE_SHA256']
              assert integer('physics_hz')==60 and integer('step_count')==180
              assert integer('expected_normal_transition_count')==179
              floor_angle=finite('authoritative_floor_max_angle_rad'); assert 0<floor_angle<math.pi/2
              assert r['normal_delta_bound_derivation']=='authoritative_characterbody_floor_max_angle'
              bound=finite('max_allowed_normal_delta_rad'); assert math.isclose(bound,floor_angle,rel_tol=0,abs_tol=1e-9)
              assert 0<=finite('max_observed_normal_delta_rad')<=bound+1e-6
              assert 0<=finite('max_observed_character_floor_normal_delta_rad')<=bound+1e-6
              safe_margin=finite('authoritative_safe_margin_m'); assert safe_margin>0
              floor_snap=finite('authoritative_floor_snap_length_m'); assert floor_snap>0
              assert r['support_gap_bound_derivation']=='authoritative_characterbody_floor_snap_length'
              gap_bound=finite('max_allowed_no_slide_support_gap_m'); assert math.isclose(gap_bound,floor_snap,rel_tol=0,abs_tol=1e-9)
              assert 0<=finite('max_observed_canonical_support_gap_m')<=floor_snap+1e-6
              assert 0<=finite('max_observed_no_slide_canonical_support_gap_m')<=gap_bound+1e-6
              assert integer('no_slide_support_gap_violation_count')==0
              assert integer('first_no_slide_support_gap_violation_step')==0
              assert integer('support_frame_count')==180 and integer('missing_support_frame_count')==0
              assert integer('normal_transition_count')==179 and integer('normal_transition_violation_count')==0
              assert integer('first_normal_transition_violation_step')==0
              assert integer('character_floor_normal_frame_count')==180 and integer('missing_character_floor_normal_frame_count')==0
              assert integer('character_floor_normal_transition_count')==179
              assert integer('character_floor_normal_transition_violation_count')==0
              assert integer('first_character_floor_normal_transition_violation_step')==0
              motion=integer('movement_command_frame_count'); hold=integer('stationary_hold_frame_count')
              assert motion>0 and hold>=0 and motion+hold==180
              slide=integer('slide_floor_contact_frame_count'); no_slide=integer('missing_slide_floor_contact_frame_count')
              canonical=integer('canonical_slide_floor_contact_frame_count'); noncanonical=integer('noncanonical_slide_floor_contact_frame_count')
              fallback=integer('no_slide_floor_contact_grounded_canonical_support_frame_count')
              assert slide>0 and slide+no_slide==180
              assert canonical==slide and noncanonical==0 and fallback==no_slide
              mslide=integer('movement_slide_floor_contact_frame_count'); mno=integer('missing_movement_slide_floor_contact_frame_count')
              mcanonical=integer('canonical_movement_slide_floor_contact_frame_count'); mnoncanonical=integer('noncanonical_movement_slide_floor_contact_frame_count')
              mfallback=integer('movement_no_slide_floor_contact_grounded_canonical_support_frame_count')
              assert mslide+mno==motion
              assert mcanonical==mslide and mnoncanonical==0 and mfallback==mno
              assert integer('stationary_canonical_support_frame_count')==hold
              assert integer('missing_stationary_canonical_support_frame_count')==0
              assert r['support_mode']=='characterbody_capsule_test_motion'
              assert r['character_floor_normal_source']=='CharacterBody3D.get_floor_normal_after_move_and_slide'
              assert r['slide_floor_contact_source']=='CharacterBody3D.get_slide_collision_after_move_and_slide'
              assert r['slide_floor_contact_semantics']=='emitted_floor_contacts_must_be_canonical; no_emitted_contact_requires_grounded_characterbody_plus_canonical_capsule_test_motion_within_floor_snap_length'
              assert r['canonical_owner_id']=='generic_osm_surface_collision_runtime'
              for k in ('continuous_canonical_floor_normal','continuous_character_floor_normal','canonical_emitted_slide_floor_contacts','grounded_canonical_fallback_for_no_slide_contact','grounded_canonical_fallback_within_floor_snap','continuous_floor_normal','actual_character_body_move_and_slide'): assert r[k] is True
              for k in ('source_geometry_changed','collision_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized'): assert r[k] is False
          validate(d)
          mutations=(
              ('support_frame_count',179),('normal_transition_count',178),('character_floor_normal_frame_count',179),
              ('slide_floor_contact_frame_count',0),('canonical_slide_floor_contact_frame_count',0),('noncanonical_slide_floor_contact_frame_count',1),
              ('no_slide_floor_contact_grounded_canonical_support_frame_count',0),('movement_slide_floor_contact_frame_count',0),
              ('canonical_movement_slide_floor_contact_frame_count',0),('noncanonical_movement_slide_floor_contact_frame_count',1),
              ('movement_no_slide_floor_contact_grounded_canonical_support_frame_count',0),('missing_stationary_canonical_support_frame_count',1),
              ('max_observed_no_slide_canonical_support_gap_m', d.get('authoritative_floor_snap_length_m',0.0)+0.01),
              ('no_slide_support_gap_violation_count',1),('first_no_slide_support_gap_violation_step',1),
              ('continuous_canonical_floor_normal',False),('continuous_character_floor_normal',False),
              ('canonical_emitted_slide_floor_contacts',False),('grounded_canonical_fallback_for_no_slide_contact',False),
              ('grounded_canonical_fallback_within_floor_snap',False),('continuous_floor_normal',False)
          )
          for key,value in mutations:
              m=copy.deepcopy(d); m[key]=value
              try: validate(m)
              except (AssertionError,KeyError,TypeError,ValueError): continue
              raise AssertionError(f'fail-open floor-normal receipt mutation accepted: {key}={value!r}')
          PY

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$FLOOR_NORMAL_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$FLOOR_NORMAL_HEAD_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -

      - name: Stage provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-floor-normal-evidence
          mkdir -p "$stage"
          printf '%s\n' "$FLOOR_NORMAL_BASE_SHA" > "$stage/live-main-sha.txt"
          printf '%s\n' "$FLOOR_NORMAL_HEAD_SHA" > "$stage/exact-head-sha.txt"
          sha256sum "$stage"/* > "$stage/SHA256SUMS.txt"

      - name: Upload floor-normal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-8512036-floor-normal-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/bourse-floor-normal-evidence
          if-no-files-found: error
          retention-days: 14
