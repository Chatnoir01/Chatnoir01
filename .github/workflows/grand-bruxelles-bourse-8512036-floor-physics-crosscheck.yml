name: Grand Bruxelles Bourse 8512036 Floor Physics Crosscheck

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-floor-physics-crosscheck.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_floor_physics_identity_probe.gd"
      - "grand-bruxelles-game/game/tests/bourse_8512036_floor_normal_continuity_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_8512036_lateral_jitter_continuity_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_8512036_vertical_step_continuity_test.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor-physics-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf 'CROSSCHECK_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'CROSSCHECK_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/crosscheck-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/crosscheck-import.log

      - name: Produce floor-normal receipt
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_floor_normal_continuity_test.gd 2>&1 | tee /tmp/floor-normal.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_FLOOR_NORMAL_CONTINUITY_FAIL" /tmp/floor-normal.log
          grep -q 'BOURSE_8512036_FLOOR_NORMAL_CONTINUITY_GREEN' /tmp/floor-normal.log

      - name: Produce lateral-jitter receipt
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_lateral_jitter_continuity_test.gd 2>&1 | tee /tmp/lateral-jitter.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_LATERAL_JITTER_FAIL" /tmp/lateral-jitter.log
          grep -q 'BOURSE_8512036_LATERAL_JITTER_GREEN' /tmp/lateral-jitter.log

      - name: Produce vertical-step receipt
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_vertical_step_continuity_test.gd 2>&1 | tee /tmp/vertical-step.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_VERTICAL_STEP_FAIL" /tmp/vertical-step.log
          grep -q 'BOURSE_8512036_VERTICAL_STEP_GREEN' /tmp/vertical-step.log

      - name: Independently probe authoritative floor physics
        shell: bash
        run: |
          set -o pipefail
          timeout 60s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_floor_physics_identity_probe.gd 2>&1 | tee /tmp/floor-physics.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_FLOOR_PHYSICS_IDENTITY_FAIL" /tmp/floor-physics.log
          grep -q 'BOURSE_8512036_FLOOR_PHYSICS_IDENTITY_GREEN' /tmp/floor-physics.log

      - name: Fail closed on producer/probe identity drift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy, json, math, pathlib
          normal_path=pathlib.Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_floor_normal_continuity.json')
          lateral_path=pathlib.Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_lateral_jitter_continuity.json')
          vertical_path=pathlib.Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_vertical_step_continuity.json')
          probe_path=pathlib.Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_floor_physics_identity.json')
          normal=json.loads(normal_path.read_text())
          lateral=json.loads(lateral_path.read_text())
          vertical=json.loads(vertical_path.read_text())
          probe=json.loads(probe_path.read_text())
          assert normal['schema']=='grand-bruxelles-bourse-8512036-floor-normal-continuity-v7'
          assert lateral['schema']=='grand-bruxelles-bourse-8512036-lateral-jitter-v4'
          assert vertical['schema']=='grand-bruxelles-bourse-8512036-vertical-step-continuity-v1'
          assert probe['schema']=='grand-bruxelles-bourse-8512036-floor-physics-identity-v2'
          assert probe['node_path']=='Player' and probe['node_type']=='CharacterBody3D'
          assert probe['collision_shape_path']=='Player/CollisionShape3D' and probe['collision_shape_type']=='CapsuleShape3D'
          for key in ('authoritative_floor_max_angle_rad','authoritative_floor_snap_length_m','authoritative_safe_margin_m'):
              a=float(normal[key]); b=float(probe[key])
              assert math.isfinite(a) and math.isfinite(b) and a>0 and b>0
              assert math.isclose(a,b,rel_tol=0,abs_tol=1e-12), (key,a,b)
          lateral_safe_margin=float(lateral['authoritative_safe_margin_m'])
          probe_safe_margin=float(probe['authoritative_safe_margin_m'])
          capsule_radius=float(lateral['authoritative_capsule_radius_m'])
          probe_capsule_radius=float(probe['authoritative_capsule_radius_m'])
          for label,value in (('lateral_safe_margin',lateral_safe_margin),('probe_safe_margin',probe_safe_margin),('capsule_radius',capsule_radius),('probe_capsule_radius',probe_capsule_radius)):
              assert math.isfinite(value) and value>0, (label,value)
          assert math.isclose(lateral_safe_margin,probe_safe_margin,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(capsule_radius,probe_capsule_radius,rel_tol=0,abs_tol=1e-12)
          assert lateral['lateral_envelope_derivation']=='authoritative_player_capsule_radius'
          assert math.isclose(float(lateral['lateral_envelope_tolerance_m']),probe_capsule_radius,rel_tol=0,abs_tol=1e-12)
          assert normal['normal_delta_bound_derivation']=='authoritative_characterbody_floor_max_angle'
          assert math.isclose(float(normal['max_allowed_normal_delta_rad']),float(probe['authoritative_floor_max_angle_rad']),rel_tol=0,abs_tol=1e-12)
          assert normal['support_gap_bound_derivation']=='authoritative_characterbody_floor_snap_length'
          assert math.isclose(float(normal['max_allowed_no_slide_support_gap_m']),float(probe['authoritative_floor_snap_length_m']),rel_tol=0,abs_tol=1e-12)

          vertical_float_keys=(
              'authoritative_sprint_speed_mps',
              'authoritative_gravity_mps2',
              'authoritative_floor_snap_length_m',
              'authoritative_safe_margin_m',
              'authoritative_floor_max_angle_rad',
          )
          for key in vertical_float_keys:
              a=float(vertical[key]); b=float(probe[key])
              assert math.isfinite(a) and math.isfinite(b) and a>0 and b>0
              assert math.isclose(a,b,rel_tol=0,abs_tol=1e-12), (key,a,b)
          assert type(vertical['authoritative_max_slides']) is int and not isinstance(vertical['authoritative_max_slides'],bool)
          assert type(probe['authoritative_max_slides']) is int and not isinstance(probe['authoritative_max_slides'],bool)
          assert vertical['authoritative_max_slides']==probe['authoritative_max_slides'] and probe['authoritative_max_slides']>0
          assert type(vertical['physics_hz']) is int and not isinstance(vertical['physics_hz'],bool) and vertical['physics_hz']==60
          expected_horizontal_step=float(probe['authoritative_sprint_speed_mps'])/float(vertical['physics_hz'])
          expected_recovery=float(probe['authoritative_safe_margin_m'])*float(probe['authoritative_max_slides'])
          expected_vertical_bound=(
              expected_horizontal_step*math.tan(float(probe['authoritative_floor_max_angle_rad']))
              + float(probe['authoritative_floor_snap_length_m'])
              + expected_recovery
          )
          assert vertical['vertical_step_bound_derivation']=='horizontal_step_times_tan_floor_max_angle_plus_floor_snap_plus_safe_margin_times_max_slides'
          assert math.isclose(float(vertical['authoritative_horizontal_step_m']),expected_horizontal_step,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(float(vertical['authoritative_recovery_budget_m']),expected_recovery,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(float(vertical['max_vertical_step_m']),expected_vertical_bound,rel_tol=0,abs_tol=1e-12)
          assert vertical['continuous_vertical_step_bound'] is True
          assert vertical['continuous_grounded_support'] is True
          assert vertical['continuous_canonical_road_support'] is True
          assert vertical['actual_character_body_move_and_slide'] is True
          assert vertical['vertical_step_green'] is True
          assert probe['source']=='independent_main_scene_runtime_probe'
          for key in ('physics_parameters_mutated','character_controller_mutated','source_geometry_changed','collision_geometry_changed','resolver_thresholds_lowered'):
              assert probe[key] is False

          mutations=(
              ('authoritative_floor_max_angle_rad','max_allowed_normal_delta_rad'),
              ('authoritative_floor_snap_length_m','max_allowed_no_slide_support_gap_m'),
          )
          for physics_key,bound_key in mutations:
              tampered=copy.deepcopy(normal)
              tampered[physics_key]=float(tampered[physics_key])+0.01
              tampered[bound_key]=float(tampered[bound_key])+0.01
              accepted=True
              try:
                  assert math.isclose(float(tampered[physics_key]),float(probe[physics_key]),rel_tol=0,abs_tol=1e-12)
                  assert math.isclose(float(tampered[bound_key]),float(probe[physics_key]),rel_tol=0,abs_tol=1e-12)
              except AssertionError:
                  accepted=False
              assert not accepted, f'coordinated receipt mutation escaped crosscheck: {physics_key}/{bound_key}'

          tampered=copy.deepcopy(lateral)
          tampered['authoritative_capsule_radius_m']=float(tampered['authoritative_capsule_radius_m'])+0.01
          tampered['lateral_envelope_tolerance_m']=float(tampered['lateral_envelope_tolerance_m'])+0.01
          accepted=True
          try:
              assert math.isclose(float(tampered['authoritative_capsule_radius_m']),probe_capsule_radius,rel_tol=0,abs_tol=1e-12)
              assert math.isclose(float(tampered['lateral_envelope_tolerance_m']),probe_capsule_radius,rel_tol=0,abs_tol=1e-12)
          except AssertionError:
              accepted=False
          assert not accepted, 'coordinated lateral capsule-radius mutation escaped crosscheck'

          tampered=copy.deepcopy(vertical)
          tampered['authoritative_sprint_speed_mps']=float(tampered['authoritative_sprint_speed_mps'])+0.1
          tampered['authoritative_horizontal_step_m']=float(tampered['authoritative_sprint_speed_mps'])/float(tampered['physics_hz'])
          tampered['max_vertical_step_m']=(
              float(tampered['authoritative_horizontal_step_m'])*math.tan(float(tampered['authoritative_floor_max_angle_rad']))
              + float(tampered['authoritative_floor_snap_length_m'])
              + float(tampered['authoritative_recovery_budget_m'])
          )
          accepted=True
          try:
              assert math.isclose(float(tampered['authoritative_sprint_speed_mps']),float(probe['authoritative_sprint_speed_mps']),rel_tol=0,abs_tol=1e-12)
          except AssertionError:
              accepted=False
          assert not accepted, 'coordinated vertical sprint/bound mutation escaped crosscheck'

          tampered=copy.deepcopy(vertical)
          tampered['authoritative_max_slides']=int(tampered['authoritative_max_slides'])+1
          tampered['authoritative_recovery_budget_m']=float(tampered['authoritative_safe_margin_m'])*float(tampered['authoritative_max_slides'])
          tampered['max_vertical_step_m']=(
              float(tampered['authoritative_horizontal_step_m'])*math.tan(float(tampered['authoritative_floor_max_angle_rad']))
              + float(tampered['authoritative_floor_snap_length_m'])
              + float(tampered['authoritative_recovery_budget_m'])
          )
          accepted=True
          try:
              assert tampered['authoritative_max_slides']==probe['authoritative_max_slides']
          except AssertionError:
              accepted=False
          assert not accepted, 'coordinated vertical max-slides/bound mutation escaped crosscheck'
          PY

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$CROSSCHECK_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$CROSSCHECK_HEAD_SHA"

      - name: Stage crosscheck evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-floor-physics-crosscheck
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/crosscheck-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/floor-normal.log "$stage/floor-normal.log" 2>/dev/null || true
          cp /tmp/lateral-jitter.log "$stage/lateral-jitter.log" 2>/dev/null || true
          cp /tmp/vertical-step.log "$stage/vertical-step.log" 2>/dev/null || true
          cp /tmp/floor-physics.log "$stage/floor-physics.log" 2>/dev/null || true
          cp grand-bruxelles-game/artifacts/qa/bourse_8512036_floor_normal_continuity.json "$stage/floor-normal.json" 2>/dev/null || true
          cp grand-bruxelles-game/artifacts/qa/bourse_8512036_lateral_jitter_continuity.json "$stage/lateral-jitter.json" 2>/dev/null || true
          cp grand-bruxelles-game/artifacts/qa/bourse_8512036_vertical_step_continuity.json "$stage/vertical-step.json" 2>/dev/null || true
          cp grand-bruxelles-game/artifacts/qa/bourse_8512036_floor_physics_identity.json "$stage/floor-physics-identity.json" 2>/dev/null || true
          printf '%s\n' "$CROSSCHECK_BASE_SHA" > "$stage/live-main-sha.txt"
          printf '%s\n' "$CROSSCHECK_HEAD_SHA" > "$stage/exact-head-sha.txt"
          sha256sum "$stage"/* > "$stage/SHA256SUMS.txt"

      - name: Upload crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-8512036-floor-physics-crosscheck-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/bourse-floor-physics-crosscheck
          if-no-files-found: error
          retention-days: 14
