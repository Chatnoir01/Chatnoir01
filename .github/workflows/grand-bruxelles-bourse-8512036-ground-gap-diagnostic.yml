name: Grand Bruxelles Bourse 8512036 Ground Gap Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-ground-gap-diagnostic.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_ground_gap_diagnostic.gd"
      - "grand-bruxelles-game/game/tests/bourse_8512036_ground_continuity_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure-bourse-ground-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      EXPECTED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      EXPECTED_RUNTIME_INDEX_SHA256: 9876775a7dcbc32e2beb679895f05a2be6d1eaa063483d0aa17c328af285b883
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source/index bytes
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf 'DIAGNOSTIC_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'DIAGNOSTIC_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"
          echo "$EXPECTED_SOURCE_SHA256  grand-bruxelles-game/data/osm/vertical_slice_01.game.json" | sha256sum -c -
          echo "$EXPECTED_RUNTIME_INDEX_SHA256  grand-bruxelles-game/data/runtime/road_destination_runtime_index.json" | sha256sum -c -

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'

      - name: Import exact-head project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log

      - name: Measure all 21 Bourse footprint probes without weakening release gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/bourse_8512036_ground_gap_diagnostic.gd 2>&1 | tee /tmp/ground-gap-diagnostic.log
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_GROUND_GAP_DIAGNOSTIC_FAIL" /tmp/ground-gap-diagnostic.log
          test "$(grep -c 'BOURSE_8512036_GROUND_GAP_DIAGNOSTIC_OK' /tmp/ground-gap-diagnostic.log)" -eq 1
          grep -Fq 'probes=21' /tmp/ground-gap-diagnostic.log
          grep -Fq 'release_gate_unchanged=true' /tmp/ground-gap-diagnostic.log

      - name: Validate diagnostic receipt contract
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=grand-bruxelles-game/artifacts/qa/bourse_8512036_ground_gap_diagnostic.json
          test -s "$RECEIPT"
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_ground_gap_diagnostic.json')
          def reject_constant(value):
              raise ValueError(f'non-standard JSON constant: {value}')
          def no_dupes(pairs):
              out={}
              for k,v in pairs:
                  if k in out:
                      raise ValueError(f'duplicate key: {k}')
                  out[k]=v
              return out
          data=json.loads(p.read_text(encoding='utf-8'), parse_constant=reject_constant, object_pairs_hook=no_dupes)
          assert data['schema']=='grand-bruxelles-bourse-8512036-ground-gap-diagnostic-v1'
          assert type(data['road_osm_id']) is int and data['road_osm_id']==8512036
          assert type(data['probe_count']) is int and data['probe_count']==21
          assert type(data['missing_probe_count']) is int and 0 <= data['missing_probe_count'] <= 21
          assert type(data['wrong_owner_probe_count']) is int and 0 <= data['wrong_owner_probe_count'] <= 21
          assert type(data['wrong_road_probe_count']) is int and 0 <= data['wrong_road_probe_count'] <= 21
          assert len(data['samples'])==21
          assert len(data['missing_probes'])==data['missing_probe_count']
          assert len(data['wrong_owner_probes'])==data['wrong_owner_probe_count']
          assert len(data['wrong_road_probes'])==data['wrong_road_probe_count']
          assert data['diagnostic_only'] is True
          assert data['release_gate_unchanged'] is True
          assert data['source_geometry_changed'] is False
          assert data['collision_geometry_changed'] is False
          assert data['resolver_thresholds_lowered'] is False
          assert data['destination_advertisable'] is False
          assert data['visual_acceptance'] is False
          assert data['jouable_authorized'] is False
          for sample in data['samples']:
              assert type(sample['station_index']) is int and 0 <= sample['station_index'] < 7
              assert type(sample['lateral_index']) is int and 0 <= sample['lateral_index'] < 3
              assert type(sample['hit']) is bool
              assert type(sample['canonical_owner']) is bool
              assert type(sample['requested_osm_id_owned']) is bool
              for key in ('t','lateral_factor','lateral_offset_m'):
                  assert type(sample[key]) in (int,float) and not isinstance(sample[key], bool) and math.isfinite(sample[key])
          print(f"BOURSE_GROUND_GAP_RECEIPT_OK missing={data['missing_probe_count']} wrong_owner={data['wrong_owner_probe_count']} wrong_road={data['wrong_road_probe_count']}")
          PY
          sha256sum "$RECEIPT" /tmp/ground-gap-diagnostic.log | tee /tmp/ground-gap-diagnostic.sha256

      - name: Revalidate live main and locked inputs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$DIAGNOSTIC_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_HEAD_SHA"
          echo "$EXPECTED_SOURCE_SHA256  grand-bruxelles-game/data/osm/vertical_slice_01.game.json" | sha256sum -c -
          echo "$EXPECTED_RUNTIME_INDEX_SHA256  grand-bruxelles-game/data/runtime/road_destination_runtime_index.json" | sha256sum -c -

      - name: Upload exhaustive Bourse ground-gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-ground-gap-diagnostic
          path: |
            grand-bruxelles-game/artifacts/qa/bourse_8512036_ground_gap_diagnostic.json
            /tmp/ground-gap-diagnostic.log
            /tmp/import.log
            /tmp/ground-gap-diagnostic.sha256
          if-no-files-found: warn
          retention-days: 7
