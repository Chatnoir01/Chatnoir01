name: Grand Bruxelles Bourse 8512036 Pass-Through Continuity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-pass-through-continuity.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_pass_through_continuity_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-pass-through:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'PASS_THROUGH_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'PASS_THROUGH_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/pass-through-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/pass-through-import.log

      - name: Prove one-second post-target sprint, vector continuity and body clearance
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_pass_through_continuity_test.gd 2>&1 | tee /tmp/pass-through-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_PASS_THROUGH_FAIL" /tmp/pass-through-runtime.log
          grep -q 'BOURSE_8512036_PASS_THROUGH_GREEN' /tmp/pass-through-runtime.log

      - name: Seal fail-closed pass-through receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-pass-through-evidence
          receipt=grand-bruxelles-game/artifacts/qa/bourse_8512036_pass_through_continuity.json
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/pass-through-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/pass-through-runtime.log "$stage/runtime.log" 2>/dev/null || true
          test -s "$receipt"
          cp "$receipt" "$stage/receipt.json"
          python3 - "$stage/receipt.json" <<'PY'
          import json, math, os, pathlib, sys
          def reject_constant(v): raise ValueError(v)
          def finite_float(v):
              x=float(v)
              if not math.isfinite(x): raise ValueError(v)
              return x
          def no_dupes(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(k)
                  out[k]=v
              return out
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(), parse_constant=reject_constant, parse_float=finite_float, object_pairs_hook=no_dupes)
          def integer(k):
              v=d[k]; assert type(v) is int and not isinstance(v,bool); return v
          def finite(k):
              v=d[k]; assert type(v) in (int,float) and not isinstance(v,bool) and math.isfinite(v); return float(v)
          assert d['schema']=='grand-bruxelles-bourse-8512036-pass-through-v5'
          assert integer('road_osm_id')==8512036
          assert d['lookup_mode']=='deterministic_runtime_index'
          assert d['source_path']==os.environ['LOCKED_SOURCE_PATH'] and d['source_sha256']==os.environ['LOCKED_SOURCE_SHA256']
          assert integer('physics_hz')==60
          assert integer('movement_step_limit')==180
          required=integer('post_target_step_count'); assert required==60
          assert finite('post_target_duration_seconds')==1.0
          assert d['input_mode']=='continuous_authoritative_sprint_through_target_and_post_target_phase'
          first=integer('first_target_plane_step'); assert 1 <= first <= 180
          source_length=finite('source_path_length_m'); assert source_length>0.0
          initial_progress=finite('initial_post_target_progress_m'); assert initial_progress >= source_length - 1e-6
          final_progress=finite('final_post_target_progress_m')
          net_progress=finite('post_target_net_progress_m'); assert abs(net_progress - (final_progress-initial_progress)) <= 1e-6
          radius=finite('authoritative_capsule_radius_m'); assert radius>0.0
          assert d['required_post_target_clearance_derivation']=='authoritative_player_capsule_radius'
          required_clearance=finite('required_post_target_clearance_m'); assert abs(required_clearance-radius) <= 1e-9
          assert net_progress >= required_clearance - 1e-6
          assert final_progress >= source_length + required_clearance - 1e-6
          assert d['meaningful_post_target_progress'] is True
          assert d['body_cleared_target_plane'] is True
          sprint=finite('authoritative_sprint_speed_mps'); assert sprint>0.0
          margin=finite('authoritative_safe_margin_m'); assert margin>=0.0
          slides=integer('authoritative_max_slides'); assert slides>=1
          assert d['recovery_budget_derivation']=='authoritative_safe_margin_times_max_slides'
          recovery=finite('recovery_budget_m'); assert abs(recovery - margin*slides) <= 1e-9
          max_forward=finite('max_forward_step_m'); assert abs(max_forward - (sprint/60.0 + recovery)) <= 1e-9
          max_backward=finite('max_backward_step_m'); assert abs(max_backward - recovery) <= 1e-9
          max_horizontal=finite('max_horizontal_step_m'); assert abs(max_horizontal - (sprint/60.0 + recovery)) <= 1e-9
          observed_forward=finite('max_observed_forward_step_m'); assert 0.0 <= observed_forward <= max_forward + 1e-6
          observed_backward=finite('max_observed_backward_step_m'); assert 0.0 <= observed_backward <= max_backward + 1e-6
          observed_horizontal=finite('max_observed_horizontal_step_m'); assert 0.0 <= observed_horizontal <= max_horizontal + 1e-6
          assert integer('progress_violation_count')==0
          assert integer('first_progress_violation_step')==0
          assert integer('horizontal_step_violation_count')==0
          assert integer('first_horizontal_step_violation_step')==0
          assert d['continuous_post_target_progress_bound'] is True
          assert d['continuous_post_target_horizontal_step_bound'] is True
          assert d['lateral_tolerance_derivation']=='authoritative_player_capsule_radius'
          assert integer('post_target_frames')==required
          assert integer('post_target_grounded_frames')==required
          assert integer('post_target_canonical_support_frames')==required
          assert integer('post_target_within_capsule_frames')==required
          assert integer('first_post_target_failure_step')==0
          lateral=finite('max_post_target_lateral_error_m'); assert 0.0 <= lateral <= radius + 1e-6
          assert d['dedicated_post_target_phase_completed'] is True
          assert d['continuous_post_target_lateral_bound'] is True
          assert d['support_mode']=='characterbody_capsule_test_motion'
          assert d['canonical_owner_id']=='generic_osm_surface_collision_runtime'
          assert d['requested_osm_id_owned_every_post_target_frame'] is True
          assert d['actual_character_body_move_and_slide'] is True and d['pass_through_green'] is True
          for k in ('source_geometry_changed','collision_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized'):
              assert d[k] is False
          PY

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PASS_THROUGH_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$PASS_THROUGH_HEAD_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -

      - name: Stage provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-pass-through-evidence
          mkdir -p "$stage"
          printf '%s\n' "$PASS_THROUGH_BASE_SHA" > "$stage/live-main-sha.txt"
          printf '%s\n' "$PASS_THROUGH_HEAD_SHA" > "$stage/exact-head-sha.txt"
          sha256sum "$stage"/* > "$stage/SHA256SUMS.txt"

      - name: Upload pass-through evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-8512036-pass-through-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/bourse-pass-through-evidence
          if-no-files-found: error
          retention-days: 14
