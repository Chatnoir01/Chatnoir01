name: Grand Bruxelles Bourse 8512036 Player Motion Continuity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-player-motion-continuity.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_player_motion_continuity_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-player-motion-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'BOURSE_8512036_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'BOURSE_8512036_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-motion-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bourse-motion-import.log

      - name: Prove three-second Bourse player motion continuity
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_player_motion_continuity_test.gd 2>&1 | tee /tmp/bourse-motion-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_PLAYER_MOTION_CONTINUITY_FAIL" /tmp/bourse-motion-runtime.log
          grep -q 'BOURSE_8512036_PLAYER_MOTION_CONTINUITY_GREEN' /tmp/bourse-motion-runtime.log

      - name: Seal fail-closed motion receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-motion-evidence
          receipt=grand-bruxelles-game/artifacts/qa/bourse_8512036_player_motion_continuity.json
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/bourse-motion-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/bourse-motion-runtime.log "$stage/runtime.log" 2>/dev/null || true
          test -s "$receipt"
          cp "$receipt" "$stage/receipt.json"
          python3 - "$stage/receipt.json" <<'PY'
          import json, math, os, pathlib, sys
          def reject_constant(value): raise ValueError(f"non-standard JSON number: {value}")
          def finite_float(value):
              parsed=float(value)
              if not math.isfinite(parsed): raise ValueError(f"non-finite JSON float: {value}")
              return parsed
          def no_duplicate_keys(pairs):
              out={}
              for key,value in pairs:
                  if key in out: raise ValueError(f"duplicate JSON key: {key}")
                  out[key]=value
              return out
          def finite_number(d,key):
              value=d[key]
              assert type(value) in (int,float) and not isinstance(value,bool) and math.isfinite(value)
              return float(value)
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'),parse_constant=reject_constant,parse_float=finite_float,object_pairs_hook=no_duplicate_keys)
          assert d['schema']=='grand-bruxelles-bourse-8512036-player-motion-continuity-v6'
          assert type(d['road_osm_id']) is int and d['road_osm_id']==8512036
          assert d['lookup_mode']=='deterministic_runtime_index'
          assert d['source_path']==os.environ['LOCKED_SOURCE_PATH']
          assert d['source_sha256']==os.environ['LOCKED_SOURCE_SHA256']
          assert d['simulation_seconds']==3.0 and type(d['physics_hz']) is int and d['physics_hz']==60
          assert type(d['step_count']) is int and d['step_count']==180
          for key in ('authoritative_sprint_speed_mps','authoritative_gravity_mps2','capsule_radius_m','capsule_height_m','authoritative_floor_snap_length_m','authoritative_safe_margin_m','authoritative_support_probe_distance_m','path_length_m','station_two_progress_m','static_gap_clear_progress_m','max_progress_m','expected_unobstructed_progress_m','progress_ratio_measurement_only','max_vertical_delta_m','max_lateral_deviation_m','final_progress_m','final_lateral_deviation_m','final_distance_to_target_m'):
              finite_number(d,key)
          assert d['authoritative_sprint_speed_mps']>0 and d['authoritative_gravity_mps2']>0 and d['capsule_radius_m']>0 and d['capsule_height_m']>0 and d['path_length_m']>0
          expected_probe=d['authoritative_floor_snap_length_m'] if d['authoritative_floor_snap_length_m']>0 else d['authoritative_safe_margin_m']
          assert expected_probe>0 and math.isclose(d['authoritative_support_probe_distance_m'],expected_probe,rel_tol=0.0,abs_tol=1e-9)
          assert d['support_probe_uses_player_capsule'] is True and d['support_probe_test_only'] is True and d['support_probe_recovery_as_collision'] is True
          assert math.isclose(d['station_two_progress_m'],d['path_length_m']/6.0,rel_tol=0.0,abs_tol=1e-9)
          assert math.isclose(d['static_gap_clear_progress_m'],d['station_two_progress_m']+d['capsule_radius_m'],rel_tol=0.0,abs_tol=1e-9)
          assert d['actual_character_body_move_and_slide'] is True
          assert d['crossed_static_gap_station'] is True
          assert d['grounded_after_static_gap_within_source_segment'] is True
          assert d['source_segment_grounding_required'] is True
          assert d['lateral_tolerance_derived_from_capsule_radius'] is True
          assert d['static_edge_ray_diagnostic_is_release_gate'] is False
          assert d['diagnostic_center_ray_is_release_gate'] is False
          assert d['slide_collision_diagnostic_is_release_gate'] is False
          assert type(d['diagnostic_center_ray_misses']) is int and d['diagnostic_center_ray_misses']>=0
          assert type(d['slide_support_diagnostic_frames']) is int and d['slide_support_diagnostic_frames']>=0
          assert type(d['slide_support_diagnostic_misses']) is int and d['slide_support_diagnostic_misses']>=0
          assert d['slide_support_diagnostic_frames']+d['slide_support_diagnostic_misses']==d['step_count']
          assert type(d['floor_frames']) is int and d['floor_frames']==d['step_count']
          assert type(d['airborne_frames']) is int and d['airborne_frames']==0
          assert type(d['source_segment_frames_after_gap']) is int and d['source_segment_frames_after_gap']>0
          assert type(d['airborne_after_gap_within_source_segment']) is int and d['airborne_after_gap_within_source_segment']==0
          assert d['first_airborne_after_gap_frame']=={}
          assert d['continuous_grounding_after_gap_required'] is True and d['continuous_grounding_after_gap'] is True
          assert d['surface_collision_mask']==524288
          assert d['collision_owner_meta']=='grand_bruxelles_owner'
          assert d['collision_owner_id']=='generic_osm_surface_collision_runtime'
          assert d['collision_road_ids_meta']=='road_support_osm_ids'
          assert d['road_support_mode']=='characterbody_capsule_test_motion'
          for key in ('road_support_frames','missing_road_support_frames','wrong_owner_support_frames','wrong_road_support_frames'):
              assert type(d[key]) is int and d[key]>=0
          assert d['road_support_frames']==d['step_count']
          assert d['missing_road_support_frames']==0 and d['wrong_owner_support_frames']==0 and d['wrong_road_support_frames']==0
          assert d['first_invalid_road_support_frame']=={}
          assert d['continuous_requested_road_support_required'] is True and d['continuous_requested_road_support'] is True
          proof=d['grounding_proof_frame']
          assert isinstance(proof,dict) and proof and proof['on_floor'] is True and proof['within_source_segment'] is True and proof['within_capsule_centerline_tolerance'] is True and proof['canonical_requested_road_support'] is True
          samples=d['samples']
          assert isinstance(samples,list) and len(samples)>0
          for sample in samples:
              assert sample['on_floor'] is True and sample['canonical_requested_road_support'] is True
              support=sample['road_support']
              assert support['hit'] is True and support['canonical_owner'] is True and support['requested_osm_id_owned'] is True
              assert support['collider_owner_id']=='generic_osm_surface_collision_runtime'
              assert support['support_mode']=='characterbody_capsule_test_motion'
              ids=support['collider_road_support_osm_ids']
              assert isinstance(ids,list) and all(type(v) is int and v>0 for v in ids) and len(ids)==len(set(ids)) and 8512036 in ids
              normal=support['contact_normal']
              assert isinstance(normal,list) and len(normal)==3 and all(type(v) in (int,float) and not isinstance(v,bool) and math.isfinite(v) for v in normal)
              assert math.isclose(finite_number(support,'probe_distance_m'),d['authoritative_support_probe_distance_m'],rel_tol=0.0,abs_tol=1e-9)
              assert support['probe_distance_source'] in ('floor_snap_length','safe_margin')
          for k in ('collision_geometry_changed','source_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized'): assert d[k] is False
          PY
          sha256sum "$stage/receipt.json" "$stage/runtime.log" > "$stage/SHA256SUMS"

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BOURSE_8512036_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BOURSE_8512036_HEAD_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -

      - name: Upload Bourse player-motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-player-motion-continuity
          path: /tmp/bourse-motion-evidence
          if-no-files-found: error
