name: Grand Bruxelles Bourse 8512036 Post-Handshake Render Readiness

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd'
      - 'grand-bruxelles-game/game/tests/bourse_8512036_post_handshake_render_readiness_test.gd'
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/osm/**'
      - '.github/workflows/grand-bruxelles-bourse-8512036-post-handshake-render-readiness.yml'

permissions:
  contents: read

jobs:
  post-handshake-render-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry and source bytes
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$HEAD_SHA" "$LIVE_MAIN_SHA")" = "$LIVE_MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'BOURSE_POST_HANDSHAKE_BASE_SHA=%s\n' "$LIVE_MAIN_SHA" >> "$GITHUB_ENV"
          printf 'BOURSE_POST_HANDSHAKE_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"
          echo "BOURSE_POST_HANDSHAKE_LIVE_MAIN_OK live=$LIVE_MAIN_SHA head=$HEAD_SHA source_locked=true"
      - name: Install verified Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'
      - name: Import exact candidate project
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-post-handshake-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/bourse-post-handshake-import.log; then exit 1; fi
      - name: Prove post-handshake production render readiness
        run: |
          set -euo pipefail
          rm -f grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.json
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_8512036_post_handshake_render_readiness_test.gd 2>&1 | tee /tmp/bourse-post-handshake.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BOURSE_8512036_POST_HANDSHAKE_RENDER_READINESS_FAIL' /tmp/bourse-post-handshake.log; then exit 1; fi
          grep -q 'BOURSE_8512036_POST_HANDSHAKE_RENDER_READINESS_OK' /tmp/bourse-post-handshake.log
          grep -q 'source_identity_locked=true' /tmp/bourse-post-handshake.log
          grep -q 'exact_metadata_types=true' /tmp/bourse-post-handshake.log
      - name: Seal fail-closed receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          class ReceiptValidationError(ValueError):
              pass

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ReceiptValidationError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          def reject_constant(value):
              raise ReceiptValidationError(f'non-standard JSON numeric constant: {value}')

          def strict_json_bytes(raw: bytes):
              try:
                  text = raw.decode('utf-8', errors='strict')
              except UnicodeDecodeError as exc:
                  raise ReceiptValidationError('receipt is not strict UTF-8') from exc
              try:
                  return json.loads(text, object_pairs_hook=reject_duplicate_keys, parse_constant=reject_constant)
              except (json.JSONDecodeError, ReceiptValidationError) as exc:
                  raise ReceiptValidationError(f'invalid strict JSON receipt: {exc}') from exc

          def exact_int(value, key):
              if type(value) is not int:
                  raise ReceiptValidationError(f'{key} must be an exact JSON integer')
              return value

          def exact_string(value, key):
              if type(value) is not str or not value or value.strip() != value:
                  raise ReceiptValidationError(f'{key} must be an exact non-empty canonical JSON string')
              return value

          def finite_number(value, key):
              if type(value) not in (int, float) or not math.isfinite(value):
                  raise ReceiptValidationError(f'{key} must be a finite JSON number')
              return float(value)

          for bad in (
              b'{"ground_y":NaN}',
              b'{"road_osm_id":8512036,"road_osm_id":1}',
          ):
              try:
                  strict_json_bytes(bad)
              except ReceiptValidationError:
                  pass
              else:
                  raise AssertionError('strict JSON regression accepted malformed receipt')
          try:
              finite_number(True, 'ground_y')
          except ReceiptValidationError:
              pass
          else:
              raise AssertionError('boolean numeric regression accepted')

          p=Path('grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.json')
          d=strict_json_bytes(p.read_bytes())
          assert isinstance(d, dict)
          assert d['schema']=='grand-bruxelles-bourse-8512036-post-handshake-render-readiness-v2'
          assert exact_int(d['road_osm_id'], 'road_osm_id')==8512036 and d['request']=='road-8512036'
          assert d['render_predicate']=='automatic_road_direct_spawn._road_is_rendered'
          assert d['resolver_applied'] is True
          assert d['post_handshake_render_required'] is True
          assert d['rendered_after_handshake'] is True
          assert exact_int(d['stabilization_frames'], 'stabilization_frames') >= 1
          assert d['lookup_mode']=='deterministic_runtime_index'
          assert exact_string(d['source_path'], 'source_path') == os.environ['LOCKED_SOURCE_PATH']
          assert exact_string(d['source_sha256'], 'source_sha256') == os.environ['LOCKED_SOURCE_SHA256']
          assert d['locked_source_identity_required'] is True
          assert d['exact_metadata_types_required'] is True
          finite_number(d['ground_y'], 'ground_y')
          assert d['source_sightline_clear'] is True
          for key in ['source_geometry_changed','collision_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized']:
              assert d[key] is False, key
          print('BOURSE_POST_HANDSHAKE_RECEIPT_OK rendered_after=true strict_json=true source_identity_locked=true finite_ground=true promotion=false')
          PY
      - name: Bind evidence SHA-256
        run: |
          set -euo pipefail
          cp /tmp/bourse-post-handshake.log grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.log
          cp /tmp/bourse-post-handshake-import.log grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness_import.log
          cd grand-bruxelles-game/artifacts/qa
          sha256sum bourse_8512036_post_handshake_render_readiness.json bourse_8512036_post_handshake_render_readiness.log bourse_8512036_post_handshake_render_readiness_import.log > bourse_8512036_post_handshake_render_readiness.sha256
          sha256sum --check bourse_8512036_post_handshake_render_readiness.sha256
      - name: Revalidate exact live main head and source before success
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BOURSE_POST_HANDSHAKE_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BOURSE_POST_HANDSHAKE_HEAD_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BOURSE_POST_HANDSHAKE_BASE_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: bourse-8512036-post-handshake-render-readiness
          path: |
            grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.json
            grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.log
            grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness_import.log
            grand-bruxelles-game/artifacts/qa/bourse_8512036_post_handshake_render_readiness.sha256
          if-no-files-found: error
