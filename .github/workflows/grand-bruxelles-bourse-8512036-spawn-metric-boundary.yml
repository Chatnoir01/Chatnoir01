name: Grand Bruxelles Bourse 8512036 Spawn Metric Boundary

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-spawn-metric-boundary.yml"
      - "grand-bruxelles-game/tests/validate_bourse_8512036_spawn_metric_boundary.py"
      - "grand-bruxelles-game/tests/validate_bourse_8512036_masked_native_receipt.py"
      - "grand-bruxelles-game/tests/validate_bourse_8512036_masked_native_receipt_source_bound.py"
      - "grand-bruxelles-game/game/tests/bourse_8512036_corridor_masked_visual_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-spawn-metric-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      EXPECTED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          echo "$EXPECTED_SOURCE_SHA256  grand-bruxelles-game/data/osm/vertical_slice_01.game.json" | sha256sum -c -

      - name: Compile metric-boundary proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile grand-bruxelles-game/tests/validate_bourse_8512036_spawn_metric_boundary.py

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'

      - name: Import exact-head project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/spawn-metric-import.log
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/spawn-metric-import.log

      - name: Produce exact native Bourse receipt
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/bourse_8512036_corridor_masked_visual_test.gd 2>&1 | tee /tmp/spawn-metric-runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_CORRIDOR_MASKED_VISUAL_FAIL" /tmp/spawn-metric-runtime.log
          test "$(grep -c 'BOURSE_8512036_CORRIDOR_MASKED_VISUAL_OK' /tmp/spawn-metric-runtime.log)" -eq 1

      - name: Prove 1 mm midpoint boundary is metric
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tests/validate_bourse_8512036_spawn_metric_boundary.py \
            --receipt grand-bruxelles-game/artifacts/qa/bourse_8512036_corridor_masked_visual/receipt.json \
            --source grand-bruxelles-game/data/osm/vertical_slice_01.game.json \
            --source-sha "$EXPECTED_SOURCE_SHA256" \
            2>&1 | tee /tmp/spawn-metric-boundary.log
          grep -q 'BOURSE_8512036_SPAWN_METRIC_BOUNDARY_GREEN' /tmp/spawn-metric-boundary.log

      - name: Upload metric-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-spawn-metric-boundary
          path: |
            /tmp/spawn-metric-import.log
            /tmp/spawn-metric-runtime.log
            /tmp/spawn-metric-boundary.log
            grand-bruxelles-game/artifacts/qa/bourse_8512036_corridor_masked_visual/receipt.json
          if-no-files-found: error
          retention-days: 7
