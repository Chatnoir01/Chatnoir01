name: Grand Bruxelles Bourse 8512036 Target Proximity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-8512036-target-proximity.yml"
      - "grand-bruxelles-game/game/tests/bourse_8512036_target_proximity_test.gd"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-8512036-target-proximity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
      LOCKED_SOURCE_SHA256: 899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398
      LOCKED_SOURCE_PATH: res://data/osm/vertical_slice_01.game.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact-current-main ancestry and locked source
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"; fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -
          printf 'TARGET_PROXIMITY_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'TARGET_PROXIMITY_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 unzip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'

      - name: Import exact-head project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/target-proximity-import.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/target-proximity-import.log

      - name: Prove physical target proximity
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_8512036_target_proximity_test.gd 2>&1 | tee /tmp/target-proximity-runtime.log
          status=${PIPESTATUS[0]}; test "$status" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|BOURSE_8512036_TARGET_PROXIMITY_FAIL" /tmp/target-proximity-runtime.log
          grep -q 'BOURSE_8512036_TARGET_PROXIMITY_GREEN' /tmp/target-proximity-runtime.log

      - name: Seal fail-closed target-proximity receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage=/tmp/bourse-target-proximity-evidence
          receipt=grand-bruxelles-game/artifacts/qa/bourse_8512036_target_proximity.json
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/target-proximity-import.log "$stage/import.log" 2>/dev/null || true
          cp /tmp/target-proximity-runtime.log "$stage/runtime.log" 2>/dev/null || true
          test -s "$receipt"
          cp "$receipt" "$stage/receipt.json"
          python3 - "$stage/receipt.json" <<'PY'
          import json, math, os, pathlib, sys
          def reject_constant(v): raise ValueError(v)
          def finite_float(v):
              x=float(v)
              if not math.isfinite(x): raise ValueError(v)
              return x
          def no_dupes(pairs):
              out={}
              for k,v in pairs:
                  if k in out: raise ValueError(k)
                  out[k]=v
              return out
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(),parse_constant=reject_constant,parse_float=finite_float,object_pairs_hook=no_dupes)
          def finite(k):
              v=d[k]; assert type(v) in (int,float) and not isinstance(v,bool) and math.isfinite(v); return float(v)
          assert d['schema']=='grand-bruxelles-bourse-8512036-target-proximity-v3'
          assert type(d['road_osm_id']) is int and d['road_osm_id']==8512036
          assert d['lookup_mode']=='deterministic_runtime_index'
          assert d['source_path']==os.environ['LOCKED_SOURCE_PATH'] and d['source_sha256']==os.environ['LOCKED_SOURCE_SHA256']
          assert type(d['physics_hz']) is int and d['physics_hz']==60
          assert type(d['step_count']) is int and d['step_count']==180
          source_length=finite('source_path_length_m'); assert source_length>0
          radius=finite('authoritative_capsule_radius_m'); assert radius>0
          assert d['target_tolerance_derivation']=='authoritative_player_capsule_radius'
          assert d['target_plane_crossed'] is True
          assert type(d['first_target_plane_step']) is int and not isinstance(d['first_target_plane_step'],bool) and 1 <= d['first_target_plane_step'] <= 180
          distance=finite('first_target_plane_distance_m'); lateral=finite('first_target_plane_lateral_deviation_m'); minimum=finite('min_target_distance_m')
          assert distance >= 0 and lateral >= 0 and minimum >= 0
          assert distance <= radius + 1e-6
          assert lateral <= distance + 1e-6
          assert minimum <= distance + 1e-9
          assert d['first_target_plane_on_floor'] is True
          assert type(d['floor_frames_measurement']) is int and not isinstance(d['floor_frames_measurement'],bool) and 1 <= d['floor_frames_measurement'] <= 180
          assert d['source_target_capsule_contact'] is True
          assert d['grounded_source_target_capsule_contact'] is True
          assert d['target_support_mode']=='characterbody_capsule_test_motion'
          assert d['target_support_hit'] is True
          assert d['target_support_canonical_owner'] is True
          assert d['target_support_requested_osm_id_owned'] is True
          assert d['target_support_owner_id']=='generic_osm_surface_collision_runtime'
          ids=d['target_support_road_support_osm_ids']; assert type(ids) is list and all(type(x) is int and x>0 for x in ids) and len(ids)==len(set(ids)) and 8512036 in ids
          assert d['grounded_source_target_canonical_road_contact'] is True
          probe=finite('target_support_probe_distance_m'); assert probe>0
          assert d['target_support_probe_distance_source'] in ('floor_snap_length','safe_margin')
          assert d['actual_character_body_move_and_slide'] is True
          for k in ('source_geometry_changed','collision_geometry_changed','camera_changed','resolver_thresholds_lowered','destination_advertisable','visual_acceptance','jouable_authorized'): assert d[k] is False
          PY
          sha256sum "$stage/receipt.json" "$stage/runtime.log" > "$stage/SHA256SUMS"

      - name: Revalidate live main before success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_PROXIMITY_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_PROXIMITY_HEAD_SHA"
          printf '%s  %s\n' "$LOCKED_SOURCE_SHA256" grand-bruxelles-game/data/osm/vertical_slice_01.game.json | sha256sum -c -

      - name: Upload target-proximity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-8512036-target-proximity
          path: /tmp/bourse-target-proximity-evidence
          if-no-files-found: error
