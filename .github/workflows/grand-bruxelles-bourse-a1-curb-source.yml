name: Grand Bruxelles Bourse A1 Curb Source

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/discover_bourse_curb_alignment_sources.py"
      - "grand-bruxelles-game/tools/probe_bourse_curb_alignment.py"
      - "grand-bruxelles-game/data/urbis/bourse_curb_source_policy.game.json"
      - "grand-bruxelles-game/data/urbis/bourse_official_sidewalks.game.json"
      - ".github/workflows/grand-bruxelles-bourse-a1-curb-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-curb-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official UrbIS Topo curb-alignment lines
        run: |
          mkdir -p grand-bruxelles-game/artifacts/bourse-a1-curb-source
          python3 grand-bruxelles-game/tools/probe_bourse_curb_alignment.py \
            --output grand-bruxelles-game/artifacts/bourse-a1-curb-source/spatial_evidence.json
      - name: Upload source spatial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-a1-curb-source-spatial
          path: grand-bruxelles-game/artifacts/bourse-a1-curb-source/spatial_evidence.json
          if-no-files-found: error
