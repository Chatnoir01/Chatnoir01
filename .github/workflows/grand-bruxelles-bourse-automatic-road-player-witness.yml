name: Grand Bruxelles Bourse Automatic Road Player Witness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_tree_asset.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_tree_material.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_lamp_asset.gd"
      - "grand-bruxelles-game/game/scripts/brussels_bollard_asset.gd"
      - "grand-bruxelles-game/game/tests/bourse_automatic_road_direct_spawn_witness_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_automatic_road_player_witness_contract_test.py"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-bourse-automatic-road-player-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry and exact checked-out head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "checked_out_head=$checked_out_head"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
          printf 'BOURSE_VALIDATED_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'BOURSE_VALIDATED_HEAD_SHA=%s\n' "$checked_out_head" >> "$GITHUB_ENV"
      - name: Prove Bourse witness contract
        run: python3 grand-bruxelles-game/game/tests/bourse_automatic_road_player_witness_contract_test.py
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          rm -rf /tmp/godot /tmp/godot.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          godot_version="$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version)"
          printf '%s\n' "$godot_version" | grep -E '^4\.7\.1\.stable\.'
          printf 'BOURSE_GODOT_VERSION=%s\n' "$godot_version" >> "$GITHUB_ENV"
          printf 'BOURSE_GODOT_ZIP_SHA256=%s\n' "$GODOT_ZIP_SHA256" >> "$GITHUB_ENV"
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-auto-road-import.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bourse-auto-road-import.log; then exit 1; fi
      - name: Capture source-backed Bourse road-411724192 player witness
        shell: bash
        run: |
          set -o pipefail
          log=/tmp/bourse-auto-road-player-witness.log
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_automatic_road_direct_spawn_witness_test.gd 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_AUTOMATIC_ROAD_PLAYER_WITNESS_FAIL" "$log"; then exit 1; fi
          grep -q "BOURSE_AUTOMATIC_ROAD_PLAYER_WITNESS_GREEN" "$log"
      - name: Seal exact Bourse player-view evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          png="grand-bruxelles-game/artifacts/visual/automatic_road_411724192_player.png"
          stage="/tmp/bourse-auto-road-player-evidence"
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/bourse-auto-road-player-witness.log "$stage/runtime.log" 2>/dev/null || true
          cp /tmp/bourse-auto-road-import.log "$stage/import.log" 2>/dev/null || true
          if [[ -s "$png" ]]; then cp "$png" "$stage/automatic_road_411724192_player.png"; fi
          python3 - "$png" "$stage" <<'PY'
          import hashlib, json, os, pathlib, re, struct, sys
          png = pathlib.Path(sys.argv[1])
          stage = pathlib.Path(sys.argv[2])
          if not png.is_file():
              raise SystemExit('missing Bourse player-view PNG')
          raw = png.read_bytes()
          if raw[:8] != b'\x89PNG\r\n\x1a\n' or raw[12:16] != b'IHDR':
              raise SystemExit('invalid PNG witness signature/IHDR')
          width, height = struct.unpack('>II', raw[16:24])
          if (width, height) != (1280, 720):
              raise SystemExit(f'unexpected witness dimensions: {(width, height)}')
          log = pathlib.Path('/tmp/bourse-auto-road-player-witness.log')
          text = log.read_text(encoding='utf-8', errors='replace')
          if 'BOURSE_AUTOMATIC_ROAD_PLAYER_WITNESS_GREEN' not in text:
              raise SystemExit('GREEN marker absent from runtime log')
          if 'independently_observed_ground_y=' not in text or 'support_kind=' not in text:
              raise SystemExit('independent support identity absent from runtime log')
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          root = pathlib.Path('grand-bruxelles-game')
          receipt = {
              'schema': 'grand-bruxelles-bourse-automatic-road-player-witness-v2',
              'base_sha': os.environ.get('BOURSE_VALIDATED_BASE_SHA', ''),
              'head_sha': os.environ.get('BOURSE_VALIDATED_HEAD_SHA', ''),
              'godot_version': os.environ.get('BOURSE_GODOT_VERSION', ''),
              'godot_zip_sha256': os.environ.get('BOURSE_GODOT_ZIP_SHA256', ''),
              'osm_id': 411724192,
              'source_name': 'Rue Auguste Orts - Auguste Ortsstraat',
              'source': 'OpenStreetMap contributors via Overpass API',
              'source_license': 'ODbL-1.0',
              'source_sha256': sha(root / 'data/osm/vertical_slice_01.game.json'),
              'runtime_index_sha256': sha(root / 'data/runtime/road_destination_runtime_index.json'),
              'resolver_sha256': sha(root / 'game/scripts/automatic_road_direct_spawn.gd'),
              'test_sha256': sha(root / 'game/tests/bourse_automatic_road_direct_spawn_witness_test.gd'),
              'runtime_log_sha256': sha(log),
              'import_log_sha256': sha(pathlib.Path('/tmp/bourse-auto-road-import.log')),
              'png_sha256': sha(png),
              'width': width,
              'height': height,
              'independent_support_proof': True,
              'camera_unchanged_required': True,
              'dynamic_state_frozen': True,
              'human_full_frame_review_required': True,
              'destination_advertisable': False,
              'visual_acceptance': False,
              'jouable_authorized': False,
          }
          (stage / 'manifest.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          (cd "$stage" && find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt)
      - name: Revalidate exact proof identity before success
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BOURSE_VALIDATED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BOURSE_VALIDATED_HEAD_SHA"
      - name: Upload exact Bourse player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-411724192-player-witness
          path: /tmp/bourse-auto-road-player-evidence/
          if-no-files-found: error
