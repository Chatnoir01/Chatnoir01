name: Grand Bruxelles Bourse Automatic Road Player Witness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/bourse_automatic_road_direct_spawn_witness_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_automatic_road_player_witness_contract_test.py"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-bourse-automatic-road-player-witness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require branch built from live main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Prove Bourse witness contract
        run: python3 grand-bruxelles-game/game/tests/bourse_automatic_road_player_witness_contract_test.py
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-auto-road-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bourse-auto-road-import.log; then exit 1; fi
      - name: Capture source-backed Bourse road-411724192 player witness
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_automatic_road_direct_spawn_witness_test.gd 2>&1 | tee /tmp/bourse-auto-road-player-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_AUTOMATIC_ROAD_PLAYER_WITNESS_FAIL" /tmp/bourse-auto-road-player-witness.log; then exit 1; fi
          grep -q "BOURSE_AUTOMATIC_ROAD_PLAYER_WITNESS_GREEN" /tmp/bourse-auto-road-player-witness.log
      - name: Stage exact Bourse player-view evidence
        if: always()
        run: |
          set -euo pipefail
          png="grand-bruxelles-game/artifacts/visual/automatic_road_411724192_player.png"
          stage="/tmp/bourse-auto-road-player-evidence"
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/bourse-auto-road-player-witness.log "$stage/runtime.log" 2>/dev/null || true
          if [[ -s "$png" ]]; then
            python3 - "$png" <<'PY'
          import struct, sys
          p=sys.argv[1]
          with open(p,'rb') as f:
              assert f.read(8)==b'\x89PNG\r\n\x1a\n'
              n=struct.unpack('>I',f.read(4))[0]; kind=f.read(4)
              assert n==13 and kind==b'IHDR'
              w,h=struct.unpack('>II',f.read(8))
          assert (w,h)==(1280,720), (w,h)
          print('BOURSE_AUTOMATIC_ROAD_PLAYER_FRAME_OK', w, h)
          PY
            cp "$png" "$stage/automatic_road_411724192_player.png"
          fi
          cd "$stage"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt
      - name: Upload exact Bourse player-view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-road-411724192-player-witness
          path: /tmp/bourse-auto-road-player-evidence/
          if-no-files-found: error
