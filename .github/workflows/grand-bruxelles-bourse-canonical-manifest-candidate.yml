name: Grand Bruxelles Bourse Canonical Manifest Candidate

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/bourse_canonical_registration_review.contract.json"
      - "grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e147500-n170000-s500/**"
      - "grand-bruxelles-game/data/cell_manifests/bxl-e147500-n170000-s500.json"
      - "grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json"
      - "grand-bruxelles-game/data/provenance/bourse_canonical_manifest_candidate.review.json"
      - "grand-bruxelles-game/tools/qa/build_bourse_canonical_manifest_candidate.py"
      - "grand-bruxelles-game/tests/test_bourse_canonical_manifest_candidate.py"
      - ".github/workflows/grand-bruxelles-bourse-canonical-manifest-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA" || {
            echo "RED: candidate branch does not contain live main" >&2
            exit 1
          }
          echo "LIVE_MAIN_SHA=$LIVE_MAIN_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fail-closed candidate regressions
        run: python grand-bruxelles-game/tests/test_bourse_canonical_manifest_candidate.py

      - name: Resolve candidate lifecycle phase
        run: |
          set -euo pipefail
          if [ -f grand-bruxelles-game/data/cell_manifests/bxl-e147500-n170000-s500.json ]; then
            echo "CANDIDATE_PHASE=registered" >> "$GITHUB_ENV"
          else
            echo "CANDIDATE_PHASE=unregistered" >> "$GITHUB_ENV"
          fi

      - name: Build deterministic boundary-cell candidate before registration
        if: env.CANDIDATE_PHASE == 'unregistered'
        run: |
          mkdir -p "$RUNNER_TEMP/bourse-canonical-candidate"
          python grand-bruxelles-game/tools/qa/build_bourse_canonical_manifest_candidate.py \
            --repo-root grand-bruxelles-game \
            --production-base-sha "$LIVE_MAIN_SHA" \
            --out-candidate "$RUNNER_TEMP/bourse-canonical-candidate/bxl-e147500-n170000-s500.candidate.json" \
            --out-review "$RUNNER_TEMP/bourse-canonical-candidate/bourse_canonical_manifest_candidate.review.json"

      - name: Prove candidate compatibility with registered-cell index builder in sandbox only
        if: env.CANDIDATE_PHASE == 'unregistered'
        run: |
          python - <<'PY'
          import importlib.util, os, shutil
          from pathlib import Path
          script=Path('grand-bruxelles-game/tools/qa/build_registered_cell_manifest_index.py')
          spec=importlib.util.spec_from_file_location('registered_index_builder', script)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          root=Path(os.environ['RUNNER_TEMP'])/'bourse-index-sandbox'
          manifests=root/'data/cell_manifests'; manifests.mkdir(parents=True, exist_ok=True)
          source=Path(os.environ['RUNNER_TEMP'])/'bourse-canonical-candidate/bxl-e147500-n170000-s500.candidate.json'
          shutil.copyfile(source, manifests/'bxl-e147500-n170000-s500.json')
          built=mod.build(manifests, root, os.environ['LIVE_MAIN_SHA'])
          assert built['registered_cell_count']==1
          row=built['entries'][0]
          assert row['cell_id']=='bxl-e147500-n170000-s500'
          assert row['maturity_state']=='data_ready'
          for key in ['runtime_directory_scan_authorized','road_crosswalk_authorized','runtime_mount_authorized','rendered_geometry_authorized','collision_authorized','safe_spawn_authorized','jouable_promotion_authorized']:
              assert built[key] is False, key
          print('BOURSE_CANONICAL_MANIFEST_CANDIDATE_INDEX_COMPATIBLE_SANDBOX_ONLY')
          PY

      - name: Preserve historical candidate evidence after registration
        if: env.CANDIDATE_PHASE == 'registered'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bourse-canonical-candidate"
          cp grand-bruxelles-game/data/provenance/bourse_canonical_manifest_candidate.review.json \
            "$RUNNER_TEMP/bourse-canonical-candidate/bourse_canonical_manifest_candidate.review.json"
          cp grand-bruxelles-game/data/cell_manifests/bxl-e147500-n170000-s500.json \
            "$RUNNER_TEMP/bourse-canonical-candidate/bxl-e147500-n170000-s500.registered.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('grand-bruxelles-game')
          review=json.loads((root/'data/provenance/bourse_canonical_manifest_candidate.review.json').read_text())
          canonical_path=root/'data/cell_manifests/bxl-e147500-n170000-s500.json'
          canonical=json.loads(canonical_path.read_text())
          index=json.loads((root/'data/provenance/brussels_registered_cell_manifest_index.json').read_text())
          assert review['status']=='CANDIDATE_MEASURED_UNREGISTERED'
          assert review['candidate_manifest']['sha256']=='ee8fca94ca0e2a9b98e20df10e894ccf0407b82ec7be84c5b103be5f46222af4'
          assert review['semantic_sha256']=='dfb707ba5dee41c0cc7a204751ddf229eba3944c389c92629d098634e7ff5ad8'
          assert all(v is False for v in review['authorization'].values())
          assert canonical['cell_id']=='bxl-e147500-n170000-s500'
          assert canonical['crs']=='EPSG:31370'
          assert canonical['maturity']['state']=='data_ready'
          assert all(v is False for v in canonical['maturity']['gates'].values())
          assert canonical['provenance']['municipality_assignment_policy']=='retain_all_official_intersections_no_dominant_municipality_canonicalization'
          assert [r['niscode'] for r in canonical['provenance']['municipality_intersections']]==['21001','21004']
          rows=[r for r in index['entries'] if r['cell_id']=='bxl-e147500-n170000-s500']
          assert len(rows)==1 and rows[0]['evidence_only'] is True
          assert rows[0]['manifest_sha256']==hashlib.sha256(canonical_path.read_bytes()).hexdigest()
          for key in ['runtime_directory_scan_authorized','road_crosswalk_authorized','runtime_mount_authorized','rendered_geometry_authorized','collision_authorized','safe_spawn_authorized','jouable_promotion_authorized']:
              assert index[key] is False, key
          print('BOURSE_CANONICAL_MANIFEST_CANDIDATE_HISTORICAL_EVIDENCE_RETAINED_AFTER_REGISTRATION')
          PY

      - name: Upload candidate lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-canonical-manifest-candidate
          path: ${{ runner.temp }}/bourse-canonical-candidate
          if-no-files-found: error

      - name: Require persisted lock before registration
        if: env.CANDIDATE_PHASE == 'unregistered'
        run: |
          set -euo pipefail
          LOCK=grand-bruxelles-game/data/provenance/bourse_canonical_manifest_candidate.review.json
          GENERATED="$RUNNER_TEMP/bourse-canonical-candidate/bourse_canonical_manifest_candidate.review.json"
          if [ ! -f "$LOCK" ]; then
            echo "RED_FIRST_EXPECTED: candidate measured and uploaded; persisted lock intentionally absent" >&2
            exit 1
          fi
          cmp -s "$LOCK" "$GENERATED" || {
            echo "RED: persisted candidate review differs from regenerated review" >&2
            diff -u "$LOCK" "$GENERATED" || true
            exit 1
          }
          python - <<'PY'
          import json, os
          from pathlib import Path
          review=json.loads(Path('grand-bruxelles-game/data/provenance/bourse_canonical_manifest_candidate.review.json').read_text())
          assert review['status']=='CANDIDATE_MEASURED_UNREGISTERED'
          assert review['production_base_sha']==os.environ['LIVE_MAIN_SHA']
          assert [r['niscode'] for r in review['municipality_boundary']['intersections']]==['21001','21004']
          assert all(v is False for v in review['authorization'].values())
          print('BOURSE_CANONICAL_MANIFEST_CANDIDATE_DURABLY_LOCKED_UNREGISTERED')
          PY
