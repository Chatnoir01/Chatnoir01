name: Grand Bruxelles Bourse Collision Sync

on:
  push:
    branches: ["fix/bourse-reveal-collision-sync"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-collision-sync.yml"
      - "grand-bruxelles-game/game/scripts/urbis_hero_builder.gd"
      - "grand-bruxelles-game/game/scripts/bourse_front_wall_reveal.gd"
      - "grand-bruxelles-game/game/tests/bourse_collision_sync_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-collision-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-collision-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/bourse-collision-import.log; then exit 1; fi
      - name: Validate Bourse visible/physical wall sync
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_collision_sync_test.gd 2>&1 | tee /tmp/bourse-collision-sync.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_COLLISION_SYNC_FAIL" /tmp/bourse-collision-sync.log; then exit 1; fi
          grep -F "BOURSE_COLLISION_SYNC_OK" /tmp/bourse-collision-sync.log
