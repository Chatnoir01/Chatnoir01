name: Grand Bruxelles Bourse Context Facade

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-context-facade.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/bourse_context_facade_runtime.gd"
      - "grand-bruxelles-game/game/scripts/bourse_context_facade_articulation.gd"
      - "grand-bruxelles-game/game/tests/bourse_context_facade_ab_witness_test.gd"
      - "grand-bruxelles-game/data/visual/bourse_context_facade_articulation.json"
      - "grand-bruxelles-game/data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-context-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate truth contract
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('grand-bruxelles-game/data/visual/bourse_context_facade_articulation.json'))
          p=d['presentation']
          assert d['schema']=='grand-bruxelles-bourse-context-facade-articulation-v2'
          assert not p['moves_source_geometry'] and not p['changes_building_height'] and not p['creates_collision']
          assert p['external_assets']==[] and p['external_textures']==[] and d['evidence']['same_camera_required'] is True
          print('BOURSE_CONTEXT_FACADE_TRUTH_OK')
          PY
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-context-facade-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bourse-context-facade-import.log; then exit 1; fi
      - name: Render deterministic same-camera BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_context_facade_ab_witness_test.gd 2>&1 | tee /tmp/bourse-context-facade-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_CONTEXT_FACADE_AB_FAIL" /tmp/bourse-context-facade-ab.log; then exit 1; fi
          grep -F "BOURSE_CONTEXT_FACADE_AB_OK" /tmp/bourse-context-facade-ab.log
          test -f grand-bruxelles-game/artifacts/visual/bourse_context_facade_before.png
          test -f grand-bruxelles-game/artifacts/visual/bourse_context_facade_after.png
      - name: Upload Bourse context facade witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-context-facade-ab-witness
          path: |
            grand-bruxelles-game/artifacts/visual/bourse_context_facade_before.png
            grand-bruxelles-game/artifacts/visual/bourse_context_facade_after.png
            /tmp/bourse-context-facade-ab.log
          if-no-files-found: warn
