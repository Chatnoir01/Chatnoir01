name: Grand Bruxelles Bourse Front Depth Guard

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/bourse_front_wall_reveal.gd"
      - "grand-bruxelles-game/game/tests/bourse_front_depth_guard_test.gd"
      - ".github/workflows/grand-bruxelles-bourse-front-depth-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and validate depth regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_front_depth_guard_test.gd 2>&1 | tee /tmp/depth-guard.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_FRONT_DEPTH_GUARD_FAIL" /tmp/depth-guard.log; then exit 1; fi
          grep -F "BOURSE_FRONT_DEPTH_GUARD_OK" /tmp/depth-guard.log
      - name: Capture exact base witness
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit >/tmp/base-import.log 2>&1
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_geotagged_camera_capture_test.gd >/tmp/base-capture.log 2>&1
          mkdir -p /tmp/bourse-depth-evidence
          cp grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png /tmp/bourse-depth-evidence/before.png
      - name: Capture exact head witness
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit >/tmp/head-import.log 2>&1
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_geotagged_camera_capture_test.gd >/tmp/head-capture.log 2>&1
          cp grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png /tmp/bourse-depth-evidence/after.png
      - name: Enforce anti-micro visual impact
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          root=Path('/tmp/bourse-depth-evidence')
          a=Image.open(root/'before.png').convert('RGB')
          b=Image.open(root/'after.png').convert('RGB')
          if a.size != (1280,960) or b.size != (1280,960):
              raise SystemExit(f'unexpected witness dimensions {a.size} {b.size}')
          changed=0
          bbox=None
          xs=[]; ys=[]
          for y in range(a.height):
              for x in range(a.width):
                  p=a.getpixel((x,y)); q=b.getpixel((x,y))
                  if max(abs(p[i]-q[i]) for i in range(3)) > 3:
                      changed += 1; xs.append(x); ys.append(y)
          total=a.width*a.height
          ratio=changed/total
          if xs: bbox=(min(xs),min(ys),max(xs),max(ys))
          print(f'BOURSE_FRONT_DEPTH_AB changed_gt3={changed} total={total} ratio={ratio:.6%} bbox={bbox}')
          if ratio < 0.025:
              raise SystemExit(f'anti-micro reject: {ratio:.4%} < 2.5%')
          PY
      - name: Package A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-front-depth-geotagged-ab
          path: |
            /tmp/bourse-depth-evidence/before.png
            /tmp/bourse-depth-evidence/after.png
            /tmp/depth-guard.log
            /tmp/base-capture.log
            /tmp/head-capture.log
          if-no-files-found: error