name: Grand Bruxelles Bourse Geotagged Camera Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-geotagged-camera.yml"
      - "grand-bruxelles-game/data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json"
      - "grand-bruxelles-game/tests/test_bourse_geotagged_camera_evidence.py"
      - "grand-bruxelles-game/game/tests/bourse_geotagged_camera_capture_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_geotagged_frontage.gd"
      - "grand-bruxelles-game/data/urbis/bourse_geotagged_context/**"
  push:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-geotagged-camera.yml"
      - "grand-bruxelles-game/data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json"
      - "grand-bruxelles-game/tests/test_bourse_geotagged_camera_evidence.py"
      - "grand-bruxelles-game/game/tests/bourse_geotagged_camera_capture_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_geotagged_frontage.gd"
      - "grand-bruxelles-game/data/urbis/bourse_geotagged_context/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate geotagged Bourse camera evidence
        working-directory: grand-bruxelles-game
        run: python3 -m unittest -v tests.test_bourse_geotagged_camera_evidence

      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit

      - name: Render geotagged Bourse camera witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x960 \
            --script res://game/tests/bourse_geotagged_camera_capture_test.gd 2>&1 | tee /tmp/bourse-geotagged-camera.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GEOTAGGED_CAPTURE_FAIL" /tmp/bourse-geotagged-camera.log; then exit 1; fi
          grep -F "BOURSE_GEOTAGGED_CAPTURE_OK" /tmp/bourse-geotagged-camera.log
          test -f grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png

      - name: Upload geotagged Bourse capture
        uses: actions/upload-artifact@v4
        with:
          name: bourse-geotagged-camera-evidence
          path: |
            grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png
            /tmp/bourse-geotagged-camera.log
          if-no-files-found: error
