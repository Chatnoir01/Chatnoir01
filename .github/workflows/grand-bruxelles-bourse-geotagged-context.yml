name: Grand Bruxelles Bourse Geotagged Context Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-geotagged-context.yml"
      - "grand-bruxelles-game/tools/select_bourse_geotagged_context.py"
      - "grand-bruxelles-game/tests/test_bourse_geotagged_context_selector.py"
      - "grand-bruxelles-game/data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json"
      - "grand-bruxelles-game/tools/fetch_urbis_wfs_bbox.py"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
      - "grand-bruxelles-game/tools/extract_urbis_3d_hero.py"
  push:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-geotagged-context.yml"
      - "grand-bruxelles-game/tools/select_bourse_geotagged_context.py"
      - "grand-bruxelles-game/tests/test_bourse_geotagged_context_selector.py"

permissions:
  contents: read

jobs:
  select-and-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic selector regressions
        working-directory: grand-bruxelles-game
        run: python3 -m unittest -v tests.test_bourse_geotagged_context_selector

      - name: Fetch official UrbIS Buildings around the source camera cone
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.fetch_urbis_wfs_bbox import request_layer

          # Bounded to the Bourse/source-camera neighborhood and the audited 148170 3D tile.
          bbox = (148480.0, 170700.0, 148900.0, 170960.0)
          data = request_layer("urbisvector:Buildings", bbox, 4)
          assert data.get("type") == "FeatureCollection"
          assert len(data.get("features", [])) > 0
          path = Path("/tmp/bourse-geotagged-buildings.geojson")
          path.write_text(json.dumps(data, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"official_buildings={len(data['features'])}")
          PY

      - name: Select official buildings that actually intersect the geotagged view
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/select_bourse_geotagged_context.py \
            --buildings /tmp/bourse-geotagged-buildings.geojson \
            --camera-evidence data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json \
            --output /tmp/bourse-geotagged-context-selection.json \
            --max-distance-m 180 \
            --margin-degrees 3 \
            --limit 12

      - name: Download audited official UrbIS 3D tile
        run: |
          set -euo pipefail
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip"
          EXPECTED="cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/urbis3d.zip "$URL"
          echo "$EXPECTED  /tmp/urbis3d.zip" | sha256sum -c -
          mkdir -p /tmp/urbis3d
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148170_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source_root.txt

      - name: Resolve selected 2D buildings to exact UrbIS3D context meshes
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source_root.txt)"
          OUT=/tmp/bourse-geotagged-context-3d
          mkdir -p "$OUT"
          python3 - <<'PY' > /tmp/bourse-geotagged-ids.txt
          import json
          data=json.load(open('/tmp/bourse-geotagged-context-selection.json', encoding='utf-8'))
          for row in data['candidates']:
              print(row['building_id'])
          PY

          : > /tmp/unresolved_ids.txt
          while IFS= read -r ID; do
            test -n "$ID" || continue
            SHORT="${ID##*/}"
            if python3 tools/extract_urbis_3d_context.py \
              --source-root "$ROOT" \
              --prefix UrbISBuildings3D_148170 \
              --building-id "$ID" \
              --context-id "bourse_geotagged_$SHORT" \
              --name "Bourse geotagged context $SHORT" \
              --package-url "https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip" \
              --package-sha256 "cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2" \
              --package-revision "2026-08-08" \
              --accessed-at "2026-08-12" \
              --origin-e 147868.29422791934 \
              --origin-n 169538.62414926197 \
              --world-x -668.5 \
              --world-z 627.84 \
              --output "$OUT/$SHORT.game.json"; then
              :
            else
              rm -f "$OUT/$SHORT.game.json"
              echo "$ID" >> /tmp/unresolved_ids.txt
            fi
          done < /tmp/bourse-geotagged-ids.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          selection=json.load(open('/tmp/bourse-geotagged-context-selection.json', encoding='utf-8'))
          selected={row['building_id']: row for row in selection['candidates']}
          rows=[]
          for path in sorted(Path('/tmp/bourse-geotagged-context-3d').glob('*.game.json')):
              data=json.loads(path.read_text(encoding='utf-8'))
              bid=data['source']['building_2d_id']
              rows.append({
                  'building_id': bid,
                  'selection': selected[bid],
                  'solid_ids': data['source']['building_solid_ids'],
                  'solid_count': data['source']['solid_count'],
                  'bbox_epsg31370': data['evidence']['source_bbox_xy'],
                  'height_m': data['evidence']['height_m'],
                  'face_count': data['evidence']['face_count'],
                  'triangle_count': data['evidence']['triangle_count'],
                  'face_type_counts': data['evidence']['face_type_counts'],
                  'runtime_approved': data['runtime_approved'],
                  'artifact_file': path.name,
              })
          unresolved=[line.strip() for line in Path('/tmp/unresolved_ids.txt').read_text().splitlines() if line.strip()]
          assert len(rows) >= 2, (rows, unresolved)
          assert all(row['runtime_approved'] is False for row in rows)
          report={
              'schema':'grand-bruxelles-bourse-geotagged-context-3d-evidence-v1',
              'camera_selection': selection,
              'resolved_urbis3d_count': len(rows),
              'resolved': rows,
              'unresolved_building_ids': unresolved,
              'package_sha256':'cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2',
              'runtime_approved': False,
              'realism_complete': False,
              'next_gate':'choose the smallest source-backed in-frame runtime subset, render it from the merged geotagged camera, inspect the 1280x960 delta, and merge only if the visual truth improves',
          }
          Path('/tmp/bourse-geotagged-context-3d-summary.json').write_text(json.dumps(report, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload exact in-frame UrbIS3D evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-geotagged-context-3d-evidence
          path: |
            /tmp/bourse-geotagged-context-selection.json
            /tmp/bourse-geotagged-context-3d/*.game.json
            /tmp/bourse-geotagged-context-3d-summary.json
          if-no-files-found: error
