name: Grand Bruxelles Bourse Architectural Glazing Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/visual/bourse_architectural_glazing_material_identity.json"
      - "grand-bruxelles-game/game/scripts/bourse_architectural_glazing_surface_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_architectural_glazing_material.gd"
      - "grand-bruxelles-game/game/tests/bourse_architectural_glazing_material_witness_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_architectural_glazing_target_contract_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_architectural_glazing_material_restore_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-bourse-glazing-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Bourse glazing target contract regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_architectural_glazing_target_contract_test.gd 2>&1 | tee /tmp/target-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GLAZING_TARGET_CONTRACT_FAIL" /tmp/target-contract.log; then exit 1; fi
          grep -q "BOURSE_GLAZING_TARGET_CONTRACT_OK" /tmp/target-contract.log
      - name: Bourse glazing authored material restore regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_architectural_glazing_material_restore_test.gd 2>&1 | tee /tmp/material-restore.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GLAZING_MATERIAL_RESTORE_FAIL" /tmp/material-restore.log; then exit 1; fi
          grep -q "BOURSE_GLAZING_MATERIAL_RESTORE_OK" /tmp/material-restore.log
      - name: Bourse glazing deterministic A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_architectural_glazing_material_witness_test.gd 2>&1 | tee /tmp/witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GLAZING_WITNESS_FAIL" /tmp/witness.log; then exit 1; fi
          grep -q "BOURSE_GLAZING_WITNESS_OK" /tmp/witness.log
      - name: Upload Bourse glazing evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-glazing-ab
          path: |
            grand-bruxelles-game/artifacts/visual/bourse_glazing_before.png
            grand-bruxelles-game/artifacts/visual/bourse_glazing_after.png
          if-no-files-found: error
