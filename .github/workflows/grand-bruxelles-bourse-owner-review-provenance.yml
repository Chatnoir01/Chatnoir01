name: Grand Bruxelles Bourse Owner Review Provenance

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/bourse_owner_review_candidate_provenance.json"
      - "grand-bruxelles-game/game/tests/bourse_owner_review_candidate_provenance_test.py"
      - ".github/workflows/grand-bruxelles-bourse-owner-review-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact head and exact current main
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$EXPECTED_BASE"
            test "$LIVE_MAIN" = "$EXPECTED_BASE"
          fi
          test "$(git merge-base HEAD origin/main)" = "$LIVE_MAIN"
      - name: Validate Bourse owner-review boundary
        env:
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME
          python3 -I -B grand-bruxelles-game/game/tests/bourse_owner_review_candidate_provenance_test.py
