name: Grand Bruxelles Bourse Official Pediment

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/bourse_official_pediment_surface_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_white_stone_material.gd"
      - "grand-bruxelles-game/game/tests/bourse_official_pediment_surface_witness_test.gd"
      - "grand-bruxelles-game/tests/test_bourse_official_pediment_surface.py"
      - "grand-bruxelles-game/data/urbis/heroes/bourse_lod2.game.json"
      - "grand-bruxelles-game/data/qa/bourse_portico_articulation_candidate.json"
      - "grand-bruxelles-game/data/qa/photo_match/bourse_2019_geotagged_camera_evidence.json"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-bourse-pediment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require source-derived Bourse pediment
        run: python grand-bruxelles-game/tests/test_bourse_official_pediment_surface.py

  player-eye-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxcursor1 libxinerama1 libgl1 libxi6 libxrandr2 libxrender1 libwayland-client0 libxkbcommon0
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then exit 1; fi
      - name: Capture frozen Bourse player-eye A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --script res://game/tests/bourse_official_pediment_surface_witness_test.gd 2>&1 | tee /tmp/bourse-pediment.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_PEDIMENT_WITNESS_FAIL" /tmp/bourse-pediment.log; then exit 1; fi
          grep -q "BOURSE_PEDIMENT_WITNESS_OK" /tmp/bourse-pediment.log
      - name: Upload Bourse pediment A/B
        uses: actions/upload-artifact@v4
        with:
          name: bourse-official-pediment-ab
          path: |
            grand-bruxelles-game/artifacts/visual/bourse_pediment_before.png
            grand-bruxelles-game/artifacts/visual/bourse_pediment_after.png
          if-no-files-found: error
