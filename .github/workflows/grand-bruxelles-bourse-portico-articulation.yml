name: Grand Bruxelles Bourse Portico Articulation Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-portico-articulation.yml"
      - "grand-bruxelles-game/data/qa/bourse_portico_articulation_candidate.json"
      - "grand-bruxelles-game/game/scripts/bourse_portico_articulation.gd"
      - "grand-bruxelles-game/game/tests/bourse_portico_articulation_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_geotagged_camera_capture_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
  push:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-portico-articulation.yml"
      - "grand-bruxelles-game/data/qa/bourse_portico_articulation_candidate.json"
      - "grand-bruxelles-game/game/scripts/bourse_portico_articulation.gd"
      - "grand-bruxelles-game/game/tests/bourse_portico_articulation_test.gd"
      - "grand-bruxelles-game/game/main.tscn"

permissions:
  contents: read

jobs:
  runtime-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit
      - name: Validate bounded portico articulation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/bourse_portico_articulation_test.gd 2>&1 | tee /tmp/bourse-portico.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_PORTICO_ARTICULATION_FAIL" /tmp/bourse-portico.log; then exit 1; fi
          grep -F "BOURSE_PORTICO_ARTICULATION_OK" /tmp/bourse-portico.log
      - name: Render deterministic geotagged Bourse capture
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x960 \
            --script res://game/tests/bourse_geotagged_camera_capture_test.gd 2>&1 | tee /tmp/bourse-portico-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GEOTAGGED_CAPTURE_FAIL" /tmp/bourse-portico-capture.log; then exit 1; fi
          grep -F "BOURSE_GEOTAGGED_CAPTURE_OK" /tmp/bourse-portico-capture.log
          test -f grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-portico-articulation-visual
          path: |
            grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png
            /tmp/bourse-portico.log
            /tmp/bourse-portico-capture.log
          if-no-files-found: error
