name: Grand Bruxelles Bourse Roofs Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-roofs-diagnostic.yml"
      - "grand-bruxelles-game/game/tests/bourse_geotagged_roofs_hide_test.gd"
      - "grand-bruxelles-game/game/scripts/bourse_front_wall_reveal.gd"
      - "grand-bruxelles-game/game/main.tscn"

permissions:
  contents: read

jobs:
  roofs-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render baseline
        run: |
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_geotagged_camera_capture_test.gd
          mkdir -p grand-bruxelles-game/artifacts/photo-match/bourse-roofs-diagnostic
          cp grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png grand-bruxelles-game/artifacts/photo-match/bourse-roofs-diagnostic/baseline.png
      - name: Render without hero roofs
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_geotagged_roofs_hide_test.gd 2>&1 | tee /tmp/bourse-roofs-hide.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GEOTAGGED_CAPTURE_FAIL|BOURSE_ROOFS_HIDE_FAIL" /tmp/bourse-roofs-hide.log; then exit 1; fi
          grep -F "BOURSE_ROOFS_HIDE_OK" /tmp/bourse-roofs-hide.log
          cp grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png grand-bruxelles-game/artifacts/photo-match/bourse-roofs-diagnostic/no-roofs.png
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: bourse-roofs-diagnostic
          path: |
            grand-bruxelles-game/artifacts/photo-match/bourse-roofs-diagnostic/*.png
            /tmp/bourse-roofs-hide.log
          if-no-files-found: error
