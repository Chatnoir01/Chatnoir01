name: Grand Bruxelles Bourse Sidewalk Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/bourse_official_sidewalks.game.json"
      - "grand-bruxelles-game/game/scripts/bourse_official_sidewalk_overlay.gd"
      - "grand-bruxelles-game/game/scripts/bourse_front_wall_reveal.gd"
      - "grand-bruxelles-game/game/tests/bourse_sidewalk_runtime_test.gd"
      - ".github/workflows/grand-bruxelles-bourse-sidewalk-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate sidewalk runtime contract
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_sidewalk_runtime_test.gd 2>&1 | tee /tmp/sidewalk-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SIDEWALK_RUNTIME_FAIL" /tmp/sidewalk-runtime.log; then exit 1; fi
          grep -F "BOURSE_SIDEWALK_RUNTIME_OK" /tmp/sidewalk-runtime.log
      - name: Render geotagged Bourse witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --script res://game/tests/bourse_geotagged_camera_capture_test.gd 2>&1 | tee /tmp/bourse-sidewalk-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_GEOTAGGED_CAPTURE_FAIL" /tmp/bourse-sidewalk-visual.log; then exit 1; fi
          grep -F "BOURSE_GEOTAGGED_CAPTURE_OK" /tmp/bourse-sidewalk-visual.log
          test -f grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png
      - uses: actions/upload-artifact@v4
        with:
          name: bourse-sidewalk-geotagged-witness
          path: |
            grand-bruxelles-game/artifacts/photo-match/bourse_2019_geotagged_camera.png
            /tmp/sidewalk-runtime.log
            /tmp/bourse-sidewalk-visual.log
          if-no-files-found: error
