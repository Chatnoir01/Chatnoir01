name: Grand Bruxelles Bourse Smart Bins Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-smart-bins.yml"
      - "grand-bruxelles-game/data/provenance/bourse_smart_bins.json"
      - "grand-bruxelles-game/game/scripts/bourse_smart_bins_visual.gd"
      - "grand-bruxelles-game/game/tests/bourse_smart_bins_visual_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_smart_bins_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-smart-bins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed smart-bin family
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_smart_bins_visual_test.gd 2>&1 | tee /tmp/bourse-smart-bins.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SMART_BINS_FAIL" /tmp/bourse-smart-bins.log; then exit 1; fi
          grep -F "BOURSE_SMART_BINS_OK" /tmp/bourse-smart-bins.log
