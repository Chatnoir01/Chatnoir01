name: Grand Bruxelles Bourse Source-Backed Player Visibility

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_geotagged_frontage.gd"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_axis_context.gd"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_surface_context.gd"
      - "grand-bruxelles-game/game/scripts/urbis_hero_builder.gd"
      - "grand-bruxelles-game/game/scripts/bourse_portico_articulation.gd"
      - "grand-bruxelles-game/game/tests/automatic_road_corridor_anchor_heading_contract_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_source_backed_player_visibility_test.gd"
      - ".github/workflows/grand-bruxelles-bourse-source-backed-player-visibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bourse-source-backed-player-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bourse-source-visibility-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bourse-source-visibility-import.log; then exit 1; fi
      - name: Prove fail-closed source-anchor heading contract
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/automatic_road_corridor_anchor_heading_contract_test.gd 2>&1 | tee /tmp/corridor-anchor-heading-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_ROAD_CORRIDOR_ANCHOR_HEADING_CONTRACT_FAIL" /tmp/corridor-anchor-heading-contract.log; then exit 1; fi
          grep -q "AUTOMATIC_ROAD_CORRIDOR_ANCHOR_HEADING_CONTRACT_GREEN" /tmp/corridor-anchor-heading-contract.log
      - name: Prove source-backed Bourse geometry enters unchanged production player frame
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/bourse_source_backed_player_visibility_test.gd 2>&1 | tee /tmp/bourse-source-backed-player-visibility.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SOURCE_BACKED_PLAYER_VISIBILITY_FAIL" /tmp/bourse-source-backed-player-visibility.log; then exit 1; fi
          grep -q "BOURSE_SOURCE_BACKED_PLAYER_VISIBILITY_GREEN" /tmp/bourse-source-backed-player-visibility.log
      - name: Stage exact diagnostic log
        if: always()
        run: |
          set -euo pipefail
          stage="/tmp/bourse-source-backed-player-visibility-evidence"
          rm -rf "$stage" && mkdir -p "$stage"
          cp /tmp/bourse-source-backed-player-visibility.log "$stage/runtime.log" 2>/dev/null || true
          cp /tmp/corridor-anchor-heading-contract.log "$stage/corridor-anchor-heading-contract.log" 2>/dev/null || true
          cp /tmp/bourse-source-visibility-import.log "$stage/import.log" 2>/dev/null || true
          cd "$stage"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt
      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-source-backed-player-visibility
          path: /tmp/bourse-source-backed-player-visibility-evidence/
          if-no-files-found: error
