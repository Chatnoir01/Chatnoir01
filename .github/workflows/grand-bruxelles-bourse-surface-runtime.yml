name: Grand Bruxelles Bourse Surface Runtime

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/bourse_street_surfaces*.game.json"
      - "grand-bruxelles-game/data/urbis/bourse_official_sidewalks.game.json"
      - "grand-bruxelles-game/tools/extract_bourse_urbis_surfaces.py"
      - "grand-bruxelles-game/tests/test_extract_bourse_urbis_surfaces.py"
      - "grand-bruxelles-game/tests/test_bourse_surface_runtime_data.py"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_surface_context.gd"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_surface_mask.gd"
      - "grand-bruxelles-game/game/scripts/bourse_official_sidewalk_overlay.gd"
      - "grand-bruxelles-game/game/scripts/bourse_front_wall_reveal.gd"
      - "grand-bruxelles-game/game/tests/bourse_surface_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_sidewalk_runtime_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - ".github/workflows/grand-bruxelles-bourse-surface-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate deterministic source contract
        run: |
          python3 -m py_compile grand-bruxelles-game/tools/extract_bourse_urbis_surfaces.py
          python3 grand-bruxelles-game/tests/test_extract_bourse_urbis_surfaces.py
          python3 grand-bruxelles-game/tests/test_bourse_surface_runtime_data.py
          python3 - <<'PY'
          import json

          expected = {
              '41098': {'type': 'P', 'area': 611, 'ring_points': 38},
              '41084': {'type': 'P', 'area': 772, 'ring_points': 50},
              '21944': {'type': 'I', 'area': 303, 'ring_points': 15},
          }
          for surface_id, contract in expected.items():
              path = f'grand-bruxelles-game/data/urbis/bourse_street_surfaces_adjacent_{surface_id}.game.json'
              data = json.load(open(path, encoding='utf-8'))
              assert data['source']['license'] == 'CC0-1.0'
              assert data['source']['selection_evidence_pr'] == 198
              assert data['source']['selection_evidence_artifact_sha256'] == 'cfac245ae497e8cfda49a95c499873d561bbf77048aecf98b910f7b238d179e2'
              assert data['target_inspire_ids'] == [f'https://databrussels.be/id/streetsurface/{surface_id}']
              assert len(data['surfaces']) == 1
              s = data['surfaces'][0]
              assert s['level'] == 0
              assert s['type_uninterpreted'] == contract['type']
              assert s['area_m2'] == contract['area']
              assert len(s['world_rings_xz']) == 1
              assert len(s['world_rings_xz'][0]) == contract['ring_points']
              assert data['selection_policy']['type_semantics_interpreted'] is False
              assert data['selection_policy']['curb_elevation_resolved'] is False
              assert data['runtime_approved'] is False
              assert data['realism_complete'] is False
          sidewalk = json.load(open('grand-bruxelles-game/data/urbis/bourse_official_sidewalks.game.json', encoding='utf-8'))
          assert sidewalk['source']['license'] == 'CC0-1.0'
          assert sidewalk['source']['evidence_artifact_digest'] == 'sha256:1952c9ba82195ce78c75d08f4d8472fc60ea6ee136756a03f4aae1b7d5b5a36a'
          assert sidewalk['selection']['feature_count'] == 5
          assert len(sidewalk['sidewalks']) == 5
          assert sidewalk['curb_elevation_resolved'] is False
          assert sidewalk['presentation_height_is_renderer_bias_only'] is True
          assert sidewalk['runtime_approved'] is False
          assert sidewalk['realism_complete'] is False
          print('BOURSE_SURFACE_AND_SIDEWALK_DATA_OK')
          PY

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi

      - name: Validate exact Bourse surface runtime
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/bourse_surface_runtime_test.gd 2>&1 | tee /tmp/surface.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SURFACE_RUNTIME_FAIL" /tmp/surface.log; then exit 1; fi
          grep -q "BOURSE_SURFACE_RUNTIME_OK" /tmp/surface.log

      - name: Validate bounded official sidewalk runtime
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/bourse_sidewalk_runtime_test.gd 2>&1 | tee /tmp/sidewalk.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SIDEWALK_RUNTIME_FAIL" /tmp/sidewalk.log; then exit 1; fi
          grep -q "BOURSE_SIDEWALK_RUNTIME_OK" /tmp/sidewalk.log
