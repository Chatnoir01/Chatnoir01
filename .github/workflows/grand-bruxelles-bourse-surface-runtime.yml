name: Grand Bruxelles Bourse Surface Runtime

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/bourse_street_surfaces.game.json"
      - "grand-bruxelles-game/tools/extract_bourse_urbis_surfaces.py"
      - "grand-bruxelles-game/tests/test_extract_bourse_urbis_surfaces.py"
      - "grand-bruxelles-game/tests/test_bourse_surface_runtime_data.py"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_surface_context.gd"
      - "grand-bruxelles-game/game/scripts/urbis_bourse_surface_mask.gd"
      - "grand-bruxelles-game/game/tests/bourse_surface_runtime_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - ".github/workflows/grand-bruxelles-bourse-surface-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate deterministic source contract
        run: |
          python3 -m py_compile grand-bruxelles-game/tools/extract_bourse_urbis_surfaces.py
          python3 grand-bruxelles-game/tests/test_extract_bourse_urbis_surfaces.py
          python3 grand-bruxelles-game/tests/test_bourse_surface_runtime_data.py

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi

      - name: Validate exact Bourse surface runtime
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/bourse_surface_runtime_test.gd 2>&1 | tee /tmp/surface.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SURFACE_RUNTIME_FAIL" /tmp/surface.log; then exit 1; fi
          grep -q "BOURSE_SURFACE_RUNTIME_OK" /tmp/surface.log
