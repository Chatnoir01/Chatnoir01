name: Grand Bruxelles Bourse Triangular Pediment

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/bourse_triangular_pediment_candidate.json"
      - "grand-bruxelles-game/game/scripts/bourse_triangular_pediment_runtime.gd"
      - "grand-bruxelles-game/game/tests/bourse_triangular_pediment_test.gd"
      - "grand-bruxelles-game/game/tests/bourse_triangular_pediment_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-bourse-triangular-pediment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts and reject parser errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Validate source bounds
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/bourse_triangular_pediment_test.gd 2>&1 | tee /tmp/structural.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_TRIANGULAR_PEDIMENT_FAIL" /tmp/structural.log; then exit 1; fi
          grep -q "BOURSE_TRIANGULAR_PEDIMENT_OK" /tmp/structural.log
      - name: Locked full-frame Bourse A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --resolution 1280x960 --path grand-bruxelles-game --script res://game/tests/bourse_triangular_pediment_witness_test.gd 2>&1 | tee /tmp/witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_TRIANGULAR_PEDIMENT_WITNESS_FAIL" /tmp/witness.log; then exit 1; fi
          grep -q "BOURSE_TRIANGULAR_PEDIMENT_WITNESS_OK" /tmp/witness.log
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-triangular-pediment-ab
          path: |
            grand-bruxelles-game/artifacts/visual/bourse_triangular_pediment_before.png
            grand-bruxelles-game/artifacts/visual/bourse_triangular_pediment_after.png
            grand-bruxelles-game/artifacts/visual/bourse_triangular_pediment_metrics.json
            /tmp/witness.log
          if-no-files-found: warn
