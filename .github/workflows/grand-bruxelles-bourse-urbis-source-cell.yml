name: Grand Bruxelles Bourse UrbIS Source Cell

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-urbis-source-cell.yml"
      - ".github/workflows/grand-bruxelles-bourse-urbis-source-cell-persist.yml"
      - "grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json"
      - "grand-bruxelles-game/data/provenance/bourse_road_cell_municipality.measurement.json"
      - "grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e147500-n170000-s500/**"
      - "grand-bruxelles-game/tools/citygen/measure_urbis_source_cell_semantic_lock.py"
      - "grand-bruxelles-game/tools/citygen/test_measure_urbis_source_cell_semantic_lock.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CELL_ID: bxl-e147500-n170000-s500
  CELL_DIR: grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e147500-n170000-s500
  CONTRACT: grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json
  SOURCE_LOCK: grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json
  LOCKED_ARTIFACT_ID: "9546230151"
  LOCKED_ARTIFACT_SHA256: bf096755442d3762476ce4203ad2efb2c3ac0280fffd9057df0f347f1ee855b2
  LOCKED_ARTIFACT_SIZE: "205274"

jobs:
  reproduce-authoritative-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require live-main ancestry, immutable provenance and closed downstream rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$live_main" HEAD
          python3 - "$live_main" <<'PY'
          import json, sys
          from pathlib import Path
          live=sys.argv[1]
          contract=json.loads(Path("grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json").read_text())
          lock=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json").read_text())
          boundary=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_road_cell_municipality.measurement.json").read_text())
          assert contract["production_base_sha"]==lock["production_base_sha"]==live
          assert contract["target"]=={"cell_id":"bxl-e147500-n170000-s500","crs":"EPSG:31370","bbox":[147500.0,170000.0,148000.0,170500.0]}
          assert contract["source"]["authority"]==lock["authority"]=="Paradigm / Brussels-Capital Region"
          assert contract["source"]["license"]==lock["license"]=="CC0-1.0"
          assert contract["locked_artifact"]=={"workflow_run_id":32800198111,"artifact_id":9546230151,"artifact_sha256":"bf096755442d3762476ce4203ad2efb2c3ac0280fffd9057df0f347f1ee855b2","artifact_size_bytes":205274}
          assert boundary["semantic_sha256"]==contract["municipality_boundary_provenance"]["semantic_sha256"]==lock["municipality_boundary_provenance"]["semantic_sha256"]=="c01208a81d61d51492b928f7381991e0fdacd68f62e8ac7a77be8ba08f46ff63"
          assert boundary["stable_measurement"]["status"]=="HOLD_MUNICIPALITY_BOUNDARY_CELL"
          assert boundary["stable_measurement"]["municipality_coverage"]["municipality_id"] is None
          assert contract["expected"]["source_semantic_sha256"]==lock["source_semantic_sha256"]=="f88ece4309964ed9939de100424716c90a59409db66924332abb8ea00ff652e0"
          assert contract["expected"]["manifest_source_digest"]==lock["manifest_source_digest"]=="fc8851eeb05032e97b3fab39f01349e749edfe1c90713105a4aa1edab3c9521b"
          assert contract["authorization"]["source_acquisition"] is True
          assert contract["authorization"]["source_persistence"]==lock["source_persistence_authorized"]
          for ck,lk in [
            ("source_registration","source_registration_authorized"),("canonical_registration","canonical_registration_authorized"),
            ("road_to_cell_mapping","road_cell_mapping_authorized"),("runtime_mount","runtime_mount_authorized"),
            ("rendered_geometry","rendered_geometry_authorized"),("collision","collision_authorized"),
            ("safe_spawn","safe_spawn_authorized"),("jouable_promotion","jouable_promotion_authorized")]:
            assert contract["authorization"][ck] is False,ck
            assert lock[lk] is False,lk
          print("BOURSE_SOURCE_CELL_PHASE_CONTRACT_OK",live,"persisted",lock["source_persistence_authorized"])
          PY

      - name: Run generic source-cell semantic regressions
        run: python3 grand-bruxelles-game/tools/citygen/test_measure_urbis_source_cell_semantic_lock.py

      - name: Restore immutable source artifact and select validation target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/bourse-source-${LOCKED_ARTIFACT_ID}.zip"
          unpack="$RUNNER_TEMP/bourse-source-artifact"
          rm -rf "$zip" "$unpack"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCKED_ARTIFACT_ID}/zip" > "$zip"
          echo "${LOCKED_ARTIFACT_SHA256}  $zip" | sha256sum -c -
          test "$(stat -c '%s' "$zip")" = "$LOCKED_ARTIFACT_SIZE"
          mkdir -p "$unpack"
          unzip -q "$zip" -d "$unpack"
          persisted="$(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json").read_text())
          print("true" if d["source_persistence_authorized"] else "false")
          PY
          )"
          if [ "$persisted" = true ]; then
            test -f "$CELL_DIR/manifest.json"
            for rel in manifest.json maturity.json raw/buildings.geojson raw/street_axes.geojson raw/street_surfaces.geojson raw/train_network.geojson raw/tram_network.geojson; do
              cmp -s "$unpack/$CELL_ID/$rel" "$CELL_DIR/$rel" || { echo "persisted byte drift: $rel" >&2; exit 1; }
            done
            printf '%s\n' "$CELL_DIR" > "$RUNNER_TEMP/source-target.txt"
            echo "BOURSE_SOURCE_CELL_BYTE_EXACT_PERSISTED artifact=${LOCKED_ARTIFACT_ID}"
          else
            test ! -e "$CELL_DIR/manifest.json"
            printf '%s\n' "$unpack/$CELL_ID" > "$RUNNER_TEMP/source-target.txt"
            echo "BOURSE_SOURCE_CELL_MEASURED_NOT_PERSISTED artifact=${LOCKED_ARTIFACT_ID}"
          fi

      - name: Reproduce exact semantic and forensic measurement
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat "$RUNNER_TEMP/source-target.txt")"
          python3 grand-bruxelles-game/tools/citygen/measure_urbis_source_cell_semantic_lock.py \
            --cell-dir "$target" \
            --output "$RUNNER_TEMP/bourse_urbis_source_cell.reproduced.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          got=json.loads((Path(os.environ["RUNNER_TEMP"])/"bourse_urbis_source_cell.reproduced.json").read_text())
          lock=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json").read_text())
          for key in ["cell_id","crs","bbox","maturity_state","source_semantic_sha256","manifest_source_digest","manifest_sha256","maturity_sha256"]:
            assert got[key]==lock[key],key
          assert {k:v["features"] for k,v in got["layers"].items()}==lock["layer_accounting"]
          b=got["layers"]["buildings"]
          assert {"ownership_filtered":b["ownership_filtered"],"invalid_ownership_features":b["invalid_ownership_features"]}==lock["building_ownership"]
          for name,expected in lock["layers"].items():
            value=got["layers"][name]
            assert value["raw_bytes"]==expected["raw_bytes"],name
            assert value["raw_forensic_sha256"]==expected["raw_forensic_sha256"],name
            assert value["semantic_features_sha256"]==expected["semantic_features_sha256"],name
          for key in ["registration_authorized","runtime_mount_authorized","rendered_geometry_authorized","collision_authorized","safe_spawn_authorized","jouable_promotion_authorized"]:
            assert got[key] is False,key
          print("BOURSE_SOURCE_CELL_LOCKED_EXACT",got["source_semantic_sha256"],lock["layer_accounting"])
          PY

      - name: Upload exact reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: bourse-urbis-source-cell-locked-reproduction
          path: ${{ runner.temp }}/bourse_urbis_source_cell.reproduced.json
          if-no-files-found: error
