name: Grand Bruxelles Bourse UrbIS Source Cell

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-bourse-urbis-source-cell.yml"
      - "grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json"
      - "grand-bruxelles-game/data/provenance/bourse_road_cell_municipality.measurement.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e147500-n170000-s500/**"
      - "grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py"
      - "grand-bruxelles-game/tools/citygen/measure_urbis_source_cell_semantic_lock.py"
      - "grand-bruxelles-game/tools/citygen/test_measure_urbis_source_cell_semantic_lock.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json
  CELL_ID: bxl-e147500-n170000-s500
  CELL_BBOX: 147500,170000,148000,170500
  MUNICIPALITY_LOCK: grand-bruxelles-game/data/provenance/bourse_road_cell_municipality.measurement.json

jobs:
  measure-authoritative-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry, boundary provenance and closed rails
        id: live
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$live_main" HEAD
          echo "sha=$live_main" >> "$GITHUB_OUTPUT"
          python3 - "$live_main" <<'PY'
          import json, sys
          from pathlib import Path
          live=sys.argv[1]
          contract=json.loads(Path("grand-bruxelles-game/data/qa/bourse_urbis_source_cell.contract.json").read_text())
          boundary=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_road_cell_municipality.measurement.json").read_text())
          assert contract["production_base_sha"]==live,(contract["production_base_sha"],live)
          assert contract["target"]=={"cell_id":"bxl-e147500-n170000-s500","crs":"EPSG:31370","bbox":[147500.0,170000.0,148000.0,170500.0]}
          assert contract["source"]["authority"]=="Paradigm / Brussels-Capital Region"
          assert contract["source"]["license"]=="CC0-1.0"
          provenance=contract["municipality_boundary_provenance"]
          assert provenance["semantic_sha256"]=="c01208a81d61d51492b928f7381991e0fdacd68f62e8ac7a77be8ba08f46ff63"
          assert provenance["status"]=="HOLD_MUNICIPALITY_BOUNDARY_CELL"
          assert provenance["automatic_municipality_assignment_authorized"] is False
          assert boundary["semantic_sha256"]==provenance["semantic_sha256"]
          stable=boundary["stable_measurement"]
          assert stable["status"]=="HOLD_MUNICIPALITY_BOUNDARY_CELL"
          coverage=stable["municipality_coverage"]
          assert coverage["municipality_id"] is None and coverage["municipality_niscode"] is None
          intersections=coverage["intersections"]
          assert [(x["properties"]["NISCODE"],x["municipality_id"]) for x in intersections]==[
            ("21001","https://databrussels.be/id/municipality/5000071"),
            ("21004","https://databrussels.be/id/municipality/5000074"),
          ]
          auth=contract["authorization"]
          assert auth["source_acquisition"] is True and auth["source_persistence"] is False
          for key in ["source_registration","canonical_registration","road_to_cell_mapping","runtime_mount","rendered_geometry","collision","safe_spawn","jouable_promotion"]:
            assert auth[key] is False,key
          print(f"BOURSE_SOURCE_CELL_CONTRACT_OK live_main={live} boundary={provenance['semantic_sha256']} rails_closed=true")
          PY
          if git cat-file -e "origin/main:grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL_ID}/manifest.json" 2>/dev/null; then
            echo "Bourse source cell already exists on live main; ownership changed" >&2
            exit 1
          fi

      - name: Run generic source-cell semantic regressions
        run: |
          python3 grand-bruxelles-game/tools/citygen/test_measure_urbis_source_cell_semantic_lock.py
          python3 grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py

      - name: Acquire official Bourse UrbIS source cell
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$CELL_ID"
          rm -rf "$out"
          python3 grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py \
            --cell-id "$CELL_ID" \
            --bbox "$CELL_BBOX" \
            --output-dir "$out" \
            --retries 6
          test "$(basename "$out")" = "$CELL_ID"

      - name: Measure deterministic semantic and forensic identity
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/measure_urbis_source_cell_semantic_lock.py \
            --cell-dir "$RUNNER_TEMP/$CELL_ID" \
            --output "$RUNNER_TEMP/bourse_urbis_source_cell.measurement.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"bourse_urbis_source_cell.measurement.json"
          d=json.loads(p.read_text())
          assert d["schema"]=="grand-bruxelles-urbis-source-cell-semantic-measurement-v1"
          assert d["cell_id"]=="bxl-e147500-n170000-s500"
          assert d["crs"]=="EPSG:31370"
          assert d["bbox"]==[147500.0,170000.0,148000.0,170500.0]
          assert d["maturity_state"]=="data_ready"
          assert set(d["layers"])=={"buildings","street_surfaces","street_axes","tram_network","train_network"}
          assert d["layers"]["buildings"]["invalid_ownership_features"]==0
          assert d["layers"]["buildings"]["features"]>0
          for name,layer in d["layers"].items():
            assert layer["features"]>=0,name
            assert re.fullmatch(r"[0-9a-f]{64}",layer["raw_forensic_sha256"]),name
            assert re.fullmatch(r"[0-9a-f]{64}",layer["semantic_features_sha256"]),name
          assert re.fullmatch(r"[0-9a-f]{64}",d["source_semantic_sha256"])
          for key in ["registration_authorized","runtime_mount_authorized","rendered_geometry_authorized","collision_authorized","safe_spawn_authorized","jouable_promotion_authorized"]:
            assert d[key] is False,key
          print("BOURSE_SOURCE_CELL_MEASURED",d["source_semantic_sha256"],{k:v["features"] for k,v in d["layers"].items()})
          PY

      - name: Upload source bytes and measurement before RED lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourse-urbis-source-cell-measurement
          path: |
            ${{ runner.temp }}/bxl-e147500-n170000-s500/**
            ${{ runner.temp }}/bourse_urbis_source_cell.measurement.json
          if-no-files-found: error

      - name: RED-first require artifact-derived lock before persistence
        shell: bash
        run: |
          set -euo pipefail
          lock="grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json"
          test -f "$lock" || { echo "RED_FIRST_BOURSE_SOURCE_CELL_LOCK_NOT_PERSISTED" >&2; exit 1; }
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          generated=json.loads((Path(os.environ["RUNNER_TEMP"])/"bourse_urbis_source_cell.measurement.json").read_text())
          lock=json.loads(Path("grand-bruxelles-game/data/provenance/bourse_urbis_source_cell.measurement.json").read_text())
          assert lock["source_semantic_sha256"]==generated["source_semantic_sha256"]
          assert lock["layer_accounting"]=={k:v["features"] for k,v in generated["layers"].items()}
          assert lock["source_persistence_authorized"] is False
          print("BOURSE_SOURCE_CELL_LOCKED_MEASUREMENT_ONLY",generated["source_semantic_sha256"])
          PY
