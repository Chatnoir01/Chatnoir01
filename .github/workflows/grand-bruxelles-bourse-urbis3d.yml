name: Grand Bruxelles Bourse UrbIS 3D Evidence

on:
  push:
    branches:
      - "integration/bourse-urbis3d-evidence"
    paths:
      - "grand-bruxelles-game/tools/extract_urbis3d_hero_evidence.py"
      - "grand-bruxelles-game/tools/test_extract_urbis3d_hero_evidence.py"
      - ".github/workflows/grand-bruxelles-bourse-urbis3d.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/extract_urbis3d_hero_evidence.py"
      - "grand-bruxelles-game/tools/test_extract_urbis3d_hero_evidence.py"
      - ".github/workflows/grand-bruxelles-bourse-urbis3d.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-bourse-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only GeoPackage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal unzip
          ogrinfo --version
      - name: Regression-test hero extractor
        working-directory: grand-bruxelles-game/tools
        run: python3 test_extract_urbis3d_hero_evidence.py
      - name: Discover official UrbIS 3D feed
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          module_path=Path('grand-bruxelles-game/tools/discover_urbis_sources.py')
          spec=importlib.util.spec_from_file_location('discover_urbis_sources', module_path)
          assert spec and spec.loader
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          source_id='urbis_3d_constructions'
          feed=module.parse_feed(source_id, module.DEFAULT_FEEDS[source_id])
          assert feed.get('entry_count',0)>0
          Path('/tmp/urbis-discovered.json').write_text(json.dumps({'schema':1,'purpose':'Bourse UrbIS 3D evidence','feeds':[feed]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('URBIS_3D_DISCOVERY_OK',feed.get('feed_updated'),feed.get('entry_count'))
          PY
      - name: Select latest City of Brussels EPSG:31370 GeoPackage
        run: |
          python3 grand-bruxelles-game/tools/select_urbis_distribution.py \
            /tmp/urbis-discovered.json /tmp/urbis-3d-selected.json \
            --source-id urbis_3d_constructions \
            --token 31370 --token GPKG \
            --candidate-token 31370 --candidate-token GPKG --candidate-token 21004 \
            --prefer-latest
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          data=json.load(open('/tmp/urbis-3d-selected.json',encoding='utf-8'))
          selected=data['selected']; url=str(selected['href'])
          folded=url.casefold()
          assert url.startswith('https://')
          assert '31370' in folded and 'gpkg' in folded and '21004' in folded
          assert '/dwg/' not in folded
          host=(urlparse(url).hostname or '').lower()
          allowed=('datastore.brussels','urbisdownload.datastore.brussels','geoservices-urbis.irisnet.be','gis.urban.brussels','urban.brussels')
          assert any(host==x or host.endswith('.'+x) for x in allowed)
          print('URBIS_3D_BRUSSELS_SELECTION_OK',data.get('selected_embedded_date'),selected.get('title'),url)
          PY
      - name: Download official distribution
        run: |
          set -euo pipefail
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/urbis-3d-selected.json',encoding='utf-8'))['selected']['href'])
          PY
          )"
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
            --user-agent 'GrandBruxellesGame/bourse-urbis3d (+github.com/Chatnoir01/Chatnoir01)' \
            "$URL" -o /tmp/urbis-3d-distribution
          test -s /tmp/urbis-3d-distribution
          sha256sum /tmp/urbis-3d-distribution | tee /tmp/urbis-3d-distribution.sha256
      - name: Safely extract GeoPackages
        run: |
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          source=Path('/tmp/urbis-3d-distribution'); root=Path('/tmp/urbis-3d-extracted'); root.mkdir(parents=True,exist_ok=True)
          def safe_extract(archive,dest):
              dest.mkdir(parents=True,exist_ok=True); base=dest.resolve()
              with zipfile.ZipFile(archive) as h:
                  for m in h.infolist():
                      target=(dest/m.filename).resolve()
                      if base not in target.parents and target!=base: raise SystemExit(f'unsafe ZIP path: {m.filename}')
                  h.extractall(dest)
          if zipfile.is_zipfile(source): safe_extract(source,root/'level0')
          elif source.read_bytes()[:16].startswith(b'SQLite format 3'): shutil.copy2(source,root/'selected-source.gpkg')
          else: raise SystemExit('selected distribution is neither ZIP nor SQLite GeoPackage')
          seen=set()
          for depth in range(1,4):
              archives=[p for p in root.rglob('*.zip') if p.resolve() not in seen]
              if not archives: break
              for index,archive in enumerate(archives):
                  seen.add(archive.resolve()); safe_extract(archive,archive.parent/f'{archive.stem}-nested-{depth}-{index}')
          gpkg=sorted(root.rglob('*.gpkg'))
          print('URBIS_3D_EXTRACTION_OK','gpkg_count=',len(gpkg))
          if not gpkg: raise SystemExit('official distribution contains no GeoPackage')
          PY
      - name: Extract source-identified Bourse Z evidence
        run: |
          mkdir -p grand-bruxelles-game/artifacts/bourse-urbis3d
          cp /tmp/urbis-discovered.json grand-bruxelles-game/artifacts/bourse-urbis3d/discovered.json
          cp /tmp/urbis-3d-selected.json grand-bruxelles-game/artifacts/bourse-urbis3d/selected.json
          cp /tmp/urbis-3d-distribution.sha256 grand-bruxelles-game/artifacts/bourse-urbis3d/distribution.sha256
          python3 grand-bruxelles-game/tools/extract_urbis3d_hero_evidence.py \
            --root /tmp/urbis-3d-extracted \
            --identifier 8186511 --identifier 1751663 \
            --anchor-e 148620.23351135076 --anchor-n 170829.88213200308 \
            --radius-m 100 \
            --output grand-bruxelles-game/artifacts/bourse-urbis3d/evidence.json \
            --require-identity
      - name: Upload evidence only
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-bourse-urbis3d-evidence
          path: grand-bruxelles-game/artifacts/bourse-urbis3d/
          if-no-files-found: error
