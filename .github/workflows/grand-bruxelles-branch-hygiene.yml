name: Grand Bruxelles Branch Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  branch-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate specialist branch ownership
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" --depth=1
          mapfile -t CHANGED < <(git diff --name-only "origin/$BASE_BRANCH...HEAD")
          printf '%s\n' "${CHANGED[@]}" > /tmp/grand-bruxelles-changed-files.txt
          echo "Checking ${#CHANGED[@]} changed files on $HEAD_BRANCH -> $BASE_BRANCH"

          fail_matches() {
            local label="$1"
            shift
            local found=0
            for path in "${CHANGED[@]}"; do
              for pattern in "$@"; do
                if [[ "$path" =~ $pattern ]]; then
                  echo "::error file=$path::Branch ownership violation ($label): $path"
                  found=1
                  break
                fi
              done
            done
            return "$found"
          }

          violations=0

          case "$HEAD_BRANCH" in
            zone-reste-bruxelles|zone-reste-bruxelles-clean|zone-laeken-jette)
              fail_matches "geographic branch contains gameplay-system files" \
                '^grand-bruxelles-game/game/police/' \
                '^grand-bruxelles-game/game/vehicles/police_' \
                '^grand-bruxelles-game/game/scripts/police_' \
                '^grand-bruxelles-game/game/scripts/wanted_system\.gd$' \
                '^grand-bruxelles-game/game/scripts/npc_' \
                '^grand-bruxelles-game/game/scripts/traffic_' \
                '^grand-bruxelles-game/data/traffic/' || violations=1
              fail_matches "geographic branch contains shared integration files" \
                '^grand-bruxelles-game/game/main\.tscn$' \
                '^grand-bruxelles-game/project\.godot$' || violations=1
              ;;

            vehicles-traffic|systems-vehicles-traffic)
              fail_matches "vehicle/traffic branch contains geographic reconstruction files" \
                '^grand-bruxelles-game/game/zones/' \
                '^grand-bruxelles-game/data/urbis/(laeken_jette|remaining_brussels)/' \
                '^grand-bruxelles-game/data/processed/remaining_brussels/' \
                '^grand-bruxelles-game/tools/(bootstrap_remaining_brussels|build_urbis_cell|materialize_zone_cells|make_zone_cells)\.py$' || violations=1
              fail_matches "vehicle/traffic branch contains police/NPC ownership files" \
                '^grand-bruxelles-game/game/police/' \
                '^grand-bruxelles-game/game/scripts/police_' \
                '^grand-bruxelles-game/game/scripts/wanted_system\.gd$' || violations=1
              fail_matches "quarantined traffic branch creates versioned runtime generations" \
                '^grand-bruxelles-game/game/scripts/traffic_manager_core_v[0-9]+\.gd$' \
                '^grand-bruxelles-game/game/scripts/traffic_vehicle_core_v[0-9]+\.gd$' || violations=1
              fail_matches "vehicle/traffic branch contains shared integration ownership" \
                '^grand-bruxelles-game/game/main\.tscn$' \
                '^grand-bruxelles-game/game/scripts/vehicle_controller\.gd$' || violations=1
              ;;

            systems-npc-police-civilians|systems-police-vehicles)
              fail_matches "NPC/police branch contains geographic reconstruction files" \
                '^grand-bruxelles-game/game/zones/' \
                '^grand-bruxelles-game/data/urbis/(laeken_jette|remaining_brussels)/' \
                '^grand-bruxelles-game/data/processed/remaining_brussels/' || violations=1
              fail_matches "NPC/police branch contains traffic-core ownership files" \
                '^grand-bruxelles-game/game/scripts/traffic_' \
                '^grand-bruxelles-game/data/traffic/' || violations=1
              fail_matches "NPC/police branch contains shared integration scene" \
                '^grand-bruxelles-game/game/main\.tscn$' || violations=1
              ;;
          esac

          if [[ "$violations" -ne 0 ]]; then
            echo "Branch hygiene failed. Move the flagged files to their owning workstream before integration."
            exit 1
          fi

          echo "Branch ownership OK for $HEAD_BRANCH"

      - name: Enforce extract-only quarantine for long-lived specialist PRs
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" --depth=500 || git fetch origin "$BASE_BRANCH"
          AHEAD=$(git rev-list --count "origin/$BASE_BRANCH..HEAD")
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_BRANCH")

          case "$HEAD_BRANCH" in
            zone-laeken-jette|zone-reste-bruxelles-clean|vehicles-traffic)
              if [[ "$BASE_BRANCH" == "main" ]] && (( AHEAD > 50 || BEHIND > 15 )); then
                echo "::error::Quarantined specialist branch $HEAD_BRANCH is $AHEAD ahead / $BEHIND behind main. Do not merge wholesale. Create a small current-main extraction branch containing one coherent lot."
                exit 1
              fi
              ;;
          esac

          echo "Extract-only quarantine gate OK for $HEAD_BRANCH"

      - name: Report branch drift and shared-file integration risk
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH" --depth=500 || git fetch origin "$BASE_BRANCH"

          AHEAD=$(git rev-list --count "origin/$BASE_BRANCH..HEAD")
          BEHIND=$(git rev-list --count "HEAD..origin/$BASE_BRANCH")
          SHARED=$(git diff --name-only "origin/$BASE_BRANCH...HEAD" | grep -E '^(grand-bruxelles-game/game/main\.tscn|grand-bruxelles-game/project\.godot|\.github/workflows/grand-bruxelles-game\.yml)$' || true)

          {
            echo "### Grand Bruxelles integration-risk report"
            echo "- branch: \`$HEAD_BRANCH\` -> \`$BASE_BRANCH\`"
            echo "- commits ahead: **$AHEAD**"
            echo "- commits behind: **$BEHIND**"
            if [[ -n "$SHARED" ]]; then
              echo "- shared integration files touched:"
              while IFS= read -r path; do
                [[ -n "$path" ]] && echo "  - \`$path\`"
              done <<< "$SHARED"
            else
              echo "- shared integration files touched: none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( AHEAD > 50 )); then
            echo "::warning::Branch is $AHEAD commits ahead of $BASE_BRANCH. Treat it as a specialist source and extract a small current-base integration branch rather than merging wholesale."
          fi
          if (( BEHIND > 15 )); then
            echo "::warning::Branch is $BEHIND commits behind $BASE_BRANCH. Do not stack unrelated work or assume technical mergeability means safe integration."
          fi
          if [[ -n "$SHARED" ]]; then
            echo "::warning::Shared integration files are modified. Review for duplicated main-scene/CI ownership before merge."
          fi
