name: Grand Bruxelles Central Station LABO

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-central-station-labo.yml"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/data/visual/central_station_identity.json"
      - "grand-bruxelles-game/game/zones/central/central_station_labo.gd"
      - "grand-bruxelles-game/game/zones/central/central_station_context_labo.gd"
      - "grand-bruxelles-game/game/tests/central_station_labo_contract_test.gd"
      - "grand-bruxelles-game/game/tests/zone_selector_runtime_test.gd"
      - "grand-bruxelles-game/game/scripts/zone_selector_runtime.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-station-labo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Prove Urban 30201 LABO contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/central_station_labo_contract_test.gd
      - name: Prove selector listability and change-zone control
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/zone_selector_runtime_test.gd
