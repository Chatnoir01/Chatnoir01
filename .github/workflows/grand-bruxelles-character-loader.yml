name: Grand Bruxelles Character Loader

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/tests/humanoid_authored_player_test.gd"
      - "grand-bruxelles-game/game/tests/fixtures/rigged_character_fixture.tscn"
      - "grand-bruxelles-game/assets/characters/player/thandi/**"
      - "grand-bruxelles-game/assets/characters/player_character.glb"
      - ".github/workflows/grand-bruxelles-character-loader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  character-loader-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Verify project imports
        run: godot --headless --path grand-bruxelles-game --editor --quit-after 3

      - name: Run production authored player loader test
        run: godot --headless --path grand-bruxelles-game --script res://game/tests/humanoid_authored_player_test.gd
