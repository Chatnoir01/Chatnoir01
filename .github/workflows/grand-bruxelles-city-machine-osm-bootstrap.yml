name: Grand Bruxelles City Machine OSM Bootstrap

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/city_machine/build_osm_environment_zone.py"
      - "grand-bruxelles-game/tools/city_machine/test_osm_environment_zone.py"
      - ".github/workflows/grand-bruxelles-city-machine-osm-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jette-osm-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install exact CRS dependency
        run: python3 -m pip install --disable-pip-version-check "pyproj>=3.7,<4"
      - name: Test zone projection adapter
        run: python3 grand-bruxelles-game/tools/city_machine/test_osm_environment_zone.py
      - name: Fetch and project live Jette environment evidence
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/city_machine/build_osm_environment_zone.py \
            --manifest grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/manifest.json \
            --zone jette \
            --raw-cache /tmp/jette.environment.raw.json \
            --output /tmp/jette.environment.game.json \
            --refresh | tee /tmp/jette-osm-bootstrap.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/jette.environment.game.json').read_text())
          assert p['format']=='grand-bruxelles-osm-zone-environment-v1'
          assert p['source']=='OpenStreetMap contributors via Overpass API'
          assert p['license']=='ODbL-1.0'
          assert p['projection_crs']=='EPSG:31370'
          assert p['stats']['tree'] > 0
          assert p['stats']['total'] >= p['stats']['tree']
          assert len(p['source_digest']) == 64
          print('JETTE_OSM_BOOTSTRAP_OK', p['stats'], p['bbox_wgs84'], p['bounds_m'], p['source_digest'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-machine-jette-osm-bootstrap
          path: |
            /tmp/jette.environment.raw.json
            /tmp/jette.environment.game.json
            /tmp/jette-osm-bootstrap.log
