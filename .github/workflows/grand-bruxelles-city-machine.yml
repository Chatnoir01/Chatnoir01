name: Grand Bruxelles City Machine

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/city_machine/**"
      - "grand-bruxelles-game/tools/validate_jette_phase2_data.py"
      - "grand-bruxelles-game/tools/lambert72_to_game_geojson.py"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/data/urbis/**"
      - "grand-bruxelles-game/data/osm/zones/**"
      - "grand-bruxelles-game/data/runtime/runtime_environment_index.json"
      - "grand-bruxelles-game/data/runtime/modules/city_machine_environment.json"
      - "grand-bruxelles-game/game/scripts/brussels_city_machine_environment_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/zones/**"
      - ".github/workflows/grand-bruxelles-city-machine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jette-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact CRS dependency
        run: python3 -m pip install --disable-pip-version-check "pyproj>=3.7,<4"
      - name: Validate registry and hard gates
        run: |
          python3 grand-bruxelles-game/tools/city_machine/test_registry.py
          python3 grand-bruxelles-game/tools/city_machine/test_regional_onboarding.py
          python3 grand-bruxelles-game/tools/city_machine/test_midi_onboarding_preflight.py
          python3 grand-bruxelles-game/tools/city_machine/test_osm_environment_zone.py
          python3 grand-bruxelles-game/tools/city_machine/test_runtime_environment_index.py
          python3 grand-bruxelles-game/tools/city_machine/test_city_machine.py
      - name: Dry-run production Jette plan
        run: python3 grand-bruxelles-game/tools/city_machine/city_machine.py build --zone jette --dry-run
      - name: Rebuild Jette twice and prove idempotence
        run: |
          set -euo pipefail
          OUT=/tmp/city-machine-jette
          python3 grand-bruxelles-game/tools/city_machine/city_machine.py build --zone jette --output-dir "$OUT" | tee /tmp/city-machine-build-1.log
          RECEIPT=$(find "$OUT" -maxdepth 1 -name 'build-*.json' -type f | sort)
          test "$(printf '%s\n' "$RECEIPT" | sed '/^$/d' | wc -l)" -eq 1
          sha256sum "$RECEIPT" > /tmp/city-machine-receipt.sha
          python3 grand-bruxelles-game/tools/city_machine/city_machine.py build --zone jette --output-dir "$OUT" | tee /tmp/city-machine-build-2.log
          sha256sum -c /tmp/city-machine-receipt.sha
          test "$(find "$OUT" -maxdepth 1 -name 'build-*.json' -type f | wc -l)" -eq 1
          git diff --exit-code -- \
            grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/buildings.game.json \
            grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/street_surfaces.game.json \
            grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/street_axes.game.json \
            grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/train_network.game.json \
            grand-bruxelles-game/data/osm/zones/jette/environment.game.json \
            grand-bruxelles-game/data/runtime/runtime_environment_index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-machine-jette-proof
          path: |
            /tmp/city-machine-jette/*.json
            /tmp/city-machine-build-*.log

  midi-cache-normalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/city-machine-midi-osm-regional-cache'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/city-machine-midi-osm-regional-cache
      - name: Materialize Midi from committed UrbIS and OSM caches only
        run: |
          set -euo pipefail
          ROOT=grand-bruxelles-game/data/urbis/midi
          CONVERTER=grand-bruxelles-game/tools/lambert72_to_game_geojson.py
          for slug in buildings street_surfaces street_axes train_network; do
            python3 "$CONVERTER" "$ROOT/$slug.geojson" "$ROOT/$slug.game.json" \
              --origin-e 148400.0 --origin-n 169900.0 --origin-altitude 0.0
          done
          python3 grand-bruxelles-game/tools/city_machine/build_osm_environment_zone.py \
            --manifest "$ROOT/manifest.json" \
            --zone midi \
            --raw-cache grand-bruxelles-game/data/osm/zones/midi/environment.raw.json \
            --output grand-bruxelles-game/data/osm/zones/midi/environment.game.json
          python3 grand-bruxelles-game/tools/validate_jette_phase2_data.py "$ROOT"
      - name: Prove no raw/network mutation and exact world origin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("grand-bruxelles-game/data/urbis/midi")
          for slug in ("buildings", "street_surfaces", "street_axes", "train_network"):
              doc = json.loads((root / f"{slug}.game.json").read_text(encoding="utf-8"))
              cs = doc["grand_bruxelles_coordinate_system"]
              assert cs["origin_e"] == 148400.0
              assert cs["origin_n"] == 169900.0
          env = json.loads(Path("grand-bruxelles-game/data/osm/zones/midi/environment.game.json").read_text(encoding="utf-8"))
          assert env["bbox_31370"] == [147250.0, 168900.0, 148500.0, 170250.0]
          assert env["stats"] == {"tree": 1694, "street_lamp": 104, "bollard": 732, "total": 2530}
          print("MIDI_COMMITTED_CACHE_NORMALIZATION_OK")
          PY
          git diff --exit-code -- grand-bruxelles-game/data/osm/zones/midi/environment.raw.json
      - name: Commit normalized runtime caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            grand-bruxelles-game/data/urbis/midi/buildings.game.json \
            grand-bruxelles-game/data/urbis/midi/street_surfaces.game.json \
            grand-bruxelles-game/data/urbis/midi/street_axes.game.json \
            grand-bruxelles-game/data/urbis/midi/train_network.game.json \
            grand-bruxelles-game/data/osm/zones/midi/environment.game.json
          if git diff --cached --quiet; then
            echo "Midi normalized caches already current"
            exit 0
          fi
          git commit -m "data(city-machine): normalize Midi runtime caches"
          git push origin HEAD:feat/city-machine-midi-osm-regional-cache
