name: Grand Bruxelles City Open Data Game Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-city-open-data-game-inventory.yml"
      - "grand-bruxelles-game/data/qa/city_of_brussels_open_data_game_inventory.contract.json"
      - "grand-bruxelles-game/tools/citygen/classify_city_of_brussels_open_data.py"
      - "grand-bruxelles-game/tools/citygen/test_classify_city_of_brussels_open_data.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  TESTS: grand-bruxelles-game/tools/citygen/test_classify_city_of_brussels_open_data.py
  CONTRACT: grand-bruxelles-game/data/qa/city_of_brussels_open_data_game_inventory.contract.json

jobs:
  validate-game-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$live_main" "$head_sha"
          echo "CITY_OPEN_DATA_GAME_INVENTORY_EXACT_MAIN_OK live_main=$live_main head=$head_sha"

      - name: Run deterministic classifier regressions
        run: python3 "$TESTS"

      - name: Verify frozen inventory contract and fail-closed rails
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$CONTRACT" <<'PY'
          import json, sys
          from pathlib import Path

          c=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert c["schema"]=="grand-bruxelles-city-open-data-game-inventory-contract-v1"
          src=c["source_snapshot"]
          assert src=={
              "authority":"City of Brussels / Ville de Bruxelles / Stad Brussel",
              "source_artifact_digest":"sha256:2143d5ff864eec2b906f1c5e74893918335b4904f1a4dba94790c50823a45c5a",
              "source_artifact_id":"9580617625",
              "source_artifact_name":"city-open-data-full-snapshot-index",
              "source_catalog_sha256":"dc1a2fdec96572f504d7611c17486f830f2514f089fbd3e3fdc6e07ee472191d",
              "source_head_sha":"2b529cadbccce1b028c6ba38e67e2f184477a987",
              "source_run_id":"32894160007",
              "source_snapshot_all_entries_accounted":True,
              "source_snapshot_index_sha256":"8175c4e298fdd980652cbaa690502a3bb62ceb6844b8357c8c54d9ff53da0489",
          }
          assert c["measurement"]=={
              "catalog_dataset_count":207,
              "continuous_geospatial_dataset_count":11,
              "data_enrichment_candidate_count":64,
              "geospatial_dataset_count":142,
              "hold_count":2,
              "hold_no_records_count":1,
              "hold_source_unavailable_count":1,
              "map_geometry_candidate_count":78,
              "map_poi_candidate_count":63,
              "point_dataset_count":142,
              "shape_dataset_count":78,
              "source_bytes_verified_count":205,
          }
          rules=c["classification"]
          assert rules["semantic_runtime_role_inferred"] is False
          assert "geo_shape" in rules["shape_rule"]
          assert "geo_point_2d" in rules["point_rule"]
          assert "update_frequency=CONT" in rules["realtime_rule"]
          auth=c["authorization"]
          assert auth["classification_only"] is True
          for key in ["source_registration","canonical_registration","runtime_directory_scan","runtime_mount","rendered_geometry","collision","safe_spawn","jouable_promotion"]:
              assert auth[key] is False, key
          assert c["witnesses"]["grand_place_buildings"]["candidate_class"]=="MAP_POI_CANDIDATE"
          assert c["witnesses"]["grand_place_buildings"]["runtime_authorized"] is False
          assert c["witnesses"]["villo_realtime"]["realtime_candidate"] is True
          assert c["witnesses"]["villo_realtime"]["runtime_authorized"] is False
          assert c["status"]=="GAME_INVENTORY_CLASSIFIED_SOURCE_ONLY"
          print("CITY_OPEN_DATA_GAME_INVENTORY_CONTRACT_OK datasets=207 geospatial=142 shape=78 poi=63 realtime=11 holds=2")
          PY
