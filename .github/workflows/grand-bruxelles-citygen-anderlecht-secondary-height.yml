name: Grand Bruxelles CityGen Anderlecht Secondary Height

on:
  push:
    branches:
      - "main"
    paths:
      - "grand-bruxelles-game/tools/citygen/build_semantic_dsm_height_comparison.py"
      - "grand-bruxelles-game/tools/citygen/test_build_semantic_dsm_height_comparison.py"
      - "grand-bruxelles-game/tools/citygen/validate_secondary_height_evidence.py"
      - "grand-bruxelles-game/tools/citygen/test_validate_secondary_height_evidence.py"
      - "grand-bruxelles-game/tools/citygen/select_secondary_height_validation_cell.py"
      - "grand-bruxelles-game/tools/citygen/test_select_secondary_height_validation_cell.py"
      - "grand-bruxelles-game/tools/match_urbis3d_semantic_heights.py"
      - "grand-bruxelles-game/tools/test_match_urbis3d_semantic_heights.py"
      - "grand-bruxelles-game/tools/select_urbis_distribution.py"
      - "grand-bruxelles-game/tools/test_select_urbis_distribution.py"
      - ".github/workflows/grand-bruxelles-citygen-anderlecht-secondary-height.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/build_semantic_dsm_height_comparison.py"
      - "grand-bruxelles-game/tools/citygen/test_build_semantic_dsm_height_comparison.py"
      - "grand-bruxelles-game/tools/citygen/validate_secondary_height_evidence.py"
      - "grand-bruxelles-game/tools/citygen/test_validate_secondary_height_evidence.py"
      - "grand-bruxelles-game/tools/citygen/select_secondary_height_validation_cell.py"
      - "grand-bruxelles-game/tools/citygen/test_select_secondary_height_validation_cell.py"
      - "grand-bruxelles-game/tools/match_urbis3d_semantic_heights.py"
      - "grand-bruxelles-game/tools/test_match_urbis3d_semantic_heights.py"
      - "grand-bruxelles-game/tools/select_urbis_distribution.py"
      - "grand-bruxelles-game/tools/test_select_urbis_distribution.py"
      - ".github/workflows/grand-bruxelles-citygen-anderlecht-secondary-height.yml"
  workflow_dispatch:

# Read-only live witness. Regional acquisition and durable persistence remain owned
# by the autonomous CityGen evidence pipeline; this job only proves that a current,
# fully-evidenced Anderlecht cell can be checked against independent UrbIS3D data.
permissions:
  contents: read

jobs:
  anderlecht-secondary-height:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install read-only GeoPackage tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal unzip sqlite3 file
          ogrinfo --version

      - name: Regression-test regional secondary-height contracts
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/test_select_urbis_distribution.py
          python3 grand-bruxelles-game/tools/citygen/test_select_secondary_height_validation_cell.py
          python3 grand-bruxelles-game/tools/citygen/test_build_semantic_dsm_height_comparison.py
          python3 grand-bruxelles-game/tools/citygen/test_validate_secondary_height_evidence.py
          python3 grand-bruxelles-game/tools/test_match_urbis3d_semantic_heights.py

      - name: Select current fully-evidenced durable Anderlecht witness
        id: witness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          rm -rf /tmp/citygen-state /tmp/secondary-target.json /tmp/available-cells.txt /tmp/autonomous-citygen-report.json
          mkdir -p /tmp/citygen-state

          SOURCES="grand-bruxelles-game/data/qa/autonomous_sources"
          REPORT="grand-bruxelles-game/data/qa/autonomous_citygen_latest_report.json"
          git show "origin/citygen-autonomous-state:${REPORT}" > /tmp/autonomous-citygen-report.json
          git ls-tree --name-only "origin/citygen-autonomous-state:${SOURCES}" > /tmp/available-cells.txt

          python3 grand-bruxelles-game/tools/citygen/select_secondary_height_validation_cell.py \
            --report /tmp/autonomous-citygen-report.json \
            --available-cells /tmp/available-cells.txt \
            --municipality anderlecht \
            --output /tmp/secondary-target.json

          CELL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/secondary-target.json',encoding='utf-8'))['cell_id'])
          PY
          )"
          git archive origin/citygen-autonomous-state "${SOURCES}/${CELL}" | tar -x -C /tmp/citygen-state
          SRC="/tmp/citygen-state/${SOURCES}/${CELL}"
          test -s "$SRC/raw/buildings.geojson"
          test -s "$SRC/building_height_candidates.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=json.load(open('/tmp/secondary-target.json',encoding='utf-8'))
          src=Path('/tmp/citygen-state/grand-bruxelles-game/data/qa/autonomous_sources')/target['cell_id']
          heights=json.loads((src/'building_height_candidates.json').read_text(encoding='utf-8'))
          assert heights.get('format')=='grand-bruxelles-cell-building-height-candidates-v1'
          assert heights.get('cell_id')==target['cell_id']
          assert heights.get('crs')=='EPSG:31370'
          assert heights.get('runtime_promotion_allowed') is False
          count=heights.get('candidate_count')
          assert isinstance(count,int) and not isinstance(count,bool) and count > 0
          rows=heights.get('buildings')
          assert isinstance(rows,list)
          assert all(isinstance(row,dict) and row.get('runtime_approved') is False for row in rows)
          bbox=target['bbox_epsg31370']
          assert isinstance(bbox,list) and len(bbox)==4
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as handle:
              handle.write(f"cell={target['cell_id']}\n")
              handle.write(f"candidate_count={count}\n")
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as handle:
              handle.write(f"ANDERLECHT_WITNESS_CELL={target['cell_id']}\n")
              handle.write(f"ANDERLECHT_WITNESS_SRC={src}\n")
              handle.write(f"ANDERLECHT_WITNESS_CANDIDATE_COUNT={count}\n")
              handle.write(f"ANDERLECHT_WITNESS_MIN_E={bbox[0]}\n")
              handle.write(f"ANDERLECHT_WITNESS_MIN_N={bbox[1]}\n")
              handle.write(f"ANDERLECHT_WITNESS_MAX_E={bbox[2]}\n")
              handle.write(f"ANDERLECHT_WITNESS_MAX_N={bbox[3]}\n")
          print(f"ANDERLECHT_CITYGEN_WITNESS_OK cell={target['cell_id']} candidates={count} evidence={target['evidence_progress']}/{target['evidence_stage_count']} runtime_promotion=false")
          PY

      - name: Discover and select latest official Anderlecht UrbIS 3D package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          module_path=Path('grand-bruxelles-game/tools/discover_urbis_sources.py')
          spec=importlib.util.spec_from_file_location('discover_urbis_sources',module_path)
          assert spec and spec.loader
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          source_id='urbis_3d_constructions'
          feed=module.parse_feed(source_id,module.DEFAULT_FEEDS[source_id])
          assert feed.get('entry_count',0)>0
          Path('/tmp/urbis-discovered.json').write_text(json.dumps({'schema':1,'purpose':'Anderlecht CityGen read-only autonomous secondary-height witness','feeds':[feed]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('URBIS_3D_DISCOVERY_OK',feed.get('feed_updated'),feed.get('entry_count'))
          PY
          python3 grand-bruxelles-game/tools/select_urbis_distribution.py /tmp/urbis-discovered.json /tmp/urbis-3d-selected.json \
            --source-id urbis_3d_constructions --token 31370 --token GPKG \
            --candidate-token 31370 --candidate-token GPKG --candidate-token 21001 --prefer-latest
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          data=json.load(open('/tmp/urbis-3d-selected.json',encoding='utf-8'))
          selected=data['selected']; url=str(selected['href']); folded=url.casefold()
          assert url.startswith('https://')
          assert all(token in folded for token in ('31370','gpkg','21001'))
          assert '/dwg/' not in folded
          host=(urlparse(url).hostname or '').lower()
          allowed=('datastore.brussels','urbisdownload.datastore.brussels','geoservices-urbis.irisnet.be','gis.urban.brussels','urban.brussels')
          assert any(host==value or host.endswith('.'+value) for value in allowed)
          print('URBIS_3D_ANDERLECHT_SELECTION_OK',data['selected_embedded_date'],url)
          PY

      - name: Download and safely extract official Anderlecht package
        run: |
          set -euo pipefail
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/urbis-3d-selected.json'))['selected']['href'])
          PY
          )"
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
            --user-agent 'GrandBruxellesGame/anderlecht-secondary-height-witness (+github.com/Chatnoir01/Chatnoir01)' \
            "$URL" -o /tmp/urbis-3d-distribution
          test -s /tmp/urbis-3d-distribution
          sha256sum /tmp/urbis-3d-distribution | tee /tmp/distribution.sha256
          python3 - <<'PY'
          import shutil, zipfile
          from pathlib import Path
          source=Path('/tmp/urbis-3d-distribution')
          root=Path('/tmp/urbis-3d-extracted')
          root.mkdir(parents=True,exist_ok=True)
          def extract(archive,dest):
              dest.mkdir(parents=True,exist_ok=True); base=dest.resolve()
              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      target=(dest/member.filename).resolve()
                      if base not in target.parents and target != base:
                          raise SystemExit(f'unsafe ZIP path: {member.filename}')
                  z.extractall(dest)
          if zipfile.is_zipfile(source):
              extract(source,root/'level0')
          elif source.read_bytes()[:16].startswith(b'SQLite format 3'):
              shutil.copy2(source,root/'selected.gpkg')
          else:
              raise SystemExit('unsupported official distribution container')
          packages=sorted(root.rglob('*.gpkg'))
          if not packages:
              raise SystemExit('official Anderlecht distribution contains no GeoPackage')
          print('URBIS_3D_ANDERLECHT_EXTRACTION_OK gpkg_count=',len(packages))
          PY

      - name: Build live Anderlecht semantic witness
        run: |
          set -euo pipefail
          mkdir -p /tmp/anderlecht-secondary
          python3 grand-bruxelles-game/tools/match_urbis3d_semantic_heights.py \
            --root /tmp/urbis-3d-extracted \
            --buildings "$ANDERLECHT_WITNESS_SRC/raw/buildings.geojson" \
            --output /tmp/anderlecht-secondary/semantic.json \
            --cell-id "$ANDERLECHT_WITNESS_CELL" \
            --municipality anderlecht \
            --bbox "$ANDERLECHT_WITNESS_MIN_E" "$ANDERLECHT_WITNESS_MIN_N" "$ANDERLECHT_WITNESS_MAX_E" "$ANDERLECHT_WITNESS_MAX_N"
          python3 - <<'PY'
          import json, os
          payload=json.load(open('/tmp/anderlecht-secondary/semantic.json',encoding='utf-8'))
          assert payload['cell']==os.environ['ANDERLECHT_WITNESS_CELL']
          assert payload['policy']['runtime_approval'] is False
          assert payload['counts']['building_solids_in_bbox']>0
          print('ANDERLECHT_SEMANTIC_SOURCE_OK',json.dumps(payload['counts'],sort_keys=True))
          PY

      - name: Compare current candidates and run fail-closed validator
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/build_semantic_dsm_height_comparison.py \
            --semantic /tmp/anderlecht-secondary/semantic.json \
            --height-candidates "$ANDERLECHT_WITNESS_SRC/building_height_candidates.json" \
            --output /tmp/anderlecht-secondary/secondary-evidence.json
          python3 grand-bruxelles-game/tools/citygen/validate_secondary_height_evidence.py \
            --height-candidates "$ANDERLECHT_WITNESS_SRC/building_height_candidates.json" \
            --secondary /tmp/anderlecht-secondary/secondary-evidence.json \
            --output /tmp/anderlecht-secondary/validation.json
          python3 - <<'PY'
          import json, os
          evidence=json.load(open('/tmp/anderlecht-secondary/secondary-evidence.json',encoding='utf-8'))
          validation=json.load(open('/tmp/anderlecht-secondary/validation.json',encoding='utf-8'))
          expected=int(os.environ['ANDERLECHT_WITNESS_CANDIDATE_COUNT'])
          assert evidence['height_candidate_source']['kind']=='autonomous_measured_height_candidates'
          assert evidence['counts']['height_candidate_source_count']==expected
          assert validation['height_candidate_source_kind']=='autonomous_measured_height_candidates'
          assert validation['candidate_count']==expected
          assert validation['validated_candidate_count']+validation['blocked_candidate_count']==expected
          assert validation['runtime_promotion_allowed'] is False
          assert validation['runtime_approved_count']==0
          print('ANDERLECHT_SECONDARY_VALIDATION_RESULT',json.dumps({
              'cell':os.environ['ANDERLECHT_WITNESS_CELL'],
              'candidate_count':expected,
              'joined':evidence['counts']['semantic_joined_records'],
              'strong':evidence['counts']['strong_validation_candidates'],
              'conflicts':evidence['counts']['conflicts'],
              'missing':evidence['counts']['missing_secondary_records'],
              'validated':validation['validated_candidate_count'],
              'blocked':validation['blocked_candidate_count'],
              'complete':validation['secondary_validation_complete'],
              'next_action':validation['next_action'],
          },sort_keys=True))
          PY

      - name: Package compact read-only witness
        run: |
          set -euo pipefail
          cp /tmp/secondary-target.json /tmp/anderlecht-secondary/secondary-target.json
          cp /tmp/urbis-discovered.json /tmp/anderlecht-secondary/discovered.json
          cp /tmp/urbis-3d-selected.json /tmp/anderlecht-secondary/selected.json
          cp /tmp/distribution.sha256 /tmp/anderlecht-secondary/distribution.sha256
          test -s /tmp/anderlecht-secondary/semantic.json
          test -s /tmp/anderlecht-secondary/secondary-evidence.json
          test -s /tmp/anderlecht-secondary/validation.json
          find /tmp/anderlecht-secondary -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload compact witness only
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-citygen-anderlecht-secondary-height
          path: /tmp/anderlecht-secondary/
          if-no-files-found: error
