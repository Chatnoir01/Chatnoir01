name: Grand Bruxelles CityGen DSM Conflict Pixel Autopsy

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/diagnose_dsm_conflict_pixels.py"
      - "grand-bruxelles-game/tools/citygen/test_diagnose_dsm_conflict_pixels.py"
      - ".github/workflows/grand-bruxelles-citygen-dsm-conflict-pixel-autopsy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dsm-conflict-pixel-autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install read-only raster tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-rasterio python3-numpy unzip jq file

      - name: Regression-test DSM conflict pixel contract
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_diagnose_dsm_conflict_pixels.py

      - name: Fetch latest successful production secondary witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list \
            --workflow grand-bruxelles-citygen-anderlecht-secondary-height.yml \
            --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          rm -rf /tmp/secondary-witness
          mkdir -p /tmp/secondary-witness
          gh run download "$RUN_ID" \
            -n grand-bruxelles-citygen-anderlecht-secondary-height \
            -D /tmp/secondary-witness
          test -s /tmp/secondary-witness/validation.json
          test -s /tmp/secondary-witness/secondary-evidence.json
          test -s /tmp/secondary-witness/secondary-target.json
          echo "SECONDARY_WITNESS_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          validation=json.load(open('/tmp/secondary-witness/validation.json',encoding='utf-8'))
          target=json.load(open('/tmp/secondary-witness/secondary-target.json',encoding='utf-8'))
          conflicts=[r for r in validation['candidates'] if r.get('secondary_status')=='blocked_conflict']
          assert len(conflicts) > 0
          assert all(r.get('runtime_approved') is False for r in conflicts)
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as h:
              h.write(f"CELL={target['cell_id']}\n")
          print('DSM_CONFLICT_WITNESS_OK',target['cell_id'],f'conflicts={len(conflicts)}','runtime_approved=false')
          PY

      - name: Fetch exact durable source and validated raster metadata
        run: |
          set -euo pipefail
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          SOURCES="grand-bruxelles-game/data/qa/autonomous_sources"
          rm -rf /tmp/citygen-state
          mkdir -p /tmp/citygen-state
          git archive origin/citygen-autonomous-state "${SOURCES}/${CELL}" | tar -x -C /tmp/citygen-state
          SRC="/tmp/citygen-state/${SOURCES}/${CELL}"
          test -s "$SRC/raw/buildings.geojson"
          test -s "$SRC/building_height_candidates.json"
          test -s "$SRC/elevation_dsm_resolution.json"
          test -s "$SRC/elevation_dtm_resolution.json"
          test -s "$SRC/elevation_dsm_archive_validation.json"
          test -s "$SRC/elevation_dtm_archive_validation.json"
          test -s "$SRC/elevation_raster_validation.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path('/tmp/citygen-state/grand-bruxelles-game/data/qa/autonomous_sources')/os.environ['CELL']
          rv=json.load((src/'elevation_raster_validation.json').open(encoding='utf-8'))
          assert rv['format']=='grand-bruxelles-cell-elevation-raster-validation-v1'
          assert rv['cell_id']==os.environ['CELL']
          assert rv['crs']=='EPSG:31370'
          assert len(rv['dsm']['rasters'])==1 and len(rv['dtm']['rasters'])==1
          dsm_r=rv['dsm']['rasters'][0]['raster']; dtm_r=rv['dtm']['rasters'][0]['raster']
          assert dsm_r['resolution']==[0.5,0.5] and dtm_r['resolution']==[0.5,0.5]
          assert dsm_r['transform']==dtm_r['transform']
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as h:
              h.write(f"SRC={src}\n")
          print('DSM_CONFLICT_DURABLE_RASTER_METADATA_OK',rv['cell_id'],'resolution=0.5m')
          PY

      - name: Resolve exact validated official raster archives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=Path(os.environ['SRC'])
          out=Path(os.environ['GITHUB_ENV'])
          rows={}
          for kind in ('dsm','dtm'):
              res=json.load((src/f'elevation_{kind}_resolution.json').open(encoding='utf-8'))
              val=json.load((src/f'elevation_{kind}_archive_validation.json').open(encoding='utf-8'))
              assert res['cell_id']==val['cell_id']==os.environ['CELL']
              assert res['crs']==val['crs']=='EPSG:31370'
              assert len(res['resolved_archives'])==len(val['archives'])==1
              rr=res['resolved_archives'][0]; vv=val['archives'][0]
              assert rr['tile']==vv['tile']
              assert rr['url']==vv['url']
              assert vv['sha256'] and vv['zip']['tiff_member']
              rows[kind]=(vv['url'],vv['sha256'],vv['zip']['tiff_member'])
          with out.open('a',encoding='utf-8') as h:
              for kind,(url,sha,member) in rows.items():
                  prefix=kind.upper()
                  h.write(f'{prefix}_URL={url}\n{prefix}_SHA={sha}\n{prefix}_MEMBER={member}\n')
          print('DSM_CONFLICT_ARCHIVES_RESOLVED_OK', {k:v[2] for k,v in rows.items()})
          PY

      - name: Download, hash and safely extract official DSM-DTM 2021
        run: |
          set -euo pipefail
          mkdir -p /tmp/dsm-conflict/rasters
          for KIND in DSM DTM; do
            eval URL="\${${KIND}_URL}"
            eval SHA="\${${KIND}_SHA}"
            eval MEMBER="\${${KIND}_MEMBER}"
            ZIP="/tmp/dsm-conflict/${KIND,,}.zip"
            curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
              --user-agent 'GrandBruxellesGame/dsm-conflict-pixel-autopsy (+github.com/Chatnoir01/Chatnoir01)' \
              "$URL" -o "$ZIP"
            echo "$SHA  $ZIP" | sha256sum -c -
            python3 - "$ZIP" "$MEMBER" "/tmp/dsm-conflict/rasters/${KIND,,}.tif" <<'PY'
          import sys, zipfile
          from pathlib import Path
          zpath=Path(sys.argv[1]); member=sys.argv[2]; out=Path(sys.argv[3])
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              assert member in names, (member,names)
              info=z.getinfo(member)
              assert not info.is_dir()
              data=z.read(member)
          out.write_bytes(data)
          assert data[:4] in (b'II*\x00', b'MM\x00*')
          print('DSM_CONFLICT_RASTER_EXTRACT_OK',member,len(data))
          PY
          done

      - name: Revalidate raster payload and apply persisted metric georeference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          import numpy as np
          import rasterio
          from affine import Affine

          src=Path(os.environ['SRC'])
          expected=json.load((src/'elevation_raster_validation.json').open(encoding='utf-8'))
          observed={}
          for kind in ('dsm','dtm'):
              row=expected[kind]['rasters'][0]['raster']
              path=Path('/tmp/dsm-conflict/rasters')/f'{kind}.tif'
              tmp=path.with_suffix('.georef.tif')
              expected_transform=Affine(*[float(v) for v in row['transform']])
              with rasterio.open(path) as r:
                  assert r.width==row['width'] and r.height==row['height']
                  assert r.count==row['count'] and r.dtypes[0]==row['dtype']
                  payload=r.read()
                  profile=r.profile.copy()
              profile.update(crs='EPSG:31370', transform=expected_transform)
              with rasterio.open(tmp,'w',**profile) as w:
                  w.write(payload)
              with rasterio.open(tmp) as r:
                  reread=r.read()
                  assert r.width==row['width'] and r.height==row['height']
                  assert r.count==row['count'] and r.dtypes[0]==row['dtype']
                  assert r.crs is not None and r.crs.to_epsg()==31370
                  assert all(math.isclose(a,b,abs_tol=1e-9) for a,b in zip(tuple(r.transform)[:6],row['transform']))
                  assert all(math.isclose(a,b,abs_tol=1e-12) for a,b in zip([abs(r.res[0]),abs(r.res[1])],row['resolution']))
                  assert np.array_equal(payload,reread,equal_nan=True)
                  observed[kind]={
                      'width':r.width,
                      'height':r.height,
                      'res':list(map(abs,r.res)),
                      'transform':list(tuple(r.transform)[:6]),
                      'crs':'EPSG:31370',
                      'payload_unchanged':True,
                  }
              tmp.replace(path)
          assert observed['dsm']['transform']==observed['dtm']['transform']
          assert observed['dsm']['res']==observed['dtm']['res']==[0.5,0.5]
          print('DSM_CONFLICT_RASTER_REVALIDATION_OK',json.dumps(observed,sort_keys=True))
          PY

      - name: Diagnose all true blocked conflicts without resolving them
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/diagnose_dsm_conflict_pixels.py \
            --buildings "$SRC/raw/buildings.geojson" \
            --validation /tmp/secondary-witness/validation.json \
            --dsm /tmp/dsm-conflict/rasters/dsm.tif \
            --dtm /tmp/dsm-conflict/rasters/dtm.tif \
            --output /tmp/dsm-conflict/report.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/dsm-conflict/report.json',encoding='utf-8'))
          assert r['policy']['read_only'] is True
          assert r['policy']['cause_inference_allowed'] is False
          assert r['policy']['automatic_resolution_allowed'] is False
          assert r['policy']['runtime_promotion_allowed'] is False
          assert r['policy']['thresholds_changed'] is False
          assert r['runtime_approved_count']==0
          assert r['counts']['conflict_candidates']==3
          assert len(r['records'])==3
          assert all(x['runtime_approved'] is False and x['automatic_resolution_allowed'] is False for x in r['records'])
          print('DSM_CONFLICT_PIXEL_AUTOPSY_RESULT',json.dumps(r['counts'],sort_keys=True))
          for row in r['records']:
              print('DSM_CONFLICT_PIXEL_RECORD',row['building_id'],json.dumps({
                  'primary':row['primary_height_m'],
                  'semantic':row['semantic_height_m'],
                  'valid_pixels':row['grid']['valid_pixel_count'],
                  'primary_band_fraction':row['grid']['bands']['primary']['fraction_of_valid'],
                  'semantic_band_fraction':row['grid']['bands']['semantic']['fraction_of_valid'],
                  'edge_primary_fraction':row['grid']['zones']['edge']['primary_band_fraction'],
                  'interior_primary_fraction':row['grid']['zones']['interior']['primary_band_fraction'],
                  'primary_largest_component_fraction':row['grid']['bands']['primary']['largest_component_fraction_of_valid'],
                  'semantic_largest_component_fraction':row['grid']['bands']['semantic']['largest_component_fraction_of_valid'],
              },sort_keys=True))
          PY

      - name: Package compact read-only evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/dsm-conflict/rasters /tmp/dsm-conflict/dsm.zip /tmp/dsm-conflict/dtm.zip
          test -s /tmp/dsm-conflict/report.json
          cp "$SRC/elevation_raster_validation.json" /tmp/dsm-conflict/elevation_raster_validation.json
          sha256sum /tmp/dsm-conflict/report.json /tmp/dsm-conflict/elevation_raster_validation.json > /tmp/dsm-conflict/evidence.sha256
          find /tmp/dsm-conflict -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-citygen-dsm-conflict-pixel-autopsy
          path: /tmp/dsm-conflict/
          if-no-files-found: error
