name: Grand Bruxelles CityGen Source Repair Frontier

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/grand-bruxelles-citygen-source-repair-frontier.yml"
      - "grand-bruxelles-game/tools/citygen/autonomous_citygen.py"
      - "grand-bruxelles-game/tools/citygen/bootstrap_cell_maturity.py"
      - "grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py"
      - "grand-bruxelles-game/tools/citygen/test_citygen_source_repair_frontier_contract.py"
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-citygen-source-repair-frontier.yml"
      - "grand-bruxelles-game/tools/citygen/autonomous_citygen.py"
      - "grand-bruxelles-game/tools/citygen/bootstrap_cell_maturity.py"
      - "grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py"
      - "grand-bruxelles-game/tools/citygen/test_citygen_source_repair_frontier_contract.py"

permissions:
  contents: write

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-repair frontier contract
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_source_completeness.py
          python3 grand-bruxelles-game/tools/citygen/test_autonomous_citygen_regional_source_contract.py
          python3 grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py
          python3 grand-bruxelles-game/tools/citygen/test_citygen_source_repair_frontier_contract.py

  repair-frontier:
    if: github.event_name != 'pull_request'
    needs: validate-contract
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      durable_progress: ${{ steps.persist.outputs.durable_progress }}
    # Fan-out is compute-only. There is still exactly one durable writer and it
    # shares the autonomous state lock; no worker can mutate durable state.
    concurrency:
      group: grand-bruxelles-autonomous-citygen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover durable source state
        run: |
          set -euo pipefail
          rm -rf /tmp/citygen-source-repair /tmp/citygen-source-repaired
          mkdir -p /tmp/citygen-source-repair /tmp/citygen-source-repaired
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          git rev-parse refs/remotes/origin/citygen-autonomous-state > /tmp/citygen-source-repair/remote_sha
          STATE_ROOT="grand-bruxelles-game/data/qa"
          git show "origin/citygen-autonomous-state:${STATE_ROOT}/autonomous_citygen_state.json" > /tmp/citygen-source-repair/previous_state.json
          git show "origin/citygen-autonomous-state:${STATE_ROOT}/brussels_regional_target_grid.json" > /tmp/citygen-source-repair/target_grid.json
          if git cat-file -e "origin/citygen-autonomous-state:${STATE_ROOT}/autonomous_sources" 2>/dev/null; then
            git archive origin/citygen-autonomous-state "${STATE_ROOT}/autonomous_sources" | tar -x -C /tmp/citygen-source-repair
            mkdir -p grand-bruxelles-game/data/urbis/remaining_brussels/cells
            cp -a "/tmp/citygen-source-repair/${STATE_ROOT}/autonomous_sources/." grand-bruxelles-game/data/urbis/remaining_brussels/cells/
          fi

      - name: Select municipality-balanced source repairs
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-source-repair/selection
          python3 grand-bruxelles-game/tools/citygen/autonomous_citygen.py \
            --source-root grand-bruxelles-game/data/urbis/remaining_brussels/cells \
            --maturity-root grand-bruxelles-game/data/cell_manifests \
            --state /tmp/citygen-source-repair/previous_state.json \
            --target-grid /tmp/citygen-source-repair/target_grid.json \
            --output-dir /tmp/citygen-source-repair/selection \
            --batch-size 128
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/citygen-source-repair/selection/autonomous_citygen_report.json').read_text(encoding='utf-8'))
          selected = set(report.get('selected_batch', []))
          rows = []
          municipalities = set()
          for cell in report.get('cells', []):
              if cell.get('cell_id') not in selected or cell.get('state') != 'MISSING_SOURCE':
                  continue
              bbox = cell.get('bbox')
              if not isinstance(bbox, list) or len(bbox) != 4:
                  raise SystemExit(f"missing source has no canonical bbox: {cell.get('cell_id')}")
              rows.append(cell['cell_id'] + '\t' + ','.join(str(v) for v in bbox))
              municipalities.update(cell.get('municipalities') or [])
          Path('/tmp/citygen-source-repair/repair_worklist.tsv').write_text(''.join(row + '\n' for row in rows), encoding='utf-8')
          print(f"CITYGEN_SOURCE_REPAIR_SELECTION_OK selected={len(rows)} municipalities={len(municipalities)} batch=128")
          PY

      - name: Rematerialize authoritative UrbIS sources with bounded fan-out
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPAIR_WORKERS=16
          export SOURCE_REPAIR_WORKERS
          mkdir -p /tmp/citygen-source-repair/results /tmp/citygen-source-repaired
          rm -f /tmp/citygen-source-repair/results/*

          repair_one() {
            local row="$1" CELL BBOX DEST LOG RESULT
            CELL="${row%%$'\t'*}"
            BBOX="${row#*$'\t'}"
            [ -n "$CELL" ] || return 0
            DEST="grand-bruxelles-game/data/urbis/remaining_brussels/cells/${CELL}"
            LOG="/tmp/citygen-source-repair/${CELL}.log"
            RESULT="/tmp/citygen-source-repair/results/${CELL}.result"
            if python3 grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py \
              --cell-id "$CELL" --bbox "$BBOX" --output-dir "$DEST" >"$LOG" 2>&1; then
              mkdir -p "/tmp/citygen-source-repaired/${CELL}"
              cp -a "$DEST/." "/tmp/citygen-source-repaired/${CELL}/"
              printf 'OK\t%s\n' "$CELL" > "$RESULT"
              rm -f "$LOG"
            else
              printf 'FAIL\t%s\t%s\n' "$CELL" "$(tail -n 1 "$LOG" | tr '\t\r\n' '   ')" > "$RESULT"
            fi
          }
          export -f repair_one

          # NUL-delimited records keep each CELL<TAB>BBOX row intact while xargs
          # runs at most 16 source materializers concurrently.
          python3 - <<'PY' | xargs -0 -r -n1 -P "$SOURCE_REPAIR_WORKERS" bash -c 'repair_one "$1"' _
          from pathlib import Path
          for row in Path('/tmp/citygen-source-repair/repair_worklist.tsv').read_text(encoding='utf-8').splitlines():
              if row:
                  print(row, end='\0')
          PY

          : > /tmp/citygen-source-repair/repair_success.txt
          : > /tmp/citygen-source-repair/repair_failures.tsv
          for RESULT in /tmp/citygen-source-repair/results/*.result; do
            [ -e "$RESULT" ] || continue
            IFS=$'\t' read -r STATUS CELL DETAIL < "$RESULT"
            if [ "$STATUS" = OK ]; then
              echo "$CELL" >> /tmp/citygen-source-repair/repair_success.txt
            else
              printf '%s\t%s\n' "$CELL" "$DETAIL" >> /tmp/citygen-source-repair/repair_failures.tsv
            fi
          done
          sort -u -o /tmp/citygen-source-repair/repair_success.txt /tmp/citygen-source-repair/repair_success.txt
          sort -u -o /tmp/citygen-source-repair/repair_failures.tsv /tmp/citygen-source-repair/repair_failures.tsv
          echo "CITYGEN_SOURCE_REPAIR_FANOUT_OK workers=${SOURCE_REPAIR_WORKERS} successes=$(wc -l < /tmp/citygen-source-repair/repair_success.txt) failures=$(wc -l < /tmp/citygen-source-repair/repair_failures.tsv) batch=128"

      - name: Refresh scheduler classification after repairs
        run: |
          set -euo pipefail
          mkdir -p /tmp/citygen-source-repair/refreshed
          python3 grand-bruxelles-game/tools/citygen/autonomous_citygen.py \
            --source-root grand-bruxelles-game/data/urbis/remaining_brussels/cells \
            --maturity-root grand-bruxelles-game/data/cell_manifests \
            --state /tmp/citygen-source-repair/selection/autonomous_citygen_state.json \
            --target-grid /tmp/citygen-source-repair/target_grid.json \
            --output-dir /tmp/citygen-source-repair/refreshed \
            --batch-size 128 \
            --refresh-only

      - name: Persist repaired sources and refreshed state immediately
        id: persist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA="$(cat /tmp/citygen-source-repair/remote_sha)"
          git switch -C citygen-autonomous-state refs/remotes/origin/citygen-autonomous-state
          STATE_ROOT="grand-bruxelles-game/data/qa"
          mkdir -p "${STATE_ROOT}/autonomous_sources"
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            mkdir -p "${STATE_ROOT}/autonomous_sources/${CELL}"
            cp -a "/tmp/citygen-source-repaired/${CELL}/." "${STATE_ROOT}/autonomous_sources/${CELL}/"
          done < /tmp/citygen-source-repair/repair_success.txt
          cp /tmp/citygen-source-repair/refreshed/autonomous_citygen_state.json "${STATE_ROOT}/autonomous_citygen_state.json"
          cp /tmp/citygen-source-repair/refreshed/autonomous_citygen_report.json "${STATE_ROOT}/autonomous_citygen_latest_report.json"
          cp /tmp/citygen-source-repair/refreshed/worklist.txt "${STATE_ROOT}/autonomous_citygen_worklist.txt"
          cp /tmp/citygen-source-repair/target_grid.json "${STATE_ROOT}/brussels_regional_target_grid.json"
          cp /tmp/citygen-source-repair/repair_failures.tsv "${STATE_ROOT}/source_repair_failures.tsv"
          git add "${STATE_ROOT}/autonomous_sources" \
                  "${STATE_ROOT}/autonomous_citygen_state.json" \
                  "${STATE_ROOT}/autonomous_citygen_latest_report.json" \
                  "${STATE_ROOT}/autonomous_citygen_worklist.txt" \
                  "${STATE_ROOT}/brussels_regional_target_grid.json" \
                  "${STATE_ROOT}/source_repair_failures.tsv"
          if git diff --cached --quiet; then
            echo "CITYGEN_SOURCE_REPAIR_NO_CHANGE"
          else
            git commit -m "citygen: persist authoritative source repairs"
            git push \
              --force-with-lease="refs/heads/citygen-autonomous-state:${REMOTE_SHA}" \
              origin HEAD:refs/heads/citygen-autonomous-state
          fi
          echo "durable_progress=true" >> "$GITHUB_OUTPUT"

      - name: Upload source-repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: citygen-source-repair-${{ github.run_number }}
          path: |
            /tmp/citygen-source-repair/repair_worklist.tsv
            /tmp/citygen-source-repair/repair_success.txt
            /tmp/citygen-source-repair/repair_failures.tsv
            /tmp/citygen-source-repair/refreshed/
          retention-days: 30

      - name: Surface repair failures after durable progress
        run: |
          set -euo pipefail
          FAILURES="$(wc -l < /tmp/citygen-source-repair/repair_failures.tsv)"
          if [ "$FAILURES" -gt 0 ]; then
            cat /tmp/citygen-source-repair/repair_failures.tsv
            echo "CITYGEN_SOURCE_REPAIR_PARTIAL failures=${FAILURES} persisted_successes=true" >&2
            exit 1
          fi
          echo "CITYGEN_SOURCE_REPAIR_COMPLETE failures=0 persisted_successes=true promotion_bypass=false"

  dispatch-regional-citygen:
    if: always() && github.event_name != 'pull_request' && needs.repair-frontier.outputs.durable_progress == 'true'
    needs: repair-frontier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch runtime frontier and regional CityGen after durable source repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/grand-bruxelles-runtime-candidate-frontier.yml/dispatches" -f ref=main
          echo "CITYGEN_RUNTIME_FRONTIER_DISPATCH_OK durable_progress=true limit=32 promotion_bypass=false"
          gh api --method POST -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/grand-bruxelles-autonomous-citygen.yml/dispatches" -f ref=main -f 'inputs[batch_size]=128'
          echo "CITYGEN_SOURCE_REPAIR_CHAIN_OK durable_progress=true next=runtime_frontier+autonomous_citygen batch=128 promotion_bypass=false"
