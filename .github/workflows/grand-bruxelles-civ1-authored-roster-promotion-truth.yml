name: Grand Bruxelles CIV-1 Authored Roster Promotion Truth
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_authored_roster_promotion_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_authored_roster_promotion_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_authored_roster_load_correlation.py'
      - 'grand-bruxelles-game/game/main.tscn'
      - 'grand-bruxelles-game/game/scripts/humanoid_visual.gd'
      - '.github/workflows/grand-bruxelles-civ1-authored-roster-promotion-truth.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_authored_roster_promotion_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_authored_roster_promotion_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_authored_roster_load_correlation.py'
      - 'grand-bruxelles-game/game/main.tscn'
      - 'grand-bruxelles-game/game/scripts/humanoid_visual.gd'
      - '.github/workflows/grand-bruxelles-civ1-authored-roster-promotion-truth.yml'
permissions:
  contents: read
jobs:
  authored-roster-promotion-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current live main ancestry and QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject forged promotion truth
        run: python grand-bruxelles-game/tools/civ1_authored_roster_promotion_truth.py --self-test
      - name: Reproduce and reject v1-v3 roster false positives
        run: python grand-bruxelles-game/tools/test_civ1_authored_roster_promotion_truth.py
      - name: Reproduce and reject v4 unrelated-load false positive
        run: python grand-bruxelles-game/tools/test_civ1_authored_roster_load_correlation.py
      - name: Measure canonical NPC visual promotion truth
        run: |
          mkdir -p /tmp/civ1-roster-truth
          python grand-bruxelles-game/tools/civ1_authored_roster_promotion_truth.py \
            grand-bruxelles-game/game/main.tscn \
            grand-bruxelles-game/game/scripts/humanoid_visual.gd \
            /tmp/civ1-roster-truth/civ1-authored-roster-promotion-truth.json
      - name: Assert current fail-closed production truth
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/civ1-roster-truth/civ1-authored-roster-promotion-truth.json', encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-authored-roster-promotion-truth-v6'
          assert d['canonical_humanoid_visual_bound'] is True
          assert d['npcagent_dispatch_to_profiled_pipeline'] is True
          assert d['canonical_npc_dispatch_is_procedural'] is True
          assert d['procedural_profile_fallback_detected'] is True
          assert d['player_character_reuse_in_npc_dispatch_detected'] is False
          assert d['authored_npc_asset_dispatch_statically_proven'] is False
          assert d['authored_npc_asset_load_proven'] is False
          assert d['authored_npc_scene_instantiation_proven'] is False
          assert d['correlated_authored_loaded_variables'] == []
          assert d['correlated_authored_asset_paths'] == []
          assert d['asset_load_instantiation_correlation_required'] is True
          assert d['identity_count_based_on_correlated_dispatch'] is True
          assert d['multiple_authored_npc_identities_statically_proven'] is False
          assert d['comment_text_excluded_from_static_evidence'] is True
          assert d['quoted_asset_path_evidence_required'] is True
          assert d['authored_civilian_police_roster_visual_ready'] is False
          assert d['promotion_blocked'] is True
          assert 'npcagent_dispatch_uses_procedural_profile_body' in d['blocking_reasons']
          assert 'npcagent_dispatch_has_no_correlated_authored_asset_load_and_instantiation_proof' in d['blocking_reasons']
          assert 'multiple_authored_npc_identities_not_statically_proven' in d['blocking_reasons']
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          assert d['contact_verified'] is False
          assert d['foot_slide_verified'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-authored-roster-promotion-truth
          path: /tmp/civ1-roster-truth/civ1-authored-roster-promotion-truth.json
