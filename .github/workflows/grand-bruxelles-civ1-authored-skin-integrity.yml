name: Grand Bruxelles CIV-1 Authored Skin Integrity
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_authored_skin_integrity.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - '.github/workflows/grand-bruxelles-civ1-authored-skin-integrity.yml'
permissions:
  contents: read
jobs:
  civ1-authored-skin-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live main and QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "b12c3cfaccdb5536ba79418cc2a469787da14730"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- \
            grand-bruxelles-game/game/main.tscn \
            grand-bruxelles-game/game/scripts \
            grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject forged authored-skin evidence
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/civ1_authored_skin_integrity.py --self-test
      - name: Measure reachable authored-skin integrity
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-skin-integrity
          python grand-bruxelles-game/tools/civ1_authored_skin_integrity.py \
            grand-bruxelles-game/game/main.tscn \
            /tmp/civ1-skin-integrity/civ1-authored-skin-integrity.json
      - name: Assert fail-closed integrity contract
        run: |
          python - <<'PY'
          import json
          p='/tmp/civ1-skin-integrity/civ1-authored-skin-integrity.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-authored-skin-integrity-v1'
          assert d['evidence_mode']=='reachable_tscn_node_blocks_plus_explicit_skeleton_and_material_binding'
          assert d['reachable_scene_count'] >= 1
          assert d['empty_skeleton_evidence_accepted'] is False
          assert d['unbound_mesh_evidence_accepted'] is False
          assert d['materialless_mesh_evidence_accepted'] is False
          assert d['integrity_ready_count'] <= d['hierarchy_count']
          assert d['authored_skin_integrity_ready'] == (d['integrity_ready_count'] > 0)
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          assert d['contact_verified'] is False
          assert d['foot_slide_verified'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-authored-skin-integrity
          path: /tmp/civ1-skin-integrity/civ1-authored-skin-integrity.json
