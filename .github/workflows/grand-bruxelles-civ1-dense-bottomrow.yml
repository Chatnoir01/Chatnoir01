name: Grand Bruxelles CIV-1 Dense Bottom Row
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_bottomrow_subpixel.py'
      - 'grand-bruxelles-game/tools/analyze_civ1_dense_bottomrow_subpixel.py'
      - 'grand-bruxelles-game/tests/test_civ1_dense_bottomrow_subpixel.py'
      - '.github/workflows/grand-bruxelles-civ1-dense-bottomrow.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  dense-bottomrow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression contract
        run: python grand-bruxelles-game/tests/test_civ1_dense_bottomrow_subpixel.py
      - name: Prepare pinned CIV-1 sources and Godot 4.7.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1dense/{tools,source,evidence,engine,captures}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          SELECT_REF=a9ac6276c5ff69927e4d4212efc4f1aff2bb21ac
          FIXED_REF=cdbe1814886aefa81a95acbb43e3e2cb9289284f
          WITNESS_REF=d8e5c9614a2a5c7988c9552eb9a72ba1c00ea5c1
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1dense/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1dense/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1dense/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SELECT_REF/grand-bruxelles-game/tools/select_quaternius_project.py" -o /tmp/civ1dense/tools/select.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/analyze_civ1_fixed_length_reconstruction.py" -o /tmp/civ1dense/tools/analyze.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/build_civ1_skeleton_witness_bundle.py" -o /tmp/civ1dense/tools/bundle.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$WITNESS_REF/grand-bruxelles-game/tools/godot_civ1_player_distance_raster_witness.gd" -o /tmp/civ1dense/tools/dense-witness.gd
          sed -i 's#const TARGET_SAMPLES := \[115, 116, 117, 118\]#const TARGET_SAMPLES := [111, 112, 113, 114, 115, 116, 117, 118, 119]#' /tmp/civ1dense/tools/dense-witness.gd
          grep -F 'const TARGET_SAMPLES := [111, 112, 113, 114, 115, 116, 117, 118, 119]' /tmp/civ1dense/tools/dense-witness.gd
          sed -i 's#HERE / "analyze_civ1_fixed_length_reconstruction.py"#HERE / "analyze.py"#' /tmp/civ1dense/tools/bundle.py
          python /tmp/civ1dense/tools/shadow.py /tmp/civ1dense/tools/base.gd /tmp/civ1dense/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1dense/source/body.glb
          test "$(stat -c '%s' /tmp/civ1dense/source/body.glb)" = 6879364
          python /tmp/civ1dense/tools/strip.py /tmp/civ1dense/source/body.glb /tmp/civ1dense/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1dense/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_head.glb -o /tmp/civ1dense/source/vitruvian_head.glb
          test "$(stat -c '%s' /tmp/civ1dense/source/vitruvian_head.glb)" = 10189832
          echo '54efb42e9f3dd7e7cf3c3e86ed5298f3ba26e341d5743245cbe2621c547c5f1f  /tmp/civ1dense/source/vitruvian_head.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1dense/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1dense/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1dense/quaternius.zip -d /tmp/civ1dense/quaternius
          L="$(find /tmp/civ1dense/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$L"; grep -Eqi 'cc0|creative commons zero' "$L"
          python /tmp/civ1dense/tools/select.py /tmp/civ1dense/quaternius | tee /tmp/civ1dense/evidence/project-root.txt
          PROJECT_ROOT="$(cat /tmp/civ1dense/evidence/project-root.txt)"
          if [ ! -f "$PROJECT_ROOT/project.godot" ]; then printf '[application]\nconfig/name="CIV1DenseBundle"\n[display]\nwindow/size/viewport_width=1280\nwindow/size/viewport_height=720\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1dense/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1dense/source/vitruvian_head.glb "$PROJECT_ROOT/vitruvian_head.glb"
          cp /tmp/civ1dense/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1dense/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1dense/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1dense/godot.zip -d /tmp/civ1dense/engine
          chmod +x /tmp/civ1dense/engine/Godot_v4.7.1-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/civ1dense/engine/Godot_v4.7.1-stable_linux.x86_64' >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild proven 120-frame skeleton bundle
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1dense/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1dense/evidence/native.json 2>&1 | tee /tmp/civ1dense/evidence/native.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1dense/evidence/native.log
          python /tmp/civ1dense/tools/analyze.py /tmp/civ1dense/evidence/native.json /tmp/civ1dense/evidence/fixed-length.json | tee /tmp/civ1dense/evidence/fixed-length.log
          grep -F 'verdict=AMELIORER_FIXED_LENGTH_CONTINUOUS_CYCLE' /tmp/civ1dense/evidence/fixed-length.log
          python /tmp/civ1dense/tools/bundle.py /tmp/civ1dense/evidence/native.json /tmp/civ1dense/evidence/fixed-length.json /tmp/civ1dense/evidence/skeleton-bundle.json | tee /tmp/civ1dense/evidence/bundle.log
          grep -F CIV1_SKELETON_WITNESS_BUNDLE_OK /tmp/civ1dense/evidence/bundle.log
      - name: Prepare current canonical-project sandbox
        run: |
          set -euo pipefail
          CANONICAL_PROJECT=/tmp/civ1dense/canonical-project
          cp -a grand-bruxelles-game "$CANONICAL_PROJECT"
          cat > "$CANONICAL_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="CIV1DensePlayerDistance"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [physics]
          3d/default_gravity=9.8
          common/physics_ticks_per_second=60
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/civ1dense/source/civ1_body.glb "$CANONICAL_PROJECT/civ1_body.glb"
          cp /tmp/civ1dense/source/vitruvian_head.glb "$CANONICAL_PROJECT/vitruvian_head.glb"
          cp /tmp/civ1dense/tools/dense-witness.gd "$CANONICAL_PROJECT/gb_dense_distance.gd"
          "$GODOT_BIN" --headless --editor --path "$CANONICAL_PROJECT" --quit 2>&1 | tee /tmp/civ1dense/evidence/canonical-import.log
          echo "CANONICAL_PROJECT=$CANONICAL_PROJECT" >> "$GITHUB_ENV"
      - name: Render 27 fresh rasters and measure dense same-row scale
        run: |
          set -euo pipefail
          xvfb-run -a "$GODOT_BIN" --path "$CANONICAL_PROJECT" --resolution 1280x720 --script res://gb_dense_distance.gd -- /tmp/civ1dense/evidence/skeleton-bundle.json /tmp/civ1dense/evidence/dense-raster.json /tmp/civ1dense/captures 2>&1 | tee /tmp/civ1dense/evidence/dense-raster.log
          grep -F CIV1_PLAYER_DISTANCE_RASTER_OK /tmp/civ1dense/evidence/dense-raster.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1dense/evidence/dense-raster.json').read_text())
          assert p['resolution']==[1280,720] and p['vertical_fov_deg']==45.0
          assert p['player_distances_m']==[2.0,4.0,8.0]
          assert p['sample_indices']==list(range(111,120))
          assert p['capture_count']==27 and p['max_pose_origin_error_m']<=1e-4
          assert not p['animation_correction_authorized'] and not p['runtime_authorized'] and not p['player_view_claimed']
          for c in p['captures']:
              q=Path(c['png']); assert q.is_file() and q.stat().st_size>0
          PY
          python grand-bruxelles-game/tools/analyze_civ1_dense_bottomrow_subpixel.py /tmp/civ1dense/captures /tmp/civ1dense/evidence/dense-bottomrow.json | tee /tmp/civ1dense/evidence/dense-bottomrow.log
          grep -F CIV1_DENSE_BOTTOMROW_SUBPIXEL_OK /tmp/civ1dense/evidence/dense-bottomrow.log
          python - <<'PY'
          import json, math
          r=json.load(open('/tmp/civ1dense/evidence/dense-bottomrow.json',encoding='utf-8'))
          assert r['schema']=='grand-bruxelles-civ1-dense-bottomrow-subpixel-v1'
          assert r['samples']==list(range(111,120)) and r['sample_count_per_distance']==9
          assert r['position_row_semantic']=='same_bottom_most_near_white_row'
          assert len(r['distance_measurements'])==3
          for d in r['distance_measurements']:
              assert d['step_count']==8 and len(d['records'])==9
              assert math.isfinite(d['subpixel_path_px']) and math.isfinite(d['step_mean_px']) and math.isfinite(d['step_max_px'])
              for rec in d['records']:
                  assert rec['position_row_semantic']=='same_bottom_most_near_white_row'
          for k in ('perceptual_2_8m_claimed','planted_contact_claimed','animation_correction_authorized','runtime_authorized','visual_approval_claimed','player_view_claimed'):
              assert r[k] is False
          print('CIV1_DENSE_BOTTOMROW_RECEIPT', {d['distance_m']:d['subpixel_path_px'] for d in r['distance_measurements']}, r['distance_scale_calibration'], r['verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-dense-bottomrow-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/civ1dense/evidence
            /tmp/civ1dense/captures
          if-no-files-found: error
          retention-days: 14
