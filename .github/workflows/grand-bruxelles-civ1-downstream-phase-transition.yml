name: Grand Bruxelles CIV-1 Downstream Phase Transition

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py"
      - "grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd"
      - "grand-bruxelles-game/tools/strip_glb_animations.py"
      - "grand-bruxelles-game/tests/test_civ1_downstream_phase_transition.py"
      - ".github/workflows/grand-bruxelles-civ1-downstream-phase-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-phase-transition-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run deterministic transition regression
        run: python3 grand-bruxelles-game/tests/test_civ1_downstream_phase_transition.py

      - name: Enforce QA-only rails
        run: |
          set -euo pipefail
          grep -Fq 'diagnostic_only": True' grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py
          grep -Fq 'runtime_authorized": False' grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py
          grep -Fq 'visual_approval_claimed": False' grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py
          grep -Fq 'threshold_was_modified": False' grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1transition/source /tmp/civ1transition/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1transition/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1transition/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1transition/source/vitruvian_body.glb /tmp/civ1transition/source/civ1_body.glb --require-animations | tee /tmp/civ1transition/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1transition/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1transition/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1transition/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1transition/quaternius
          unzip -q /tmp/civ1transition/quaternius.zip -d /tmp/civ1transition/quaternius
          LICENSE_FILE="$(find /tmp/civ1transition/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1transition/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1transition/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1transition/engine
          GODOT_BIN=/tmp/civ1transition/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1transition/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1transition/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact rigs and capture native model-space chain
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1transition/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1transition/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1DownstreamTransition"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1transition/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_global_chain_diagnostic.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1transition/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_diagnostic.gd -- /tmp/civ1transition/evidence/global-chain.json 2>&1 | tee /tmp/civ1transition/evidence/probe.log
          grep -Fq 'CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK' /tmp/civ1transition/evidence/probe.log

      - name: Attribute exact LowerLeg Foot transition
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/analyze_civ1_downstream_phase_transition.py \
            /tmp/civ1transition/evidence/global-chain.json \
            /tmp/civ1transition/evidence/downstream-phase-transition.json \
            | tee /tmp/civ1transition/evidence/classification.log
          grep -Fq 'CIV1_DOWNSTREAM_PHASE_TRANSITION_OK' /tmp/civ1transition/evidence/classification.log

      - name: Upload downstream phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-downstream-phase-transition-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1transition/evidence/
          if-no-files-found: error
          retention-days: 14
