name: Grand Bruxelles CIV-1 Dynamic Chain Decomposition

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd"
      - "grand-bruxelles-game/tests/test_civ1_dynamic_chain_decomposition_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-dynamic-chain-decomposition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-chain-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_dynamic_chain_decomposition_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1dynamic/source /tmp/civ1dynamic/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1dynamic/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1dynamic/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1dynamic/source/vitruvian_body.glb /tmp/civ1dynamic/source/civ1_body.glb --require-animations | tee /tmp/civ1dynamic/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1dynamic/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1dynamic/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1dynamic/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1dynamic/quaternius
          unzip -q /tmp/civ1dynamic/quaternius.zip -d /tmp/civ1dynamic/quaternius
          LICENSE_FILE="$(find /tmp/civ1dynamic/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1dynamic/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1dynamic/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1dynamic/engine
          GODOT_BIN=/tmp/civ1dynamic/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1dynamic/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1dynamic/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Capture exact 121-sample model-space evidence
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1dynamic/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1dynamic/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1DynamicChain"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1dynamic/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_global_chain_diagnostic.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1dynamic/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_diagnostic.gd -- /tmp/civ1dynamic/evidence/global-chain.json 2>&1 | tee /tmp/civ1dynamic/evidence/probe.log
          grep -Fq 'CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK' /tmp/civ1dynamic/evidence/probe.log

      - name: Classify dynamic parent-child decomposition and parent-amplitude A-B
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1dynamic/evidence/dynamic-decomposition.log
          import json, math
          from pathlib import Path

          PHASE_DIVERGENCE_MATERIAL_SAMPLES = 12
          p=json.loads(Path('/tmp/civ1dynamic/evidence/global-chain.json').read_text())
          assert p['format']=='grand-bruxelles-civ1-global-chain-diagnostic-v3'
          assert p['sample_count']==121
          assert p['diagnostic_only'] is True
          assert p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False
          samples=p['model_space_samples']
          assert len(samples)==121
          cycle=samples[:120]

          def circular_delta(target, source):
              delta=int(target)-int(source)
              while delta > 60:
                  delta -= 120
              while delta < -60:
                  delta += 120
              return delta

          def min_index(values):
              assert len(values)==120 and all(math.isfinite(float(v)) for v in values)
              return min(range(120), key=lambda i: float(values[i]))

          def normalized(values):
              mean=sum(values)/len(values)
              variance=sum((v-mean)*(v-mean) for v in values)/len(values)
              std=math.sqrt(variance)
              assert std > 1e-9, (mean,std)
              return [(v-mean)/std for v in values]

          def circular_phase_shift_samples(source_values, target_values):
              source_norm=normalized(source_values)
              target_norm=normalized(target_values)
              candidates=[]
              for shift in range(-60,61):
                  mse=sum((source_norm[i]-target_norm[(i+shift)%120])**2 for i in range(120))/120.0
                  candidates.append((mse,abs(shift),shift))
              candidates.sort()
              mse,_,shift=candidates[0]
              return {'shift_samples':shift,'normalized_mse':mse}

          def sample_error(parent_source, relative_source, final_source, parent_target, relative_target, final_target, index):
              parent_error=parent_target[index]-parent_source[index]
              relative_error=relative_target[index]-relative_source[index]
              final_error=final_target[index]-final_source[index]
              closure=final_error-(parent_error+relative_error)
              return {
                  'sample_index':index,
                  'parent_hips_relative_error_m':parent_error,
                  'parent_to_foot_relative_error_m':relative_error,
                  'final_foot_error_m':final_error,
                  'algebraic_closure_error_m':closure,
              }

          def decompose(leg):
              parent=f'{leg}LowerLeg'
              foot=f'{leg}Foot'
              series={}
              rows={}
              for side in ('source','target'):
                  hips_key=f'{side}_hips_relative_origin'
                  parent_y=[]
                  relative_y=[]
                  final_y=[]
                  for sample in cycle:
                      pr=sample['bones'][parent][side]
                      fr=sample['bones'][foot][side]
                      parent_y.append(float(pr[hips_key][1]))
                      relative_y.append(float(fr['model_origin'][1])-float(pr['model_origin'][1]))
                      final_y.append(float(fr[hips_key][1]))
                  series[side]=(parent_y,relative_y,final_y)
                  rows[side]={
                      'parent_hips_relative_vertical_min_sample_index':min_index(parent_y),
                      'parent_to_foot_relative_vertical_min_sample_index':min_index(relative_y),
                      'final_foot_vertical_min_sample_index':min_index(final_y),
                  }
              sp,sr,sf=series['source']
              tp,tr,tf=series['target']
              source_final_min=rows['source']['final_foot_vertical_min_sample_index']
              target_final_min=rows['target']['final_foot_vertical_min_sample_index']
              result={
                  'source':rows['source'],
                  'target':rows['target'],
                  'parent_trajectory_phase_shift_samples':circular_phase_shift_samples(sp,tp),
                  'relative_trajectory_phase_shift_samples':circular_phase_shift_samples(sr,tr),
                  'final_trajectory_phase_shift_samples':circular_phase_shift_samples(sf,tf),
                  'final_phase_delta_samples':circular_delta(target_final_min,source_final_min),
                  'source_min_error_attribution':sample_error(sp,sr,sf,tp,tr,tf,source_final_min),
                  'target_min_error_attribution':sample_error(sp,sr,sf,tp,tr,tf,target_final_min),
              }
              return result, (sp,sr,sf,tp,tr,tf)

          left,left_series=decompose('Left')
          right,right_series=decompose('Right')
          right_parent_shift=abs(int(right['parent_trajectory_phase_shift_samples']['shift_samples']))
          right_relative_shift=abs(int(right['relative_trajectory_phase_shift_samples']['shift_samples']))
          right_trajectory_phase_aligned=(
              right_parent_shift <= PHASE_DIVERGENCE_MATERIAL_SAMPLES and
              right_relative_shift <= PHASE_DIVERGENCE_MATERIAL_SAMPLES
          )
          right_target=right['target_min_error_attribution']
          right_source=right['source_min_error_attribution']
          right_target_min_parent_error_dominant=(
              abs(float(right_target['parent_hips_relative_error_m'])) >
              abs(float(right_target['parent_to_foot_relative_error_m']))
          )
          right_source_min_cancellation=(
              float(right_source['parent_hips_relative_error_m']) *
              float(right_source['parent_to_foot_relative_error_m']) < 0.0
          )
          right_target_min_reinforcement=(
              float(right_target['parent_hips_relative_error_m']) *
              float(right_target['parent_to_foot_relative_error_m']) > 0.0
          )
          left_control_final_aligned=abs(int(left['final_phase_delta_samples'])) <= PHASE_DIVERGENCE_MATERIAL_SAMPLES
          closure_ok=(
              abs(float(right_source['algebraic_closure_error_m'])) < 1e-5 and
              abs(float(right_target['algebraic_closure_error_m'])) < 1e-5
          )
          classification='parent_amplitude_error_unmasked_at_target_min' if (
              abs(int(right['final_phase_delta_samples'])) > PHASE_DIVERGENCE_MATERIAL_SAMPLES and
              right_trajectory_phase_aligned and
              right_target_min_parent_error_dominant and
              right_source_min_cancellation and
              right_target_min_reinforcement and
              left_control_final_aligned and
              closure_ok
          ) else 'unresolved'

          # Isolated diagnostic A/B: replace only the target RightLowerLeg Hips-relative
          # vertical parent term with the source parent term. Preserve the target
          # RightLowerLeg->RightFoot relative trajectory. Left side is untouched.
          rsp,rsr,rsf,rtp,rtr,rtf=right_series
          counterfactual_right=[rsp[i]+rtr[i] for i in range(120)]
          source_right_min=min_index(rsf)
          baseline_right_min=min_index(rtf)
          counterfactual_right_min=min_index(counterfactual_right)
          baseline_right_delta=circular_delta(baseline_right_min,source_right_min)
          counterfactual_right_delta=circular_delta(counterfactual_right_min,source_right_min)
          counterfactual_improves_phase=abs(counterfactual_right_delta) < abs(baseline_right_delta)
          counterfactual_reaches_non_material_phase=abs(counterfactual_right_delta) <= PHASE_DIVERGENCE_MATERIAL_SAMPLES
          counterfactual_left_control_non_regression=True
          parent_amplitude_counterfactual_ab={
              'method':'counterfactual_source_parent_plus_target_relative',
              'right_only':True,
              'left_target_untouched':True,
              'baseline_right_final_phase_delta_samples':baseline_right_delta,
              'counterfactual_right_final_phase_delta_samples':counterfactual_right_delta,
              'baseline_right_final_min_sample_index':baseline_right_min,
              'counterfactual_right_final_min_sample_index':counterfactual_right_min,
              'counterfactual_improves_phase':counterfactual_improves_phase,
              'counterfactual_reaches_non_material_phase':counterfactual_reaches_non_material_phase,
              'counterfactual_left_control_non_regression':counterfactual_left_control_non_regression,
              'diagnostic_only':True,
              'runtime_authorized':False,
          }

          evidence={
              'format':'grand-bruxelles-civ1-dynamic-chain-decomposition-v3',
              'sample_count':121,
              'dynamic_parent_child_decomposition':{
                  'LeftLowerLeg_to_LeftFoot':left,
                  'RightLowerLeg_to_RightFoot':right,
              },
              'right_trajectory_phase_aligned':right_trajectory_phase_aligned,
              'right_target_min_parent_error_dominant':right_target_min_parent_error_dominant,
              'right_source_min_cancellation':right_source_min_cancellation,
              'right_target_min_reinforcement':right_target_min_reinforcement,
              'left_control_final_aligned':left_control_final_aligned,
              'dynamic_decomposition_classification':classification,
              'parent_amplitude_counterfactual_ab':parent_amplitude_counterfactual_ab,
              'material_threshold_samples':PHASE_DIVERGENCE_MATERIAL_SAMPLES,
              'diagnostic_only':True,
              'runtime_authorized':False,
              'visual_approval_claimed':False,
          }
          Path('/tmp/civ1dynamic/evidence/dynamic-decomposition.json').write_text(json.dumps(evidence,indent=2)+'\n')

          assert left['source']['final_foot_vertical_min_sample_index']==119, left
          assert left['target']['final_foot_vertical_min_sample_index']==119, left
          assert right['source']['final_foot_vertical_min_sample_index']==59, right
          assert right['target']['final_foot_vertical_min_sample_index']==86, right
          assert int(right['final_phase_delta_samples'])==27, right
          assert right_trajectory_phase_aligned is True, right
          assert right_target_min_parent_error_dominant is True, right_target
          assert right_source_min_cancellation is True, right_source
          assert right_target_min_reinforcement is True, right_target
          assert left_control_final_aligned is True, left
          assert closure_ok is True, (right_source,right_target)
          assert classification=='parent_amplitude_error_unmasked_at_target_min'
          assert parent_amplitude_counterfactual_ab['right_only'] is True
          assert parent_amplitude_counterfactual_ab['left_target_untouched'] is True
          assert counterfactual_left_control_non_regression is True
          assert all(math.isfinite(float(v)) for v in counterfactual_right)

          print('dynamic_parent_child_decomposition',True)
          print('LeftLowerLeg_to_LeftFoot',left)
          print('RightLowerLeg_to_RightFoot',right)
          print('circular_phase_shift_samples',{
              'left_parent':left['parent_trajectory_phase_shift_samples'],
              'left_relative':left['relative_trajectory_phase_shift_samples'],
              'right_parent':right['parent_trajectory_phase_shift_samples'],
              'right_relative':right['relative_trajectory_phase_shift_samples'],
          })
          print('right_trajectory_phase_aligned',right_trajectory_phase_aligned)
          print('right_target_min_parent_error_dominant',right_target_min_parent_error_dominant)
          print('right_source_min_cancellation',right_source_min_cancellation)
          print('right_target_min_reinforcement',right_target_min_reinforcement)
          print('left_control_final_aligned',left_control_final_aligned)
          print('dynamic_decomposition_classification',classification)
          print('parent_amplitude_counterfactual_ab',parent_amplitude_counterfactual_ab)
          print('baseline_right_final_phase_delta_samples',baseline_right_delta)
          print('counterfactual_right_final_phase_delta_samples',counterfactual_right_delta)
          print('counterfactual_improves_phase',counterfactual_improves_phase)
          print('counterfactual_left_control_non_regression',counterfactual_left_control_non_regression)
          print('classification','diagnostic-only; RightFoot final contact shift is an amplitude/composition effect; isolated source-parent + target-relative A/B measures whether removing the parent amplitude error restores phase without mutating runtime')
          PY

      - name: Upload dynamic decomposition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-dynamic-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1dynamic/evidence/
          if-no-files-found: error
          retention-days: 14
