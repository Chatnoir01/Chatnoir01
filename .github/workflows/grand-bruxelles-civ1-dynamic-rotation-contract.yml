name: Grand Bruxelles CIV-1 Dynamic Rotation Contract

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py'
      - 'grand-bruxelles-game/tools/generate_civ1_dynamic_rotation_candidate.py'
      - 'grand-bruxelles-game/tests/test_civ1_dynamic_rotation_contract.py'
      - 'grand-bruxelles-game/tests/test_civ1_dynamic_rotation_generator.py'
      - '.github/workflows/grand-bruxelles-civ1-dynamic-rotation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
      - name: Provision pinned Python test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pytest
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest --version
      - name: Run dynamic rotation regressions
        run: |
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_dynamic_rotation_contract.py
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_dynamic_rotation_generator.py
      - name: Exercise deterministic candidate generation
        run: |
          tmp="$(mktemp)"
          python grand-bruxelles-game/tools/generate_civ1_dynamic_rotation_candidate.py "$tmp" --radius-samples 4 --peak-rotation-rad 0.20
          python grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py "$tmp" | tee /tmp/verdict.json
          grep -F 'REQUIRE_NATIVE_PHASE_AND_GROUNDING_MEASUREMENT' /tmp/verdict.json
      - name: Preserve no-promotion rails
        run: |
          grep -F 'runtime_authorized": False' grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py
          grep -F 'visual_approval_claimed": False' grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py
          grep -F 'candidate_is_native_measurement": False' grand-bruxelles-game/tools/generate_civ1_dynamic_rotation_candidate.py
          grep -F 'EXPECTED_CENTER_SAMPLE = 59' grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py
          grep -F 'EXPECTED_CYCLE_SAMPLE_COUNT = 120' grand-bruxelles-game/tools/assess_civ1_dynamic_rotation_contract.py
