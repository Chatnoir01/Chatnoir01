name: Grand Bruxelles CIV-1 External Resource Path Canonicality
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_external_resource_path_canonicality.py'
      - 'grand-bruxelles-game/tools/test_civ1_external_resource_path_canonicality.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - '.github/workflows/grand-bruxelles-civ1-external-resource-path-canonicality.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_external_resource_path_canonicality.py'
      - 'grand-bruxelles-game/tools/test_civ1_external_resource_path_canonicality.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - '.github/workflows/grand-bruxelles-civ1-external-resource-path-canonicality.yml'
permissions:
  contents: read
jobs:
  civ1-external-resource-path-canonicality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require current live main ancestry and Character QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce legacy single-path detour false positive and enforce canonical spelling
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/civ1_external_resource_path_canonicality.py --self-test
          python grand-bruxelles-game/tools/test_civ1_external_resource_path_canonicality.py
      - name: Measure reachable external resource path canonicality
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-external-path
          python grand-bruxelles-game/tools/civ1_external_resource_path_canonicality.py \
            grand-bruxelles-game/game/main.tscn \
            /tmp/civ1-external-path/civ1-external-resource-path-canonicality.json
      - name: Assert fail-closed canonical path contract
        run: |
          python - <<'PY'
          import json
          p='/tmp/civ1-external-path/civ1-external-resource-path-canonicality.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-external-resource-path-canonicality-v1'
          assert d['reachable_scene_count'] >= 1
          assert d['external_resource_path_canonicality_conflicts']==[]
          assert d['external_resource_paths_canonical'] is True
          assert d['single_detour_path_evidence_accepted'] is False
          assert d['dot_segment_path_evidence_accepted'] is False
          assert d['empty_segment_path_evidence_accepted'] is False
          assert d['backslash_path_evidence_accepted'] is False
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          assert d['contact_verified'] is False
          assert d['foot_slide_verified'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-external-resource-path-canonicality
          path: /tmp/civ1-external-path/civ1-external-resource-path-canonicality.json
          if-no-files-found: error
          retention-days: 14
