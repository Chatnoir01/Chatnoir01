name: Grand Bruxelles CIV-1 Foot Rotation Transition

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_right_downstream_transition.py'
      - 'grand-bruxelles-game/tools/analyze_civ1_downstream_contributions.py'
      - 'grand-bruxelles-game/tools/analyze_civ1_foot_rotation_transition.py'
      - 'grand-bruxelles-game/tools/analyze_civ1_foot_link_projection.py'
      - 'grand-bruxelles-game/tests/test_civ1_foot_rotation_transition.py'
      - 'grand-bruxelles-game/tests/test_civ1_foot_link_projection.py'
      - '.github/workflows/grand-bruxelles-civ1-foot-rotation-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foot-rotation-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression contract
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest -q \
            grand-bruxelles-game/tests/test_civ1_foot_rotation_transition.py \
            grand-bruxelles-game/tests/test_civ1_foot_link_projection.py
      - name: Prepare exact diagnostic sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1rot/{tools,source,evidence,engine}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1rot/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1rot/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1rot/tools/shadow.py
          python /tmp/civ1rot/tools/shadow.py /tmp/civ1rot/tools/base.gd /tmp/civ1rot/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1rot/source/body.glb
          test "$(stat -c '%s' /tmp/civ1rot/source/body.glb)" = 6879364
          python /tmp/civ1rot/tools/strip.py /tmp/civ1rot/source/body.glb /tmp/civ1rot/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1rot/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1rot/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1rot/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1rot/quaternius.zip -d /tmp/civ1rot/quaternius
          LICENSE_FILE="$(find /tmp/civ1rot/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"; grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1rot/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1rot/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1rot/godot.zip -d /tmp/civ1rot/engine
          GODOT_BIN=/tmp/civ1rot/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/civ1rot/evidence/godot-version.txt
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1rot/evidence/godot-version.txt
      - name: Measure native transition and isolate foot-link projection
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1rot/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else PROJECT_ROOT="$(find /tmp/civ1rot/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"; printf '[application]\nconfig/name="CIV1FootRotation"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1rot/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1rot/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1rot/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1rot/evidence/native.json 2>&1 | tee /tmp/civ1rot/evidence/native.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1rot/evidence/native.log
          python grand-bruxelles-game/tools/analyze_civ1_right_downstream_transition.py /tmp/civ1rot/evidence/native.json /tmp/civ1rot/evidence/transition.json | tee /tmp/civ1rot/evidence/transition.log
          grep -F CIV1_RIGHT_DOWNSTREAM_TRANSITION_OK /tmp/civ1rot/evidence/transition.log
          python grand-bruxelles-game/tools/analyze_civ1_downstream_contributions.py /tmp/civ1rot/evidence/native.json /tmp/civ1rot/evidence/contributions.json | tee /tmp/civ1rot/evidence/contributions.log
          grep -F CIV1_DOWNSTREAM_CONTRIBUTION_OK /tmp/civ1rot/evidence/contributions.log
          python grand-bruxelles-game/tools/analyze_civ1_foot_rotation_transition.py /tmp/civ1rot/evidence/native.json /tmp/civ1rot/evidence/foot-rotation.json | tee /tmp/civ1rot/evidence/foot-rotation.log
          grep -F CIV1_FOOT_ROTATION_TRANSITION_OK /tmp/civ1rot/evidence/foot-rotation.log
          python grand-bruxelles-game/tools/analyze_civ1_foot_link_projection.py /tmp/civ1rot/evidence/native.json /tmp/civ1rot/evidence/foot-link-projection.json | tee /tmp/civ1rot/evidence/foot-link-projection.log
          grep -F CIV1_FOOT_LINK_PROJECTION_OK /tmp/civ1rot/evidence/foot-link-projection.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-foot-rotation-transition-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1rot/evidence
          if-no-files-found: error
          retention-days: 14
