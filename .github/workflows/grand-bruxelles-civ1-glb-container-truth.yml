name: Grand Bruxelles CIV-1 GLB Container Truth
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_glb_container_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_glb_container_truth.py'
      - 'grand-bruxelles-game/assets/characters/**/*.glb'
      - '.github/workflows/grand-bruxelles-civ1-glb-container-truth.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_glb_container_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_glb_container_truth.py'
      - 'grand-bruxelles-game/assets/characters/**/*.glb'
      - '.github/workflows/grand-bruxelles-civ1-glb-container-truth.yml'
permissions:
  contents: read
jobs:
  civ1-glb-container-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require live-main ancestry and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game grand-bruxelles-game/assets grand-bruxelles-game/data grand-bruxelles-game/project.godot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce GLB integrity and role regression
        run: python grand-bruxelles-game/tools/test_civ1_glb_container_truth.py
      - name: Measure canonical Character GLB inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-glb-truth
          mapfile -d '' GLBS < <(find grand-bruxelles-game/assets/characters -type f -name '*.glb' -print0 2>/dev/null || true)
          python grand-bruxelles-game/tools/civ1_glb_container_truth.py "${GLBS[@]}" --out /tmp/civ1-glb-truth/civ1-glb-container-truth.json
      - name: Assert fail-closed current production truth
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/civ1-glb-truth/civ1-glb-container-truth.json', encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-glb-container-truth-v4'
          assert d['player_reuse_as_roster_forbidden'] is True
          assert d['role_inference_forbidden'] is True
          assert d['civilian_police_roster_candidate_count'] == 0
          assert d['roster_authorized'] is False
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-glb-container-truth
          path: /tmp/civ1-glb-truth/civ1-glb-container-truth.json
