name: Grand Bruxelles CIV-1 Global Chain Diagnostic

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd"
      - "grand-bruxelles-game/tests/test_civ1_native_retarget_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-global-chain-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-chain-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_native_retarget_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1global/source /tmp/civ1global/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1global/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1global/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1global/source/vitruvian_body.glb /tmp/civ1global/source/civ1_body.glb --require-animations | tee /tmp/civ1global/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1global/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1global/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1global/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1global/quaternius
          unzip -q /tmp/civ1global/quaternius.zip -d /tmp/civ1global/quaternius
          LICENSE_FILE="$(find /tmp/civ1global/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1global/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1global/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1global/engine
          GODOT_BIN=/tmp/civ1global/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1global/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1global/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact source and target then capture model-space chains
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1global/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1global/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1GlobalChainDiagnostic"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1global/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_global_chain_diagnostic.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1global/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_diagnostic.gd -- /tmp/civ1global/evidence/global-chain.json 2>&1 | tee /tmp/civ1global/evidence/probe.log
          grep -Fq 'CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK' /tmp/civ1global/evidence/probe.log

      - name: Validate fail-closed model-space evidence
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1global/evidence/classification.log
          import json, math
          from pathlib import Path

          PHASE_DIVERGENCE_MATERIAL_SAMPLES = 12
          p=json.loads(Path('/tmp/civ1global/evidence/global-chain.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-civ1-global-chain-diagnostic-v2'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['source_animation']=='UAL1_Standard/Sprint'
          assert p['sample_count']==121
          assert p['retarget_modifier']=='RetargetModifier3D'
          assert p['use_global_pose'] is False
          assert p['position_enabled'] is False and p['rotation_enabled'] is True and p['scale_enabled'] is False
          required=('Hips','LeftUpperLeg','LeftLowerLeg','LeftFoot','RightUpperLeg','RightLowerLeg','RightFoot')
          phase_bones=('LeftUpperLeg','LeftLowerLeg','LeftFoot','RightUpperLeg','RightLowerLeg','RightFoot')
          assert set(p['diagnostic_bones'])==set(required)
          samples=p['model_space_samples']
          assert len(samples)==121
          source_keys={'model_origin','model_rotation_xyzw','source_motion_from_rest','source_hips_relative_origin'}
          target_keys={'model_origin','model_rotation_xyzw','target_motion_from_rest','target_hips_relative_origin'}
          for i,sample in enumerate(samples):
              assert sample['sample_index']==i
              assert math.isfinite(float(sample['time_s']))
              assert set(sample['bones'])==set(required)
              for bone in required:
                  pair=sample['bones'][bone]
                  assert set(pair['source'])==source_keys, (i,bone,'source',pair['source'].keys())
                  assert set(pair['target'])==target_keys, (i,bone,'target',pair['target'].keys())
                  for side in ('source','target'):
                      record=pair[side]
                      for key,value in record.items():
                          if isinstance(value,list):
                              assert value and all(math.isfinite(float(x)) for x in value), (i,bone,side,key,value)
          for foot in ('LeftFoot','RightFoot'):
              for side,key in (('source','source_motion_from_rest'),('target','target_motion_from_rest')):
                  vectors=[s['bones'][foot][side][key] for s in samples]
                  span=max(math.sqrt(sum(float(x)*float(x) for x in v)) for v in vectors)
                  assert span > 0.05, (foot,side,span)

          phase=p['phase_vertical_summary']
          assert phase['material_threshold_samples']==PHASE_DIVERGENCE_MATERIAL_SAMPLES
          per_bone=phase['per_bone']
          assert set(per_bone)==set(phase_bones)
          first=''
          for bone in phase_bones:
              row=per_bone[bone]
              for key in ('source_vertical_min_sample_index','target_vertical_min_sample_index','phase_delta_samples','phase_delta_seconds','material_phase_divergence'):
                  assert key in row, (bone,key,row)
              assert 0 <= int(row['source_vertical_min_sample_index']) < 120
              assert 0 <= int(row['target_vertical_min_sample_index']) < 120
              assert abs(int(row['phase_delta_samples'])) <= 60
              assert math.isfinite(float(row['phase_delta_seconds']))
              expected=abs(int(row['phase_delta_samples'])) > PHASE_DIVERGENCE_MATERIAL_SAMPLES
              assert row['material_phase_divergence'] is expected
              if not first and expected:
                  first=bone
          assert first == 'RightFoot', (first,per_bone)
          assert phase['first_material_divergence_joint']==first
          assert p['first_material_divergence_joint']==first
          right=per_bone['RightFoot']
          assert int(right['source_vertical_min_sample_index'])==59, right
          assert int(right['target_vertical_min_sample_index'])==86, right
          assert int(right['phase_delta_samples'])==27, right
          assert abs(float(right['phase_delta_seconds'])-0.15) < 0.002, right
          for bone in ('LeftUpperLeg','LeftLowerLeg','LeftFoot','RightUpperLeg','RightLowerLeg'):
              assert abs(int(per_bone[bone]['phase_delta_samples'])) <= PHASE_DIVERGENCE_MATERIAL_SAMPLES, (bone,per_bone[bone])

          assert p['diagnostic_only'] is True
          assert p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False
          print('global_chain_sample_count',len(samples))
          print('global_chain_motion_nonzero',True)
          print('first_material_divergence_joint',first)
          print('right_foot_phase_delta_samples',right['phase_delta_samples'])
          print('right_foot_phase_delta_seconds',right['phase_delta_seconds'])
          print('classification','diagnostic-only; RightFoot is first material model-space vertical phase divergence')
          PY

      - name: Upload model-space chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-global-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1global/evidence/
          if-no-files-found: error
          retention-days: 14
