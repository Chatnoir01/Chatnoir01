name: Grand Bruxelles CIV-1 Ground Contact Reference
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_ground_contact_reference_classifier.py'
      - 'grand-bruxelles-game/tests/test_civ1_ground_contact_reference_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-ground-contact-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run causal contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ground/{replay,skeleton,out}
          python grand-bruxelles-game/tests/test_civ1_ground_contact_reference_contract.py 2>&1 | tee /tmp/civ1ground/out/causal-contract.log
      - name: Acquire immutable GREEN replay and Skeleton evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/10034260492/zip" -o /tmp/civ1ground/replay.zip
          echo 'dc002f0dfd2072043af5ccb2496fec86b311480a0e2be445fcb9d11e5fb4b4e3  /tmp/civ1ground/replay.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/9996432028/zip" -o /tmp/civ1ground/skeleton.zip
          echo '9b4dd309157ce1f3e5aae44125f5931fac409238eece1a0632b8ad07933ebb00  /tmp/civ1ground/skeleton.zip' | sha256sum -c -
          unzip -q /tmp/civ1ground/replay.zip -d /tmp/civ1ground/replay
          unzip -q /tmp/civ1ground/skeleton.zip -d /tmp/civ1ground/skeleton
          REPLAY=$(find /tmp/civ1ground/replay -name skinned-replay.json -print -quit)
          LANDMARK=$(find /tmp/civ1ground/skeleton -name rightfoot-landmark-witness.json -print -quit)
          FIXED=$(find /tmp/civ1ground/skeleton -name fixed-length.json -print -quit)
          test -n "$REPLAY" -a -n "$LANDMARK" -a -n "$FIXED"
          cp "$REPLAY" /tmp/civ1ground/replay.json
          cp "$LANDMARK" /tmp/civ1ground/landmark.json
          cp "$FIXED" /tmp/civ1ground/fixed-length.json
      - name: Classify canonical ground/contact readiness without threshold rescue
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/civ1_ground_contact_reference_classifier.py \
            /tmp/civ1ground/replay.json /tmp/civ1ground/landmark.json /tmp/civ1ground/fixed-length.json \
            /tmp/civ1ground/out/ground-contact-reference.json \
            2>&1 | tee /tmp/civ1ground/out/classifier.log
          grep -F CIV1_GROUND_CONTACT_OK /tmp/civ1ground/out/classifier.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1ground/out/ground-contact-reference.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-ground-contact-reference-v1'
          assert r['replay_samples']==[68,69,70,71]
          assert r['fixed_vertex_count']==3306
          assert r['stable_replay_sample_count']>=3
          assert r['source_ground_node']=='Ground'
          assert r['source_ground_reference_present'] is True
          assert r['canonical_ground_reference_ready'] is False
          assert r['landmark_samples']==[114,115,116,117,118]
          assert r['overlapping_replay_landmark_samples']==[]
          assert r['same_sample_contact_evidence'] is False
          assert r['contact_gate_candidate_present'] is True
          assert r['grounding_verified'] is False
          assert r['planted_contact_claimed'] is False
          assert r['contact_phase_ready'] is False
          assert r['quantitative_foot_slide_candidate'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_GROUND_CONTACT_RECEIPT_OK blockers=', len(r['blockers']))
          PY
      - name: Upload immutable ground/contact readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-ground-contact-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1ground/out
          if-no-files-found: error
          retention-days: 90
