name: Grand Bruxelles CIV-1 Ground Geometry Phase Minima
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_ground_geometry_phase_minima.py'
      - 'grand-bruxelles-game/tests/test_civ1_ground_geometry_phase_minima_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-ground-geometry-phase-minima.yml'
permissions:
  contents: read
  actions: read
jobs:
  ground-geometry-phase-minima:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "1a2210270477f3e20b5127a42a7b3e13000a624c"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare immutable run context
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1phase/out
          {
            echo "validated_main=1a2210270477f3e20b5127a42a7b3e13000a624c"
            echo "head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "ground_geometry_artifact=10055323961"
            echo "ground_geometry_digest=sha256:bcdd5ffde1306b62779f7439a0dcf866b0d045bd8f682f0fe9990a77883bee47"
          } > /tmp/civ1phase/out/run-context.txt
      - name: Run phase-minima contract
        run: python grand-bruxelles-game/tests/test_civ1_ground_geometry_phase_minima_contract.py
      - name: Acquire immutable GREEN Ground geometry witness
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1phase/input
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$api/10055323961/zip" -o /tmp/civ1phase/ground-geometry.zip
          echo 'bcdd5ffde1306b62779f7439a0dcf866b0d045bd8f682f0fe9990a77883bee47  /tmp/civ1phase/ground-geometry.zip' | sha256sum -c -
          unzip -q /tmp/civ1phase/ground-geometry.zip -d /tmp/civ1phase/input
          cp "$(find /tmp/civ1phase/input -name ground-geometry-windows.json -print -quit)" /tmp/civ1phase/ground-geometry-windows.json
      - name: Classify exact local geometry minima without contact promotion
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/civ1_ground_geometry_phase_minima.py /tmp/civ1phase/ground-geometry-windows.json /tmp/civ1phase/out/ground-geometry-phase-minima.json | tee /tmp/civ1phase/out/classifier.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1phase/out/ground-geometry-phase-minima.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-ground-geometry-phase-minima-v1'
          assert r['fixed_vertex_count']==3306
          assert r['local_minimum_indices']==[25,44,59,67,72]
          assert r['lowest_candidate_sample_index']==72
          assert r['lowest_candidate_window']==[71,72,73]
          assert r['kinematic_geometry_phase_candidate_only'] is True
          assert r['canonical_character_placement_available'] is False
          assert r['ground_contact_classifiable'] is False
          assert r['contact_proof_claimed'] is False
          assert r['planted_interval_claimable'] is False
          assert r['quantitative_foot_slide_candidate'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_GROUND_GEOMETRY_PHASE_MINIMA_RECEIPT_OK', r['local_minimum_indices'], r['lowest_candidate_sample_index'])
          PY
      - name: Upload immutable geometry phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-ground-geometry-phase-minima-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1phase/out
          if-no-files-found: error
          retention-days: 90
