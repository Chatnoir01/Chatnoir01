name: Grand Bruxelles CIV-1 Grounding Readiness

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd"
      - "grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd"
      - "grand-bruxelles-game/tools/build_civ1_right_foot_grounded_candidate.py"
      - "grand-bruxelles-game/tests/test_civ1_grounding_readiness_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-grounding-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grounding-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_grounding_readiness_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ground/source /tmp/civ1ground/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1ground/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1ground/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1ground/source/vitruvian_body.glb /tmp/civ1ground/source/civ1_body.glb --require-animations | tee /tmp/civ1ground/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1ground/source/civ1_body.glb' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1ground/source/civ1_body.glb)" = "6780124"

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1ground/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1ground/quaternius.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1ground/quaternius.zip)" = "38687957"
          mkdir -p /tmp/civ1ground/quaternius
          unzip -q /tmp/civ1ground/quaternius.zip -d /tmp/civ1ground/quaternius
          LICENSE_FILE="$(find /tmp/civ1ground/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1ground/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1ground/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1ground/engine
          GODOT_BIN=/tmp/civ1ground/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1ground/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1ground/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Build selected alpha 0.75 candidate
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/build_civ1_right_foot_grounded_candidate.py \
            grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd \
            /tmp/civ1ground/gb_civ1_grounded_candidate.gd | tee /tmp/civ1ground/evidence/candidate-build.log
          grep -Fq 'CIV1_RIGHT_FOOT_GROUNDED_CANDIDATE_BUILT alpha=0.75' /tmp/civ1ground/evidence/candidate-build.log

      - name: Import once and capture native plus selected candidate kinematics
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1ground/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1ground/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1GroundingReadiness"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1ground/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd "$PROJECT_ROOT/gb_civ1_native_retarget.gd"
          cp /tmp/civ1ground/gb_civ1_grounded_candidate.gd "$PROJECT_ROOT/gb_civ1_normalized_retarget.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1ground/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_native_retarget.gd -- /tmp/civ1ground/evidence/baseline-native.json 2>&1 | tee /tmp/civ1ground/evidence/baseline-probe.log
          grep -Fq 'CIV1_NATIVE_RETARGET_OK' /tmp/civ1ground/evidence/baseline-probe.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_normalized_retarget.gd -- /tmp/civ1ground/evidence/normalized-native.json 2>&1 | tee /tmp/civ1ground/evidence/normalized-probe.log
          grep -Fq 'CIV1_RIGHT_FOOT_REFERENCE_AB_OK' /tmp/civ1ground/evidence/normalized-probe.log

      - name: Classify source-relative support-plane and no-foot-slide readiness
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1ground/evidence/grounding-readiness.log
          import json
          from pathlib import Path
          baseline=json.loads(Path('/tmp/civ1ground/evidence/baseline-native.json').read_text())
          p=json.loads(Path('/tmp/civ1ground/evidence/normalized-native.json').read_text())
          SAMPLE_COUNT = p['sample_count']; SUPPORT_BAND_FRACTION = p['support_band_fraction']
          assert SAMPLE_COUNT == 121
          assert SUPPORT_BAND_FRACTION == 0.10
          assert p['format']=='grand-bruxelles-civ1-right-foot-reference-ab-v4'
          assert p['source_animation']==baseline['source_animation']=='UAL1_Standard/Sprint'
          assert p['reference_normalization_method']=='source_global_reference_direction_y_blend_preserve_target_length'
          assert abs(float(p['target_right_foot_y_blend_alpha'])-0.75) < 1e-9
          assert p['reference_normalization_applied'] is True
          assert p['pose_reset_applied'] is True
          assert p['target_right_foot_length_preserved'] is True
          # This is a source-calibrated kinematic support plane, not a claim that
          # skeleton-local Y equals the loaded-world ground. It deliberately uses
          # the same 10% low-height band already frozen by the retarget bench.
          source_right=p['source_right_support_candidate']; normalized_right=p['target_right_support_candidate']; baseline_right=baseline['target_right_support_candidate']
          source_plane_y=float(source_right['low_height_threshold_y']); normalized_plane_y=float(normalized_right['low_height_threshold_y']); baseline_plane_y=float(baseline_right['low_height_threshold_y'])
          source_relative_plane_error_m=abs(normalized_plane_y-source_plane_y); normalized_plane_error_m=source_relative_plane_error_m; baseline_plane_error_m=abs(baseline_plane_y-source_plane_y)
          plane_error_improves_over_native=normalized_plane_error_m <= baseline_plane_error_m
          # No invented m/s tolerance: the authored source motion is the parity
          # target. The candidate must be no worse at both median and p90 while
          # low, and must not invent an extra support window. Secondary support
          # windows are measured, never discarded.
          source_parity_no_foot_slide=(float(normalized_right['median_horizontal_speed_mps']) <= float(source_right['median_horizontal_speed_mps']) and float(normalized_right['p90_horizontal_speed_mps']) <= float(source_right['p90_horizontal_speed_mps']))
          no_secondary_support_window=len(normalized_right['low_height_windows']) <= len(source_right['low_height_windows'])
          grounding_readiness_pass=(plane_error_improves_over_native and source_parity_no_foot_slide and no_secondary_support_window)
          result={'format':'grand-bruxelles-civ1-grounding-readiness-v2','sample_count':SAMPLE_COUNT,'support_band_fraction':SUPPORT_BAND_FRACTION,'selected_y_blend_alpha':0.75,'support_plane_definition':'source RightFoot low-height threshold in shared retarget bench coordinates; kinematic proxy only','source_plane_y':source_plane_y,'baseline_plane_y':baseline_plane_y,'normalized_plane_y':normalized_plane_y,'source_relative_plane_error_m':source_relative_plane_error_m,'baseline_plane_error_m':baseline_plane_error_m,'normalized_plane_error_m':normalized_plane_error_m,'plane_error_improves_over_native':plane_error_improves_over_native,'source_median_horizontal_speed_mps':source_right['median_horizontal_speed_mps'],'normalized_median_horizontal_speed_mps':normalized_right['median_horizontal_speed_mps'],'source_p90_horizontal_speed_mps':source_right['p90_horizontal_speed_mps'],'normalized_p90_horizontal_speed_mps':normalized_right['p90_horizontal_speed_mps'],'source_low_height_windows':source_right['low_height_windows'],'normalized_low_height_windows':normalized_right['low_height_windows'],'source_parity_no_foot_slide':source_parity_no_foot_slide,'no_secondary_support_window':no_secondary_support_window,'grounding_readiness_pass':grounding_readiness_pass,'diagnostic_only':True,'world_ground_assumed':False,'grounding_verified':False,'foot_slide_verified':False,'runtime_authorized':False,'visual_approval_claimed':False}
          Path('/tmp/civ1ground/evidence/grounding-readiness.json').write_text(json.dumps(result,indent=2)+'\n')
          assert p['diagnostic_only'] is True
          assert p['world_ground_assumed'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False
          print(json.dumps(result,indent=2))
          assert grounding_readiness_pass is True
          PY

      - name: Upload grounding readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-grounding-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1ground/evidence/
          if-no-files-found: error
          retention-days: 14
