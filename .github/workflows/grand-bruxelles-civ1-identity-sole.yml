name: Grand Bruxelles CIV-1 Identity Sole Tracker
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_identity_preserving_sole.py'
      - 'grand-bruxelles-game/tests/test_civ1_identity_preserving_sole.py'
      - '.github/workflows/grand-bruxelles-civ1-identity-sole.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  identity-sole:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression contract
        run: python grand-bruxelles-game/tests/test_civ1_identity_preserving_sole.py
      - name: Download pinned real 2-4-8m raster evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-identity
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9978712035/zip" \
            -o /tmp/civ1-identity/evidence.zip
          unzip -q /tmp/civ1-identity/evidence.zip -d /tmp/civ1-identity/evidence
          CAPTURE="$(find /tmp/civ1-identity/evidence -type f -name 'civ1-distance-2m-115.png' -print -quit)"
          test -n "$CAPTURE"
          CAPTURE_DIR="$(dirname "$CAPTURE")"
          for d in 2 4 8; do
            for s in 115 116 117 118; do
              test -f "$CAPTURE_DIR/civ1-distance-${d}m-${s}.png"
            done
          done
          echo "CAPTURE_DIR=$CAPTURE_DIR" >> "$GITHUB_ENV"
      - name: Analyze same-foot identity across distances
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/analyze_civ1_identity_preserving_sole.py \
            "$CAPTURE_DIR" /tmp/civ1-identity/identity-sole.json
          python - <<'PY'
          import json
          p='/tmp/civ1-identity/identity-sole.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='grand-bruxelles-civ1-identity-preserving-sole-v1'
          assert r['distances_m']==[2,4,8]
          assert r['samples']==[115,116,117,118]
          assert r['perceptual_2_8m_claimed'] is False
          assert r['planted_contact_claimed'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_IDENTITY_SOLE_RECEIPT_OK', r['calibration'], 'qualified_8m=', r['qualified_8m_recovery'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-identity-sole-evidence
          path: /tmp/civ1-identity/identity-sole.json
          if-no-files-found: warn
