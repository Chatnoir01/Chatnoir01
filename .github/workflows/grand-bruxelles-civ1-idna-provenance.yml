name: Grand Bruxelles CIV-1 IDNA Provenance
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_roster_registration_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_roster_idna_host.py'
      - '.github/workflows/grand-bruxelles-civ1-idna-provenance.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_roster_registration_truth.py'
      - 'grand-bruxelles-game/tools/test_civ1_roster_idna_host.py'
      - '.github/workflows/grand-bruxelles-civ1-idna-provenance.yml'
permissions:
  contents: read
jobs:
  idna-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require live-main ancestry and Character-QA-only scope
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game grand-bruxelles-game/data grand-bruxelles-game/project.godot
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run IDNA provenance regression
        run: python grand-bruxelles-game/tools/test_civ1_roster_idna_host.py
