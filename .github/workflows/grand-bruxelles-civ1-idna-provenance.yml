name: Grand Bruxelles CIV-1 IDNA Provenance
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_idna_provenance.py'
      - 'grand-bruxelles-game/tools/test_civ1_roster_idna_host.py'
      - 'grand-bruxelles-game/qa/civ1_roster_registry.json'
      - '.github/workflows/grand-bruxelles-civ1-idna-provenance.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_idna_provenance.py'
      - 'grand-bruxelles-game/tools/test_civ1_roster_idna_host.py'
      - 'grand-bruxelles-game/qa/civ1_roster_registry.json'
      - '.github/workflows/grand-bruxelles-civ1-idna-provenance.yml'
permissions:
  contents: read
jobs:
  idna-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require live-main ancestry and Character-QA-only scope
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game grand-bruxelles-game/data grand-bruxelles-game/project.godot
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run IDNA provenance regression
        run: python grand-bruxelles-game/tools/test_civ1_roster_idna_host.py
      - name: Inspect registered provenance hosts
        run: |
          mkdir -p /tmp/civ1-idna-provenance
          python grand-bruxelles-game/tools/civ1_idna_provenance.py grand-bruxelles-game/qa/civ1_roster_registry.json --out /tmp/civ1-idna-provenance/civ1-idna-provenance.json
      - name: Assert production truth
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/civ1-idna-provenance/civ1-idna-provenance.json',encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-idna-provenance-v1'
          assert d['blocking_reasons']==[]
          assert d['registration_count']==0 and d['invalid_count']==0
          assert d['source_url_idna_alabel_roundtrip_required'] is True
          assert d['runtime_authorized'] is False and d['visual_approval_claimed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-idna-provenance
          path: /tmp/civ1-idna-provenance/civ1-idna-provenance.json
