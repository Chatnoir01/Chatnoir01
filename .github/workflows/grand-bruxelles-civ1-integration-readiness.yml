name: Grand Bruxelles CIV-1 Integration Readiness
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_integration_readiness.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - 'grand-bruxelles-game/game/scripts/npc_agent.gd'
      - '.github/workflows/grand-bruxelles-civ1-integration-readiness.yml'
permissions:
  contents: read
jobs:
  civ1-integration-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live main and QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "b12c3cfaccdb5536ba79418cc2a469787da14730"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- \
            grand-bruxelles-game/game/main.tscn \
            grand-bruxelles-game/game/scripts \
            grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject token-only, disconnected and unreachable scene evidence
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/civ1_integration_readiness.py --self-test
      - name: Measure canonical reachable integration readiness
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-readiness
          python grand-bruxelles-game/tools/civ1_integration_readiness.py \
            grand-bruxelles-game/game/main.tscn \
            grand-bruxelles-game/game/scripts/npc_agent.gd \
            /tmp/civ1-readiness/civ1-integration-readiness.json
      - name: Assert fail-closed evidence
        run: |
          python - <<'PY'
          import json
          p='/tmp/civ1-readiness/civ1-integration-readiness.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-integration-readiness-v3'
          assert d['evidence_mode']=='reachable_packed_scene_graph'
          assert d['token_only_evidence_accepted'] is False
          assert d['declared_but_uninstanced_scene_evidence_accepted'] is False
          assert d['reachable_scene_count'] >= 1
          assert d['player_character_reuse_detected'] is False
          assert d['procedural_cube_fallback_detected'] is False
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          assert d['contact_verified'] is False
          assert d['foot_slide_verified'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-integration-readiness
          path: /tmp/civ1-readiness/civ1-integration-readiness.json
