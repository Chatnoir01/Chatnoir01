name: Grand Bruxelles CIV-1 Left Ground Reference
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/godot_civ1_left_ground_reference_witness.gd'
      - 'grand-bruxelles-game/tools/validate_civ1_sole_proxy_report.py'
      - 'grand-bruxelles-game/tools/analyze_civ1_rendered_sole_capture.py'
      - 'grand-bruxelles-game/tools/correlate_civ1_rendered_sole_motion.py'
      - 'grand-bruxelles-game/tests/test_civ1_left_ground_reference_witness_contract.py'
      - 'grand-bruxelles-game/tests/test_civ1_sole_proxy_report_validator.py'
      - 'grand-bruxelles-game/tests/test_civ1_rendered_sole_capture_analyzer.py'
      - 'grand-bruxelles-game/tests/test_civ1_rendered_sole_motion_correlation.py'
      - '.github/workflows/grand-bruxelles-civ1-left-ground-reference.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  left-ground-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression contract
        run: |
          python grand-bruxelles-game/tests/test_civ1_left_ground_reference_witness_contract.py
          python grand-bruxelles-game/tests/test_civ1_sole_proxy_report_validator.py
          python grand-bruxelles-game/tests/test_civ1_rendered_sole_capture_analyzer.py
          python grand-bruxelles-game/tests/test_civ1_rendered_sole_motion_correlation.py
      - name: Prepare pinned sources and proven bundle tooling
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ground/{tools,source,evidence,engine,captures}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          SELECT_REF=a9ac6276c5ff69927e4d4212efc4f1aff2bb21ac
          FIXED_REF=cdbe1814886aefa81a95acbb43e3e2cb9289284f
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1ground/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1ground/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1ground/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SELECT_REF/grand-bruxelles-game/tools/select_quaternius_project.py" -o /tmp/civ1ground/tools/select.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/analyze_civ1_fixed_length_reconstruction.py" -o /tmp/civ1ground/tools/analyze.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/build_civ1_skeleton_witness_bundle.py" -o /tmp/civ1ground/tools/bundle.py
          sed -i 's#HERE / "analyze_civ1_fixed_length_reconstruction.py"#HERE / "analyze.py"#' /tmp/civ1ground/tools/bundle.py
          python /tmp/civ1ground/tools/shadow.py /tmp/civ1ground/tools/base.gd /tmp/civ1ground/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1ground/source/body.glb
          test "$(stat -c '%s' /tmp/civ1ground/source/body.glb)" = 6879364
          python /tmp/civ1ground/tools/strip.py /tmp/civ1ground/source/body.glb /tmp/civ1ground/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1ground/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_head.glb -o /tmp/civ1ground/source/vitruvian_head.glb
          test "$(stat -c '%s' /tmp/civ1ground/source/vitruvian_head.glb)" = 10189832
          echo '54efb42e9f3dd7e7cf3c3e86ed5298f3ba26e341d5743245cbe2621c547c5f1f  /tmp/civ1ground/source/vitruvian_head.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1ground/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1ground/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1ground/quaternius.zip -d /tmp/civ1ground/quaternius
          L="$(find /tmp/civ1ground/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$L"; grep -Eqi 'cc0|creative commons zero' "$L"
          python /tmp/civ1ground/tools/select.py /tmp/civ1ground/quaternius | tee /tmp/civ1ground/evidence/project-root.txt
          PROJECT_ROOT="$(cat /tmp/civ1ground/evidence/project-root.txt)"
          if [ ! -f "$PROJECT_ROOT/project.godot" ]; then printf '[application]\nconfig/name="CIV1GroundReference"\n[display]\nwindow/size/viewport_width=1280\nwindow/size/viewport_height=720\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1ground/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1ground/source/vitruvian_head.glb "$PROJECT_ROOT/vitruvian_head.glb"
          cp /tmp/civ1ground/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1ground/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1ground/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1ground/godot.zip -d /tmp/civ1ground/engine
          chmod +x /tmp/civ1ground/engine/Godot_v4.7.1-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/civ1ground/engine/Godot_v4.7.1-stable_linux.x86_64' >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild proven 120-frame bundle
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1ground/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1ground/evidence/native.json 2>&1 | tee /tmp/civ1ground/evidence/native.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1ground/evidence/native.log
          python /tmp/civ1ground/tools/analyze.py /tmp/civ1ground/evidence/native.json /tmp/civ1ground/evidence/fixed-length.json | tee /tmp/civ1ground/evidence/fixed-length.log
          grep -F 'verdict=AMELIORER_FIXED_LENGTH_CONTINUOUS_CYCLE' /tmp/civ1ground/evidence/fixed-length.log
          python /tmp/civ1ground/tools/bundle.py /tmp/civ1ground/evidence/native.json /tmp/civ1ground/evidence/fixed-length.json /tmp/civ1ground/evidence/skeleton-bundle.json | tee /tmp/civ1ground/evidence/bundle.log
          grep -F CIV1_SKELETON_WITNESS_BUNDLE_OK /tmp/civ1ground/evidence/bundle.log
      - name: Prepare canonical project witness sandbox
        run: |
          set -euo pipefail
          CANONICAL_PROJECT=/tmp/civ1ground/canonical-project
          cp -a grand-bruxelles-game "$CANONICAL_PROJECT"
          cat > "$CANONICAL_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="CIV1CanonicalGroundWitness"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [physics]
          3d/default_gravity=9.8
          common/physics_ticks_per_second=60
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/civ1ground/source/civ1_body.glb "$CANONICAL_PROJECT/civ1_body.glb"
          cp /tmp/civ1ground/source/vitruvian_head.glb "$CANONICAL_PROJECT/vitruvian_head.glb"
          cp grand-bruxelles-game/tools/godot_civ1_left_ground_reference_witness.gd "$CANONICAL_PROJECT/gb_left_ground.gd"
          "$GODOT_BIN" --headless --editor --path "$CANONICAL_PROJECT" --quit 2>&1 | tee /tmp/civ1ground/evidence/canonical-import.log
          echo "CANONICAL_PROJECT=$CANONICAL_PROJECT" >> "$GITHUB_ENV"
      - name: Render low side-view canonical Ground sole proxy
        run: |
          set -euo pipefail
          command -v xvfb-run
          xvfb-run -a "$GODOT_BIN" --path "$CANONICAL_PROJECT" --resolution 1280x720 --script res://gb_left_ground.gd -- /tmp/civ1ground/evidence/skeleton-bundle.json /tmp/civ1ground/evidence/left-ground-reference.json /tmp/civ1ground/captures 2>&1 | tee /tmp/civ1ground/evidence/left-ground-reference.log
          grep -F CIV1_LEFT_GROUND_REFERENCE_OK /tmp/civ1ground/evidence/left-ground-reference.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1ground/evidence/left-ground-reference.json').read_text())
          assert p['schema']=='grand-bruxelles-civ1-left-ground-reference-v3'
          assert p['ground_contact_claimed'] is False and p['rendered_sole_contact_claimed'] is False
          assert p['sole_proxy_semantic']=='left_foot_bone_oriented_kinematic_proxy_not_rendered_mesh'
          assert p['reference_is_external_scene_ground'] is True
          assert p['reference_semantic']=='canonical_main_ground_collision_raycast'
          assert p['source_scene']=='res://game/main.tscn' and p['source_ground_node']=='Ground'
          assert p['ground_use_collision'] is True and abs(p['ground_top_y_m']-(-0.03))<=1e-6
          assert p['camera_semantic']=='low_side_contact_view_tracks_placement_y'
          assert p['target_left_candidate_samples']==[115,116,117,118]
          assert p['runtime_authorized'] is False and p['visual_approval_claimed'] is False and p['player_view_claimed'] is False
          assert p['resolution']==[1280,720]
          assert p['max_pose_origin_error_m']<=1e-4 and p['max_head_follow_error_m']<=1e-4
          assert p['verdict']=='AMELIORER_CANONICAL_GROUND_SOLE_PROXY_CONTACT_UNPROVEN'
          assert p['candidate_sole_proxy_horizontal_path_m']>=0.0
          assert {114,115,116,117,118,119}.issubset({c['sample_index'] for c in p['captures']})
          for c in p['captures']:
              assert c['view']=='low_side_contact' and Path(c['png']).is_file()
          for s in p['samples']:
              assert s['left_collider_name']=='CanonicalMainGround'
              assert s['right_collider_name']=='CanonicalMainGround'
              assert s['sole_proxy_collider_name']=='CanonicalMainGround'
          PY
      - name: Correlate real raster with canonical-ground world motion
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/validate_civ1_sole_proxy_report.py /tmp/civ1ground/evidence/left-ground-reference.json
          python grand-bruxelles-game/tools/analyze_civ1_rendered_sole_capture.py /tmp/civ1ground/captures /tmp/civ1ground/evidence/rendered-sole-raster.json
          python grand-bruxelles-game/tools/correlate_civ1_rendered_sole_motion.py /tmp/civ1ground/evidence/rendered-sole-raster.json /tmp/civ1ground/evidence/left-ground-reference.json /tmp/civ1ground/evidence/rendered-sole-world-correlation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1ground/evidence/rendered-sole-world-correlation.json').read_text())
          assert p['schema']=='grand-bruxelles-civ1-rendered-sole-world-correlation-v1'
          assert p['candidate_samples']==[115,116,117,118]
          assert p['world_horizontal_path_m']>=0.0 and p['raster_centroid_path_px']>=0.0
          assert p['calibrated_player_distance_m'] is None
          assert p['perceptual_2_8m_claimed'] is False
          assert p['planted_contact_claimed'] is False and p['rendered_sole_contact_claimed'] is False
          assert p['ground_contact_claimed'] is False and p['runtime_authorized'] is False
          assert p['animation_correction_authorized'] is False
          assert p['visual_approval_claimed'] is False and p['player_view_claimed'] is False
          assert p['verdict']=='AMELIORER_MOTION_CORRELATED_PLAYER_DISTANCE_UNCALIBRATED'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-left-ground-reference-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/civ1ground/evidence
            /tmp/civ1ground/captures
          if-no-files-found: error
          retention-days: 14
