name: Grand Bruxelles CIV-1 LeftFoot Contact Raster
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/patch_civ1_leftfoot_contact_raster_samples.py'
      - 'grand-bruxelles-game/tests/test_civ1_leftfoot_contact_raster_samples.py'
      - '.github/workflows/grand-bruxelles-civ1-leftfoot-contact-raster.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  leftfoot-contact-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Causal regression
        run: python grand-bruxelles-game/tests/test_civ1_leftfoot_contact_raster_samples.py
      - name: Prepare pinned CIV-1 reconstruction sources and Godot 4.7.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1contactraster/{tools,source,evidence,engine,captures,out}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          SELECT_REF=a9ac6276c5ff69927e4d4212efc4f1aff2bb21ac
          FIXED_REF=cdbe1814886aefa81a95acbb43e3e2cb9289284f
          PROVEN_CONTACT_HEAD=2213e20d70933c1c84e7947a4755c3476947bfcd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1contactraster/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1contactraster/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1contactraster/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SELECT_REF/grand-bruxelles-game/tools/select_quaternius_project.py" -o /tmp/civ1contactraster/tools/select.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/analyze_civ1_fixed_length_reconstruction.py" -o /tmp/civ1contactraster/tools/analyze.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/build_civ1_skeleton_witness_bundle.py" -o /tmp/civ1contactraster/tools/bundle.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROVEN_CONTACT_HEAD/grand-bruxelles-game/tools/patch_civ1_probe_deterministic_sampling.py" -o /tmp/civ1contactraster/tools/deterministic.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROVEN_CONTACT_HEAD/grand-bruxelles-game/tools/godot_civ1_leftfoot_landmark_witness.gd" -o /tmp/civ1contactraster/tools/contact-witness.gd
          sed -i 's#HERE / "analyze_civ1_fixed_length_reconstruction.py"#HERE / "analyze.py"#' /tmp/civ1contactraster/tools/bundle.py
          python /tmp/civ1contactraster/tools/shadow.py /tmp/civ1contactraster/tools/base.gd /tmp/civ1contactraster/tools/probe.gd
          python /tmp/civ1contactraster/tools/deterministic.py /tmp/civ1contactraster/tools/probe.gd
          python grand-bruxelles-game/tools/patch_civ1_leftfoot_contact_raster_samples.py /tmp/civ1contactraster/tools/contact-witness.gd
          grep -F 'const TARGET_SAMPLES := [118, 119, 0, 1, 2]' /tmp/civ1contactraster/tools/contact-witness.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1contactraster/source/body.glb
          test "$(stat -c '%s' /tmp/civ1contactraster/source/body.glb)" = 6879364
          python /tmp/civ1contactraster/tools/strip.py /tmp/civ1contactraster/source/body.glb /tmp/civ1contactraster/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1contactraster/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_head.glb -o /tmp/civ1contactraster/source/vitruvian_head.glb
          test "$(stat -c '%s' /tmp/civ1contactraster/source/vitruvian_head.glb)" = 10189832
          echo '54efb42e9f3dd7e7cf3c3e86ed5298f3ba26e341d5743245cbe2621c547c5f1f  /tmp/civ1contactraster/source/vitruvian_head.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1contactraster/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1contactraster/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1contactraster/quaternius.zip -d /tmp/civ1contactraster/quaternius
          L="$(find /tmp/civ1contactraster/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$L"; grep -Eqi 'cc0|creative commons zero' "$L"
          python /tmp/civ1contactraster/tools/select.py /tmp/civ1contactraster/quaternius | tee /tmp/civ1contactraster/evidence/project-root.txt
          PROJECT_ROOT="$(cat /tmp/civ1contactraster/evidence/project-root.txt)"
          if [ ! -f "$PROJECT_ROOT/project.godot" ]; then printf '[application]\nconfig/name="CIV1ContactRaster"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1contactraster/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1contactraster/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1contactraster/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1contactraster/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1contactraster/godot.zip -d /tmp/civ1contactraster/engine
          chmod +x /tmp/civ1contactraster/engine/Godot_v4.7.1-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/civ1contactraster/engine/Godot_v4.7.1-stable_linux.x86_64' >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Rebuild deterministic 120-frame Skeleton witness bundle
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1contactraster/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1contactraster/evidence/native-a.json 2>&1 | tee /tmp/civ1contactraster/evidence/native-a.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1contactraster/evidence/native-b.json 2>&1 | tee /tmp/civ1contactraster/evidence/native-b.log
          cmp /tmp/civ1contactraster/evidence/native-a.json /tmp/civ1contactraster/evidence/native-b.json
          cp /tmp/civ1contactraster/evidence/native-a.json /tmp/civ1contactraster/evidence/native.json
          python /tmp/civ1contactraster/tools/analyze.py /tmp/civ1contactraster/evidence/native.json /tmp/civ1contactraster/evidence/fixed-length.json
          python /tmp/civ1contactraster/tools/bundle.py /tmp/civ1contactraster/evidence/native.json /tmp/civ1contactraster/evidence/fixed-length.json /tmp/civ1contactraster/evidence/skeleton-bundle.json
      - name: Prepare current-main canonical sandbox
        run: |
          set -euo pipefail
          CANONICAL_PROJECT=/tmp/civ1contactraster/canonical-project
          cp -a grand-bruxelles-game "$CANONICAL_PROJECT"
          cat > "$CANONICAL_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="CIV1LeftFootContactRaster"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/civ1contactraster/source/civ1_body.glb "$CANONICAL_PROJECT/civ1_body.glb"
          cp /tmp/civ1contactraster/source/vitruvian_head.glb "$CANONICAL_PROJECT/vitruvian_head.glb"
          cp /tmp/civ1contactraster/tools/contact-witness.gd "$CANONICAL_PROJECT/gb_leftfoot_contact.gd"
          "$GODOT_BIN" --headless --editor --path "$CANONICAL_PROJECT" --quit 2>&1 | tee /tmp/civ1contactraster/evidence/canonical-import.log
          echo "CANONICAL_PROJECT=$CANONICAL_PROJECT" >> "$GITHUB_ENV"
      - name: Render 15 real current-main contact rasters
        run: |
          set -euo pipefail
          xvfb-run -a "$GODOT_BIN" --path "$CANONICAL_PROJECT" --resolution 1280x720 --script res://gb_leftfoot_contact.gd -- /tmp/civ1contactraster/evidence/skeleton-bundle.json /tmp/civ1contactraster/evidence/contact-witness.json /tmp/civ1contactraster/captures 2>&1 | tee /tmp/civ1contactraster/evidence/contact-witness.log
          grep -F CIV1_LEFTFOOT_LANDMARK_OK /tmp/civ1contactraster/evidence/contact-witness.log
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1contactraster/evidence/contact-witness.json').read_text())
          assert p['resolution']==[1280,720]
          assert p['sample_indices']==[118,119,0,1,2]
          assert p['capture_count']==15
          assert p['max_pose_origin_error_m']<=1e-4
          assert p['skin_integrity']['same_skeleton_skin_count']>=1
          assert p['skin_integrity']['skin_bind_count']>=1
          assert sorted({int(c['sample_index']) for c in p['captures']})==[0,1,2,118,119]
          assert sorted({int(c['distance_m']) for c in p['captures']})==[2,4,8]
          for c in p['captures']:
              q=Path(c['png'])
              assert q.exists() and q.stat().st_size>1000
          for key in ('perceptual_2_8m_claimed','planted_contact_claimed','animation_correction_authorized','runtime_authorized','visual_approval_claimed','player_view_claimed'):
              assert p[key] is False
          assert p['verdict']=='AMELIORER_LEFTFOOT_CONTACT_RASTERS_CAPTURED_NO_PROMOTION'
          print('CIV1_LEFTFOOT_CONTACT_RASTER_RECEIPT_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-leftfoot-contact-raster-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/civ1contactraster/evidence
            /tmp/civ1contactraster/captures
          if-no-files-found: error
          retention-days: 14
