name: Grand Bruxelles CIV-1 LeftFoot Contact Phase
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_leftfoot_contact_phase.py'
      - 'grand-bruxelles-game/tools/patch_civ1_probe_deterministic_sampling.py'
      - 'grand-bruxelles-game/tests/test_civ1_leftfoot_contact_phase.py'
      - '.github/workflows/grand-bruxelles-civ1-leftfoot-landmark.yml'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  leftfoot-contact-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Causal regression
        run: python grand-bruxelles-game/tests/test_civ1_leftfoot_contact_phase.py
      - name: Prepare pinned CIV-1 sources and Godot 4.7.1
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1contact/{tools,source,evidence,engine,out}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          SELECT_REF=a9ac6276c5ff69927e4d4212efc4f1aff2bb21ac
          FIXED_REF=cdbe1814886aefa81a95acbb43e3e2cb9289284f
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1contact/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1contact/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1contact/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SELECT_REF/grand-bruxelles-game/tools/select_quaternius_project.py" -o /tmp/civ1contact/tools/select.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/analyze_civ1_fixed_length_reconstruction.py" -o /tmp/civ1contact/tools/analyze.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$FIXED_REF/grand-bruxelles-game/tools/build_civ1_skeleton_witness_bundle.py" -o /tmp/civ1contact/tools/bundle.py
          sed -i 's#HERE / "analyze_civ1_fixed_length_reconstruction.py"#HERE / "analyze.py"#' /tmp/civ1contact/tools/bundle.py
          python /tmp/civ1contact/tools/shadow.py /tmp/civ1contact/tools/base.gd /tmp/civ1contact/tools/probe.gd
          python grand-bruxelles-game/tools/patch_civ1_probe_deterministic_sampling.py /tmp/civ1contact/tools/probe.gd
          grep -F 'player.pause()' /tmp/civ1contact/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1contact/source/body.glb
          test "$(stat -c '%s' /tmp/civ1contact/source/body.glb)" = 6879364
          python /tmp/civ1contact/tools/strip.py /tmp/civ1contact/source/body.glb /tmp/civ1contact/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1contact/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1contact/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1contact/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1contact/quaternius.zip -d /tmp/civ1contact/quaternius
          L="$(find /tmp/civ1contact/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$L"; grep -Eqi 'cc0|creative commons zero' "$L"
          python /tmp/civ1contact/tools/select.py /tmp/civ1contact/quaternius | tee /tmp/civ1contact/evidence/project-root.txt
          PROJECT_ROOT="$(cat /tmp/civ1contact/evidence/project-root.txt)"
          if [ ! -f "$PROJECT_ROOT/project.godot" ]; then printf '[application]\nconfig/name="CIV1ContactPhase"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1contact/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1contact/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1contact/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1contact/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1contact/godot.zip -d /tmp/civ1contact/engine
          chmod +x /tmp/civ1contact/engine/Godot_v4.7.1-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/civ1contact/engine/Godot_v4.7.1-stable_linux.x86_64' >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Prove deterministic exact-seek probe and rebuild contact phase
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1contact/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1contact/evidence/native-a.json 2>&1 | tee /tmp/civ1contact/evidence/native-a.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1contact/evidence/native-b.json 2>&1 | tee /tmp/civ1contact/evidence/native-b.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1contact/evidence/native-a.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1contact/evidence/native-b.log
          cmp /tmp/civ1contact/evidence/native-a.json /tmp/civ1contact/evidence/native-b.json
          sha256sum /tmp/civ1contact/evidence/native-a.json | tee /tmp/civ1contact/evidence/native.sha256
          cp /tmp/civ1contact/evidence/native-a.json /tmp/civ1contact/evidence/native.json
          python /tmp/civ1contact/tools/analyze.py /tmp/civ1contact/evidence/native.json /tmp/civ1contact/evidence/fixed-length.json | tee /tmp/civ1contact/evidence/fixed-length.log
          grep -F 'verdict=AMELIORER_FIXED_LENGTH_CONTINUOUS_CYCLE' /tmp/civ1contact/evidence/fixed-length.log
          python /tmp/civ1contact/tools/bundle.py /tmp/civ1contact/evidence/native.json /tmp/civ1contact/evidence/fixed-length.json /tmp/civ1contact/evidence/skeleton-bundle.json | tee /tmp/civ1contact/evidence/bundle.log
          grep -F CIV1_SKELETON_WITNESS_BUNDLE_OK /tmp/civ1contact/evidence/bundle.log
          python grand-bruxelles-game/tools/analyze_civ1_leftfoot_contact_phase.py /tmp/civ1contact/evidence/skeleton-bundle.json /tmp/civ1contact/out/leftfoot-contact-phase.json | tee /tmp/civ1contact/out/leftfoot-contact-phase.log
          grep -F CIV1_LEFTFOOT_CONTACT_PHASE_OK /tmp/civ1contact/out/leftfoot-contact-phase.log
          python - <<'PY'
          import json
          p=json.load(open('/tmp/civ1contact/out/leftfoot-contact-phase.json'))
          assert p['contact_target_contains_contact_min'] is True
          assert p['two_sided_low_contact'] is True
          assert p['identity_window_contains_contact_min'] is False
          assert p['contact_render_complete'] is False
          assert p['planted_contact_verified'] is False
          assert p['quantitative_foot_slide_candidate'] is False
          assert p['animation_correction_authorized'] is False
          assert p['runtime_authorized'] is False
          print('CIV1_CONTACT_PHASE_DETERMINISTIC_FAIL_CLOSED_OK', p['leftfoot_min_sample'], p['prev_sample'], p['next_sample'], p['prev_low'], p['next_low'], p['verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-leftfoot-contact-phase-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/civ1contact/evidence
            /tmp/civ1contact/out
          if-no-files-found: error
          retention-days: 14
