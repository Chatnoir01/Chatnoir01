name: Grand Bruxelles CIV-1 Leg Chain Diagnostic

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_leg_chain_diagnostic.gd"
      - "grand-bruxelles-game/tests/test_civ1_native_retarget_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-leg-chain-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leg-chain-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_native_retarget_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1leg/source /tmp/civ1leg/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1leg/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1leg/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1leg/source/vitruvian_body.glb /tmp/civ1leg/source/civ1_body.glb --require-animations | tee /tmp/civ1leg/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1leg/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1leg/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1leg/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1leg/quaternius
          unzip -q /tmp/civ1leg/quaternius.zip -d /tmp/civ1leg/quaternius
          LICENSE_FILE="$(find /tmp/civ1leg/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1leg/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1leg/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1leg/engine
          GODOT_BIN=/tmp/civ1leg/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1leg/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1leg/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact source and target then measure bilateral chains
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1leg/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1leg/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1LegChainDiagnostic"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1leg/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_leg_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_leg_chain_diagnostic.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1leg/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_leg_chain_diagnostic.gd -- /tmp/civ1leg/evidence/leg-chain.json 2>&1 | tee /tmp/civ1leg/evidence/probe.log
          grep -Fq 'CIV1_LEG_CHAIN_DIAGNOSTIC_OK' /tmp/civ1leg/evidence/probe.log

      - name: Validate fail-closed diagnostic evidence
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1leg/evidence/classification.log
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1leg/evidence/leg-chain.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-civ1-leg-chain-diagnostic-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['source_animation']=='UAL1_Standard/Sprint'
          assert p['sample_count']==121
          assert p['retarget_modifier']=='RetargetModifier3D'
          assert p['use_global_pose'] is False
          assert p['position_enabled'] is False and p['rotation_enabled'] is True and p['scale_enabled'] is False
          required=('LeftUpperLeg','LeftLowerLeg','LeftFoot','RightUpperLeg','RightLowerLeg','RightFoot')
          rest=p['leg_chain_rest_diagnostics']
          pose=p['leg_chain_pose_diagnostics']
          assert tuple(rest.keys()) == required or set(rest.keys()) == set(required)
          assert set(pose.keys()) == set(required)
          for bone in required:
              assert rest[bone]['source_bone_name']
              assert rest[bone]['target_bone_name']
              assert 0.0 <= rest[bone]['rest_local_rotation_delta_deg'] <= 180.000001
              for metric in ('pose_local_rotation_delta_deg','source_pose_from_rest_deg','target_pose_from_rest_deg'):
                  m=pose[bone][metric]
                  assert 0.0 <= m['min_deg'] <= m['mean_deg'] <= m['max_deg'] <= 180.000001, (bone,metric,m)
          assert p['diagnostic_only'] is True
          assert p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False
          print('leg_chain_rest_diagnostics',rest)
          print('leg_chain_pose_diagnostics',pose)
          PY

      - name: Upload bilateral leg-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-leg-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1leg/evidence/
          if-no-files-found: error
          retention-days: 14
