name: Grand Bruxelles CIV-1 LowerLeg Foot Rest Rotation Decomposition

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_lowerleg_foot_rest_rotation_probe.gd"
      - "grand-bruxelles-game/tests/test_civ1_lowerleg_foot_rest_rotation_decomposition_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-lowerleg-foot-rest-rotation-decomposition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lowerleg-foot-rest-rotation-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_lowerleg_foot_rest_rotation_decomposition_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1foot/source /tmp/civ1foot/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1foot/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1foot/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1foot/source/vitruvian_body.glb /tmp/civ1foot/source/civ1_body.glb --require-animations | tee /tmp/civ1foot/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1foot/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1foot/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1foot/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1foot/quaternius
          unzip -q /tmp/civ1foot/quaternius.zip -d /tmp/civ1foot/quaternius
          LICENSE_FILE="$(find /tmp/civ1foot/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1foot/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1foot/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1foot/engine
          GODOT_BIN=/tmp/civ1foot/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1foot/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1foot/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact rigs and capture bilateral rest rotation decomposition
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1foot/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1foot/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1LowerLegFootRestRotation"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1foot/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_lowerleg_foot_rest_rotation_probe.gd "$PROJECT_ROOT/gb_civ1_lowerleg_foot_rest_rotation_probe.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1foot/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_lowerleg_foot_rest_rotation_probe.gd -- /tmp/civ1foot/evidence/rest-rotation.json 2>&1 | tee /tmp/civ1foot/evidence/probe.log
          grep -Fq 'CIV1_LOWERLEG_FOOT_REST_ROTATION_OK' /tmp/civ1foot/evidence/probe.log

      - name: Classify static rest versus rotation versus local residual
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1foot/evidence/classification.log
          import json, math
          from pathlib import Path

          RESIDUAL_INDICES = [84, 85, 86, 87, 88]
          p = json.loads(Path('/tmp/civ1foot/evidence/rest-rotation.json').read_text())
          assert p['format'] == 'grand-bruxelles-civ1-lowerleg-foot-rest-rotation-v1'
          assert p['sample_count'] == 121 and len(p['samples']) == 121
          assert p['retarget_modifier'] == 'RetargetModifier3D'
          assert p['use_global_pose'] is False
          assert p['position_enabled'] is False and p['rotation_enabled'] is True and p['scale_enabled'] is False
          assert p['diagnostic_only'] is True and p['runtime_authorized'] is False and p['visual_approval_claimed'] is False

          def y(v):
              assert len(v) == 3 and all(math.isfinite(float(x)) for x in v)
              return float(v[1])

          def mean_abs(values):
              return sum(abs(v) for v in values) / len(values)

          out = {}
          for side in ('Right', 'Left'):
              rows = [p['samples'][i]['sides'][side] for i in RESIDUAL_INDICES]
              actual = [y(r['actual_relative_vector']) - y(r['source_actual_relative_vector']) for r in rows]
              static = [y(r['rotated_static_rest_vector']) - y(r['source_actual_relative_vector']) for r in rows]
              local = [y(r['local_translation_residual']) for r in rows]
              rest_cf = [y(r['source_rest_direction_counterfactual']) - y(r['source_actual_relative_vector']) for r in rows]
              rotation_cf = [y(r['source_rotation_counterfactual']) - y(r['source_actual_relative_vector']) for r in rows]
              both_cf = [y(r['source_rest_and_rotation_counterfactual']) - y(r['source_actual_relative_vector']) for r in rows]
              static_mae = mean_abs(static)
              out[side.lower()] = {
                  'actual_relative_error_m': mean_abs(actual),
                  'rotated_static_rest_error_m': static_mae,
                  'local_translation_residual_m': mean_abs(local),
                  'source_rest_direction_counterfactual_error_m': mean_abs(rest_cf),
                  'source_rotation_counterfactual_error_m': mean_abs(rotation_cf),
                  'source_rest_and_rotation_counterfactual_error_m': mean_abs(both_cf),
                  'rest_direction_improvement_m': static_mae - mean_abs(rest_cf),
                  'rotation_improvement_m': static_mae - mean_abs(rotation_cf),
              }

          rr, ll = out['right'], out['left']
          rest_vector_bilateral_delta_m = abs(rr['rest_direction_improvement_m'] - ll['rest_direction_improvement_m'])
          rotation_driven_bilateral_delta_m = abs(rr['rotation_improvement_m'] - ll['rotation_improvement_m'])
          local_residual_bilateral_delta_m = abs(rr['local_translation_residual_m'] - ll['local_translation_residual_m'])
          effects = {
              'rest_reference': rest_vector_bilateral_delta_m,
              'rotation_delta': rotation_driven_bilateral_delta_m,
              'local_translation_residual': local_residual_bilateral_delta_m,
          }
          dominant = max(effects, key=effects.get)
          result = {
              'format': 'grand-bruxelles-civ1-lowerleg-foot-rest-rotation-classification-v1',
              'sample_count': 121,
              'residual_indices': RESIDUAL_INDICES,
              **out,
              'rest_vector_bilateral_delta_m': rest_vector_bilateral_delta_m,
              'rotation_driven_bilateral_delta_m': rotation_driven_bilateral_delta_m,
              'local_residual_bilateral_delta_m': local_residual_bilateral_delta_m,
              'dominant_component': dominant,
              'threshold_was_modified': False,
              'diagnostic_only': True,
              'runtime_authorized': False,
              'visual_approval_claimed': False,
          }
          Path('/tmp/civ1foot/evidence/lowerleg-foot-rest-rotation-classification.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload rest rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-lowerleg-foot-rest-rotation-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1foot/evidence
          if-no-files-found: error
