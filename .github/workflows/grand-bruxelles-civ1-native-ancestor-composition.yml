name: Grand Bruxelles CIV-1 Native Ancestor Composition

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd"
      - "grand-bruxelles-game/tests/test_civ1_native_ancestor_composition_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-native-ancestor-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ancestor-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_native_ancestor_composition_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ancestor/source /tmp/civ1ancestor/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1ancestor/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1ancestor/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1ancestor/source/vitruvian_body.glb /tmp/civ1ancestor/source/civ1_body.glb --require-animations | tee /tmp/civ1ancestor/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1ancestor/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1ancestor/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1ancestor/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1ancestor/quaternius
          unzip -q /tmp/civ1ancestor/quaternius.zip -d /tmp/civ1ancestor/quaternius
          LICENSE_FILE="$(find /tmp/civ1ancestor/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1ancestor/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1ancestor/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1ancestor/engine
          GODOT_BIN=/tmp/civ1ancestor/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1ancestor/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1ancestor/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact rigs and capture native model-space chain
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1ancestor/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1ancestor/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1NativeAncestorComposition"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1ancestor/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_global_chain_diagnostic.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1ancestor/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_diagnostic.gd -- /tmp/civ1ancestor/evidence/global-chain.json 2>&1 | tee /tmp/civ1ancestor/evidence/probe.log
          grep -Fq 'CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK' /tmp/civ1ancestor/evidence/probe.log

      - name: Attribute native false-contact composition
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1ancestor/evidence/classification.log
          import json, math
          from pathlib import Path

          SOURCE_SUPPORT = range(58, 75)
          FALSE_SUPPORT = range(84, 89)
          SOURCE_CONTACT_INDEX = 59
          FALSE_CONTACT_INDEX = 86

          p = json.loads(Path('/tmp/civ1ancestor/evidence/global-chain.json').read_text())
          assert p['format'] == 'grand-bruxelles-civ1-global-chain-diagnostic-v3'
          assert p['sample_count'] == 121
          assert p['source_animation'] == 'UAL1_Standard/Sprint'
          assert p['retarget_modifier'] == 'RetargetModifier3D'
          assert p['use_global_pose'] is False
          assert p['position_enabled'] is False
          assert p['rotation_enabled'] is True
          assert p['scale_enabled'] is False
          samples = p['model_space_samples']
          assert len(samples) == 121

          def y(i, bone, side):
              key = 'source_hips_relative_origin' if side == 'source' else 'target_hips_relative_origin'
              return float(samples[i]['bones'][bone][side][key][1])

          def term_errors(i, prefix='Right'):
              upper = y(i, prefix+'UpperLeg', 'target') - y(i, prefix+'UpperLeg', 'source')
              lower_target = y(i, prefix+'LowerLeg', 'target') - y(i, prefix+'UpperLeg', 'target')
              lower_source = y(i, prefix+'LowerLeg', 'source') - y(i, prefix+'UpperLeg', 'source')
              lower = lower_target - lower_source
              foot_target = y(i, prefix+'Foot', 'target') - y(i, prefix+'LowerLeg', 'target')
              foot_source = y(i, prefix+'Foot', 'source') - y(i, prefix+'LowerLeg', 'source')
              foot = foot_target - foot_source
              downstream = lower + foot
              final = y(i, prefix+'Foot', 'target') - y(i, prefix+'Foot', 'source')
              closure = final - (upper + lower + foot)
              return {
                  'upperleg_hips_relative': upper,
                  'lowerleg_relative': lower,
                  'foot_relative': foot,
                  'downstream_sum': downstream,
                  'final_foot_hips_relative': final,
                  'algebraic_closure_error_m': closure,
              }

          def mean(rows, key):
              return sum(r[key] for r in rows) / len(rows)

          def summarize(prefix):
              source_rows = [term_errors(i, prefix) for i in SOURCE_SUPPORT]
              false_rows = [term_errors(i, prefix) for i in FALSE_SUPPORT]
              source_contact = term_errors(SOURCE_CONTACT_INDEX, prefix)
              false_contact = term_errors(FALSE_CONTACT_INDEX, prefix)
              terms = ('upperleg_hips_relative','lowerleg_relative','foot_relative')
              source_means = {k: mean(source_rows,k) for k in terms + ('downstream_sum','final_foot_hips_relative')}
              false_means = {k: mean(false_rows,k) for k in terms + ('downstream_sum','final_foot_hips_relative')}
              dominant = max(terms, key=lambda k: abs(false_means[k]))
              max_closure = max(abs(r['algebraic_closure_error_m']) for r in source_rows + false_rows + [source_contact,false_contact])
              assert max_closure < 1e-5, (prefix,max_closure)
              source_comp = source_contact['upperleg_hips_relative'] * source_contact['downstream_sum'] < 0.0
              false_reinforce = false_contact['upperleg_hips_relative'] * false_contact['downstream_sum'] > 0.0
              return {
                  'source_window_mean_error_m': source_means,
                  'false_window_mean_error_m': false_means,
                  'source_contact_index': SOURCE_CONTACT_INDEX,
                  'source_contact_terms_m': source_contact,
                  'false_contact_index': FALSE_CONTACT_INDEX,
                  'false_contact_terms_m': false_contact,
                  'dominant_false_window_term': dominant,
                  'source_downstream_compensates_upperleg': source_comp,
                  'false_downstream_reinforces_upperleg': false_reinforce,
                  'max_algebraic_closure_error_m': max_closure,
              }

          right = summarize('Right')
          left = summarize('Left')
          result = {
              'format': 'grand-bruxelles-civ1-native-ancestor-composition-v1',
              'source_support_window': [58,74],
              'native_false_support_window': [84,88],
              'right': right,
              'left_control': left,
              'dominant_false_window_term': right['dominant_false_window_term'],
              'source_downstream_compensates_upperleg': right['source_downstream_compensates_upperleg'],
              'false_downstream_reinforces_upperleg': right['false_downstream_reinforces_upperleg'],
              'threshold_was_modified': False,
              'diagnostic_only': True,
              'runtime_authorized': False,
              'visual_approval_claimed': False,
          }
          Path('/tmp/civ1ancestor/evidence/native-ancestor-composition.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          assert result['threshold_was_modified'] is False
          assert result['diagnostic_only'] is True
          assert result['runtime_authorized'] is False
          assert result['visual_approval_claimed'] is False
          print('CIV1_NATIVE_ANCESTOR_COMPOSITION_OK')
          PY

      - name: Upload native ancestor composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-native-ancestor-composition-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1ancestor/evidence/
          if-no-files-found: error
          retention-days: 14
