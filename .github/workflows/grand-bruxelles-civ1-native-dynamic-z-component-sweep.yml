name: Grand Bruxelles CIV-1 Native Dynamic Z Component Sweep

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/generate_civ1_dynamic_z_component_candidate.py'
      - 'grand-bruxelles-game/tools/patch_civ1_dynamic_z_component_probe.py'
      - 'grand-bruxelles-game/tests/test_civ1_dynamic_z_component_generator.py'
      - 'grand-bruxelles-game/tests/test_civ1_dynamic_z_component_probe.py'
      - '.github/workflows/grand-bruxelles-civ1-native-dynamic-z-component-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dynamic-z-component:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned regression runtime
        run: python -m pip install --disable-pip-version-check 'pytest==8.4.2'
      - name: Prove dynamic Z contract
        run: |
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_dynamic_z_component_generator.py
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_dynamic_z_component_probe.py
      - name: Prepare pinned sources and probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1dz/{tools,source,evidence,engine}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1dz/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1dz/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1dz/tools/shadow.py
          python /tmp/civ1dz/tools/shadow.py /tmp/civ1dz/tools/base.gd /tmp/civ1dz/tools/bilateral.gd
          for key in p025 p050 p075 p100; do
            case "$key" in p025) value=0.25;; p050) value=0.50;; p075) value=0.75;; p100) value=1.00;; esac
            python grand-bruxelles-game/tools/generate_civ1_dynamic_z_component_candidate.py "/tmp/civ1dz/evidence/schedule-$key.json" --radius-samples 8 --peak-blend "$value"
            python grand-bruxelles-game/tools/patch_civ1_dynamic_z_component_probe.py /tmp/civ1dz/tools/bilateral.gd "/tmp/civ1dz/evidence/schedule-$key.json" "/tmp/civ1dz/tools/probe-$key.gd"
            grep -F CIV1_DYNAMIC_Z_COMPONENT_NATIVE_PROBE "/tmp/civ1dz/tools/probe-$key.gd"
          done
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1dz/source/body.glb
          test "$(stat -c '%s' /tmp/civ1dz/source/body.glb)" = 6879364
          python /tmp/civ1dz/tools/strip.py /tmp/civ1dz/source/body.glb /tmp/civ1dz/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1dz/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1dz/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1dz/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1dz/quaternius.zip -d /tmp/civ1dz/quaternius
          LICENSE_FILE="$(find /tmp/civ1dz/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1dz/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1dz/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1dz/godot.zip -d /tmp/civ1dz/engine
          GODOT_BIN=/tmp/civ1dz/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/civ1dz/evidence/godot-version.txt
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1dz/evidence/godot-version.txt
      - name: Import and measure phase
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1dz/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else PROJECT_ROOT="$(find /tmp/civ1dz/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"; printf '[application]\nconfig/name="CIV1DynamicZ"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1dz/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1dz/evidence/import.log
          for key in p025 p050 p075 p100; do
            cp "/tmp/civ1dz/tools/probe-$key.gd" "$PROJECT_ROOT/gb_probe_$key.gd"
            "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script "res://gb_probe_$key.gd" -- "/tmp/civ1dz/evidence/native-$key.json" 2>&1 | tee "/tmp/civ1dz/evidence/native-$key.log"
            grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK "/tmp/civ1dz/evidence/native-$key.log"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/civ1dz/evidence'); rows=[]
          for key,blend in [('p025',0.25),('p050',0.50),('p075',0.75),('p100',1.00)]:
              p=json.loads((root/f'native-{key}.json').read_text()); r=p['right_foot_reference_ab']
              assert r['source_vertical_min_sample_index']==59
              assert r['baseline_phase_delta_samples']==27
              assert r['target_foot_length_preserved'] is True
              phase=int(r['normalized_phase_delta_samples'])
              rows.append({'candidate_id':f'dynamic_z_component_r8_{key}','radius_samples':8,'peak_blend':blend,'baseline_phase_delta_samples':27,'candidate_phase_delta_samples':phase,'phase_improved':abs(phase)<27,'phase_non_material':abs(phase)<12,'target_foot_length_m':r['target_foot_length_m'],'candidate_foot_length_m':r['normalized_target_foot_length_m']})
          eligible=[x for x in rows if x['phase_non_material']]
          verdict='REQUIRE_FULL_GROUNDING_ASSESSMENT' if eligible else ('DYNAMIC_Z_COMPONENT_PHASE_IMPROVES_BUT_STILL_MATERIAL' if any(x['phase_improved'] for x in rows) else 'BLOCK_DYNAMIC_Z_COMPONENT_NO_PHASE_IMPROVEMENT')
          out={'schema':'grand-bruxelles-civ1-native-dynamic-z-component-phase-v1','godot_version':'4.7.1','component':'target_local_rest_z','center_sample':59,'cycle_sample_count':120,'candidates':rows,'eligible_candidate_ids':[x['candidate_id'] for x in eligible],'verdict':verdict,'runtime_authorized':False,'visual_approval_claimed':False}
          (root/'native-dynamic-z-component-phase.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-native-dynamic-z-component-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1dz/evidence/
          if-no-files-found: error
          retention-days: 14
