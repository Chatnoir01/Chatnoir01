name: Grand Bruxelles CIV-1 Native Global Direction Grounding

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/patch_civ1_global_source_direction_grounding_probe.py'
      - 'grand-bruxelles-game/tests/test_civ1_global_source_direction_grounding_probe.py'
      - '.github/workflows/grand-bruxelles-civ1-native-global-direction-grounding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-grounding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression contract
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_global_source_direction_grounding_probe.py
      - name: Prepare exact sources and probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ground/{tools,source,evidence,engine}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1ground/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1ground/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1ground/tools/shadow.py
          python /tmp/civ1ground/tools/shadow.py /tmp/civ1ground/tools/base.gd /tmp/civ1ground/tools/bilateral.gd
          python grand-bruxelles-game/tools/patch_civ1_global_source_direction_grounding_probe.py /tmp/civ1ground/tools/bilateral.gd /tmp/civ1ground/tools/probe.gd
          grep -F CIV1_GLOBAL_SOURCE_DIRECTION_GROUNDING_PROBE /tmp/civ1ground/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1ground/source/body.glb
          test "$(stat -c '%s' /tmp/civ1ground/source/body.glb)" = 6879364
          python /tmp/civ1ground/tools/strip.py /tmp/civ1ground/source/body.glb /tmp/civ1ground/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1ground/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1ground/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1ground/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1ground/quaternius.zip -d /tmp/civ1ground/quaternius
          LICENSE_FILE="$(find /tmp/civ1ground/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"; grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1ground/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1ground/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1ground/godot.zip -d /tmp/civ1ground/engine
          GODOT_BIN=/tmp/civ1ground/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/civ1ground/evidence/godot-version.txt
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1ground/evidence/godot-version.txt
      - name: Measure five-sample bilateral grounding
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1ground/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else PROJECT_ROOT="$(find /tmp/civ1ground/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"; printf '[application]\nconfig/name="CIV1Grounding"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1ground/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp /tmp/civ1ground/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1ground/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1ground/evidence/native.json 2>&1 | tee /tmp/civ1ground/evidence/native.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1ground/evidence/native.log
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('/tmp/civ1ground/evidence'); d=json.loads((root/'native.json').read_text())
          ab=d['right_foot_reference_ab']; assert ab['normalized_phase_delta_samples']==0
          positions=ab['normalized_target_hips_relative_samples']; assert len(positions)==121
          samples=d['model_space_samples']; support=[57,58,59,60,61]
          def pos(side,i): return samples[i]['bones'][side]['target']['target_hips_relative_origin']
          def vrange(seq): return max(p[1] for p in seq)-min(p[1] for p in seq)
          def htravel(seq): return sum(math.hypot(seq[i][0]-seq[i-1][0],seq[i][2]-seq[i-1][2]) for i in range(1,len(seq)))
          cand=[positions[i] for i in support]; base=[pos('RightFoot',i) for i in support]; left=[pos('LeftFoot',i) for i in support]
          metrics={'candidate_vertical_range_m':vrange(cand),'baseline_right_vertical_range_m':vrange(base),'left_control_vertical_range_m':vrange(left),'candidate_horizontal_travel_m':htravel(cand),'baseline_right_horizontal_travel_m':htravel(base),'left_control_horizontal_travel_m':htravel(left)}
          finite=all(math.isfinite(v) for v in metrics.values())
          vertical_ok=metrics['candidate_vertical_range_m'] <= metrics['baseline_right_vertical_range_m'] + 1e-9
          horizontal_ok=metrics['candidate_horizontal_travel_m'] <= metrics['baseline_right_horizontal_travel_m'] + 1e-9
          payload={'schema':'grand-bruxelles-civ1-p100-five-sample-grounding-v1','godot_version':'4.7.1','candidate_id':'global_source_direction_p100','support_samples':support,'baseline_phase_delta_samples':27,'candidate_phase_delta_samples':0,'metrics':metrics,'finite':finite,'vertical_no_regression_vs_baseline_right':vertical_ok,'horizontal_no_regression_vs_baseline_right':horizontal_ok,'left_control_unchanged_by_candidate':True,'grounding_verified':bool(finite and vertical_ok and horizontal_ok),'foot_slide_verified':bool(finite and horizontal_ok),'runtime_authorized':False,'visual_approval_claimed':False}
          payload['verdict']='REQUIRE_PLAYER_VIEW_EVIDENCE' if payload['grounding_verified'] and payload['foot_slide_verified'] else 'BLOCK_P100_GROUNDING_REGRESSION'
          (root/'grounding.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n'); print(json.dumps(payload,indent=2,sort_keys=True))
          if not finite: raise SystemExit('non-finite grounding evidence')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-p100-grounding-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1ground/evidence
          if-no-files-found: error
          retention-days: 14
