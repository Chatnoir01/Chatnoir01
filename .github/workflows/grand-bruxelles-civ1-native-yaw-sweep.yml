name: Grand Bruxelles CIV-1 Native Yaw Sweep

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/patch_civ1_retarget_yaw_candidate.py"
      - "grand-bruxelles-game/tests/test_civ1_retarget_yaw_candidate.py"
      - "grand-bruxelles-game/tools/assess_civ1_alternative_retarget_sweep.py"
      - ".github/workflows/grand-bruxelles-civ1-native-yaw-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-yaw-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Prove yaw transformer and assessor contracts
        run: |
          python3 grand-bruxelles-game/tests/test_civ1_retarget_yaw_candidate.py
          python3 grand-bruxelles-game/tests/test_civ1_alternative_retarget_sweep.py
      - name: Prepare pinned tools and sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1yaw/{tools,source,evidence,engine}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c
          SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814
          LOC_REF=53b85e30f3a5e32f7670a3dd91ad65c547c4bb23
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1yaw/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1yaw/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1yaw/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$LOC_REF/grand-bruxelles-game/tools/patch_civ1_locomotion_metrics.py" -o /tmp/civ1yaw/tools/loc.py
          python3 /tmp/civ1yaw/tools/shadow.py /tmp/civ1yaw/tools/base.gd /tmp/civ1yaw/tools/bilateral.gd
          python3 /tmp/civ1yaw/tools/loc.py /tmp/civ1yaw/tools/bilateral.gd /tmp/civ1yaw/tools/probe-baseline.gd
          for pct in 25 50 75; do
            frac="0.$pct"
            python3 grand-bruxelles-game/tools/patch_civ1_retarget_yaw_candidate.py /tmp/civ1yaw/tools/bilateral.gd /tmp/civ1yaw/tools/yaw-$pct.gd --fraction "$frac"
            python3 /tmp/civ1yaw/tools/loc.py /tmp/civ1yaw/tools/yaw-$pct.gd /tmp/civ1yaw/tools/probe-$pct.gd
          done
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1yaw/source/body.glb
          test "$(stat -c '%s' /tmp/civ1yaw/source/body.glb)" = 6879364
          python3 /tmp/civ1yaw/tools/strip.py /tmp/civ1yaw/source/body.glb /tmp/civ1yaw/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1yaw/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1yaw/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1yaw/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1yaw/quaternius.zip -d /tmp/civ1yaw/quaternius
          LICENSE_FILE="$(find /tmp/civ1yaw/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$LICENSE_FILE"; grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
          sha256sum /tmp/civ1yaw/tools/* > /tmp/civ1yaw/evidence/tool-sha256.txt
      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1yaw/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1yaw/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1yaw/godot.zip -d /tmp/civ1yaw/engine
          GODOT_BIN=/tmp/civ1yaw/engine/Godot_v4.7.1-stable_linux.x86_64; chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/civ1yaw/evidence/godot-version.txt
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1yaw/evidence/godot-version.txt
      - name: Import and measure immutable baseline plus yaw candidates
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1yaw/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else PROJECT_ROOT="$(find /tmp/civ1yaw/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"; printf '[application]\nconfig/name="CIV1Yaw"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          cp /tmp/civ1yaw/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1yaw/evidence/import.log
          cp /tmp/civ1yaw/tools/probe-baseline.gd "$PROJECT_ROOT/gb_probe_baseline.gd"
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe_baseline.gd -- /tmp/civ1yaw/evidence/baseline.json 2>&1 | tee /tmp/civ1yaw/evidence/baseline.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1yaw/evidence/baseline.log
          for pct in 25 50 75; do
            cp "/tmp/civ1yaw/tools/probe-$pct.gd" "$PROJECT_ROOT/gb_probe_$pct.gd"
            "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script "res://gb_probe_$pct.gd" -- "/tmp/civ1yaw/evidence/candidate-$pct.json" 2>&1 | tee "/tmp/civ1yaw/evidence/candidate-$pct.log"
            grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK "/tmp/civ1yaw/evidence/candidate-$pct.log"
          done
      - name: Phase-first immutable-baseline yaw assessment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/civ1yaw/evidence')
          baseline=json.loads((root/'baseline.json').read_text())
          bm=baseline['locomotion_measurements']; cycle=baseline['sample_count'] - 1
          assert cycle > 5
          baseline_phase=int(baseline['right_foot_reference_ab']['baseline_phase_delta_samples'])
          raw=[]
          improved=[]
          for pct in (25,50,75):
              p=json.loads((root/f'candidate-{pct}.json').read_text())
              assert p['sample_count'] - 1 == cycle
              r=p['right_foot_reference_ab']
              phase=int(r['normalized_phase_delta_samples'])
              record={'candidate_id':f'yaw_{pct}','fraction':pct/100.0,'phase_delta_samples':phase,'rightfoot_length_error_m':abs(r['normalized_target_foot_length_m']-r['target_foot_length_m'])}
              raw.append(record)
              if abs(phase) < abs(baseline_phase): improved.append((pct,p,record))
          summary={'schema':'grand-bruxelles-civ1-native-yaw-phase-first-v1','godot_version':'4.7.1','baseline_phase_delta_samples':baseline_phase,'candidates':raw,'runtime_authorized':False,'visual_approval_claimed':False}
          (root/'native-yaw-phase-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          if not improved:
              assessment={**summary,'verdict':'BLOCK_YAW_NO_PHASE_IMPROVEMENT','grounding_assessment_skipped':True,'reason':'no yaw candidate materially improves RightFoot phase; grounding cannot promote this family'}
              (root/'native-yaw-assessment.json').write_text(json.dumps(assessment,indent=2,sort_keys=True))
              print('CIV1_NATIVE_YAW_BLOCK_NO_PHASE_IMPROVEMENT')
              raise SystemExit(0)
          candidates=[]
          for pct,p,record in improved:
              m=p['locomotion_measurements']; r=p['right_foot_reference_ab']; feet={}
              for foot in ('LeftFoot','RightFoot'):
                  control=bm[foot]; measured=m[foot]
                  control_idx=control['plant_window_sample_indices']; measured_idx=measured['plant_window_sample_indices']
                  assert control['same_animation_window'] is True and measured['same_animation_window'] is True
                  assert len(control_idx)==5 and measured_idx == control_idx, f'{foot} planted window drift for yaw_{pct}'
                  b=control['baseline']; c=measured['counterfactual']
                  feet[foot]={'sample_count':5,'animation_cycle_sample_count':cycle,'planted_sample_indices':control_idx,'baseline_horizontal_drift_m':b['planted_horizontal_drift_m'],'candidate_horizontal_drift_m':c['planted_horizontal_drift_m'],'baseline_vertical_span_m':b['planted_vertical_span_m'],'candidate_vertical_span_m':c['planted_vertical_span_m']}
              candidates.append({'candidate_id':record['candidate_id'],'counterfactual_only':True,'rightfoot_baseline_phase_delta_samples':baseline_phase,'rightfoot_candidate_phase_delta_samples':record['phase_delta_samples'],'rightfoot_length_error_m':record['rightfoot_length_error_m'],'feet':feet})
          out={'schema':'grand-bruxelles-civ1-alternative-retarget-sweep-v2','godot_version':'4.7.1','same_animation_window':True,'runtime_authorized':False,'visual_approval_claimed':False,'candidates':candidates}
          (root/'native-yaw-sweep.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          (root/'phase-improved.flag').write_text('yes\n')
          PY
          if [ -f /tmp/civ1yaw/evidence/phase-improved.flag ]; then
            python3 grand-bruxelles-game/tools/assess_civ1_alternative_retarget_sweep.py /tmp/civ1yaw/evidence/native-yaw-sweep.json /tmp/civ1yaw/evidence/native-yaw-assessment.json
          fi
          cat /tmp/civ1yaw/evidence/native-yaw-assessment.json
      - name: Upload native yaw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-native-yaw-sweep-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1yaw/evidence/
          if-no-files-found: error
          retention-days: 14
