name: Grand Bruxelles CIV-1 Raster Projection Correlation
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/correlate_civ1_dense_raster_projection.py'
      - 'grand-bruxelles-game/tests/test_civ1_dense_raster_projection_correlation.py'
      - '.github/workflows/grand-bruxelles-civ1-raster-projection-correlation.yml'
  workflow_dispatch:
permissions: {contents: read, actions: read}

jobs:
  projection-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression contract
        run: python grand-bruxelles-game/tests/test_civ1_dense_raster_projection_correlation.py
      - name: Fetch pinned validated receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1corr/dense /tmp/civ1corr/ground /tmp/civ1corr/out
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9985691959 --jq .digest)" = "sha256:3aacb0c6813eb76785ed9629f964917df5c2f31ecf8d8f211bf2ce72e7f53cc2"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9970369094 --jq .digest)" = "sha256:cf57765866654db09fef7d6dfa063a501aa246a2750c948994e273f32f8a02b1"
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9985691959/zip > /tmp/civ1corr/dense.zip
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9970369094/zip > /tmp/civ1corr/ground.zip
          unzip -q /tmp/civ1corr/dense.zip -d /tmp/civ1corr/dense
          unzip -q /tmp/civ1corr/ground.zip -d /tmp/civ1corr/ground
          test -f /tmp/civ1corr/dense/common-window.json
          test -f /tmp/civ1corr/ground/evidence/left-ground-reference.json
      - name: Correlate real raster with projected canonical LeftFoot
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/correlate_civ1_dense_raster_projection.py \
            /tmp/civ1corr/dense/common-window.json \
            /tmp/civ1corr/ground/evidence/left-ground-reference.json \
            /tmp/civ1corr/out/projection-correlation.json | tee /tmp/civ1corr/out/projection-correlation.log
          python - <<'PY'
          import json
          p='/tmp/civ1corr/out/projection-correlation.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['common_samples']==[114,115,116,117,118]
          assert r['magnitude_consistent_all_distances'] is True
          assert r['single_screen_orientation_consistent'] is False
          assert r['quantitative_raster_projection_candidate'] is False
          assert r['verdict']=='AMELIORER_PROJECTION_DIRECTION_INCONSISTENT_NO_PROMOTION'
          by={m['distance_m']:m for m in r['measurements']}
          expected={2:(7.611876988335098,7.295631911336841),4:(3.1898086017430387,3.504877308324353),8:(2.0504310556580094,1.7196623538218319)}
          for d,(obs,proj) in expected.items():
              assert abs(by[d]['observed_path_px']-obs)<1e-9
              assert abs(by[d]['projected_leftfoot_path_px']-proj)<1e-9
              assert by[d]['magnitude_passed'] is True
          for k in ('perceptual_2_8m_claimed','planted_contact_claimed','animation_correction_authorized','runtime_authorized','visual_approval_claimed','player_view_claimed'):
              assert r[k] is False
          print('CIV1_REAL_PROJECTION_CORRELATION_RECEIPT_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-raster-projection-correlation-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1corr/out
          if-no-files-found: error
