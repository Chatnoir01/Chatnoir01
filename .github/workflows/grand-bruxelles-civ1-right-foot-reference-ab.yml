name: Grand Bruxelles CIV-1 RightFoot Reference A-B

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd"
      - "grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd"
      - "grand-bruxelles-game/tests/test_civ1_right_foot_reference_ab_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-right-foot-reference-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  right-foot-reference-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_right_foot_reference_ab_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1ref/source /tmp/civ1ref/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1ref/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1ref/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1ref/source/vitruvian_body.glb /tmp/civ1ref/source/civ1_body.glb --require-animations | tee /tmp/civ1ref/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1ref/source/civ1_body.glb' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1ref/source/civ1_body.glb)" = "6780124"

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1ref/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1ref/quaternius.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1ref/quaternius.zip)" = "38687957"
          mkdir -p /tmp/civ1ref/quaternius
          unzip -q /tmp/civ1ref/quaternius.zip -d /tmp/civ1ref/quaternius
          LICENSE_FILE="$(find /tmp/civ1ref/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1ref/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1ref/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1ref/engine
          GODOT_BIN=/tmp/civ1ref/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1ref/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1ref/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import once then run baseline and normalized A-B
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1ref/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1ref/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1RightFootReferenceAB"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1ref/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd "$PROJECT_ROOT/gb_civ1_native_retarget.gd"
          cp grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd "$PROJECT_ROOT/gb_civ1_right_foot_reference_ab.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1ref/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_native_retarget.gd -- /tmp/civ1ref/evidence/baseline-native.json 2>&1 | tee /tmp/civ1ref/evidence/baseline-probe.log
          grep -Fq 'CIV1_NATIVE_RETARGET_OK' /tmp/civ1ref/evidence/baseline-probe.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_right_foot_reference_ab.gd -- /tmp/civ1ref/evidence/normalized-right-foot.json 2>&1 | tee /tmp/civ1ref/evidence/normalized-probe.log
          grep -Fq 'CIV1_RIGHT_FOOT_REFERENCE_AB_OK' /tmp/civ1ref/evidence/normalized-probe.log

      - name: Validate same-run RightFoot reference A-B
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1ref/evidence/classification.log
          import json, math
          from pathlib import Path

          baseline=json.loads(Path('/tmp/civ1ref/evidence/baseline-native.json').read_text())
          p=json.loads(Path('/tmp/civ1ref/evidence/normalized-right-foot.json').read_text())
          v=p['godot_version']
          assert baseline['format']=='grand-bruxelles-civ1-native-retarget-v3'
          assert p['format']=='grand-bruxelles-civ1-right-foot-reference-ab-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert baseline['sample_count']==121
          assert p['sample_count']==121
          assert p['support_band_fraction']==0.10
          assert p['source_animation']==baseline['source_animation']=='UAL1_Standard/Sprint'
          assert p['mapped_required_bones']==baseline['mapped_required_bones']==19
          assert p['retarget_modifier']==baseline['retarget_modifier']=='RetargetModifier3D'
          assert p['target_parent_is_modifier'] is True
          assert p['use_global_pose'] is False and baseline['use_global_pose'] is False
          assert p['position_enabled'] is False and p['rotation_enabled'] is True and p['scale_enabled'] is False
          assert p['reference_normalization_method']=='source_global_reference_direction_preserve_target_foot_length'
          assert p['reference_normalization_applied'] is True
          assert p['counterfactual_only'] is False
          assert p['target_right_foot_length_preserved'] is True
          assert p['target_right_foot_original_length_m'] > 0.05
          assert abs(p['target_right_foot_original_length_m']-p['target_right_foot_normalized_length_m']) < 1e-6
          for key in ('source_reference_direction_global','target_right_foot_original_local_rest_origin','target_right_foot_normalized_local_rest_origin'):
              value=p[key]
              assert len(value)==3 and all(math.isfinite(float(x)) for x in value), (key,value)
          assert p['source_bilateral_motion_verified'] is True
          assert p['target_bilateral_motion_verified'] is True
          assert p['target_support_candidate_measurement_ready'] is True
          for key in ('source_left_foot_range_m','source_right_foot_range_m','target_left_foot_range_m','target_right_foot_range_m'):
              assert p[key] > p['minimum_foot_range_m'], (key,p[key])

          # Same-run source animation must remain invariant.
          for side in ('left','right'):
              b=baseline[f'source_{side}_support_candidate']
              n=p[f'source_{side}_support_candidate']
              assert b['low_height_sample_count']==n['low_height_sample_count'], (side,b,n)
              assert b['low_height_sample_indices']==n['low_height_sample_indices'], (side,b,n)
              assert abs(b['median_horizontal_speed_mps']-n['median_horizontal_speed_mps']) < 1e-6
              assert abs(b['p90_horizontal_speed_mps']-n['p90_horizontal_speed_mps']) < 1e-6

          # Left target is an untouched control limb.
          baseline_left=baseline['target_left_support_candidate']
          normalized_left=p['target_left_support_candidate']
          assert baseline_left['low_height_sample_indices']==normalized_left['low_height_sample_indices']
          assert abs(baseline_left['median_horizontal_speed_mps']-normalized_left['median_horizontal_speed_mps']) < 1e-5
          assert abs(baseline_left['p90_horizontal_speed_mps']-normalized_left['p90_horizontal_speed_mps']) < 1e-5

          baseline_right=baseline['target_right_support_candidate']
          normalized_right=p['target_right_support_candidate']
          right_median_improved=normalized_right['median_horizontal_speed_mps'] < baseline_right['median_horizontal_speed_mps']
          right_p90_improved=normalized_right['p90_horizontal_speed_mps'] < baseline_right['p90_horizontal_speed_mps']
          assert right_median_improved is True, (baseline_right,normalized_right)
          assert right_p90_improved is True, (baseline_right,normalized_right)

          assert p['diagnostic_only'] is True and p['run_alias_selected'] is False
          assert p['world_ground_assumed'] is False and p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False and p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False

          print('baseline_right_median_mps',baseline_right['median_horizontal_speed_mps'])
          print('normalized_right_median_mps',normalized_right['median_horizontal_speed_mps'])
          print('baseline_right_p90_mps',baseline_right['p90_horizontal_speed_mps'])
          print('normalized_right_p90_mps',normalized_right['p90_horizontal_speed_mps'])
          print('baseline_right_low_samples',baseline_right['low_height_sample_count'])
          print('normalized_right_low_samples',normalized_right['low_height_sample_count'])
          print('normalized_right_median_improves_baseline',right_median_improved)
          print('normalized_right_p90_improves_baseline',right_p90_improved)
          print('target_right_foot_length_preserved',p['target_right_foot_length_preserved'])
          print('classification','diagnostic-only actual target-rest A-B; no grounding/foot-slide/runtime claim')
          PY

      - name: Upload RightFoot reference A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-right-foot-reference-ab-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1ref/evidence/
          if-no-files-found: error
          retention-days: 14
