name: Grand Bruxelles CIV-1 RightFoot Chain Pose Coverage
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/classify_civ1_rightfoot_chain_pose_coverage.py'
      - 'grand-bruxelles-game/tests/test_civ1_rightfoot_chain_pose_coverage.py'
      - '.github/workflows/grand-bruxelles-civ1-rightfoot-chain-pose-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  classify-chain-pose-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare durable evidence directory
        run: mkdir -p /tmp/civ1coverage/{geometry,pose,out}
      - name: Causal contract
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tests/test_civ1_rightfoot_chain_pose_coverage.py \
            2>&1 | tee /tmp/civ1coverage/out/causal-contract.log
      - name: Acquire immutable fixed-chain geometry and validated pose bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/10008279797 > /tmp/civ1coverage/out/geometry-artifact.json
          gh api repos/${{ github.repository }}/actions/artifacts/9996432028 > /tmp/civ1coverage/out/pose-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('/tmp/civ1coverage/out/geometry-artifact.json').read_text())
          p=json.loads(Path('/tmp/civ1coverage/out/pose-artifact.json').read_text())
          assert g['id']==10008279797 and g['expired'] is False
          assert g['digest']=='sha256:51f0dd72a7872f5ac0268a50e0cdd083526e96cf4b363907d86c2ae0aa57188b'
          assert g['workflow_run']['id']==34095073102
          assert g['workflow_run']['head_sha']=='4c3b8c9f133748e1e1ad2c663b96dae1b10b9d16'
          assert p['id']==9996432028 and p['expired'] is False
          assert p['digest']=='sha256:9b4dd309157ce1f3e5aae44125f5931fac409238eece1a0632b8ad07933ebb00'
          print('CIV1_CHAIN_POSE_SOURCE_PINS_OK')
          PY
          gh api repos/${{ github.repository }}/actions/artifacts/10008279797/zip > /tmp/civ1coverage/geometry.zip
          gh api repos/${{ github.repository }}/actions/artifacts/9996432028/zip > /tmp/civ1coverage/pose.zip
          unzip -q /tmp/civ1coverage/geometry.zip -d /tmp/civ1coverage/geometry
          unzip -q /tmp/civ1coverage/pose.zip -d /tmp/civ1coverage/pose
          test -f /tmp/civ1coverage/geometry/rightfoot-chain-geometry.json
          test -f /tmp/civ1coverage/pose/evidence/skeleton-bundle.json
      - name: Classify real fixed-chain pose coverage fail-closed
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/classify_civ1_rightfoot_chain_pose_coverage.py \
            /tmp/civ1coverage/geometry/rightfoot-chain-geometry.json \
            /tmp/civ1coverage/pose/evidence/skeleton-bundle.json \
            /tmp/civ1coverage/out/rightfoot-chain-pose-coverage.json \
            2>&1 | tee /tmp/civ1coverage/out/classifier.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1coverage/out/rightfoot-chain-pose-coverage.json').read_text())
          assert r['selection_vertex_count']==3306
          assert r['samples']==[68,69,70,71]
          assert r['missing_required_chain_pose_semantics']==['RightToeBase']
          assert r['pose_coverage_ready'] is False
          assert r['full_vertex_influence_basis_available'] is False
          assert r['skinning_input_complete'] is False
          assert r['rigid_parent_proxy_authorized'] is False
          assert r['bone_local_witness_authorized'] is False
          for key in ('contact_phase_ready','quantitative_foot_slide_candidate','animation_correction_authorized','runtime_authorized','visual_approval_claimed','player_view_claimed'):
              assert r[key] is False
          print('CIV1_RIGHTFOOT_CHAIN_POSE_COVERAGE_REAL_RECEIPT_OK')
          PY
      - name: Upload immutable pose-coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-rightfoot-chain-pose-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1coverage/out
          if-no-files-found: error
          retention-days: 90
