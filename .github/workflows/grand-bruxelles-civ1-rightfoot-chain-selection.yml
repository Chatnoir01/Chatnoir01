name: Grand Bruxelles CIV-1 RightFoot Chain Selection
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/classify_civ1_rightfoot_chain_selection.py'
      - 'grand-bruxelles-game/tests/test_civ1_rightfoot_chain_selection_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-rightfoot-chain-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify-rightfoot-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Causal contract
        run: python grand-bruxelles-game/tests/test_civ1_rightfoot_chain_selection_contract.py
      - name: Acquire immutable GREEN v5 geometry witness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-selection/source /tmp/civ1-selection/out
          gh api repos/${{ github.repository }}/actions/artifacts/10008279797 > /tmp/civ1-selection/out/source-artifact-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/civ1-selection/out/source-artifact-metadata.json').read_text())
          assert m['id'] == 10008279797
          assert m['expired'] is False
          assert m['digest'] == 'sha256:51f0dd72a7872f5ac0268a50e0cdd083526e96cf4b363907d86c2ae0aa57188b'
          assert m['workflow_run']['id'] == 34095073102
          assert m['workflow_run']['head_sha'] == '4c3b8c9f133748e1e1ad2c663b96dae1b10b9d16'
          print('CIV1_SOURCE_ARTIFACT_PIN_OK')
          PY
          gh api repos/${{ github.repository }}/actions/artifacts/10008279797/zip > /tmp/civ1-selection/source.zip
          unzip -q /tmp/civ1-selection/source.zip -d /tmp/civ1-selection/source
          test -f /tmp/civ1-selection/source/rightfoot-chain-geometry.json
      - name: Classify fixed chain identity for next witness only
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/classify_civ1_rightfoot_chain_selection.py \
            /tmp/civ1-selection/source/rightfoot-chain-geometry.json \
            /tmp/civ1-selection/out/rightfoot-chain-selection.json \
            2>&1 | tee /tmp/civ1-selection/out/classifier.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1-selection/out/rightfoot-chain-selection.json').read_text())
          assert r['selection_vertex_count'] == 3306
          assert r['rightfoot_vertex_count'] == 2087
          assert r['righttoebase_vertex_count'] == 3306
          assert r['overlap_vertex_count'] == 2087
          assert r['rightfoot_only_vertex_count'] == 0
          assert r['righttoebase_only_vertex_count'] == 1219
          assert r['rightfoot_is_strict_subset_of_righttoebase'] is True
          assert r['next_selection_authorized'] is True
          assert r['authorized_next_use'] == 'bone_local_contact_stability_witness_only'
          assert r['minimum_stable_samples_required'] == 3
          assert r['contact_phase_ready'] is False
          assert r['quantitative_foot_slide_candidate'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_RIGHTFOOT_CHAIN_SELECTION_V1_RECEIPT_OK')
          PY
      - name: Upload immutable selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-rightfoot-chain-selection-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1-selection/out
          if-no-files-found: error
          retention-days: 90
