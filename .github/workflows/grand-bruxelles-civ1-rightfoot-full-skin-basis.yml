name: Grand Bruxelles CIV-1 RightFoot Full Skin Basis
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/godot_civ1_rightfoot_full_skin_basis_probe.gd'
      - 'grand-bruxelles-game/tests/test_civ1_rightfoot_full_skin_basis_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-rightfoot-full-skin-basis.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full-skin-basis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare durable evidence directory
        run: mkdir -p /tmp/civ1basis/{project,engine,out}
      - name: Causal contract
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tests/test_civ1_rightfoot_full_skin_basis_contract.py 2>&1 | tee /tmp/civ1basis/out/causal-contract.log
      - name: Acquire pinned CIV-1 body and Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/48c277eaf57b7ceafc98fbee67eea155c991f00c/grand-bruxelles-game/tools/strip_glb_animations.py -o /tmp/civ1basis/strip.py
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1basis/body.glb
          python /tmp/civ1basis/strip.py /tmp/civ1basis/body.glb /tmp/civ1basis/project/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1basis/project/civ1_body.glb' | sha256sum -c -
          cp grand-bruxelles-game/tools/godot_civ1_rightfoot_full_skin_basis_probe.gd /tmp/civ1basis/project/probe.gd
          printf '[application]\nconfig/name="CIV1FullSkinBasis"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/civ1basis/project/project.godot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1basis/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1basis/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1basis/godot.zip -d /tmp/civ1basis/engine
          chmod +x /tmp/civ1basis/engine/Godot_v4.7.1-stable_linux.x86_64
      - name: Emit complete per-vertex Skin basis for fixed 3306-vertex chain
        run: |
          set -euo pipefail
          G=/tmp/civ1basis/engine/Godot_v4.7.1-stable_linux.x86_64
          "$G" --headless --editor --path /tmp/civ1basis/project --quit 2>&1 | tee /tmp/civ1basis/out/import.log
          "$G" --headless --path /tmp/civ1basis/project --script res://probe.gd -- /tmp/civ1basis/out/rightfoot-full-skin-basis.json 2>&1 | tee /tmp/civ1basis/out/probe.log
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1basis/out/rightfoot-full-skin-basis.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-rightfoot-full-skin-basis-v1'
          assert r['selection_vertex_count']==3306
          assert r['skinned_mesh_count']==3 and r['surface_count']==4 and r['skeleton_bone_count']==52
          assert r['unresolved_positive_bind_slot_count']==0
          assert r['full_vertex_influence_basis_available'] is True
          assert r['pose_coverage_ready'] is False and r['skinning_input_complete'] is False
          assert r['bone_local_witness_authorized'] is False
          ids=[]
          for v in r['vertices']:
              assert v['righttoebase_weight']>0.0
              assert v['influences'] and v['influence_weight_sum']>0.0
              ids.append(f"{v['mesh_path']}|{v['surface']}|{v['vertex']}")
              for i in v['influences']:
                  assert i['weight']>0.0 and i['bone_index']>=0 and i['bone_name']
          assert len(ids)==len(set(ids))==3306
          identity=hashlib.sha256(('\n'.join(ids)+'\n').encode()).hexdigest()
          Path('/tmp/civ1basis/out/fixed-vertex-identity.sha256').write_text(identity+'\n')
          for k in ('contact_phase_ready','quantitative_foot_slide_candidate','animation_correction_authorized','runtime_authorized','visual_approval_claimed','player_view_claimed'):
              assert r[k] is False
          print('CIV1_RIGHTFOOT_FULL_SKIN_BASIS_RECEIPT_OK', identity)
          PY
          grep -F CIV1_FULL_SKIN_BASIS_OK /tmp/civ1basis/out/probe.log
      - name: Upload immutable full-basis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-rightfoot-full-skin-basis-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1basis/out
          if-no-files-found: error
          retention-days: 90
