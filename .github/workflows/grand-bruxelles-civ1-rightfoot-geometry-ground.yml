name: Grand Bruxelles CIV-1 RightFoot Geometry Ground
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/godot_civ1_rightfoot_geometry_ground_probe.gd'
      - 'grand-bruxelles-game/tests/test_civ1_rightfoot_geometry_ground_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-rightfoot-geometry-ground.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  geometry-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run causal geometry-ground contract
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tests/test_civ1_rightfoot_geometry_ground_contract.py
      - name: Acquire immutable GREEN evidence inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1geom/{bind,skeleton,toe,ground,project,engine,out}
          api="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/10031928117/zip" -o /tmp/civ1geom/bind.zip
          echo 'd607637c6dd7231d11f3e37d72680936e313e5f139b82b31083c926054eb509c  /tmp/civ1geom/bind.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/9996432028/zip" -o /tmp/civ1geom/skeleton.zip
          echo '9b4dd309157ce1f3e5aae44125f5931fac409238eece1a0632b8ad07933ebb00  /tmp/civ1geom/skeleton.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/10024557192/zip" -o /tmp/civ1geom/toe.zip
          echo '3ec94d7b8ed10663d0ee17bf44ffec77104600a7c3006343f0dfbae13877023c  /tmp/civ1geom/toe.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$api/10037379556/zip" -o /tmp/civ1geom/ground.zip
          echo '8fa717aaff9668ed5ef8e307a2509e389e439fa8cb8a602de1989b19765727c5  /tmp/civ1geom/ground.zip' | sha256sum -c -
          unzip -q /tmp/civ1geom/bind.zip -d /tmp/civ1geom/bind
          unzip -q /tmp/civ1geom/skeleton.zip -d /tmp/civ1geom/skeleton
          unzip -q /tmp/civ1geom/toe.zip -d /tmp/civ1geom/toe
          unzip -q /tmp/civ1geom/ground.zip -d /tmp/civ1geom/ground
          cp "$(find /tmp/civ1geom/bind -name rightfoot-bind-pose.json -print -quit)" /tmp/civ1geom/project/bind.json
          cp "$(find /tmp/civ1geom/skeleton -name skeleton-bundle.json -print -quit)" /tmp/civ1geom/project/skeleton.json
          cp "$(find /tmp/civ1geom/toe -name righttoebase-pose.json -print -quit)" /tmp/civ1geom/project/toe.json
          cp "$(find /tmp/civ1geom/ground -name rightfoot-same-sample-ground.json -print -quit)" /tmp/civ1geom/project/ground.json
      - name: Acquire pinned Godot 4.7.1
        run: |
          set -euo pipefail
          cp grand-bruxelles-game/tools/godot_civ1_rightfoot_geometry_ground_probe.gd /tmp/civ1geom/project/probe.gd
          printf '[application]\nconfig/name="CIV1GeometryGround"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > /tmp/civ1geom/project/project.godot
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1geom/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1geom/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1geom/godot.zip -d /tmp/civ1geom/engine
          chmod +x /tmp/civ1geom/engine/Godot_v4.7.1-stable_linux.x86_64
      - name: Replay exact skinned geometry against canonical Ground
        run: |
          set -euo pipefail
          G=/tmp/civ1geom/engine/Godot_v4.7.1-stable_linux.x86_64
          "$G" --headless --path /tmp/civ1geom/project --script res://probe.gd -- \
            /tmp/civ1geom/project/bind.json /tmp/civ1geom/project/skeleton.json /tmp/civ1geom/project/toe.json /tmp/civ1geom/project/ground.json /tmp/civ1geom/out/geometry-ground.json \
            2>&1 | tee /tmp/civ1geom/out/probe.log
          grep -F CIV1_GEOMETRY_GROUND_OK /tmp/civ1geom/out/probe.log
          python - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1geom/out/geometry-ground.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-rightfoot-geometry-ground-v1'
          assert r['sample_indices']==[68,69,70,71]
          assert r['fixed_vertex_count']==3306
          assert len(r['samples'])==4
          for s in r['samples']:
              assert s['replayed_vertex_count']==3306
              assert math.isfinite(s['geometry_lower_envelope_clearance_m'])
              assert s['below_ground_vertex_count'] >= 0
              assert s['lower_envelope_vertex_id']
          assert r['quantitative_foot_slide_candidate'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_GEOMETRY_GROUND_RECEIPT_OK', r['geometry_below_ground_sample_count'])
          PY
      - name: Upload immutable geometry-ground evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-rightfoot-geometry-ground-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1geom/out
          if-no-files-found: error
          retention-days: 90
