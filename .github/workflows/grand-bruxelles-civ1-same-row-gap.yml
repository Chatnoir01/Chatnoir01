name: Grand Bruxelles CIV-1 Same Row Gap Bridge
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_same_row_gap_bridge.py'
      - 'grand-bruxelles-game/tests/test_civ1_same_row_gap_bridge.py'
      - '.github/workflows/grand-bruxelles-civ1-same-row-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  same-row-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression contract
        run: python grand-bruxelles-game/tests/test_civ1_same_row_gap_bridge.py
      - name: Download pinned real 2-4-8m raster evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-same-row
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9978712035/zip" \
            -o /tmp/civ1-same-row/evidence.zip
          unzip -q /tmp/civ1-same-row/evidence.zip -d /tmp/civ1-same-row/evidence
          CAPTURE="$(find /tmp/civ1-same-row/evidence -type f -name 'civ1-distance-2m-115.png' -print -quit)"
          test -n "$CAPTURE"
          CAPTURE_DIR="$(dirname "$CAPTURE")"
          for d in 2 4 8; do
            for s in 115 116 117 118; do
              test -f "$CAPTURE_DIR/civ1-distance-${d}m-${s}.png"
            done
          done
          echo "CAPTURE_DIR=$CAPTURE_DIR" >> "$GITHUB_ENV"
      - name: Analyze same bottom-row semantic and distance scaling
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/analyze_civ1_same_row_gap_bridge.py \
            "$CAPTURE_DIR" /tmp/civ1-same-row/same-row-gap.json
          python - <<'PY'
          import json
          p='/tmp/civ1-same-row/same-row-gap.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['schema']=='grand-bruxelles-civ1-same-row-gap-bridge-v2'
          assert r['distances_m']==[2,4,8]
          assert r['samples']==[115,116,117,118]
          assert r['raw_same_row_bridge_distances_m']==[8]
          assert r['scale_consistent_bridge_distances_m']==[]
          assert r['motion_magnitude_credible'] is False
          by={d['distance_m']:d for d in r['distance_measurements']}
          assert by[2]['bridged_samples']==[]
          assert by[4]['bridged_samples']==[]
          assert by[8]['bridged_samples']==[116]
          assert abs(by[2]['effective_bottom_row_path_px']-3.0) < 1e-9
          assert abs(by[4]['effective_bottom_row_path_px']-1.5) < 1e-9
          assert abs(by[8]['effective_bottom_row_path_px']-2.0) < 1e-9
          f116=next(x for x in by[8]['records'] if x['sample_index']==116)
          assert f116['bottom_pixel_count']==19
          assert abs(f116['bottom_centroid_x_px']-593.0) < 1e-9
          assert f116['bridge_used'] is True
          scale=r['distance_scale_consistency']
          assert scale['passed'] is False
          assert scale['failures']==[{
              'near_distance_m':4,
              'far_distance_m':8,
              'near_path_px':1.5,
              'far_path_px':2.0,
              'reason':'projected_motion_increased_with_distance',
          }]
          assert r['perceptual_2_8m_claimed'] is False
          assert r['planted_contact_claimed'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          assert r['verdict']=='AMELIORER_SAME_ROW_BRIDGE_REJECTED_BY_DISTANCE_SCALE_NO_PROMOTION'
          print('CIV1_SAME_ROW_GAP_RECEIPT_OK', scale['failures'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civ1-same-row-gap-evidence
          path: /tmp/civ1-same-row/same-row-gap.json
          if-no-files-found: warn
