name: Grand Bruxelles CIV-1 Skeleton Applyability
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/analyze_civ1_skeleton_applyability.py'
      - 'grand-bruxelles-game/tests/test_civ1_skeleton_applyability.py'
      - '.github/workflows/grand-bruxelles-civ1-skeleton-applyability.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-skeleton-applyability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        run: git fetch origin main --no-tags && test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression contract
        run: |
          python -m pip install -q 'pytest==8.4.2'
          python -m pytest -q grand-bruxelles-game/tests/test_civ1_skeleton_applyability.py
      - name: Prepare pinned native inputs
        run: |
          set -euo pipefail; mkdir -p /tmp/civ1apply/{tools,source,evidence,engine}
          PROBE_REF=48c277eaf57b7ceafc98fbee67eea155c991f00c; SHADOW_REF=d1f9ba6faa5c54bcf2bb5c522c5b49325a28f814; SELECT_REF=a9ac6276c5ff69927e4d4212efc4f1aff2bb21ac; RECON_REF=6fabaa596736dc9046d0922a93b4a9b00ee7d6bd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" -o /tmp/civ1apply/tools/base.gd
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$PROBE_REF/grand-bruxelles-game/tools/strip_glb_animations.py" -o /tmp/civ1apply/tools/strip.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SHADOW_REF/grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py" -o /tmp/civ1apply/tools/shadow.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$SELECT_REF/grand-bruxelles-game/tools/select_quaternius_project.py" -o /tmp/civ1apply/tools/select.py
          curl -fL --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/$RECON_REF/grand-bruxelles-game/tools/analyze_civ1_bilateral_reconstruction.py" -o /tmp/civ1apply/tools/reconstruction.py
          python /tmp/civ1apply/tools/shadow.py /tmp/civ1apply/tools/base.gd /tmp/civ1apply/tools/probe.gd
          curl -fL --retry 3 https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb -o /tmp/civ1apply/source/body.glb
          test "$(stat -c '%s' /tmp/civ1apply/source/body.glb)" = 6879364
          python /tmp/civ1apply/tools/strip.py /tmp/civ1apply/source/body.glb /tmp/civ1apply/source/civ1_body.glb --require-animations
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1apply/source/civ1_body.glb' | sha256sum -c -
          curl -fL --retry 3 https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip -o /tmp/civ1apply/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1apply/quaternius.zip' | sha256sum -c -
          unzip -q /tmp/civ1apply/quaternius.zip -d /tmp/civ1apply/quaternius
          L="$(find /tmp/civ1apply/quaternius -iname 'LICENSE*' -type f -print -quit)"; test -n "$L"; grep -Eqi 'cc0|creative commons zero' "$L"
          python /tmp/civ1apply/tools/select.py /tmp/civ1apply/quaternius | tee /tmp/civ1apply/evidence/project-root.txt
          PROJECT_ROOT="$(cat /tmp/civ1apply/evidence/project-root.txt)"
          if [ ! -f "$PROJECT_ROOT/project.godot" ]; then printf '[application]\nconfig/name="CIV1SkeletonApplyability"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -o /tmp/civ1apply/godot.zip
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1apply/godot.zip' | sha256sum -c -
          unzip -q /tmp/civ1apply/godot.zip -d /tmp/civ1apply/engine; chmod +x /tmp/civ1apply/engine/Godot_v4.7.1-stable_linux.x86_64
          echo 'GODOT_BIN=/tmp/civ1apply/engine/Godot_v4.7.1-stable_linux.x86_64' >> "$GITHUB_ENV"
      - name: Measure native applyability
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(cat /tmp/civ1apply/evidence/project-root.txt)"; test -f "$PROJECT_ROOT/project.godot"
          cp /tmp/civ1apply/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"; cp /tmp/civ1apply/tools/probe.gd "$PROJECT_ROOT/gb_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1apply/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_probe.gd -- /tmp/civ1apply/evidence/native.json 2>&1 | tee /tmp/civ1apply/evidence/native.log
          grep -F CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK /tmp/civ1apply/evidence/native.log
          python grand-bruxelles-game/tools/analyze_civ1_skeleton_applyability.py /tmp/civ1apply/evidence/native.json /tmp/civ1apply/tools/reconstruction.py /tmp/civ1apply/evidence/applyability.json 2>&1 | tee /tmp/civ1apply/evidence/applyability.log
          grep -F CIV1_SKELETON_APPLYABILITY_OK /tmp/civ1apply/evidence/applyability.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "civ1-skeleton-applyability-${{ github.event.pull_request.head.sha || github.sha }}", path: /tmp/civ1apply/evidence, if-no-files-found: error, retention-days: 14}
