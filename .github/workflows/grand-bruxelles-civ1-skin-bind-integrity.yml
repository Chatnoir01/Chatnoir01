name: Grand Bruxelles CIV-1 Skin Bind Integrity

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/assess_civ1_skin_bind_log.py"
      - "grand-bruxelles-game/tools/assess_civ1_shadow_parity.py"
      - "grand-bruxelles-game/tools/godot_civ1_skin_bind_preflight.gd"
      - "grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py"
      - "grand-bruxelles-game/tests/test_civ1_skin_bind_log.py"
      - "grand-bruxelles-game/tests/test_civ1_shadow_retarget_patch.py"
      - "grand-bruxelles-game/tests/test_civ1_shadow_parity.py"
      - ".github/workflows/grand-bruxelles-civ1-skin-bind-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-skin-bind-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main merge base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "${{ github.event.pull_request.base.sha }}"

      - name: Contract regressions
        run: |
          python3 grand-bruxelles-game/tests/test_civ1_skin_bind_log.py
          python3 grand-bruxelles-game/tests/test_civ1_shadow_retarget_patch.py
          python3 grand-bruxelles-game/tests/test_civ1_shadow_parity.py

      - name: Prepare evidence workspace
        run: mkdir -p /tmp/civ1skin/source /tmp/civ1skin/evidence /tmp/civ1skin/tools

      - name: Fetch exact historical native retarget probe tooling
        run: |
          set -euo pipefail
          PROBE_REF='48c277eaf57b7ceafc98fbee67eea155c991f00c'
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/${PROBE_REF}/grand-bruxelles-game/tools/godot_civ1_global_chain_diagnostic.gd" --output /tmp/civ1skin/tools/godot_civ1_global_chain_diagnostic.gd
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/Chatnoir01/Chatnoir01/${PROBE_REF}/grand-bruxelles-game/tools/strip_glb_animations.py" --output /tmp/civ1skin/tools/strip_glb_animations.py
          sha256sum /tmp/civ1skin/tools/* | tee /tmp/civ1skin/evidence/probe-tool-sha256.txt
          printf '%s\n' "$PROBE_REF" > /tmp/civ1skin/evidence/probe-tool-ref.txt
          python3 grand-bruxelles-game/tools/patch_civ1_global_chain_shadow.py /tmp/civ1skin/tools/godot_civ1_global_chain_diagnostic.gd /tmp/civ1skin/tools/godot_civ1_global_chain_shadow.gd | tee /tmp/civ1skin/evidence/shadow-transform.log
          sha256sum /tmp/civ1skin/tools/godot_civ1_global_chain_shadow.gd | tee /tmp/civ1skin/evidence/shadow-probe-sha256.txt

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1skin/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1skin/source/vitruvian_body.glb)" = "6879364"
          python3 /tmp/civ1skin/tools/strip_glb_animations.py /tmp/civ1skin/source/vitruvian_body.glb /tmp/civ1skin/source/civ1_body.glb --require-animations | tee /tmp/civ1skin/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1skin/source/civ1_body.glb' | sha256sum -c -

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1skin/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1skin/quaternius.zip' | sha256sum -c -
          mkdir -p /tmp/civ1skin/quaternius
          unzip -q /tmp/civ1skin/quaternius.zip -d /tmp/civ1skin/quaternius
          LICENSE_FILE="$(find /tmp/civ1skin/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1skin/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1skin/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1skin/engine
          GODOT_BIN=/tmp/civ1skin/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1skin/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1skin/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import exact sources
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1skin/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else PROJECT_ROOT="$(find /tmp/civ1skin/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"; test -n "$PROJECT_ROOT"; printf '[application]\nconfig/name="CIV1SkinBindIntegrity"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"; fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          cp /tmp/civ1skin/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_skin_bind_preflight.gd "$PROJECT_ROOT/gb_civ1_skin_bind_preflight.gd"
          cp /tmp/civ1skin/tools/godot_civ1_global_chain_diagnostic.gd "$PROJECT_ROOT/gb_civ1_global_chain_diagnostic.gd"
          cp /tmp/civ1skin/tools/godot_civ1_global_chain_shadow.gd "$PROJECT_ROOT/gb_civ1_global_chain_shadow.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1skin/evidence/import.log

      - name: Prove original Skin/Skeleton integrity before diagnostic renaming
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_skin_bind_preflight.gd 2>&1 | tee /tmp/civ1skin/evidence/preflight.log
          python3 grand-bruxelles-game/tools/assess_civ1_skin_bind_log.py /tmp/civ1skin/evidence/preflight.log --success-marker CIV1_SKIN_BIND_PREFLIGHT_OK --output /tmp/civ1skin/evidence/skin-bind-integrity.json

      - name: Reproduce historical in-place rename warnings
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_diagnostic.gd -- /tmp/civ1skin/evidence/historical-global-chain.json 2>&1 | tee /tmp/civ1skin/evidence/historical-probe.log
          grep -F "CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK" /tmp/civ1skin/evidence/historical-probe.log
          grep -E "Skin bind #[0-9]+ contains named bind .*Skeleton3D has no bone by that name" /tmp/civ1skin/evidence/historical-probe.log > /tmp/civ1skin/evidence/historical-bind-warnings.log
          test "$(wc -l < /tmp/civ1skin/evidence/historical-bind-warnings.log)" -gt 0

      - name: Prove shadow retarget preserves diagnostic without Skin mutation
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_global_chain_shadow.gd -- /tmp/civ1skin/evidence/global-chain.json 2>&1 | tee /tmp/civ1skin/evidence/shadow-probe.log
          grep -F "CIV1_GLOBAL_CHAIN_DIAGNOSTIC_OK" /tmp/civ1skin/evidence/shadow-probe.log
          if grep -E "Skin bind #[0-9]+ contains named bind .*Skeleton3D has no bone by that name" /tmp/civ1skin/evidence/shadow-probe.log; then
            echo "shadow diagnostic mutated a skinned Skeleton3D" >&2
            exit 1
          fi
          python3 grand-bruxelles-game/tools/assess_civ1_shadow_parity.py \
            /tmp/civ1skin/evidence/historical-global-chain.json \
            /tmp/civ1skin/evidence/global-chain.json \
            --output /tmp/civ1skin/evidence/shadow-parity.json

      - name: Upload native integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-native-skin-bind-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1skin/evidence/
          if-no-files-found: error
          retention-days: 14
