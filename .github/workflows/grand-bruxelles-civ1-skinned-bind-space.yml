name: Grand Bruxelles CIV-1 Skinned Bind-Space Readiness
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/classify_civ1_skinned_bind_space.py'
      - 'grand-bruxelles-game/tests/test_civ1_skinned_bind_space_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-skinned-bind-space.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bind-space-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare durable evidence directory
        run: mkdir -p /tmp/civ1bind/{basis,coverage,out}
      - name: Causal contract
        run: python grand-bruxelles-game/tests/test_civ1_skinned_bind_space_contract.py 2>&1 | tee /tmp/civ1bind/out/causal-contract.log
      - name: Acquire immutable GREEN evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10018435896/zip" -o /tmp/civ1bind/basis.zip
          echo '3f73d2fedfb97522749ab0a525ff29230c43aeb7f5e05758e2ff97ad843f2586  /tmp/civ1bind/basis.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10028018308/zip" -o /tmp/civ1bind/coverage.zip
          echo 'cb3d00edab93dcb731d85fcf9986930cd11c271e25b18f02f14666c59a60a62a  /tmp/civ1bind/coverage.zip' | sha256sum -c -
          unzip -q /tmp/civ1bind/basis.zip -d /tmp/civ1bind/basis
          unzip -q /tmp/civ1bind/coverage.zip -d /tmp/civ1bind/coverage
      - name: Measure exact bind-space completeness before replay
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/classify_civ1_skinned_bind_space.py \
            /tmp/civ1bind/basis /tmp/civ1bind/coverage /tmp/civ1bind/out/bind-space-readiness.json \
            2>&1 | tee /tmp/civ1bind/out/classifier.log
          cat /tmp/civ1bind/out/bind-space-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1bind/out/bind-space-readiness.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-skinned-bind-space-readiness-v1'
          assert r['sample_indices']==[68,69,70,71]
          assert r['selection_vertex_count']==3306
          assert r['vertex_position_ready'] is True
          assert r['positive_influences_ready'] is True
          assert r['pose_coverage_ready'] is True
          # Current v2 basis did not persist inverse bind/rest mapping. This GREEN
          # is a fail-closed diagnostic result, not replay authorization.
          assert r['vertices_with_complete_bind_space']==0
          assert r['positive_influence_slots_with_bind_space']==0
          assert r['bind_space_complete'] is False
          assert r['rigid_parent_proxy_authorized'] is False
          assert r['global_pose_as_bind_matrix_authorized'] is False
          assert r['skinned_replay_authorized'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_SKINNED_BIND_SPACE_RECEIPT_OK slots=', r['positive_influence_slot_count'])
          PY
      - name: Upload immutable bind-space evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-skinned-bind-space-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1bind/out
          if-no-files-found: error
          retention-days: 90
