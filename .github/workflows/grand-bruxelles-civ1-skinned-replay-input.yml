name: Grand Bruxelles CIV-1 Skinned Replay Input Coverage
on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/classify_civ1_skinned_replay_inputs.py'
      - 'grand-bruxelles-game/tests/test_civ1_skinned_replay_input_contract.py'
      - '.github/workflows/grand-bruxelles-civ1-skinned-replay-input.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay-input-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Require exact-current-main ancestry and Character/NPC ownership boundary
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Causal contract
        run: python grand-bruxelles-game/tests/test_civ1_skinned_replay_input_contract.py
      - name: Acquire immutable GREEN evidence inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1replay/{basis,skeleton,toe,out}
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10018435896/zip" -o /tmp/civ1replay/basis.zip
          echo '3f73d2fedfb97522749ab0a525ff29230c43aeb7f5e05758e2ff97ad843f2586  /tmp/civ1replay/basis.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9996432028/zip" -o /tmp/civ1replay/skeleton.zip
          echo '9b4dd309157ce1f3e5aae44125f5931fac409238eece1a0632b8ad07933ebb00  /tmp/civ1replay/skeleton.zip' | sha256sum -c -
          curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10024557192/zip" -o /tmp/civ1replay/toe.zip
          echo '3ec94d7b8ed10663d0ee17bf44ffec77104600a7c3006343f0dfbae13877023c  /tmp/civ1replay/toe.zip' | sha256sum -c -
          unzip -q /tmp/civ1replay/basis.zip -d /tmp/civ1replay/basis
          unzip -q /tmp/civ1replay/skeleton.zip -d /tmp/civ1replay/skeleton
          unzip -q /tmp/civ1replay/toe.zip -d /tmp/civ1replay/toe
      - name: Measure exact pose coverage for every positive Skin influence
        run: |
          set -euo pipefail
          python grand-bruxelles-game/tools/classify_civ1_skinned_replay_inputs.py \
            /tmp/civ1replay/basis /tmp/civ1replay/skeleton /tmp/civ1replay/toe \
            /tmp/civ1replay/out/replay-input-coverage.json 2>&1 | tee /tmp/civ1replay/out/classifier.log
          cat /tmp/civ1replay/out/replay-input-coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/civ1replay/out/replay-input-coverage.json').read_text())
          assert r['schema']=='grand-bruxelles-civ1-skinned-replay-input-coverage-v1'
          assert r['sample_indices']==[68,69,70,71]
          assert r['selection_vertex_count']==3306
          assert len(r['samples'])==4
          assert r['bone_local_witness_authorized'] is r['skinning_input_complete']
          assert r['contact_phase_ready'] is False
          assert r['quantitative_foot_slide_candidate'] is False
          assert r['animation_correction_authorized'] is False
          assert r['runtime_authorized'] is False
          assert r['visual_approval_claimed'] is False
          assert r['player_view_claimed'] is False
          print('CIV1_SKINNED_REPLAY_INPUT_RECEIPT_OK missing=', r['missing_required_pose_bones'])
          PY
      - name: Upload immutable replay-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-skinned-replay-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1replay/out
          if-no-files-found: error
          retention-days: 90
