name: Grand Bruxelles CIV-1 Sprint Pose Transfer

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_sprint_pose_transfer.gd"
      - "grand-bruxelles-game/tests/test_civ1_sprint_pose_transfer_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-sprint-pose-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint-pose-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_sprint_pose_transfer_contract.py
      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1pose/source /tmp/civ1pose/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1pose/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1pose/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1pose/source/vitruvian_body.glb /tmp/civ1pose/source/civ1_body.glb --require-animations | tee /tmp/civ1pose/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1pose/source/civ1_body.glb' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1pose/source/civ1_body.glb)" = "6780124"
      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1pose/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1pose/quaternius.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1pose/quaternius.zip)" = "38687957"
          mkdir -p /tmp/civ1pose/quaternius
          unzip -q /tmp/civ1pose/quaternius.zip -d /tmp/civ1pose/quaternius
          LICENSE_FILE="$(find /tmp/civ1pose/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1pose/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1pose/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1pose/engine
          GODOT_BIN=/tmp/civ1pose/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1pose/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1pose/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import exact source and target then run pose transfer
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1pose/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then PROJECT_ROOT="$(dirname "$PROJECT_FILE")"; else
            PROJECT_ROOT="$(find /tmp/civ1pose/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1SprintPoseTransfer"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1pose/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_sprint_pose_transfer.gd "$PROJECT_ROOT/gb_civ1_sprint_pose_transfer.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1pose/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_sprint_pose_transfer.gd -- /tmp/civ1pose/evidence/pose-transfer.json 2>&1 | tee /tmp/civ1pose/evidence/probe.log
          grep -Fq 'CIV1_SPRINT_POSE_TRANSFER_OK' /tmp/civ1pose/evidence/probe.log
      - name: Validate fail-closed pose-transfer evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1pose/evidence/pose-transfer.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-civ1-sprint-pose-transfer-v2'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['source_animation']=='UAL1_Standard/Sprint'
          assert p['transfer_method']=='rest_normalized_rotation_scaled_hips_translation'
          assert p['sample_count']==121
          assert p['source_bone_count']==65 and p['target_bone_count']==52
          assert p['mapped_required_bones']==19
          assert 0.2 < p['source_to_target_scale_ratio'] < 5.0
          assert p['source_left_foot_range_m'] > 0.05 and p['source_right_foot_range_m'] > 0.05
          assert p['target_left_foot_range_m'] > 0.05 and p['target_right_foot_range_m'] > 0.05
          assert p['max_normalized_foot_motion_gain']==1.5
          assert p['left_motion_gain_vs_scaled_source'] <= 1.5
          assert p['right_motion_gain_vs_scaled_source'] <= 1.5
          assert p['motion_plausibility_passed'] is True
          assert p['animation_transferred'] is True
          assert p['diagnostic_only'] is True and p['run_alias_selected'] is False
          assert p['world_ground_assumed'] is False and p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False and p['runtime_authorized'] is False
          assert p['visual_approval_claimed'] is False
          print('CIV1_SPRINT_POSE_TRANSFER_EVIDENCE_OK')
          PY
      - name: Upload pose-transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-sprint-pose-transfer-evidence
          path: /tmp/civ1pose/evidence
          if-no-files-found: warn
