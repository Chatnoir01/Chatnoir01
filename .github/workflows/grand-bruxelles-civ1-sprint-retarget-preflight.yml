name: Grand Bruxelles CIV-1 Sprint Retarget Preflight

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_sprint_retarget_preflight.gd"
      - "grand-bruxelles-game/tests/test_civ1_sprint_retarget_preflight_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-sprint-retarget-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sprint-retarget-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_sprint_retarget_preflight_contract.py
      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1rt/source /tmp/civ1rt/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1rt/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1rt/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py \
            /tmp/civ1rt/source/vitruvian_body.glb \
            /tmp/civ1rt/source/civ1_body.glb \
            --require-animations | tee /tmp/civ1rt/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1rt/source/civ1_body.glb' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1rt/source/civ1_body.glb)" = "6780124"
      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1rt/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1rt/quaternius.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1rt/quaternius.zip)" = "38687957"
          mkdir -p /tmp/civ1rt/quaternius
          unzip -q /tmp/civ1rt/quaternius.zip -d /tmp/civ1rt/quaternius
          LICENSE_FILE="$(find /tmp/civ1rt/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1rt/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1rt/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1rt/engine
          GODOT_BIN=/tmp/civ1rt/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1rt/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1rt/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import exact source and target then run preflight
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1rt/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1rt/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="CIV1SprintRetargetPreflight"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp /tmp/civ1rt/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_sprint_retarget_preflight.gd "$PROJECT_ROOT/gb_civ1_sprint_retarget_preflight.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1rt/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_sprint_retarget_preflight.gd -- /tmp/civ1rt/evidence/retarget-preflight.json 2>&1 | tee /tmp/civ1rt/evidence/probe.log
          grep -Fq 'CIV1_SPRINT_RETARGET_PREFLIGHT_OK' /tmp/civ1rt/evidence/probe.log
      - name: Validate fail-closed retarget preflight evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/civ1rt/evidence/retarget-preflight.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-civ1-sprint-retarget-preflight-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['source_animation']=='UAL1_Standard/Sprint'
          assert p['skeleton_profile']=='SkeletonProfileHumanoid'
          assert p['profile_bone_count']==56
          assert p['target_bone_count']==52
          assert p['mapped_required_bones']==p['required_semantic_bone_count']
          assert p['unmapped_required_bones']==[]
          assert p['source_unmapped_required_bones']==[]
          assert p['source_hierarchy_violations']==[]
          assert p['target_hierarchy_violations']==[]
          assert 0.2 < p['source_to_target_scale_ratio'] < 5.0
          assert p['mapping_preflight_passed'] is True
          assert p['diagnostic_only'] is True
          assert p['retarget_ready'] is False
          assert p['animation_transferred'] is False
          assert p['world_ground_assumed'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['visual_approval_claimed'] is False
          print('CIV1_SPRINT_RETARGET_PREFLIGHT_EVIDENCE_OK')
          PY
      - name: Upload retarget preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-sprint-retarget-preflight-evidence
          path: /tmp/civ1rt/evidence
          if-no-files-found: warn
