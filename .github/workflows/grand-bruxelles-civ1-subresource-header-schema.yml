name: Grand Bruxelles CIV-1 Subresource Header Schema
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_resource_table_uniqueness.py'
      - 'grand-bruxelles-game/tools/civ1_subresource_header_schema.py'
      - 'grand-bruxelles-game/tools/test_civ1_subresource_header_schema.py'
      - '.github/workflows/grand-bruxelles-civ1-subresource-header-schema.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_resource_table_uniqueness.py'
      - 'grand-bruxelles-game/tools/civ1_subresource_header_schema.py'
      - 'grand-bruxelles-game/tools/test_civ1_subresource_header_schema.py'
      - '.github/workflows/grand-bruxelles-civ1-subresource-header-schema.yml'
permissions:
  contents: read
jobs:
  civ1-subresource-header-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live main and Character QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "0138ae5d1a22884ad58fd02e7a9457c7bf81f1ec"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove subresource headers fail closed
        working-directory: grand-bruxelles-game/tools
        run: python test_civ1_subresource_header_schema.py
