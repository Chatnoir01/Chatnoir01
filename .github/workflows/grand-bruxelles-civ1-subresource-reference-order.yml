name: Grand Bruxelles CIV-1 Subresource Reference Order
on:
  push:
    branches: ['character/**']
    paths:
      - 'grand-bruxelles-game/tools/civ1_authored_skin_integrity.py'
      - 'grand-bruxelles-game/tools/civ1_resource_table_uniqueness.py'
      - 'grand-bruxelles-game/tools/civ1_subresource_reference_order.py'
      - 'grand-bruxelles-game/tools/test_civ1_subresource_reference_order.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - '.github/workflows/grand-bruxelles-civ1-subresource-reference-order.yml'
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/civ1_authored_skin_integrity.py'
      - 'grand-bruxelles-game/tools/civ1_resource_table_uniqueness.py'
      - 'grand-bruxelles-game/tools/civ1_subresource_reference_order.py'
      - 'grand-bruxelles-game/tools/test_civ1_subresource_reference_order.py'
      - 'grand-bruxelles-game/game/**/*.tscn'
      - '.github/workflows/grand-bruxelles-civ1-subresource-reference-order.yml'
permissions:
  contents: read
jobs:
  civ1-subresource-reference-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live main and Character QA-only scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "0138ae5d1a22884ad58fd02e7a9457c7bf81f1ec"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git diff --quiet origin/main...HEAD -- grand-bruxelles-game/game/main.tscn grand-bruxelles-game/game/scripts grand-bruxelles-game/game/data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove internal SubResource references fail closed
        working-directory: grand-bruxelles-game/tools
        run: |
          set -euo pipefail
          python test_civ1_subresource_reference_order.py
          python civ1_subresource_reference_order.py --self-test
      - name: Measure reachable internal SubResource reference order
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1-subresource-reference-order
          python grand-bruxelles-game/tools/civ1_subresource_reference_order.py grand-bruxelles-game/game/main.tscn /tmp/civ1-subresource-reference-order/civ1-subresource-reference-order.json
      - name: Assert fail-closed receipt
        run: |
          python - <<'PY'
          import json
          p='/tmp/civ1-subresource-reference-order/civ1-subresource-reference-order.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-civ1-subresource-reference-order-v1'
          assert d['reachable_scene_count'] >= 1
          assert d['subresource_reference_order_conflicts'] == []
          assert d['subresource_reference_order_valid'] is True
          assert d['forward_subresource_reference_evidence_accepted'] is False
          assert d['missing_subresource_reference_evidence_accepted'] is False
          assert d['runtime_authorized'] is False
          assert d['visual_approval_claimed'] is False
          assert d['contact_verified'] is False
          assert d['foot_slide_verified'] is False
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civ1-subresource-reference-order
          path: /tmp/civ1-subresource-reference-order/civ1-subresource-reference-order.json
