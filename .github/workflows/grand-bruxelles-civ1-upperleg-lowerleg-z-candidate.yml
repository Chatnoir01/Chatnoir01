name: Grand Bruxelles CIV-1 UpperLeg LowerLeg Z Candidate

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd"
      - "grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd"
      - "grand-bruxelles-game/tools/build_civ1_right_foot_grounded_candidate.py"
      - "grand-bruxelles-game/tools/build_civ1_upperleg_lowerleg_z_candidate.py"
      - "grand-bruxelles-game/tests/test_civ1_upperleg_lowerleg_z_candidate_contract.py"
      - ".github/workflows/grand-bruxelles-civ1-upperleg-lowerleg-z-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_civ1_upperleg_lowerleg_z_candidate_contract.py

      - name: Fetch and sanitize exact CIV-1 body source
        run: |
          set -euo pipefail
          mkdir -p /tmp/civ1z/source /tmp/civ1z/evidence
          BODY_URL='https://raw.githubusercontent.com/ibrews/VitruvianGodot/bdecdcd537b4031fdd0fb299b7e4f93f084fffa0/godot_project/vitruvian_body.glb'
          curl --fail --location --retry 3 "$BODY_URL" --output /tmp/civ1z/source/vitruvian_body.glb
          test "$(stat -c '%s' /tmp/civ1z/source/vitruvian_body.glb)" = "6879364"
          python3 grand-bruxelles-game/tools/strip_glb_animations.py /tmp/civ1z/source/vitruvian_body.glb /tmp/civ1z/source/civ1_body.glb --require-animations | tee /tmp/civ1z/evidence/sanitize.log
          echo '8601f55e7c54b104b5c67de27faa1415e060e16c6b22a32b1cc24e525fa88888  /tmp/civ1z/source/civ1_body.glb' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1z/source/civ1_body.glb)" = "6780124"

      - name: Fetch exact CC0 Quaternius source archive
        run: |
          set -euo pipefail
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/civ1z/quaternius.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/civ1z/quaternius.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/civ1z/quaternius.zip)" = "38687957"
          mkdir -p /tmp/civ1z/quaternius
          unzip -q /tmp/civ1z/quaternius.zip -d /tmp/civ1z/quaternius
          LICENSE_FILE="$(find /tmp/civ1z/quaternius -iname 'LICENSE*' -type f -print -quit)"
          test -n "$LICENSE_FILE"
          grep -Eqi 'cc0|creative commons zero' "$LICENSE_FILE"

      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/civ1z/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/civ1z/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/civ1z/engine
          GODOT_BIN=/tmp/civ1z/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/civ1z/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/civ1z/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Build chained Y-blend plus bilateral Z-only candidate
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/build_civ1_right_foot_grounded_candidate.py \
            grand-bruxelles-game/tools/godot_civ1_right_foot_reference_ab_probe.gd \
            /tmp/civ1z/gb_civ1_y_candidate.gd | tee /tmp/civ1z/evidence/y-candidate-build.log
          grep -Fq 'CIV1_RIGHT_FOOT_GROUNDED_CANDIDATE_BUILT alpha=0.75' /tmp/civ1z/evidence/y-candidate-build.log
          python3 grand-bruxelles-game/tools/build_civ1_upperleg_lowerleg_z_candidate.py \
            /tmp/civ1z/gb_civ1_y_candidate.gd \
            /tmp/civ1z/gb_civ1_z_candidate.gd | tee /tmp/civ1z/evidence/z-candidate-build.log
          grep -Fq 'CIV1_UPPERLEG_LOWERLEG_Z_CANDIDATE_BUILT axis=z bilateral target-length-preserving' /tmp/civ1z/evidence/z-candidate-build.log
          grep -Fq 'upperleg_lowerleg_z_candidate_applied' /tmp/civ1z/gb_civ1_z_candidate.gd
          grep -Fq 'upperleg_lowerleg_z_lengths_preserved' /tmp/civ1z/gb_civ1_z_candidate.gd

      - name: Import once then run baseline and Z-only candidate
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/civ1z/quaternius -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/civ1z/quaternius -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            printf '[application]\nconfig/name="CIV1ZCandidate"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT_ROOT/project.godot"
          fi
          cp /tmp/civ1z/source/civ1_body.glb "$PROJECT_ROOT/civ1_body.glb"
          cp grand-bruxelles-game/tools/godot_civ1_native_retarget_probe.gd "$PROJECT_ROOT/gb_civ1_native_retarget.gd"
          cp /tmp/civ1z/gb_civ1_z_candidate.gd "$PROJECT_ROOT/gb_civ1_z_candidate.gd"
          timeout 300 "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/civ1z/evidence/import.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_native_retarget.gd -- /tmp/civ1z/evidence/baseline-native.json 2>&1 | tee /tmp/civ1z/evidence/baseline-probe.log
          grep -Fq 'CIV1_NATIVE_RETARGET_OK' /tmp/civ1z/evidence/baseline-probe.log
          timeout 120 "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_civ1_z_candidate.gd -- /tmp/civ1z/evidence/z-candidate.json 2>&1 | tee /tmp/civ1z/evidence/z-probe.log
          grep -Fq 'CIV1_RIGHT_FOOT_REFERENCE_AB_OK' /tmp/civ1z/evidence/z-probe.log

      - name: Classify strict comparator and grounding readiness
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/civ1z/evidence/classification.log
          import json
          from pathlib import Path

          baseline=json.loads(Path('/tmp/civ1z/evidence/baseline-native.json').read_text())
          p=json.loads(Path('/tmp/civ1z/evidence/z-candidate.json').read_text())
          v=p['godot_version']
          assert baseline['format']=='grand-bruxelles-civ1-native-retarget-v3'
          assert p['format']=='grand-bruxelles-civ1-right-foot-reference-ab-v4'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['sample_count']==121 and p['support_band_fraction']==0.10
          assert p['source_animation']==baseline['source_animation']=='UAL1_Standard/Sprint'
          assert p['retarget_modifier']==baseline['retarget_modifier']=='RetargetModifier3D'
          assert p['reference_normalization_method']=='source_global_reference_direction_y_blend_preserve_target_length'
          assert abs(float(p['target_right_foot_y_blend_alpha'])-0.75) < 1e-9
          assert p['upperleg_lowerleg_z_candidate_applied'] is True
          assert p['upperleg_lowerleg_z_lengths_preserved'] is True
          assert p['upperleg_lowerleg_rest_axis']=='z'
          assert p['target_right_foot_length_preserved'] is True
          assert p['pose_reset_applied'] is True

          left=p['target_left_support_candidate']; right=p['target_right_support_candidate']
          source_right=p['source_right_support_candidate']; baseline_right=baseline['target_right_support_candidate']
          manual_baseline_left_median_mps=6.845175
          manual_baseline_left_p90_mps=33.326307
          manual_baseline_right_median_mps=6.812484
          manual_baseline_right_p90_mps=36.403685
          strict_bilateral_improvement=(
              left['median_horizontal_speed_mps'] < manual_baseline_left_median_mps
              and left['p90_horizontal_speed_mps'] < manual_baseline_left_p90_mps
              and right['median_horizontal_speed_mps'] < manual_baseline_right_median_mps
              and right['p90_horizontal_speed_mps'] < manual_baseline_right_p90_mps
          )

          source_plane_y=float(source_right['low_height_threshold_y'])
          baseline_plane_y=float(baseline_right['low_height_threshold_y'])
          candidate_plane_y=float(right['low_height_threshold_y'])
          baseline_plane_error_m=abs(baseline_plane_y-source_plane_y)
          candidate_plane_error_m=abs(candidate_plane_y-source_plane_y)
          plane_error_improves_over_native=candidate_plane_error_m <= baseline_plane_error_m
          source_parity_no_foot_slide=(
              float(right['median_horizontal_speed_mps']) <= float(source_right['median_horizontal_speed_mps'])
              and float(right['p90_horizontal_speed_mps']) <= float(source_right['p90_horizontal_speed_mps'])
          )
          no_secondary_support_window=len(right['low_height_windows']) <= len(source_right['low_height_windows'])
          grounding_readiness_pass=plane_error_improves_over_native and source_parity_no_foot_slide and no_secondary_support_window

          result={
              'format':'grand-bruxelles-civ1-upperleg-lowerleg-z-candidate-v1',
              'strict_bilateral_improvement':strict_bilateral_improvement,
              'source_right_median_mps':source_right['median_horizontal_speed_mps'],
              'candidate_right_median_mps':right['median_horizontal_speed_mps'],
              'source_right_p90_mps':source_right['p90_horizontal_speed_mps'],
              'candidate_right_p90_mps':right['p90_horizontal_speed_mps'],
              'source_windows':source_right['low_height_windows'],
              'candidate_windows':right['low_height_windows'],
              'source_plane_y':source_plane_y,
              'baseline_plane_y':baseline_plane_y,
              'candidate_plane_y':candidate_plane_y,
              'baseline_plane_error_m':baseline_plane_error_m,
              'candidate_plane_error_m':candidate_plane_error_m,
              'plane_error_improves_over_native':plane_error_improves_over_native,
              'source_parity_no_foot_slide':source_parity_no_foot_slide,
              'no_secondary_support_window':no_secondary_support_window,
              'grounding_readiness_pass':grounding_readiness_pass,
              'diagnostic_only':True,
              'runtime_authorized':False,
              'visual_approval_claimed':False,
          }
          Path('/tmp/civ1z/evidence/z-candidate-classification.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          assert strict_bilateral_improvement is True
          assert grounding_readiness_pass is True
          PY

      - name: Upload Z-only candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civ1-upperleg-lowerleg-z-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/civ1z/evidence/
          if-no-files-found: error
          retention-days: 14
