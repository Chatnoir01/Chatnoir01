name: Grand Bruxelles Combat Arsenal

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-arsenal.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_hardened_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_touch_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_visual_upgrade_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_melee_combat_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_melee_combat_hardened_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_dodge_runtime.gd"
      - "grand-bruxelles-game/game/tests/player_combat_arsenal_test.gd"
      - "grand-bruxelles-game/game/tests/player_combat_arsenal_hardening_test.gd"
      - "grand-bruxelles-game/game/tests/player_melee_combat_hardened_test.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_visual_upgrade_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-arsenal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-arsenal-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-arsenal-import.log; then exit 1; fi
      - name: Validate combat arsenal deterministic test
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_combat_arsenal_test.gd 2>&1 | tee /tmp/combat-arsenal-test.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_COMBAT_ARSENAL_FAIL" /tmp/combat-arsenal-test.log; then exit 1; fi
          grep -F "PLAYER_COMBAT_ARSENAL_OK" /tmp/combat-arsenal-test.log
      - name: Validate combat arsenal hardening test
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_combat_arsenal_hardening_test.gd 2>&1 | tee /tmp/combat-arsenal-hardening-test.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_COMBAT_HARDENING_FAIL" /tmp/combat-arsenal-hardening-test.log; then exit 1; fi
          grep -F "PLAYER_COMBAT_HARDENING_OK" /tmp/combat-arsenal-hardening-test.log
      - name: Validate hardened melee feel test
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_melee_combat_hardened_test.gd 2>&1 | tee /tmp/player-melee-hardened-test.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_MELEE_HARDENED_FAIL" /tmp/player-melee-hardened-test.log; then exit 1; fi
          grep -F "PLAYER_MELEE_HARDENED_OK" /tmp/player-melee-hardened-test.log
      - name: Validate weapon visual upgrade test
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/combat_weapon_visual_upgrade_test.gd 2>&1 | tee /tmp/combat-weapon-visual-test.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_WEAPON_VISUAL_UPGRADE_FAIL" /tmp/combat-weapon-visual-test.log; then exit 1; fi
          grep -F "COMBAT_WEAPON_VISUAL_UPGRADE_OK" /tmp/combat-weapon-visual-test.log
