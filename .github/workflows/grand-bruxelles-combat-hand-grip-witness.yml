name: Grand Bruxelles Combat Hand Grip Witness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-hand-grip-witness.yml"
      - "grand-bruxelles-game/game/scripts/combat_weapon_visual_upgrade_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_hand_orientation_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_authored_pose_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_shot_fx_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_hardened_runtime.gd"
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/scripts/authored_player_locomotion_runtime.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_hand_grip_player_witness_test.gd"
      - "grand-bruxelles-game/game/tests/combat_visible_fun_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-hand-grip-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-hand-grip-import.log; then exit 1; fi
      - name: Capture true-player hand-grip witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/combat_weapon_hand_grip_player_witness_test.gd \
            2>&1 | tee /tmp/combat-hand-grip-player-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_WEAPON_HAND_GRIP_PLAYER_WITNESS_FAIL" /tmp/combat-hand-grip-player-witness.log; then exit 1; fi
          grep -F "COMBAT_WEAPON_HAND_GRIP_PLAYER_WITNESS_OK" /tmp/combat-hand-grip-player-witness.log
          test -s grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/unarmed.png
          test -s grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/bx9.png
          test -s grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/cbr4.png
          test -s grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/sct8.png
          test -s grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/report.json
      - name: Verify projected weapon meshes and real-hand lock
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip')
          report = json.loads((root / 'report.json').read_text(encoding='utf-8'))
          if report.get('resolution') != [1280, 720]:
              raise SystemExit('COMBAT_HAND_GRIP_PROJECTION_FAIL: resolution drift')
          if not str(report.get('hand_anchor_source', '')).startswith('skeleton:'):
              raise SystemExit('COMBAT_HAND_GRIP_PROJECTION_FAIL: witness did not use authored skeleton hand')
          if float(report.get('max_hand_gap_m', 999)) > 0.025001:
              raise SystemExit('COMBAT_HAND_GRIP_PROJECTION_FAIL: hand-gap contract drift')

          minimum = {
              'bx9': (10.0, 12.0),
              'cbr4': (24.0, 18.0),
              'sct8': (24.0, 18.0),
          }
          lines = []
          for weapon, (min_w, min_h) in minimum.items():
              info = report['weapons'][weapon]
              if not info.get('grip_locked') or not info.get('orientation_locked'):
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} lock false')
              if float(info['direct_gap_m']) > 0.025001 or float(info['orientation_gap_m']) > 0.025001:
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} geometric gap')
              if float(info['socket_screen_gap_px']) > 6.001:
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} socket screen drift')
              width, height = map(float, info['screen_extent_px'])
              if width < min_w or height < min_h:
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} projected extent {width:.1f}x{height:.1f}')
              if int(info['mesh_count']) <= 0:
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} no projected mesh')
              if float(info['forward_dot']) < 0.70:
                  raise SystemExit(f'COMBAT_HAND_GRIP_PROJECTION_FAIL: {weapon} points away from player forward')
              lines.append(f'{weapon}: extent={width:.1f}x{height:.1f}px gap={float(info["direct_gap_m"]):.4f}m screen_gap={float(info["socket_screen_gap_px"]):.2f}px')

          text = 'COMBAT_HAND_GRIP_PROJECTION_METRICS: ' + ' | '.join(lines) + '\n'
          (root / 'projection_metrics.log').write_text(text, encoding='utf-8')
          print(text, end='')
          PY
          cp /tmp/combat-hand-grip-player-witness.log grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/player-witness.log
          cp /tmp/combat-hand-grip-import.log grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip/import.log
      - name: Upload full-frame player hand-grip evidence
        uses: actions/upload-artifact@v4
        with:
          name: combat-weapon-hand-grip-player-witness
          path: grand-bruxelles-game/artifacts/qa/combat_weapon_hand_grip
          if-no-files-found: error
