name: Grand Bruxelles Combat Native Weapon Witness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-native-weapon-witness.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_polish_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_native_weapon_presentation_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_hand_orientation_polish_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_support_hand_ik_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_long_weapon_fit_runtime.gd"
      - "grand-bruxelles-game/game/scripts/authored_player_combat_locomotion_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_authored_pose_polish_runtime.gd"
      - "grand-bruxelles-game/game/tests/combat_native_weapon_player_witness_test.gd"
      - "grand-bruxelles-game/game/tests/combat_native_crossbow_geometry_probe_test.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-native-witness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-player-witness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1 ARM64
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.arm64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.arm64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-native-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-native-import.log; then exit 1; fi
      - name: Capture close combat weapon witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.arm64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/combat_native_weapon_player_witness_test.gd \
            2>&1 | tee /tmp/combat-native-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_NATIVE_WEAPON_PLAYER_WITNESS_FAIL" /tmp/combat-native-witness.log; then exit 1; fi
          grep -F "COMBAT_NATIVE_WEAPON_PLAYER_WITNESS_OK" /tmp/combat-native-witness.log
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/cbr4_close.png
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/sct8_close.png
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/crossbow_close.png
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/knife_close.png
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/bx9_after_native_close.png
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/report.json
      - name: Probe native crossbow geometry
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.arm64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/combat_native_crossbow_geometry_probe_test.gd \
            2>&1 | tee /tmp/combat-native-crossbow-probe.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_NATIVE_CROSSBOW_GEOMETRY_PROBE_FAIL" /tmp/combat-native-crossbow-probe.log; then exit 1; fi
          grep -F "COMBAT_NATIVE_CROSSBOW_GEOMETRY_PROBE_OK" /tmp/combat-native-crossbow-probe.log
          test -s grand-bruxelles-game/artifacts/qa/combat_native_weapon/crossbow_geometry_probe.json
      - name: Preserve witness logs
        if: always()
        shell: bash
        run: |
          mkdir -p grand-bruxelles-game/artifacts/qa/combat_native_weapon
          test ! -f /tmp/combat-native-witness.log || cp /tmp/combat-native-witness.log grand-bruxelles-game/artifacts/qa/combat_native_weapon/witness.log
          test ! -f /tmp/combat-native-crossbow-probe.log || cp /tmp/combat-native-crossbow-probe.log grand-bruxelles-game/artifacts/qa/combat_native_weapon/crossbow_probe.log
          test ! -f /tmp/combat-native-import.log || cp /tmp/combat-native-import.log grand-bruxelles-game/artifacts/qa/combat_native_weapon/import.log
      - name: Validate close witness metrics
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('grand-bruxelles-game/artifacts/qa/combat_native_weapon')
          report = json.loads((root / 'report.json').read_text(encoding='utf-8'))
          print(json.dumps(report, indent=2, sort_keys=True))
          if report.get('resolution') != [1280, 720]:
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: resolution drift')
          if report.get('single_visual_owner') is not True:
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: single owner false')
          if report.get('close_pose_camera') is not True:
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: close pose camera missing')

          for weapon_id in ('cbr4', 'sct8'):
              item = report['weapons'][weapon_id]
              if not item.get('two_hand_pose_locked'):
                  raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: {weapon_id} pose unlocked')
              if float(item.get('carry_gap_m', 999)) > 0.09:
                  raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: {weapon_id} carry gap {item.get("carry_gap_m")}')
              if float(item.get('support_gap_m', 999)) > 0.09:
                  raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: {weapon_id} support gap {item.get("support_gap_m")}')
              if not item.get('support_surface_locked'):
                  raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: {weapon_id} support socket outside visible foregrip')
              extent = item['bounds']['extent_px']
              if float(extent[0]) < 20 or float(extent[1]) < 12:
                  raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: {weapon_id} close extent {extent}')

          crossbow = report['weapons']['crossbow']
          knife = report['weapons']['knife']
          bx9 = report['weapons']['bx9_after_native']
          if crossbow.get('native_visible') != ['2H_Crossbow']:
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: crossbow native inventory drift')
          if float(crossbow.get('hand_region_gap_m', 999)) > 0.1201 or not crossbow.get('orientation_locked'):
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: crossbow grip/orientation')
          carry = float(crossbow.get('carry_gap_m', 999))
          support = float(crossbow.get('support_gap_m', 999))
          if carry > 0.09 or support > 0.09:
              raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: crossbow two-hand gap carry={carry:.4f} support={support:.4f}')
          c_extent = crossbow['bounds']['extent_px']
          k_extent = knife['bounds']['extent_px']
          if float(c_extent[0]) < 10 or float(c_extent[1]) < 8:
              raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: crossbow extent {c_extent}')
          if knife.get('native_visible') != ['Knife'] or not knife.get('orientation_locked'):
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: knife visibility/orientation')
          if float(k_extent[0]) < 4 or float(k_extent[1]) < 4:
              raise SystemExit(f'COMBAT_NATIVE_WITNESS_METRICS_FAIL: knife extent {k_extent}')
          if bx9.get('native_visible') != [] or not bx9.get('grip_locked') or not bx9.get('orientation_locked'):
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: BX-9 regrip/ghost regression')
          if int(bx9.get('max_visual_owners_during_rapid_switch', 99)) > 1:
              raise SystemExit('COMBAT_NATIVE_WITNESS_METRICS_FAIL: rapid switch overlap')
          print('COMBAT_NATIVE_WITNESS_METRICS_OK: close_2h=cbr4/sct8/crossbow knife=green bx9_regrip=green max_owner=1')
          PY
      - name: Upload native weapon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-native-weapon-player-witness
          path: grand-bruxelles-game/artifacts/qa/combat_native_weapon
          if-no-files-found: error
