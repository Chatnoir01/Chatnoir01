name: Grand Bruxelles Combat Rig Safety

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-rig-safety.yml"
      - "grand-bruxelles-game/game/tests/combat_rig_safety_player_witness_test.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_visual_upgrade_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_hand_orientation_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_authored_pose_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_hardened_runtime.gd"
      - "grand-bruxelles-game/game/scripts/authored_player_locomotion_runtime.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-rig-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rig-safety:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot.app/Contents/MacOS/Godot
      - name: Import and parse project
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-rig-safety-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-rig-safety-import.log; then exit 1; fi
      - name: Run authored rig deformation witness
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --script res://game/tests/combat_rig_safety_player_witness_test.gd 2>&1 | tee /tmp/combat-rig-safety.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_RIG_SAFETY_WITNESS_FAIL" /tmp/combat-rig-safety.log; then exit 1; fi
          grep -F "COMBAT_RIG_SAFETY_WITNESS_OK" /tmp/combat-rig-safety.log
