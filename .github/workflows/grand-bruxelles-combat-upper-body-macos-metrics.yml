name: Grand Bruxelles Combat Upper Body macOS Metrics

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-upper-body-macos-metrics.yml"
      - "grand-bruxelles-game/game/scripts/combat_weapon_upper_body_runtime.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_upper_body_metrics_test.gd"
  workflow_dispatch:

concurrency:
  group: combat-upper-body-macos-metrics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upper-body-metrics:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot.app/Contents/MacOS/Godot
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-upper-body-macos-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-upper-body-macos-import.log; then exit 1; fi
      - name: Run authored-player IK metrics
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/combat_weapon_upper_body_metrics_test.gd \
            2>&1 | tee /tmp/combat-upper-body-metrics.log
          grep -F "COMBAT_WEAPON_UPPER_BODY_METRICS_OK" /tmp/combat-upper-body-metrics.log
      - name: Upload metrics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-weapon-upper-body-macos-metrics
          path: |
            /tmp/combat-upper-body-macos-import.log
            /tmp/combat-upper-body-metrics.log
          if-no-files-found: warn
