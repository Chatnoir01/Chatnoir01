name: Grand Bruxelles Combat Upper Body Witness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-upper-body-witness.yml"
      - "grand-bruxelles-game/game/scripts/combat_weapon_upper_body_runtime.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_upper_body_player_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

concurrency:
  group: combat-upper-body-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  player-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify renderer dependencies already on runner
        shell: bash
        run: |
          command -v Xvfb
          ldconfig -p | grep -E 'libGLX|libGL\.so' >/dev/null
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-upper-body-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-upper-body-import.log; then exit 1; fi
      - name: Capture true-player upper-body witness
        shell: bash
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/combat_weapon_upper_body_player_witness_test.gd \
            2>&1 | tee grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body/player-witness.log
          grep -F "COMBAT_WEAPON_UPPER_BODY_WITNESS_OK" grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body/player-witness.log
      - name: Preserve import log
        if: always()
        run: |
          mkdir -p grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body
          cp /tmp/combat-upper-body-import.log grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body/import.log || true
      - name: Upload upper-body evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-weapon-upper-body-player-witness
          path: grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body
          if-no-files-found: error

  macos-visual-probe:
    runs-on: macos-14
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot.app/Contents/MacOS/Godot
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-upper-body-macos-visual-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-upper-body-macos-visual-import.log; then exit 1; fi
      - name: Probe true-player render with macOS display
        shell: bash
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body_macos
          /tmp/godot/Godot.app/Contents/MacOS/Godot \
            --path grand-bruxelles-game \
            --audio-driver Dummy \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/combat_weapon_upper_body_player_witness_test.gd \
            2>&1 | tee grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body_macos/player-witness.log
          cp -R grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body/. grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body_macos/ || true
          grep -F "COMBAT_WEAPON_UPPER_BODY_WITNESS_OK" grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body_macos/player-witness.log
      - name: Upload macOS visual probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-weapon-upper-body-macos-visual-probe
          path: grand-bruxelles-game/artifacts/qa/combat_weapon_upper_body_macos
          if-no-files-found: warn