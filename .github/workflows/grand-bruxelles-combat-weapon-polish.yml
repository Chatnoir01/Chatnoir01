name: Grand Bruxelles Combat Weapon Polish

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-combat-weapon-polish.yml"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_polish_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_melee_combat_weapon_safe_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_touch_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_surface_impact_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_native_weapon_presentation_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_weapon_hand_orientation_polish_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_long_weapon_fit_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_support_hand_ik_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_camera_shoulder_runtime.gd"
      - "grand-bruxelles-game/game/scripts/authored_player_combat_locomotion_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_authored_pose_polish_runtime.gd"
      - "grand-bruxelles-game/game/scripts/combat_audio_feedback_runtime.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_system_polish_gate_test.gd"
      - "grand-bruxelles-game/game/tests/combat_weapon_switch_melee_cancel_test.gd"
      - "grand-bruxelles-game/game/tests/combat_touch_weapon_cycle_test.gd"
      - "grand-bruxelles-game/game/tests/combat_two_hand_support_gate_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combat-weapon-polish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  combat-gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip "https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.arm64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.arm64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/combat-polish-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/combat-polish-import.log; then exit 1; fi
      - name: Run weapon system polish gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --script res://game/tests/combat_weapon_system_polish_gate_test.gd 2>&1 | tee /tmp/combat-polish-gate.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_WEAPON_POLISH_GATE_FAIL" /tmp/combat-polish-gate.log; then exit 1; fi
          grep -F "COMBAT_WEAPON_POLISH_GATE_OK" /tmp/combat-polish-gate.log
      - name: Run melee switch cancellation gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --script res://game/tests/combat_weapon_switch_melee_cancel_test.gd 2>&1 | tee /tmp/combat-switch-cancel.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_WEAPON_SWITCH_MELEE_CANCEL_FAIL" /tmp/combat-switch-cancel.log; then exit 1; fi
          grep -F "COMBAT_WEAPON_SWITCH_MELEE_CANCEL_OK" /tmp/combat-switch-cancel.log
      - name: Run touch weapon cycle gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --script res://game/tests/combat_touch_weapon_cycle_test.gd 2>&1 | tee /tmp/combat-touch-cycle.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_TOUCH_WEAPON_CYCLE_FAIL" /tmp/combat-touch-cycle.log; then exit 1; fi
          grep -F "COMBAT_TOUCH_WEAPON_CYCLE_OK" /tmp/combat-touch-cycle.log
      - name: Run two-hand support and framing gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --script res://game/tests/combat_two_hand_support_gate_test.gd 2>&1 | tee /tmp/combat-two-hand-support.log
          if grep -E "SCRIPT ERROR|Parse Error:|COMBAT_TWO_HAND_SUPPORT_FAIL" /tmp/combat-two-hand-support.log; then exit 1; fi
          grep -F "COMBAT_TWO_HAND_SUPPORT_OK" /tmp/combat-two-hand-support.log
