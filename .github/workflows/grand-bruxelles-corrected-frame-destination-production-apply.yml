name: Grand Bruxelles Corrected Frame Destination Production Apply

on:
  pull_request:
    paths:
      - '.github/workflows/grand-bruxelles-corrected-frame-destination-production-apply.yml'
      - 'grand-bruxelles-game/data/qa/corrected_frame_destination_production_apply.contract.json'
      - 'grand-bruxelles-game/tools/qa/build_corrected_frame_destination_production_pair.py'
      - 'grand-bruxelles-game/tests/test_corrected_frame_destination_production_apply.py'
      - 'grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json'
      - 'grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-production-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          HEAD_SHA="$(git rev-parse HEAD)"
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$HEAD_SHA" = "$EXPECTED_HEAD"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          python - <<'PY'
          import json
          p='grand-bruxelles-game/data/qa/corrected_frame_destination_production_apply.contract.json'
          d=json.load(open(p))
          assert d['production_base_sha'] == '${{ github.event.pull_request.base.sha }}'
          assert d['status'] in ('PRE_APPLY_BUILDER_ONLY','LOCKED_STAGED_PAIR_EVIDENCE_ONLY')
          assert d['policy']['write_production_files_authorized'] is False
          assert d['policy']['runtime_probe_authorized'] is False
          assert d['policy']['jouable_promotion_authorized'] is False
          PY

      - name: Run fail-closed regressions
        run: python grand-bruxelles-game/tests/test_corrected_frame_destination_production_apply.py

      - name: Restore immutable candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corrected-frame/crosswalk /tmp/corrected-frame/readiness
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9642195509/zip -o /tmp/corrected-frame/crosswalk.zip
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9658376002/zip -o /tmp/corrected-frame/readiness.zip
          echo 'a9f5d7f129f5c48b02094bb35d1b06643bcb133e54411483f471268308a1bd63  /tmp/corrected-frame/crosswalk.zip' | sha256sum -c -
          echo 'bc834eaca6d6b51c5a84c124a122345433f30cd68a1e4f5dddf9dbf14a000cf3  /tmp/corrected-frame/readiness.zip' | sha256sum -c -
          unzip -q /tmp/corrected-frame/crosswalk.zip -d /tmp/corrected-frame/crosswalk
          unzip -q /tmp/corrected-frame/readiness.zip -d /tmp/corrected-frame/readiness
          echo '3a3b9f3d5be97cec930a39a69a627d4638d5b4672e31c607efee07c0c978e640  /tmp/corrected-frame/crosswalk/corrected-frame-road-cell-crosswalk-candidate.json' | sha256sum -c -
          echo '39ab8b88f43ad01c6d43344e01fbb50176539b754498a6232ba2aab322ef906a  /tmp/corrected-frame/readiness/corrected-frame-road-destination-readiness-candidate.json' | sha256sum -c -

      - name: Build staged atomic production pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corrected-frame/staged
          cd grand-bruxelles-game
          python tools/qa/build_corrected_frame_destination_production_pair.py \
            --contract data/qa/corrected_frame_destination_production_apply.contract.json \
            --crosswalk-candidate /tmp/corrected-frame/crosswalk/corrected-frame-road-cell-crosswalk-candidate.json \
            --readiness-candidate /tmp/corrected-frame/readiness/corrected-frame-road-destination-readiness-candidate.json \
            --current-crosswalk data/provenance/brussels_road_registered_cell_crosswalk.json \
            --current-readiness data/provenance/brussels_road_destination_readiness_catalog.json \
            --out-crosswalk /tmp/corrected-frame/staged/brussels_road_registered_cell_crosswalk.json \
            --out-readiness /tmp/corrected-frame/staged/brussels_road_destination_readiness_catalog.json

      - name: Verify exact staged accounting and closed rails
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          cw=json.load(open('/tmp/corrected-frame/staged/brussels_road_registered_cell_crosswalk.json'))
          rd=json.load(open('/tmp/corrected-frame/staged/brussels_road_destination_readiness_catalog.json'))
          assert cw['mapped_road_count'] == 96 and cw['mapped_cell_count'] == 4 and rd['destination_count'] == 96
          assert cw['excluded_multicell_road_ids'] == [256158619,397461693]
          a={int(r['road_osm_id']):r['cell_id'] for r in cw['rows']}; b={int(r['road_osm_id']):r['cell_id'] for r in rd['destinations']}
          assert a == b and len(a)==96
          reps={8176386:'bxl-e147500-n169500-s500',150205016:'bxl-e147500-n170000-s500',13767417:'bxl-e148000-n170000-s500',8512036:'bxl-e148500-n170500-s500'}
          for rid,cell in reps.items(): assert a[rid] == cell
          assert not ({256158619,397461693} & set(a))
          assert all(r['destination_id']==f"road-{r['road_osm_id']}" and r['readiness']=='REGISTERED_NOT_RENDERED' for r in rd['destinations'])
          print('CORRECTED_FRAME_STAGED_PAIR_OK mappings=96 destinations=96 cells=4 hold=2 runtime_authorized=false')
          PY
          sha256sum /tmp/corrected-frame/staged/*.json | tee /tmp/corrected-frame/staged/SHA256SUMS

      - name: Enforce locked staged output bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          p='grand-bruxelles-game/data/qa/corrected_frame_destination_production_apply.contract.json'
          d=json.load(open(p)); lock=d.get('locked_staged_evidence',{})
          if d['status'] != 'LOCKED_STAGED_PAIR_EVIDENCE_ONLY': raise SystemExit('EXPECTED_RED: staged pair not content-addressed yet')
          def sha(path): return hashlib.sha256(open(path,'rb').read()).hexdigest()
          assert sha('/tmp/corrected-frame/staged/brussels_road_registered_cell_crosswalk.json') == lock['generated_crosswalk_sha256']
          assert sha('/tmp/corrected-frame/staged/brussels_road_destination_readiness_catalog.json') == lock['generated_readiness_sha256']
          assert d['policy']['write_production_files_authorized'] is False
          print('LOCKED_STAGED_PAIR_OK production_write_authorized=false')
          PY

      - name: Upload staged production pair evidence
        uses: actions/upload-artifact@v4
        with:
          name: corrected-frame-destination-production-pair-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/corrected-frame/staged
          if-no-files-found: error
          retention-days: 14
