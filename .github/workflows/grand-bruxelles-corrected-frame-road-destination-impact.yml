name: Grand Bruxelles Corrected Frame Road Destination Impact
on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/corrected_frame_road_destination_readiness_impact.contract.json"
      - "grand-bruxelles-game/tools/qa/measure_corrected_frame_road_destination_readiness_impact.py"
      - "grand-bruxelles-game/tests/test_corrected_frame_road_destination_readiness_impact.py"
      - ".github/workflows/grand-bruxelles-corrected-frame-road-destination-impact.yml"
      - "grand-bruxelles-game/data/qa/corrected_frame_road_cell_crosswalk_materialization.contract.json"
      - "grand-bruxelles-game/tools/qa/materialize_corrected_frame_road_cell_crosswalk_candidate.py"
      - "grand-bruxelles-game/data/qa/corrected_frame_road_cell_migration_plan.contract.json"
      - "grand-bruxelles-game/tools/qa/measure_corrected_frame_road_cell_migration_plan.py"
      - "grand-bruxelles-game/data/qa/osm_road_frame_correction_impact.contract.json"
      - "grand-bruxelles-game/tools/qa/measure_osm_road_frame_correction_impact.py"
      - "grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main and evidence-only rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD
          echo "LIVE_MAIN_SHA=$LIVE_MAIN_SHA" >> "$GITHUB_ENV"
          python3 - "$LIVE_MAIN_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_road_destination_readiness_impact.contract.json').read_text())
          assert d['production_base_sha']==sys.argv[1], (d['production_base_sha'],sys.argv[1])
          assert d['status'] in {'MEASUREMENT_PENDING','LOCKED_IMPACT_EVIDENCE_ONLY'}
          assert d['source']['license']=='ODbL-1.0'
          assert d['policy']['measurement_only'] is True
          assert d['policy']['replace_readiness_catalog_authorized'] is False
          assert d['policy']['replace_crosswalk_authorized'] is False
          assert d['policy']['multicell_destination_authorized'] is False
          assert all(v is False for v in d['authorization'].values())
          print('CORRECTED_FRAME_DESTINATION_IMPACT_LIVE_MAIN_OK',sys.argv[1],d['status'])
          PY
      - name: Run fail-closed regressions
        working-directory: grand-bruxelles-game
        run: python -m unittest tests/test_corrected_frame_road_destination_readiness_impact.py -v
      - name: Resolve historical evidence bases
        shell: bash
        run: |
          set -euo pipefail
          read -r IMPACT_BASE_SHA MIGRATION_BASE_SHA MATERIALIZATION_BASE_SHA <<EOF
          $(python3 - <<'PY'
          import json
          from pathlib import Path
          impact=json.loads(Path('grand-bruxelles-game/data/qa/osm_road_frame_correction_impact.contract.json').read_text())
          migration=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_road_cell_migration_plan.contract.json').read_text())
          materialization=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_road_cell_crosswalk_materialization.contract.json').read_text())
          assert impact['status']=='LOCKED_IMPACT_MEASUREMENT_EVIDENCE_ONLY'
          assert migration['status']=='LOCKED_MIGRATION_PLAN_EVIDENCE_ONLY'
          assert materialization['status']=='LOCKED_CANDIDATE_EVIDENCE_ONLY'
          print(impact['production_base_sha'],migration['production_base_sha'],materialization['production_base_sha'])
          PY
          )
          EOF
          git cat-file -e "${IMPACT_BASE_SHA}^{commit}"
          git cat-file -e "${MIGRATION_BASE_SHA}^{commit}"
          git cat-file -e "${MATERIALIZATION_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$IMPACT_BASE_SHA" "$LIVE_MAIN_SHA"
          git merge-base --is-ancestor "$MIGRATION_BASE_SHA" "$LIVE_MAIN_SHA"
          git merge-base --is-ancestor "$MATERIALIZATION_BASE_SHA" "$LIVE_MAIN_SHA"
          IMPACT_HISTORICAL_CROSSWALK="$RUNNER_TEMP/impact-historical-crosswalk.json"
          MIGRATION_HISTORICAL_CROSSWALK="$RUNNER_TEMP/migration-historical-crosswalk.json"
          MATERIALIZATION_HISTORICAL_CROSSWALK="$RUNNER_TEMP/materialization-historical-crosswalk.json"
          LIVE_MAIN_READINESS="$RUNNER_TEMP/live-main-road-readiness.json"
          git show "$IMPACT_BASE_SHA:grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json" > "$IMPACT_HISTORICAL_CROSSWALK"
          git show "$MIGRATION_BASE_SHA:grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json" > "$MIGRATION_HISTORICAL_CROSSWALK"
          git show "$MATERIALIZATION_BASE_SHA:grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json" > "$MATERIALIZATION_HISTORICAL_CROSSWALK"
          git show "$LIVE_MAIN_SHA:grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json" > "$LIVE_MAIN_READINESS"
          echo "IMPACT_BASE_SHA=$IMPACT_BASE_SHA" >> "$GITHUB_ENV"
          echo "MIGRATION_BASE_SHA=$MIGRATION_BASE_SHA" >> "$GITHUB_ENV"
          echo "MATERIALIZATION_BASE_SHA=$MATERIALIZATION_BASE_SHA" >> "$GITHUB_ENV"
          echo "IMPACT_HISTORICAL_CROSSWALK=$IMPACT_HISTORICAL_CROSSWALK" >> "$GITHUB_ENV"
          echo "MIGRATION_HISTORICAL_CROSSWALK=$MIGRATION_HISTORICAL_CROSSWALK" >> "$GITHUB_ENV"
          echo "MATERIALIZATION_HISTORICAL_CROSSWALK=$MATERIALIZATION_HISTORICAL_CROSSWALK" >> "$GITHUB_ENV"
          echo "LIVE_MAIN_READINESS=$LIVE_MAIN_READINESS" >> "$GITHUB_ENV"
      - name: Recompute corrected-frame impact
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/measure_osm_road_frame_correction_impact.py
          --contract data/qa/osm_road_frame_correction_impact.contract.json
          --repo-root .
          --live-main-sha "$IMPACT_BASE_SHA"
          --current-crosswalk "$IMPACT_HISTORICAL_CROSSWALK"
          --output "$RUNNER_TEMP/osm-road-frame-impact.json"
      - name: Recompute locked migration plan
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/measure_corrected_frame_road_cell_migration_plan.py
          --contract data/qa/corrected_frame_road_cell_migration_plan.contract.json
          --impact "$RUNNER_TEMP/osm-road-frame-impact.json"
          --repo-root .
          --production-base-sha "$MIGRATION_BASE_SHA"
          --current-crosswalk "$MIGRATION_HISTORICAL_CROSSWALK"
          --output "$RUNNER_TEMP/corrected-frame-road-cell-migration-plan.json"
      - name: Materialize locked corrected-frame crosswalk candidate
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/materialize_corrected_frame_road_cell_crosswalk_candidate.py
          --contract data/qa/corrected_frame_road_cell_crosswalk_materialization.contract.json
          --plan "$RUNNER_TEMP/corrected-frame-road-cell-migration-plan.json"
          --repo-root .
          --production-base-sha "$MATERIALIZATION_BASE_SHA"
          --current-crosswalk "$MATERIALIZATION_HISTORICAL_CROSSWALK"
          --output "$RUNNER_TEMP/corrected-frame-road-cell-crosswalk-candidate.json"
      - name: Measure destination readiness impact
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/measure_corrected_frame_road_destination_readiness_impact.py
          --contract data/qa/corrected_frame_road_destination_readiness_impact.contract.json
          --candidate "$RUNNER_TEMP/corrected-frame-road-cell-crosswalk-candidate.json"
          --readiness "$LIVE_MAIN_READINESS"
          --production-base-sha "$LIVE_MAIN_SHA"
          --output "$RUNNER_TEMP/corrected-frame-road-destination-impact.json"
      - name: Verify evidence-only impact accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'corrected-frame-road-destination-impact.json').read_text())
          assert d['status']=='IMPACT_EVIDENCE_ONLY_NOT_APPLIED'
          assert d['accounting']=={
              'current_destination_count':56,
              'candidate_unique_destination_count':96,
              'multicell_hold_count':2,
              'no_registered_overlap_count':42,
              'retained_destination_count':0,
              'changed_cell_destination_count':45,
              'new_destination_count':51,
              'removed_destination_count':11,
          }
          assert all(v is False for v in d['authorization'].values())
          print('CORRECTED_FRAME_DESTINATION_IMPACT_MEASURED',d['semantic_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-frame-road-destination-readiness-impact
          path: ${{ runner.temp }}/corrected-frame-road-destination-impact.json
          if-no-files-found: error
      - name: Enforce content-addressed impact lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          contract=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_road_destination_readiness_impact.contract.json').read_text())
          p=Path(os.environ['RUNNER_TEMP'])/'corrected-frame-road-destination-impact.json'
          d=json.loads(p.read_text())
          if contract['status']=='MEASUREMENT_PENDING':
              print('RED_FIRST_CORRECTED_FRAME_DESTINATION_IMPACT_NOT_LOCKED',d['semantic_sha256'])
              sys.exit(1)
          locked=contract['locked_evidence']
          measurement_sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert d['semantic_sha256']==locked['semantic_sha256']
          assert d['accounting']==locked['accounting']
          assert measurement_sha==locked['measurement_sha256']
          assert all(v is False for v in d['authorization'].values())
          print('CORRECTED_FRAME_DESTINATION_IMPACT_LOCKED_EXACT',d['semantic_sha256'],measurement_sha)
          PY
