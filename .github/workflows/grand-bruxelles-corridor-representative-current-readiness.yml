name: Grand Bruxelles Corridor Representative Current Readiness
on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/corrected_frame_corridor_representative_current_readiness.contract.json"
      - "grand-bruxelles-game/data/qa/corrected_frame_corridor_representatives.contract.json"
      - "grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json"
      - "grand-bruxelles-game/tools/qa/measure_corridor_rep_current_readiness.py"
      - "grand-bruxelles-game/tests/test_corridor_rep_current_readiness.py"
      - ".github/workflows/grand-bruxelles-corridor-representative-current-readiness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require live-main ancestry and evidence-only rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD
          read -r EVIDENCE_BASE_SHA <<EOF
          $(python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_corridor_representative_current_readiness.contract.json').read_text())
          print(d['production_base_sha'])
          PY
          )
          EOF
          git cat-file -e "${EVIDENCE_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$EVIDENCE_BASE_SHA" "$LIVE_MAIN_SHA"
          echo "LIVE_MAIN_SHA=$LIVE_MAIN_SHA" >> "$GITHUB_ENV"
          echo "EVIDENCE_BASE_SHA=$EVIDENCE_BASE_SHA" >> "$GITHUB_ENV"
          python3 - "$EVIDENCE_BASE_SHA" "$LIVE_MAIN_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_corridor_representative_current_readiness.contract.json').read_text())
          assert d['production_base_sha']==sys.argv[1]
          assert d['status']=='LOCKED_EVIDENCE_ONLY'
          assert d['source']['license']=='ODbL-1.0'
          assert d['policy']['measurement_only'] is True
          assert d['policy']['historical_locked_evidence_must_replay_from_evidence_base'] is True
          assert d['policy']['current_corrected_pair_measurement_is_separate_from_historical_lock'] is True
          assert d['policy']['runtime_probe_authorized'] is False
          assert all(v is False for v in d['authorization'].values())
          locked=d['locked_evidence']
          assert locked['production_base_sha']==sys.argv[1]
          assert len(locked['measurement_sha256'])==64
          assert len(locked['semantic_sha256'])==64
          print('CORRIDOR_REP_CURRENT_READINESS_BASES_OK',f'evidence={sys.argv[1]}',f'live={sys.argv[2]}')
          PY
      - name: Restore historical readiness from locked evidence base
        shell: bash
        run: |
          set -euo pipefail
          HISTORICAL_READINESS="$RUNNER_TEMP/historical-road-destination-readiness.json"
          git show "$EVIDENCE_BASE_SHA:grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json" > "$HISTORICAL_READINESS"
          python3 - "$HISTORICAL_READINESS" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['destination_count']==56
          assert len(d['destinations'])==56
          assert all(v is False for v in d['authorization'].values())
          print('CORRIDOR_REP_HISTORICAL_READINESS_RESTORED destinations=56 runtime=false')
          PY
          echo "HISTORICAL_READINESS=$HISTORICAL_READINESS" >> "$GITHUB_ENV"
      - name: Run fail-closed regressions
        working-directory: grand-bruxelles-game
        run: python -m unittest tests/test_corridor_rep_current_readiness.py -v
      - name: Replay locked historical readiness evidence
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/measure_corridor_rep_current_readiness.py
          --contract data/qa/corrected_frame_corridor_representative_current_readiness.contract.json
          --representatives data/qa/corrected_frame_corridor_representatives.contract.json
          --readiness "$HISTORICAL_READINESS"
          --production-base-sha "$EVIDENCE_BASE_SHA"
          --expectation-mode historical
          --output "$RUNNER_TEMP/corridor-representative-historical-readiness.json"
      - name: Enforce historical content-addressed lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          c=json.loads(Path('grand-bruxelles-game/data/qa/corrected_frame_corridor_representative_current_readiness.contract.json').read_text())
          p=Path(os.environ['RUNNER_TEMP'])/'corridor-representative-historical-readiness.json'
          d=json.loads(p.read_text())
          locked=c['locked_evidence']
          assert d['status']=='HOLD_ATOMIC_MIGRATION_BEFORE_RUNTIME_PROBE'
          assert d['production_base_sha']==locked['production_base_sha']==os.environ['EVIDENCE_BASE_SHA']
          assert d['semantic_sha256']==locked['semantic_sha256']
          assert d['accounting']==locked['accounting']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==locked['measurement_sha256']
          assert all(v is False for v in d['authorization'].values())
          print('CORRIDOR_REP_HISTORICAL_READINESS_LOCKED_EXACT',d['semantic_sha256'])
          PY
      - name: Measure current corrected-pair representative readiness
        working-directory: grand-bruxelles-game
        run: >-
          python tools/qa/measure_corridor_rep_current_readiness.py
          --contract data/qa/corrected_frame_corridor_representative_current_readiness.contract.json
          --representatives data/qa/corrected_frame_corridor_representatives.contract.json
          --readiness data/provenance/brussels_road_destination_readiness_catalog.json
          --production-base-sha "$LIVE_MAIN_SHA"
          --expectation-mode corrected-pair-current
          --output "$RUNNER_TEMP/corridor-representative-current-readiness.json"
      - name: Verify corrected-pair target-cell readiness remains non-runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'corridor-representative-current-readiness.json').read_text())
          a=d['accounting']
          assert d['status']=='REGISTERED_TARGET_CELLS_HOLD_RENDER_COLLISION'
          assert a['representative_count']==4
          assert a['present_in_current_readiness_count']==4
          assert a['absent_from_current_readiness_count']==0
          assert a['present_but_wrong_cell_count']==0
          assert a['present_in_target_cell_count']==4
          assert a['runtime_probe_eligible_count']==0
          assert a['expected_absent_road_osm_ids']==[]
          assert a['expected_wrong_cell_road_osm_ids']==[]
          assert all(r['state']=='PRESENT_IN_TARGET_CELL_NOT_RENDERED' and r['runtime_probe_eligible'] is False for r in d['representatives'])
          assert all(v is False for v in d['authorization'].values())
          print('CORRIDOR_REP_CURRENT_TARGETS_REGISTERED_NOT_RUNTIME',d['semantic_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corridor-representative-current-readiness
          path: |
            ${{ runner.temp }}/corridor-representative-historical-readiness.json
            ${{ runner.temp }}/corridor-representative-current-readiness.json
          if-no-files-found: error
