name: Grand Bruxelles Corridor Sidewalk Articulation

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/corridor_sidewalk_articulation.gd"
      - "grand-bruxelles-game/game/scripts/corridor_sidewalk_articulation_runtime.gd"
      - "grand-bruxelles-game/game/tests/corridor_sidewalk_articulation_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/corridor_sidewalk_ab_capture_test.gd"
      - "grand-bruxelles-game/data/sources/visual_assets/corridor_sidewalk_articulation.json"
      - ".github/workflows/grand-bruxelles-corridor-sidewalk-articulation.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/corridor_sidewalk_articulation.gd"
      - "grand-bruxelles-game/game/scripts/corridor_sidewalk_articulation_runtime.gd"
      - "grand-bruxelles-game/game/tests/corridor_sidewalk_articulation_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/corridor_sidewalk_ab_capture_test.gd"
      - "grand-bruxelles-game/data/sources/visual_assets/corridor_sidewalk_articulation.json"
      - ".github/workflows/grand-bruxelles-corridor-sidewalk-articulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sidewalk-articulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate truth contract
        run: |
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/sources/visual_assets/corridor_sidewalk_articulation.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-corridor-sidewalk-articulation-v1'
          assert d['runtime']['moves_source_geometry'] is False
          assert d['runtime']['changes_road_width'] is False
          assert d['authorship_and_rights']['external_assets']==[]
          assert d['authorship_and_rights']['external_textures']==[]
          assert d['truth_limits']['curb_dimensions_are_measured'] is False
          assert d['truth_limits']['joint_spacing_is_measured'] is False
          print('CORRIDOR_SIDEWALK_TRUTH_OK')
          PY
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/corridor-sidewalk-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/corridor-sidewalk-import.log; then exit 1; fi
      - name: Production sidewalk articulation regression
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/corridor_sidewalk_articulation_runtime_test.gd 2>&1 | tee /tmp/corridor-sidewalk-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|CORRIDOR_SIDEWALK_ARTICULATION_FAIL" /tmp/corridor-sidewalk-runtime.log; then exit 1; fi
          grep -q "CORRIDOR_SIDEWALK_ARTICULATION_OK" /tmp/corridor-sidewalk-runtime.log
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Render frozen same-camera A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/corridor_sidewalk_ab_capture_test.gd 2>&1 | tee /tmp/corridor-sidewalk-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|CORRIDOR_SIDEWALK_AB_FAIL" /tmp/corridor-sidewalk-ab.log; then exit 1; fi
          grep -q "CORRIDOR_SIDEWALK_AB_OK" /tmp/corridor-sidewalk-ab.log
          test -f grand-bruxelles-game/artifacts/qa/corridor_sidewalk_ab/before.png
          test -f grand-bruxelles-game/artifacts/qa/corridor_sidewalk_ab/after.png
      - name: Upload sidewalk A/B witness
        uses: actions/upload-artifact@v4
        with:
          name: corridor-sidewalk-ab-witness
          path: grand-bruxelles-game/artifacts/qa/corridor_sidewalk_ab/*.png
          if-no-files-found: error
