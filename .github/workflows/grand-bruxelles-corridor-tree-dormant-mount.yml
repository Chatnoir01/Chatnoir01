name: Grand Bruxelles Corridor Tree Dormant Mount

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_corridor_tree_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_corridor_tree_dormant_mount_test.gd"
      - ".github/workflows/grand-bruxelles-corridor-tree-dormant-mount.yml"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/osm/anneessens_environment_points.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-tree-dormant-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/corridor-tree-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/corridor-tree-import.log; then exit 1; fi
      - name: Validate dormant nested corridor tree mount
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_corridor_tree_dormant_mount_test.gd 2>&1 | tee /tmp/corridor-tree-dormant.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BRUSSELS_CORRIDOR_TREE_DORMANT_MOUNT_FAIL' /tmp/corridor-tree-dormant.log; then exit 1; fi
          grep -q 'BRUSSELS_CORRIDOR_TREE_DORMANT_MOUNT_OK' /tmp/corridor-tree-dormant.log
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-corridor-tree-dormant-mount
          path: |
            /tmp/corridor-tree-import.log
            /tmp/corridor-tree-dormant.log
          if-no-files-found: error
