name: Grand Bruxelles Corridor Tree Distance LOD

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_corridor_tree_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_corridor_tree_distance_lod_test.gd'
      - 'grand-bruxelles-game/game/tests/brussels_corridor_tree_distance_lod_witness_test.gd'
      - '.github/workflows/grand-bruxelles-corridor-tree-lod.yml'
  workflow_dispatch:

jobs:
  corridor-tree-lod:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/corridor-tree-lod-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/corridor-tree-lod-import.log; then exit 1; fi
      - name: Validate corridor tree distance LOD
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_corridor_tree_distance_lod_test.gd 2>&1 | tee /tmp/corridor-tree-lod.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BRUSSELS_CORRIDOR_TREE_LOD_FAIL' /tmp/corridor-tree-lod.log; then exit 1; fi
          grep -q 'BRUSSELS_CORRIDOR_TREE_LOD_OK' /tmp/corridor-tree-lod.log
