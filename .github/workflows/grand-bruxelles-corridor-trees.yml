name: Grand Bruxelles Corridor OSM Trees

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-corridor-trees.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_street_tree_asset.gd"
      - "grand-bruxelles-game/game/scripts/brussels_corridor_tree_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_corridor_tree_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_corridor_tree_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corridor-tree-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/corridor-trees-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/corridor-trees-import.log; then exit 1; fi
      - name: Validate source-backed corridor trees
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_corridor_tree_runtime_test.gd 2>&1 | tee /tmp/corridor-trees-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_CORRIDOR_TREES_FAIL" /tmp/corridor-trees-runtime.log; then exit 1; fi
          grep -q "BRUSSELS_CORRIDOR_TREES_OK" /tmp/corridor-trees-runtime.log
      - name: 1280x720 normal-player corridor tree A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_corridor_tree_witness_test.gd 2>&1 | tee /tmp/corridor-trees-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_CORRIDOR_TREES_VISUAL_FAIL" /tmp/corridor-trees-witness.log; then exit 1; fi
          grep -q "BRUSSELS_CORRIDOR_TREES_VISUAL_OK" /tmp/corridor-trees-witness.log
      - name: Upload corridor tree evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-corridor-trees-ab
          path: |
            grand-bruxelles-game/artifacts/visual/corridor_trees_before.png
            grand-bruxelles-game/artifacts/visual/corridor_trees_after.png
          if-no-files-found: error
