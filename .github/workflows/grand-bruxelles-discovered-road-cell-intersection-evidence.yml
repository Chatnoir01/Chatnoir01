name: Grand Bruxelles Discovered Road Cell Intersection Evidence

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/build_discovered_road_cell_intersection_evidence.py'
      - 'grand-bruxelles-game/tools/tests/test_discovered_road_cell_intersection_evidence.py'
      - 'grand-bruxelles-game/tools/validate_registered_cell_index_semantics.py'
      - 'grand-bruxelles-game/tools/build_road_acquisition_frontier.py'
      - 'grand-bruxelles-game/tools/build_road_destination_provenance_binding.py'
      - 'grand-bruxelles-game/tools/build_road_municipality_coverage_audit.py'
      - 'grand-bruxelles-game/tools/qa/road_registered_cell_frame_audit.py'
      - 'grand-bruxelles-game/data/osm/vertical_slice_01.game.json'
      - 'grand-bruxelles-game/data/qa/osm_road_frame_correction_impact.contract.json'
      - 'grand-bruxelles-game/data/qa/osm_road_frame_correction_review.contract.json'
      - 'grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json'
      - 'grand-bruxelles-game/data/cell_manifests/**'
      - '.github/workflows/grand-bruxelles-discovered-road-cell-intersection-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed regressions
        working-directory: grand-bruxelles-game
        run: python tools/tests/test_discovered_road_cell_intersection_evidence.py
      - name: Build deterministic evidence twice
        working-directory: grand-bruxelles-game
        run: |
          mkdir -p artifacts/discovered-road-cell-intersections
          python tools/build_discovered_road_cell_intersection_evidence.py --output artifacts/discovered-road-cell-intersections/evidence-a.json
          python tools/build_discovered_road_cell_intersection_evidence.py --output artifacts/discovered-road-cell-intersections/evidence-b.json
          cmp artifacts/discovered-road-cell-intersections/evidence-a.json artifacts/discovered-road-cell-intersections/evidence-b.json
          cd artifacts/discovered-road-cell-intersections
          sha256sum evidence-a.json > evidence-a.sha256
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-road-cell-intersection-evidence
          path: |
            grand-bruxelles-game/artifacts/discovered-road-cell-intersections/evidence-a.json
            grand-bruxelles-game/artifacts/discovered-road-cell-intersections/evidence-a.sha256
          if-no-files-found: error
