name: Grand Bruxelles Game State Save

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/game_state_save_coordinator.gd"
      - "grand-bruxelles-game/game/scripts/save_game_store.gd"
      - "grand-bruxelles-game/game/tests/game_state_save_coordinator_test.gd"
      - ".github/workflows/grand-bruxelles-game-state-save.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Transactional global save test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/game_state_save_coordinator_test.gd 2>&1 | tee /tmp/test.log
          if grep -E "SCRIPT ERROR|Parse Error:|GAME_STATE_SAVE_COORDINATOR_FAIL" /tmp/test.log; then exit 1; fi
          grep -q "GAME_STATE_SAVE_COORDINATOR_OK" /tmp/test.log
