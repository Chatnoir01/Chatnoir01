name: Grand Bruxelles Game CI

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Python tool syntax
        run: python3 -m py_compile grand-bruxelles-game/tools/collect_wikimedia_refs.py

      - name: Import project headless
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit

      - name: Load main scene headless
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --quit-after 2
