name: Grand Bruxelles Game CI

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Validate Python tools
        run: python3 -m py_compile grand-bruxelles-game/tools/*.py

      - name: Test hero-building runtime selection
        run: |
          python3 -m unittest discover -s grand-bruxelles-game/tests -p 'test_make_runtime_slice.py' -v
          python3 grand-bruxelles-game/tests/test_extract_urbis_3d_hero.py
          python3 grand-bruxelles-game/tests/test_extract_bourse_urbis_surfaces.py
          python3 grand-bruxelles-game/tests/test_bourse_surface_runtime_data.py

      - name: Validate Lambert72 to game conversion
        run: |
          cat > /tmp/lambert72.geojson <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"test"},"geometry":{"type":"LineString","coordinates":[[147868.29422791934,169538.62414926197],[148265.85626087448,170382.79665074125]]}}]}
          JSON
          python3 grand-bruxelles-game/tools/lambert72_to_game_geojson.py \
            /tmp/lambert72.geojson /tmp/game-local.json
          python3 - <<'PY'
          import json, math
          data = json.load(open('/tmp/game-local.json', encoding='utf-8'))
          coords = data['features'][0]['geometry']['coordinates']
          assert abs(coords[0][0]) < 1e-6 and abs(coords[0][1]) < 1e-6, coords[0]
          assert math.isclose(coords[1][0], 397.5620329551457, abs_tol=1e-6), coords[1]
          assert math.isclose(coords[1][1], -844.1725014792755, abs_tol=1e-6), coords[1]
          assert data['grand_bruxelles_coordinate_system']['source_crs'] == 'EPSG:31370'
          print('Lambert72 conversion OK:', coords)
          PY

      - name: Validate committed Brussels runtime data
        run: |
          python3 - <<'PY'
          import json
          osm_path = 'grand-bruxelles-game/data/osm/vertical_slice_01.game.json'
          osm = json.load(open(osm_path, encoding='utf-8'))
          assert osm.get('license') == 'ODbL-1.0', osm.get('license')
          stats = osm['stats']
          assert stats['roads'] >= 100, stats
          assert stats['buildings'] >= 100, stats
          assert stats['drivable_roads'] >= 80, stats
          assert len(osm.get('corridor', {}).get('anchors', [])) >= 4
          print('Committed runtime OSM stats:', stats)

          urbis_path = 'grand-bruxelles-game/data/urbis/midi/midi_runtime.game.json'
          urbis = json.load(open(urbis_path, encoding='utf-8'))
          assert urbis['accuracy']['plan_geometry'] == 'official_urbis'
          assert urbis['stats']['buildings'] >= 2500, urbis['stats']
          assert urbis['stats']['street_surfaces'] >= 1200, urbis['stats']
          print('Committed UrbIS Midi runtime stats:', urbis['stats'])

          bourse_surface_path = 'grand-bruxelles-game/data/urbis/bourse_street_surfaces.game.json'
          bourse_surfaces = json.load(open(bourse_surface_path, encoding='utf-8'))
          assert bourse_surfaces['source']['license'] == 'CC0-1.0'
          assert len(bourse_surfaces['surfaces']) == 3
          assert set(bourse_surfaces['target_inspire_ids']) == {
              'https://databrussels.be/id/streetsurface/22358',
              'https://databrussels.be/id/streetsurface/151495',
              'https://databrussels.be/id/streetsurface/152281',
          }
          assert bourse_surfaces['runtime_approved'] is False
          assert bourse_surfaces['realism_complete'] is False
          print('Committed Bourse surface ids:', bourse_surfaces['target_inspire_ids'])
          PY

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Load Brussels scene headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --quit-after 8 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-run.log; then
            exit 1
          fi
          grep -q "Grand Bruxelles visual pass:" /tmp/godot-run.log
          grep -q "Grand Bruxelles UrbIS hero: bourse" /tmp/godot-run.log
          grep -q "Bourse UrbIS exact surfaces: 3 polygons" /tmp/godot-run.log
          grep -q "Grand Bruxelles UrbIS Midi exact-plan:" /tmp/godot-run.log
          grep -q "Grand Bruxelles hero zone: Bruxelles-Midi Fonsny reconstruction active" /tmp/godot-run.log
          grep -q "Grand Bruxelles UrbIS mask:" /tmp/godot-run.log

      - name: Authoritative Bourse geometry test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/urbis_hero_geometry_test.gd 2>&1 | tee /tmp/urbis-hero.log
          if grep -E "SCRIPT ERROR|Parse Error:|URBIS_HERO_GEOMETRY_FAIL" /tmp/urbis-hero.log; then
            exit 1
          fi
          grep -q "URBIS_HERO_GEOMETRY_OK" /tmp/urbis-hero.log

      - name: Authoritative Bourse surface test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/bourse_surface_runtime_test.gd 2>&1 | tee /tmp/bourse-surface.log
          if grep -E "SCRIPT ERROR|Parse Error:|BOURSE_SURFACE_RUNTIME_FAIL" /tmp/bourse-surface.log; then
            exit 1
          fi
          grep -q "BOURSE_SURFACE_RUNTIME_OK" /tmp/bourse-surface.log

      - name: Dynamic corridor location label test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/location_label_controller_test.gd 2>&1 | tee /tmp/location-label.log
          if grep -E "SCRIPT ERROR|Parse Error:|LOCATION_LABEL_FAIL" /tmp/location-label.log; then
            exit 1
          fi
          grep -q "LOCATION_LABEL_OK" /tmp/location-label.log

      - name: Vehicle enter-exit smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/vehicle_smoke_test.gd 2>&1 | tee /tmp/vehicle-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|VEHICLE_SMOKE_FAIL" /tmp/vehicle-smoke.log; then
            exit 1
          fi
          grep -q "VEHICLE_SMOKE_OK" /tmp/vehicle-smoke.log

      - name: Mission Midi to Grand-Place smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/mission_smoke_test.gd 2>&1 | tee /tmp/mission-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|MISSION_SMOKE_FAIL" /tmp/mission-smoke.log; then
            exit 1
          fi
          grep -q "MISSION_SMOKE_OK" /tmp/mission-smoke.log

      - name: Save-game store integrity test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/save_game_store_test.gd 2>&1 | tee /tmp/save-store.log
          if grep -E "SCRIPT ERROR|Parse Error:|SAVE_STORE_FAIL" /tmp/save-store.log; then
            exit 1
          fi
          grep -q "SAVE_STORE_OK" /tmp/save-store.log
