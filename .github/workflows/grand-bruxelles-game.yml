name: Grand Bruxelles Game CI

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/**"
      - ".github/workflows/grand-bruxelles-game.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Validate Python tools
        run: python3 -m py_compile grand-bruxelles-game/tools/*.py

      - name: Validate OSM traffic metadata conversion
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('grand-bruxelles-game/tools/transform_osm_to_game.py')
          spec = importlib.util.spec_from_file_location('gb_osm', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          raw = {
              'elements': [
                  {
                      'type': 'way',
                      'id': 101,
                      'tags': {
                          'highway': 'primary',
                          'name': 'Testlaan',
                          'lanes': '2',
                          'lanes:forward': '1',
                          'lanes:backward': '1',
                          'oneway': 'yes',
                          'maxspeed': '50',
                      },
                      'geometry': [
                          {'lat': 50.8419, 'lon': 4.3480},
                          {'lat': 50.8420, 'lon': 4.3482},
                      ],
                  },
                  {
                      'type': 'way',
                      'id': 102,
                      'tags': {
                          'highway': 'service',
                          'access': 'private',
                          'maxspeed': '20 mph',
                          'oneway': '-1',
                      },
                      'geometry': [
                          {'lat': 50.8420, 'lon': 4.3482},
                          {'lat': 50.8421, 'lon': 4.3484},
                      ],
                  },
                  {
                      'type': 'node',
                      'id': 201,
                      'lat': 50.8420,
                      'lon': 4.3482,
                      'tags': {'highway': 'traffic_signals', 'direction': 'forward'},
                  },
                  {
                      'type': 'node',
                      'id': 202,
                      'lat': 50.84205,
                      'lon': 4.34825,
                      'tags': {
                          'highway': 'crossing',
                          'crossing': 'traffic_signals',
                          'button_operated': 'yes',
                      },
                  },
              ]
          }
          converted = module.convert(raw, module.DEFAULT_ORIGIN)
          assert converted['format'] == 'grand-bruxelles-osm-v3'
          first, second = converted['roads']
          assert first['oneway'] == 1, first
          assert first['lanes'] == 2, first
          assert first['lanes_forward'] == 1 and first['lanes_backward'] == 1, first
          assert first['maxspeed_kmh'] == 50.0, first
          assert first['drivable'] is True, first
          assert second['oneway'] == -1, second
          assert abs(second['maxspeed_kmh'] - 32.19) < 0.02, second
          assert second['drivable'] is False, second
          controls = converted['traffic_controls']
          assert len(controls) == 2, controls
          signal = next(c for c in controls if c['kind'] == 'traffic_signals')
          crossing = next(c for c in controls if c['kind'] == 'crossing')
          assert signal['direction'] == 'forward', signal
          assert crossing['crossing_signals'] is True, crossing
          assert crossing['button_operated'] is True, crossing
          print('OSM traffic metadata + control conversion OK')
          PY

      - name: Validate committed current traffic pack
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('grand-bruxelles-game/data/traffic')
          manifest = json.load(open(base / 'manifest.json', encoding='utf-8'))
          assert manifest['format'] == 'grand-bruxelles-traffic-pack-v1'
          assert manifest['license'] == 'ODbL-1.0'
          roads = []
          controls = []
          for name in manifest['road_chunks']:
              chunk = json.load(open(base / name, encoding='utf-8'))
              assert chunk['license'] == 'ODbL-1.0'
              roads.extend(chunk['roads'])
          for name in manifest['control_chunks']:
              chunk = json.load(open(base / name, encoding='utf-8'))
              assert chunk['license'] == 'ODbL-1.0'
              controls.extend(chunk['traffic_controls'])
          assert len(roads) == 140, len(roads)
          assert len(controls) == 180, len(controls)
          assert sum(c['kind'] == 'traffic_signals' for c in controls) == 19
          assert sum(c['kind'] == 'give_way' for c in controls) == 14
          assert sum(c['kind'] == 'crossing' for c in controls) == 147
          assert any(r.get('maxspeed_kmh') == 50.0 for r in roads)
          assert any(r.get('maxspeed_kmh') == 20.0 for r in roads)
          assert any(r.get('oneway') == 1 for r in roads)
          print('Current traffic pack OK:', len(roads), 'roads /', len(controls), 'controls')
          PY

      - name: Validate Lambert72 to game conversion
        run: |
          cat > /tmp/lambert72.geojson <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"test"},"geometry":{"type":"LineString","coordinates":[[147868.29422791934,169538.62414926197],[148265.85626087448,170382.79665074125]]}}]}
          JSON
          python3 grand-bruxelles-game/tools/lambert72_to_game_geojson.py \
            /tmp/lambert72.geojson /tmp/game-local.json
          python3 - <<'PY'
          import json, math
          data = json.load(open('/tmp/game-local.json', encoding='utf-8'))
          coords = data['features'][0]['geometry']['coordinates']
          assert abs(coords[0][0]) < 1e-6 and abs(coords[0][1]) < 1e-6, coords[0]
          assert math.isclose(coords[1][0], 397.5620329551457, abs_tol=1e-6), coords[1]
          assert math.isclose(coords[1][1], -844.1725014792755, abs_tol=1e-6), coords[1]
          assert data['grand_bruxelles_coordinate_system']['source_crs'] == 'EPSG:31370'
          print('Lambert72 conversion OK:', coords)
          PY

      - name: Validate committed Brussels runtime data
        run: |
          python3 - <<'PY'
          import json
          osm_path = 'grand-bruxelles-game/data/osm/vertical_slice_01.game.json'
          osm = json.load(open(osm_path, encoding='utf-8'))
          assert osm.get('license') == 'ODbL-1.0', osm.get('license')
          stats = osm['stats']
          assert stats['roads'] >= 100, stats
          assert stats['buildings'] >= 100, stats
          assert stats['drivable_roads'] >= 80, stats
          assert len(osm.get('corridor', {}).get('anchors', [])) >= 4
          print('Committed runtime OSM stats:', stats)

          urbis_path = 'grand-bruxelles-game/data/urbis/midi/midi_runtime.game.json'
          urbis = json.load(open(urbis_path, encoding='utf-8'))
          assert urbis['accuracy']['plan_geometry'] == 'official_urbis'
          assert urbis['stats']['buildings'] >= 2500, urbis['stats']
          assert urbis['stats']['street_surfaces'] >= 1200, urbis['stats']
          print('Committed UrbIS Midi runtime stats:', urbis['stats'])
          PY

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Load Brussels scene headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --quit-after 8 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-run.log; then
            exit 1
          fi
          grep -q "Grand Bruxelles visual pass:" /tmp/godot-run.log
          grep -q "Grand Bruxelles UrbIS Midi exact-plan:" /tmp/godot-run.log
          grep -q "Grand Bruxelles hero zone: Bruxelles-Midi Fonsny reconstruction active" /tmp/godot-run.log
          grep -q "Grand Bruxelles UrbIS mask:" /tmp/godot-run.log
          grep -q "Grand Bruxelles traffic graph:" /tmp/godot-run.log

      - name: Vehicle enter-exit smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/vehicle_smoke_test.gd 2>&1 | tee /tmp/vehicle-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|VEHICLE_SMOKE_FAIL" /tmp/vehicle-smoke.log; then
            exit 1
          fi
          grep -q "VEHICLE_SMOKE_OK" /tmp/vehicle-smoke.log

      - name: Traffic graph routing test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/traffic_graph_test.gd 2>&1 | tee /tmp/traffic-graph.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_GRAPH_FAIL" /tmp/traffic-graph.log; then
            exit 1
          fi
          grep -q "TRAFFIC_GRAPH_OK" /tmp/traffic-graph.log

      - name: Traffic control behavior test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/traffic_control_test.gd 2>&1 | tee /tmp/traffic-control.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CONTROL_FAIL" /tmp/traffic-control.log; then
            exit 1
          fi
          grep -q "TRAFFIC_CONTROL_OK" /tmp/traffic-control.log

      - name: Civil traffic smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/traffic_smoke_test.gd 2>&1 | tee /tmp/traffic-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_SMOKE_FAIL" /tmp/traffic-smoke.log; then
            exit 1
          fi
          grep -q "TRAFFIC_SMOKE_OK" /tmp/traffic-smoke.log

      - name: Mission Midi to Grand-Place smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/mission_smoke_test.gd 2>&1 | tee /tmp/mission-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|MISSION_SMOKE_FAIL" /tmp/mission-smoke.log; then
            exit 1
          fi
          grep -q "MISSION_SMOKE_OK" /tmp/mission-smoke.log
