name: Grand Bruxelles Gate-8 Bind Origin Convention Diagnostic

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_convention_diagnostic_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-bind-origin-convention-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-origin-convention-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-bind-origin-convention"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Lock fail-closed bind-origin contract
        shell: bash
        run: |
          set -euo pipefail
          P=grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_convention_diagnostic_test.gd
          grep -q 'EXPECTED_BONES := 53' "$P"
          grep -q 'EXPECTED_SKINNED_MESHES := 8' "$P"
          grep -q 'COMMON_TRANSLATION_EPS_M := 0.00001' "$P"
          grep -q 'COMMON_ROTATION_EPS_DEG := 0.01' "$P"
          grep -q 'COMPENSATED_RECONSTRUCTION_EPS_M := 0.001' "$P"
          grep -q 'NONIDENTITY_TRANSLATION_MIN_M := 0.05' "$P"
          grep -q 'common_inverse := reference_product.affine_inverse()' "$P"
          grep -q 'global_rest(bone_idx) \* skin.get_bind_pose(bind_idx)' "$P"
          grep -q '"retarget_applied": false' "$P"
          grep -q '"production_authorized": false' "$P"
          grep -q '"activation_ready": false' "$P"
          grep -q '"adoption_ready": false' "$P"

      - name: Download immutable Gate-8 target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-target && mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          TARGET="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8BindOriginConventionDiagnostic"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_convention_diagnostic_test.gd "$PROJECT/game/tests/"
          ! grep -q '^\[autoload\]' "$PROJECT/project.godot"

      - name: Import target under Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/bind-origin-import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/bind-origin-import.log

      - name: Measure imported bind-origin convention
        id: diagnostic
        shell: bash
        run: |
          set +e
          timeout 240s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_bind_origin_convention_diagnostic_test.gd 2>&1 | tee /tmp/bind-origin.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test -s "$PROJECT/gate8_variant01_bind_origin_convention_result.json"
          cp "$PROJECT/gate8_variant01_bind_origin_convention_result.json" /tmp/bind-origin-result.json

      - name: Validate bind-origin evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/bind-origin-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/bind-origin-result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-bind-origin-convention-diagnostic-v1'
          assert r['candidate_variant']==1
          assert r['target_bone_count']==53
          assert r['skinned_mesh_count']==8
          assert r['covered_bone_count']==53
          assert r['bind_observations'] >= 53
          assert r['common_transform_consistent'] is True
          assert r['compensated_reconstruction_valid'] is True
          assert r['nonidentity_origin_present'] is True
          assert r['max_product_translation_delta_m'] <= r['common_translation_epsilon_m']
          assert r['max_product_rotation_delta_deg'] <= r['common_rotation_epsilon_deg']
          assert r['compensated_rest_reconstruction_max_error_m'] <= r['compensated_reconstruction_epsilon_m']
          assert r['uncompensated_rest_reconstruction_max_error_m'] >= r['nonidentity_translation_min_m']
          assert r['diagnostic_state']=='COMMON_BIND_ORIGIN_CONVENTION_CONFIRMED'
          assert r['failures']==[]
          assert r['retarget_applied'] is False and r['target_skin_modified'] is False and r['target_rest_modified'] is False
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          Path('/tmp/bind-origin-summary.txt').write_text(
              'state=%s\nbinds=%d\nbones=%d\nreference_translation_m=%.12f\nproduct_spread_m=%.12f\nproduct_spread_deg=%.12f\nuncompensated_error_m=%.12f\ncompensated_error_m=%.12f\n' % (
                  r['diagnostic_state'], r['bind_observations'], r['covered_bone_count'],
                  r['reference_product_translation_m'], r['max_product_translation_delta_m'],
                  r['max_product_rotation_delta_deg'], r['uncompensated_rest_reconstruction_max_error_m'],
                  r['compensated_rest_reconstruction_max_error_m']))
          print('GATE8_BIND_ORIGIN_RESULT_OK state=%s binds=%d bones=%d' % (r['diagnostic_state'], r['bind_observations'], r['covered_bone_count']))
          PY
          grep -q '^GATE8_BIND_ORIGIN state=COMMON_BIND_ORIGIN_CONVENTION_CONFIRMED' /tmp/bind-origin.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/bind-origin.log
          STATUS="${{ steps.diagnostic.outputs.status }}"
          case "$STATUS" in
            0) ;;
            1)
              echo "Godot returned status=1 after complete clean semantic bind-origin evidence; accepting only after all JSON/log gates passed."
              ;;
            *)
              echo "Unexpected diagnostic process status: $STATUS" >&2
              exit 1
              ;;
          esac
          printf 'process_exit_status=%s\n' "$STATUS" >> /tmp/bind-origin-summary.txt

      - name: Upload bind-origin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-bind-origin-convention-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/bind-origin-result.json
            /tmp/bind-origin-summary.txt
            /tmp/bind-origin.log
            /tmp/bind-origin-import.log
            /tmp/godot-version.txt
            /tmp/npc_gate_01.sha256
          if-no-files-found: error
