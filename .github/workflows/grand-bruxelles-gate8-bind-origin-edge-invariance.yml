name: Grand Bruxelles Gate-8 Bind Origin Edge Invariance

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_edge_invariance_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-bind-origin-edge-invariance.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-origin-edge-invariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-bind-origin-edge-invariance"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Lock fail-closed edge-invariance contract
        shell: bash
        run: |
          set -euo pipefail
          P=grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_edge_invariance_test.gd
          grep -q 'EXPECTED_BONES := 53' "$P"
          grep -q 'EXPECTED_SKINNED_MESHES := 8' "$P"
          grep -q 'EDGE_LENGTH_EPS_M := 0.000001' "$P"
          grep -q 'NONIDENTITY_TRANSLATION_MIN_M := 0.05' "$P"
          grep -q 'common_inverse := reference_product.affine_inverse()' "$P"
          grep -q '"retarget_applied": false' "$P"
          grep -q '"production_authorized": false' "$P"
          grep -q '"activation_ready": false' "$P"
          grep -q '"adoption_ready": false' "$P"

      - name: Download immutable Gate-8 target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-target && mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          TARGET="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8BindOriginEdgeInvariance"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_edge_invariance_test.gd "$PROJECT/game/tests/"
          ! grep -q '^\[autoload\]' "$PROJECT/project.godot"

      - name: Import target under Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/edge-invariance-import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/edge-invariance-import.log

      - name: Measure bind-origin edge invariance
        id: diagnostic
        shell: bash
        run: |
          set +e
          timeout 240s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_bind_origin_edge_invariance_test.gd 2>&1 | tee /tmp/edge-invariance.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test -s "$PROJECT/gate8_variant01_bind_origin_edge_invariance_result.json"
          cp "$PROJECT/gate8_variant01_bind_origin_edge_invariance_result.json" /tmp/edge-invariance-result.json

      - name: Validate edge-invariance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/edge-invariance-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/edge-invariance-result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-bind-origin-edge-invariance-v1'
          assert r['candidate_variant']==1
          assert r['target_bone_count']==53
          assert r['skinned_mesh_count']==8
          assert r['bind_observations'] >= 53
          assert r['reference_product_translation_m'] >= 0.05
          assert r['max_product_translation_delta_m'] <= 0.00001
          assert r['max_product_rotation_delta_deg'] <= 0.01
          assert r['edge_observations'] > 0
          assert r['max_edge_length_delta_m'] <= 0.000001
          assert r['diagnostic_state']=='COMMON_BIND_ORIGIN_EDGE_INVARIANT'
          assert r['failures']==[]
          assert r['retarget_applied'] is False and r['target_skin_modified'] is False and r['target_rest_modified'] is False
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          Path('/tmp/edge-invariance-summary.txt').write_text('state=%s\nedges=%d\nmax_edge_delta_m=%.12f\ncommon_origin_m=%.12f\n' % (r['diagnostic_state'], r['edge_observations'], r['max_edge_length_delta_m'], r['reference_product_translation_m']))
          print('GATE8_BIND_ORIGIN_EDGE_INVARIANCE_OK edges=%d max_delta=%.12f' % (r['edge_observations'], r['max_edge_length_delta_m']))
          PY
          grep -q '^GATE8_BIND_ORIGIN_EDGE_INVARIANCE state=COMMON_BIND_ORIGIN_EDGE_INVARIANT' /tmp/edge-invariance.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/edge-invariance.log
          STATUS="${{ steps.diagnostic.outputs.status }}"
          case "$STATUS" in
            0) ;;
            1) echo "Godot returned status=1 after clean semantic evidence; accepting only after JSON/log gates passed." ;;
            *) echo "Unexpected diagnostic process status: $STATUS" >&2; exit 1 ;;
          esac
          printf 'process_exit_status=%s\n' "$STATUS" >> /tmp/edge-invariance-summary.txt

      - name: Upload edge-invariance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-bind-origin-edge-invariance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/edge-invariance-result.json
            /tmp/edge-invariance-summary.txt
            /tmp/edge-invariance.log
            /tmp/edge-invariance-import.log
            /tmp/godot-version.txt
            /tmp/npc_gate_01.sha256
          if-no-files-found: error
