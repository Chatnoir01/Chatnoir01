name: Grand Bruxelles Gate-8 Bind-Origin-Normalized Skin Space

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_skin_space_deformation_diagnostic_test.gd"
      - "grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_normalized_skin_space_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-bind-origin-normalized-skin-space.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bind-origin-normalized-skin-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-bind-origin-normalized-skin-space"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Lock normalized diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          P=grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_normalized_skin_space_test.gd
          grep -q 'COMMON_TRANSLATION_EPS_M := 0.00001' "$P"
          grep -q 'COMMON_ROTATION_EPS_DEG := 0.01' "$P"
          grep -q 'NONIDENTITY_TRANSLATION_MIN_M := 0.05' "$P"
          grep -q 'EXPECTED_MIN_ABSOLUTE_EDGE_CHANGE_M := 0.5' "$P"
          grep -q 'extends "res://game/tests/gate8_variant01_skin_space_deformation_diagnostic_test.gd"' "$P"
          grep -q '_common_inverse \* vertices\[vertex_idx\]' "$P"
          grep -q '"max_absolute_edge"' "$P"
          grep -q '"vertex_a_influences"' "$P"
          grep -q '"vertex_b_influences"' "$P"

      - name: Download pinned source and immutable target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-Normalized-Skin-Space/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']
              if member not in z.namelist(): raise SystemExit('missing pinned animation GLB')
              Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          rm -rf /tmp/gate8-target && mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          TARGET="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8BindOriginNormalizedSkinSpace"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_skin_space_deformation_diagnostic_test.gd "$PROJECT/game/tests/"
          cp grand-bruxelles-game/game/tests/gate8_variant01_bind_origin_normalized_skin_space_test.gd "$PROJECT/game/tests/"
          ! grep -q '^\[autoload\]' "$PROJECT/project.godot"

      - name: Import exact assets under Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/normalized-skin-space-import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/normalized-skin-space-import.log

      - name: Measure normalized worst-edge deformation
        id: diagnostic
        shell: bash
        run: |
          set +e
          timeout 300s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_bind_origin_normalized_skin_space_test.gd 2>&1 | tee /tmp/normalized-skin-space.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          test -s "$PROJECT/gate8_variant01_bind_origin_normalized_skin_space_result.json"
          cp "$PROJECT/gate8_variant01_bind_origin_normalized_skin_space_result.json" /tmp/normalized-skin-space-result.json

      - name: Validate normalized localization evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/normalized-skin-space-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/normalized-skin-space-result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-bind-origin-normalized-skin-space-v1'
          assert r['candidate_variant']==1 and r['reviewed_role_count']==22
          assert r['bind_origin_normalized_baseline'] is True
          assert r['common_bind_origin_translation_m'] >= 0.05
          assert r['max_product_translation_delta_m'] <= 0.00001
          assert r['max_product_rotation_delta_deg'] <= 0.01
          assert r['diagnostic_state']=='SKIN_SPACE_DEFORMATION_OUTLIER'
          assert r['max_edge_stretch_ratio'] > 3.0
          assert r['max_absolute_edge_length_change_m'] >= r['expected_min_absolute_edge_change_m'] >= 0.5
          assert r['max_absolute_edge_clip'] in {'Jog_Fwd','Sprint'}
          edge=r['max_absolute_edge']
          assert edge['absolute_edge_length_change_m'] == r['max_absolute_edge_length_change_m']
          assert edge['vertex_a'] >= 0 and edge['vertex_b'] >= 0
          assert edge['vertex_a_influences'] and edge['vertex_b_influences']
          assert all(x['weight'] > 0 for x in edge['vertex_a_influences'])
          assert all(x['weight'] > 0 for x in edge['vertex_b_influences'])
          assert r['failures']==[]
          assert r['retarget_applied'] is False and r['target_skin_modified'] is False and r['target_rest_modified'] is False
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          Path('/tmp/normalized-skin-space-summary.txt').write_text(
              'state=%s\nclip=%s\nmax_abs_edge_change_m=%.9f\ncommon_origin_m=%.9f\n' % (
                  r['diagnostic_state'], r['max_absolute_edge_clip'], r['max_absolute_edge_length_change_m'], r['common_bind_origin_translation_m']))
          print('GATE8_NORMALIZED_SKIN_SPACE_OK clip=%s abs_change_m=%.6f' % (r['max_absolute_edge_clip'],r['max_absolute_edge_length_change_m']))
          PY
          grep -q '^GATE8_SKIN_SPACE state=SKIN_SPACE_DEFORMATION_OUTLIER' /tmp/normalized-skin-space.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/normalized-skin-space.log
          STATUS="${{ steps.diagnostic.outputs.status }}"
          case "$STATUS" in
            0) ;;
            1) echo "Godot returned clean status=1 after semantic normalized skin-space evidence; accepting only after JSON/log gates passed." ;;
            *) echo "Unexpected diagnostic process status: $STATUS" >&2; exit 1 ;;
          esac
          printf 'process_exit_status=%s\n' "$STATUS" >> /tmp/normalized-skin-space-summary.txt

      - name: Upload normalized localization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-bind-origin-normalized-skin-space-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/normalized-skin-space-result.json
            /tmp/normalized-skin-space-summary.txt
            /tmp/normalized-skin-space.log
            /tmp/normalized-skin-space-import.log
            /tmp/godot-version.txt
            /tmp/animation-source.sha256
            /tmp/npc_gate_01.sha256
          if-no-files-found: error
