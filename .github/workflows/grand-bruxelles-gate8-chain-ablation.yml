name: Grand Bruxelles Gate-8 Chain Ablation

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_chain_ablation_witness.gd"
      - ".github/workflows/grand-bruxelles-gate8-chain-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  chain-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-chain-ablation"
      GATE8_CHAIN_ABLATION_DIR: "/tmp/gate8-chain-ablation-frames"

    steps:
      - uses: actions/checkout@v4

      - name: Lock ablation contract
        run: |
          set -euo pipefail
          P=grand-bruxelles-game/game/tests/gate8_variant01_chain_ablation_witness.gd
          grep -q 'SAMPLE_FRACTION := 0.35' "$P"
          grep -q '"id":"torso"' "$P"
          grep -q '"id":"legs"' "$P"
          grep -q '"id":"arms"' "$P"
          grep -q '"id":"torso-legs"' "$P"
          grep -q '"id":"torso-arms"' "$P"
          grep -q '"id":"all"' "$P"
          grep -q 'source_world_pose_basis \* source_world_rest_basis.inverse()' "$P"
          grep -q '"production_authorized":false' "$P"
          grep -q '"runtime_population_changed":false' "$P"
          ! grep -q 'run_alias_selected.*Jog_Fwd\|run_alias_selected.*Sprint' "$P"

      - name: Download pinned CC0 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$ANIM_URL" -o /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          T="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"; test -n "$T"; cp "$T" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install Godot 4.7.1 and software renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"; test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt; grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt; echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated ablation project
        run: |
          set -euo pipefail
          rm -rf "$PROJECT" "$GATE8_CHAIN_ABLATION_DIR"; mkdir -p "$PROJECT/assets" "$PROJECT/game/tests" "$GATE8_CHAIN_ABLATION_DIR"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8ChainAblation"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_chain_ablation_witness.gd "$PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/import.log

      - name: Render chain ablation on real target
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
        run: |
          set -euo pipefail
          timeout 240s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --path "$PROJECT" --rendering-method gl_compatibility --script res://game/tests/gate8_variant01_chain_ablation_witness.gd 2>&1 | tee /tmp/chain-ablation.log
          test -s "$PROJECT/gate8_variant01_chain_ablation_result.json"
          cp "$PROJECT/gate8_variant01_chain_ablation_result.json" /tmp/chain-ablation.json
          python - <<'PY'
          import json, math, struct
          from pathlib import Path
          r=json.load(open('/tmp/chain-ablation.json'))
          assert r['format']=='grand-bruxelles-gate8-variant01-chain-ablation-v1'
          assert r['candidate_variant']==1 and r['clip']=='Jog_Fwd' and abs(float(r['sample_fraction'])-0.35)<1e-9
          assert int(r['reviewed_roles'])==22 and int(r['capture_count'])==7
          assert r['purpose']=='visual_chain_ablation_only'
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['runtime_population_changed'] is False and r['visual_approval_claimed'] is False
          assert r['selection_state']=='CHAIN_ABLATION_REVIEW_REQUIRED' and not r['failures']
          assert set(r['variants'])=={'rest','torso','legs','arms','torso-legs','torso-arms','all'}
          for vid,row in r['variants'].items():
              assert math.isfinite(float(row['peak_target_global_delta_deg'])) and math.isfinite(float(row['grounding_correction_m']))
          frames=sorted(Path('/tmp/gate8-chain-ablation-frames').glob('*.png')); assert len(frames)==7
          for frame in frames:
              data=frame.read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n' and data[12:16]==b'IHDR'; assert struct.unpack('>II',data[16:24])==(1280,720)
          print('GATE8_CHAIN_ABLATION_RESULT_OK variants=7 frames=7 production_authorized=false')
          PY
          grep -q '^GATE8_CHAIN_ABLATION_OK review_required=true production_authorized=false$' /tmp/chain-ablation.log

      - name: Stage evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-chain-ablation-evidence; mkdir -p /tmp/gate8-chain-ablation-evidence
          for f in /tmp/import.log /tmp/chain-ablation.log /tmp/chain-ablation.json /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt; do if [ -s "$f" ]; then cp "$f" /tmp/gate8-chain-ablation-evidence/; fi; done
          if compgen -G "$GATE8_CHAIN_ABLATION_DIR/*.png" >/dev/null; then cp "$GATE8_CHAIN_ABLATION_DIR"/*.png /tmp/gate8-chain-ablation-evidence/; fi
          sha256sum /tmp/gate8-chain-ablation-evidence/* | sort -k2 | tee /tmp/gate8-chain-ablation-evidence/sha256.txt

      - name: Prove repository untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/git-status.txt; test ! -s /tmp/git-status.txt

      - name: Upload ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-chain-ablation
          path: /tmp/gate8-chain-ablation-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
