name: Grand Bruxelles Gate-8 MHCLO Spatial Fit

on:
  push:
    branches: ["npc/gate8-mhclo-spatial-fit-7c0ce9c"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-mhclo-spatial-fit.yml"
      - "grand-bruxelles-game/game/tests/gate8_variant01_mhclo_spatial_fit_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BASE_MAIN_SHA: "7c0ce9c5bd77b29e2ffe2ce337e061ad6d95768b"
  SOURCE_RUN_ID: "32552758284"
  SOURCE_HEAD_SHA: "afcb7b352ed054d98fdf83eae3333ec82c814b3e"
  ASSET_PACK_ARTIFACT_ID: "9710539659"
  ASSET_PACK_ARTIFACT_DIGEST: "sha256:ce6fe32adf20838b853ef6f3e80f47bee194f21565cf4d35cad8f2c02f2941da"
  ASSET_PACK_SHA256: "6b1d673e4c1fd169372d3a74fe174d9c185069c1f55ff6bf6b224f6655e4b67a"
  ASSET_PACK_SIZE_BYTES: "81255948"
  GATE8_SOURCE_DIR: "/tmp/gate8-spatial-source"
  GATE8_SPATIAL_FIT_RESULT: "/tmp/gate8-mhclo-spatial-fit/mhclo-spatial-fit-result.json"
  HOME: "/tmp/grand-bruxelles-blender-home"

jobs:
  mhclo-spatial-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and two-file Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          test -f .github/workflows/grand-bruxelles-gate8-source-neighborhood-contract.yml
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-mhclo-spatial-fit.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant01_mhclo_spatial_fit_probe.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 -m py_compile grand-bruxelles-game/game/tests/gate8_variant01_mhclo_spatial_fit_probe.py

      - name: Materialize exact pinned Gate-8 generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE8_SOURCE_DIR" /tmp/gate8-mhclo-spatial-fit
          for path in \
            grand-bruxelles-game/tools/generate_mpfb_gate8_glbs.py \
            grand-bruxelles-game/tools/generate_mpfb_gate8_export_ready_glbs.py \
            grand-bruxelles-game/tools/fetch_mpfb_2017.py
          do
            out="$GATE8_SOURCE_DIR/$(basename "$path")"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${SOURCE_HEAD_SHA}" --jq .content | tr -d '\n' | base64 -d > "$out"
            test -s "$out"
          done
          grep -q 'ExportService.create_character_copy' "$GATE8_SOURCE_DIR/generate_mpfb_gate8_export_ready_glbs.py"

      - name: Download exact CC0 Gate-8 source asset pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}" > /tmp/gate8-mhclo-spatial-fit/asset-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-mhclo-spatial-fit/asset-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['ASSET_PACK_ARTIFACT_DIGEST']
          assert int(a['workflow_run']['id'])==int(os.environ['SOURCE_RUN_ID'])
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}/zip" > /tmp/gate8-mhclo-spatial-fit/asset.zip
          mkdir -p /tmp/gate8-mhclo-spatial-fit/asset
          unzip -q /tmp/gate8-mhclo-spatial-fit/asset.zip -d /tmp/gate8-mhclo-spatial-fit/asset
          PACK="$(find /tmp/gate8-mhclo-spatial-fit/asset -type f -name 'makehuman_gate8_system_assets_cc0.zip' -print -quit)"
          test -n "$PACK"
          test "$(stat -c '%s' "$PACK")" = "$ASSET_PACK_SIZE_BYTES"
          test "$(sha256sum "$PACK" | awk '{print $1}')" = "$ASSET_PACK_SHA256"
          printf '%s\n' "$PACK" > /tmp/gate8-mhclo-spatial-fit/asset-pack-path.txt

      - name: Acquire Blender 4.2.23 and MPFB 2.0.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" /tmp/gb-blender /tmp/gate8-mhclo-spatial-fit/blender-extensions
          ARCHIVE=blender-4.2.23-linux-x64.tar.xz
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            "https://download.blender.org/release/Blender4.2/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 \
            "https://download.blender.org/release/Blender4.2/blender-4.2.23.sha256" -o /tmp/blender.sha256
          grep " ${ARCHIVE}$" /tmp/blender.sha256 > /tmp/blender-linux.sha256
          (cd /tmp && sha256sum --check blender-linux.sha256)
          tar -xJf "/tmp/${ARCHIVE}" -C /tmp/gb-blender
          BLENDER_BIN="$(find /tmp/gb-blender -mindepth 2 -maxdepth 2 -type f -name blender -perm -111 | head -n 1)"
          "$BLENDER_BIN" --version | tee /tmp/gate8-mhclo-spatial-fit/blender-version.txt
          grep -q '^Blender 4\.2\.23' /tmp/gate8-mhclo-spatial-fit/blender-version.txt
          printf '%s\n' "$BLENDER_BIN" > /tmp/gate8-mhclo-spatial-fit/blender-bin.txt
          python3 "$GATE8_SOURCE_DIR/fetch_mpfb_2017.py" \
            --output /tmp/gate8-mhclo-spatial-fit/mpfb.zip \
            --manifest /tmp/gate8-mhclo-spatial-fit/mpfb.manifest.json \
            --retries 3 | tee /tmp/gate8-mhclo-spatial-fit/mpfb-fetch.log
          grep -q '^MPFB_2017_FETCH_OK ' /tmp/gate8-mhclo-spatial-fit/mpfb-fetch.log
          "$BLENDER_BIN" --background --command extension repo-add gb_ci \
            --name "Grand Bruxelles CI" \
            --directory /tmp/gate8-mhclo-spatial-fit/blender-extensions --clear-all
          "$BLENDER_BIN" --background --command extension install-file \
            --repo gb_ci --enable /tmp/gate8-mhclo-spatial-fit/mpfb.zip \
            | tee /tmp/gate8-mhclo-spatial-fit/mpfb-install.txt

      - name: Measure exact variant01 MHCLO spatial fit
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(cat /tmp/gate8-mhclo-spatial-fit/blender-bin.txt)"
          PACK="$(cat /tmp/gate8-mhclo-spatial-fit/asset-pack-path.txt)"
          mkdir -p /tmp/gate8-mhclo-spatial-fit/glbs
          "$BLENDER_BIN" --background --offline-mode \
            --python grand-bruxelles-game/game/tests/gate8_variant01_mhclo_spatial_fit_probe.py \
            -- --asset-pack "$PACK" --output-dir /tmp/gate8-mhclo-spatial-fit/glbs \
            | tee /tmp/gate8-mhclo-spatial-fit/probe.log
          test -s "$GATE8_SPATIAL_FIT_RESULT"
          cat "$GATE8_SPATIAL_FIT_RESULT"

      - name: Verify RED-first measurement envelope only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['GATE8_SPATIAL_FIT_RESULT']))
          assert r['format']=='grand-bruxelles-gate8-variant01-mhclo-spatial-fit-v1'
          assert r['diagnostic_state']=='SPATIAL_FIT_MEASURED_RED_FIRST'
          assert r['next_safe_axis']=='REVIEW_MHCLO_SPATIAL_FIT_ARTIFACT'
          assert r['source_head_sha']==os.environ['SOURCE_HEAD_SHA']
          assert r['sportsuit_vertex_count']==1797
          assert r['body_vertex_count']==19158
          assert r['source_edge']==[486,601]
          assert set(r['vertex_records'])=={'377','378','379','486','599','601','615','864'}
          assert len(r['edge_records'])==7
          assert r['smooth_edge_summary']['count']==4
          assert r['cliff_edge_summary']['count']==3
          assert all(edge['native_edge'] for edge in r['edge_records'])
          for key in ['canonical_asset_mutation','canonical_generator_mutation','runtime_npc_mutation','reweight_allowed','production_activation_allowed','visual_approval_allowed']:
              assert r[key] is False, key
          print('GATE8_MHCLO_SPATIAL_FIT_MEASURED',
                'smooth=',r['smooth_edge_summary'],
                'cliff=',r['cliff_edge_summary'])
          PY

      - name: Upload RED-first spatial-fit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-mhclo-spatial-fit-red-first
          path: |
            /tmp/gate8-mhclo-spatial-fit/mhclo-spatial-fit-result.json
            /tmp/gate8-mhclo-spatial-fit/probe.log
            /tmp/gate8-mhclo-spatial-fit/asset-artifact.json
            /tmp/gate8-mhclo-spatial-fit/blender-version.txt
            /tmp/gate8-mhclo-spatial-fit/mpfb.manifest.json
            /tmp/gate8-mhclo-spatial-fit/mpfb-fetch.log
            /tmp/gate8-mhclo-spatial-fit/mpfb-install.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Require reviewed interpretation before any source correction
        shell: bash
        run: |
          set -euo pipefail
          echo 'RED_EXPECTED: spatial-fit bytes measured; review cliff-vs-smooth geometry before any .mhclo/reweight mutation' >&2
          exit 1

      - name: Prove repository stayed clean
        if: always()
        run: test -z "$(git status --porcelain)"
