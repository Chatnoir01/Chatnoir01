name: Grand Bruxelles Gate-8 Native Retarget Preflight

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_preflight_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-native-retarget-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-retarget-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-native-retarget-preflight"

    steps:
      - uses: actions/checkout@v4

      - name: Verify native retarget source semantics and local contract
        run: |
          set -euo pipefail
          TEST=grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_preflight_test.gd
          grep -q 'RetargetModifier3D.new()' "$TEST"
          grep -q 'BLOCKED_NEEDS_CANONICAL_BONE_NAMES' "$TEST"
          grep -q 'set_position_enabled(false)' "$TEST"
          grep -q 'set_rotation_enabled(true)' "$TEST"
          grep -q 'set_scale_enabled(false)' "$TEST"
          curl -L --fail --retry 3 https://raw.githubusercontent.com/godotengine/godot/4.7.1-stable/scene/3d/retarget_modifier_3d.cpp -o /tmp/retarget_modifier_3d.cpp
          test "$(grep -c 'find_bone(E)' /tmp/retarget_modifier_3d.cpp)" -ge 2
          grep -q 'PackedStringArray bone_names = profile->get_bone_names()' /tmp/retarget_modifier_3d.cpp
          sha256sum /tmp/retarget_modifier_3d.cpp > /tmp/godot-retarget-source.sha256

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-Native-Retarget-Preflight/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY

      - name: Download immutable helper-clean Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"; "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated project and import real assets
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"; mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01NativeRetargetPreflight"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_preflight_test.gd "$ISOLATED_PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-native-import.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-native-import.log

      - name: Measure direct native compatibility on real skeletons
        run: |
          set -euo pipefail
          timeout 180s "$GODOT" --headless --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_native_retarget_preflight_test.gd 2>&1 | tee /tmp/gate8-native-preflight.log
          test -s "$ISOLATED_PROJECT/gate8_variant01_native_retarget_preflight_result.json"
          cp "$ISOLATED_PROJECT/gate8_variant01_native_retarget_preflight_result.json" /tmp/gate8_variant01_native_retarget_preflight_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/gate8_variant01_native_retarget_preflight_result.json').read_text())
          assert r['reviewed_roles']==22
          assert r['retarget_modifier_available'] is True
          assert r['direct_native_ready'] is False
          assert r['heteronymous_role_count'] > 0
          assert r['selection_state']=='BLOCKED_NEEDS_CANONICAL_BONE_NAMES'
          assert r['position_enabled'] is False and r['rotation_enabled'] is True and r['scale_enabled'] is False
          assert r['run_alias_selected']=='' and r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert not r['failures']
          print('GATE8_NATIVE_RETARGET_PREFLIGHT_CONTRACT_OK roles=22 direct_native_ready=false production_authorized=false')
          PY

      - name: Upload native-retarget preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-native-retarget-preflight
          if-no-files-found: error
          path: |
            /tmp/gate8-native-import.log
            /tmp/gate8-native-preflight.log
            /tmp/gate8_variant01_native_retarget_preflight_result.json
            /tmp/godot-version.txt
            /tmp/godot-retarget-source.sha256
