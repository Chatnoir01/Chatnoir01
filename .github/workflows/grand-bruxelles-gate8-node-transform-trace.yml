name: Grand Bruxelles Gate-8 Node Transform Trace

on:
  push:
    branches: ["npc/gate8-node-transform-trace-5176398"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-node-transform-trace.yml"
      - "grand-bruxelles-game/game/tests/gate8_node_transform_trace_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  node-transform-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_MAIN_SHA: "5176398ac75b58529f04b1622837eb34f4cfc59f"
      SOURCE_RUN_ID: "32552758284"
      SOURCE_HEAD_SHA: "afcb7b352ed054d98fdf83eae3333ec82c814b3e"
      ASSET_PACK_ARTIFACT_ID: "9710539659"
      ASSET_PACK_ARTIFACT_DIGEST: "sha256:ce6fe32adf20838b853ef6f3e80f47bee194f21565cf4d35cad8f2c02f2941da"
      ASSET_PACK_SHA256: "6b1d673e4c1fd169372d3a74fe174d9c185069c1f55ff6bf6b224f6655e4b67a"
      ASSET_PACK_SIZE_BYTES: "81255948"
      SOURCE_MAP_ARTIFACT_ID: "9714716721"
      SOURCE_MAP_ARTIFACT_DIGEST: "sha256:385c93e6ba1447459107dbbe5eec8f7d14b88a8afeb77b9d4e75aab69ad76826"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GATE8_SOURCE_DIR: "/tmp/gate8-source"
      GATE8_TRANSFORM_RESULT: "/tmp/gate8-transform/node-transform-result.json"
      HOME: "/tmp/grand-bruxelles-blender-home"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-node-transform-trace.yml' \
            'grand-bruxelles-game/game/tests/gate8_node_transform_trace_probe.py' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          python3 -m py_compile grand-bruxelles-game/game/tests/gate8_node_transform_trace_probe.py

      - name: Pin predecessor source-map evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-transform/predecessor
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_MAP_ARTIFACT_ID}" > /tmp/gate8-transform/predecessor-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-transform/predecessor-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['SOURCE_MAP_ARTIFACT_DIGEST']
          assert a['workflow_run']['head_sha']=='a89f7c50371094f83e59d7ab809955396eb9e930'
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_MAP_ARTIFACT_ID}/zip" > /tmp/gate8-transform/predecessor.zip
          unzip -q /tmp/gate8-transform/predecessor.zip -d /tmp/gate8-transform/predecessor
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/gate8-transform/predecessor/export-source-map-result.json'))
          c=r['source_map']['candidates'][0]
          assert r['diagnostic_state']=='SERIALIZED_EDGE_POSITION_MAPPING_UNRESOLVED'
          assert c['gltf_edge']==[538,681]
          assert c['prepared_edge']==[486,601]
          assert c['prepared_pair_is_native_edge'] is True
          assert abs(c['a_map']['position_distance']-0.0043631792068481445)<1e-9
          assert abs(c['b_map']['position_distance']-0.0043631792068481445)<1e-9
          PY

      - name: Materialize exact source generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE8_SOURCE_DIR" /tmp/gate8-transform
          for path in \
            grand-bruxelles-game/tools/generate_mpfb_gate8_glbs.py \
            grand-bruxelles-game/tools/generate_mpfb_gate8_export_ready_glbs.py \
            grand-bruxelles-game/tools/fetch_mpfb_2017.py
          do
            out="$GATE8_SOURCE_DIR/$(basename "$path")"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${SOURCE_HEAD_SHA}" --jq .content | tr -d '\n' | base64 -d > "$out"
            test -s "$out"
          done

      - name: Download exact Gate-8 source asset pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}" > /tmp/gate8-transform/asset-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-transform/asset-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['ASSET_PACK_ARTIFACT_DIGEST']
          assert int(a['workflow_run']['id'])==int(os.environ['SOURCE_RUN_ID'])
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}/zip" > /tmp/gate8-transform/asset.zip
          mkdir -p /tmp/gate8-transform/asset
          unzip -q /tmp/gate8-transform/asset.zip -d /tmp/gate8-transform/asset
          PACK="$(find /tmp/gate8-transform/asset -type f -name 'makehuman_gate8_system_assets_cc0.zip' -print -quit)"
          test -n "$PACK"
          test "$(stat -c '%s' "$PACK")" = "$ASSET_PACK_SIZE_BYTES"
          test "$(sha256sum "$PACK" | awk '{print $1}')" = "$ASSET_PACK_SHA256"
          printf '%s\n' "$PACK" > /tmp/gate8-transform/asset-pack-path.txt

      - name: Acquire Blender 4.2.23 and MPFB 2.0.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" /tmp/gb-blender /tmp/gate8-transform/blender-extensions
          ARCHIVE=blender-4.2.23-linux-x64.tar.xz
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/blender-4.2.23.sha256" -o /tmp/blender.sha256
          grep " ${ARCHIVE}$" /tmp/blender.sha256 > /tmp/blender-linux.sha256
          (cd /tmp && sha256sum --check blender-linux.sha256)
          tar -xJf "/tmp/${ARCHIVE}" -C /tmp/gb-blender
          BLENDER_BIN="$(find /tmp/gb-blender -mindepth 2 -maxdepth 2 -type f -name blender -perm -111 | head -n 1)"
          "$BLENDER_BIN" --version | tee /tmp/gate8-transform/blender-version.txt
          grep -q '^Blender 4\.2\.23' /tmp/gate8-transform/blender-version.txt
          printf '%s\n' "$BLENDER_BIN" > /tmp/gate8-transform/blender-bin.txt
          python3 "$GATE8_SOURCE_DIR/fetch_mpfb_2017.py" --output /tmp/gate8-transform/mpfb.zip --manifest /tmp/gate8-transform/mpfb.manifest.json --retries 3 | tee /tmp/gate8-transform/mpfb-fetch.log
          grep -q '^MPFB_2017_FETCH_OK ' /tmp/gate8-transform/mpfb-fetch.log
          "$BLENDER_BIN" --background --command extension repo-add gb_ci --name "Grand Bruxelles CI" --directory /tmp/gate8-transform/blender-extensions --clear-all
          "$BLENDER_BIN" --background --command extension install-file --repo gb_ci --enable /tmp/gate8-transform/mpfb.zip | tee /tmp/gate8-transform/mpfb-install.txt

      - name: Regenerate exact GLB and trace node transform
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(cat /tmp/gate8-transform/blender-bin.txt)"
          PACK="$(cat /tmp/gate8-transform/asset-pack-path.txt)"
          mkdir -p /tmp/gate8-transform/glbs
          "$BLENDER_BIN" --background --offline-mode \
            --python grand-bruxelles-game/game/tests/gate8_node_transform_trace_probe.py \
            -- --asset-pack "$PACK" --output-dir /tmp/gate8-transform/glbs \
            | tee /tmp/gate8-transform/probe.log
          test -s "$GATE8_TRANSFORM_RESULT"
          test "$(sha256sum /tmp/gate8-transform/glbs/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_SHA256"
          cat "$GATE8_TRANSFORM_RESULT"

      - name: Verify transform verdict is measured and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['GATE8_TRANSFORM_RESULT']))
          assert r['format']=='grand-bruxelles-gate8-node-transform-trace-v1'
          assert r['generated_glb_sha256']==os.environ['TARGET_SHA256']
          assert r['generated_glb_size_bytes']==15580240
          assert r['generated_seed']==53756543
          assert r['canonical_asset_mutation'] is False
          assert r['canonical_generator_mutation'] is False
          assert r['runtime_npc_mutation'] is False
          assert r['production_activation_allowed'] is False
          assert r['visual_approval_allowed'] is False
          t=r['trace']
          assert len(t['endpoint_records'])==2
          assert [x['gltf_vertex'] for x in t['endpoint_records']]==[538,681]
          assert [x['prepared_vertex'] for x in t['endpoint_records']]==[486,601]
          assert r['diagnostic_state'] in {
            'GLTF_NODE_TRANSFORM_RESOLVES_SERIALIZED_EDGE_MAPPING',
            'COMMON_RIGID_OFFSET_CONFIRMED_BUT_NODE_TRANSFORM_NOT_APPLIED',
            'GLTF_NODE_TRANSFORM_DOES_NOT_EXPLAIN_POSITION_RESIDUAL',
          }
          print('GATE8_NODE_TRANSFORM_VERDICT',r['diagnostic_state'],r['next_safe_axis'],t['max_node_world_distance'])
          PY

      - name: Upload transform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-node-transform-trace
          path: |
            /tmp/gate8-transform/node-transform-result.json
            /tmp/gate8-transform/probe.log
            /tmp/gate8-transform/predecessor-artifact.json
            /tmp/gate8-transform/asset-artifact.json
            /tmp/gate8-transform/blender-version.txt
            /tmp/gate8-transform/mpfb.manifest.json
            /tmp/gate8-transform/mpfb-fetch.log
            /tmp/gate8-transform/mpfb-install.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prove canonical repository stayed clean
        run: test -z "$(git status --porcelain)"
