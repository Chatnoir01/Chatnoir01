name: Grand Bruxelles Gate-8 Rest Frame Compatibility

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/gate8_variant01_rest_frame_compatibility_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-rest-frame-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rest-frame-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-rest-frame"
    steps:
      - uses: actions/checkout@v4
      - name: Lock diagnostic contract
        run: |
          set -euo pipefail
          P=grand-bruxelles-game/game/tests/gate8_variant01_rest_frame_compatibility_test.gd
          grep -q 'LOCAL_WARN_DEG := 45.0' "$P"
          grep -q 'DIRECTION_WARN_DEG := 35.0' "$P"
          grep -q 'diagnostic_only.*true' "$P"
          grep -q 'production_authorized.*false' "$P"
          ! grep -q 'run_alias_selected.*Jog_Fwd\|run_alias_selected.*Sprint' "$P"
      - name: Download pinned CC0 source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$ANIM_URL" -o /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          T="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"; test -n "$T"; cp "$T" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"; test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt; grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
      - name: Build isolated project and import real assets
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"; mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8RestFrameCompatibility"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_rest_frame_compatibility_test.gd "$PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/import.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/import.log
      - name: Measure rest-frame compatibility
        run: |
          set -euo pipefail
          timeout 120s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_rest_frame_compatibility_test.gd 2>&1 | tee /tmp/rest-frame.log
          test -s "$PROJECT/gate8_variant01_rest_frame_compatibility.json"
          cp "$PROJECT/gate8_variant01_rest_frame_compatibility.json" /tmp/rest-frame.json
          python - <<'PY'
          import json,math
          r=json.load(open('/tmp/rest-frame.json'))
          assert r['format']=='grand-bruxelles-gate8-rest-frame-compatibility-v1'
          assert r['candidate_variant']==1 and r['reviewed_roles']==22 and r['measured_roles']==22
          assert r['diagnostic_only'] is True and r['production_authorized'] is False
          assert r['activation_ready'] is False and r['adoption_ready'] is False and r['run_alias_selected']==''
          assert not r['failures']
          for k in ('local_rest_peak_deg','direction_peak_deg','segment_length_ratio_min','segment_length_ratio_max'): assert math.isfinite(float(r[k]))
          assert len(r['roles'])==22
          print('GATE8_REST_FRAME_RESULT_OK state=%s outliers=%d local_peak=%.3f direction_peak=%.3f' % (r['selection_state'],len(r['outlier_roles']),r['local_rest_peak_deg'],r['direction_peak_deg']))
          PY
          grep -q '^GATE8_REST_FRAME_COMPATIBILITY_OK roles=22 ' /tmp/rest-frame.log
      - name: Stage evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          for f in /tmp/import.log /tmp/rest-frame.log /tmp/rest-frame.json /tmp/godot-version.txt; do [ -f "$f" ] && cp "$f" /tmp/evidence/; done
          (cd /tmp/evidence && sha256sum * > sha256.txt) || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-gate8-rest-frame-compatibility
          path: /tmp/evidence
          if-no-files-found: error
