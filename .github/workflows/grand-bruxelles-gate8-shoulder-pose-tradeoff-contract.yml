name: Grand Bruxelles Gate-8 Shoulder Pose Tradeoff Contract

on:
  push:
    branches: ["npc/gate8-shoulder-pose-tradeoff-be72af3"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-shoulder-pose-tradeoff-contract.yml"
      - ".github/workflows/grand-bruxelles-gate8-real-posed-geometry-red-first.yml"
      - "grand-bruxelles-game/game/tests/gate8_variant01_real_posed_geometry_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shoulder-pose-tradeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_MAIN_SHA: "be72af36bd19256c65d991ef4e3517dff49530cd"
      SOURCE_RUN_ID: "33275580600"
      SOURCE_HEAD_SHA: "8ae00cf374534d6f3c221495066907da4ee42ae2"
      SOURCE_ARTIFACT_ID: "9721388247"
      SOURCE_ARTIFACT_DIGEST: "sha256:ce53ac39951f8b55717dd0a8c1209562517ce66b87d69246f39d700133b942bf"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-real-posed-geometry-red-first.yml' \
            '.github/workflows/grand-bruxelles-gate8-shoulder-pose-tradeoff-contract.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant01_real_posed_geometry_probe.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 -m py_compile grand-bruxelles-game/game/tests/gate8_variant01_real_posed_geometry_probe.py

      - name: Download immutable exact-head pose-field evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-pose-tradeoff/evidence
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > /tmp/gate8-pose-tradeoff/meta.json
          python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/gate8-pose-tradeoff/meta.json'))
          assert not m['expired']
          assert m['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert int(m['workflow_run']['id'])==int(os.environ['SOURCE_RUN_ID'])
          assert m['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > /tmp/gate8-pose-tradeoff/evidence.zip
          unzip -q /tmp/gate8-pose-tradeoff/evidence.zip -d /tmp/gate8-pose-tradeoff/evidence
          test -s /tmp/gate8-pose-tradeoff/evidence/result.json

      - name: Lock reviewed shoulder pose tradeoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, statistics
          src=json.load(open('/tmp/gate8-pose-tradeoff/evidence/result.json'))
          assert src['format']=='grand-bruxelles-gate8-variant01-shoulder-pose-field-v1'
          assert src['diagnostic_state']=='REMATCH_REDUCES_DETERMINISTIC_SHOULDER_BLEND_FIELD_DISCONTINUITY'
          expected_pose={'upperarm_r':35.0,'clavicle_r':12.0,'spine_03':4.0,'spine_02':2.0,'spine_01':0.0}
          assert src['pose_degrees']==expected_pose
          edges={tuple(x['edge']):x for x in src['local_edges']}
          critical={(486,601),(599,601),(601,615)}
          all_edges={(377,486),(379,486),(486,601),(486,864),(378,601),(599,601),(601,615)}
          controls=all_edges-critical
          expected={
            (486,601):(0.6904713157224935,0.021638156444504904),
            (599,601):(0.6695350289445312,0.1494561829044704),
            (601,615):(0.6785194082154762,0.05295402890302719),
            (377,486):(0.005580603555426234,0.04751303266816041),
            (379,486):(0.0018629733182051898,0.037155343772500384),
            (486,864):(0.0018807244460922743,0.04114256579003507),
            (378,601):(0.011770957174466308,0.0526631083636563),
          }
          assert set(edges)==all_edges
          for edge,(stored,rematched) in expected.items():
              assert math.isclose(edges[edge]['stored_pose_field_delta'],stored,rel_tol=0.0,abs_tol=1e-12)
              assert math.isclose(edges[edge]['rematched_pose_field_delta'],rematched,rel_tol=0.0,abs_tol=1e-12)
          crit_stored=statistics.mean(edges[e]['stored_pose_field_delta'] for e in critical)
          crit_rematched=statistics.mean(edges[e]['rematched_pose_field_delta'] for e in critical)
          ctl_stored=statistics.mean(edges[e]['stored_pose_field_delta'] for e in controls)
          ctl_rematched=statistics.mean(edges[e]['rematched_pose_field_delta'] for e in controls)
          all_stored=statistics.mean(edges[e]['stored_pose_field_delta'] for e in all_edges)
          all_rematched=statistics.mean(edges[e]['rematched_pose_field_delta'] for e in all_edges)
          assert math.isclose(crit_stored,0.6795085842941669,rel_tol=0.0,abs_tol=1e-12)
          assert math.isclose(crit_rematched,0.07468278941733417,rel_tol=0.0,abs_tol=1e-12)
          assert math.isclose(ctl_stored,0.005273814623547502,rel_tol=0.0,abs_tol=1e-12)
          assert math.isclose(ctl_rematched,0.04461851264858804,rel_tol=0.0,abs_tol=1e-12)
          assert math.isclose(all_stored,0.29423157305381303,rel_tol=0.0,abs_tol=1e-12)
          assert math.isclose(all_rematched,0.05750320269233638,rel_tol=0.0,abs_tol=1e-12)
          assert crit_rematched < crit_stored * 0.12
          assert all_rematched < all_stored * 0.20
          assert all(edges[e]['rematched_pose_field_delta'] > edges[e]['stored_pose_field_delta'] for e in controls)
          assert max(edges[e]['rematched_pose_field_delta'] for e in controls) < 0.053
          assert max(edges[e]['rematched_pose_field_delta'] for e in critical) < 0.150
          assert src['canonical_asset_mutation'] is False
          assert src['canonical_mhclo_mutation'] is False
          assert src['runtime_npc_mutation'] is False
          assert src['production_activation_allowed'] is False
          assert src['visual_approval_allowed'] is False
          print('GATE8_SHOULDER_POSE_TRADEOFF_OK',crit_stored,'->',crit_rematched,ctl_stored,'->',ctl_rematched)
          PY

      - name: Prove repository stayed clean
        run: test -z "$(git status --porcelain)"
