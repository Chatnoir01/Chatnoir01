name: Grand Bruxelles Gate-8 Source Weight Transfer

on:
  push:
    branches: ["npc/gate8-source-weight-transfer-1872686"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-exporter-basis-origin-contract.yml"
      - ".github/workflows/grand-bruxelles-gate8-source-asset-weight-origin.yml"
      - ".github/workflows/grand-bruxelles-gate8-source-weight-transfer.yml"
      - "grand-bruxelles-game/game/tests/gate8_variant01_source_asset_weight_origin_test.py"
      - "grand-bruxelles-game/game/tests/gate8_variant01_source_weight_transfer_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-weight-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_MAIN_SHA: "187268667697915a2ffc899015592c3c6d6ae5a5"
      SOURCE_RUN_ID: "32552758284"
      SOURCE_HEAD_SHA: "afcb7b352ed054d98fdf83eae3333ec82c814b3e"
      ASSET_PACK_ARTIFACT_ID: "9710539659"
      ASSET_PACK_ARTIFACT_DIGEST: "sha256:ce6fe32adf20838b853ef6f3e80f47bee194f21565cf4d35cad8f2c02f2941da"
      ASSET_PACK_SHA256: "6b1d673e4c1fd169372d3a74fe174d9c185069c1f55ff6bf6b224f6655e4b67a"
      ASSET_PACK_SIZE_BYTES: "81255948"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GATE8_SOURCE_DIR: "/tmp/gate8-source"
      GATE8_WEIGHT_TRANSFER_RESULT: "/tmp/gate8-weight-transfer/source-weight-transfer-result.json"
      HOME: "/tmp/grand-bruxelles-blender-home"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-exporter-basis-origin-contract.yml' \
            '.github/workflows/grand-bruxelles-gate8-source-asset-weight-origin.yml' \
            '.github/workflows/grand-bruxelles-gate8-source-weight-transfer.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant01_source_asset_weight_origin_test.py' \
            'grand-bruxelles-game/game/tests/gate8_variant01_source_weight_transfer_probe.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 -m py_compile \
            grand-bruxelles-game/game/tests/gate8_variant01_source_asset_weight_origin_test.py \
            grand-bruxelles-game/game/tests/gate8_variant01_source_weight_transfer_probe.py

      - name: Materialize exact source generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE8_SOURCE_DIR" /tmp/gate8-weight-transfer
          for path in \
            grand-bruxelles-game/tools/generate_mpfb_gate8_glbs.py \
            grand-bruxelles-game/tools/generate_mpfb_gate8_export_ready_glbs.py \
            grand-bruxelles-game/tools/fetch_mpfb_2017.py
          do
            out="$GATE8_SOURCE_DIR/$(basename "$path")"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${SOURCE_HEAD_SHA}" --jq .content | tr -d '\n' | base64 -d > "$out"
            test -s "$out"
          done
          grep -q 'ExportService.create_character_copy' "$GATE8_SOURCE_DIR/generate_mpfb_gate8_export_ready_glbs.py"
          grep -q 'TargetService.bake_targets' "$GATE8_SOURCE_DIR/generate_mpfb_gate8_export_ready_glbs.py"
          grep -q 'ExportService.bake_modifiers_remove_helpers' "$GATE8_SOURCE_DIR/generate_mpfb_gate8_export_ready_glbs.py"

      - name: Download exact CC0 Gate-8 source asset pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}" > /tmp/gate8-weight-transfer/asset-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-weight-transfer/asset-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['ASSET_PACK_ARTIFACT_DIGEST']
          assert int(a['workflow_run']['id'])==int(os.environ['SOURCE_RUN_ID'])
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}/zip" > /tmp/gate8-weight-transfer/asset.zip
          mkdir -p /tmp/gate8-weight-transfer/asset
          unzip -q /tmp/gate8-weight-transfer/asset.zip -d /tmp/gate8-weight-transfer/asset
          PACK="$(find /tmp/gate8-weight-transfer/asset -type f -name 'makehuman_gate8_system_assets_cc0.zip' -print -quit)"
          test -n "$PACK"
          test "$(stat -c '%s' "$PACK")" = "$ASSET_PACK_SIZE_BYTES"
          test "$(sha256sum "$PACK" | awk '{print $1}')" = "$ASSET_PACK_SHA256"
          printf '%s\n' "$PACK" > /tmp/gate8-weight-transfer/asset-pack-path.txt

      - name: Acquire Blender 4.2.23 and MPFB 2.0.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" /tmp/gb-blender /tmp/gate8-weight-transfer/blender-extensions
          ARCHIVE=blender-4.2.23-linux-x64.tar.xz
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/blender-4.2.23.sha256" -o /tmp/blender.sha256
          grep " ${ARCHIVE}$" /tmp/blender.sha256 > /tmp/blender-linux.sha256
          (cd /tmp && sha256sum --check blender-linux.sha256)
          tar -xJf "/tmp/${ARCHIVE}" -C /tmp/gb-blender
          BLENDER_BIN="$(find /tmp/gb-blender -mindepth 2 -maxdepth 2 -type f -name blender -perm -111 | head -n 1)"
          "$BLENDER_BIN" --version | tee /tmp/gate8-weight-transfer/blender-version.txt
          grep -q '^Blender 4\.2\.23' /tmp/gate8-weight-transfer/blender-version.txt
          printf '%s\n' "$BLENDER_BIN" > /tmp/gate8-weight-transfer/blender-bin.txt
          python3 "$GATE8_SOURCE_DIR/fetch_mpfb_2017.py" --output /tmp/gate8-weight-transfer/mpfb.zip --manifest /tmp/gate8-weight-transfer/mpfb.manifest.json --retries 3 | tee /tmp/gate8-weight-transfer/mpfb-fetch.log
          grep -q '^MPFB_2017_FETCH_OK ' /tmp/gate8-weight-transfer/mpfb-fetch.log
          "$BLENDER_BIN" --background --command extension repo-add gb_ci --name "Grand Bruxelles CI" --directory /tmp/gate8-weight-transfer/blender-extensions --clear-all
          "$BLENDER_BIN" --background --command extension install-file --repo gb_ci --enable /tmp/gate8-weight-transfer/mpfb.zip | tee /tmp/gate8-weight-transfer/mpfb-install.txt

      - name: Regenerate exact variant and measure weight transfer stages
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(cat /tmp/gate8-weight-transfer/blender-bin.txt)"
          PACK="$(cat /tmp/gate8-weight-transfer/asset-pack-path.txt)"
          mkdir -p /tmp/gate8-weight-transfer/glbs
          "$BLENDER_BIN" --background --offline-mode \
            --python grand-bruxelles-game/game/tests/gate8_variant01_source_weight_transfer_probe.py \
            -- --asset-pack "$PACK" --output-dir /tmp/gate8-weight-transfer/glbs \
            | tee /tmp/gate8-weight-transfer/probe.log
          test -s "$GATE8_WEIGHT_TRANSFER_RESULT"
          test "$(sha256sum /tmp/gate8-weight-transfer/glbs/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_SHA256"
          cat "$GATE8_WEIGHT_TRANSFER_RESULT"

      - name: Verify inherited hm08 source-region cliff contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['GATE8_WEIGHT_TRANSFER_RESULT']))
          assert r['format']=='grand-bruxelles-gate8-variant01-source-weight-transfer-v2'
          assert r['generated_glb_sha256']==os.environ['TARGET_SHA256']
          assert r['generated_glb_size_bytes']==15580240
          assert r['generated_seed']==53756543
          assert r['prepared_native_edge']==[486,601]
          assert r['prepared_edge_weight_l1'] >= 1.7
          assert r['position_tolerance_m']==0.0001
          assert r['weight_tolerance_l1']==0.0001
          assert r['cliff_threshold_l1']==1.7
          assert r['canonical_asset_mutation'] is False
          assert r['canonical_generator_mutation'] is False
          assert r['runtime_npc_mutation'] is False
          assert r['production_activation_allowed'] is False
          assert r['visual_approval_allowed'] is False
          assert r['diagnostic_state']=='SOURCE_SPORTSUIT_CLIFF_INHERITED_FROM_HM08_INPUT_REGIONS'
          assert r['next_safe_axis']=='TRACE_MHCLO_NATIVE_EDGE_SOURCE_REGION_MAPPING'
          assert len(r['transfers']) >= 3
          assert all(t['positions_resolved'] for t in r['transfers'])
          assert all(t['mapped_edge_is_cliff'] for t in r['transfers'])
          p=r['proxy_interpolation']
          assert p is not None
          assert p['diagnostic_state']=='SOURCE_SPORTSUIT_CLIFF_INHERITED_FROM_HM08_INPUT_REGIONS'
          assert p['next_safe_axis']=='TRACE_MHCLO_NATIVE_EDGE_SOURCE_REGION_MAPPING'
          assert p['mpfb_release']=='2.0.17'
          assert p['mpfb_release_commit']=='80919fa'
          assert p['mpfb_algorithm']=='ClothesService.interpolate_weights'
          assert p['mpfb_group_policy']=='rig bones plus DEF-/mhmask- only'
          assert p['mpfb_weight_cutoff']==0.001
          assert p['rig_bone_count']==53
          assert p['body_vertex_count']==19158
          assert p['sportsuit_vertex_count']==1797
          assert set(p['endpoint_records'])=={'486','601'}
          assert p['observed_endpoint_cliff_l1'] >= 1.7
          assert p['mpfb_interpolated_endpoint_cliff_l1'] >= 1.7
          assert p['max_mpfb_to_observed_l1'] <= 1e-4
          assert len(p['body_input_cross_endpoint_pairs'])==9
          assert p['body_input_cross_endpoint_min_l1'] >= 1.7
          assert p['body_input_cross_endpoint_max_l1'] >= p['body_input_cross_endpoint_min_l1']
          assert p['mpfb_cliff_amplified_beyond_source_cross_max'] is False
          assert p['endpoint_records']['486']['body_inputs'][0]['vertex']==15673
          assert p['endpoint_records']['601']['body_inputs'][0]['vertex']==15947
          for endpoint in ('486','601'):
              assert p['endpoint_records'][endpoint]['mpfb_to_observed_l1'] <= 1e-4
          for t in r['transfers']:
              assert t['endpoint_a']['weight_delta_to_prepared_l1']==0.0
              assert t['endpoint_b']['weight_delta_to_prepared_l1']==0.0
          print('GATE8_SOURCE_WEIGHT_TRANSFER_OK', r['diagnostic_state'], r['next_safe_axis'])
          PY

      - name: Upload source weight-transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-source-weight-transfer
          path: |
            /tmp/gate8-weight-transfer/source-weight-transfer-result.json
            /tmp/gate8-weight-transfer/probe.log
            /tmp/gate8-weight-transfer/asset-artifact.json
            /tmp/gate8-weight-transfer/blender-version.txt
            /tmp/gate8-weight-transfer/mpfb.manifest.json
            /tmp/gate8-weight-transfer/mpfb-fetch.log
            /tmp/gate8-weight-transfer/mpfb-install.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prove canonical repository stayed clean
        run: test -z "$(git status --porcelain)"
