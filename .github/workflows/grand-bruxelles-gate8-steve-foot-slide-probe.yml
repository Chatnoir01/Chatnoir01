name: Grand Bruxelles Gate-8 Steve Foot-Slide Probe

on:
  push:
    branches: ["npc/gate8-steve-foot-slide-8677939"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  foot-slide-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_MAIN: 867793955c5fe7160222ed68ae927a11474f3c6c
      SOURCE_ZIP: https://opengameart.org/sites/default/files/steve_npc1.zip
      SOURCE_SHA256: e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5
      SOURCE_BYTES: "1454243"
      NORMALIZER_COMMIT: d021fa0a31c409e33102f5a94848a7c01bb019be
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_GLB_SHA256: 912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-steve-foot-slide
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main, bounded scope, and closed rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE="$(git rev-parse origin/main)"
          test "$LIVE" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$LIVE" HEAD
          git diff --name-only "$LIVE" HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-steve-foot-slide-probe.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_steve_foot_slide_probe.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_probe_test.gd' \
            'grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_contact_floor_v2.gd' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_steve_foot_slide_probe.json').read_text())
          assert d['base_main_sha']=='867793955c5fe7160222ed68ae927a11474f3c6c'
          assert d['predecessor']['workflow_run_id']==33023231374
          assert d['predecessor']['artifact_id']==9627395284
          assert d['predecessor']['mechanical_state']=='READY_FOR_FOOT_SLIDE_PROBE'
          assert d['source']['license']=='CC0-1.0'
          assert d['source']['normalizer_commit']=='d021fa0a31c409e33102f5a94848a7c01bb019be'
          assert d['probe']['sample_rate_hz']==120.0
          assert d['probe']['contact_height_epsilon_m']==0.035
          for k,v in d['rails'].items():
              if k in ('walk_alias_selected','run_alias_selected'): assert v==''
              else: assert v is False, k
          base=Path('grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_probe_test.gd').read_text()
          v2=Path('grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_contact_floor_v2.gd').read_text()
          for needle in ('SAMPLE_RATE_HZ := 120.0','irreducible_contact_slide_mean_mps','double_support_velocity_disagreement_peak_mps','source_pose_excitation_too_low','target_foot_path_too_low'):
              assert needle in base, needle
          for needle in ('shared_cycle_floor_v2','shared_cycle_floor_y_m','contact_threshold_y_m'):
              assert needle in v2, needle
          assert 'var shared_floor_y:=minf(lmin,rmin)' in v2
          print('GATE8_STEVE_FOOT_SLIDE_CONTRACT_OK exact_main=true rate_hz=120 contact_model=shared_cycle_floor_v2 aliases=false production=false')
          PY

      - name: Regenerate reviewed Steve proxy from pinned CC0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$SOURCE_ZIP" -o "$RUNNER_TEMP/steve.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/steve.zip" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/steve.zip")" = "$SOURCE_BYTES"
          mkdir -p "$RUNNER_TEMP/steve-src" && unzip -q "$RUNNER_TEMP/steve.zip" -d "$RUNNER_TEMP/steve-src"
          curl -L --fail --retry 4 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NORMALIZER_COMMIT}/grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py" \
            -o "$RUNNER_TEMP/normalize_steve_split_ik_export.py"
          grep -q 'grand-bruxelles-steve-reviewed-retarget-proxy-v15' "$RUNNER_TEMP/normalize_steve_split_ik_export.py"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender python3-numpy >/dev/null
          timeout 1800s blender --background "$RUNNER_TEMP/steve-src/steve_npc1.blend" --python-exit-code 42 \
            --python "$RUNNER_TEMP/normalize_steve_split_ik_export.py" \
            -- --output /tmp/steve_reviewed_proxy.glb --report "$RUNNER_TEMP/normalization-report.json" \
            2>&1 | tee "$RUNNER_TEMP/normalization.log"
          grep -q '^GATE8_STEVE_REVIEWED_PROXY_EXPORT_OK .*pose_payload=COMPONENTS' "$RUNNER_TEMP/normalization.log"
          python3 - "$RUNNER_TEMP/normalization-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['state']=='READY_FOR_GODOT_IMPORT'
          assert r['proxy_bone_count']==17
          assert r['max_assignment_pose_position_error_m']<=0.0001
          assert r['max_assignment_pose_rotation_error_deg']<=0.10
          assert r['max_baked_pose_position_error_m']<=0.0001
          assert r['max_baked_pose_rotation_error_deg']<=0.10
          print('GATE8_STEVE_PROXY_REGENERATED roles=17 state=READY_FOR_GODOT_IMPORT')
          PY
          sha256sum /tmp/steve_reviewed_proxy.glb | tee "$RUNNER_TEMP/steve_reviewed_proxy.sha256"

      - name: Restore immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${{ github.repository }}/actions/artifacts/$TARGET_ARTIFACT_ID/zip" > "$RUNNER_TEMP/target.zip"
          mkdir -p "$RUNNER_TEMP/target" && unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          TARGET="$(find "$RUNNER_TEMP/target" -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"
          echo "$TARGET_GLB_SHA256  $TARGET" | sha256sum -c -
          cp "$TARGET" /tmp/npc_gate_01.glb

      - name: Run Godot 4.7.1 planted-foot slide measurement
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -q '^4\.7\.1' "$RUNNER_TEMP/godot-version.txt"
          mkdir -p "$PROJECT/assets"
          cp /tmp/steve_reviewed_proxy.glb "$PROJECT/assets/steve_reviewed_proxy.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_probe_test.gd "$PROJECT/base_probe.gd"
          cp grand-bruxelles-game/game/tests/gate8_variant01_steve_foot_slide_contact_floor_v2.gd "$PROJECT/gate_test.gd"
          cat > "$PROJECT/project.godot" <<'EOF'
          [application]
          config/name="Gate8SteveFootSlideProbe"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          "$GODOT" --headless --path "$PROJECT" --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://gate_test.gd 2>&1 | tee "$RUNNER_TEMP/godot-probe.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          test -s "$PROJECT/gate8_variant01_steve_foot_slide_probe_result.json"
          cp "$PROJECT/gate8_variant01_steve_foot_slide_probe_result.json" "$RUNNER_TEMP/godot-result.json"
          python3 - "$RUNNER_TEMP/godot-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['format']=='grand-bruxelles-gate8-variant01-steve-foot-slide-probe-v1'
          assert r['engine_version'].startswith('4.7.1')
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          m=r['metrics']
          if m:
              assert m['contact_model']=='shared_cycle_floor_v2'
              for k in ('raw_contact_slide_mean_mps','raw_contact_slide_peak_mps','optimal_root_compensation_mean_mps','optimal_root_compensation_peak_mps','irreducible_contact_slide_mean_mps','irreducible_contact_slide_peak_mps','double_support_velocity_disagreement_peak_mps'):
                  assert k in m and m[k] >= 0.0, k
              print('GATE8_STEVE_FOOT_SLIDE_RESULT state=%s raw_mean=%.6f raw_peak=%.6f root_mean=%.6f residual_mean=%.6f residual_peak=%.6f double_support_peak=%.6f failures=%d' % (
                  r['mechanical_state'],m['raw_contact_slide_mean_mps'],m['raw_contact_slide_peak_mps'],m['optimal_root_compensation_mean_mps'],m['irreducible_contact_slide_mean_mps'],m['irreducible_contact_slide_peak_mps'],m['double_support_velocity_disagreement_peak_mps'],len(r['failures'])))
          else:
              print('GATE8_STEVE_FOOT_SLIDE_RESULT state=%s metrics=empty failures=%d' % (r['mechanical_state'],len(r['failures'])))
          PY
          exit "$STATUS"

      - name: Require repository remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain | tee "$RUNNER_TEMP/git-status.txt"
          test ! -s "$RUNNER_TEMP/git-status.txt"

      - name: Upload foot-slide evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-steve-foot-slide-probe
          path: |
            ${{ runner.temp }}/normalization-report.json
            ${{ runner.temp }}/normalization.log
            ${{ runner.temp }}/steve_reviewed_proxy.sha256
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-probe.log
            ${{ runner.temp }}/godot-result.json
            ${{ runner.temp }}/git-status.txt
          if-no-files-found: ignore
          retention-days: 14
