name: Grand Bruxelles Gate-8 Steve Upperarm Attenuation A/B
on:
  push:
    branches: ["npc/gate8-steve-bone-transform-decomp-81cf7f7"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upperarm-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_MAIN: ba33f951ebccf1e5589a91f6698127c80254fe9d
      SOURCE_ZIP: https://opengameart.org/sites/default/files/steve_npc1.zip
      SOURCE_SHA256: e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5
      NORMALIZER_COMMIT: d021fa0a31c409e33102f5a94848a7c01bb019be
      HARDENER_COMMIT: 0a0e8e9330c88d1100054c3eb534a237cb5e7c8c
      BASE_PROBE_COMMIT: f1c3778ccbfd31d9883fe40ee8f3b03288f325e5
      CULPRIT_COMMIT: 12d32184387df070b0fe2e039e901a958dbd13dd
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_GLB_SHA256: 912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-upperarm-ab
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require exact main, bounded scope and closed rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          git diff --name-only origin/main HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-steve-upperarm-attenuation-ab.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant01_steve_upperarm_attenuation_ab_test.gd' \
            'grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          grep -q 'FACTORS := \[1.0, 0.75, 0.5, 0.25\]' grand-bruxelles-game/game/tests/gate8_variant01_steve_upperarm_attenuation_ab_test.gd
          grep -q 'MAX_STRETCH_RATIO = 3.0' grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py
          grep -q 'MAX_ABSOLUTE_EDGE_CHANGE_M = 0.25' grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py
          grep -q 'MIN_COMPRESSION_RATIO = 0.25' grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py
      - name: Run classifier regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py --self-test | tee "$RUNNER_TEMP/classifier-tests.log"
          grep -q 'GATE8_STEVE_ATTENUATION_CLASSIFIER_TESTS_OK tests=3' "$RUNNER_TEMP/classifier-tests.log"
      - name: Regenerate canonical Steve and restore immutable target
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "$SOURCE_ZIP" -o "$RUNNER_TEMP/steve.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/steve.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/src" && unzip -q "$RUNNER_TEMP/steve.zip" -d "$RUNNER_TEMP/src"
          curl -L --fail "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NORMALIZER_COMMIT}/grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py" -o "$RUNNER_TEMP/normalizer.py"
          curl -L --fail "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HARDENER_COMMIT}/grand-bruxelles-game/tools/qa/harden_steve_normalizer_gltf_export.py" -o "$RUNNER_TEMP/hardener.py"
          curl -L --fail "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HARDENER_COMMIT}/grand-bruxelles-game/tools/qa/canonicalize_steve_proxy_walk.py" -o "$RUNNER_TEMP/canonicalizer.py"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender python3-numpy >/dev/null
          python3 "$RUNNER_TEMP/hardener.py" --input "$RUNNER_TEMP/normalizer.py" --output "$RUNNER_TEMP/n.py"
          timeout 1800 blender --background "$RUNNER_TEMP/src/steve_npc1.blend" --python-exit-code 42 --python "$RUNNER_TEMP/n.py" -- --output /tmp/steve_proxy.glb --report "$RUNNER_TEMP/normalization.json" >/dev/null
          timeout 300 blender --background --python-exit-code 42 --python "$RUNNER_TEMP/canonicalizer.py" -- --input /tmp/steve_proxy.glb --output /tmp/steve.glb --report "$RUNNER_TEMP/canonicalization.json" >/dev/null
          gh api "/repos/${{ github.repository }}/actions/artifacts/$TARGET_ARTIFACT_ID/zip" > "$RUNNER_TEMP/target.zip"
          mkdir -p "$RUNNER_TEMP/target" && unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          TARGET="$(find "$RUNNER_TEMP/target" -name npc_gate_01.glb -print -quit)"
          echo "$TARGET_GLB_SHA256  $TARGET" | sha256sum -c -
          cp "$TARGET" /tmp/npc_gate_01.glb
      - name: Run Godot 4.7.1 attenuation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"; chmod +x "$GODOT"
          mkdir -p "$PROJECT/assets"; cp /tmp/steve.glb "$PROJECT/assets/steve.glb"; cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          curl -L --fail "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BASE_PROBE_COMMIT}/grand-bruxelles-game/game/tests/gate8_variant01_steve_canonical_native_probe_test.gd" -o "$PROJECT/base_probe.gd"
          curl -L --fail "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CULPRIT_COMMIT}/grand-bruxelles-game/game/tests/gate8_variant01_steve_skin_edge_culprit_test.gd" -o "$PROJECT/culprit.gd"
          cp grand-bruxelles-game/game/tests/gate8_variant01_steve_upperarm_attenuation_ab_test.gd "$PROJECT/gate_test.gd"
          printf '[application]\nconfig/name="Gate8UpperarmAB"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT/project.godot"
          timeout 300 "$GODOT" --headless --path "$PROJECT" --import >/dev/null
          set +e; timeout 180 "$GODOT" --headless --path "$PROJECT" --script res://gate_test.gd | tee "$RUNNER_TEMP/godot.log"; STATUS=${PIPESTATUS[0]}; set -e
          test "$STATUS" -ne 0
          cp "$PROJECT/gate8_variant01_steve_canonical_native_probe_result.json" "$RUNNER_TEMP/result.json"
      - name: Classify tested attenuation factors against unchanged skin gates
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/qa/classify_gate8_steve_upperarm_attenuation.py \
            --input "$RUNNER_TEMP/result.json" \
            --output "$RUNNER_TEMP/classification.json" | tee "$RUNNER_TEMP/classification.log"
          python3 - "$RUNNER_TEMP/classification.json" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1]))
          assert c['state']=='REJECT_STEVE_WALK_GATE8_SKIN_PAIR_AT_TESTED_ATTENUATIONS', c
          assert c['viable_factors']==[], c
          assert c['modest_075_viable'] is False, c
          assert c['production_authorized'] is False
          assert c['activation_ready'] is False
          assert c['adoption_ready'] is False
          q=next(r for r in c['results'] if r['factor']==0.25)
          assert q['max_stretch_ratio'] > 3.0, q
          print('GATE8_STEVE_WALK_SKIN_PAIR_REJECTED tested=4 viable=0 production=false')
          PY
      - name: Require clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-upperarm-attenuation-ab-${{ github.sha }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/godot.log
            ${{ runner.temp }}/normalization.json
            ${{ runner.temp }}/canonicalization.json
            ${{ runner.temp }}/classification.json
            ${{ runner.temp }}/classification.log
            ${{ runner.temp }}/classifier-tests.log
          retention-days: 14
