name: Grand Bruxelles Gate-8 Systemic Skin Quality

on:
  push:
    branches: ["npc/gate8-systemic-skin-quality-20260828"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-systemic-skin-quality.yml"
      - "grand-bruxelles-game/data/qa/gate8_systemic_skin_quality.json"
      - "grand-bruxelles-game/game/tests/gate8_systemic_skin_quality_test.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  systemic-skin-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lock exact-current main, scope and rails
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD origin/main)" = "$LIVE_MAIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('grand-bruxelles-game/data/qa/gate8_systemic_skin_quality.json')
          m=json.loads(p.read_text())
          assert m['base_main_sha']=='0f8d4c3fa7a31f28cba35251e208885118a4bdf8'
          assert [v['variant'] for v in m['variants']]==[1,3,5,6,7,8]
          assert len({v['artifact_id'] for v in m['variants']})==6
          assert all(v['artifact_digest'].startswith('sha256:') for v in m['variants'])
          assert all(value is False for value in m['rails'].values())
          assert m['decision_contract']['forbid_additional_source_swap'] is True
          PY
          cat > /tmp/expected <<'EOF'
          .github/workflows/grand-bruxelles-gate8-systemic-skin-quality.yml
          grand-bruxelles-game/data/qa/gate8_systemic_skin_quality.json
          grand-bruxelles-game/game/tests/gate8_systemic_skin_quality_test.py
          EOF
          git diff --name-only origin/main...HEAD | sort > /tmp/actual
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Verify and download immutable target-only artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-systemic
          python3 - <<'PY' > /tmp/variants.tsv
          import json
          m=json.load(open('grand-bruxelles-game/data/qa/gate8_systemic_skin_quality.json'))
          for v in m['variants']:
              print(v['variant'],v['run_id'],v['artifact_id'],v['artifact_digest'],sep='\t')
          PY
          while IFS=$'\t' read -r variant run artifact digest; do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run}" > "/tmp/run-${variant}.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" > "/tmp/artifact-${variant}.json"
            python3 - "$variant" "$run" "$artifact" "$digest" <<'PY'
          import json,sys
          variant,run,artifact,digest=sys.argv[1:]
          r=json.load(open(f'/tmp/run-{variant}.json')); a=json.load(open(f'/tmp/artifact-{variant}.json'))
          assert r['status']=='completed' and r['conclusion']=='success' and r['id']==int(run)
          assert a['id']==int(artifact) and not a['expired'] and a['digest']==digest
          PY
            mkdir -p "/tmp/gate8-systemic/v$(printf '%02d' "$variant")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > "/tmp/v${variant}.zip"
            unzip -q "/tmp/v${variant}.zip" -d "/tmp/gate8-systemic/v$(printf '%02d' "$variant")"
          done < /tmp/variants.tsv
      - name: Classify systemic target skin failure
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/gate8_systemic_skin_quality_test.py \
            grand-bruxelles-game/data/qa/gate8_systemic_skin_quality.json \
            /tmp/gate8-systemic /tmp/gate8-systemic-result.json | tee /tmp/gate8-systemic.log
          grep -q 'GATE8_CURRENT_SKINS_SYSTEMICALLY_BLOCKED' /tmp/gate8-systemic-result.json
          grep -q 'EXPLICIT_REWEIGHT_OR_REGENERATE_SKIN' /tmp/gate8-systemic-result.json
      - name: Prove repository untouched
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: gate8-systemic-skin-quality-${{ github.sha }}
          path: |
            /tmp/gate8-systemic-result.json
            /tmp/gate8-systemic.log
            /tmp/run-*.json
            /tmp/artifact-*.json
          if-no-files-found: error
