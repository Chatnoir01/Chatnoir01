name: Grand Bruxelles Gate-8 Variant-01 BoneMap Preflight

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/gate8_variant01_bonemap_preflight.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_bonemap_preflight_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-variant01-bonemap-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variant01-bonemap-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-bonemap-preflight"
    steps:
      - uses: actions/checkout@v4

      - name: Validate fail-closed BoneMap contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('grand-bruxelles-game/data/qa/gate8_variant01_bonemap_preflight.json')
          d = json.loads(p.read_text())
          assert d['format'] == 'grand-bruxelles-gate8-variant01-bonemap-preflight-v1'
          assert d['base_main_sha'] == '8d511f1e751363a3cbf3266fa35726f36f871b1c'
          assert d['candidate_variant'] == 1
          assert d['candidate_static_verdict'] == 'AMELIORER'
          assert d['source_semantic_pr'] == 1153
          assert d['source_semantic_state'] == 'MEASURED_REVIEW_REQUIRED'
          assert d['run_candidates'] == ['Jog_Fwd', 'Sprint']
          src = d['animation_source']
          assert src['license'] == 'CC0-1.0'
          assert src['package_sha256'] == '18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2'
          assert src['package_size_bytes'] == 14541205
          target = d['target_source']
          assert target['artifact_id'] == 9470539830
          assert target['artifact_zip_sha256'] == 'fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb'
          assert target['target_glb'] == 'npc_gate_01.glb'
          roles = d['required_roles']
          assert len(roles) == 17 and len(set(roles)) == 17
          gate = d['measurement_gate']
          assert gate['godot_version'] == '4.7.1'
          assert gate['isolated_project_required'] is True
          assert gate['require_unique_role_assignment'] is True
          assert gate['require_parent_chain_consistency'] is True
          assert gate['bonemap_application_authorized'] is False
          rails = d['rails']
          assert rails['allowed_variants'] == [1]
          assert rails['rejected_variants_forbidden'] == [2,4,7]
          assert rails['other_survivors_out_of_scope'] == [3,5,6,8]
          assert rails['mixamo_payload_allowed'] is False
          assert rails['player_character_reuse_allowed'] is False
          assert rails['run_alias_selected'] == ''
          assert rails['retarget_authorized'] is False
          assert rails['retarget_applied'] is False
          assert rails['production_authorized'] is False
          assert rails['activation_ready'] is False
          assert rails['adoption_ready'] is False
          assert rails['package_bytes_committed'] is False
          assert rails['visual_approval_claimed'] is False
          print('GATE8_VARIANT01_BONEMAP_STATIC_OK candidate=01 roles=17 retarget_applied=false production_authorized=false')
          PY
          grep -q '"production_authorized": false' grand-bruxelles-game/assets/characters/civilians/civ1/source_status.json
          grep -q '"activation_ready": false' grand-bruxelles-game/assets/characters/civilians/civ1/source_status.json
          grep -q '"mixamo_payload_allowed": false' grand-bruxelles-game/assets/characters/civilians/civ1/source_status.json
          grep -q 'assets/characters/player_character.glb' grand-bruxelles-game/assets/characters/civilians/civ1/source_status.json

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-BoneMap-Preflight/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          sha256sum /tmp/animation-source.zip | tee /tmp/animation-source.sha256
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member = os.environ['ANIM_GLB']
              if member not in z.namelist():
                  raise SystemExit(f'missing pinned animation GLB: {member}')
              payload = z.read(member)
          Path('/tmp/animation_source.glb').write_bytes(payload)
          print(f'GATE8_BONEMAP_ANIMATION_SOURCE_OK bytes={len(payload)}')
          PY
          test -s /tmp/animation_source.glb

      - name: Download immutable helper-clean Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"
          cp "$TARGET" /tmp/npc_gate_01.glb
          test -s /tmp/npc_gate_01.glb
          sha256sum /tmp/npc_gate_01.glb | tee /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated BoneMap witness project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"
          mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01BoneMapPreflight"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_bonemap_preflight_test.gd "$ISOLATED_PROJECT/game/tests/"
          ! grep -q '^\[autoload\]' "$ISOLATED_PROJECT/project.godot"

      - name: Import both skeletons under Godot 4.7.1
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-bonemap-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-bonemap-import.log

      - name: Measure BoneMap compatibility before retarget
        run: |
          set -euo pipefail
          set +e
          timeout 180s "$GODOT" --headless --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_bonemap_preflight_test.gd 2>&1 | tee /tmp/gate8-bonemap-preflight.log
          STATUS=${PIPESTATUS[0]}
          set -e
          test -s "$ISOLATED_PROJECT/gate8_variant01_bonemap_preflight_result.json"
          cp "$ISOLATED_PROJECT/gate8_variant01_bonemap_preflight_result.json" /tmp/gate8_variant01_bonemap_preflight_result.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          r = json.loads(Path('/tmp/gate8_variant01_bonemap_preflight_result.json').read_text())
          assert r['format'] == 'grand-bruxelles-gate8-variant01-bonemap-preflight-result-v1'
          assert r['candidate_variant'] == 1
          assert r['required_role_count'] == 17
          assert r['bonemap_applied'] is False
          assert r['retarget_applied'] is False
          assert r['run_alias_selected'] == ''
          assert r['production_authorized'] is False
          assert r['activation_ready'] is False
          assert r['visual_approval_claimed'] is False
          assert r['source_bone_count'] > 0 and r['target_bone_count'] > 0
          for key in ['source_torso_rest_bend_deg','target_torso_rest_bend_deg','torso_rest_bend_deviation_deg','source_mean_leg_length','target_mean_leg_length','target_to_source_leg_ratio']:
              assert math.isfinite(float(r[key])), key
          print('GATE8_VARIANT01_BONEMAP_RESULT_CAPTURED ready=%s failures=%d' % (str(r['bonemap_ready']).lower(), len(r['failures'])))
          PY
          if [ "$STATUS" -eq 0 ]; then
            grep -q '^GATE8_VARIANT01_BONEMAP_PREFLIGHT_OK candidate=01 bonemap_ready=true bonemap_applied=false retarget_applied=false alias_selected=false production_authorized=false$' /tmp/gate8-bonemap-preflight.log
          else
            echo "BoneMap preflight correctly failed closed; inspect artifact before mapping anything." >&2
            exit "$STATUS"
          fi

      - name: Prove repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-bonemap-git-status.txt
          test ! -s /tmp/gate8-bonemap-git-status.txt

      - name: Upload BoneMap preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-bonemap-preflight
          path: |
            /tmp/gate8_variant01_bonemap_preflight_result.json
            /tmp/gate8-bonemap-preflight.log
            /tmp/gate8-bonemap-import.log
            /tmp/animation-source.sha256
            /tmp/npc_gate_01.sha256
            /tmp/godot-version.txt
            /tmp/gate8-bonemap-git-status.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
