name: Grand Bruxelles Gate-8 Variant01 Edge Seam Geometry

on:
  push:
    branches: ["npc/gate8-variant01-edge-seam-geometry-20260828"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-edge-seam-geometry.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_edge_seam_geometry.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_edge_seam_geometry_test.gd"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  geometry-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_DIGEST: "sha256:fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      TARGET_SIZE_BYTES: "15580240"
      COVERAGE_ARTIFACT_ID: "9695092926"
      COVERAGE_ARTIFACT_DIGEST: "sha256:40b70fc406c02766052a8f19ca07a85a385beef1ba7ac97a221dc973315052bc"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-edge-seam-geometry"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character NPC scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = "d418afad3d0f67871240998ec2af813f67555e60"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-edge-seam-geometry.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_edge_seam_geometry.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_edge_seam_geometry_test.gd' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          python3 - <<'PY'
          import json
          d=json.load(open('grand-bruxelles-game/data/qa/gate8_variant01_edge_seam_geometry.json'))
          assert d['base_main_sha']=='d418afad3d0f67871240998ec2af813f67555e60'
          assert d['candidate_variant']==1
          assert d['target_artifact']['id']==9470539830
          assert d['coverage_artifact']['id']==9695092926
          assert d['coverage_artifact']['expected_unique_edges']==6
          assert d['coverage_artifact']['expected_unique_vertices']==12
          assert d['geometry_gates']['require_all_pairs_triangle_adjacent'] is True
          assert d['geometry_gates']['require_nonzero_rest_edge_length'] is True
          assert d['rails'] and all(v is False for v in d['rails'].values())
          PY
          printf '%s\n' "$LIVE_MAIN" | tee "$RUNNER_TEMP/live-main.txt"

      - name: Verify immutable target and coverage artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}" > "$RUNNER_TEMP/target-artifact.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COVERAGE_ARTIFACT_ID}" > "$RUNNER_TEMP/coverage-artifact.json"
          python3 - "$RUNNER_TEMP/target-artifact.json" "$TARGET_ARTIFACT_DIGEST" "$RUNNER_TEMP/coverage-artifact.json" "$COVERAGE_ARTIFACT_DIGEST" <<'PY'
          import json,sys
          ta=json.load(open(sys.argv[1])); ca=json.load(open(sys.argv[3]))
          assert not ta['expired'] and ta['id']==9470539830 and ta['digest']==sys.argv[2]
          assert not ca['expired'] and ca['id']==9695092926 and ca['digest']==sys.argv[4]
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/target.zip"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COVERAGE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/coverage.zip"
          mkdir -p "$RUNNER_TEMP/target" "$RUNNER_TEMP/coverage" "$PROJECT/assets" "$PROJECT/evidence"
          unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          unzip -q "$RUNNER_TEMP/coverage.zip" -d "$RUNNER_TEMP/coverage"
          TARGET="$(find "$RUNNER_TEMP/target" -type f -name 'npc_gate_01.glb' -print -quit)"
          COVERAGE="$(find "$RUNNER_TEMP/coverage" -type f -name 'worst-edge-coverage-result.json' -print -quit)"
          test -n "$TARGET" && test -n "$COVERAGE"
          test "$(find "$RUNNER_TEMP/target" -type f -name 'npc_gate_01.glb' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/coverage" -type f -name 'worst-edge-coverage-result.json' | wc -l)" -eq 1
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(stat -c '%s' "$TARGET")" = "$TARGET_SIZE_BYTES"
          python3 - "$COVERAGE" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['diagnostic_state']=='BLOCKED_WORST_EDGE_COVERAGE_READY'
          assert r['unique_worst_edges']==6 and r['unique_vertices']==12
          assert r['covered_blocked_case_count']==48 and len(r['edges'])==6
          PY
          cp "$TARGET" "$PROJECT/assets/npc_gate_01.glb"
          cp "$COVERAGE" "$PROJECT/evidence/worst-edge-coverage-result.json"
          cp grand-bruxelles-game/data/qa/gate8_variant01_edge_seam_geometry.json "$PROJECT/contract.json"
          sha256sum "$TARGET" | tee "$RUNNER_TEMP/npc_gate_01.sha256"

      - name: Import real target and audit six worst edges under Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --version | tee "$RUNNER_TEMP/godot-version.txt"
          cp grand-bruxelles-game/game/tests/gate8_variant01_edge_seam_geometry_test.gd "$PROJECT/gate_test.gd"
          printf '[application]\nconfig/name="Gate8Variant01EdgeSeamGeometry"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT/project.godot"
          timeout 300 "$GODOT" --headless --path "$PROJECT" --import > "$RUNNER_TEMP/godot-import.log" 2>&1
          timeout 180 "$GODOT" --headless --path "$PROJECT" --script res://gate_test.gd | tee "$RUNNER_TEMP/godot.log"
          cp "$PROJECT/gate8_variant01_edge_seam_geometry_result.json" "$RUNNER_TEMP/result.json"
          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['diagnostic_state'] in {
            'TRUE_EDGES_WITH_WEIGHT_DIVERGENT_SEAM_SPLITS_CONFIRMED',
            'TRUE_EDGES_NO_WEIGHT_DIVERGENT_SEAM_SPLITS',
          }, r
          assert r['failures']==[], r['failures']
          assert r['target_vertex_total']==21044
          assert r['audited_edge_count']==6
          assert r['triangle_adjacent_edge_count']==6
          assert r['pair_coincident_count']==0
          assert len(r['edges'])==6
          assert all(e['triangle_adjacent'] and e['triangle_adjacency_count']>=1 for e in r['edges'])
          assert all(e['rest_edge_length_m']>1e-6 for e in r['edges'])
          assert r['rails'] and all(v is False for v in r['rails'].values())
          assert r['production_activation_allowed'] is False
          assert r['visual_approval_allowed'] is False
          print('GATE8_EDGE_SEAM_GEOMETRY_OK state=%s split_endpoints=%d divergent_split_endpoints=%d' % (
            r['diagnostic_state'], r['split_duplicate_endpoint_count'], r['weight_divergent_split_endpoint_count']))
          PY

      - name: Require repository clean
        shell: bash
        run: test -z "$(git status --porcelain)"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-edge-seam-geometry-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/live-main.txt
            ${{ runner.temp }}/target-artifact.json
            ${{ runner.temp }}/coverage-artifact.json
            ${{ runner.temp }}/npc_gate_01.sha256
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/godot.log
            ${{ runner.temp }}/godot-import.log
          retention-days: 14
