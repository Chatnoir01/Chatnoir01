name: Grand Bruxelles Gate-8 Variant01 Export Skin Origin Diagnostic

on:
  push:
    branches: ["npc/gate8-variant01-export-skin-origin-diagnostic-rebuild-20260829"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-export-skin-origin-diagnostic.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_export_skin_origin_diagnostic.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_export_skin_origin_diagnostic_test.gd"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-skin-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_MAIN_SHA: "719a03de4fb2b7b1296b198ba9819745f9a7ab58"
      TARGET_ARTIFACT_ID: "9710540154"
      TARGET_ARTIFACT_DIGEST: "sha256:45006cb1f15c7e2613744e1a261d080ef7d0123a027b84761509e42cc6f6fb70"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      TARGET_SIZE_BYTES: "15580240"
      SOURCE_RUN_ID: "32552758284"
      SOURCE_HEAD_SHA: "afcb7b352ed054d98fdf83eae3333ec82c814b3e"
      SOURCE_GENERATOR_PATH: "grand-bruxelles-game/tools/generate_mpfb_gate8_export_ready_glbs.py"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-v01-export-skin-origin"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-export-skin-origin-diagnostic.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_export_skin_origin_diagnostic.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_export_skin_origin_diagnostic_test.gd' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 - <<'PY'
          import json
          m=json.load(open('grand-bruxelles-game/data/qa/gate8_variant01_export_skin_origin_diagnostic.json'))
          assert m['base_main_sha']=='719a03de4fb2b7b1296b198ba9819745f9a7ab58'
          assert m['candidate_variant']==1
          assert m['surface']=='Human_female_sportsuit01_gate8_export#0'
          assert m['target']['artifact_id']==9710540154
          assert m['target']['sha256']=='912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9'
          assert m['target']['size_bytes']==15580240
          assert m['target']['expected_vertex_total']==21044
          assert m['target']['source_generation_run_id']==32552758284
          assert m['target']['source_generation_head_sha']=='afcb7b352ed054d98fdf83eae3333ec82c814b3e'
          assert m['target_edge']==[416,758]
          assert m['adjacent_residual_edge']==[417,1510]
          assert sorted(m['probe_vertices'])==sorted([416,417,758,1510,259,1511])
          assert all(v is False for v in m['rails'].values())
          PY

      - name: Verify fresh target provenance and source generator witness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/provenance.log
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}" > /tmp/target-artifact.json
          python3 - <<'PY' | tee -a /tmp/provenance.log
          import json, os
          a=json.load(open('/tmp/target-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['TARGET_ARTIFACT_DIGEST']
          wr=a.get('workflow_run') or {}
          assert int(wr.get('id',-1))==int(os.environ['SOURCE_RUN_ID'])
          assert wr.get('head_sha')==os.environ['SOURCE_HEAD_SHA']
          print('artifact_id=',a['id'],'digest=',a['digest'],'source_run=',wr.get('id'),'source_head=',wr.get('head_sha'))
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/contents/${SOURCE_GENERATOR_PATH}?ref=${SOURCE_HEAD_SHA}" --jq .content | tr -d '\n' | base64 -d > /tmp/source-generator.py
          grep -F '_helper_weighted_vertex_count' /tmp/source-generator.py
          grep -F '_remove_empty_helper_groups' /tmp/source-generator.py
          grep -F 'ExportService.create_character_copy' /tmp/source-generator.py
          grep -F 'TargetService.bake_targets' /tmp/source-generator.py
          grep -F 'ExportService.bake_modifiers_remove_helpers' /tmp/source-generator.py
          grep -F 'helper_vertices_after_bake' /tmp/source-generator.py
          sha256sum /tmp/source-generator.py | tee -a /tmp/provenance.log
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/target.zip
          unzip -q /tmp/target.zip -d /tmp/target-evidence
          TARGET="$(find /tmp/target-evidence -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          ACTUAL_SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c '%s' "$TARGET")"
          printf 'target=%s\nsha256=%s\nsize_bytes=%s\n' "$TARGET" "$ACTUAL_SHA256" "$ACTUAL_SIZE" | tee -a /tmp/provenance.log
          test "$ACTUAL_SHA256" = "$TARGET_SHA256"
          test "$ACTUAL_SIZE" = "$TARGET_SIZE_BYTES"
          mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cp "$TARGET" "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/data/qa/gate8_variant01_export_skin_origin_diagnostic.json "$PROJECT/contract.json"
          cp grand-bruxelles-game/game/tests/gate8_variant01_export_skin_origin_diagnostic_test.gd "$PROJECT/game/tests/test.gd"

      - name: Install exact Godot 4.7.1 and import target
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -F '4.7.1.stable' /tmp/godot-version.txt
          cat > "$PROJECT/project.godot" <<'EOF'
          [application]
          config/name="Gate8ExportSkinOriginDiagnostic"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          "$GODOT" --headless --path "$PROJECT" --editor --quit-after 3 2>&1 | tee /tmp/import.log
          test -d "$PROJECT/.godot/imported"
          printf '%s\n' "$GODOT" > /tmp/godot-bin.txt

      - name: Inspect exported skin weights bind poses and skeleton rest
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(cat /tmp/godot-bin.txt)"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://game/tests/test.gd 2>&1 | tee /tmp/diagnostic.log
          RC=${PIPESTATUS[0]}
          set -e
          test -f "$PROJECT/export-skin-origin-diagnostic-result.json"
          cp "$PROJECT/export-skin-origin-diagnostic-result.json" /tmp/export-skin-origin-diagnostic-result.json
          cat /tmp/export-skin-origin-diagnostic-result.json
          test "$RC" -eq 0
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/export-skin-origin-diagnostic-result.json'))
          assert r['failures']==[]
          assert r['candidate_variant']==1
          assert r['target_vertex_total']==21044
          assert r['production_activation_allowed'] is False
          assert r['visual_approval_allowed'] is False
          assert r['diagnostic_state'] in {
              'EXPORT_SKIN_WEIGHT_DISCONTINUITY_CONFIRMED',
              'EXPORT_RIG_BIND_OR_REST_INVALID',
              'EXPORT_SKIN_WEIGHT_DISCONTINUITY_NOT_REPRODUCED'
          }
          print('diagnostic_state=',r['diagnostic_state'])
          print('target_edge_weight_l1=',r['target_edge_weight_l1'])
          print('skin_bind_count=',r['skin_bind_count'],'skeleton_bone_count=',r['skeleton_bone_count'])
          print('next_safe_axis=',r['next_safe_axis'])
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-export-skin-origin-diagnostic
          retention-days: 14
          path: |
            /tmp/provenance.log
            /tmp/godot-version.txt
            /tmp/import.log
            /tmp/diagnostic.log
            /tmp/export-skin-origin-diagnostic-result.json
