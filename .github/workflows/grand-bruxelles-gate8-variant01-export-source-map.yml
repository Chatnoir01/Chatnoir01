name: Grand Bruxelles Gate-8 Variant01 Export Source Map

on:
  push:
    branches: ["npc/gate8-v01-export-weight-source-map-20260829"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-export-source-map.yml"
      - "grand-bruxelles-game/game/tests/gate8_variant01_export_source_map_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-source-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_MAIN_SHA: "ccd677a3b15e8b7b398591b9510940fe7e4d9ae5"
      SOURCE_RUN_ID: "32552758284"
      SOURCE_HEAD_SHA: "afcb7b352ed054d98fdf83eae3333ec82c814b3e"
      ASSET_PACK_ARTIFACT_ID: "9710539659"
      ASSET_PACK_ARTIFACT_DIGEST: "sha256:ce6fe32adf20838b853ef6f3e80f47bee194f21565cf4d35cad8f2c02f2941da"
      ASSET_PACK_SHA256: "6b1d673e4c1fd169372d3a74fe174d9c185069c1f55ff6bf6b224f6655e4b67a"
      ASSET_PACK_SIZE_BYTES: "81255948"
      PREDECESSOR_ARTIFACT_ID: "9714558072"
      PREDECESSOR_ARTIFACT_DIGEST: "sha256:aa6ca90994184e52ae55c75f313eaf89ba8fc4b1187d0a8dfdfbab636302e279"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GATE8_SOURCE_DIR: "/tmp/gate8-source"
      GATE8_SOURCE_MAP_RESULT: "/tmp/gate8-source-map/export-source-map-result.json"
      HOME: "/tmp/grand-bruxelles-blender-home"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git merge-base origin/main HEAD)" = "$BASE_MAIN_SHA"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-export-source-map.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant01_export_source_map_probe.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 -m py_compile grand-bruxelles-game/game/tests/gate8_variant01_export_source_map_probe.py

      - name: Pin predecessor serialized-edge evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-source-map/predecessor
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREDECESSOR_ARTIFACT_ID}" > /tmp/gate8-source-map/predecessor-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-source-map/predecessor-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['PREDECESSOR_ARTIFACT_DIGEST']
          assert a['workflow_run']['head_sha']=='ed4716239dac34c1422e1afb219b96247fdc8ff3'
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREDECESSOR_ARTIFACT_ID}/zip" > /tmp/gate8-source-map/predecessor.zip
          unzip -q /tmp/gate8-source-map/predecessor.zip -d /tmp/gate8-source-map/predecessor
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/gate8-source-map/predecessor/gltf-weight-trace-result.json'))
          assert r['diagnostic_state']=='GLTF_TARGET_WEIGHT_EDGE_REPRODUCED'
          assert r['generated_glb_sha256']=='912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9'
          pairs=r['trace']['adjacent_matching_profile_pairs']
          assert len(pairs)==1
          assert [pairs[0]['vertex_a'], pairs[0]['vertex_b']]==[538,681]
          assert pairs[0]['pair_is_triangle_edge'] is True
          PY

      - name: Materialize exact source generator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GATE8_SOURCE_DIR" /tmp/gate8-source-map
          for path in \
            grand-bruxelles-game/tools/generate_mpfb_gate8_glbs.py \
            grand-bruxelles-game/tools/generate_mpfb_gate8_export_ready_glbs.py \
            grand-bruxelles-game/tools/fetch_mpfb_2017.py
          do
            out="$GATE8_SOURCE_DIR/$(basename "$path")"
            gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${SOURCE_HEAD_SHA}" --jq .content | tr -d '\n' | base64 -d > "$out"
            test -s "$out"
          done

      - name: Download exact Gate-8 source asset pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}" > /tmp/gate8-source-map/asset-artifact.json
          python3 - <<'PY'
          import json, os
          a=json.load(open('/tmp/gate8-source-map/asset-artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['ASSET_PACK_ARTIFACT_DIGEST']
          assert int(a['workflow_run']['id'])==int(os.environ['SOURCE_RUN_ID'])
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_HEAD_SHA']
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ASSET_PACK_ARTIFACT_ID}/zip" > /tmp/gate8-source-map/asset.zip
          mkdir -p /tmp/gate8-source-map/asset
          unzip -q /tmp/gate8-source-map/asset.zip -d /tmp/gate8-source-map/asset
          PACK="$(find /tmp/gate8-source-map/asset -type f -name 'makehuman_gate8_system_assets_cc0.zip' -print -quit)"
          test -n "$PACK"
          test "$(stat -c '%s' "$PACK")" = "$ASSET_PACK_SIZE_BYTES"
          test "$(sha256sum "$PACK" | awk '{print $1}')" = "$ASSET_PACK_SHA256"
          printf '%s\n' "$PACK" > /tmp/gate8-source-map/asset-pack-path.txt

      - name: Acquire Blender 4.2.23 and MPFB 2.0.17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME" /tmp/gb-blender /tmp/gate8-source-map/blender-extensions
          ARCHIVE=blender-4.2.23-linux-x64.tar.xz
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl --fail --location --retry 3 --retry-all-errors "https://download.blender.org/release/Blender4.2/blender-4.2.23.sha256" -o /tmp/blender.sha256
          grep " ${ARCHIVE}$" /tmp/blender.sha256 > /tmp/blender-linux.sha256
          (cd /tmp && sha256sum --check blender-linux.sha256)
          tar -xJf "/tmp/${ARCHIVE}" -C /tmp/gb-blender
          BLENDER_BIN="$(find /tmp/gb-blender -mindepth 2 -maxdepth 2 -type f -name blender -perm -111 | head -n 1)"
          "$BLENDER_BIN" --version | tee /tmp/gate8-source-map/blender-version.txt
          grep -q '^Blender 4\.2\.23' /tmp/gate8-source-map/blender-version.txt
          printf '%s\n' "$BLENDER_BIN" > /tmp/gate8-source-map/blender-bin.txt
          python3 "$GATE8_SOURCE_DIR/fetch_mpfb_2017.py" --output /tmp/gate8-source-map/mpfb.zip --manifest /tmp/gate8-source-map/mpfb.manifest.json --retries 3 | tee /tmp/gate8-source-map/mpfb-fetch.log
          grep -q '^MPFB_2017_FETCH_OK ' /tmp/gate8-source-map/mpfb-fetch.log
          "$BLENDER_BIN" --background --command extension repo-add gb_ci --name "Grand Bruxelles CI" --directory /tmp/gate8-source-map/blender-extensions --clear-all
          "$BLENDER_BIN" --background --command extension install-file --repo gb_ci --enable /tmp/gate8-source-map/mpfb.zip | tee /tmp/gate8-source-map/mpfb-install.txt

      - name: Regenerate exact GLB and map serialized edge to prepared source
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_BIN="$(cat /tmp/gate8-source-map/blender-bin.txt)"
          PACK="$(cat /tmp/gate8-source-map/asset-pack-path.txt)"
          mkdir -p /tmp/gate8-source-map/glbs
          "$BLENDER_BIN" --background --offline-mode \
            --python grand-bruxelles-game/game/tests/gate8_variant01_export_source_map_probe.py \
            -- --asset-pack "$PACK" --output-dir /tmp/gate8-source-map/glbs \
            | tee /tmp/gate8-source-map/probe.log
          test -s "$GATE8_SOURCE_MAP_RESULT"
          test "$(sha256sum /tmp/gate8-source-map/glbs/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_SHA256"
          cat "$GATE8_SOURCE_MAP_RESULT"

      - name: Verify fail-closed source-map verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open(os.environ['GATE8_SOURCE_MAP_RESULT']))
          assert r['format']=='grand-bruxelles-gate8-variant01-export-source-map-v1'
          assert r['generated_glb_sha256']==os.environ['TARGET_SHA256']
          assert r['generated_glb_size_bytes']==15580240
          assert r['generated_seed']==53756543
          assert r['predecessor_gltf_trace_artifact_id']==9714558072
          assert r['prepared_vertex_count']==1797
          assert r['prepared_edge_count']==3518
          assert r['canonical_asset_mutation'] is False
          assert r['canonical_generator_mutation'] is False
          assert r['runtime_npc_mutation'] is False
          assert r['production_activation_allowed'] is False
          assert r['visual_approval_allowed'] is False
          state=r['diagnostic_state']
          assert state in {
              'SERIALIZED_EDGE_MAPS_TO_NATIVE_PREEXPORT_CLIFF',
              'SERIALIZED_EDGE_MAPS_TO_NONADJACENT_PREPARED_VERTICES',
              'SERIALIZED_EDGE_POSITION_MAPPING_UNRESOLVED',
              'SERIALIZED_EDGE_SOURCE_MAP_NOT_FOUND',
          }, state
          if state=='SERIALIZED_EDGE_MAPS_TO_NATIVE_PREEXPORT_CLIFF':
              native=[c for c in r['source_map']['candidates'] if c['prepared_pair_is_native_edge']]
              assert native
              assert r['next_safe_axis']=='MEASURE_SOURCE_WEIGHT_TRANSFER_BEFORE_EXPORT'
          elif state=='SERIALIZED_EDGE_MAPS_TO_NONADJACENT_PREPARED_VERTICES':
              assert r['source_map']['resolved_candidate_count']>0
              assert r['next_safe_axis']=='TRACE_EXPORTER_VERTEX_MERGE_OR_INDEX_REMAP'
          elif state=='SERIALIZED_EDGE_POSITION_MAPPING_UNRESOLVED':
              assert r['next_safe_axis']=='TRACE_GLTF_NODE_TRANSFORMS_AND_MESH_COORDINATES'
          print('EXPORT_SOURCE_MAP_OK', state, r['next_safe_axis'])
          PY

      - name: Upload source-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-export-source-map
          path: |
            /tmp/gate8-source-map/export-source-map-result.json
            /tmp/gate8-source-map/probe.log
            /tmp/gate8-source-map/predecessor-artifact.json
            /tmp/gate8-source-map/asset-artifact.json
            /tmp/gate8-source-map/blender-version.txt
            /tmp/gate8-source-map/mpfb.manifest.json
            /tmp/gate8-source-map/mpfb-fetch.log
            /tmp/gate8-source-map/mpfb-install.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prove canonical repository stayed clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
