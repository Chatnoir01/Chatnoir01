name: Grand Bruxelles Gate-8 Variant01 Influence Topology

on:
  push:
    branches: ["npc/gate8-variant01-influence-topology-20260828"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-influence-topology.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_influence_topology.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_influence_topology_materialize.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variant01-influence-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_DIGEST: "sha256:fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      TARGET_SIZE_BYTES: "15580240"
      BASELINE_ARTIFACT_ID: "9679245275"
      BASELINE_ARTIFACT_DIGEST: "sha256:310bf9d8c55f4e97ac1480351b4235e230305ccb959570581c8c2c03046703a5"
      HARNESS_COMMIT_SHA: "73feaa653d3d66bbd46cd218576e7d9585161ae2"
      HARNESS_PATH: "grand-bruxelles-game/game/tests/gate8_variant06_target_micropose_skin_test.gd"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-v01-influence-topology"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main, bounded scope and frozen rails
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          test "$LIVE_MAIN" = "c2494a49b796d31d10bf874215458b75f4299853"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-influence-topology.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_influence_topology.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_influence_topology_materialize.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 - <<'PY'
          import json
          m=json.load(open('grand-bruxelles-game/data/qa/gate8_variant01_influence_topology.json'))
          assert m['base_main_sha']=='c2494a49b796d31d10bf874215458b75f4299853'
          assert m['candidate_variant']==1
          assert m['target']['vertices']==21044
          assert m['cases']=={'degrees':5.0,'roles':9,'axes':3,'count':54}
          assert m['gates']=={'max_skin_edge_change_m':0.25,'max_skin_stretch_ratio':3.0,'min_skin_compression_ratio':0.25,'max_foot_drift_m':0.000001,'max_rest_position_drift_m':0.000001,'max_rest_rotation_drift_deg':0.0001}
          assert all(v is False for v in m['rails'].values())
          PY
          printf '%s\n' "$LIVE_MAIN" | tee /tmp/live-main.txt

      - name: Verify immutable baseline evidence and target bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in "$BASELINE_ARTIFACT_ID:$BASELINE_ARTIFACT_DIGEST" "$TARGET_ARTIFACT_ID:$TARGET_ARTIFACT_DIGEST"; do
            ID="${pair%%:*}"; EXPECTED="${pair#*:}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" > "/tmp/artifact-${ID}.json"
            python3 - "/tmp/artifact-${ID}.json" "$EXPECTED" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); assert not a['expired']; assert a['digest']==sys.argv[2]
          PY
          done
          rm -rf /tmp/baseline-evidence /tmp/target-evidence && mkdir -p /tmp/baseline-evidence /tmp/target-evidence "$PROJECT/assets" "$PROJECT/game/tests"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASELINE_ARTIFACT_ID}/zip" > /tmp/baseline.zip
          unzip -q /tmp/baseline.zip -d /tmp/baseline-evidence
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/target.zip
          unzip -q /tmp/target.zip -d /tmp/target-evidence
          TARGET="$(find /tmp/target-evidence -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$TARGET_SHA256"
          test "$(stat -c '%s' "$TARGET")" = "$TARGET_SIZE_BYTES"
          cp "$TARGET" "$PROJECT/assets/npc_gate_01.glb"
          python3 - <<'PY'
          import json,pathlib
          found=[]
          for p in pathlib.Path('/tmp/baseline-evidence').rglob('*.json'):
              try: d=json.loads(p.read_text())
              except Exception: continue
              if d.get('candidate_variant')==1 and d.get('case_count')==54 and 'case_results' in d: found.append((p,d))
          assert len(found)==1
          p,d=found[0]
          assert d['diagnostic_state']=='TARGET_MICROPOSE_SKIN_BLOCKED' and d['blocked_case_count']==48 and d['failures']==[]
          pathlib.Path('/tmp/immutable-baseline-result.json').write_text(json.dumps(d,indent=2,sort_keys=True))
          PY

      - name: Materialize topology harness from validated source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${HARNESS_COMMIT_SHA}^{commit}"
          git show "${HARNESS_COMMIT_SHA}:${HARNESS_PATH}" > /tmp/validated-harness.gd
          python3 grand-bruxelles-game/game/tests/gate8_variant01_influence_topology_materialize.py /tmp/validated-harness.gd "$PROJECT/game/tests/topology.gd" topology-measurement.json
          grep -q 'influence_topology_diagnostic' "$PROJECT/game/tests/topology.gd"
          grep -q '_describe_edge_topology' "$PROJECT/game/tests/topology.gd"
          ! grep -q 'RetargetModifier3D' "$PROJECT/game/tests/topology.gd"
          sha256sum /tmp/validated-harness.gd "$PROJECT/game/tests/topology.gd" | tee /tmp/harness-sha256.txt

      - name: Install exact Godot 4.7.1 and import target
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          chmod +x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01InfluenceTopology"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          timeout 300s "$GODOT" --headless --path "$PROJECT" --import 2>&1 | tee /tmp/import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/import.log

      - name: Measure exact 54-case topology witness
        shell: bash
        run: |
          set -euo pipefail
          timeout 420s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/topology.gd 2>&1 | tee /tmp/topology.log
          cp "$PROJECT/topology-measurement.json" /tmp/topology-measurement.json

      - name: Enforce baseline replay and classify influence topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,math,pathlib
          immutable=json.load(open('/tmp/immutable-baseline-result.json'))
          r=json.load(open('/tmp/topology-measurement.json'))
          assert r['candidate_variant']==1 and r['case_count']==54 and len(r['case_results'])==54
          assert r['diagnostic_state']=='TARGET_MICROPOSE_SKIN_BLOCKED' and r['blocked_case_count']==48 and r['failures']==[]
          assert r['blocked_cases']==immutable['blocked_cases']
          for k in ('max_edge_absolute_change_m','max_edge_stretch_ratio','min_edge_compression_ratio'):
              assert math.isclose(float(r[k]),float(immutable[k]),rel_tol=1e-7,abs_tol=1e-7),(k,r[k],immutable[k])
          classes=collections.Counter(); rotated=collections.Counter(); endpoint=collections.Counter(); deltas=[]; blocked_rows=[]
          for row in r['case_results']:
              edge=row['worst_edge']; topo=edge.get('influence_topology',{})
              assert topo.get('classification') not in (None,'invalid_skin_arrays','surface_not_found')
              assert abs(float(topo['vertex_a_weight_sum'])-1.0) <= 0.001
              assert abs(float(topo['vertex_b_weight_sum'])-1.0) <= 0.001
              if row['within_gates']:
                  continue
              classes[topo['classification']]+=1
              rotated[topo['rotated_bone']]+=1
              deltas.append(float(topo['rotated_weight_delta']))
              for v in ('vertex_a_influences','vertex_b_influences'):
                  for inf in topo[v]: endpoint[inf['bone']]+=1
              blocked_rows.append({'case':row['case'],'surface':edge['surface'],'vertex_a':edge['vertex_a'],'vertex_b':edge['vertex_b'],'edge_change_m':edge['absolute_edge_length_change_m'],'stretch_ratio':edge['stretch_ratio'],'topology':topo})
          assert len(blocked_rows)==48 and sum(classes.values())==48
          result={
            'format':'grand-bruxelles-gate8-variant01-influence-topology-result-v1',
            'diagnostic_state':'INFLUENCE_TOPOLOGY_DIAGNOSED',
            'candidate_variant':1,
            'canonical_glb_modified':False,'skin_resource_modified':False,'rest_pose_modified':False,
            'source_animation_used':False,'retarget_applied':False,'production_authorized':False,'visual_approval_claimed':False,
            'blocked_case_count':48,
            'topology_class_counts':dict(classes),
            'rotated_bone_case_counts':dict(rotated),
            'most_common_endpoint_bones':endpoint.most_common(12),
            'max_rotated_weight_delta':max(deltas) if deltas else 0.0,
            'mean_rotated_weight_delta':sum(deltas)/len(deltas) if deltas else 0.0,
            'blocked_case_topology':blocked_rows,
            'next_safe_axis':'DESIGN_LOCAL_REWEIGHT_OPERATOR_FROM_OBSERVED_WORST_EDGE_TOPOLOGY_ONLY'
          }
          pathlib.Path('/tmp/influence-topology-result.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps({k:v for k,v in result.items() if k!='blocked_case_topology'},sort_keys=True))
          PY

      - name: Require repository clean
        shell: bash
        run: test -z "$(git status --porcelain)"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-influence-topology-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/live-main.txt
            /tmp/immutable-baseline-result.json
            /tmp/topology-measurement.json
            /tmp/influence-topology-result.json
            /tmp/harness-sha256.txt
            /tmp/godot-version.txt
            /tmp/import.log
            /tmp/topology.log
          retention-days: 14
