name: Grand Bruxelles Gate-8 Variant-01 KayKit Locomotion Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-kaykit-locomotion-preflight.yml"
      - "grand-bruxelles-game/tests/gate8_variant01_kaykit_locomotion_preflight.gd"
      - "grand-bruxelles-game/data/qa/gate8_variant01_kaykit_walk_source_intake.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaykit-locomotion-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_URL: https://opengameart.org/sites/default/files/kaykit_character_animations_1.2.zip
      EXPECTED_SHA256: c9d3fbea492dc6edd0903939369a564c2240b892430bcd99e0aee4876110bb8f
      EXPECTED_SIZE: "7959257"
      GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse origin/main)" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Acquire pinned KayKit and Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_URL" -o /tmp/kaykit.zip
          test "$(sha256sum /tmp/kaykit.zip | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' /tmp/kaykit.zip)" = "$EXPECTED_SIZE"
          curl -fL --retry 3 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | tee /tmp/godot-version.txt
          grep -Fq '4.7.1' /tmp/godot-version.txt

      - name: Build isolated single-animation FBX project
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit-unpack /tmp/kaykit-project
          mkdir -p /tmp/kaykit-unpack /tmp/kaykit-project/kaykit /tmp/kaykit-project/tests
          unzip -q /tmp/kaykit.zip -d /tmp/kaykit-unpack
          IDLE_SRC='/tmp/kaykit-unpack/Animations/fbx/Single Animations/Idle.fbx'
          WALK_SRC='/tmp/kaykit-unpack/Animations/fbx/Single Animations/Walk.fbx'
          RUN_SRC='/tmp/kaykit-unpack/Animations/fbx/Single Animations/Run.fbx'
          test -f "$IDLE_SRC" && test -f "$WALK_SRC" && test -f "$RUN_SRC"
          cp "$IDLE_SRC" /tmp/kaykit-project/kaykit/Idle.fbx
          cp "$WALK_SRC" /tmp/kaykit-project/kaykit/Walk.fbx
          cp "$RUN_SRC" /tmp/kaykit-project/kaykit/Run.fbx
          printf '%s\n' \
            'Animations/fbx/Single Animations/Idle.fbx' \
            'Animations/fbx/Single Animations/Walk.fbx' \
            'Animations/fbx/Single Animations/Run.fbx' > /tmp/kaykit-selected-source-paths.txt
          test "$(find /tmp/kaykit-project/kaykit -maxdepth 1 -type f -iname '*.fbx' | wc -l)" -eq 3
          test "$(find /tmp/kaykit-project/kaykit -maxdepth 1 -type f \( -iname '*.glb' -o -iname '*.gltf' \) | wc -l)" -eq 0
          cp grand-bruxelles-game/tests/gate8_variant01_kaykit_locomotion_preflight.gd /tmp/kaykit-project/tests/
          cat > /tmp/kaykit-project/project.godot <<'EOF'
          [application]
          config/name="Gate8KayKitLocomotionPreflight"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path /tmp/kaykit-project --editor --quit-after 120 2>&1 | tee /tmp/kaykit-import.log
          test -d /tmp/kaykit-project/.godot/imported
          grep -Fq 'Idle.fbx' /tmp/kaykit-import.log
          grep -Fq 'Walk.fbx' /tmp/kaykit-import.log
          grep -Fq 'Run.fbx' /tmp/kaykit-import.log

      - name: Characterize humanoid retarget compatibility
        run: |
          set -euo pipefail
          timeout 180 /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/kaykit-project --script res://tests/gate8_variant01_kaykit_locomotion_preflight.gd 2>&1 | tee /tmp/kaykit-locomotion.log
          test -f /tmp/gate8-kaykit-locomotion-preflight.json
          cp /tmp/gate8-kaykit-locomotion-preflight.json /tmp/kaykit-locomotion-preflight.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/kaykit-locomotion-preflight.json'))
          expected_bones=['Body','Head','armLeft','handSlotLeft','armRight','handSlotRight']
          expected_roles=['hips','left_upper_arm','right_upper_arm','left_foot','right_foot']
          assert d['schema'].endswith('-v3')
          assert d['source_mode'] == 'single_animation_fbx'
          assert d['mechanical_state'] == 'BLOCKED_NON_HUMANOID_SKELETON'
          assert d['target_humanoid_retarget_compatible'] is False
          assert d['observed_skeleton_bones'] == 6
          assert d['observed_bone_names'] == expected_bones
          assert d['required_humanoid_roles'] == expected_roles
          assert d['missing_required_humanoid_roles'] == expected_roles
          assert d['skeleton_signature_consistent'] is True
          assert d['metrics'] == {}
          assert d['production_authorized'] is False
          assert d['activation_ready'] is False
          assert d['adoption_ready'] is False
          assert d['walk_alias_selected'] == '' and d['run_alias_selected'] == ''
          assert set(d['source_scenes']) == {'idle','walk','run'}
          for semantic, scene in d['source_scenes'].items():
              assert scene['skeleton_bones'] == 6, semantic
              assert scene['bone_names'] == expected_bones, semantic
              assert scene['missing_roles'] == expected_roles, semantic
              assert len(scene['usable_animations']) >= 1, semantic
          assert d.get('failures') == []
          print('GATE8_KAYKIT_NON_HUMANOID_BLOCK_OK bones=6 missing_roles=5 aliases=empty')
          PY
          grep -Fq 'GATE8_KAYKIT_LOCOMOTION_BLOCK_CONFIRMED state=BLOCKED_NON_HUMANOID_SKELETON bones=6' /tmp/kaykit-locomotion.log

      - name: Prove ephemeral assets and clean checkout
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit.zip /tmp/kaykit-unpack /tmp/kaykit-project /tmp/godot /tmp/godot.zip
          test -z "$(git status --porcelain=v1)"

      - name: Stage evidence
        if: always()
        run: |
          mkdir -p /tmp/gate8-kaykit-locomotion-evidence
          for f in /tmp/godot-version.txt /tmp/kaykit-import.log /tmp/kaykit-locomotion.log /tmp/kaykit-locomotion-preflight.json /tmp/kaykit-selected-source-paths.txt; do [ -f "$f" ] && cp "$f" /tmp/gate8-kaykit-locomotion-evidence/; done
          git status --porcelain=v1 > /tmp/gate8-kaykit-locomotion-evidence/git-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-gate8-variant01-kaykit-locomotion-preflight
          path: /tmp/gate8-kaykit-locomotion-evidence
          if-no-files-found: error
          retention-days: 14
