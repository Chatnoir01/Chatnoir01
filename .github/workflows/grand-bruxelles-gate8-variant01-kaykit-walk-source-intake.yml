name: Grand Bruxelles Gate-8 Variant-01 KayKit Walk Source Intake

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-kaykit-walk-source-intake.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_kaykit_walk_source_intake.json"
      - "grand-bruxelles-game/tools/qa/check_gate8_variant01_kaykit_walk_source_intake.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaykit-walk-source-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTRACT: grand-bruxelles-game/data/qa/gate8_variant01_kaykit_walk_source_intake.json
      TOOL: grand-bruxelles-game/tools/qa/check_gate8_variant01_kaykit_walk_source_intake.py
      SOURCE_URL: https://opengameart.org/sites/default/files/kaykit_character_animations_1.2.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$HEAD_SHA" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$HEAD_SHA"
          echo "GATE8_KAYKIT_LIVE_MAIN_OK live=$LIVE_MAIN_SHA head=$HEAD_SHA"

      - name: Validate fail-closed intake contract
        run: |
          set -euo pipefail
          python "$TOOL" | tee /tmp/kaykit-contract.log
          grep -Fxq 'GATE8_KAYKIT_SOURCE_INTAKE_CONTRACT_OK pending_pin=true production=false aliases=empty' /tmp/kaykit-contract.log

      - name: Acquire exact CC0 source bytes
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'GrandBruxellesGate8SourceIntake/1.0' \
            "$SOURCE_URL" --output /tmp/kaykit-character-animations-1.2.zip
          test -s /tmp/kaykit-character-animations-1.2.zip
          unzip -tq /tmp/kaykit-character-animations-1.2.zip >/tmp/kaykit-unzip-test.log

      - name: Inventory exact archive and locomotion assets
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/kaykit-source-intake.log
          import hashlib, json, re, zipfile
          from pathlib import Path
          zpath=Path('/tmp/kaykit-character-animations-1.2.zip')
          raw=zpath.read_bytes()
          with zipfile.ZipFile(zpath) as z:
              names=sorted(i.filename for i in z.infolist() if not i.is_dir())
          lower=[n.lower() for n in names]
          gltf=[n for n in names if n.lower().endswith(('.gltf','.glb'))]
          fbx=[n for n in names if n.lower().endswith('.fbx')]
          def exact_semantic(token):
              rx=re.compile(r'(^|[^a-z0-9])'+re.escape(token)+r'([^a-z0-9]|$)', re.I)
              return [n for n in names if rx.search(n)]
          report={
              'source_url':'https://opengameart.org/sites/default/files/kaykit_character_animations_1.2.zip',
              'sha256':hashlib.sha256(raw).hexdigest(),
              'size_bytes':len(raw),
              'file_count':len(names),
              'gltf_or_glb_count':len(gltf),
              'fbx_count':len(fbx),
              'idle_candidates':exact_semantic('idle'),
              'walk_candidates':exact_semantic('walk'),
              'run_candidates':exact_semantic('run'),
              'archive_files':names,
              'production_authorized':False,
              'activation_ready':False,
              'adoption_ready':False,
              'walk_alias_selected':'',
              'run_alias_selected':''
          }
          Path('/tmp/kaykit-source-intake.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          assert report['size_bytes'] > 1_000_000
          assert report['file_count'] > 0
          assert report['gltf_or_glb_count'] > 0
          assert report['fbx_count'] > 0
          assert report['idle_candidates'], 'no exact Idle-like asset found'
          assert report['walk_candidates'], 'no exact Walk-like asset found'
          assert report['run_candidates'], 'no exact Run-like asset found'
          print('GATE8_KAYKIT_SOURCE_ACQUISITION_OK', 'sha256='+report['sha256'], 'bytes='+str(report['size_bytes']), 'files='+str(report['file_count']), 'gltf='+str(report['gltf_or_glb_count']), 'fbx='+str(report['fbx_count']), 'idle='+str(len(report['idle_candidates'])), 'walk='+str(len(report['walk_candidates'])), 'run='+str(len(report['run_candidates'])))
          PY

      - name: Prove source bytes are ephemeral and checkout stays clean
        run: |
          set -euo pipefail
          rm -f /tmp/kaykit-character-animations-1.2.zip
          test -z "$(git status --porcelain=v1)"
          echo 'GATE8_KAYKIT_EPHEMERAL_SOURCE_OK'

      - name: Stage evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-kaykit-source-intake-evidence
          for f in /tmp/kaykit-contract.log /tmp/kaykit-unzip-test.log /tmp/kaykit-source-intake.log /tmp/kaykit-source-intake.json; do
            [ -f "$f" ] && cp "$f" /tmp/gate8-kaykit-source-intake-evidence/
          done
          cp "$CONTRACT" /tmp/gate8-kaykit-source-intake-evidence/
          git status --porcelain=v1 > /tmp/gate8-kaykit-source-intake-evidence/git-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-gate8-variant01-kaykit-walk-source-intake
          path: /tmp/gate8-kaykit-source-intake-evidence
          if-no-files-found: error
          retention-days: 14
