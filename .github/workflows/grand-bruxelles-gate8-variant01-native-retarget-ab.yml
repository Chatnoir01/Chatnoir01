name: Grand Bruxelles Gate-8 Variant-01 Native Retarget A-B

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/gate8_variant01_native_retarget_ab.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_test.gd"
      - "grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-variant01-native-retarget-ab.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-retarget-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-native-retarget-ab"

    steps:
      - uses: actions/checkout@v4

      - name: Validate fail-closed native A-B contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_native_retarget_ab.json').read_text())
          assert d['format']=='grand-bruxelles-gate8-variant01-native-retarget-ab-v1'
          assert d['base_main_sha']=='a600ec5bedde79bd5a647b396a26f42322012aac'
          assert d['candidate_variant']==1 and d['candidate_static_verdict']=='AMELIORER'
          assert d['native_preflight']['run_id']==32625024400 and d['native_preflight']['state']=='GREEN'
          assert d['native_preflight']['reviewed_roles']==22
          assert d['run_candidates']==['Jog_Fwd','Sprint']
          r=d['retarget']
          assert r['engine']=='RetargetModifier3D' and r['godot_version']=='4.7.1'
          assert r['use_global_pose'] is False and r['position_enabled'] is False and r['rotation_enabled'] is True and r['scale_enabled'] is False
          assert r['target_runtime_rename_to_source_names'] is True
          assert r['source_bone_names_unchanged'] is True and r['source_animation_tracks_unchanged'] is True
          g=d['measurement_gate']
          assert g['sample_rate_hz']==120 and g['minimum_samples_per_clip']==80
          assert g['max_ground_correction_span_m']==0.18 and g['max_ground_correction_step_m']==0.08
          assert g['max_mean_torso_bend_delta_deg']==15.0 and g['max_peak_torso_bend_delta_deg']==30.0
          rails=d['rails']
          assert rails['run_alias_selected']=='' and rails['production_authorized'] is False
          assert rails['activation_ready'] is False and rails['adoption_ready'] is False
          assert rails['runtime_population_changed'] is False and rails['visual_approval_claimed'] is False
          print('GATE8_NATIVE_AB_STATIC_OK roles=22 clips=2 production_authorized=false')
          PY
          BASETEST=grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_test.gd
          TEST=grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd
          grep -q 'RetargetModifier3D.new()' "$BASETEST"
          grep -q 'set_position_enabled(false)' "$BASETEST"
          grep -q 'set_rotation_enabled(true)' "$BASETEST"
          grep -q 'set_scale_enabled(false)' "$BASETEST"
          grep -q '_rename_target_to_source_namespace' "$BASETEST"
          grep -q 'source_animation_tracks_unchanged' "$BASETEST"
          ! grep -q 'set_bone_name.*_source_skeleton' "$BASETEST"
          grep -q 'duplicate(true) as Skin' "$TEST"
          grep -q 'set_bind_name' "$TEST"
          grep -q 'bind_poses_unchanged' "$TEST"
          grep -q 'bind_bone_indices_unchanged' "$TEST"
          grep -q 'missing_named_binds_after_remap' "$TEST"

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-Native-AB/1.1' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1 and software renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"; "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated witness and import immutable assets
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"; mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01NativeRetargetAB"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/size/window_width_override=1280
          window/size/window_height_override=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_test.gd "$ISOLATED_PROJECT/game/tests/"
          cp grand-bruxelles-game/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd "$ISOLATED_PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-native-ab-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-native-ab-import.log

      - name: Measure native RetargetModifier3D A-B and capture both frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
        run: |
          set -euo pipefail
          set +e
          timeout 240s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --path "$ISOLATED_PROJECT" --rendering-method gl_compatibility --script res://game/tests/gate8_variant01_native_retarget_ab_v2_test.gd 2>&1 | tee /tmp/gate8-native-ab.log
          STATUS=${PIPESTATUS[0]}
          set -e
          test -s "$ISOLATED_PROJECT/gate8_variant01_native_retarget_ab_result.json"
          test -s "$ISOLATED_PROJECT/gate8_variant01_native_skin_remap_result.json"
          cp "$ISOLATED_PROJECT/gate8_variant01_native_retarget_ab_result.json" /tmp/gate8_variant01_native_retarget_ab_result.json
          cp "$ISOLATED_PROJECT/gate8_variant01_native_skin_remap_result.json" /tmp/gate8_variant01_native_skin_remap_result.json
          for png in "$ISOLATED_PROJECT/gate8_variant01_native_jog-fwd.png" "$ISOLATED_PROJECT/gate8_variant01_native_sprint.png"; do test -s "$png"; done
          python - <<'PY'
          import json, math, struct
          from pathlib import Path
          r=json.loads(Path('/tmp/gate8_variant01_native_retarget_ab_result.json').read_text())
          s=json.loads(Path('/tmp/gate8_variant01_native_skin_remap_result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-variant01-native-retarget-ab-result-v1'
          assert r['candidate_variant']==1 and r['reviewed_roles']==22
          assert r['retarget_engine']=='RetargetModifier3D'
          assert r['use_global_pose'] is False and r['position_enabled'] is False and r['rotation_enabled'] is True and r['scale_enabled'] is False
          assert r['source_bone_names_unchanged'] is True and r['source_animation_tracks_unchanged'] is True
          assert r['target_rest_pose_unchanged'] is True and r['target_parent_topology_unchanged'] is True and r['target_bone_indices_unchanged'] is True
          assert r['run_alias_selected']=='' and r['production_authorized'] is False and r['runtime_population_changed'] is False
          assert s['runtime_only'] is True
          assert s['skins'] > 0 and s['binds'] > 0 and s['renamed_binds'] >= 22
          assert s['bind_count_unchanged'] is True and s['bind_poses_unchanged'] is True and s['bind_bone_indices_unchanged'] is True
          assert s['missing_named_binds_after_remap'] == 0
          assert len(r['clips'])==2
          for clip in ['Jog_Fwd','Sprint']:
              row=r['clips'][clip]
              assert row['sample_count']>=80
              assert row['left_contact_samples']+row['right_contact_samples']>0
              for key in ['mean_contact_slide_mps','peak_contact_slide_mps','ground_correction_span_m','ground_correction_max_step_m','mean_torso_bend_delta_deg','peak_torso_bend_delta_deg']:
                  assert math.isfinite(float(row[key])), (clip,key)
              assert row['frame_width']==1280 and row['frame_height']==720
          def png_size(path):
              data=Path(path).read_bytes(); assert data[:8]==b'\x89PNG\r\n\x1a\n'; assert data[12:16]==b'IHDR'; return struct.unpack('>II',data[16:24])
          assert png_size('/tmp/gate8-variant01-native-retarget-ab/gate8_variant01_native_jog-fwd.png')==(1280,720)
          assert png_size('/tmp/gate8-variant01-native-retarget-ab/gate8_variant01_native_sprint.png')==(1280,720)
          print('GATE8_NATIVE_AB_RESULT_CAPTURED clips=2 frames=2 skin_remap=true production_authorized=false')
          PY
          ! grep -q 'contains named bind.*Skeleton3D has no bone by that name' /tmp/gate8-native-ab.log
          grep -q '^GATE8_NATIVE_SKIN_REMAP .*missing=0 .*bind_count_unchanged=true .*bind_poses_unchanged=true .*bind_bones_unchanged=true .*runtime_only=true$' /tmp/gate8-native-ab.log
          if [ "$STATUS" -eq 0 ]; then
            grep -q '^GATE8_VARIANT01_NATIVE_RETARGET_AB_OK candidate=01 clips=Jog_Fwd,Sprint engine=RetargetModifier3D alias_selected=false production_authorized=false$' /tmp/gate8-native-ab.log
          else
            echo 'Native RetargetModifier3D A-B failed closed; inspect metrics and valid skin-remapped frames.' >&2
            exit "$STATUS"
          fi

      - name: Stage native A-B evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-native-ab-evidence; mkdir -p /tmp/gate8-native-ab-evidence
          for f in /tmp/gate8_variant01_native_retarget_ab_result.json /tmp/gate8_variant01_native_skin_remap_result.json /tmp/gate8-native-ab.log /tmp/gate8-native-ab-import.log /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt "$ISOLATED_PROJECT/gate8_variant01_native_jog-fwd.png" "$ISOLATED_PROJECT/gate8_variant01_native_sprint.png"; do
            if [ -s "$f" ]; then cp "$f" /tmp/gate8-native-ab-evidence/; fi
          done
          sha256sum /tmp/gate8-native-ab-evidence/* | sort -k2 | tee /tmp/gate8-native-ab-evidence/sha256.txt

      - name: Prove repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-native-ab-git-status.txt
          test ! -s /tmp/gate8-native-ab-git-status.txt

      - name: Upload native A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-native-retarget-ab
          path: /tmp/gate8-native-ab-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
