name: Grand Bruxelles Gate-8 Variant01 Residual Shoulder Topology

on:
  push:
    branches: ["npc/gate8-variant01-residual-shoulder-topology-20260829"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-residual-shoulder-topology.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_residual_shoulder_topology.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_residual_shoulder_topology.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  residual-shoulder-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARTIFACT_ID: "9705913271"
      ARTIFACT_DIGEST: "sha256:f502fed9576650dac3cfd19b5547f14d28c53ba51bd047270cf2deea3897dd18"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main bounded scope and frozen rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = "cc834a7db81286cb8df042a985ef8b65697169b8"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-scope.txt
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-residual-shoulder-topology.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_residual_shoulder_topology.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_residual_shoulder_topology.py' | sort > /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          python3 - <<'PY'
          import json
          m=json.load(open('grand-bruxelles-game/data/qa/gate8_variant01_residual_shoulder_topology.json'))
          assert m['base_main_sha']=='cc834a7db81286cb8df042a985ef8b65697169b8'
          assert m['candidate_variant']==1
          assert m['target_sha256']=='912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9'
          assert all(v is False for v in m['rails'].values())
          PY
          printf '%s\n' "$LIVE_MAIN" > /tmp/live-main.txt

      - name: Verify and download immutable split A-B artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/artifact.json'))
          assert not a['expired']
          assert a['digest']==os.environ['ARTIFACT_DIGEST']
          PY
          mkdir -p /tmp/split-ab
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/split-ab.zip
          unzip -q /tmp/split-ab.zip -d /tmp/split-ab
          for f in split-shoulder-ab-result.json baseline-result.json left-result.json right-result.json materialize-summary.json; do test -s "/tmp/split-ab/$f"; done

      - name: Classify residual topology and fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/gate8_variant01_residual_shoulder_topology.py \
            grand-bruxelles-game/data/qa/gate8_variant01_residual_shoulder_topology.json \
            /tmp/split-ab /tmp/residual-shoulder-topology-result.json | tee /tmp/classifier.log
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/residual-shoulder-topology-result.json'))
          assert r['diagnostic_state']=='RIGHT_CLUSTER_OPERATOR_CREATES_ADJACENT_RESIDUAL_FAILURE'
          assert r['right']['candidate_worst_edge']==[417,1510]
          assert r['right']['modified_vertex_on_new_worst_edge']==1510
          assert r['right']['stretch_regression_ratio']>=1.4
          assert r['next_safe_axis']=='MAP_RIGHT_CLUSTER_BOUNDARY_ONE_RING_BEFORE_ANY_MORE_REWEIGHT'
          assert not r['production_activation_allowed'] and not r['visual_approval_allowed']
          PY

      - name: Require repository clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-residual-shoulder-topology-${{ github.sha }}
          path: |
            /tmp/residual-shoulder-topology-result.json
            /tmp/artifact.json
            /tmp/live-main.txt
            /tmp/classifier.log
          retention-days: 14
