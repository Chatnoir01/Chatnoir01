name: Grand Bruxelles Gate-8 Variant-01 Retarget Preflight

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/gate8_variant01_retarget_preflight.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_retarget_preflight_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-variant01-retarget-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variant01-retarget-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREFLIGHT_MANIFEST: "grand-bruxelles-game/data/qa/gate8_variant01_retarget_preflight.json"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      SOURCE_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      SOURCE_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      SOURCE_BYTES: "14541205"
      SOURCE_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-retarget-preflight"
    steps:
      - uses: actions/checkout@v4

      - name: Static ownership provenance and fail-closed rails
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("grand-bruxelles-game/data/qa/gate8_variant01_retarget_preflight.json").read_text())
          target = data["target_character"]
          source = data["animation_source"]
          rails = data["rails"]
          gate = data["preflight_gate"]
          assert data["format"] == "grand-bruxelles-gate8-variant01-retarget-preflight-v2"
          assert data["base_main_sha"] == "d0ffc87f88d851298feabea67d52192929ff49cb"
          assert data["candidate_variant"] == 1
          assert data["candidate_static_verdict"] == "AMELIORER"
          assert data["candidate_dynamic_state"] == "BLOCKED_NO_EXACT_RUN"
          assert target["artifact_id"] == 9470539830
          assert target["artifact_sha256"] == "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
          assert target["glb_filename"] == "npc_gate_01.glb"
          assert target["expected_animation_players"] == 0
          assert source["license"] == "CC0-1.0"
          assert source["package_sha256"] == "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
          assert source["package_size_bytes"] == 14541205
          assert source["godot_standard_glb"] == "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
          assert source["publisher_marks_unstable"] is True
          assert source["known_upper_chest_risk"] is True
          assert source["expected_engine_animation_count"] == 46
          assert source["expected_exact_token_counts"] == {"idle": 8, "walk": 2, "run": 0}
          assert source["review_only_run_alternatives"] == ["Jog_Fwd", "Sprint"]
          assert rails["single_survivor_only"] is True
          assert rails["allowed_variants"] == [1]
          assert rails["rejected_variants_forbidden"] == [2, 4, 7]
          assert rails["other_survivors_out_of_scope"] == [3, 5, 6, 8]
          assert rails["mixamo_payload_allowed"] is False
          assert rails["player_character_reuse_allowed"] is False
          assert rails["production_authorized"] is False
          assert rails["retarget_authorized"] is False
          assert rails["retarget_applied"] is False
          assert rails["activation_ready"] is False
          assert rails["adoption_ready"] is False
          assert rails["package_bytes_committed"] is False
          assert rails["semantic_alias_auto_promotion_allowed"] is False
          assert gate["godot_version"] == "4.7.1"
          assert gate["isolated_project_required"] is True
          assert gate["engine_visible_internal_catalog_required"] is True
          assert gate["exact_token_locomotion_surface_required_for_adoption"] is True
          assert gate["blocked_source_is_valid_preflight_result"] is True
          assert gate["bone_map_application_authorized"] is False
          print("GATE8_VARIANT01_RETARGET_STATIC_OK candidate=01 state=BLOCKED_NO_EXACT_RUN license=CC0-1.0 retarget_applied=false production_authorized=false")
          PY

      - name: Download immutable helper-clean Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          TARGET_PATH="$(find /tmp/gate8-target -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET_PATH"
          test "$(find /tmp/gate8-target -type f -name 'npc_gate_*.glb' | wc -l)" = "8"
          echo "TARGET_PATH=$TARGET_PATH" >> "$GITHUB_ENV"
          sha256sum /tmp/gate8-target.zip | tee /tmp/gate8-target-artifact.sha256

      - name: Download exact pinned CC0 animation package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            -A 'Grand-Bruxelles-Character-NPC-Retarget-Preflight/1.0' \
            "$SOURCE_URL" -o /tmp/gate8-animation-source.zip
          test -s /tmp/gate8-animation-source.zip
          test "$(sha256sum /tmp/gate8-animation-source.zip | awk '{print $1}')" = "$SOURCE_SHA256"
          test "$(stat -c '%s' /tmp/gate8-animation-source.zip)" = "$SOURCE_BYTES"
          sha256sum /tmp/gate8-animation-source.zip | tee /tmp/gate8-animation-source.sha256

      - name: Extract only the pinned Godot animation container
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          archive_path = Path('/tmp/gate8-animation-source.zip')
          member = os.environ['SOURCE_GLB']
          output = Path('/tmp/animation_source.glb')
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              if member not in names:
                  raise SystemExit(f'pinned Godot GLB missing: {member}')
              payload = archive.read(member)
          if len(payload) < 1024:
              raise SystemExit('pinned Godot GLB unexpectedly small')
          output.write_bytes(payload)
          print(f'GATE8_VARIANT01_SOURCE_GLB_OK member={member} bytes={len(payload)}')
          PY
          test -s /tmp/animation_source.glb

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated variant-01 retarget preflight project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"
          mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          ; Gate-8 variant-01 retarget preflight only. No autoloads, no production runtime.
          config_version=5

          [application]
          config/name="Gate8Variant01RetargetPreflight"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp "$TARGET_PATH" "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_retarget_preflight_test.gd "$ISOLATED_PROJECT/game/tests/"
          test -s "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          test -s "$ISOLATED_PROJECT/assets/animation_source.glb"
          ! grep -q '^\[autoload\]' "$ISOLATED_PROJECT/project.godot"

      - name: Import source and target under Godot 4.7.1
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-variant01-retarget-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-variant01-retarget-import.log

      - name: Measure engine-visible catalog skeleton and humanoid anchors
        run: |
          set -euo pipefail
          timeout 90s "$GODOT" --headless --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_retarget_preflight_test.gd 2>&1 | tee /tmp/gate8-variant01-retarget-preflight.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-variant01-retarget-preflight.log
          grep -q '^GATE8_VARIANT01_RETARGET_PREFLIGHT_OK state=BLOCKED_NO_EXACT_RUN$' /tmp/gate8-variant01-retarget-preflight.log
          test -s "$ISOLATED_PROJECT/gate8_variant01_retarget_preflight_result.json"
          cp "$ISOLATED_PROJECT/gate8_variant01_retarget_preflight_result.json" /tmp/gate8_variant01_retarget_preflight_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/gate8_variant01_retarget_preflight_result.json').read_text())
          assert result['format'] == 'grand-bruxelles-gate8-variant01-retarget-preflight-result-v2'
          assert result['engine_version'] == '4.7.1-stable (official)'
          assert result['candidate_variant'] == 1
          assert result['candidate_static_verdict'] == 'AMELIORER'
          assert result['candidate_dynamic_state'] == 'BLOCKED_NO_EXACT_RUN'
          assert result['source_animation_players'] == 1
          assert result['source_animation_count'] == 46
          assert result['target_animation_players'] == 0
          assert result['target_animation_count'] == 0
          assert result['locomotion_candidates']['idle'] == [
              'Crouch_Idle', 'Idle', 'Idle_Talking', 'Idle_Torch', 'Pistol_Idle',
              'Sitting_Idle', 'Spell_Simple_Idle', 'Swim_Idle'
          ]
          assert result['locomotion_candidates']['walk'] == ['Walk', 'Walk_Formal']
          assert result['locomotion_candidates']['run'] == []
          assert result['run_alternatives_review_only'] == {'jog': ['Jog_Fwd'], 'sprint': ['Sprint']}
          assert result['complete_exact_token_locomotion_surface'] is False
          assert result['exact_single_idle_walk_run_trio'] is False
          assert result['source_suitable_for_direct_idle_walk_run_adoption'] is False
          assert result['semantic_alias_auto_promotion_allowed'] is False
          assert result['source_skeletons'] == 1
          assert result['target_skeletons'] == 1
          assert result['target_skinned_meshes'] == 8
          assert result['source_upper_chest_candidates'] == 2
          assert result['target_upper_chest_candidates'] == 2
          assert result['retarget_applied'] is False
          assert result['production_authorized'] is False
          assert result['activation_ready'] is False
          assert result['adoption_ready'] is False
          assert result['grounding_measured'] is False
          assert result['foot_slide_measured'] is False
          assert result['player_view_reviewed'] is False
          assert result['failures'] == []
          print(
              'GATE8_VARIANT01_ENGINE_PREFLIGHT_OK '
              "animations=46 idle=8 walk=2 run=0 "
              f"run_alternatives={result['run_alternatives_review_only']} "
              'source_skeletons=1 target_skeletons=1 target_skinned_meshes=8 '
              'source_upper_chest=2 target_upper_chest=2 '
              'state=BLOCKED_NO_EXACT_RUN retarget_applied=false production_authorized=false'
          )
          PY

      - name: Prove repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-variant01-retarget-git-status.txt
          test ! -s /tmp/gate8-variant01-retarget-git-status.txt

      - name: Upload retarget preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-retarget-preflight
          path: |
            /tmp/gate8_variant01_retarget_preflight_result.json
            /tmp/gate8-variant01-retarget-preflight.log
            /tmp/gate8-variant01-retarget-import.log
            /tmp/gate8-target-artifact.sha256
            /tmp/gate8-animation-source.sha256
            /tmp/godot-version.txt
            /tmp/gate8-variant01-retarget-git-status.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
