name: Grand Bruxelles Gate-8 Variant-01 Run Semantic A-B

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/gate8_variant01_run_semantic_ab.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_run_semantic_ab_test.gd"
      - ".github/workflows/grand-bruxelles-gate8-variant01-run-semantic-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant01-run-semantic-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      SOURCE_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      SOURCE_BYTES: "14541205"
      SOURCE_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-run-semantic-ab"
    steps:
      - uses: actions/checkout@v4

      - name: Validate fail-closed semantic A-B contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("grand-bruxelles-game/data/qa/gate8_variant01_run_semantic_ab.json").read_text())
          source = data["animation_source"]
          gate = data["measurement_gate"]
          rails = data["rails"]
          assert data["format"] == "grand-bruxelles-gate8-variant01-run-semantic-ab-v1"
          assert data["base_main_sha"] == "d83495ad605507737dd9191eb0a46e51692e256e"
          assert data["candidate_variant"] == 1
          assert data["candidate_static_verdict"] == "AMELIORER"
          assert data["source_dynamic_state"] == "BLOCKED_NO_EXACT_RUN"
          assert source["license"] == "CC0-1.0"
          assert source["package_sha256"] == "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
          assert source["package_size_bytes"] == 14541205
          assert source["candidate_clips"] == ["Jog_Fwd", "Sprint"]
          assert source["exact_run_candidates"] == []
          assert gate["godot_version"] == "4.7.1"
          assert gate["isolated_project_required"] is True
          assert gate["sample_rate_hz"] == 120
          assert gate["required_anchors"] == ["hips", "left_foot", "right_foot"]
          assert gate["measure_step_cadence"] is True
          assert gate["measure_hips_horizontal_motion"] is True
          assert gate["measure_foot_contact_slide"] is True
          assert gate["selection_requires_human_review"] is True
          assert gate["bone_map_application_authorized"] is False
          assert rails["allowed_variants"] == [1]
          assert rails["rejected_variants_forbidden"] == [2, 4, 7]
          assert rails["other_survivors_out_of_scope"] == [3, 5, 6, 8]
          assert rails["mixamo_payload_allowed"] is False
          assert rails["player_character_reuse_allowed"] is False
          assert rails["semantic_alias_auto_promotion_allowed"] is False
          assert rails["run_alias_selected"] == ""
          assert rails["retarget_authorized"] is False
          assert rails["retarget_applied"] is False
          assert rails["production_authorized"] is False
          assert rails["activation_ready"] is False
          assert rails["adoption_ready"] is False
          assert rails["package_bytes_committed"] is False
          print("GATE8_VARIANT01_RUN_AB_STATIC_OK candidate=01 clips=Jog_Fwd,Sprint alias_selected=false retarget_applied=false production_authorized=false")
          PY

      - name: Download exact pinned CC0 animation package
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Character-NPC-Run-Semantic-AB/1.0' "$SOURCE_URL" -o /tmp/gate8-animation-source.zip
          test -s /tmp/gate8-animation-source.zip
          test "$(sha256sum /tmp/gate8-animation-source.zip | awk '{print $1}')" = "$SOURCE_SHA256"
          test "$(stat -c '%s' /tmp/gate8-animation-source.zip)" = "$SOURCE_BYTES"
          sha256sum /tmp/gate8-animation-source.zip | tee /tmp/gate8-animation-source.sha256

      - name: Extract only the pinned Godot animation container
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          archive = Path('/tmp/gate8-animation-source.zip')
          member = os.environ['SOURCE_GLB']
          output = Path('/tmp/animation_source.glb')
          with zipfile.ZipFile(archive) as bundle:
              if member not in bundle.namelist():
                  raise SystemExit(f'pinned Godot GLB missing: {member}')
              payload = bundle.read(member)
          if len(payload) < 1024:
              raise SystemExit('pinned Godot GLB unexpectedly small')
          output.write_bytes(payload)
          print(f'GATE8_VARIANT01_RUN_AB_SOURCE_OK member={member} bytes={len(payload)}')
          PY
          test -s /tmp/animation_source.glb

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated semantic A-B project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"
          mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01RunSemanticAB"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_run_semantic_ab_test.gd "$ISOLATED_PROJECT/game/tests/"
          ! grep -q '^\[autoload\]' "$ISOLATED_PROJECT/project.godot"

      - name: Import pinned source under Godot 4.7.1
        run: |
          set -euo pipefail
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-variant01-run-ab-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-variant01-run-ab-import.log

      - name: Measure Jog_Fwd versus Sprint cadence root motion and foot contact
        run: |
          set -euo pipefail
          timeout 120s "$GODOT" --headless --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_run_semantic_ab_test.gd 2>&1 | tee /tmp/gate8-variant01-run-ab.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-variant01-run-ab.log
          grep -q '^GATE8_VARIANT01_RUN_SEMANTIC_AB_OK state=MEASURED_REVIEW_REQUIRED alias_selected=false retarget_applied=false production_authorized=false$' /tmp/gate8-variant01-run-ab.log
          test "$(grep -c '^GATE8_VARIANT01_RUN_AB clip=' /tmp/gate8-variant01-run-ab.log)" = "2"
          test -s "$ISOLATED_PROJECT/gate8_variant01_run_semantic_ab_result.json"
          cp "$ISOLATED_PROJECT/gate8_variant01_run_semantic_ab_result.json" /tmp/gate8_variant01_run_semantic_ab_result.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          result = json.loads(Path('/tmp/gate8_variant01_run_semantic_ab_result.json').read_text())
          assert result['format'] == 'grand-bruxelles-gate8-variant01-run-semantic-ab-result-v1'
          assert result['engine_version'] == '4.7.1-stable (official)'
          assert result['candidate_variant'] == 1
          assert result['candidate_static_verdict'] == 'AMELIORER'
          assert result['source_dynamic_state'] == 'BLOCKED_NO_EXACT_RUN'
          assert result['clips'] == ['Jog_Fwd', 'Sprint']
          assert result['cadence_measured'] is True
          assert result['hips_horizontal_motion_measured'] is True
          assert result['foot_contact_slide_measured'] is True
          assert result['run_alias_selected'] == ''
          assert result['selection_state'] == 'MEASURED_REVIEW_REQUIRED'
          assert result['semantic_alias_auto_promotion_allowed'] is False
          assert result['bone_map_applied'] is False
          assert result['retarget_applied'] is False
          assert result['production_authorized'] is False
          assert result['activation_ready'] is False
          assert result['adoption_ready'] is False
          assert result['failures'] == []
          for clip in ['Jog_Fwd', 'Sprint']:
              metric = result['measurements'][clip]
              assert metric['clip'] == clip
              assert 0.2 < metric['length_s'] <= 10.0
              assert metric['sample_rate_hz'] == 120.0
              assert metric['sample_count'] >= 3
              assert metric['root_motion_mode'] in ['in_place', 'traveling']
              assert metric['total_foot_strikes'] >= 1
              assert metric['left_contact']['contact_intervals'] + metric['right_contact']['contact_intervals'] >= 1
              for key in ['length_s', 'steps_per_minute', 'hips_horizontal_displacement_m', 'hips_horizontal_path_m', 'contact_slide_mean_mps', 'contact_slide_max_mps']:
                  assert math.isfinite(metric[key]), (clip, key, metric[key])
              assert metric['steps_per_minute'] > 0.0
              assert metric['hips_horizontal_displacement_m'] >= 0.0
              assert metric['contact_slide_mean_mps'] >= 0.0
              assert metric['contact_slide_max_mps'] >= metric['contact_slide_mean_mps']
          print('GATE8_VARIANT01_RUN_AB_RESULT_OK clips=2 selection=MEASURED_REVIEW_REQUIRED alias_selected=false')
          PY

      - name: Prove repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-variant01-run-ab-git-status.txt
          test ! -s /tmp/gate8-variant01-run-ab-git-status.txt

      - name: Upload semantic A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-run-semantic-ab
          path: |
            /tmp/gate8_variant01_run_semantic_ab_result.json
            /tmp/gate8-variant01-run-ab.log
            /tmp/gate8-variant01-run-ab-import.log
            /tmp/gate8-animation-source.sha256
            /tmp/godot-version.txt
            /tmp/gate8-variant01-run-ab-git-status.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
