name: Grand Bruxelles Gate-8 Variant01 Shoulder Operator Split

on:
  push:
    branches: ["npc/gate8-variant01-shoulder-operator-split-20260829"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-shoulder-operator-split.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_shoulder_operator_split.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_shoulder_operator_split_test.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EVIDENCE_ID: "9703527268"
      EVIDENCE_DIGEST: "sha256:8aad3c20aff738d791f9bb0a92394c04b8309ff05964a78f4ca621d2b9637c61"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live main and bounded Character/NPC scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$LIVE_MAIN" = "a2dff976c48e1e566d2eb26bab4ce138d6dfb813"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          git diff --name-only origin/main...HEAD | sort > "$RUNNER_TEMP/actual"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-shoulder-operator-split.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_shoulder_operator_split.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_shoulder_operator_split_test.py' | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/actual"
          echo "$LIVE_MAIN" > "$RUNNER_TEMP/live-main.txt"
      - name: Verify and download immutable Godot two-ring evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ID}" > "$RUNNER_TEMP/artifact.json"
          python3 - "$RUNNER_TEMP/artifact.json" "$EVIDENCE_DIGEST" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); assert not a['expired']; assert a['digest']==sys.argv[2]
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ID}/zip" > "$RUNNER_TEMP/evidence.zip"
          mkdir "$RUNNER_TEMP/evidence" && unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
          test -f "$RUNNER_TEMP/evidence/result.json"
      - name: Classify separate left and right shoulder operator families
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/gate8_variant01_shoulder_operator_split_test.py \
            grand-bruxelles-game/data/qa/gate8_variant01_shoulder_operator_split.json \
            "$RUNNER_TEMP/evidence/result.json" | tee "$RUNNER_TEMP/classification.txt"
          cp "$RUNNER_TEMP/evidence/result.json" "$RUNNER_TEMP/result.json"
      - name: Require repository clean
        run: test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant01-shoulder-operator-split-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/live-main.txt
            ${{ runner.temp }}/artifact.json
            ${{ runner.temp }}/classification.txt
            ${{ runner.temp }}/result.json
          retention-days: 14
