name: Grand Bruxelles Gate-8 Variant-01 Source Arm Swing Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-source-arm-swing-inventory.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_source_arm_swing_inventory.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_source_locomotion_candidate_scan.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_foot_slide_root_compensation_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-arm-swing-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      NATIVE_AB_DEPENDENCY_COMMIT: "0f5dbcc64dd44e88490df575bae4664f6bd18520"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-source-arm-swing-inventory"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate fail-closed inventory contract
        run: |
          set -euo pipefail
          T=grand-bruxelles-game/data/qa/gate8_variant01_source_arm_swing_inventory.gd.txt
          grep -Fq 'const ARM_SWING_INVENTORY_SAMPLE_RATE_HZ := 120.0' "$T"
          grep -Fq 'ARM_SWING_INVENTORY_BONES := ["DEF-upper_arm.L", "DEF-upper_arm.R"]' "$T"
          grep -Fq 'measurement_only_no_semantic_alias_auto_promotion' "$T"
          grep -Fq 'walk_alias_selected": ""' "$T"
          grep -Fq 'run_alias_selected": ""' "$T"
          grep -Fq 'production_authorized": false' "$T"
          grep -Fq 'retarget_changed": false' "$T"
          grep -Fq 'skin_changed": false' "$T"
          grep -Fq 'root_motion_applied": false' "$T"

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-ArmSwingInventory/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"; "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated inventory project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"; mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01SourceArmSwingInventory"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NATIVE_AB_DEPENDENCY_COMMIT}/grand-bruxelles-game/game/tests"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_test.gd"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_v2_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_rest_normalized_animation_ab_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_foot_slide_root_compensation_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_foot_slide_root_compensation_diagnostic.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_source_locomotion_candidate_scan.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_source_locomotion_candidate_scan.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_source_arm_swing_inventory.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_source_arm_swing_inventory.gd"
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-arm-swing-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-arm-swing-import.log

      - name: Measure all source arm swings
        run: |
          set -euo pipefail
          timeout 600s "$GODOT" --headless --audio-driver Dummy --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_source_arm_swing_inventory.gd 2>&1 | tee /tmp/gate8-arm-swing.log
          RESULT="$ISOLATED_PROJECT/gate8_variant01_source_arm_swing_inventory_result.json"
          test -s "$RESULT"; cp "$RESULT" /tmp/gate8_variant01_source_arm_swing_inventory_result.json
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          r=json.loads(Path('/tmp/gate8_variant01_source_arm_swing_inventory_result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-variant01-source-arm-swing-inventory-v1'
          assert r['engine_version'].startswith('4.7.1') and r['diagnostic_state']=='SOURCE_ARM_SWING_INVENTORY_COMPLETE' and r['failures']==[]
          assert r['animation_count']==46 and len(r['clips'])==46
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['retarget_changed'] is False and r['skin_changed'] is False and r['root_motion_applied'] is False
          for row in r['clips']:
              assert math.isfinite(float(row['max_upper_arm_swing_deg'])) and row['sample_count']>=24
          print('GATE8_SOURCE_ARM_SWING_INVENTORY_OK animations=%d lowest=%s:%.6f' % (r['animation_count'], r['clips'][0]['animation_name'], float(r['clips'][0]['max_upper_arm_swing_deg'])))
          PY
          grep -q '^GATE8_SOURCE_ARM_SWING_INVENTORY state=SOURCE_ARM_SWING_INVENTORY_COMPLETE animations=46 failures=0 alias_selected=false production_authorized=false$' /tmp/gate8-arm-swing.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-arm-swing.log

      - name: Stage inventory evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-arm-swing-evidence; mkdir -p /tmp/gate8-arm-swing-evidence
          for f in /tmp/gate8_variant01_source_arm_swing_inventory_result.json /tmp/gate8-arm-swing.log /tmp/gate8-arm-swing-import.log /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt; do
            [ -f "$f" ] && cp "$f" /tmp/gate8-arm-swing-evidence/
          done
          git status --porcelain=v1 > /tmp/gate8-arm-swing-evidence/git-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-gate8-variant01-source-arm-swing-inventory
          path: /tmp/gate8-arm-swing-evidence
          if-no-files-found: error
          retention-days: 14
