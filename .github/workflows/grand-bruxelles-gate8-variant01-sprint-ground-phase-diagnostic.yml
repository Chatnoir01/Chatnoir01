name: Grand Bruxelles Gate-8 Variant-01 Sprint Ground Phase Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-sprint-ground-phase-diagnostic.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_sprint_ground_phase_diagnostic.json"
      - "grand-bruxelles-game/data/qa/gate8_variant01_sprint_ground_phase_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sprint-ground-phase-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      NATIVE_AB_DEPENDENCY_COMMIT: "0f5dbcc64dd44e88490df575bae4664f6bd18520"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      PROJECT: "/tmp/gate8-sprint-ground-phase"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Lock live fail-closed diagnostic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_sprint_ground_phase_diagnostic.json').read_text())
          assert d['format']=='grand-bruxelles-gate8-variant01-sprint-ground-phase-contract-v1'
          assert d['base_main_sha']=='bea8265f66fa2a94f5b51cb622cbe1d255bb83de'
          assert d['owner_pr']==1264 and d['candidate_variant']==1
          assert d['source_animation']['license']=='CC0-1.0'
          assert d['source_animation']['package_sha256']=='18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2'
          assert d['target']['glb_sha256']=='912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9'
          red=d['reproduced_red']
          assert red['run_id']==32786724907 and red['artifact_id']==9541750894
          assert red['artifact_digest_sha256']=='5235d8826fa22afec6b3a1ac97d281f7ad855355bb16639e81829343270cb0c4'
          assert red['sprint_ground_span_m']>red['ground_span_limit_m']
          assert red['sprint_ground_step_m']<=red['ground_step_limit_m']
          g=d['frozen_thresholds']
          assert g['sample_rate_hz']==120 and g['minimum_samples_per_clip']==80
          assert g['max_ground_correction_span_m']==0.18
          assert g['max_ground_correction_step_m']==0.08
          assert g['contact_height_window_m']==0.04
          r=d['rails']
          assert r['thresholds_changed'] is False
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['runtime_population_changed'] is False and r['visual_approval_claimed'] is False
          assert r['mixamo_payload_allowed'] is False and r['player_character_reuse_allowed'] is False
          print('GATE8_SPRINT_GROUND_PHASE_CONTRACT_OK thresholds_unchanged=true production_authorized=false')
          PY
          P=grand-bruxelles-game/data/qa/gate8_variant01_sprint_ground_phase_diagnostic.gd.txt
          grep -Fq 'GROUND_SPAN_FAILURE_FLIGHT_PHASE_DRIVEN' "$P"
          grep -Fq 'GROUND_SPAN_FAILURE_SUPPORT_PHASE_PERSISTS' "$P"
          grep -Fq 'all_phase_span <= MAX_GROUND_CORRECTION_SPAN_M' "$P"
          grep -Fq 'max_step > MAX_GROUND_CORRECTION_STEP_M' "$P"
          ! grep -Eq 'MAX_GROUND_CORRECTION_SPAN_M\s*:=' "$P"
          ! grep -Eq 'MAX_GROUND_CORRECTION_STEP_M\s*:=' "$P"

      - name: Download exact pinned CC0 animation source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-SprintGroundPhase/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist()
              Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-target && mkdir -p /tmp/gate8-target
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target
          TARGET="$(find /tmp/gate8-target -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET"
          cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT"
          "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated Sprint diagnostic project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT"
          mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          cat > "$PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8SprintGroundPhaseDiagnostic"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NATIVE_AB_DEPENDENCY_COMMIT}/grand-bruxelles-game/game/tests"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_test.gd" -o "$PROJECT/game/tests/gate8_variant01_native_retarget_ab_test.gd"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_v2_test.gd" -o "$PROJECT/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt "$PROJECT/game/tests/gate8_variant01_rest_normalized_animation_ab_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_sprint_ground_phase_diagnostic.gd.txt "$PROJECT/game/tests/gate8_variant01_sprint_ground_phase_diagnostic.gd"
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee /tmp/sprint-ground-phase-import.log
          test -d "$PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/sprint-ground-phase-import.log

      - name: Measure Sprint support and flight phases
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_sprint_ground_phase_diagnostic.gd 2>&1 | tee /tmp/sprint-ground-phase.log
          RESULT="$PROJECT/gate8_variant01_sprint_ground_phase_result.json"
          test -s "$RESULT"
          cp "$RESULT" /tmp/sprint-ground-phase-result.json
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path('/tmp/sprint-ground-phase-result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-variant01-sprint-ground-phase-v1'
          assert r['candidate_variant']==1 and r['clip']=='Sprint'
          assert r['retarget_engine']=='RetargetModifier3D'
          assert r['normalization_formula']=='D=Rs^-1*Ps; Pnormalized=Rt*D'
          assert r['sample_count']>=80 and r['sample_rate_hz']==120.0
          assert r['all_phase_ground_correction_span_m']>r['all_phase_span_limit_m']
          assert r['max_adjacent_ground_correction_step_m']<=r['max_adjacent_step_limit_m']
          assert r['support_sample_count']>0
          assert r['diagnostic_state'] in {'GROUND_SPAN_FAILURE_FLIGHT_PHASE_DRIVEN','GROUND_SPAN_FAILURE_SUPPORT_PHASE_PERSISTS'}
          for key in ['all_phase_ground_correction_span_m','support_ground_correction_span_m','flight_ground_correction_span_m','max_adjacent_ground_correction_step_m']:
              assert math.isfinite(float(r[key])), key
          assert r['failures']==[]
          assert r['thresholds_changed'] is False
          assert r['source_asset_rest_mutated'] is False and r['target_asset_rest_mutated'] is False and r['target_skin_modified'] is False
          assert r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['runtime_population_changed'] is False and r['visual_approval_claimed'] is False
          print('GATE8_SPRINT_GROUND_PHASE_OK state=%s all_span=%.6f support_span=%.6f flight_span=%.6f support=%d flight=%d' % (
              r['diagnostic_state'], r['all_phase_ground_correction_span_m'], r['support_ground_correction_span_m'],
              r['flight_ground_correction_span_m'], r['support_sample_count'], r['flight_sample_count']))
          PY
          grep -q '^GATE8_SPRINT_GROUND_PHASE_RESULT failures=0 production_authorized=false alias_selected=false$' /tmp/sprint-ground-phase.log

      - name: Stage diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-sprint-ground-phase-evidence
          mkdir -p /tmp/gate8-sprint-ground-phase-evidence
          for f in /tmp/sprint-ground-phase-result.json /tmp/sprint-ground-phase.log /tmp/sprint-ground-phase-import.log /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt; do
            if [ -s "$f" ]; then cp "$f" /tmp/gate8-sprint-ground-phase-evidence/; fi
          done
          sha256sum /tmp/gate8-sprint-ground-phase-evidence/* | sort -k2 | tee /tmp/gate8-sprint-ground-phase-evidence/sha256.txt

      - name: Prove repository remained untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-sprint-ground-phase-git-status.txt
          test ! -s /tmp/gate8-sprint-ground-phase-git-status.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-sprint-ground-phase
          path: /tmp/gate8-sprint-ground-phase-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
