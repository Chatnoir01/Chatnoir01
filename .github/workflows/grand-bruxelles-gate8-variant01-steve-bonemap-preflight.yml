name: Grand Bruxelles Gate-8 Variant-01 Steve BoneMap Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-steve-bonemap-preflight.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_steve_bonemap_preflight.json"
      - "grand-bruxelles-game/game/tests/gate8_variant01_steve_bonemap_preflight_test.gd"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  steve-bonemap-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_ZIP: https://opengameart.org/sites/default/files/steve_npc1.zip
      SOURCE_SHA256: e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5
      SOURCE_BYTES: "1454243"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb
      TARGET_GLB_SHA256: 912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-steve-bonemap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Require exact current main and closed rails
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          LIVE="$(git rev-parse origin/main)"
          test "$LIVE" = "a1c74c0ffc61a35ed61dcee3a817508b74561eda"
          git diff --name-only "$LIVE" HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' '.github/workflows/grand-bruxelles-gate8-variant01-steve-bonemap-preflight.yml' 'grand-bruxelles-game/data/qa/gate8_variant01_steve_bonemap_preflight.json' 'grand-bruxelles-game/game/tests/gate8_variant01_steve_bonemap_preflight_test.gd' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_steve_bonemap_preflight.json').read_text())
          assert d['format'].endswith('-v4')
          assert d['base_main_sha']=='a1c74c0ffc61a35ed61dcee3a817508b74561eda'
          assert len(d['required_roles'])==17
          assert d['target_role_map']['neck']=='neck_01'
          assert sorted(d['expected_source_topology_gaps'])==['hips>spine','left_forearm>left_hand','left_lower_leg>left_foot','right_forearm>right_hand','right_lower_leg>right_foot']
          assert d['characterization']['state']=='BLOCKED_SPLIT_IK_DEFORM_TOPOLOGY'
          assert d['characterization']['direct_native_humanoid_topology_compatible'] is False
          assert d['characterization']['bonemap_ready'] is False
          assert d['measurement_gate']['record_full_bone_inventory'] is True
          assert d['measurement_gate']['walk_detection']=='exact_normalized_token'
          assert d['measurement_gate']['require_exact_expected_source_topology_gaps'] is True
          assert d['measurement_gate']['require_topology_gap_order_independence'] is True
          assert d['source']['license']=='CC0-1.0'
          rails=d['rails']
          for k in ['bonemap_applied','retarget_applied','production_authorized','activation_ready','adoption_ready','runtime_population_changed','visual_approval_claimed','package_bytes_committed','player_character_reuse_allowed','mixamo_payload_allowed']:
              assert rails[k] is False, k
          assert rails['walk_alias_selected']=='' and rails['run_alias_selected']==''
          print('GATE8_STEVE_BONEMAP_CONTRACT_OK roles=17 direct_native=false split_topology=true order_independent=true rails_closed=true')
          PY

      - name: Restore pinned CC0 source and export walk GLB
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$SOURCE_ZIP" -o "$RUNNER_TEMP/steve.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/steve.zip" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/steve.zip")" = "$SOURCE_BYTES"
          mkdir -p "$RUNNER_TEMP/steve-src" && unzip -q "$RUNNER_TEMP/steve.zip" -d "$RUNNER_TEMP/steve-src"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender python3-numpy >/dev/null
          blender --version | head -n 2 | tee "$RUNNER_TEMP/blender-version.txt"
          grep -q '^Blender 4\.0\.2' "$RUNNER_TEMP/blender-version.txt"
          cat > "$RUNNER_TEMP/export.py" <<'PY'
          import bpy, json
          from pathlib import Path
          arms=[o for o in bpy.data.objects if o.type=='ARMATURE']; assert len(arms)==1
          arm=arms[0]; walks=[a for a in bpy.data.actions if a.name.lower()=='walk']; assert len(walks)==1
          walk=walks[0]
          if arm.animation_data is None: arm.animation_data_create()
          arm.animation_data.action=walk
          for track in arm.animation_data.nla_tracks: track.mute=True
          bpy.context.scene.frame_start=int(walk.frame_range[0]); bpy.context.scene.frame_end=max(bpy.context.scene.frame_start+1,int(walk.frame_range[1]+0.9999))
          inv=[]
          for b in arm.data.bones:
              inv.append({'name':b.name,'parent':b.parent.name if b.parent else ''})
          Path('/tmp/steve_blender_bones.json').write_text(json.dumps(inv,indent=2))
          out=Path('/tmp/steve_source.glb')
          bpy.ops.export_scene.gltf(filepath=str(out),export_format='GLB',export_animations=True,export_draco_mesh_compression_enable=False)
          assert out.is_file() and out.stat().st_size>0
          print(f'GATE8_STEVE_BONEMAP_SOURCE_OK bytes={out.stat().st_size} action={walk.name} bones={len(arm.data.bones)}')
          PY
          blender --background "$RUNNER_TEMP/steve-src/steve_npc1.blend" --python "$RUNNER_TEMP/export.py" 2>&1 | tee "$RUNNER_TEMP/blender-export.log"
          grep -q '^GATE8_STEVE_BONEMAP_SOURCE_OK ' "$RUNNER_TEMP/blender-export.log"
          cp /tmp/steve_blender_bones.json "$RUNNER_TEMP/steve_blender_bones.json"
          sha256sum /tmp/steve_source.glb | tee "$RUNNER_TEMP/steve_source_glb.sha256"

      - name: Restore immutable Gate-8 target
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/target.zip"
          test "$(sha256sum "$RUNNER_TEMP/target.zip" | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          mkdir -p "$RUNNER_TEMP/target" && unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          TARGET="$(find "$RUNNER_TEMP/target" -type f -name npc_gate_01.glb -print -quit)"; test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb | tee "$RUNNER_TEMP/npc_gate_01.sha256"

      - name: Import exact source and target under Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"; test -x "$GODOT"
          "$GODOT" --version | tee "$RUNNER_TEMP/godot-version.txt"; grep -q '^4\.7\.1\.stable' "$RUNNER_TEMP/godot-version.txt"; echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          rm -rf "$PROJECT"; mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          printf '%s\n' 'config_version=5' '[application]' 'config/name="Gate8SteveBoneMapPreflight"' '[rendering]' 'renderer/rendering_method="gl_compatibility"' 'renderer/rendering_method.mobile="gl_compatibility"' > "$PROJECT/project.godot"
          cp /tmp/steve_source.glb "$PROJECT/assets/steve_source.glb"; cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"; cp grand-bruxelles-game/game/tests/gate8_variant01_steve_bonemap_preflight_test.gd "$PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          test -d "$PROJECT/.godot/imported"; ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open' "$RUNNER_TEMP/godot-import.log"

      - name: Characterize explicit BoneMap compatibility without retarget
        run: |
          set -euo pipefail
          timeout 180s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_steve_bonemap_preflight_test.gd 2>&1 | tee "$RUNNER_TEMP/bonemap.log"
          test -s "$PROJECT/gate8_variant01_steve_bonemap_preflight_result.json"
          cp "$PROJECT/gate8_variant01_steve_bonemap_preflight_result.json" "$RUNNER_TEMP/bonemap-result.json"
          python3 - "$RUNNER_TEMP/bonemap-result.json" <<'PY'
          import json, math, sys
          r=json.load(open(sys.argv[1]))
          expected=['hips>spine','left_forearm>left_hand','left_lower_leg>left_foot','right_forearm>right_hand','right_lower_leg>right_foot']
          assert r['format'].endswith('result-v4')
          assert r['required_role_count']==17
          assert r['source_bone_count']>=55 and r['target_bone_count']>=53
          assert len(r['source_bones'])==r['source_bone_count'] and len(r['target_bones'])==r['target_bone_count']
          assert isinstance(r['source_animation_names'],list) and r['source_walk_animation_name']=='walk'
          assert r['source_roles']['left_hand']=='hand.L' and r['source_roles']['left_foot']=='foot1.L'
          assert r['target_roles']['neck']=='neck_01'
          assert r['source_topology_gaps']==expected
          assert r['expected_source_topology_gaps']==expected
          assert r['topology_gap_order_independent'] is True
          assert r['target_topology_gaps']==[]
          assert r['characterization_complete'] is True and r['failures']==[]
          assert r['bonemap_ready'] is False and r['direct_native_humanoid_topology_compatible'] is False
          assert r['mechanical_state']=='BLOCKED_SPLIT_IK_DEFORM_TOPOLOGY'
          assert r['explicit_role_mapping_selected'] is True and r['bonemap_applied'] is False and r['retarget_applied'] is False
          assert r['walk_alias_selected']=='' and r['run_alias_selected']=='' and r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert math.isfinite(float(r['target_to_source_leg_ratio'])) and 0.45 <= float(r['target_to_source_leg_ratio']) <= 2.20
          print('GATE8_STEVE_BONEMAP_RESULT state=%s gaps=%d ratio=%.6f walk=%r' % (r['mechanical_state'],len(r['source_topology_gaps']),r['target_to_source_leg_ratio'],r['source_walk_animation_name']))
          PY
          grep -q '^GATE8_STEVE_BONEMAP_CHARACTERIZATION_OK roles=17 direct_native=false state=BLOCKED_SPLIT_IK_DEFORM_TOPOLOGY aliases=false production_authorized=false$' "$RUNNER_TEMP/bonemap.log"

      - name: Require repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/git-status.txt"; test ! -s "$RUNNER_TEMP/git-status.txt"

      - name: Upload immutable BoneMap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-steve-bonemap-preflight
          path: |
            ${{ runner.temp }}/bonemap-result.json
            ${{ runner.temp }}/bonemap.log
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/blender-version.txt
            ${{ runner.temp }}/blender-export.log
            ${{ runner.temp }}/steve_blender_bones.json
            ${{ runner.temp }}/steve_source_glb.sha256
            ${{ runner.temp }}/npc_gate_01.sha256
            ${{ runner.temp }}/git-status.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
