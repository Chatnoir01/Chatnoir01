name: Grand Bruxelles Gate-8 Variant-01 Steve Normalized Export Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-steve-normalized-export-preflight.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_steve_normalized_export_preflight.json"
      - "grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py"
      - "grand-bruxelles-game/game/tests/gate8_variant01_steve_normalized_export_preflight_test.gd"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  normalized-export-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_MAIN: 7ce0ab04f0759c1458bc7e31968884bf5da95448
      SOURCE_ZIP: https://opengameart.org/sites/default/files/steve_npc1.zip
      SOURCE_SHA256: e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5
      SOURCE_BYTES: "1454243"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb
      TARGET_GLB_SHA256: 912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-steve-normalized
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Require exact live main, bounded scope, and closed rails
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          LIVE="$(git rev-parse origin/main)"
          test "$LIVE" = "$EXPECTED_MAIN"
          git diff --name-only "$LIVE" HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant01-steve-normalized-export-preflight.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant01_steve_normalized_export_preflight.json' \
            'grand-bruxelles-game/game/tests/gate8_variant01_steve_normalized_export_preflight_test.gd' \
            'grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_steve_normalized_export_preflight.json').read_text())
          n=d['normalization']
          assert d['format'].endswith('-v5')
          assert d['base_main_sha']=='7ce0ab04f0759c1458bc7e31968884bf5da95448'
          assert d['source']['license']=='CC0-1.0'
          assert d['source']['characterization_run']==32914685397
          assert d['source']['characterization_state']=='BLOCKED_SPLIT_IK_DEFORM_TOPOLOGY'
          assert n['red_reference_run']==32918396107 and n['red_reference_max_baked_pose_position_error_m']>1.5
          assert n['red_assignment_run']==32922400044 and n['red_assignment_bone']=='f2.R.002'
          assert n['controller_leaf_red_run']==32925637116 and n['controller_leaf_red_bone']=='poleelbo.R'
          assert n['weighted_hand_red_run']==32925862392 and n['weighted_hand_red_bone']=='hand.R'
          assert n['parent_scale_red_run']==32926622094 and n['parent_scale_red_bone']=='hand.R'
          assert n['parent_scale_red_position_error_m']<1e-6
          assert n['parent_scale_red_rotation_error_deg']>1.8
          assert n['parent_scale_red_parent']=='ikhand.R'
          assert n['parent_scale_red_parent_rotation_error_deg']>1.1
          assert n['bake_solver']=='controller_bridge_no_parent_scale_parent_first_matrix_v5'
          assert n['pose_exactness_scope']=='all_nonzero_weighted_bones_plus_required_humanoid_roles'
          assert n['controller_transform_policy']=={'use_inherit_rotation':True,'inherit_scale':'NONE'}
          assert n['expected_repairs']=={'master':'pelvis','ikhand.L':'armlo.L','ikhand.R':'armlo.R','ikfoot.L':'leglo.L','ikfoot.R':'leglo.R'}
          assert n['expected_gaps_after']==[]
          assert d['godot_gate']['retarget_allowed'] is False
          for k,v in d['rails'].items():
              if k=='source_normalization_applied_ephemerally': assert v is True
              elif k in ('walk_alias_selected','run_alias_selected'): assert v==''
              else: assert v is False, k
          print('GATE8_STEVE_NORMALIZED_CONTRACT_OK solver=v5 scale_isolation=true exact_main=true retarget=false production=false')
          PY

      - name: Acquire pinned CC0 Steve source and normalize ephemeral export
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$SOURCE_ZIP" -o "$RUNNER_TEMP/steve.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/steve.zip" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/steve.zip")" = "$SOURCE_BYTES"
          mkdir -p "$RUNNER_TEMP/steve-src" && unzip -q "$RUNNER_TEMP/steve.zip" -d "$RUNNER_TEMP/steve-src"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender python3-numpy >/dev/null
          blender --version | head -n 2 | tee "$RUNNER_TEMP/blender-version.txt"
          grep -q '^Blender 4\.0\.2' "$RUNNER_TEMP/blender-version.txt"
          set +e
          blender --background "$RUNNER_TEMP/steve-src/steve_npc1.blend" \
            --python grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py -- \
            --output /tmp/steve_normalized.glb --report "$RUNNER_TEMP/normalization-report.json" \
            2>&1 | tee "$RUNNER_TEMP/normalization.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [[ $STATUS -ne 0 ]]; then exit $STATUS; fi
          grep -q '^GATE8_STEVE_NORMALIZED_EXPORT_OK ' "$RUNNER_TEMP/normalization.log"
          test -s /tmp/steve_normalized.glb
          sha256sum /tmp/steve_normalized.glb | tee "$RUNNER_TEMP/steve_normalized_glb.sha256"
          python3 - "$RUNNER_TEMP/normalization-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          repairs={'master':'pelvis','ikhand.L':'armlo.L','ikhand.R':'armlo.R','ikfoot.L':'leglo.L','ikfoot.R':'leglo.R'}
          assert r['format'].endswith('-v5')
          assert r['bake_solver']=='controller_bridge_no_parent_scale_parent_first_matrix_v5'
          assert r['topology_gaps_after']==[] and r['repairs']==repairs
          assert set(r['changed_parents'])==set(repairs)
          assert all(r['changed_parents'][k]['after']==v for k,v in repairs.items())
          assert r['weighted_bone_count']>0 and r['protected_bone_count']>=17
          assert set(r['weighted_bones']).issubset(set(r['protected_bones']))
          assert all(r['controller_inherit_scale_after'][k]=='NONE' for k in repairs)
          assert all(r['controller_inherit_rotation_after'][k] is True for k in repairs)
          assert r['controller_parent_scale_isolated'] is True
          assert r['max_rest_position_drift_m']<=1e-6
          assert r['max_rest_rotation_drift_deg']<=1e-4
          assert r['max_assignment_position_error_m']<=1e-4
          assert r['max_assignment_rotation_error_deg']<=0.10
          assert r['max_baked_pose_position_error_m']<=1e-4
          assert r['max_baked_pose_rotation_error_deg']<=0.10
          assert r['source_normalization_applied'] is True and r['runtime_authorized'] is False
          print('GATE8_STEVE_NORMALIZATION_REPORT_OK gaps_after=0 solver=v5 scale_isolation=true runtime=false')
          PY

      - name: Restore immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/target.zip"
          test "$(sha256sum "$RUNNER_TEMP/target.zip" | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          mkdir -p "$RUNNER_TEMP/target" && unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          TARGET="$(find "$RUNNER_TEMP/target" -type f -name npc_gate_01.glb -print -quit)"
          test -n "$TARGET" && cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb | tee "$RUNNER_TEMP/npc_gate_01.sha256"

      - name: Import normalized source and target under Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot" && unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)"
          test -x "$GODOT"
          "$GODOT" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -q '^4\.7\.1\.stable' "$RUNNER_TEMP/godot-version.txt"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          rm -rf "$PROJECT"; mkdir -p "$PROJECT/assets" "$PROJECT/game/tests"
          printf '%s\n' 'config_version=5' '[application]' 'config/name="Gate8SteveNormalizedExport"' '[rendering]' 'renderer/rendering_method="gl_compatibility"' 'renderer/rendering_method.mobile="gl_compatibility"' > "$PROJECT/project.godot"
          cp /tmp/steve_normalized.glb "$PROJECT/assets/steve_normalized.glb"
          cp /tmp/npc_gate_01.glb "$PROJECT/assets/npc_gate_01.glb"
          cp grand-bruxelles-game/game/tests/gate8_variant01_steve_normalized_export_preflight_test.gd "$PROJECT/game/tests/"
          timeout 300s "$GODOT" --headless --editor --path "$PROJECT" --quit-after 1200 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          test -d "$PROJECT/.godot/imported"
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|Cannot open' "$RUNNER_TEMP/godot-import.log"

      - name: Verify normalized humanoid topology without retarget
        run: |
          set -euo pipefail
          timeout 180s "$GODOT" --headless --path "$PROJECT" --script res://game/tests/gate8_variant01_steve_normalized_export_preflight_test.gd 2>&1 | tee "$RUNNER_TEMP/preflight.log"
          test -s "$PROJECT/gate8_variant01_steve_normalized_export_result.json"
          cp "$PROJECT/gate8_variant01_steve_normalized_export_result.json" "$RUNNER_TEMP/preflight-result.json"
          python3 - "$RUNNER_TEMP/preflight-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['source_bone_count']>=55 and r['target_bone_count']>=53
          assert r['source_topology_gaps']==[] and r['target_topology_gaps']==[]
          assert r['source_walk_animation_name']=='walk'
          assert 0.45<=float(r['target_to_source_leg_ratio'])<=2.20
          assert r['source_normalization_verified'] is True
          assert r['mechanical_state']=='READY_FOR_NATIVE_RETARGET_PROBE'
          assert r['bonemap_applied'] is False and r['retarget_applied'] is False
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['failures']==[]
          print('GATE8_STEVE_NORMALIZED_GODOT_OK state=READY_FOR_NATIVE_RETARGET_PROBE gaps=0 production=false')
          PY
          grep -q '^GATE8_STEVE_NORMALIZED_PREFLIGHT_OK state=READY_FOR_NATIVE_RETARGET_PROBE gaps=0 aliases=false production_authorized=false$' "$RUNNER_TEMP/preflight.log"

      - name: Require repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee "$RUNNER_TEMP/git-status.txt"
          test ! -s "$RUNNER_TEMP/git-status.txt"

      - name: Upload immutable normalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-steve-normalized-export-preflight
          path: |
            ${{ runner.temp }}/normalization-report.json
            ${{ runner.temp }}/normalization.log
            ${{ runner.temp }}/steve_normalized_glb.sha256
            ${{ runner.temp }}/preflight-result.json
            ${{ runner.temp }}/preflight.log
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/blender-version.txt
            ${{ runner.temp }}/npc_gate_01.sha256
            ${{ runner.temp }}/git-status.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
