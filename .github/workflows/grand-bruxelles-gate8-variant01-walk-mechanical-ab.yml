name: Grand Bruxelles Gate-8 Variant-01 Walk Mechanical A-B

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-walk-mechanical-ab.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_contract.json"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_foot_slide_root_compensation_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  walk-mechanical-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      NATIVE_AB_DEPENDENCY_COMMIT: "0f5dbcc64dd44e88490df575bae4664f6bd18520"
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-walk-mechanical-ab"

    steps:
      - uses: actions/checkout@v4

      - name: Validate walk A-B fail-closed contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_contract.json').read_text())
          assert d['format']=='grand-bruxelles-gate8-variant01-walk-mechanical-ab-contract-v1'
          assert d['owner_pr']==1264 and d['base_main_sha']=='648d38265eb2d862aa58956812a8175c7f59d3ab'
          assert d['candidate_variant']==1 and d['candidate_static_verdict']=='AMELIORER'
          assert d['source_animation']['license']=='CC0-1.0'
          assert d['source_animation']['package_sha256']=='18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2'
          assert d['source_animation']['clips']==['Walk','Walk_Formal']
          assert d['target']['glb_sha256']=='912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9'
          w=d['live_walk_contract']
          assert w=={'idle_exit_speed_mps':0.2,'run_enter_speed_mps':1.65,'reference_speed_mps':1.0,'playback_min':0.68,'playback_max':1.45}
          g=d['mechanical_gates']
          assert g['sample_rate_hz']==120.0
          assert g['max_ground_correction_span_m']==0.18 and g['max_ground_correction_step_m']==0.08
          assert g['max_mean_torso_bend_delta_deg']==15.0 and g['max_peak_torso_bend_delta_deg']==30.0
          assert g['foot_slide_evaluation']=='comparative_irreducible_residual_no_new_absolute_threshold'
          assert g['absolute_foot_slide_acceptance_defined'] is False
          assert g['visual_witness_allowed_only_after_mechanical_gate'] is True
          r=d['rails']
          assert r['thresholds_changed'] is False and r['retarget_changed'] is False
          assert r['root_motion_applied'] is False and r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['runtime_population_changed'] is False and r['visual_approval_claimed'] is False
          assert r['mixamo_allowed'] is False and r['player_character_reuse_allowed'] is False
          print('GATE8_WALK_MECHANICAL_AB_STATIC_OK clips=Walk,Walk_Formal alias_selected=false production_authorized=false')
          PY
          TEST=grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_diagnostic.gd.txt
          grep -Fq 'const WALK_CANDIDATES: Array[String] = ["Walk", "Walk_Formal"]' "$TEST"
          grep -Fq 'WALK_REFERENCE_SPEED_MPS / required_root_speed_mps' "$TEST"
          grep -Fq 'comparative_irreducible_residual_no_new_absolute_threshold' "$TEST"
          grep -Fq 'absolute_foot_slide_acceptance_defined": false' "$TEST"
          grep -Fq 'walk_alias_selected": ""' "$TEST"
          grep -Fq -- '--audio-driver Dummy' .github/workflows/grand-bruxelles-gate8-variant01-walk-mechanical-ab.yml

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-WalkMechanicalAB/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              member=os.environ['ANIM_GLB']; assert member in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(member))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"; "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated walk A-B project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"; mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01WalkMechanicalAB"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NATIVE_AB_DEPENDENCY_COMMIT}/grand-bruxelles-game/game/tests"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_test.gd"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_v2_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_rest_normalized_animation_ab_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_foot_slide_root_compensation_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_foot_slide_root_compensation_diagnostic.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_walk_mechanical_ab_diagnostic.gd"
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-walk-mechanical-ab-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-walk-mechanical-ab-import.log

      - name: Measure Walk vs Walk_Formal at ideal playback
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          set -euo pipefail
          set +e
          timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --audio-driver Dummy --path "$ISOLATED_PROJECT" --rendering-method gl_compatibility --script res://game/tests/gate8_variant01_walk_mechanical_ab_diagnostic.gd 2>&1 | tee /tmp/gate8-walk-mechanical-ab.log
          STATUS=${PIPESTATUS[0]}; set -e
          RESULT="$ISOLATED_PROJECT/gate8_variant01_walk_mechanical_ab_result.json"
          test -s "$RESULT"
          cp "$RESULT" /tmp/gate8_variant01_walk_mechanical_ab_result.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          r=json.loads(Path('/tmp/gate8_variant01_walk_mechanical_ab_result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-variant01-walk-mechanical-ab-v1'
          assert r['candidate_variant']==1 and r['candidate_static_verdict']=='AMELIORER'
          assert r['sample_rate_hz']==120.0 and r['retarget_engine']=='RetargetModifier3D'
          assert r['walk_reference_speed_mps']==1.0 and r['walk_playback_min']==0.68 and r['walk_playback_max']==1.45
          assert r['foot_slide_evaluation']=='comparative_irreducible_residual_no_new_absolute_threshold'
          assert r['absolute_foot_slide_acceptance_defined'] is False
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['runtime_population_changed'] is False and r['visual_approval_claimed'] is False
          assert set(r['clips'])=={'Walk','Walk_Formal'}
          for clip,row in r['clips'].items():
              assert row['sample_count']>=80,(clip,row['sample_count'])
              assert row['playback_in_live_walk_range'] is True
              assert 0.68 <= float(row['ideal_playback_for_reference_speed']) <= 1.45
              assert abs(float(row['effective_required_root_speed_mps'])-1.0) <= 1e-5
              for key in ['ground_correction_span_m','ground_correction_max_step_m','mean_torso_bend_delta_deg','peak_torso_bend_delta_deg','raw_contact_slide_peak_mps_at_ideal_playback','irreducible_residual_slide_peak_mps_at_ideal_playback']:
                  assert math.isfinite(float(row[key])),(clip,key)
          assert r['recommended_visual_candidate'] in ('','Walk','Walk_Formal')
          print('GATE8_WALK_MECHANICAL_AB_RESULT_CAPTURED recommendation=%s alias_selected=false production_authorized=false' % r['recommended_visual_candidate'])
          PY
          if [ "$STATUS" -ne 0 ]; then
            echo "Walk mechanical A-B failed closed with status=$STATUS; preserving exact JSON/log evidence." >&2
            exit "$STATUS"
          fi
          grep -q '^GATE8_WALK_MECHANICAL_AB_RESULT state=WALK_AB_MEASURED_PENDING_ABSOLUTE_FOOT_SLIDE_ACCEPTANCE recommendation=.* failures=0 alias_selected=false production_authorized=false$' /tmp/gate8-walk-mechanical-ab.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-walk-mechanical-ab.log

      - name: Stage walk A-B evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-walk-mechanical-ab-evidence; mkdir -p /tmp/gate8-walk-mechanical-ab-evidence
          for f in /tmp/gate8_variant01_walk_mechanical_ab_result.json /tmp/gate8-walk-mechanical-ab.log /tmp/gate8-walk-mechanical-ab-import.log /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt; do
            if [ -s "$f" ]; then cp "$f" /tmp/gate8-walk-mechanical-ab-evidence/; fi
          done
          sha256sum /tmp/gate8-walk-mechanical-ab-evidence/* | sort -k2 | tee /tmp/gate8-walk-mechanical-ab-evidence/sha256.txt

      - name: Prove repository remained untouched
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee /tmp/gate8-walk-mechanical-ab-git-status.txt
          test ! -s /tmp/gate8-walk-mechanical-ab-git-status.txt

      - name: Upload walk A-B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-gate8-variant01-walk-mechanical-ab
          path: /tmp/gate8-walk-mechanical-ab-evidence
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
