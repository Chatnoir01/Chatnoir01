name: Grand Bruxelles Gate-8 Variant-01 Walk vs Walk_Formal Full Cycle

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-gate8-variant01-walk-vs-formal-full-cycle.yml"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_vs_formal_full_cycle_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_formal_skin_space_diagnostic.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_formal_visual_witness.gd.txt"
      - "grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_diagnostic.gd.txt"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANIM_URL: "https://store.godotengine.org/asset/quaternius/universal-animation-library/download/44/"
      ANIM_SHA256: "18ff1a7215f4852b320203e8aaf02a1578b5c8eef9027fbaedfcedc7b85a3ac2"
      ANIM_BYTES: "14541205"
      ANIM_GLB: "Animation Library[Standard]/Godot/AnimationLibrary_Godot_Standard.glb"
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_SHA256: "fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb"
      TARGET_GLB_SHA256: "912ac8dedf4509640f90771f4c9d3b1af818b59261caab4d9b3f1fb0fe3e2ac9"
      NATIVE_AB_DEPENDENCY_COMMIT: "0f5dbcc64dd44e88490df575bae4664f6bd18520"
      GODOT_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
      ISOLATED_PROJECT: "/tmp/gate8-variant01-walk-vs-formal-full-cycle"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate full-cycle fail-closed contract
        run: |
          set -euo pipefail
          T=grand-bruxelles-game/data/qa/gate8_variant01_walk_vs_formal_full_cycle_diagnostic.gd.txt
          grep -Fq 'const FULL_CYCLE_SAMPLE_RATE_HZ := 120.0' "$T"
          ! grep -Eq '^const SAMPLE_RATE_HZ[[:space:]]*:=' "$T"
          grep -Fq 'const WALK_CLIPS := ["Walk", "Walk_Formal"]' "$T"
          grep -Fq 'const MATERIAL_REDUCTION_RATIO := 0.70' "$T"
          grep -Fq 'production_authorized": false' "$T"
          grep -Fq 'walk_alias_selected": ""' "$T"
          grep -Fq 'run_alias_selected": ""' "$T"
          grep -Fq 'retarget_changed": false' "$T"
          grep -Fq 'skin_changed": false' "$T"
          grep -Fq 'root_motion_applied": false' "$T"

      - name: Download exact pinned CC0 animation source
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Grand-Bruxelles-Gate8-WalkFullCycle/1.0' "$ANIM_URL" -o /tmp/animation-source.zip
          test -s /tmp/animation-source.zip
          test "$(sha256sum /tmp/animation-source.zip | awk '{print $1}')" = "$ANIM_SHA256"
          test "$(stat -c '%s' /tmp/animation-source.zip)" = "$ANIM_BYTES"
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/animation-source.zip') as z:
              m=os.environ['ANIM_GLB']; assert m in z.namelist(); Path('/tmp/animation_source.glb').write_bytes(z.read(m))
          PY
          sha256sum /tmp/animation-source.zip > /tmp/animation-source.sha256

      - name: Download immutable Gate-8 target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate8-target-artifact
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > /tmp/gate8-target.zip
          test "$(sha256sum /tmp/gate8-target.zip | awk '{print $1}')" = "$TARGET_ARTIFACT_SHA256"
          unzip -q /tmp/gate8-target.zip -d /tmp/gate8-target-artifact
          TARGET="$(find /tmp/gate8-target-artifact -type f -name 'npc_gate_01.glb' -print -quit)"
          test -n "$TARGET"; cp "$TARGET" /tmp/npc_gate_01.glb
          test "$(sha256sum /tmp/npc_gate_01.glb | awk '{print $1}')" = "$TARGET_GLB_SHA256"
          sha256sum /tmp/npc_gate_01.glb > /tmp/npc_gate_01.sha256

      - name: Install exact Godot 4.7.1
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)"
          test -x "$GODOT"; "$GODOT" --version | tee /tmp/godot-version.txt
          grep -q '^4\.7\.1\.stable' /tmp/godot-version.txt
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Build isolated full-cycle project
        run: |
          set -euo pipefail
          rm -rf "$ISOLATED_PROJECT"; mkdir -p "$ISOLATED_PROJECT/assets" "$ISOLATED_PROJECT/game/tests"
          cat > "$ISOLATED_PROJECT/project.godot" <<'EOF'
          config_version=5
          [application]
          config/name="Gate8Variant01WalkVsFormalFullCycle"
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          [rendering]
          renderer/rendering_method="gl_compatibility"
          EOF
          cp /tmp/animation_source.glb "$ISOLATED_PROJECT/assets/animation_source.glb"
          cp /tmp/npc_gate_01.glb "$ISOLATED_PROJECT/assets/npc_gate_01.glb"
          BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NATIVE_AB_DEPENDENCY_COMMIT}/grand-bruxelles-game/game/tests"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_test.gd"
          curl -L --fail --retry 4 --retry-all-errors "$BASE_URL/gate8_variant01_native_retarget_ab_v2_test.gd" -o "$ISOLATED_PROJECT/game/tests/gate8_variant01_native_retarget_ab_v2_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_rest_normalized_animation_ab_witness.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_rest_normalized_animation_ab_test.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_foot_slide_root_compensation_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_foot_slide_root_compensation_diagnostic.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_walk_mechanical_ab_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_walk_mechanical_ab_diagnostic.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_walk_formal_visual_witness.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_walk_formal_visual_witness.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_walk_formal_skin_space_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_walk_formal_skin_space_diagnostic.gd"
          cp grand-bruxelles-game/data/qa/gate8_variant01_walk_vs_formal_full_cycle_diagnostic.gd.txt "$ISOLATED_PROJECT/game/tests/gate8_variant01_walk_vs_formal_full_cycle_diagnostic.gd"
          timeout 300s "$GODOT" --headless --editor --path "$ISOLATED_PROJECT" --quit-after 1200 2>&1 | tee /tmp/gate8-full-cycle-import.log
          test -d "$ISOLATED_PROJECT/.godot/imported"
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-full-cycle-import.log

      - name: Measure full-cycle Walk vs Walk_Formal
        run: |
          set -euo pipefail
          timeout 600s "$GODOT" --headless --audio-driver Dummy --path "$ISOLATED_PROJECT" --script res://game/tests/gate8_variant01_walk_vs_formal_full_cycle_diagnostic.gd 2>&1 | tee /tmp/gate8-full-cycle.log
          RESULT="$ISOLATED_PROJECT/gate8_variant01_walk_vs_formal_full_cycle_result.json"
          test -s "$RESULT"; cp "$RESULT" /tmp/gate8_variant01_walk_vs_formal_full_cycle_result.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          r=json.loads(Path('/tmp/gate8_variant01_walk_vs_formal_full_cycle_result.json').read_text())
          assert r['format']=='grand-bruxelles-gate8-variant01-walk-vs-formal-full-cycle-v1'
          assert r['engine_version'].startswith('4.7.1') and r['diagnostic_state']=='FULL_CYCLE_MEASURED' and r['failures']==[]
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          assert r['retarget_changed'] is False and r['skin_changed'] is False and r['root_motion_applied'] is False
          for clip in ('Walk','Walk_Formal'):
              c=r['clips'][clip]; assert c['sample_count']>=80 and float(c['sample_rate_hz'])==120.0
              assert math.isfinite(float(c['max_upper_arm_swing_deg']))
              for edge in ('left_armpit','right_armpit','left_ankle'):
                  e=c['edge_maxima'][edge]; assert math.isfinite(float(e['absolute_change_m'])) and math.isfinite(float(e['ratio']))
          assert r['comparison']['state'] in ('WALK_MATERIALLY_REDUCES_ARM_AND_ARMPIT_DEFORMATION','WALK_DOES_NOT_MATERIALLY_REDUCE_ALL_CRITICAL_DEFORMATION')
          print('GATE8_WALK_VS_FORMAL_FULL_CYCLE_OK state=%s visual_witness_justified=%s' % (r['comparison']['state'], str(r['comparison']['visual_witness_justified']).lower()))
          PY
          grep -q '^GATE8_WALK_VS_FORMAL_FULL_CYCLE_RESULT state=FULL_CYCLE_MEASURED failures=0 production_authorized=false$' /tmp/gate8-full-cycle.log
          ! grep -E '^ERROR:|SCRIPT ERROR|Parse Error|Failed to load|Cannot open' /tmp/gate8-full-cycle.log

      - name: Stage diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/gate8-full-cycle-evidence; mkdir -p /tmp/gate8-full-cycle-evidence
          for f in /tmp/gate8_variant01_walk_vs_formal_full_cycle_result.json /tmp/gate8-full-cycle.log /tmp/gate8-full-cycle-import.log /tmp/animation-source.sha256 /tmp/npc_gate_01.sha256 /tmp/godot-version.txt; do
            [ -f "$f" ] && cp "$f" /tmp/gate8-full-cycle-evidence/
          done
          git status --porcelain=v1 > /tmp/gate8-full-cycle-evidence/git-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-gate8-variant01-walk-vs-formal-full-cycle
          path: /tmp/gate8-full-cycle-evidence
          if-no-files-found: error
          retention-days: 14
