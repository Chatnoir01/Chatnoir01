name: Grand Bruxelles Gate-8 Variant03 Steve Boundary A/B Plan
on:
  push:
    branches: ["npc/gate8-variant03-steve-skin-culprit-20260827"]
  pull_request:
    paths:
      - '.github/workflows/grand-bruxelles-gate8-variant03-steve-boundary-ab-plan.yml'
      - '.github/workflows/grand-bruxelles-gate8-variant03-steve-shoulder-ab.yml'
      - 'grand-bruxelles-game/data/qa/gate8_variant03_steve_skin_culprit.json'
      - 'grand-bruxelles-game/game/tests/gate8_variant03_steve_shoulder_ab_test.gd'
      - 'grand-bruxelles-game/tools/qa/plan_gate8_variant03_steve_boundary_ab.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boundary-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT_ID: "9661224043"
      SOURCE_ARTIFACT_DIGEST: sha256:c44b7a008e646cdcbc2b6ef41d37e9586855f45f43d73e193dec0287e3680bca
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live main and closed mutation rails
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          python3 - <<'PY'
          import json
          d=json.load(open('grand-bruxelles-game/data/qa/gate8_variant03_steve_skin_culprit.json'))
          assert d['base_main_sha']=='dec964e0b7374e8771a7e6103310751bbdb07483'
          assert d['gates']=={'max_transfer_error_deg':3.0,'max_grounding_span_m':0.18,'max_skin_edge_change_m':0.25,'max_skin_stretch_ratio':3.0,'min_skin_compression_ratio':0.25}
          assert d['shoulder_ab']['state']=='IMPLEMENTED_PENDING_GODOT_MEASUREMENT'
          for k in ('production_authorized','activation_ready','adoption_ready','visual_approval_claimed','retarget_change_authorized','skin_weight_change_authorized','global_right_arm_fix_authorized'):
              assert d['rails'][k] is False,k
          PY
          printf '%s\n' "$LIVE_MAIN" > "$RUNNER_TEMP/live-main.txt"
      - name: Run planner regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/qa/plan_gate8_variant03_steve_boundary_ab.py --self-test | tee "$RUNNER_TEMP/planner-tests.log"
          grep -q 'GATE8_V03_BOUNDARY_AB_PLANNER_TESTS_OK tests=3' "$RUNNER_TEMP/planner-tests.log"
      - name: Download immutable culprit evidence
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$RUNNER_TEMP/artifact.json"
          python3 - "$RUNNER_TEMP/artifact.json" "$SOURCE_ARTIFACT_DIGEST" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); assert not p.get('expired',True); assert p.get('digest')==sys.argv[2]
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/artifact.zip"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/artifact"
          test -s "$RUNNER_TEMP/artifact/godot-result.json"
      - name: Reclassify and build two independent A/B contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/qa/classify_gate8_variant03_steve_skin_culprits.py "$RUNNER_TEMP/artifact/godot-result.json" "$RUNNER_TEMP/classification.json" | tee "$RUNNER_TEMP/classification.log"
          python3 grand-bruxelles-game/tools/qa/plan_gate8_variant03_steve_boundary_ab.py "$RUNNER_TEMP/classification.json" grand-bruxelles-game/data/qa/gate8_variant03_steve_skin_culprit.json "$RUNNER_TEMP/plan.json" | tee "$RUNNER_TEMP/plan.log"
          python3 - "$RUNNER_TEMP/plan.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['state']=='READY_FOR_TWO_INDEPENDENT_BOUNDARY_ABS'
          assert [e['id'] for e in p['experiments']]==['AB_SHOULDER','AB_HAND']
          shoulder,hand=p['experiments']
          assert shoulder['samples']==[2,10]
          assert shoulder['bones']==['clavicle_r','spine_03','upperarm_r']
          assert shoulder['must_not_mutate_bones']==['hand_r','lowerarm_r']
          assert hand['samples']==[0]
          assert hand['bones']==['hand_r','lowerarm_r']
          assert hand['must_not_mutate_bones']==['clavicle_r','spine_03','upperarm_r']
          assert p['cross_experiment_regression_required'] is True
          assert p['global_right_arm_fix_authorized'] is False
          assert p['retarget_change_authorized'] is False
          assert p['skin_weight_change_authorized'] is False
          assert p['production_authorized'] is False
          print('GATE8_V03_TWO_BOUNDARY_ABS_READY shoulder_samples=2,10 hand_sample=0 global_fix=false')
          PY
      - name: Require repository clean
        shell: bash
        run: test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant03-steve-boundary-ab-plan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/live-main.txt
            ${{ runner.temp }}/artifact.json
            ${{ runner.temp }}/classification.json
            ${{ runner.temp }}/classification.log
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/plan.log
            ${{ runner.temp }}/planner-tests.log
          retention-days: 14
