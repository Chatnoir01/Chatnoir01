name: Grand Bruxelles Gate-8 Variant03 Steve Native Probe

on:
  push:
    branches: ["npc/gate8-variant03-steve-native-probe-20260827"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variant03-steve-native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_ZIP: https://opengameart.org/sites/default/files/steve_npc1.zip
      SOURCE_SHA256: e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5
      SOURCE_BYTES: "1454243"
      NORMALIZER_COMMIT: d021fa0a31c409e33102f5a94848a7c01bb019be
      HARDENER_COMMIT: 0a0e8e9330c88d1100054c3eb534a237cb5e7c8c
      PROBE_SOURCE_COMMIT: f1c3778ccbfd31d9883fe40ee8f3b03288f325e5
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_DIGEST: sha256:fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb
      TARGET_GLB_SHA256: cd3d0abc6020789f4d000a84c6a6f44d9707942649d62a66a7406cbb2cd35313
      TARGET_GLB_BYTES: "12589156"
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-variant03-steve-native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live main, bounded scope, provenance and closed rails
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          test "$(git merge-base origin/main HEAD)" = "$LIVE_MAIN"
          git diff --name-only origin/main HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant03-steve-native-probe.yml' \
            'grand-bruxelles-game/data/qa/gate8_variant03_steve_canonical_native_probe.json' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('grand-bruxelles-game/data/qa/gate8_variant03_steve_canonical_native_probe.json')
          d=json.loads(p.read_text())
          assert d['format']=='grand-bruxelles-gate8-variant03-steve-canonical-native-probe-v1'
          assert d['base_main_sha']=='03d8871bb1985da7b661d7d1e1530916fc144a37'
          assert d['source']['license']=='CC0-1.0'
          assert d['source']['archive_sha256']=='e892fe37336c74c0753d5c770686a0f4d32d2c096be2fe84ba7f4c3c2a9712d5'
          assert d['target']['variant']==3
          assert d['target']['glb_sha256']=='cd3d0abc6020789f4d000a84c6a6f44d9707942649d62a66a7406cbb2cd35313'
          assert d['target']['size_bytes']==12589156
          assert d['target']['bone_count']==53 and d['target']['vertex_count']==20495
          assert d['gates']=={'max_transfer_error_deg':3.0,'max_grounding_span_m':0.18,'max_skin_edge_change_m':0.25,'max_skin_stretch_ratio':3.0,'min_skin_compression_ratio':0.25}
          assert d['rails']['walk_alias_selected']=='' and d['rails']['run_alias_selected']==''
          for k in ('production_authorized','activation_ready','adoption_ready','visual_approval_claimed'): assert d['rails'][k] is False
          print('GATE8_VARIANT03_STEVE_NATIVE_CONTRACT_OK main=%s'%d['base_main_sha'])
          PY
          printf '%s\n' "$LIVE_MAIN" > "$RUNNER_TEMP/live-main.txt"

      - name: Regenerate exact canonical Steve walk from pinned CC0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors --retry-delay 2 "$SOURCE_ZIP" -o "$RUNNER_TEMP/steve.zip"
          echo "$SOURCE_SHA256  $RUNNER_TEMP/steve.zip" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/steve.zip")" = "$SOURCE_BYTES"
          mkdir -p "$RUNNER_TEMP/steve-src" && unzip -q "$RUNNER_TEMP/steve.zip" -d "$RUNNER_TEMP/steve-src"
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${NORMALIZER_COMMIT}/grand-bruxelles-game/tools/qa/normalize_steve_split_ik_export.py" -o "$RUNNER_TEMP/normalizer.py"
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HARDENER_COMMIT}/grand-bruxelles-game/tools/qa/harden_steve_normalizer_gltf_export.py" -o "$RUNNER_TEMP/hardener.py"
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${HARDENER_COMMIT}/grand-bruxelles-game/tools/qa/canonicalize_steve_proxy_walk.py" -o "$RUNNER_TEMP/canonicalizer.py"
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends blender python3-numpy >/dev/null
          python3 "$RUNNER_TEMP/hardener.py" --input "$RUNNER_TEMP/normalizer.py" --output "$RUNNER_TEMP/normalizer-hardened.py" | tee "$RUNNER_TEMP/hardening.log"
          timeout 1800 blender --background "$RUNNER_TEMP/steve-src/steve_npc1.blend" --python-exit-code 42 --python "$RUNNER_TEMP/normalizer-hardened.py" -- --output /tmp/steve_proxy.glb --report "$RUNNER_TEMP/normalization.json" 2>&1 | tee "$RUNNER_TEMP/normalization.log"
          timeout 300 blender --background --python-exit-code 42 --python "$RUNNER_TEMP/canonicalizer.py" -- --input /tmp/steve_proxy.glb --output /tmp/steve_canonical.glb --report "$RUNNER_TEMP/canonicalization.json" 2>&1 | tee "$RUNNER_TEMP/canonicalization.log"
          grep -q 'GATE8_STEVE_WALK_CANONICALIZATION_OK canonical=walk' "$RUNNER_TEMP/canonicalization.log"
          test -s /tmp/steve_canonical.glb
          sha256sum /tmp/steve_canonical.glb | tee "$RUNNER_TEMP/steve_canonical.sha256"

      - name: Restore immutable Gate-8 variant03 target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}" > "$RUNNER_TEMP/target-artifact.json"
          python3 - "$RUNNER_TEMP/target-artifact.json" "$TARGET_ARTIFACT_DIGEST" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1])); assert not p.get('expired',True); assert p.get('digest')==sys.argv[2]
          PY
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/target.zip"
          mkdir -p "$RUNNER_TEMP/target" && unzip -q "$RUNNER_TEMP/target.zip" -d "$RUNNER_TEMP/target"
          TARGET="$(find "$RUNNER_TEMP/target" -type f -name 'npc_gate_03.glb' -print -quit)"
          test -n "$TARGET"
          echo "$TARGET_GLB_SHA256  $TARGET" | sha256sum -c -
          test "$(stat -c '%s' "$TARGET")" = "$TARGET_GLB_BYTES"
          cp "$TARGET" /tmp/npc_gate_03.glb

      - name: Build exact variant03 mechanical probe from previously validated probe logic
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PROBE_SOURCE_COMMIT}/grand-bruxelles-game/game/tests/gate8_variant01_steve_canonical_native_probe_test.gd" -o "$RUNNER_TEMP/probe.gd"
          grep -q 'MAX_TRANSFER_ERROR_DEG := 3.0' "$RUNNER_TEMP/probe.gd"
          grep -q 'MAX_GROUNDING_SPAN_M := 0.18' "$RUNNER_TEMP/probe.gd"
          grep -q 'MAX_SKIN_EDGE_CHANGE_M := 0.25' "$RUNNER_TEMP/probe.gd"
          grep -q 'MAX_SKIN_STRETCH_RATIO := 3.0' "$RUNNER_TEMP/probe.gd"
          grep -q 'MIN_SKIN_COMPRESSION_RATIO := 0.25' "$RUNNER_TEMP/probe.gd"
          python3 - "$RUNNER_TEMP/probe.gd" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace('res://assets/npc_gate_01.glb','res://assets/npc_gate_03.glb')
          s=s.replace('gate8_variant01_steve_canonical_native_probe_result.json','gate8_variant03_steve_canonical_native_probe_result.json')
          s=s.replace('grand-bruxelles-gate8-variant01-steve-canonical-native-probe-v2','grand-bruxelles-gate8-variant03-steve-canonical-native-probe-v1')
          p.write_text(s)
          PY
          grep -q 'res://assets/npc_gate_03.glb' "$RUNNER_TEMP/probe.gd"

      - name: Run Godot 4.7.1 transfer, grounding and CPU skin-space on variant03
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"; chmod +x "$GODOT"
          "$GODOT" --version | tee "$RUNNER_TEMP/godot-version.txt"; grep -q '^4\.7\.1' "$RUNNER_TEMP/godot-version.txt"
          mkdir -p "$PROJECT/assets"
          cp /tmp/steve_canonical.glb "$PROJECT/assets/steve.glb"
          cp /tmp/npc_gate_03.glb "$PROJECT/assets/npc_gate_03.glb"
          cp "$RUNNER_TEMP/probe.gd" "$PROJECT/gate_test.gd"
          printf '[application]\nconfig/name="Gate8Variant03SteveNativeProbe"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\nrenderer/rendering_method.mobile="gl_compatibility"\n' > "$PROJECT/project.godot"
          timeout 300 "$GODOT" --headless --path "$PROJECT" --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          set +e
          timeout 180 "$GODOT" --headless --path "$PROJECT" --script res://gate_test.gd 2>&1 | tee "$RUNNER_TEMP/godot-probe.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          test -s "$PROJECT/gate8_variant03_steve_canonical_native_probe_result.json"
          cp "$PROJECT/gate8_variant03_steve_canonical_native_probe_result.json" "$RUNNER_TEMP/godot-result.json"
          python3 - "$RUNNER_TEMP/godot-result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['format']=='grand-bruxelles-gate8-variant03-steve-canonical-native-probe-v1',r
          assert r['engine_version'].startswith('4.7.1')
          assert r['walk_alias_selected']=='' and r['run_alias_selected']==''
          assert r['production_authorized'] is False and r['activation_ready'] is False and r['adoption_ready'] is False
          m=r.get('metrics',{})
          assert m.get('target_integrity',{}).get('target_bones')==53,m
          print('GATE8_VARIANT03_STEVE_NATIVE_RESULT state=%s failures=%d transfer=%s grounding=%s skin=%s' % (r['mechanical_state'],len(r['failures']),m.get('max_transfer_error_deg'),m.get('grounding_span_m'),m.get('skin_space')))
          PY
          exit "$STATUS"

      - name: Require repository clean
        if: always()
        shell: bash
        run: |
          git status --porcelain | tee "$RUNNER_TEMP/git-status.txt"
          test ! -s "$RUNNER_TEMP/git-status.txt"

      - name: Upload exact mechanical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant03-steve-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/live-main.txt
            ${{ runner.temp }}/normalization.json
            ${{ runner.temp }}/normalization.log
            ${{ runner.temp }}/canonicalization.json
            ${{ runner.temp }}/canonicalization.log
            ${{ runner.temp }}/steve_canonical.sha256
            ${{ runner.temp }}/target-artifact.json
            ${{ runner.temp }}/godot-version.txt
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-probe.log
            ${{ runner.temp }}/godot-result.json
            ${{ runner.temp }}/git-status.txt
          if-no-files-found: ignore
          retention-days: 14
