name: Grand Bruxelles Gate-8 Variant03 Target Integrity
on:
  push:
    branches: ["npc/gate8-variant03-steve-preflight-2c72144"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  target03-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 305453191ae64ab5da9da6f935177f55ba501820
      TARGET_ARTIFACT_ID: "9470539830"
      TARGET_ARTIFACT_DIGEST: sha256:fcbcb5f75061fefcc66519c383ac4f7ad56753a3a2240b10bdf004c9cca91ccb
      GODOT_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
      PROJECT: /tmp/gate8-variant03-integrity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live main, exact candidate head, bounded Character/NPC scope and closed rails
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          git diff --name-only origin/main HEAD | sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            '.github/workflows/grand-bruxelles-gate8-variant03-target-integrity.yml' \
            'grand-bruxelles-game/game/tests/gate8_variant03_target_integrity_preflight.gd' | sort > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          grep -q '"variant": 3' grand-bruxelles-game/game/tests/gate8_variant03_target_integrity_preflight.gd
          grep -q '"production_authorized": false' grand-bruxelles-game/game/tests/gate8_variant03_target_integrity_preflight.gd
          grep -q '"retarget_applied": false' grand-bruxelles-game/game/tests/gate8_variant03_target_integrity_preflight.gd
      - name: Verify immutable Gate-8 generation artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}" > "$RUNNER_TEMP/artifact.json"
          python3 - "$RUNNER_TEMP/artifact.json" "$TARGET_ARTIFACT_DIGEST" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert not p.get('expired', True), p
          assert p.get('digest') == sys.argv[2], (p.get('digest'), sys.argv[2])
          print('GATE8_ARTIFACT_IDENTITY_OK id=%s digest=%s' % (p['id'], p['digest']))
          PY
      - name: Acquire only Gate-8 variant03 from immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TARGET_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/gate8.zip"
          mkdir -p "$RUNNER_TEMP/gate8"
          unzip -q "$RUNNER_TEMP/gate8.zip" -d "$RUNNER_TEMP/gate8"
          TARGET="$(find "$RUNNER_TEMP/gate8" -type f -name 'npc_gate_03.glb' -print -quit)"
          test -n "$TARGET"
          test "$(find "$RUNNER_TEMP/gate8" -type f -name 'npc_gate_03.glb' | wc -l)" -eq 1
          sha256sum "$TARGET" | tee "$RUNNER_TEMP/npc_gate_03.sha256"
          stat -c '%s' "$TARGET" | tee "$RUNNER_TEMP/npc_gate_03.size"
          mkdir -p "$PROJECT/assets"
          cp "$TARGET" "$PROJECT/assets/npc_gate_03.glb"
      - name: Import and inspect target under Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 "$GODOT_URL" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' -print -quit)"
          chmod +x "$GODOT"
          cp grand-bruxelles-game/game/tests/gate8_variant03_target_integrity_preflight.gd "$PROJECT/gate_test.gd"
          printf '[application]\nconfig/name="Gate8Variant03Integrity"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$PROJECT/project.godot"
          timeout 300 "$GODOT" --headless --path "$PROJECT" --import >/dev/null
          timeout 120 "$GODOT" --headless --path "$PROJECT" --script res://gate_test.gd | tee "$RUNNER_TEMP/godot.log"
          cp "$PROJECT/gate8_variant03_target_integrity.json" "$RUNNER_TEMP/result.json"
          python3 - "$RUNNER_TEMP/result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['state']=='TARGET03_INTEGRITY_READY_FOR_PAIRING_PROBE', r
          assert r['variant']==3
          assert r['bone_count']>=53
          assert r['skinned_meshes']>=1
          assert r['skinned_surfaces']>=1
          assert r['material_surfaces']==r['skinned_surfaces']
          assert r['invalid_skeleton_links']==0
          assert r['missing_material_surfaces']==0
          assert len(r['required_roles'])==17
          assert r['failures']==[]
          assert r['production_authorized'] is False
          assert r['activation_ready'] is False
          assert r['adoption_ready'] is False
          assert r['retarget_applied'] is False
          print('GATE8_VARIANT03_PAIRING_PREFLIGHT_OK bones=%d meshes=%d vertices=%d' % (r['bone_count'], r['skinned_meshes'], r['vertex_count']))
          PY
      - name: Require repository clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate8-variant03-target-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/artifact.json
            ${{ runner.temp }}/npc_gate_03.sha256
            ${{ runner.temp }}/npc_gate_03.size
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/godot.log
          retention-days: 14
