name: Grand Bruxelles Generic Ground Continuity

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/generic_osm_surface_collision_runtime.gd"
      - "grand-bruxelles-game/data/runtime/modules/generic_osm_surface_collision.json"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/tests/generic_osm_ground_continuity_test.gd"
      - "grand-bruxelles-game/game/tests/generic_osm_ground_collision_isolation_test.gd"
      - ".github/workflows/grand-bruxelles-generic-ground-continuity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/generic-ground-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/generic-ground-import.log; then exit 1; fi

      - name: Prove player support matches generic OSM road and sidewalk surfaces
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/generic_osm_ground_continuity_test.gd 2>&1 | tee /tmp/generic-ground-continuity.log
          if grep -E "SCRIPT ERROR|Parse Error:|GENERIC_OSM_GROUND_CONTINUITY_FAIL" /tmp/generic-ground-continuity.log; then exit 1; fi
          grep -q "GENERIC_OSM_GROUND_CONTINUITY_OK" /tmp/generic-ground-continuity.log
          grep -q "support_shapes=1" /tmp/generic-ground-continuity.log
          grep -q "source_height_inferred=false" /tmp/generic-ground-continuity.log

      - name: Prove generic support is isolated to the canonical Player
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/generic_osm_ground_collision_isolation_test.gd 2>&1 | tee /tmp/generic-ground-isolation.log
          if grep -E "SCRIPT ERROR|Parse Error:|GENERIC_OSM_GROUND_ISOLATION_FAIL" /tmp/generic-ground-isolation.log; then exit 1; fi
          grep -q "GENERIC_OSM_GROUND_ISOLATION_OK" /tmp/generic-ground-isolation.log

      - name: Upload continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-generic-ground-continuity
          path: |
            /tmp/generic-ground-import.log
            /tmp/generic-ground-continuity.log
            /tmp/generic-ground-isolation.log
          if-no-files-found: error
