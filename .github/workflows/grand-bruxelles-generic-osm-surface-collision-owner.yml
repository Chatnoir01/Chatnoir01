name: Grand Bruxelles Generic OSM Surface Collision Owner

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-generic-osm-surface-collision-owner.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/generic_osm_surface_collision_runtime.gd"
      - "grand-bruxelles-game/game/tests/generic_osm_surface_collision_owner_isolation_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generic-osm-surface-collision-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/generic-osm-support-owner-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/generic-osm-support-owner-import.log; then exit 1; fi
      - name: Validate foreign-name owner isolation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/generic_osm_surface_collision_owner_isolation_test.gd 2>&1 | tee /tmp/generic-osm-support-owner.log
          if grep -E "SCRIPT ERROR|Parse Error:|GENERIC_OSM_SURFACE_COLLISION_OWNER_FAIL" /tmp/generic-osm-support-owner.log; then exit 1; fi
          grep -q "GENERIC_OSM_SURFACE_COLLISION_OWNER_OK" /tmp/generic-osm-support-owner.log
