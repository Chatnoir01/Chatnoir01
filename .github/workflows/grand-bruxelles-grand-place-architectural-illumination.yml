name: Grand Bruxelles Grand Place Architectural Illumination

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-architectural-illumination.yml"
      - "grand-bruxelles-game/data/visual/grand_place_architectural_illumination.json"
      - "grand-bruxelles-game/game/scripts/grand_place_architectural_illumination.gd"
      - "grand-bruxelles-game/game/tests/grand_place_architectural_illumination_visual_test.gd"
      - "grand-bruxelles-game/project.godot"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic production A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_architectural_illumination_visual_test.gd 2>&1 | tee /tmp/grand-place-architectural-illumination.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_ARCHITECTURAL_ILLUMINATION_FAIL" /tmp/grand-place-architectural-illumination.log; then exit 1; fi
          grep -F "GRAND_PLACE_ARCHITECTURAL_ILLUMINATION_OK" /tmp/grand-place-architectural-illumination.log
          test -f grand-bruxelles-game/artifacts/grand-place/architectural-illumination/before.png
          test -f grand-bruxelles-game/artifacts/grand-place/architectural-illumination/after.png
      - name: Enforce full-frame anti-micro gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('grand-bruxelles-game/artifacts/grand-place/architectural-illumination/before.png').convert('RGB')
          b=Image.open('grand-bruxelles-game/artifacts/grand-place/architectural-illumination/after.png').convert('RGB')
          assert a.size==(1280,720) and b.size==a.size
          pa=list(a.getdata()); pb=list(b.getdata())
          changed3=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>3)
          changed8=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>8)
          total=1280*720
          ratio3=changed3/total
          ratio8=changed8/total
          print(f'GRAND_PLACE_ARCHITECTURAL_ILLUMINATION_PIXEL_GATE changed3={changed3} ratio3={ratio3:.6f} changed8={changed8} ratio8={ratio8:.6f}')
          if changed3 < 46080 or ratio3 < 0.05:
              raise SystemExit('anti-micro gate failed: facade illumination must change >=5% of the full frame')
          if changed8 < 23040 or ratio8 < 0.025:
              raise SystemExit('anti-micro gate failed: substantial illumination must change >=2.5% of the full frame')
          PY
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-architectural-illumination
          path: |
            grand-bruxelles-game/artifacts/grand-place/architectural-illumination/before.png
            grand-bruxelles-game/artifacts/grand-place/architectural-illumination/after.png
            /tmp/grand-place-architectural-illumination.log
          if-no-files-found: error
