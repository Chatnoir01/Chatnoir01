name: Grand Bruxelles Grand-Place Arrival Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-arrival-visual.yml"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/grand_place_official_surface.gd"
      - "grand-bruxelles-game/game/tests/grand_place_arrival_surface_visual_test.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_surface_42405.game.json"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grand-place-arrival-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic Grand-Place A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/grand_place_arrival_surface_visual_test.gd 2>&1 | tee /tmp/grand-place-arrival.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_ARRIVAL_SURFACE_FAIL" /tmp/grand-place-arrival.log; then exit 1; fi
          grep -F "GRAND_PLACE_ARRIVAL_SURFACE_OK" /tmp/grand-place-arrival.log
          test -f grand-bruxelles-game/artifacts/grand-place/arrival-surface/baseline.png
          test -f grand-bruxelles-game/artifacts/grand-place/arrival-surface/official_surface.png
      - name: Measure changed pixels
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          base = Image.open('grand-bruxelles-game/artifacts/grand-place/arrival-surface/baseline.png').convert('RGB')
          after = Image.open('grand-bruxelles-game/artifacts/grand-place/arrival-surface/official_surface.png').convert('RGB')
          assert base.size == after.size == (1280, 720)
          b = base.load(); a = after.load()
          changed = 0
          strong = 0
          minx=miny=10**9; maxx=maxy=-1
          for y in range(720):
              for x in range(1280):
                  d = max(abs(a[x,y][i]-b[x,y][i]) for i in range(3))
                  if d:
                      changed += 1
                  if d > 3:
                      strong += 1
                      minx=min(minx,x); maxx=max(maxx,x); miny=min(miny,y); maxy=max(maxy,y)
          pct = strong / (1280*720) * 100.0
          print(f'GRAND_PLACE_A_B: changed={changed} strong={strong} strong_pct={pct:.3f}% bbox={None if strong==0 else (minx,miny,maxx,maxy)}')
          Path('/tmp/grand-place-ab.txt').write_text(f'strong_pixels={strong}\nstrong_pct={pct:.6f}\n')
          assert strong > 5000, 'anti-micro gate: official surface must materially affect witness'
          PY
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-arrival-surface-evidence
          path: |
            grand-bruxelles-game/artifacts/grand-place/arrival-surface/baseline.png
            grand-bruxelles-game/artifacts/grand-place/arrival-surface/official_surface.png
            /tmp/grand-place-arrival.log
            /tmp/grand-place-ab.txt
          if-no-files-found: warn
