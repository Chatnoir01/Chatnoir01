name: Grand Bruxelles Grand-Place Brasseurs Clean Frame

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-clean-frame.yml"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_clean_frame_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brasseurs-clean-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brasseurs-clean-import.log; then exit 1; fi
      - name: Render and assert genuinely clean player-eye frame
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_brasseurs_clean_frame_witness_test.gd 2>&1 | tee /tmp/brasseurs-clean-frame.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_BRASSEURS_CLEAN_FRAME_FAIL" /tmp/brasseurs-clean-frame.log; then exit 1; fi
          grep -F "GRAND_PLACE_BRASSEURS_CLEAN_FRAME_OK" /tmp/brasseurs-clean-frame.log
          test -s /tmp/grand-place-brasseurs-clean-frame.png
      - name: Upload clean-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-brasseurs-clean-frame
          path: |
            /tmp/grand-place-brasseurs-clean-frame.png
            /tmp/brasseurs-clean-frame.log
            /tmp/brasseurs-clean-import.log
          if-no-files-found: error
