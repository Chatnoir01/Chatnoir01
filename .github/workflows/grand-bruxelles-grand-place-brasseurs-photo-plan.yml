name: Grand Bruxelles Grand-Place Brasseurs Photo Plan

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-photo-plan.yml"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_photo_plan.json"
      - "grand-bruxelles-game/tools/validate_brasseurs_photo_plan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-photo-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-bounded facade plan
        run: python3 grand-bruxelles-game/tools/validate_brasseurs_photo_plan.py
