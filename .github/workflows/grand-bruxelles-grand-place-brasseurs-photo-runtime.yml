name: Grand Bruxelles Grand-Place Brasseurs Photo Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-photo-runtime.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_photo_plan.json"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_photo_features.json"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_wall_vertical.json"
      - "grand-bruxelles-game/game/scripts/grand_place_brasseurs_photo_facade_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_photo_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_photo_facade_ab_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brasseurs-photo-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brasseurs-photo-runtime-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brasseurs-photo-runtime-import.log; then exit 1; fi
      - name: Validate Brasseurs photo-constrained runtime contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_photo_runtime_test.gd
