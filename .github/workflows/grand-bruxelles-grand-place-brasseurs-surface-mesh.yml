name: Grand Bruxelles Grand-Place Brasseurs Surface Mesh

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-surface-mesh.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_photo_plan.json"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_photo_features.json"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_wall_vertical.json"
      - "grand-bruxelles-game/game/scripts/grand_place_brasseurs_surface_mesh_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_surface_mesh_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_surface_mesh_ab_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brasseurs-surface-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1 and renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brasseurs-surface-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brasseurs-surface-import.log; then exit 1; fi
      - name: Validate source and non-primitive runtime contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_surface_mesh_test.gd 2>&1 | tee /tmp/brasseurs-surface-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_BRASSEURS_SURFACE_MESH_FAIL" /tmp/brasseurs-surface-contract.log; then exit 1; fi
          grep -q "GRAND_PLACE_BRASSEURS_SURFACE_MESH_OK" /tmp/brasseurs-surface-contract.log
      - name: Render deterministic frozen player A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_brasseurs_surface_mesh_ab_test.gd 2>&1 | tee /tmp/brasseurs-surface-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_BRASSEURS_SURFACE_MESH_AB_FAIL" /tmp/brasseurs-surface-ab.log; then exit 1; fi
          grep -q "GRAND_PLACE_BRASSEURS_SURFACE_MESH_AB_OK" /tmp/brasseurs-surface-ab.log
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-brasseurs-surface-mesh-ab
          path: |
            /tmp/grand-place-brasseurs-surface-before.png
            /tmp/grand-place-brasseurs-surface-after.png
            /tmp/brasseurs-surface-ab.log
            /tmp/brasseurs-surface-contract.log
          if-no-files-found: warn
