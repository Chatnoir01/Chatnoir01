name: Grand Bruxelles Grand-Place Brasseurs Coherent Wall Skin

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-wall-skin.yml"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_wall_skin_contract.json"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_attached_relief_contract.json"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_wall_skin_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_attached_relief_test.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_brasseurs_wall_skin_runtime.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coherent-wall-skin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brasseurs-wall-skin-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brasseurs-wall-skin-import.log; then exit 1; fi
      - name: Validate coherent official wall skin contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_wall_skin_test.gd
      - name: Validate attached relief contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_attached_relief_test.gd
