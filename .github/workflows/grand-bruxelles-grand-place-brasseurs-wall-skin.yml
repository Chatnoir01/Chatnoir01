name: Grand Bruxelles Grand-Place Brasseurs Wall Skin

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-brasseurs-wall-skin.yml"
      - "grand-bruxelles-game/game/scripts/grand_place_brasseurs_wall_skin_runtime.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_white_stone_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_wall_skin_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_brasseurs_wall_skin_ab_test.gd"
      - "grand-bruxelles-game/tools/check_brasseurs_wall_skin_ab.py"
      - "grand-bruxelles-game/data/qa/grand_place_brasseurs_wall_skin_source.json"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wall-skin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brasseurs-wall-skin-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brasseurs-wall-skin-import.log; then exit 1; fi
      - name: Assert exact coherent source wall
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_wall_skin_test.gd
      - name: Render deterministic current-vs-candidate A/B
        run: xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/grand_place_brasseurs_wall_skin_ab_test.gd
      - name: Enforce frozen visual-impact gate
        run: python3 grand-bruxelles-game/tools/check_brasseurs_wall_skin_ab.py /tmp/brasseurs-wall-before.png /tmp/brasseurs-wall-after.png
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-brasseurs-wall-skin-ab
          path: |
            /tmp/brasseurs-wall-before.png
            /tmp/brasseurs-wall-after.png
            /tmp/brasseurs-wall-ab-metrics.json
          if-no-files-found: warn
