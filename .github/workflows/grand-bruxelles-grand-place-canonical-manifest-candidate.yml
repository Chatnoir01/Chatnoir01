name: Grand Bruxelles Grand-Place Canonical Manifest Candidate

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/grand_place_canonical_manifest_candidate.review.json"
      - "grand-bruxelles-game/data/provenance/grand_place_canonical_registration.review.json"
      - "grand-bruxelles-game/data/provenance/grand_place_spatial_identity.review.json"
      - "grand-bruxelles-game/data/cell_manifests/bxl-e148000-n170000-s500.json"
      - ".github/workflows/grand-bruxelles-grand-place-canonical-manifest-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD || {
            echo "RED: historical candidate HOLD branch does not contain live main" >&2
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve historical candidate but reject Grand-Place identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('grand-bruxelles-game')
          candidate=json.loads((root/'data/provenance/grand_place_canonical_manifest_candidate.review.json').read_text())
          registration=json.loads((root/'data/provenance/grand_place_canonical_registration.review.json').read_text())
          hold=json.loads((root/'data/provenance/grand_place_spatial_identity.review.json').read_text())
          index=json.loads((root/'data/provenance/brussels_registered_cell_manifest_index.json').read_text())
          historical=root/'data/cell_manifests/bxl-e148000-n170000-s500.json'
          expected=root/'data/cell_manifests/bxl-e148500-n170500-s500.json'

          assert historical.is_file(), 'historical generic evidence cell must be preserved'
          assert not expected.exists(), 'correct Grand-Place cell must go through separate source/candidate gates'
          assert candidate['status']=='CANDIDATE_LOCKED_UNREGISTERED'
          assert candidate['semantic_sha256']=='bb0a23818b738b22b20aea1d9c37ecf794827e05d5d4ab8fed4f758d0c6f197e'
          assert candidate['candidate_manifest']['sha256']=='b454022050e850214eeb8d5345fe574e831dcaba6a832123a7dfe44070d0b020'
          assert all(value is False for value in candidate['authorization'].values())

          assert registration['status']=='SPATIAL_IDENTITY_MISMATCH_HOLD'
          assert registration['target_registered'] is False
          assert registration['historical_registration']['registered_as_generic_evidence'] is True
          assert registration['historical_registration']['treat_as_grand_place'] is False
          assert registration['expected_grand_place_target']['cell_id']=='bxl-e148500-n170500-s500'
          assert all(value is False for value in registration['runtime_authorization'].values())
          assert hold['status']=='SPATIAL_IDENTITY_MISMATCH_HOLD'
          assert all(value is False for value in hold['authorization'].values())

          rows={row['cell_id']: row for row in index['entries']}
          assert 'bxl-e148000-n170000-s500' in rows
          assert 'bxl-e148500-n170500-s500' not in rows
          assert rows['bxl-e148000-n170000-s500']['manifest_sha256']==registration['canonical_manifest_sha256']
          for key in ['runtime_directory_scan_authorized','road_crosswalk_authorized','runtime_mount_authorized','rendered_geometry_authorized','collision_authorized','safe_spawn_authorized','jouable_promotion_authorized']:
              assert index[key] is False, key
          print('GRAND_PLACE_MISTARGETED_CANDIDATE_HISTORY_PRESERVED_SPATIAL_IDENTITY_HOLD')
          PY
