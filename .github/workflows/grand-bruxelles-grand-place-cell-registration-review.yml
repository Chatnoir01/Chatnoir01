name: Grand Bruxelles Grand-Place Cell Registration Review

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/grand_place_cell_registration.review.json"
      - "grand-bruxelles-game/data/provenance/grand_place_spatial_identity.review.json"
      - "grand-bruxelles-game/tools/qa/review_grand_place_cell_registration.py"
      - "grand-bruxelles-game/tests/test_grand_place_cell_registration_review.py"
      - "grand-bruxelles-game/tests/test_grand_place_spatial_identity_hold.py"
      - ".github/workflows/grand-bruxelles-grand-place-cell-registration-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD || {
            echo "RED: Grand-Place cell registration HOLD branch does not contain live main" >&2
            exit 1
          }
      - name: Detect successor lifecycle
        id: lifecycle
        run: |
          if [ -f grand-bruxelles-game/data/cell_manifests/bxl-e148500-n170500-s500.json ]; then
            echo "registered=true" >> "$GITHUB_OUTPUT"
          else
            echo "registered=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run spatial identity and registration review regressions
        run: |
          python grand-bruxelles-game/tests/test_grand_place_spatial_identity_hold.py
          python grand-bruxelles-game/tests/test_grand_place_cell_registration_review.py
      - name: Rebuild deterministic historical HOLD review
        if: steps.lifecycle.outputs.registered == 'false'
        run: |
          python grand-bruxelles-game/tools/qa/review_grand_place_cell_registration.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --municipality-lock grand-bruxelles-game/data/provenance/grand_place_road_cell_municipality.measurement.json \
            --output "$RUNNER_TEMP/grand_place_cell_registration.review.json"
      - name: Require exact historical HOLD before successor registration
        if: steps.lifecycle.outputs.registered == 'false'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          generated_path = Path(os.environ["RUNNER_TEMP"]) / "grand_place_cell_registration.review.json"
          locked_path = Path("grand-bruxelles-game/data/provenance/grand_place_cell_registration.review.json")
          generated = json.loads(generated_path.read_text())
          locked = json.loads(locked_path.read_text())
          assert generated == locked, (generated, locked)
          assert generated["status"] == "SPATIAL_IDENTITY_MISMATCH_HOLD"
          assert generated["semantic_sha256"] == "bcdfd4bce0eefd422f39cd9aab1fc2387416c3688566bf524083d1f7e237b520"
          for key in ["registration_authorized","road_cell_mapping_authorized","runtime_mount_authorized","rendered_geometry_authorized","collision_authorized","safe_spawn_authorized","jouable_promotion_authorized"]:
              assert generated[key] is False, key
          print("GRAND_PLACE_CELL_REGISTRATION_REVIEW_SPATIAL_HOLD_LOCKED_EXACT")
          PY
      - name: Require immutable historical HOLD plus registered evidence-only successor
        if: steps.lifecycle.outputs.registered == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          game=Path('grand-bruxelles-game')
          locked=json.loads((game/'data/provenance/grand_place_cell_registration.review.json').read_text())
          corrected=json.loads((game/'data/cell_manifests/bxl-e148500-n170500-s500.json').read_text())
          index=json.loads((game/'data/provenance/brussels_registered_cell_manifest_index.json').read_text())
          assert locked['status']=='SPATIAL_IDENTITY_MISMATCH_HOLD'
          assert locked['semantic_sha256']=='bcdfd4bce0eefd422f39cd9aab1fc2387416c3688566bf524083d1f7e237b520'
          assert locked['target']['cell_id']=='bxl-e148000-n170000-s500'
          assert locked['target']['treat_as_grand_place'] is False
          assert locked['expected_grand_place_target']['cell_id']=='bxl-e148500-n170500-s500'
          assert locked['expected_grand_place_target']['authoritative_source_manifest_present'] is False
          assert locked['expected_grand_place_target']['canonical_manifest_present'] is False
          for key in ['registration_authorized','road_cell_mapping_authorized','runtime_mount_authorized','rendered_geometry_authorized','collision_authorized','safe_spawn_authorized','jouable_promotion_authorized']:
              assert locked[key] is False, key
          assert corrected['cell_id']=='bxl-e148500-n170500-s500'
          assert corrected['crs']=='EPSG:31370'
          assert corrected['maturity']['state']=='data_ready'
          assert all(v is False for v in corrected['maturity']['gates'].values())
          rows={row['cell_id']:row for row in index['entries']}
          row=rows['bxl-e148500-n170500-s500']
          assert row['evidence_only'] is True
          for key in ['runtime_mount_authorized','rendered_geometry_authorized','collision_authorized','safe_spawn_authorized','jouable_promotion_authorized']:
              assert row[key] is False, key
          print('GRAND_PLACE_CELL_REGISTRATION_REVIEW_HISTORICAL_HOLD_WITH_REGISTERED_SUCCESSOR_OK')
          PY
      - name: Upload historical HOLD evidence
        if: steps.lifecycle.outputs.registered == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-cell-registration-spatial-hold
          path: ${{ runner.temp }}/grand_place_cell_registration.review.json
          if-no-files-found: error
