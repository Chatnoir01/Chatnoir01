name: Grand Bruxelles Grand-Place Complete Contour Multiview

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/grand_place_complete_contour_multiview_contract.json"
      - "grand-bruxelles-game/game/tests/grand_place_complete_contour_multiview_capture_test.gd"
      - ".github/workflows/grand-bruxelles-grand-place-complete-contour-multiview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-complete-contour-multiview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-four-views:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen multiview contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, pathlib
          p = pathlib.Path('grand-bruxelles-game/data/qa/grand_place_complete_contour_multiview_contract.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 'grand-bruxelles-grand-place-complete-contour-multiview-v1'
          seed = d['camera_seed']
          assert seed['resolution'] == [1280, 720]
          assert seed['position'] == [319.01, 1.72, -535.20]
          assert seed['target'] == [321.91, 11.8, -485.66]
          assert seed['fov_degrees'] == 62.0
          views = d['views']
          assert [(v['id'], v['yaw_degrees_from_seed']) for v in views] == [
              ('canonical', 0.0), ('quarter_left', 90.0), ('opposite', 180.0), ('quarter_right', 270.0)
          ]
          for vector in (seed['position'], seed['target']):
              assert len(vector) == 3 and all(type(x) in (int, float) and math.isfinite(x) for x in vector)
          rules = d['capture_rules']
          assert rules['derive_views_only_by_exact_yaw_rotation_about_seed_target'] is True
          assert rules['preserve_seed_radius_height_target_and_fov'] is True
          assert rules['post_capture_camera_tuning_allowed'] is False
          hard = d['hard_rules']
          assert hard['source_geometry_modified'] is False
          assert hard['collision_modified'] is False
          assert hard['runtime_modified'] is False
          assert hard['camera_rescue_allowed'] is False
          assert hard['threshold_rescue_allowed'] is False
          assert hard['visual_acceptance'] is False
          assert hard['jouable_authorized'] is False
          print('GRAND_PLACE_MULTIVIEW_CONTRACT_OK')
          PY
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import exact head
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/gp-multiview-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/gp-multiview-import.log; then exit 1; fi
      - name: Capture four frozen full frames
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p /tmp/gp-multiview
          for view in canonical quarter_left opposite quarter_right; do
            set -o pipefail
            xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_complete_contour_multiview_capture_test.gd -- "$view" "/tmp/gp-multiview/$view.png" 2>&1 | tee "/tmp/gp-multiview/$view.log"
            if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_MULTIVIEW_CAPTURE_FAIL" "/tmp/gp-multiview/$view.log"; then exit 1; fi
            grep -F "GRAND_PLACE_MULTIVIEW_CLEARANCE_OK: view=$view" "/tmp/gp-multiview/$view.log"
            grep -F "GRAND_PLACE_MULTIVIEW_CAPTURE_OK: view=$view" "/tmp/gp-multiview/$view.log"
            test -s "/tmp/gp-multiview/$view.png"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ('canonical','quarter_left','opposite','quarter_right'):
              p=Path('/tmp/gp-multiview')/f'{name}.png'
              b=p.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II', b[16:24])
              assert (w,h)==(1280,720), (name,w,h)
          print('GRAND_PLACE_MULTIVIEW_FOUR_FULL_FRAMES_OK owner_review_required=true clearance_diagnostic_required=true')
          PY
      - name: Stage evidence
        if: always()
        run: |
          mkdir -p grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview
          cp /tmp/gp-multiview/* grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview/ 2>/dev/null || true
          cp /tmp/gp-multiview-import.log grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview/import.log 2>/dev/null || true
          sha256sum grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview/*.png > grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview/png_sha256.txt 2>/dev/null || true
      - name: Upload owner-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-complete-contour-multiview
          path: grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_multiview
          if-no-files-found: error
