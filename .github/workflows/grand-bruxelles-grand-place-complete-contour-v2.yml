name: Grand Bruxelles Grand-Place Complete Contour V2

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/grand_place_complete_contour_runtime.gd"
      - "grand-bruxelles-game/data/runtime/modules/grand_place_complete_contour.json"
      - "grand-bruxelles-game/data/qa/grand_place_complete_contour_witness_contract.json"
      - "grand-bruxelles-game/game/tests/grand_place_complete_contour_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_complete_contour_capture_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_complete_contour_ab_compare_test.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/**"
      - ".github/workflows/grand-bruxelles-grand-place-complete-contour-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-complete-contour-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-contour-v2-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-contour-v2-import.log; then exit 1; fi
      - name: Validate exact 23-owner triangle and collision accounting
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_complete_contour_runtime_test.gd 2>&1 | tee /tmp/grand-place-contour-v2-test.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_COMPLETE_CONTOUR_FAIL" /tmp/grand-place-contour-v2-test.log; then exit 1; fi
          grep -F "GRAND_PLACE_COMPLETE_CONTOUR_OK" /tmp/grand-place-contour-v2-test.log

  player-frame-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Copy frozen V2 witness harness into exact base checkout
        run: |
          cp head/grand-bruxelles-game/game/tests/grand_place_complete_contour_capture_test.gd base/grand-bruxelles-game/game/tests/grand_place_complete_contour_capture_test.gd
          cp head/grand-bruxelles-game/data/qa/grand_place_complete_contour_witness_contract.json base/grand-bruxelles-game/data/qa/grand_place_complete_contour_witness_contract.json
      - name: Import exact base and head
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-base-import.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-base-import.log /tmp/grand-place-head-import.log; then exit 1; fi
      - name: Capture frozen canonical BEFORE and AFTER in shared root World3D
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path base/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_complete_contour_capture_test.gd -- /tmp/grand-place-contour-before.png 2>&1 | tee /tmp/grand-place-before-capture.log
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path head/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_complete_contour_capture_test.gd -- /tmp/grand-place-contour-after.png 2>&1 | tee /tmp/grand-place-after-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_COMPLETE_CONTOUR_CAPTURE_FAIL" /tmp/grand-place-before-capture.log /tmp/grand-place-after-capture.log; then exit 1; fi
          grep -q "GRAND_PLACE_COMPLETE_CONTOUR_CAPTURE_OK" /tmp/grand-place-before-capture.log
          grep -q "GRAND_PLACE_COMPLETE_CONTOUR_CAPTURE_OK" /tmp/grand-place-after-capture.log
          test -s /tmp/grand-place-contour-before.png
          test -s /tmp/grand-place-contour-after.png
      - name: Measure frozen full-frame visual impact
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --script res://game/tests/grand_place_complete_contour_ab_compare_test.gd -- /tmp/grand-place-contour-before.png /tmp/grand-place-contour-after.png 2>&1 | tee /tmp/grand-place-contour-ab.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_COMPLETE_CONTOUR_AB_FAIL" /tmp/grand-place-contour-ab.log; then exit 1; fi
          grep -q "GRAND_PLACE_COMPLETE_CONTOUR_AB_OK" /tmp/grand-place-contour-ab.log
      - name: Stage owner-review evidence
        if: always()
        run: |
          mkdir -p head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2
          cp /tmp/grand-place-contour-before.png head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2/before.png 2>/dev/null || true
          cp /tmp/grand-place-contour-after.png head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2/after.png 2>/dev/null || true
          cp /tmp/grand-place-contour-ab.log head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2/metrics.log 2>/dev/null || true
          cp /tmp/grand-place-before-capture.log head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2/before_capture.log 2>/dev/null || true
          cp /tmp/grand-place-after-capture.log head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2/after_capture.log 2>/dev/null || true
      - name: Upload owner-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-complete-contour-v2-ab
          path: head/grand-bruxelles-game/artifacts/qa/grand_place_complete_contour_v2
          if-no-files-found: warn
