name: Grand Bruxelles Grand-Place Contiguous LoD2 Front Source

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/qa/extract_grand_place_contiguous_lod2_front.py"
      - ".github/workflows/grand-bruxelles-grand-place-contiguous-lod2-front-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyshp
        run: python -m pip install --disable-pip-version-check pyshp==2.3.1
      - name: Extract exact official contiguous frontage owners
        shell: bash
        run: |
          set -o pipefail
          python grand-bruxelles-game/tools/qa/extract_grand_place_contiguous_lod2_front.py 2>&1 | tee /tmp/grand-place-contiguous-lod2-front-source.log
          grep -F "GRAND_PLACE_CONTIGUOUS_LOD2_EXTRACT_OK" /tmp/grand-place-contiguous-lod2-front-source.log
      - name: Upload exact source outputs
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-contiguous-lod2-front-source
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_contiguous_lod2_front/*.json
            /tmp/grand-place-contiguous-lod2-front-source.log
          if-no-files-found: error
