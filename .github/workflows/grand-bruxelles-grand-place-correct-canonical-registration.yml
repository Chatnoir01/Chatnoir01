name: Grand Bruxelles Grand-Place Correct Canonical Registration

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-correct-canonical-registration.yml"
      - "grand-bruxelles-game/data/qa/grand_place_correct_canonical_registration.contract.json"
      - "grand-bruxelles-game/data/cell_manifests/bxl-e148500-n170500-s500.json"
      - "grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json"
      - "grand-bruxelles-game/data/provenance/grand_place_correct_canonical_registration.review.json"
      - "grand-bruxelles-game/data/provenance/grand_place_correct_source_cell_municipality.measurement.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e148500-n170500-s500/**"
      - "grand-bruxelles-game/tests/test_grand_place_correct_canonical_registration.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry and Data-only authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD
          python3 - "$LIVE_MAIN_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          live=sys.argv[1]
          c=json.loads(Path("grand-bruxelles-game/data/qa/grand_place_correct_canonical_registration.contract.json").read_text())
          assert c["production_base_sha"] == live, (c["production_base_sha"], live)
          assert c["destination_readiness"] == "REGISTERED_NOT_RENDERED"
          a=c["authorization"]
          assert a["canonical_registration"] is True
          assert a["municipality_assignment"] is True
          for key in ["road_to_cell_mapping","runtime_directory_scan","runtime_mount","rendered_geometry","collision","safe_spawn","jouable_promotion"]:
              assert a[key] is False, key
          print(f"GRAND_PLACE_CORRECT_CANONICAL_REGISTRATION_BASE_OK live_main={live} data_only=true runtime_rails_closed=true")
          PY

      - name: Verify deterministic manifest/index registration
        run: python3 grand-bruxelles-game/tests/test_grand_place_correct_canonical_registration.py
