name: Grand Bruxelles Grand-Place Corrected Road Frame Cell

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-corrected-road-frame-cell.yml"
      - "grand-bruxelles-game/data/qa/grand_place_corrected_road_frame_cell.contract.json"
      - "grand-bruxelles-game/tools/qa/measure_grand_place_corrected_road_frame_cell.py"
      - "grand-bruxelles-game/tests/test_grand_place_corrected_road_frame_cell.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: grand-bruxelles-game/data/qa/grand_place_corrected_road_frame_cell.contract.json
  ROAD_SOURCE: grand-bruxelles-game/data/osm/vertical_slice_01.game.json
  HISTORICAL: grand-bruxelles-game/data/city_machine/road_cell_coverage_candidates.json
  RECONCILIATION: grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json
  URBIS: grand-bruxelles-game/data/qa/grand_place_correct_urbis_source_cell.contract.json
  TOOL: grand-bruxelles-game/tools/qa/measure_grand_place_corrected_road_frame_cell.py

jobs:
  measure-grand-place-cell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry and closed contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA"
          python3 - "$LIVE_MAIN_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          c=json.loads(Path("grand-bruxelles-game/data/qa/grand_place_corrected_road_frame_cell.contract.json").read_text())
          assert c["schema"] == "grand-bruxelles-grand-place-corrected-road-frame-cell-contract-v1"
          assert c["status"] in {"RED_FIRST_CORRECTED_FRAME_CELL_PENDING", "LOCKED_CORRECTED_FRAME_CELL_MEASUREMENT"}
          assert c["production_base_sha"] == sys.argv[1], (c["production_base_sha"], sys.argv[1])
          assert c["zone"] == "grand_place"
          assert c["target"]["grid_cell_id"] == "E148500_N170500"
          assert c["target"]["urbis_cell_id"] == "bxl-e148500-n170500-s500"
          assert c["target"]["bbox"] == [148500.0,170500.0,149000.0,171000.0]
          assert c["dependencies"]["road_source_sha256"] == "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398"
          assert c["dependencies"]["historical_coverage_semantic_sha256"] == "8aaca3178894950a8a1efe8235e3313f34d4d23656b968a9cbf87666284acd7b"
          assert c["dependencies"]["reconciliation_semantic_sha256"] == "32f3b83ccedacc98f48cb4824b82a1758e436df87cf6849806340d10b5d0ec8d"
          assert c["dependencies"]["official_anchor_epsg31370"] == [148852.74417614136,170704.8857889818]
          assert [r["osm_id"] for r in c["representative_roads"]] == [13842686,684214770]
          assert all(v is False for v in c["authorization"].values())
          print("GRAND_PLACE_CORRECTED_FRAME_CONTRACT_OK", c["status"], "rails=closed")
          PY

      - name: Require locked upstream evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398  $ROAD_SOURCE" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path("grand-bruxelles-game/data/city_machine/road_cell_coverage_candidates.json").read_text())
          r=json.loads(Path("grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json").read_text())
          u=json.loads(Path("grand-bruxelles-game/data/qa/grand_place_correct_urbis_source_cell.contract.json").read_text())
          assert h["semantic_sha256"] == "8aaca3178894950a8a1efe8235e3313f34d4d23656b968a9cbf87666284acd7b"
          assert h["frame"]["origin_easting_m"] == 147868.29422791934
          assert h["frame"]["origin_northing_m"] == 169538.62414926197
          assert next(a for a in h["corridor_anchors"] if a["anchor_id"]=="grand_place")["grid_cell_id"] == "E148000_N170000"
          assert r["status"] == "LOCKED_RECONCILIATION_MEASUREMENT"
          assert r["locked_measurement"]["semantic_sha256"] == "32f3b83ccedacc98f48cb4824b82a1758e436df87cf6849806340d10b5d0ec8d"
          assert r["locked_measurement"]["frame_comparison"]["projected_source_origin_lambert72"] == [148538.362136,170165.796688]
          assert r["review_verdict"]["status"] == "HOLD_FRAME_RECONCILIATION_REQUIRED"
          assert r["review_verdict"]["projected_source_origin_frame_is_supported_candidate"] is True
          assert r["review_verdict"]["projected_source_origin_frame_authorized_for_production"] is False
          assert r["authorization"]["source_merge_authorized"] is False
          assert u["target"]["cell_id"] == "bxl-e148500-n170500-s500"
          assert u["target"]["bbox"] == [148500.0,170500.0,149000.0,171000.0]
          assert u["identity_dependency"]["official_anchor_epsg31370"] == [148852.74417614136,170704.8857889818]
          assert u["authorization"]["road_to_cell_mapping"] is False
          assert u["authorization"]["runtime_mount"] is False
          assert u["authorization"]["jouable_promotion"] is False
          print("GRAND_PLACE_UPSTREAM_EVIDENCE_LOCKED")
          PY

      - name: Run corrected-frame regressions
        working-directory: grand-bruxelles-game
        run: python -m unittest tests/test_grand_place_corrected_road_frame_cell.py -v

      - name: Measure Grand-Place target-cell identity
        shell: bash
        run: |
          set -euo pipefail
          python "$TOOL" \
            --contract "$CONTRACT" \
            --road-source "$ROAD_SOURCE" \
            --historical-coverage "$HISTORICAL" \
            --reconciliation "$RECONCILIATION" \
            --urbis-contract "$URBIS" \
            --output "$RUNNER_TEMP/grand_place_corrected_road_frame_cell.measurement.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"grand_place_corrected_road_frame_cell.measurement.json").read_text())
          assert d["schema"] == "grand-bruxelles-grand-place-corrected-road-frame-cell-measurement-v1"
          assert d["status"] == "MEASURED_GRAND_PLACE_FRAME_CELL_EVIDENCE_ONLY"
          assert d["anchor"]["official_grid_cell_id"] == "E148500_N170500"
          assert d["anchor"]["historical_grid_cell_id"] == "E148000_N170000"
          assert d["anchor"]["historical_inside_target"] is False
          assert d["anchor"]["corrected_grid_cell_id"] == "E148500_N170500"
          assert d["anchor"]["corrected_inside_target"] is True
          assert d["anchor"]["corrected_to_official_distance_m"] < 10.0
          reps={r["osm_id"]:r for r in d["representative_roads"]}
          assert (reps[13842686]["historical_frame"]["point_hits"], reps[13842686]["historical_frame"]["segment_hits"]) == (0,0)
          assert (reps[13842686]["corrected_frame_candidate"]["point_hits"], reps[13842686]["corrected_frame_candidate"]["segment_hits"]) == (6,5)
          assert (reps[684214770]["historical_frame"]["point_hits"], reps[684214770]["historical_frame"]["segment_hits"]) == (0,0)
          assert (reps[684214770]["corrected_frame_candidate"]["point_hits"], reps[684214770]["corrected_frame_candidate"]["segment_hits"]) == (3,2)
          assert d["verdict"]["corrected_frame_candidate_matches_official_grand_place_cell"] is True
          assert d["verdict"]["shared_frame_adoption_decision"] == "HOLD_SEPARATE_REVIEW_REQUIRED"
          assert all(v is False for v in d["authorization"].values())
          print("GRAND_PLACE_CORRECTED_FRAME_MEASUREMENT_READY", d["semantic_sha256"], d["anchor"], d["road_accounting"])
          PY

      - name: Upload exact measurement
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-corrected-road-frame-cell-measurement
          path: ${{ runner.temp }}/grand_place_corrected_road_frame_cell.measurement.json
          if-no-files-found: error
          retention-days: 30

      - name: Require reviewed persisted lock
        shell: bash
        run: |
          set -euo pipefail
          status="$(python3 - <<'PY'
          import json
          print(json.load(open("grand-bruxelles-game/data/qa/grand_place_corrected_road_frame_cell.contract.json"))["status"])
          PY
          )"
          if [ "$status" = "RED_FIRST_CORRECTED_FRAME_CELL_PENDING" ]; then
            echo "RED_FIRST_GRAND_PLACE_CORRECTED_FRAME_CELL_NOT_PERSISTED" >&2
            exit 1
          fi
          test "$status" = "LOCKED_CORRECTED_FRAME_CELL_MEASUREMENT"
          echo "GRAND_PLACE_CORRECTED_FRAME_CELL_LOCK_PRESENT"
