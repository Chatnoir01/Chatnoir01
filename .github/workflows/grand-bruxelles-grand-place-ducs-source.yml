name: Grand Bruxelles Grand-Place Ducs Source

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-ducs-source.yml"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve City records to official UrbIS buildings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ducs/extracted
          python3 - <<'PY'
          import json, math, urllib.parse, urllib.request
          from pathlib import Path

          CITY_API = 'https://opendata.brussels.be/api/explore/v2.1/catalog/datasets/description-des-batiments-de-la-grand-place/records?limit=100'
          req = urllib.request.Request(CITY_API, headers={'User-Agent':'Grand-Bruxelles-Game/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=90) as r:
              city = json.loads(r.read().decode('utf-8'))
          records = [r for r in city.get('results', []) if str(r.get('nom','')).startswith('Les Ducs de Brabant')]
          records.sort(key=lambda r: str(r.get('adresse','')))
          if len(records) != 7:
              raise SystemExit(f'expected 7 Ducs de Brabant City records, got {len(records)}')
          for r in records:
              gp=r.get('geo_point') or {}
              if not isinstance(gp,dict) or 'lon' not in gp or 'lat' not in gp:
                  raise SystemExit(f'missing City geo point for {r.get("adresse")}')
          Path('/tmp/ducs/city_records.json').write_text(json.dumps(records, ensure_ascii=False, indent=2)+'\n')

          lons=[float(r['geo_point']['lon']) for r in records]
          lats=[float(r['geo_point']['lat']) for r in records]
          pad=0.00035
          bbox=(min(lons)-pad,min(lats)-pad,max(lons)+pad,max(lats)+pad)
          params={
              'service':'WFS','version':'2.0.0','request':'GetFeature',
              'typeNames':'urbisvector:Buildings','outputFormat':'application/json',
              'srsName':'EPSG:4326','bbox':f'{bbox[0]},{bbox[1]},{bbox[2]},{bbox[3]},EPSG:4326'
          }
          url='https://geoservices-urbis.irisnet.be/geoserver/urbisvector/wfs?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Grand-Bruxelles-Game/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r:
              fc=json.loads(r.read().decode('utf-8'))
          if fc.get('type')!='FeatureCollection':
              raise SystemExit('UrbIS Buildings response is not a FeatureCollection')
          Path('/tmp/ducs/urbis_buildings.geojson').write_text(json.dumps(fc, ensure_ascii=False)+'\n')

          def point_in_ring(x,y,ring):
              inside=False
              pts=[p for p in ring if isinstance(p,list) and len(p)>=2]
              if len(pts)<3:return False
              j=len(pts)-1
              for i in range(len(pts)):
                  xi,yi=float(pts[i][0]),float(pts[i][1]); xj,yj=float(pts[j][0]),float(pts[j][1])
                  if ((yi>y)!=(yj>y)) and x < (xj-xi)*(y-yi)/((yj-yi) or 1e-30)+xi:
                      inside=not inside
                  j=i
              return inside
          def contains(geom,x,y):
              if not geom:return False
              typ=geom.get('type'); c=geom.get('coordinates',[])
              polys=[c] if typ=='Polygon' else c if typ=='MultiPolygon' else []
              for poly in polys:
                  if poly and point_in_ring(x,y,poly[0]):
                      if not any(point_in_ring(x,y,h) for h in poly[1:]):return True
              return False
          def bid(feature):
              props=feature.get('properties') or {}
              for v in (props.get('INSPIRE_ID'),props.get('ID'),feature.get('id')):
                  if v is None:continue
                  tail=str(v).rstrip('/').split('/')[-1].split('.')[-1]
                  if tail.isdigit():return tail
              return ''

          resolved=[]
          for rec in records:
              x=float(rec['geo_point']['lon']); y=float(rec['geo_point']['lat'])
              hits=[]
              for f in fc.get('features',[]):
                  if contains(f.get('geometry'),x,y):
                      value=bid(f)
                      if value:hits.append(value)
              hits=sorted(set(hits))
              if len(hits)!=1:
                  raise SystemExit(f'{rec.get("adresse")}: expected one containing UrbIS building, got {hits}')
              resolved.append({'city_id':rec.get('id'),'name':rec.get('nom'),'address':rec.get('adresse'),'height_city_m':rec.get('hauteur_totale'),'geo_point':rec.get('geo_point'),'building_id':hits[0]})
          unique=sorted(set(r['building_id'] for r in resolved), key=int)
          out={'schema':'grand-bruxelles-grand-place-ducs-source-resolution-v1','city_dataset':'description-des-batiments-de-la-grand-place','heritage_record':'Urban 31130','resolved':resolved,'unique_building_ids':unique,'runtime_approved':False,'realism_complete':False}
          Path('/tmp/ducs/resolution.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/ducs/ids.txt').write_text('\n'.join(unique)+'\n')
          print('DUCS_RESOLVED',json.dumps(resolved,ensure_ascii=False))
          PY

      - name: Download audited UrbIS Buildings3D package
        shell: bash
        run: |
          set -euo pipefail
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip"
          EXPECTED="cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/urbis3d.zip "$URL"
          echo "$EXPECTED  /tmp/urbis3d.zip" | sha256sum -c -
          mkdir -p /tmp/urbis3d
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148170_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source_root.txt

      - name: Extract exact LoD2 ensemble
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source_root.txt)"
          while read -r ID; do
            [ -n "$ID" ] || continue
            python3 grand-bruxelles-game/tools/extract_urbis_3d_context.py \
              --source-root "$ROOT" --prefix UrbISBuildings3D_148170 \
              --building-id "https://databrussels.be/id/building/$ID" \
              --context-id "grand_place_ducs_$ID" --name "Grand-Place Ducs de Brabant $ID" \
              --package-url "https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip" \
              --package-sha256 "cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2" \
              --package-revision "2026-08-08" --accessed-at "2026-08-17" \
              --origin-e 147868.29422791934 --origin-n 169538.62414926197 --world-x -668.5 --world-z 627.84 \
              --output "/tmp/ducs/extracted/$ID.game.json"
          done < /tmp/ducs/ids.txt
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('/tmp/ducs/extracted'); rows=[]; lo=[1e30,1e30]; hi=[-1e30,-1e30]
          for p in sorted(root.glob('*.game.json')):
              d=json.loads(p.read_text()); ev=d['evidence']; b=ev['source_bbox_xy']
              lo[0]=min(lo[0],b[0]);lo[1]=min(lo[1],b[1]);hi[0]=max(hi[0],b[2]);hi[1]=max(hi[1],b[3])
              rows.append({'building_id':p.stem.replace('.game',''),'width_m':round(b[2]-b[0],3),'depth_m':round(b[3]-b[1],3),'height_m':ev['height_m'],'faces':ev['face_count'],'triangles':ev['triangle_count'],'face_types':ev['face_type_counts']})
          if not rows: raise SystemExit('no Ducs LoD2 extracted')
          summary={'schema':'grand-bruxelles-grand-place-ducs-lod2-summary-v1','buildings':rows,'ensemble_bbox_epsg31370':[lo[0],lo[1],hi[0],hi[1]],'ensemble_width_m':round(hi[0]-lo[0],3),'ensemble_depth_m':round(hi[1]-lo[1],3),'runtime_approved':False,'realism_complete':False}
          pathlib.Path('/tmp/ducs/lod2_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('DUCS_LOD2_SUMMARY',json.dumps(summary))
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-ducs-source
          path: /tmp/ducs
          if-no-files-found: error
