name: Grand Bruxelles Grand-Place Facade ARM64 Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-facade-arm64-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-place-facade-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  facade-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require exact stacked facade candidate
        shell: bash
        run: |
          test "${{ github.event.pull_request.base.sha }}" = "2e583d41f068831b9f11812f6e62d4e06a85801c" || {
            echo "GRAND_PLACE_FACADE_ARM64_STALE_BASE actual=${{ github.event.pull_request.base.sha }} expected=2e583d41f068831b9f11812f6e62d4e06a85801c"
            exit 1
          }
      - name: Ensure ARM64 renderer dependencies
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0
          fi
          command -v Xvfb
      - name: Install Godot 4.7.1 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.arm64.zip
          rm -rf /tmp/godot && mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.arm64
      - name: Import and parse exact facade candidate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-facade-arm64-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-facade-arm64-import.log; then exit 1; fi
      - name: Validate facade invariants ARM64
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_facade_presentation_runtime_test.gd 2>&1 | tee /tmp/grand-place-facade-arm64-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_FACADE_PRESENTATION_FAIL" /tmp/grand-place-facade-arm64-runtime.log; then exit 1; fi
          grep -q "GRAND_PLACE_FACADE_PRESENTATION_OK" /tmp/grand-place-facade-arm64-runtime.log
      - name: Capture four AFTER views ARM64
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.arm64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/grand_place_facade_multiview_capture_test.gd -- \
            grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64 after \
            2>&1 | tee grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64/capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_FACADE_CAPTURE_FAIL" grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64/capture.log; then exit 1; fi
          grep -q "GRAND_PLACE_FACADE_CAPTURE_OK" grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64/capture.log
          test "$(find grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64 -name '*_after.png' | wc -l)" -eq 4
          cp /tmp/grand-place-facade-arm64-import.log grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64/import.log
          cp /tmp/grand-place-facade-arm64-runtime.log grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64/runtime.log
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-facade-arm64-after
          path: grand-bruxelles-game/artifacts/qa/grand_place_facade_arm64
          if-no-files-found: error
