name: Grand Bruxelles Grand-Place Identity Lock

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-identity-lock.yml"
      - "grand-bruxelles-game/tools/qa/validate_grand_place_identity_lock.py"
      - "grand-bruxelles-game/data/qa/grand_place_facade_owner_identity.lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact live-main base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          expected="c4b29c284df182091a1a4cdf19e1d2dc894f45e4"
          current="$(git rev-parse origin/main)"
          base="$(git merge-base HEAD origin/main)"
          echo "live_main=$current"
          echo "merge_base=$base"
          test "$current" = "$expected" || { echo "GRAND_PLACE_IDENTITY_LOCK_STALE_MAIN current=$current expected=$expected"; exit 1; }
          test "$base" = "$expected" || { echo "GRAND_PLACE_IDENTITY_LOCK_STALE_BASE base=$base expected=$expected"; exit 1; }
      - name: Validate fail-closed exact-address ownership
        run: python3 grand-bruxelles-game/tools/qa/validate_grand_place_identity_lock.py
