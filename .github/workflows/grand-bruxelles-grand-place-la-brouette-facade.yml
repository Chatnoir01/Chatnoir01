name: Grand Bruxelles Grand-Place La Brouette Facade

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-la-brouette-facade.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/qa/grand_place_la_brouette_facade_contract.json"
      - "grand-bruxelles-game/game/scripts/grand_place_la_brouette_facade_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_la_brouette_facade_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_la_brouette_facade_ab_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/brouette-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/brouette-import.log; then exit 1; fi
      - name: Validate La Brouette facade contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_la_brouette_facade_test.gd
