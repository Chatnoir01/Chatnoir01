name: Grand Bruxelles Grand-Place Late OSM Mask

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1786758.gd"
      - "grand-bruxelles-game/game/tests/grand_place_lod2_late_osm_mask_runtime_test.gd"
      - "grand-bruxelles-game/tests/test_grand_place_lod2_late_osm_mask_contract.py"
      - ".github/workflows/grand-bruxelles-grand-place-late-osm-mask.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-late-osm-mask-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  late-osm-mask-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - id: godot_install
        name: Install and verify Godot 4.7.1
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/grand-place-late-osm-install.log) 2>&1
          expected_sha256="c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba"
          url="https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          rm -rf /tmp/godot /tmp/godot.zip
          mkdir -p /tmp/godot
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "$url"
          echo "${expected_sha256}  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          test -f /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version
      - id: import
        name: Import exact head
        if: steps.godot_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-late-osm-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-late-osm-import.log; then exit 1; fi
      - id: runtime
        name: Reproduce late container and late descendant masking in Godot 4.7.1
        if: steps.godot_install.outcome == 'success' && steps.import.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --script res://game/tests/grand_place_lod2_late_osm_mask_runtime_test.gd \
            2>&1 | tee /tmp/grand-place-late-osm-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_LOD2_LATE_OSM_MASK_RUNTIME_FAIL" /tmp/grand-place-late-osm-runtime.log; then exit 1; fi
          grep -F "GRAND_PLACE_LOD2_LATE_OSM_MASK_RUNTIME_OK scripts=2" /tmp/grand-place-late-osm-runtime.log
      - id: static
        name: Prove late OSM replacement masking is not startup-window bounded
        if: always()
        continue-on-error: true
        run: python grand-bruxelles-game/tests/test_grand_place_lod2_late_osm_mask_contract.py
      - name: Persist exact-head sub-gate and per-owner A/B outcomes
        if: always()
        shell: bash
        env:
          GODOT_INSTALL_OUTCOME: "${{ steps.godot_install.outcome }}"
          IMPORT_OUTCOME: "${{ steps.import.outcome }}"
          RUNTIME_OUTCOME: "${{ steps.runtime.outcome }}"
          STATIC_OUTCOME: "${{ steps.static.outcome }}"
          EXACT_HEAD_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
        run: |
          set -euo pipefail
          out="grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask"
          mkdir -p "$out"
          python3 - <<'PY'
          import json, os, pathlib, re

          out = pathlib.Path("grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask")
          runtime_log_path = pathlib.Path("/tmp/grand-place-late-osm-runtime.log")
          runtime_log = runtime_log_path.read_text(encoding="utf-8", errors="replace") if runtime_log_path.exists() else ""
          owner_ids = ("1655673", "1786758")
          owners = {}
          for building_id in owner_ids:
              early_ok = bool(re.search(rf"GRAND_PLACE_LOD2_LATE_OSM_MASK_EARLY_CONTROL_OK building={building_id}\b", runtime_log))
              late_container_ok = bool(re.search(rf"GRAND_PLACE_LOD2_LATE_OSM_MASK_LATE_CONTAINER_OK building={building_id}\b", runtime_log))
              late_descendant_ok = bool(re.search(rf"GRAND_PLACE_LOD2_LATE_OSM_MASK_LATE_DESCENDANT_OK building={building_id}\b", runtime_log))
              late_failures = re.findall(
                  rf"GRAND_PLACE_LOD2_LATE_OSM_MASK_RUNTIME_FAIL: ((?:late-container|late-descendant) OSM replacement .* for {building_id})",
                  runtime_log,
              )
              owners[building_id] = {
                  "early_control_masked": early_ok,
                  "late_container_masked": late_container_ok,
                  "late_descendant_masked": late_descendant_ok,
                  "late_arrival_masked": late_container_ok and late_descendant_ok,
                  "late_arrival_failures": sorted(set(late_failures)),
              }

          payload = {
              "schema": "grand-bruxelles-grand-place-late-osm-mask-v4",
              "exact_head_sha": os.environ["EXACT_HEAD_SHA"],
              "godot_install_outcome": os.environ["GODOT_INSTALL_OUTCOME"],
              "import_outcome": os.environ["IMPORT_OUTCOME"],
              "runtime_outcome": os.environ["RUNTIME_OUTCOME"],
              "static_outcome": os.environ["STATIC_OUTCOME"],
              "godot_archive_sha256": "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba",
              "ab_variable": "osm_arrival_order_only",
              "expected_owner_ids": list(owner_ids),
              "owners": owners,
              "source_geometry_mutated": False,
              "camera_mutated": False,
              "destination_advertisable": False,
              "visual_acceptance": False,
              "jouable_authorized": False,
          }
          (out / "contract-outcomes.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("GRAND_PLACE_LATE_OSM_MASK_OUTCOMES " + json.dumps(payload, sort_keys=True))
          PY
          {
            echo "### Grand-Place late OSM mask"
            echo "- exact head: \`${EXACT_HEAD_SHA}\`"
            echo "- Godot install: **${GODOT_INSTALL_OUTCOME}**"
            echo "- exact-head import: **${IMPORT_OUTCOME}**"
            echo "- Godot runtime contract: **${RUNTIME_OUTCOME}**"
            echo "- static source-shape contract: **${STATIC_OUTCOME}**"
            python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/contract-outcomes.json").read_text())
          for building_id in d["expected_owner_ids"]:
              r = d["owners"][building_id]
              print(f"- owner {building_id}: A early=**{str(r['early_control_masked']).lower()}** B1 late_container=**{str(r['late_container_masked']).lower()}** B2 late_descendant=**{str(r['late_descendant_masked']).lower()}**")
          PY
            echo "- visual acceptance: **false**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require infrastructure, both contracts and exact A/B evidence
        if: always()
        shell: bash
        env:
          GODOT_INSTALL_OUTCOME: "${{ steps.godot_install.outcome }}"
          IMPORT_OUTCOME: "${{ steps.import.outcome }}"
          RUNTIME_OUTCOME: "${{ steps.runtime.outcome }}"
          STATIC_OUTCOME: "${{ steps.static.outcome }}"
        run: |
          set -euo pipefail
          echo "install=${GODOT_INSTALL_OUTCOME} import=${IMPORT_OUTCOME} runtime=${RUNTIME_OUTCOME} static=${STATIC_OUTCOME}"
          test "${GODOT_INSTALL_OUTCOME}" = success
          test "${IMPORT_OUTCOME}" = success
          test "${RUNTIME_OUTCOME}" = success
          test "${STATIC_OUTCOME}" = success
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/contract-outcomes.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == "grand-bruxelles-grand-place-late-osm-mask-v4"
          assert d["expected_owner_ids"] == ["1655673", "1786758"]
          assert d["ab_variable"] == "osm_arrival_order_only"
          for building_id in d["expected_owner_ids"]:
              r = d["owners"][building_id]
              assert r["early_control_masked"] is True, (building_id, "early")
              assert r["late_container_masked"] is True, (building_id, "late-container")
              assert r["late_descendant_masked"] is True, (building_id, "late-descendant")
              assert r["late_arrival_masked"] is True, (building_id, "late-arrival")
              assert r["late_arrival_failures"] == [], (building_id, r["late_arrival_failures"])
          assert d["source_geometry_mutated"] is False
          assert d["camera_mutated"] is False
          assert d["destination_advertisable"] is False
          assert d["visual_acceptance"] is False
          assert d["jouable_authorized"] is False
          print("GRAND_PLACE_LATE_OSM_MASK_AB_EVIDENCE_OK owners=2 early=true late_container=true late_descendant=true")
          PY
      - name: Stage diagnostic logs
        if: always()
        shell: bash
        run: |
          mkdir -p grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask
          cp /tmp/grand-place-late-osm-install.log grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/ 2>/dev/null || true
          cp /tmp/grand-place-late-osm-import.log grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/ 2>/dev/null || true
          cp /tmp/grand-place-late-osm-runtime.log grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/ 2>/dev/null || true
          sha256sum grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/* > grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask/evidence-sha256.txt 2>/dev/null || true
      - name: Upload late-mask diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-late-osm-mask-${{ github.event.pull_request.head.sha || github.sha }}
          path: grand-bruxelles-game/artifacts/qa/grand_place_late_osm_mask
          if-no-files-found: error
