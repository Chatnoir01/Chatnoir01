name: Grand Bruxelles Grand Place LoD2 1645578

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-lod2-1645578.yml"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1645578.game.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download audited official UrbIS 3D tile
        shell: bash
        run: |
          set -euo pipefail
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip"
          EXPECTED="cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/urbis3d.zip "$URL"
          echo "$EXPECTED  /tmp/urbis3d.zip" | sha256sum -c -
          mkdir -p /tmp/urbis3d
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148170_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source_root.txt
      - name: Extract exact source geometry
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source_root.txt)"
          mkdir -p /tmp/locked grand-bruxelles-game/data/urbis/grand_place_lod2
          python3 grand-bruxelles-game/tools/extract_urbis_3d_context.py \
            --source-root "$ROOT" --prefix UrbISBuildings3D_148170 \
            --building-id "https://databrussels.be/id/building/1645578" \
            --context-id "grand_place_context_1645578" --name "Grand-Place official LoD2 building 1645578" \
            --package-url "https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip" \
            --package-sha256 "cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2" \
            --package-revision "2026-08-08" --accessed-at "2026-08-14" \
            --origin-e 147868.29422791934 --origin-n 169538.62414926197 --world-x -668.5 --world-z 627.84 \
            --output /tmp/locked/1645578.game.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/locked/1645578.game.json'))
          assert d['source']['building_2d_id']=='https://databrussels.be/id/building/1645578'
          assert d['source']['package_sha256']=='cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2'
          assert d['source']['crs']=='EPSG:31370'
          assert abs(d['evidence']['height_m']-27.331)<0.01
          assert d['evidence']['face_count']==58
          assert d['evidence']['face_type_counts']['WALLSURFACE']==39
          assert d['evidence']['face_type_counts']['ROOFSURFACE']==17
          assert d['runtime_approved'] is False
          print('GRAND_PLACE_1645578_SOURCE_OK',d['evidence'])
          PY
          cp /tmp/locked/1645578.game.json grand-bruxelles-game/data/urbis/grand_place_lod2/1645578.game.json
      - name: Persist locked extraction on PR head when needed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/urbis/grand_place_lod2/1645578.game.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(grand-place): lock official LoD2 building 1645578 [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload provenance witness
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-lod2-1645578-source
          path: /tmp/locked/1645578.game.json
          if-no-files-found: error
