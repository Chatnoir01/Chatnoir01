name: Grand Bruxelles Maison du Roi Facade

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-facade.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/qa/grand_place_maison_du_roi_facade_contract.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1654360.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_maison_du_roi_facade_articulation_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_facade_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_facade_ab_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maison-du-roi-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/maison-du-roi-facade-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/maison-du-roi-facade-import.log; then exit 1; fi
      - name: Validate source and facade contract
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_maison_du_roi_facade_test.gd 2>&1 | tee /tmp/maison-du-roi-facade-structure.log
          if grep -E "SCRIPT ERROR|Parse Error:|MAISON_DU_ROI_FACADE_FAIL" /tmp/maison-du-roi-facade-structure.log; then exit 1; fi
          grep -F "MAISON_DU_ROI_FACADE_OK" /tmp/maison-du-roi-facade-structure.log
      - name: Render frozen player-turn A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 900s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/grand_place_maison_du_roi_facade_ab_test.gd \
            2>&1 | tee /tmp/maison-du-roi-facade-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|MAISON_DU_ROI_FACADE_AB_FAIL" /tmp/maison-du-roi-facade-ab.log; then exit 1; fi
          grep -F "MAISON_DU_ROI_FACADE_AB_OK" /tmp/maison-du-roi-facade-ab.log
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-maison-du-roi-facade-ab
          path: |
            /tmp/grand-place-maison-du-roi-facade-before.png
            /tmp/grand-place-maison-du-roi-facade-after.png
            /tmp/grand-place-maison-du-roi-facade-metrics.json
            /tmp/maison-du-roi-facade-import.log
            /tmp/maison-du-roi-facade-structure.log
            /tmp/maison-du-roi-facade-ab.log
          if-no-files-found: warn
