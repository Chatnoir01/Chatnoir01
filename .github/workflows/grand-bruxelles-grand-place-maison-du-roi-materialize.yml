name: Grand Bruxelles Grand-Place Maison du Roi Source Lock

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-materialize.yml"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json"
      - "grand-bruxelles-game/data/visual/grand_place_maison_du_roi_identity.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed official source lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          mesh=json.loads(Path('grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json').read_text())
          identity=json.loads(Path('grand-bruxelles-game/data/visual/grand_place_maison_du_roi_identity.json').read_text())
          s=mesh['source']; e=mesh['evidence']; t=e['face_type_counts']
          assert mesh['schema']=='grand-bruxelles-urbis-context-mesh-v1'
          assert s['building_2d_id']=='https://databrussels.be/id/building/1654360'
          assert s['package_sha256']=='cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2'
          assert s['crs']=='EPSG:31370' and s['license']=='CC0-1.0'
          assert e['face_count']==71 and e['triangle_count']==230
          assert t=={'ROOFSURFACE':22,'WALLSURFACE':48,'GROUNDSURFACE':1}
          assert abs(float(e['height_m'])-30.387)<0.001
          assert identity['city_source']['record_id']=='028'
          assert abs(float(identity['city_source']['total_height_m'])-38.0)<0.001
          assert identity['urbis_3d']['building_id']==s['building_2d_id']
          assert identity['vertical_completeness'] is False
          assert identity['geometry_rescaled'] is False
          assert identity['openings_authored'] is False
          assert identity['material_identity_complete'] is False
          assert identity['runtime_approved'] is False
          assert identity['realism_complete'] is False
          print('MAISON_DU_ROI_SOURCE_LOCK_OK building=1654360 faces=71 triangles=230 city_height=38.0 lod2_height=30.387')
          PY
