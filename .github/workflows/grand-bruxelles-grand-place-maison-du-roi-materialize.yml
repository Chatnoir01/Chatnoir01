name: Grand Bruxelles Grand-Place Maison du Roi Materialize

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-materialize.yml"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download locked official UrbIS 3D package
        shell: bash
        run: |
          set -euo pipefail
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip"
          EXPECTED="cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/urbis3d.zip "$URL"
          echo "$EXPECTED  /tmp/urbis3d.zip" | sha256sum -c -
          mkdir -p /tmp/urbis3d
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148170_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source_root.txt
      - name: Reproduce exact 1654360 LoD2 JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p grand-bruxelles-game/data/urbis/grand_place_lod2
          python3 grand-bruxelles-game/tools/extract_urbis_3d_context.py \
            --source-root "$(cat /tmp/source_root.txt)" --prefix UrbISBuildings3D_148170 \
            --building-id "https://databrussels.be/id/building/1654360" \
            --context-id "grand_place_maison_du_roi" --name "Grand-Place Maison du Roi" \
            --package-url "https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip" \
            --package-sha256 "cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2" \
            --package-revision "2026-08-08" --accessed-at "2026-08-16" \
            --origin-e 147868.29422791934 --origin-n 169538.62414926197 --world-x -668.5 --world-z 627.84 \
            --output grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json')
          d=json.loads(p.read_text()); e=d['evidence']; s=d['source']
          assert s['building_2d_id']=='https://databrussels.be/id/building/1654360'
          assert s['package_sha256']=='cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2'
          assert e['face_count']==71 and e['triangle_count']==230
          assert e['face_type_counts']=={'ROOFSURFACE':22,'WALLSURFACE':48,'GROUNDSURFACE':1}
          assert abs(float(e['height_m'])-30.387)<0.001
          print('MAISON_DU_ROI_MATERIALIZE_OK')
          PY
      - name: Commit exact evidence to source branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json; then
            echo "Exact evidence already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json
          git commit -m "data(grand-place): add official Maison du Roi LoD2"
          git push origin HEAD:${{ github.head_ref }}
