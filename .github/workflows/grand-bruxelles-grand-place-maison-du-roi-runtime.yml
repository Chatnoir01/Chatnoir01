name: Grand Bruxelles Grand-Place Maison du Roi Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-runtime.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1654360.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_lod2_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_ab_capture_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maison-du-roi-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/maison-du-roi-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/maison-du-roi-import.log; then exit 1; fi
      - name: Validate exact official runtime contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_maison_du_roi_lod2_test.gd
      - name: Render deterministic full-frame A/B
        run: xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/grand_place_maison_du_roi_ab_capture_test.gd
      - name: Upload full-frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-maison-du-roi-ab
          path: |
            /tmp/grand-place-maison-du-roi-before.png
            /tmp/grand-place-maison-du-roi-after.png
          if-no-files-found: error
