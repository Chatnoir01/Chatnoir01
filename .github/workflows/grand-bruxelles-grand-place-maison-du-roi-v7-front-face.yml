name: Grand Bruxelles Maison du Roi V7 Front Face

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-v7-front-face.yml"
      - "grand-bruxelles-game/game/scripts/grand_place_maison_du_roi_tower_depth_v7.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_facade_presentation_integrated_v5.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_v7_front_face_test.gd"
      - "grand-bruxelles-game/data/runtime/modules/grand_place_maison_du_roi_tower_depth_v7.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  front-face-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/maison-v7-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/maison-v7-import.log; then exit 1; fi
      - name: Prove Maison du Roi front-face articulation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_maison_du_roi_v7_front_face_test.gd 2>&1 | tee /tmp/maison-v7-front-face.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_MAISON_DU_ROI_V7_FRONT_FACE_FAIL" /tmp/maison-v7-front-face.log; then exit 1; fi
          grep -q "GRAND_PLACE_MAISON_DU_ROI_V7_FRONT_FACE_OK" /tmp/maison-v7-front-face.log
      - name: Record live-main staleness without masking structural proof
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          git fetch --no-tags origin main
          current="$(git rev-parse origin/main)"
          tested_merge="$(git rev-parse HEAD)"
          head="$PR_HEAD_SHA"
          test -n "$head"
          git cat-file -e "$head^{commit}"
          base="$(git merge-base "$head" origin/main)"
          echo "live_main=$current"
          echo "pr_head=$head"
          echo "tested_merge=$tested_merge"
          echo "branch_merge_base=$base"
          if [ "$base" != "$current" ]; then
            echo "GRAND_PLACE_REBUILD_REQUIRED live_main=$current pr_head=$head merge_base=$base"
          else
            echo "GRAND_PLACE_EXACT_MAIN=true"
          fi
      - name: Upload deterministic proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maison-du-roi-v7-front-face-proof
          path: |
            /tmp/maison-v7-import.log
            /tmp/maison-v7-front-face.log
          if-no-files-found: error
