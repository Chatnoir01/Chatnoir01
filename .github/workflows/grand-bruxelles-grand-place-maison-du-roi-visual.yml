name: Grand Bruxelles Grand-Place Maison du Roi Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-du-roi-visual.yml"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1654360.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_du_roi_visual_test.gd"
      - "grand-bruxelles-game/project.godot"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic frozen Grand-Place A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_maison_du_roi_visual_test.gd 2>&1 | tee /tmp/grand-place-maison-du-roi.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_MAISON_DU_ROI_VISUAL_FAIL" /tmp/grand-place-maison-du-roi.log; then exit 1; fi
          grep -F "GRAND_PLACE_MAISON_DU_ROI_VISUAL_OK" /tmp/grand-place-maison-du-roi.log
          test -f grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/before.png
          test -f grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/after.png
      - name: Enforce large-landmark pixel gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          before=Image.open('grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/before.png').convert('RGB')
          after=Image.open('grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/after.png').convert('RGB')
          assert before.size==(1280,720) and after.size==before.size
          a=list(before.getdata()); b=list(after.getdata())
          changed3=sum(1 for x,y in zip(a,b) if max(abs(x[i]-y[i]) for i in range(3))>3)
          changed8=sum(1 for x,y in zip(a,b) if max(abs(x[i]-y[i]) for i in range(3))>8)
          total=1280*720
          ratio3=changed3/total; ratio8=changed8/total
          report=f'GRAND_PLACE_MAISON_DU_ROI_PIXEL_GATE changed3={changed3} ratio3={ratio3:.6f} changed8={changed8} ratio8={ratio8:.6f}'
          print(report)
          Path('/tmp/grand-place-maison-du-roi-pixel-gate.txt').write_text(report+'\n')
          if ratio3 < 0.03 or ratio8 < 0.01:
              raise SystemExit('large-landmark gate failed: Maison du Roi is not materially visible from the locked Grand-Place witness')
          PY
      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-maison-du-roi-visual
          path: |
            grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/before.png
            grand-bruxelles-game/artifacts/grand-place/maison-du-roi-1654360/after.png
            /tmp/grand-place-maison-du-roi.log
            /tmp/grand-place-maison-du-roi-pixel-gate.txt
          if-no-files-found: warn
