name: Grand Bruxelles Grand-Place Maison du Roi Articulation

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1654360.game.json"
      - "grand-bruxelles-game/game/scripts/grand_place_maison_roi_articulation_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_roi_articulation_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_maison_roi_articulation_ab_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-grand-place-maison-roi-articulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Validate source-bounded Maison du Roi articulation contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_maison_roi_articulation_test.gd 2>&1 | tee /tmp/contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_MAISON_ROI_ARTICULATION_FAIL" /tmp/contract.log; then exit 1; fi
          grep -q "GRAND_PLACE_MAISON_ROI_ARTICULATION_OK" /tmp/contract.log
