name: Grand Bruxelles Grand-Place Maison du Roi Integrate

on:
  push:
    branches:
      - visual/grand-place-maison-roi-articulation-580ef7e
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-maison-roi-integrate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/grand-place-maison-roi-articulation-580ef7e
      - name: Register candidate runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grand-bruxelles-game/project.godot')
          s=p.read_text()
          line='GrandPlaceMaisonRoiArticulationRuntime="*res://game/scripts/grand_place_maison_roi_articulation_runtime.gd"\n'
          if line not in s:
              marker='[autoload]\n'
              assert marker in s
              s=s.replace(marker, marker+line, 1)
              p.write_text(s)
          PY
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and run RED-first contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_maison_roi_articulation_test.gd 2>&1 | tee /tmp/contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_MAISON_ROI_ARTICULATION_FAIL" /tmp/contract.log; then exit 1; fi
          grep -q "GRAND_PLACE_MAISON_ROI_ARTICULATION_OK" /tmp/contract.log
      - name: Commit runtime registration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add grand-bruxelles-game/project.godot
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(grand-place): register Maison du Roi articulation runtime"
          git push origin HEAD:visual/grand-place-maison-roi-articulation-580ef7e
