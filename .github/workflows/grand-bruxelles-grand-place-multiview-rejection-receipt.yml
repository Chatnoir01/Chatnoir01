name: Grand Bruxelles Grand-Place Multiview Rejection Receipt

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/grand_place_multiview_rejection_receipt.json"
      - "grand-bruxelles-game/game/tests/grand_place_multiview_rejection_receipt_test.py"
      - ".github/workflows/grand-bruxelles-grand-place-multiview-rejection-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rejection-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable rejected player-view evidence
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/grand_place_multiview_rejection_receipt_test.py | tee /tmp/gp-multiview-rejection.log
          grep -F "GRAND_PLACE_MULTIVIEW_REJECTION_RECEIPT_OK overall=REJECT rejected=q1_selected,q2_selected" /tmp/gp-multiview-rejection.log
