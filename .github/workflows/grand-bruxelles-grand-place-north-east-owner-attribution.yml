name: Grand Bruxelles Grand-Place North-East Owner Attribution

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-north-east-owner-attribution.yml"
      - "grand-bruxelles-game/game/tests/grand_place_north_east_owner_attribution_witness_test.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_contour_runtime.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/**"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-north-east-owner-attribution-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  north-east-owner-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          VALIDATED_BASE_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$VALIDATED_BASE_SHA")" = "$VALIDATED_BASE_SHA"
          printf 'GP_VALIDATED_BASE_SHA=%s\n' "$VALIDATED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Install verified Godot 4.7.1 and evidence tools
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 imagemagick
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          GODOT_VERSION="$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version)"
          printf '%s\n' "$GODOT_VERSION" | grep -E '^4\.7\.1\.stable\.'
          printf 'GODOT_VERSION=%s\n' "$GODOT_VERSION" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-owner-attribution-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-owner-attribution-import.log; then exit 1; fi

      - name: Capture deterministic north-east owner exclusions
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/grand-place-north-east-owner-attribution
          mkdir -p /tmp/grand-place-north-east-owner-attribution
          timeout 240s xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --rendering-method gl_compatibility --audio-driver Dummy --resolution 1280x720 --script res://game/tests/grand_place_north_east_owner_attribution_witness_test.gd -- /tmp/grand-place-north-east-owner-attribution 2>&1 | tee /tmp/grand-place-owner-attribution.log
          status=${PIPESTATUS[0]}
          test "$status" -eq 0
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_NORTH_EAST_OWNER_ATTRIBUTION_FAIL" /tmp/grand-place-owner-attribution.log; then exit 1; fi
          grep -F "GRAND_PLACE_NORTH_EAST_OWNER_ATTRIBUTION_OK" /tmp/grand-place-owner-attribution.log
          test "$(find /tmp/grand-place-north-east-owner-attribution -maxdepth 1 -name '*.png' | wc -l)" = "24"

      - name: Measure owner-visible pixel contribution and seal manifest
        shell: bash
        run: |
          set -euo pipefail
          export GP_HEAD_SHA="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          test -n "${GP_VALIDATED_BASE_SHA:-}"
          test "$CURRENT_MAIN_SHA" = "$GP_VALIDATED_BASE_SHA"
          test "$(git merge-base HEAD "$CURRENT_MAIN_SHA")" = "$CURRENT_MAIN_SHA"
          export GP_BASE_SHA="$GP_VALIDATED_BASE_SHA"
          EVIDENCE=/tmp/grand-place-north-east-owner-attribution
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, struct, subprocess
          evidence = pathlib.Path('/tmp/grand-place-north-east-owner-attribution')
          capture_manifest = json.loads((evidence/'capture_manifest.json').read_text())
          owner_ids = capture_manifest['owner_ids']
          if capture_manifest.get('schema') != 'grand-place-north-east-owner-attribution-witness-v2':
              raise SystemExit('capture manifest schema drifted')
          if capture_manifest.get('source_owner_set_exact') is not True:
              raise SystemExit('source/runtime owner set crosswalk was not proven')
          if capture_manifest.get('dedicated_owner_ids') != ['1655673', '1786758']:
              raise SystemExit('dedicated owner identity drifted')
          if len(owner_ids) != 23 or len(set(owner_ids)) != 23:
              raise SystemExit('owner identity set drifted')
          if {'1655673', '1786758'} & set(owner_ids):
              raise SystemExit('dedicated owner leaked into neutral contour attribution')
          def png_size(path):
              with path.open('rb') as f:
                  if f.read(8) != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'not PNG: {path}')
                  length = struct.unpack('>I', f.read(4))[0]
                  kind = f.read(4)
                  if kind != b'IHDR' or length != 13: raise SystemExit(f'bad IHDR: {path}')
                  return struct.unpack('>II', f.read(8))
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          baseline = evidence/'baseline.png'
          if png_size(baseline) != (1280,720): raise SystemExit('baseline dimensions drifted')
          rows=[]
          for owner_id in owner_ids:
              variant=evidence/f'without_{owner_id}.png'
              if png_size(variant) != (1280,720): raise SystemExit(f'variant dimensions drifted {owner_id}')
              p=subprocess.run(['compare','-metric','AE',str(baseline),str(variant),'null:'],text=True,capture_output=True)
              metric=(p.stderr or p.stdout).strip().splitlines()[-1].strip()
              m=re.match(r'^([0-9]+(?:\.[0-9]+)?)',metric)
              if not m: raise SystemExit(f'cannot parse AE metric owner={owner_id}: {metric!r}')
              changed=int(float(m.group(1)))
              rows.append({'owner_id':owner_id,'changed_pixels':changed,'changed_ratio':changed/(1280*720),'variant_sha256':sha(variant)})
          rows.sort(key=lambda r:(-r['changed_pixels'],r['owner_id']))
          source_dir=pathlib.Path('grand-bruxelles-game/data/urbis/grand_place_lod2')
          source_hashes={p.stem.removesuffix('.game'):sha(p) for p in sorted(source_dir.glob('*.game.json'))}
          if len(source_hashes)!=25: raise SystemExit('source owner set drifted')
          source_ids=sorted(source_hashes)
          expected_neutral=[owner_id for owner_id in source_ids if owner_id not in {'1655673','1786758'}]
          if sorted(owner_ids) != expected_neutral:
              raise SystemExit('captured neutral owner set does not exactly equal 25-source set minus dedicated owners')
          top_changed = rows[0]['changed_pixels'] if rows else 0
          attributable = top_changed > 0
          zero_contribution_count = sum(1 for row in rows if row['changed_pixels'] == 0)
          result={
            'schema':'grand-place-north-east-owner-attribution-v2',
            'base_sha':os.environ['GP_BASE_SHA'],'head_sha':os.environ['GP_HEAD_SHA'],'exact_main_stable':True,
            'godot_version':os.environ['GODOT_VERSION'],'camera':capture_manifest['camera'],'fov':capture_manifest['fov'],
            'resolution':capture_manifest['resolution'],'target':capture_manifest['target'],'source_owner_count':25,'contour_owner_count':23,
            'dedicated_owner_ids':['1655673','1786758'],'source_owner_set_exact':True,
            'baseline_sha256':sha(baseline),'source_sha256':source_hashes,'ranking':rows,
            'attributable_to_neutral_contour':attributable,'zero_contribution_owner_count':zero_contribution_count,
            'dynamic_state_frozen':True,'human_full_frame_review_required':True,'visual_acceptance':False,'jouable_authorized':False
          }
          (evidence/'owner_attribution_manifest.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          top_owner = rows[0]['owner_id'] if rows else 'none'
          print('GRAND_PLACE_NORTH_EAST_OWNER_ATTRIBUTION_MEASURED top_owner=%s changed_pixels=%d attributable_to_neutral_contour=%s zero_contribution_owner_count=%d exact_main_stable=true visual_acceptance=false jouable_authorized=false' % (top_owner,top_changed,str(attributable).lower(),zero_contribution_count))
          PY
          cp /tmp/grand-place-owner-attribution.log "$EVIDENCE/"
          cp /tmp/grand-place-owner-attribution-import.log "$EVIDENCE/"

      - name: Upload exact attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-north-east-owner-attribution
          path: /tmp/grand-place-north-east-owner-attribution/
          if-no-files-found: error
