name: Grand Bruxelles Grand-Place Official Contour Runtime Accounting

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-official-contour-runtime-accounting.yml"
      - "grand-bruxelles-game/game/tests/grand_place_official_contour_runtime_accounting_test.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_contour_runtime.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/**"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-official-contour-runtime-accounting-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  runtime-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-official-contour-runtime-accounting-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-official-contour-runtime-accounting-import.log; then exit 1; fi
      - name: Prove exact runtime owner/collision/triangle accounting
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_official_contour_runtime_accounting_test.gd 2>&1 | tee /tmp/grand-place-official-contour-runtime-accounting.log
          grep -F "GRAND_PLACE_OFFICIAL_CONTOUR_RUNTIME_ACCOUNTING_OK" /tmp/grand-place-official-contour-runtime-accounting.log
      - name: Upload exact-head runtime accounting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-official-contour-runtime-accounting-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/grand-place-official-contour-runtime-accounting-import.log
            /tmp/grand-place-official-contour-runtime-accounting.log
          if-no-files-found: error
          retention-days: 14
