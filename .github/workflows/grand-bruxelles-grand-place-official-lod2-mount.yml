name: Grand Bruxelles Grand-Place Official LoD2 Mount

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1786758.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1786758.game.json"
      - "grand-bruxelles-game/tests/test_grand_place_official_lod2_mount_contract.py"
      - ".github/workflows/grand-bruxelles-grand-place-official-lod2-mount.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-grand-place-official-lod2-mount-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  official-lod2-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove official LoD2 production mount and source chain
        run: python grand-bruxelles-game/tests/test_grand_place_official_lod2_mount_contract.py
