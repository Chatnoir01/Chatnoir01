name: Grand Bruxelles Grand-Place Paving Collision

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-paving-collision.yml"
      - "grand-bruxelles-game/game/scripts/grand_place_granite_paving.gd"
      - "grand-bruxelles-game/game/tests/grand_place_paving_collision_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paving-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-paving-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-paving-import.log; then exit 1; fi
      - name: Prove official paving collision
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_paving_collision_test.gd 2>&1 | tee /tmp/grand-place-paving-collision.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_PAVING_COLLISION_FAIL" /tmp/grand-place-paving-collision.log; then exit 1; fi
          grep -F "GRAND_PLACE_PAVING_COLLISION_OK" /tmp/grand-place-paving-collision.log
