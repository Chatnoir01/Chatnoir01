name: Grand Bruxelles Grand-Place Post-783 Owner Audit

on:
  push:
    branches:
      - "qa/grand-place-post783-central-owner-*"
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-post783-owner.yml"
      - "grand-bruxelles-game/data/qa/grand_place_post783_owner_candidates.json"
      - "grand-bruxelles-game/game/tests/grand_place_post783_owner_audit_test.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-post783-owner.yml"
      - "grand-bruxelles-game/data/qa/grand_place_post783_owner_candidates.json"
      - "grand-bruxelles-game/game/tests/grand_place_post783_owner_audit_test.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post783-owner-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/post783-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/post783-import.log; then exit 1; fi
      - name: Measure post-783 canonical screen owners
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/grand_place_post783_owner_audit_test.gd 2>&1 | tee /tmp/post783-owner.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_POST783_OWNER_FAIL" /tmp/post783-owner.log; then exit 1; fi
          grep -q "GRAND_PLACE_POST783_OWNER_OK" /tmp/post783-owner.log
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-post783-owner-audit
          path: grand-bruxelles-game/artifacts/qa/grand_place_post783_owner_audit.json
          if-no-files-found: error
