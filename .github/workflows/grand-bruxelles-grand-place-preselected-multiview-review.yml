name: Grand Bruxelles Grand-Place Preselected Multiview Review

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/grand_place_complete_contour_preselected_multiview_review.json"
      - "grand-bruxelles-game/game/tests/grand_place_complete_contour_preselected_multiview_review_contract_test.py"
      - ".github/workflows/grand-bruxelles-grand-place-preselected-multiview-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preselected-review-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned owner-review receipt
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/grand_place_complete_contour_preselected_multiview_review_contract_test.py | tee /tmp/gp-preselected-review.log
          grep -F "GRAND_PLACE_PRESELECTED_MULTIVIEW_REVIEW_OK overall=REJECT rejected=q1_selected,q2_selected visual_acceptance=false jouable_authorized=false" /tmp/gp-preselected-review.log
