name: Grand Bruxelles Grand-Place Remaining Wall Faces

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-remaining-wall-faces.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_remaining_wall_faces.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_remaining_wall_faces_test.gd"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_town_hall_right_gallery_runtime.gd"
  push:
    branches:
      - "qa/grand-place-remaining-wall-faces-*"
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-remaining-wall-faces.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_remaining_wall_faces.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_remaining_wall_faces_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remaining-wall-face-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/remaining-wall-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/remaining-wall-import.log; then exit 1; fi
      - name: Rank remaining official Town Hall wall groups from canonical player camera
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_remaining_wall_faces_test.gd 2>&1 | tee /tmp/remaining-wall.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_REMAINING_WALL_FACES_FAIL" /tmp/remaining-wall.log; then exit 1; fi
          grep -q "GRAND_PLACE_REMAINING_WALL_FACES_OK" /tmp/remaining-wall.log
      - name: Upload remaining-wall evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-remaining-wall-faces
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_remaining_wall_faces.json
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_remaining_wall_baseline.png
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_remaining_wall_winner.png
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_remaining_wall_runner_up.png
          if-no-files-found: error
