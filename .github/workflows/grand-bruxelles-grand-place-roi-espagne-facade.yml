name: Grand Bruxelles Grand-Place Roi Espagne Facade

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/grand_place_roi_espagne_facade_rhythm.json"
      - "grand-bruxelles-game/game/scripts/grand_place_roi_espagne_facade_rhythm_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_roi_espagne_facade_rhythm_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_roi_espagne_facade_rhythm_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-grand-place-roi-espagne-facade.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Roi d'Espagne source and structure gate
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_roi_espagne_facade_rhythm_test.gd 2>&1 | tee /tmp/structure.log
          if grep -E "SCRIPT ERROR|Parse Error:|ROI_ESPAGNE_FACADE_RHYTHM_FAIL" /tmp/structure.log; then exit 1; fi
          grep -q "ROI_ESPAGNE_FACADE_RHYTHM_OK" /tmp/structure.log
      - name: Roi d'Espagne deterministic player-exposure A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/grand_place_roi_espagne_facade_rhythm_witness_test.gd 2>&1 | tee /tmp/witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|ROI_ESPAGNE_FACADE_WITNESS_FAIL" /tmp/witness.log; then exit 1; fi
          grep -q "ROI_ESPAGNE_FACADE_WITNESS_OK" /tmp/witness.log
      - name: Upload Roi d'Espagne A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: roi-espagne-facade-ab
          path: |
            grand-bruxelles-game/artifacts/visual/roi_espagne_facade_before.png
            grand-bruxelles-game/artifacts/visual/roi_espagne_facade_after.png
          if-no-files-found: error
