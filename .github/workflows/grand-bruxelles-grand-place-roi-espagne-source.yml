name: Grand Bruxelles Grand-Place Roi Espagne Source

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-roi-espagne-source.yml"
      - "grand-bruxelles-game/tools/extract_urbis_3d_context.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve City record to official UrbIS building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/roi/extracted
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          CITY_API = 'https://opendata.brussels.be/api/explore/v2.1/catalog/datasets/description-des-batiments-de-la-grand-place/records?limit=100'
          req = urllib.request.Request(CITY_API, headers={'User-Agent':'Grand-Bruxelles-Game/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=90) as r:
              city = json.loads(r.read().decode('utf-8'))
          rows = [r for r in city.get('results', []) if str(r.get('nom','')).strip() == "Le Roi d'Espagne"]
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one Le Roi d\'Espagne City record, got {len(rows)}')
          rec = rows[0]
          gp = rec.get('geo_point') or {}
          if not isinstance(gp, dict) or 'lon' not in gp or 'lat' not in gp:
              raise SystemExit('City record missing geo_point')
          Path('/tmp/roi/city_record.json').write_text(json.dumps(rec, ensure_ascii=False, indent=2)+'\n')

          lon=float(gp['lon']); lat=float(gp['lat']); pad=0.00035
          bbox=(lon-pad,lat-pad,lon+pad,lat+pad)
          params={
              'service':'WFS','version':'2.0.0','request':'GetFeature',
              'typeNames':'urbisvector:Buildings','outputFormat':'application/json',
              'srsName':'EPSG:4326','bbox':f'{bbox[0]},{bbox[1]},{bbox[2]},{bbox[3]},EPSG:4326'
          }
          url='https://geoservices-urbis.irisnet.be/geoserver/urbisvector/wfs?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Grand-Bruxelles-Game/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r:
              fc=json.loads(r.read().decode('utf-8'))
          Path('/tmp/roi/urbis_buildings.geojson').write_text(json.dumps(fc, ensure_ascii=False)+'\n')

          def point_in_ring(x,y,ring):
              inside=False; pts=[p for p in ring if isinstance(p,list) and len(p)>=2]
              if len(pts)<3:return False
              j=len(pts)-1
              for i in range(len(pts)):
                  xi,yi=float(pts[i][0]),float(pts[i][1]); xj,yj=float(pts[j][0]),float(pts[j][1])
                  if ((yi>y)!=(yj>y)) and x < (xj-xi)*(y-yi)/((yj-yi) or 1e-30)+xi:
                      inside=not inside
                  j=i
              return inside
          def contains(geom,x,y):
              if not geom:return False
              typ=geom.get('type'); c=geom.get('coordinates',[])
              polys=[c] if typ=='Polygon' else c if typ=='MultiPolygon' else []
              for poly in polys:
                  if poly and point_in_ring(x,y,poly[0]) and not any(point_in_ring(x,y,h) for h in poly[1:]):
                      return True
              return False
          def bid(feature):
              props=feature.get('properties') or {}
              for v in (props.get('INSPIRE_ID'),props.get('ID'),feature.get('id')):
                  if v is None:continue
                  tail=str(v).rstrip('/').split('/')[-1].split('.')[-1]
                  if tail.isdigit():return tail
              return ''

          hits=[]
          for f in fc.get('features',[]):
              if contains(f.get('geometry'),lon,lat):
                  value=bid(f)
                  if value:hits.append(value)
          hits=sorted(set(hits), key=int)
          if len(hits)!=1:
              raise SystemExit(f'expected one containing UrbIS building, got {hits}')
          out={
              'schema':'grand-bruxelles-grand-place-roi-espagne-source-resolution-v1',
              'city_dataset':'description-des-batiments-de-la-grand-place',
              'city_name':rec.get('nom'),'city_address':rec.get('adresse'),'city_id':rec.get('id'),
              'city_height_m':rec.get('hauteur_totale'),'geo_point':gp,
              'heritage_record':'Urban 31119','building_id':hits[0],
              'runtime_approved':False,'realism_complete':False
          }
          Path('/tmp/roi/resolution.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/roi/id.txt').write_text(hits[0]+'\n')
          print('ROI_ESPAGNE_RESOLVED',json.dumps(out,ensure_ascii=False))
          PY

      - name: Download audited UrbIS Buildings3D package
        shell: bash
        run: |
          set -euo pipefail
          URL="https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip"
          EXPECTED="cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2"
          curl -fL --retry 3 --retry-delay 3 -o /tmp/urbis3d.zip "$URL"
          echo "$EXPECTED  /tmp/urbis3d.zip" | sha256sum -c -
          mkdir -p /tmp/urbis3d
          unzip -q /tmp/urbis3d.zip -d /tmp/urbis3d
          FACE="$(find /tmp/urbis3d -type f -name 'UrbISBuildings3D_148170_BuildingFaces.shp' -print -quit)"
          test -n "$FACE"
          dirname "$FACE" > /tmp/source_root.txt

      - name: Extract exact LoD2 hero
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source_root.txt)"
          ID="$(cat /tmp/roi/id.txt)"
          python3 grand-bruxelles-game/tools/extract_urbis_3d_context.py \
            --source-root "$ROOT" --prefix UrbISBuildings3D_148170 \
            --building-id "https://databrussels.be/id/building/$ID" \
            --context-id "grand_place_roi_espagne_$ID" --name "Grand-Place Le Roi d'Espagne $ID" \
            --package-url "https://urbisdownload.datastore.brussels/UrbIS/Vector/M8/UrbIS-Buildings3D/SHP/UrbISBuildings3D_31370_SHP_148170_20260808.zip" \
            --package-sha256 "cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2" \
            --package-revision "2026-08-08" --accessed-at "2026-08-17" \
            --origin-e 147868.29422791934 --origin-n 169538.62414926197 --world-x -668.5 --world-z 627.84 \
            --output "/tmp/roi/extracted/$ID.game.json"
          python3 - <<'PY'
          import json, pathlib
          p=next(pathlib.Path('/tmp/roi/extracted').glob('*.game.json'))
          d=json.loads(p.read_text()); ev=d['evidence']; b=ev['source_bbox_xy']
          summary={
              'schema':'grand-bruxelles-grand-place-roi-espagne-lod2-summary-v1',
              'building_id':p.stem.replace('.game',''),
              'width_m':round(b[2]-b[0],3),'depth_m':round(b[3]-b[1],3),'height_m':ev['height_m'],
              'faces':ev['face_count'],'triangles':ev['triangle_count'],'face_types':ev['face_type_counts'],
              'source_bbox_epsg31370':b,'runtime_approved':False,'realism_complete':False
          }
          pathlib.Path('/tmp/roi/lod2_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print('ROI_ESPAGNE_LOD2',json.dumps(summary))
          PY

      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-roi-espagne-source
          path: /tmp/roi
          if-no-files-found: error
