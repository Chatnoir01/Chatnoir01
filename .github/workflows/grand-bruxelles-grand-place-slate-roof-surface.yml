name: Grand Bruxelles Grand-Place Slate Roof Surface

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-slate-roof-surface.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/brussels_slate_roof_material.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_slate_roof_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_slate_roof_surface_runtime_test.gd"
      - "grand-bruxelles-game/data/visual/grand_place_1655673_roof_material_identity.json"
      - "grand-bruxelles-game/data/visual/grand_place_1786758_roof_material_identity.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slate-roof-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed slate roof surface and A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_slate_roof_surface_runtime_test.gd 2>&1 | tee /tmp/grand-place-slate-roof-surface.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_SLATE_ROOF_SURFACE_FAIL" /tmp/grand-place-slate-roof-surface.log; then exit 1; fi
          grep -F "GRAND_PLACE_SLATE_ROOF_SURFACE_OK" /tmp/grand-place-slate-roof-surface.log
          test -f grand-bruxelles-game/artifacts/grand-place/slate-roof-surface-runtime/before.png
          test -f grand-bruxelles-game/artifacts/grand-place/slate-roof-surface-runtime/after.png
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-slate-roof-surface-evidence
          path: |
            grand-bruxelles-game/artifacts/grand-place/slate-roof-surface-runtime/before.png
            grand-bruxelles-game/artifacts/grand-place/slate-roof-surface-runtime/after.png
            /tmp/grand-place-slate-roof-surface.log
          if-no-files-found: error
