name: Grand Bruxelles Grand-Place Town Hall Cross Windows

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-town-hall-window-cross.yml"
      - "grand-bruxelles-game/game/scripts/grand_place_town_hall_window_rhythm_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_window_cross_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_window_cross_ab_test.gd"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/game/scripts/brussels_white_stone_material.gd"
  push:
    branches:
      - "feat/grand-place-town-hall-cross-windows-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-window-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/cross-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/cross-import.log; then exit 1; fi
      - name: Validate source-backed cross-window contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_window_cross_test.gd

  cross-window-player-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/cross-ab-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/cross-ab-import.log; then exit 1; fi
      - name: Run canonical clean player A-B
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --resolution 1280x720 --script res://game/tests/grand_place_town_hall_window_cross_ab_test.gd 2>&1 | tee /tmp/cross-ab.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWN_HALL_WINDOW_CROSS_AB_FAIL" /tmp/cross-ab.log; then exit 1; fi
          grep -q "GRAND_PLACE_TOWN_HALL_WINDOW_CROSS_AB_OK" /tmp/cross-ab.log
      - name: Upload full-frame cross-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-town-hall-window-cross-ab
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_window_cross_before.png
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_window_cross_after.png
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_window_cross.json
          if-no-files-found: error
