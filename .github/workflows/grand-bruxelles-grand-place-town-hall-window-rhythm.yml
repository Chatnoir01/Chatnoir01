name: Grand Bruxelles Grand-Place Town Hall Window Rhythm

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-town-hall-window-rhythm.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/grand_place_town_hall_window_rhythm_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_window_rhythm_test.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_window_rhythm_ab_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  town-hall-window-rhythm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/town-hall-window-rhythm-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/town-hall-window-rhythm-import.log; then exit 1; fi
      - name: Validate source-counted articulation contract
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_window_rhythm_test.gd
      - name: Render deterministic player-eye A/B
        run: xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_window_rhythm_ab_test.gd
      - name: Upload player-eye evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-town-hall-window-rhythm-ab
          path: |
            /tmp/grand-place-town-hall-window-rhythm-before.png
            /tmp/grand-place-town-hall-window-rhythm-after.png
          if-no-files-found: error
