name: Grand Bruxelles Grand Place Town Hall Slate Roof Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-townhall-slate-roof-visual.yml"
      - "grand-bruxelles-game/data/visual/grand_place_1655673_roof_identity.json"
      - "grand-bruxelles-game/game/scripts/brussels_slate_roof_material.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/tests/grand_place_townhall_slate_roof_visual_test.gd"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/visual/grand_place_1655673_roof_identity.json'
          d=json.load(open(p))
          assert d['target']['urbis_building_id']=='https://databrussels.be/id/building/1655673'
          assert d['material_identity_source']['record']=='Hotel de ville, Grand-Place 8, Urban 31125'
          assert d['material_identity_source']['fact']=='vast slate gable roof pierced by four rows of hipped dormers'
          assert d['presentation_contract']['applies_to']=='ROOFSURFACE only'
          assert d['presentation_contract']['geometry_changed'] is False
          assert d['presentation_contract']['dormers_authored'] is False
          assert d['presentation_contract']['exact_rgb_is_photometric_measurement'] is False
          print('GRAND_PLACE_TOWNHALL_SLATE_SOURCE_OK')
          PY
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic Town Hall roof A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_townhall_slate_roof_visual_test.gd 2>&1 | tee /tmp/grand-place-townhall-slate.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWNHALL_SLATE_ROOF_FAIL" /tmp/grand-place-townhall-slate.log; then exit 1; fi
          grep -F "GRAND_PLACE_TOWNHALL_SLATE_ROOF_OK" /tmp/grand-place-townhall-slate.log
          test -f grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/before.png
          test -f grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/after.png
      - name: Enforce anti-micro pixel gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/before.png').convert('RGB')
          b=Image.open('grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/after.png').convert('RGB')
          pa=list(a.getdata()); pb=list(b.getdata())
          changed=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>3)
          ratio=changed/(1280*720)
          print(f'GRAND_PLACE_TOWNHALL_SLATE_ROOF_PIXEL_GATE changed={changed} ratio={ratio:.6f}')
          if changed < 14000 or ratio < 0.015:
              raise SystemExit('anti-micro gate failed: slate roof is not visible enough at normal witness distance')
          PY
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-townhall-slate-roof-visual
          path: |
            grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/before.png
            grand-bruxelles-game/artifacts/grand-place/townhall-slate-roof/after.png
            /tmp/grand-place-townhall-slate.log
          if-no-files-found: error
