name: Grand Bruxelles Grand Place Town Hall White Stone Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-grand-place-townhall-white-stone-visual.yml"
      - "grand-bruxelles-game/data/visual/grand_place_1655673_material_identity.json"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/tests/grand_place_townhall_white_stone_visual_test.gd"
      - "grand-bruxelles-game/project.godot"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked material provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/visual/grand_place_1655673_material_identity.json'
          d=json.load(open(p))
          assert d['target']['urbis_building_id']=='https://databrussels.be/id/building/1655673'
          assert d['geometry_source']['package_sha256']=='cf8449d1a62b0e47aafe6d715ff6a2739f5c48f6d75995f7f418305a5d6cf3d2'
          assert d['material_identity_source']['record']=='Hotel de ville, Grand-Place 8, Urban 31125'
          assert d['presentation_contract']['applies_to']=='WALLSURFACE only'
          assert d['presentation_contract']['roof_unchanged'] is True
          assert d['presentation_contract']['exact_rgb_is_photometric_measurement'] is False
          assert d['presentation_contract']['geometry_changed'] is False
          assert d['presentation_contract']['runtime_approved'] is False
          assert d['presentation_contract']['realism_complete'] is False
          print('GRAND_PLACE_TOWNHALL_MATERIAL_SOURCE_OK')
          PY
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic Grand-Place Town Hall material A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/grand_place_townhall_white_stone_visual_test.gd 2>&1 | tee /tmp/grand-place-townhall-white-stone.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWNHALL_WHITE_STONE_FAIL" /tmp/grand-place-townhall-white-stone.log; then exit 1; fi
          grep -F "GRAND_PLACE_TOWNHALL_WHITE_STONE_OK" /tmp/grand-place-townhall-white-stone.log
          test -f grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/before.png
          test -f grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/after.png
      - name: Enforce anti-micro pixel gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/before.png').convert('RGB')
          b=Image.open('grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/after.png').convert('RGB')
          assert a.size==(1280,720) and b.size==a.size
          pa=list(a.getdata()); pb=list(b.getdata())
          changed=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>3)
          ratio=changed/(1280*720)
          print(f'GRAND_PLACE_TOWNHALL_WHITE_STONE_PIXEL_GATE changed={changed} ratio={ratio:.6f}')
          if changed < 30000 or ratio < 0.03:
              raise SystemExit('anti-micro gate failed: sourced Town Hall wall material is not visually substantive')
          PY
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-townhall-white-stone-visual
          path: |
            grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/before.png
            grand-bruxelles-game/artifacts/grand-place/townhall-white-stone/after.png
            /tmp/grand-place-townhall-white-stone.log
          if-no-files-found: error
