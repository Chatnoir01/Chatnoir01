name: Grand Bruxelles Ground Network Official Coverage

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/playable_zone_catalog.json'
      - 'grand-bruxelles-game/game/scripts/brussels_ground_network_coverage.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_ground_network_official_material.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_road_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_sidewalk_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_rail_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_ground_network_official_coverage_test.gd'
      - '.github/workflows/grand-bruxelles-ground-network-official-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-official-ground-network-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject parse errors
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/ground-network-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/ground-network-import.log; then exit 1; fi
      - name: Prove seven-zone source-backed coverage contract
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_ground_network_official_coverage_test.gd 2>&1 | tee /tmp/ground-network-coverage.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BRUSSELS_GROUND_NETWORK_OFFICIAL_COVERAGE_FAIL' /tmp/ground-network-coverage.log; then exit 1; fi
          grep -F 'BRUSSELS_GROUND_NETWORK_OFFICIAL_COVERAGE_OK' /tmp/ground-network-coverage.log
