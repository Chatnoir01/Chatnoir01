name: Grand Bruxelles Historic Shopfront Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-historic-shopfront-visual.yml"
      - "grand-bruxelles-game/game/scripts/brussels_historic_shopfront.gd"
      - "grand-bruxelles-game/game/tests/brussels_historic_shopfront_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_historic_shopfront_witness_test.gd"
      - "grand-bruxelles-game/data/provenance/brussels_historic_shopfront.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historic-shopfront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate reusable shopfront vocabulary
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/brussels_historic_shopfront_test.gd 2>&1 | tee /tmp/historic-shopfront.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_HISTORIC_SHOPFRONT_FAIL" /tmp/historic-shopfront.log; then exit 1; fi
          grep -F "BRUSSELS_HISTORIC_SHOPFRONT_OK" /tmp/historic-shopfront.log
      - name: Capture production-scene witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/brussels_historic_shopfront_witness_test.gd 2>&1 | tee /tmp/historic-shopfront-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_HISTORIC_SHOPFRONT_WITNESS_FAIL" /tmp/historic-shopfront-witness.log; then exit 1; fi
          grep -F "BRUSSELS_HISTORIC_SHOPFRONT_WITNESS_OK" /tmp/historic-shopfront-witness.log
          test -f grand-bruxelles-game/artifacts/visual/brussels_historic_shopfront_witness.png
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: historic-shopfront-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_historic_shopfront_witness.png
            /tmp/historic-shopfront.log
            /tmp/historic-shopfront-witness.log
          if-no-files-found: error
