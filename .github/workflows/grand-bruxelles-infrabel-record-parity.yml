name: Grand Bruxelles Infrabel Record Parity

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json"
      - ".github/workflows/grand-bruxelles-infrabel-record-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-record-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          measurement = json.loads(Path('grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json').read_text())
          live = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          base = subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          expected = 'aa7593d1b03dbc452db59194f6a94e4d984af454'
          assert live == expected, f'live main drift: expected={expected} live={live}'
          assert base == expected, f'branch base drift: expected={expected} merge_base={base}'
          assert measurement['source_registration_authorized'] is False
          print('INFRABEL_PARITY_EXACT_BASE_OK', live)
          PY

      - name: Audit publisher accounting against locked Lambert72 IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infrabel-parity"
          python3 - <<'PY'
          import csv, hashlib, io, json, os, sys, time, urllib.parse, urllib.request
          from collections import Counter
          from pathlib import Path

          measurement = json.loads(Path('grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json').read_text())
          out = Path(os.environ['RUNNER_TEMP']) / 'infrabel-parity'
          user_agent = 'GrandBruxellesGame-InfrabelRecordParity/1.1'

          def get_bytes(url, accept='*/*', timeout=240, retries=4):
              last = None
              for attempt in range(retries):
                  req = urllib.request.Request(url, headers={'User-Agent':user_agent,'Accept':accept})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read(), dict(response.headers)
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < retries:
                          time.sleep(min(2 ** (attempt + 1), 8))
              raise RuntimeError(f'GET failed: {url}: {last}')

          locked_source = measurement['source']
          payload, _ = get_bytes(locked_source['url'])
          payload_sha = hashlib.sha256(payload).hexdigest()
          assert payload_sha == locked_source['sha256'], (payload_sha, locked_source['sha256'])
          source = json.loads(payload)
          assert source.get('type') == 'FeatureCollection'
          features = source.get('features') or []
          assert len(features) == locked_source['feature_count']

          source_ids = []
          for feature in features:
              props = feature.get('properties') or {}
              value = props.get('ID')
              assert value is not None and str(value).strip(), 'Lambert72 feature missing ID'
              source_ids.append(str(value).strip())
          source_counts = Counter(source_ids)
          source_unique = set(source_counts)
          source_set_sha = hashlib.sha256(('\n'.join(sorted(source_unique))+'\n').encode()).hexdigest()
          assert len(source_unique) == locked_source['unique_segment_id_count']
          assert all(count == 1 for count in source_counts.values())
          assert source_set_sha == locked_source['segment_id_set_sha256']

          # Explore API records pagination is capped at offset+limit < 10000.
          # The publisher export endpoint has no such record limit, so use it
          # strictly as an accounting witness, never as canonical geometry.
          base = measurement['metadata_api'].rstrip('/')
          export_url = base + '/exports/csv?' + urllib.parse.urlencode({
              'select':'id,geo_shape',
              'use_labels':'false',
              'delimiter':',',
              'with_bom':'false',
              'timezone':'UTC',
          })
          csv_bytes, csv_headers = get_bytes(export_url, accept='text/csv,*/*')
          (out/'publisher-accounting.csv').write_bytes(csv_bytes)
          text = csv_bytes.decode('utf-8-sig')
          # geo_shape can legitimately contain very large serialized geometries.
          # Raise only the parser capacity; all accounting/provenance checks below remain fail-closed.
          csv.field_size_limit(min(sys.maxsize, 256 * 1024 * 1024))
          reader = csv.DictReader(io.StringIO(text))
          assert reader.fieldnames, 'publisher accounting CSV has no header'
          normalized = {name.strip().casefold(): name for name in reader.fieldnames}
          id_field = normalized.get('id')
          geo_field = normalized.get('geo_shape')
          assert id_field, f'id field absent from accounting export: {reader.fieldnames}'
          assert geo_field, f'geo_shape field absent from accounting export: {reader.fieldnames}'
          rows = list(reader)

          expected_records = int(measurement['publisher_metadata']['records_count'])
          assert len(rows) == expected_records, (len(rows), expected_records)

          api_ids = []
          geometry_ids = []
          null_id_rows = []
          no_geometry_ids = []
          for index, row in enumerate(rows):
              raw_id = row.get(id_field)
              segment_id = None if raw_id is None else str(raw_id).strip()
              if not segment_id:
                  null_id_rows.append(index)
                  continue
              api_ids.append(segment_id)
              raw_geo = row.get(geo_field)
              if raw_geo is None or not str(raw_geo).strip() or str(raw_geo).strip().casefold() in {'null','none'}:
                  no_geometry_ids.append(segment_id)
              else:
                  geometry_ids.append(segment_id)

          api_counts = Counter(api_ids)
          api_unique = set(api_counts)
          geometry_counts = Counter(geometry_ids)
          geometry_unique = set(geometry_counts)
          duplicate_id_extra_rows = sum(count - 1 for count in api_counts.values() if count > 1)
          duplicate_ids = sorted(value for value,count in api_counts.items() if count > 1)
          missing_from_lambert = sorted(api_unique - source_unique)
          extra_in_lambert = sorted(source_unique - api_unique)
          geometry_missing_from_lambert = sorted(geometry_unique - source_unique)
          source_missing_from_geometry = sorted(source_unique - geometry_unique)

          def digest(values):
              return hashlib.sha256(('\n'.join(values)+'\n').encode()).hexdigest() if values else hashlib.sha256(b'').hexdigest()

          delta = len(rows) - len(features)
          non_geometric_relation = (
              not null_id_rows
              and len(no_geometry_ids) == delta
              and len(geometry_ids) == len(features)
              and all(count == 1 for count in geometry_counts.values())
              and geometry_unique == source_unique
          )
          duplicate_relation = (
              not null_id_rows
              and not missing_from_lambert
              and not extra_in_lambert
              and duplicate_id_extra_rows == delta
          )

          relation = 'UNEXPLAINED'
          if non_geometric_relation:
              relation = 'EXACT_NON_GEOMETRIC_ROWS_OMITTED_FROM_LAMBERT72_EXPORT'
          elif duplicate_relation:
              relation = 'EXACT_DUPLICATE_ID_ROWS_COLLAPSED_IN_LAMBERT72_EXPORT'

          report = {
              'schema':'grand-bruxelles-infrabel-track-segments-record-parity-v1',
              'dataset_id':measurement['dataset_id'],
              'accounting_export_url':export_url,
              'accounting_export_sha256':hashlib.sha256(csv_bytes).hexdigest(),
              'accounting_export_bytes':len(csv_bytes),
              'accounting_export_last_modified':csv_headers.get('Last-Modified'),
              'locked_source_url':locked_source['url'],
              'locked_source_sha256':payload_sha,
              'publisher_record_count':len(rows),
              'lambert72_feature_count':len(features),
              'record_minus_feature_delta':delta,
              'api_id_row_count':len(api_ids),
              'api_unique_id_count':len(api_unique),
              'api_duplicate_id_extra_rows':duplicate_id_extra_rows,
              'api_duplicate_id_count':len(duplicate_ids),
              'api_duplicate_ids_sha256':digest(duplicate_ids),
              'api_null_id_row_count':len(null_id_rows),
              'api_geometry_row_count':len(geometry_ids),
              'api_no_geometry_row_count':len(no_geometry_ids),
              'api_no_geometry_ids_sha256':digest(sorted(no_geometry_ids)),
              'api_id_set_missing_from_lambert_count':len(missing_from_lambert),
              'api_id_set_missing_from_lambert_sha256':digest(missing_from_lambert),
              'lambert_id_set_missing_from_api_count':len(extra_in_lambert),
              'lambert_id_set_missing_from_api_sha256':digest(extra_in_lambert),
              'geometry_id_set_missing_from_lambert_count':len(geometry_missing_from_lambert),
              'lambert_id_set_missing_from_geometry_count':len(source_missing_from_geometry),
              'lambert72_id_set_sha256':source_set_sha,
              'accounting_relation':relation,
              'record_count_parity_proven':relation != 'UNEXPLAINED',
              'canonical_geometry_source_changed':False,
              'source_registration_authorized':False,
              'runtime_authorized':False,
              'runtime_mount_authorized':False,
              'collision_authorized':False,
              'materialization_authorized':False,
              'semantic_names_authorized':False,
              'game_world_transform_authorized':False,
              'jouable_promotion_authorized':False,
          }
          (out/'record-parity.json').write_text(json.dumps(report, indent=2, ensure_ascii=False)+'\n')
          print('INFRABEL_RECORD_PARITY', json.dumps(report, sort_keys=True))
          assert relation != 'UNEXPLAINED', report
          print('INFRABEL_RECORD_PARITY_PROVEN', relation, f'delta={delta}')
          PY

      - name: Upload parity proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-infrabel-record-parity
          path: ${{ runner.temp }}/infrabel-parity
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
