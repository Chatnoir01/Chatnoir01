name: Grand Bruxelles Infrabel Revision Alignment

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json"
      - "grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json"
      - ".github/workflows/grand-bruxelles-infrabel-record-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-revision-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          contract = json.loads(Path('grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json').read_text())
          measurement = json.loads(Path('grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json').read_text())
          expected = contract['production_base_sha']
          live = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          base = subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          assert measurement['production_base_sha'] == expected
          assert live == expected, f'live main drift: expected={expected} live={live}'
          assert base == expected, f'branch base drift: expected={expected} merge_base={base}'
          assert measurement['source_registration_authorized'] is False
          print('INFRABEL_REVISION_EXACT_BASE_OK', live)
          PY

      - name: Prove publisher snapshot revision drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infrabel-revision"
          python3 - <<'PY'
          import csv, datetime as dt, hashlib, io, json, os, re, time, urllib.parse, urllib.request
          from collections import Counter
          from pathlib import Path

          contract = json.loads(Path('grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json').read_text())
          measurement = json.loads(Path('grand-bruxelles-game/data/provenance/infrabel_track_segments_lambert72.measurement.json').read_text())
          out = Path(os.environ['RUNNER_TEMP']) / 'infrabel-revision'
          user_agent = 'GrandBruxellesGame-InfrabelRevisionAlignment/2.0'

          def get_bytes(url, accept='*/*', timeout=240, retries=4):
              last = None
              for attempt in range(retries):
                  req = urllib.request.Request(url, headers={'User-Agent':user_agent,'Accept':accept})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read(), dict(response.headers)
                  except Exception as exc:
                      last = exc
                      if attempt + 1 < retries:
                          time.sleep(min(2 ** (attempt + 1), 8))
              raise RuntimeError(f'GET failed: {url}: {last}')

          metadata_bytes, _ = get_bytes(measurement['metadata_api'], accept='application/json,*/*')
          metadata = json.loads(metadata_bytes)
          default = (metadata.get('metas') or {}).get('default') or {}
          current_records = int(default['records_count'])
          current_data_processed = str(default['data_processed'])
          assert current_records == int(measurement['publisher_metadata']['records_count'])
          assert current_data_processed == measurement['publisher_metadata']['data_processed']

          alternatives = metadata.get('alternative_exports') or []
          matches = [item for item in alternatives if isinstance(item, dict) and str(item.get('url') or '') == measurement['source']['url']]
          assert len(matches) == 1, f'locked alternative export no longer unique/present: {len(matches)}'
          title = str(matches[0].get('title') or '')
          assert title == measurement['source']['title']
          date_match = re.search(r'(20\d{6})', title)
          assert date_match, f'snapshot date missing from title: {title}'
          snapshot_date = dt.datetime.strptime(date_match.group(1), '%Y%m%d').date()
          data_date = dt.datetime.fromisoformat(current_data_processed).date()
          lag_days = (data_date - snapshot_date).days

          source_bytes, _ = get_bytes(measurement['source']['url'])
          source_sha = hashlib.sha256(source_bytes).hexdigest()
          assert source_sha == measurement['source']['sha256']
          source_obj = json.loads(source_bytes)
          features = source_obj.get('features') or []
          assert len(features) == int(measurement['source']['feature_count'])
          source_ids = [str((feature.get('properties') or {}).get('ID')).strip() for feature in features]
          assert all(value and value != 'None' for value in source_ids)
          source_counts = Counter(source_ids)
          assert len(source_counts) == len(source_ids) and all(v == 1 for v in source_counts.values())
          source_unique = set(source_counts)
          source_set_sha = hashlib.sha256(('\n'.join(sorted(source_unique))+'\n').encode()).hexdigest()
          assert source_set_sha == measurement['source']['segment_id_set_sha256']

          export_url = measurement['metadata_api'].rstrip('/') + '/exports/csv?' + urllib.parse.urlencode({'select':'id','use_labels':'false','delimiter':',','with_bom':'false','timezone':'UTC'})
          csv_bytes, csv_headers = get_bytes(export_url, accept='text/csv,*/*')
          (out/'publisher-current-ids.csv').write_bytes(csv_bytes)
          reader = csv.DictReader(io.StringIO(csv_bytes.decode('utf-8-sig')))
          assert reader.fieldnames
          id_field = next((name for name in reader.fieldnames if name.strip().casefold() == 'id'), None)
          assert id_field, f'id field absent: {reader.fieldnames}'
          current_ids = [str(row.get(id_field) or '').strip() for row in reader]
          assert len(current_ids) == current_records
          assert all(current_ids), 'current publisher export contains null IDs'
          current_counts = Counter(current_ids)
          assert len(current_counts) == len(current_ids) and all(v == 1 for v in current_counts.values())
          current_unique = set(current_counts)
          current_set_sha = hashlib.sha256(('\n'.join(sorted(current_unique))+'\n').encode()).hexdigest()
          overlap = sorted(source_unique & current_unique)
          overlap_sha = hashlib.sha256(('\n'.join(overlap)+'\n').encode()).hexdigest() if overlap else hashlib.sha256(b'').hexdigest()

          expected = measurement['revision_alignment']
          assert snapshot_date.isoformat() == expected['source_snapshot_date']
          assert data_date.isoformat() == expected['publisher_data_processed_date']
          assert lag_days == int(expected['snapshot_precedes_publisher_data_by_days'])
          assert current_set_sha == expected['publisher_current_id_set_sha256']
          assert len(overlap) == int(expected['snapshot_id_set_overlap_count']) == 0
          assert overlap_sha == expected['snapshot_id_set_overlap_sha256']
          assert min(map(int,current_unique)) == int(expected['publisher_current_id_min'])
          assert max(map(int,current_unique)) == int(expected['publisher_current_id_max'])
          assert min(map(int,source_unique)) == int(measurement['source']['segment_id_min'])
          assert max(map(int,source_unique)) == int(measurement['source']['segment_id_max'])
          assert snapshot_date < data_date
          assert measurement['status'] == 'MEASURED_HOLD_PUBLISHER_LAMBERT72_SNAPSHOT_STALE'
          assert measurement['source_registration_authorized'] is False

          report = {
              'schema':'grand-bruxelles-infrabel-track-segments-revision-alignment-v2','dataset_id':measurement['dataset_id'],
              'locked_source_url':measurement['source']['url'],'locked_source_sha256':source_sha,'locked_snapshot_date':snapshot_date.isoformat(),
              'publisher_data_processed':current_data_processed,'snapshot_precedes_publisher_data_by_days':lag_days,'publisher_current_record_count':current_records,
              'snapshot_feature_count':len(features),'record_minus_snapshot_feature_delta':current_records-len(features),'publisher_current_id_export_url':export_url,
              'publisher_current_id_export_sha256':hashlib.sha256(csv_bytes).hexdigest(),'publisher_current_id_export_bytes':len(csv_bytes),
              'publisher_current_id_export_last_modified':csv_headers.get('Last-Modified'),'publisher_current_unique_id_count':len(current_unique),
              'publisher_current_id_set_sha256':current_set_sha,'snapshot_unique_id_count':len(source_unique),'snapshot_id_set_sha256':source_set_sha,
              'snapshot_current_id_overlap_count':len(overlap),'snapshot_current_id_overlap_sha256':overlap_sha,
              'revision_relation':'PUBLISHER_LAMBERT72_ALTERNATIVE_EXPORT_PREDATES_CURRENT_DATA_PROCESSING','currentness_proven':False,
              'source_registration_authorized':False,'runtime_authorized':False,'runtime_mount_authorized':False,'collision_authorized':False,
              'materialization_authorized':False,'semantic_names_authorized':False,'game_world_transform_authorized':False,'jouable_promotion_authorized':False,
          }
          (out/'revision-alignment.json').write_text(json.dumps(report, indent=2, ensure_ascii=False)+'\n')
          print('INFRABEL_REVISION_HOLD_PROVEN',f'snapshot={snapshot_date}',f'publisher_data={data_date}',f'lag_days={lag_days}',f'current_records={current_records}',f'snapshot_features={len(features)}',f'id_overlap={len(overlap)}','registration=false')
          PY

      - name: Upload revision-alignment proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-infrabel-revision-alignment
          path: ${{ runner.temp }}/infrabel-revision
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
