name: Grand Bruxelles Intake Brussels Parking
on:
  push:
    branches: ["intake/brussels-parking-current"]
    paths: [".github/workflows/grand-bruxelles-intake-brussels-parking.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Brussels Mobility parking layers in Lambert72
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/parking
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          endpoint='https://data.mobility.brussels/geoserver/bm_parking/wfs'
          layers=['bm_parking:parking_onstreet_points','bm_parking:parking_zonereserve','bm_parking:parking_reserve']
          manifest={'publisher':'Brussels Mobility / parking.brussels','license':'CC0','crs':'EPSG:31370','files':[]}
          for layer in layers:
              q=urllib.parse.urlencode({'service':'WFS','version':'1.1.0','request':'GetFeature','typeName':layer,'outputFormat':'json','srsName':'EPSG:31370'})
              url=endpoint+'?'+q
              req=urllib.request.Request(url,headers={'User-Agent':'GrandBruxellesGame-ParkingIntake/1.0'})
              with urllib.request.urlopen(req,timeout=180) as r: body=r.read()
              obj=json.loads(body); assert obj.get('type')=='FeatureCollection', obj.keys()
              fn=layer.split(':',1)[1]+'.geojson'; path='/tmp/parking/'+fn; open(path,'wb').write(body)
              manifest['files'].append({'layer':layer,'source_url':url,'file':fn,'features':len(obj.get('features',[])),'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
          open('/tmp/parking/manifest.json','w').write(json.dumps(manifest,indent=2))
          assert sum(x['features'] for x in manifest['files'])>0
          print('BRUSSELS_PARKING_INTAKE_OK',[(x['layer'],x['features']) for x in manifest['files']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-brussels-parking
          path: /tmp/parking
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
