name: Grand Bruxelles Intake Cobblestones
on:
  push:
    branches: ["intake/brussels-cobblestones-current"]
    paths: [".github/workflows/grand-bruxelles-intake-cobblestones.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official Brussels cobblestone roads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cobblestones
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          base='https://data.mobility.brussels/geoserver/ows'; layer='bm_bike:bike_paves_ss'; headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          url=base+'?'+urllib.parse.urlencode({'service':'WFS','version':'1.1.0','request':'GetFeature','typeName':layer,'outputFormat':'json','srsName':'EPSG:31370'})
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r: raw=r.read()
          obj=json.loads(raw); count=len(obj.get('features',[])); assert count>0
          open('/tmp/cobblestones/cobblestones_epsg31370.geojson','wb').write(raw)
          open('/tmp/cobblestones/manifest.json','w').write(json.dumps({'publisher':'Bruxelles Mobilite','dataset':'Paves','layer':layer,'license':'CC0','source_url':url,'crs':'EPSG:31370','feature_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'runtime_authorized':False},indent=2,ensure_ascii=False))
          print('COBBLESTONES_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-cobblestones
          path: /tmp/cobblestones
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
