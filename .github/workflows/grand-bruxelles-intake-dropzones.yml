name: Grand Bruxelles Intake Dropzones
on:
  push:
    branches: ["intake/brussels-dropzones-current"]
    paths: [".github/workflows/grand-bruxelles-intake-dropzones.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official dropzones in Lambert72
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dropzones
          python3 - <<'PY'
          import hashlib,json,urllib.request
          url='https://data.mobility.brussels/geoserver/bm_bike/wfs?outputFormat=json&request=GetFeature&service=wfs&srsName=EPSG%3A31370&typeName=bm_bike%3Adropzones&version=1.1.0'
          req=urllib.request.Request(url,headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'})
          with urllib.request.urlopen(req,timeout=180) as r: b=r.read()
          open('/tmp/dropzones/dropzones-epsg31370.json','wb').write(b)
          j=json.loads(b); count=len(j.get('features',[])); assert count>0
          manifest={'publisher':'Bruxelles Mobilite + Brulocalis','dataset':'Dropzones','license':'CC0','source_url':url,'crs':'EPSG:31370','feature_count':count,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'runtime_authorized':False}
          open('/tmp/dropzones/manifest.json','w').write(json.dumps(manifest,indent=2))
          print('DROPZONES_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-dropzones
          path: /tmp/dropzones
          if-no-files-found: error
          retention-days: 14
