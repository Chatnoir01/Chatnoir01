name: Grand Bruxelles Final Official Catalog Sweep
on:
  push:
    branches: ["intake/brussels-final-catalog-sweep-current"]
    paths: [".github/workflows/grand-bruxelles-intake-final-catalog-sweep.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sweep remaining game-relevant official layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-catalog-sweep/downloads
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          sources=[
            ('brussels_mobility','https://data.mobility.brussels/geoserver/ows','1.1.0'),
            ('urbis','https://geoservices-vector.irisnet.be/geoserver/urbisvector/wfs','2.0.0'),
          ]
          # Residual families from the master checklist. Already-owned major families are intentionally omitted.
          rx=re.compile(r'toilet|playground|market|school|hospital|police|fire|library|sport|elevator|lift|stairs|barrier|fountain|monument|heritage|cabinet|electric|cemeter|relig|culture|museum|theatre|post|recycl|waste|shelter|artwork|utility',re.I)
          def get(url,timeout=240):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=timeout) as r:return r.read()
          catalog=[]; selected=[]; results=[]
          for source,base,version in sources:
              cap_url=base+'?'+urllib.parse.urlencode({'service':'WFS','request':'GetCapabilities'})
              cap=get(cap_url); open(f'/tmp/final-catalog-sweep/{source}-capabilities.xml','wb').write(cap)
              root=ET.fromstring(cap)
              for ft in root.findall('.//{*}FeatureType'):
                  n=ft.find('{*}Name'); t=ft.find('{*}Title')
                  name=(n.text or '').strip() if n is not None else ''
                  title=(t.text or '').strip() if t is not None else ''
                  row={'source':source,'name':name,'title':title}
                  catalog.append(row)
                  if name and rx.search(name+' '+title): selected.append(row)
          # Deduplicate exact source/name pairs.
          seen=set(); selected2=[]
          for row in selected:
              key=(row['source'],row['name'])
              if key not in seen: seen.add(key); selected2.append(row)
          selected=selected2
          for i,row in enumerate(selected):
              source=row['source']; name=row['name']
              base=next(x[1] for x in sources if x[0]==source); version=next(x[2] for x in sources if x[0]==source)
              params={'service':'WFS','version':version,'request':'GetFeature','outputFormat':'application/json' if version=='2.0.0' else 'json','srsName':'EPSG:31370'}
              params['typeNames' if version=='2.0.0' else 'typeName']=name
              url=base+'?'+urllib.parse.urlencode(params)
              try:
                  raw=get(url,300); obj=json.loads(raw); count=len(obj.get('features',[]))
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',name)
                  fn=f'/tmp/final-catalog-sweep/downloads/{i:03d}-{source}-{safe}.geojson'; open(fn,'wb').write(raw)
                  results.append({**row,'url':url,'file':os.path.basename(fn),'feature_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              except Exception as e:
                  results.append({**row,'url':url,'error':str(e)})
          manifest={'schema':'grand-bruxelles-final-official-catalog-sweep-v1','sources':[x[0] for x in sources],'catalog_feature_types':len(catalog),'selected_residual_layers':len(selected),'downloaded_layers':sum('file' in x for x in results),'catalog':catalog,'results':results,'crs':'EPSG:31370','runtime_authorized':False,'production_authorized':False,'note':'Safety-net sweep only; dedicated intakes remain authoritative owners for already-covered families.'}
          open('/tmp/final-catalog-sweep/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if selected and not any('file' in x for x in results): raise SystemExit('residual layers discovered but none downloaded')
          print('FINAL_CATALOG_SWEEP_OK','catalog',len(catalog),'selected',len(selected),'downloaded',sum('file' in x for x in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-final-official-catalog-sweep
          path: /tmp/final-catalog-sweep
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
