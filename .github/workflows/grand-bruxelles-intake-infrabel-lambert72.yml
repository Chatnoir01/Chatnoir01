name: Grand Bruxelles Intake Infrabel Lambert72

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json"
      - ".github/workflows/grand-bruxelles-intake-infrabel-lambert72.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require exact production base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          contract = json.loads(Path('grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json').read_text())
          expected = contract['production_base_sha']
          live = subprocess.check_output(['git','rev-parse','origin/main'], text=True).strip()
          base = subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          assert live == expected, f'live main drift: contract={expected} live={live}'
          assert base == expected, f'branch base drift: contract={expected} merge_base={base}'
          print('INFRABEL_EXACT_BASE_OK', live)
          PY

      - name: Discover and verify canonical Lambert72 GeoJSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infrabel"
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          contract = json.loads(Path('grand-bruxelles-game/data/qa/infrabel_track_segments_intake.contract.json').read_text())
          out = Path(os.environ['RUNNER_TEMP']) / 'infrabel'
          headers = {'User-Agent':'GrandBruxellesGame-InfrabelLambert72Intake/2.1','Accept':'*/*'}

          def get(url, timeout=180):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), dict(response.headers)

          metadata_bytes, metadata_headers = get(contract['metadata_api'])
          metadata = json.loads(metadata_bytes)
          (out/'dataset-metadata.json').write_bytes(metadata_bytes)

          # Infrabel exposes the original master file through Opendatasoft
          # alternative_exports. The filename does not say Lambert72, so CRS
          # identity is proven from publisher metadata + payload coordinates,
          # not guessed from the attachment name.
          alternatives = metadata.get('alternative_exports') or []
          candidates = []
          for item in alternatives:
              if not isinstance(item, dict):
                  continue
              url = item.get('url')
              title = str(item.get('title') or '')
              mimetype = str(item.get('mimetype') or '')
              descriptor = f'{title} {mimetype} {url or ""}'
              if isinstance(url, str) and re.search(r'geojson|\.geojson', descriptor, re.I):
                  candidates.append({'url':urllib.parse.urljoin('https://opendata.infrabel.be',url),'title':title,'mimetype':mimetype})

          discovery = {
              'dataset_id': contract['dataset_id'],
              'metadata_api': contract['metadata_api'],
              'alternative_export_count': len(alternatives),
              'geojson_candidate_count': len(candidates),
              'candidates': candidates,
          }
          (out/'lambert72-discovery.json').write_text(json.dumps(discovery,indent=2,ensure_ascii=False)+'\n')
          assert candidates, 'publisher metadata exposed no alternative GeoJSON export'

          validated = []
          minimum = int(contract['required_payload']['minimum_feature_count'])
          for index, candidate in enumerate(candidates):
              payload, source_headers = get(candidate['url'])
              try:
                  obj = json.loads(payload)
              except Exception:
                  continue
              if obj.get('type') != 'FeatureCollection' or not isinstance(obj.get('features'), list):
                  continue
              features = obj['features']
              if len(features) < minimum:
                  continue
              samples = []
              def collect(coords):
                  if len(samples) >= 20000:
                      return
                  if isinstance(coords,(list,tuple)):
                      if len(coords) >= 2 and isinstance(coords[0],(int,float)) and isinstance(coords[1],(int,float)):
                          samples.append((float(coords[0]),float(coords[1])))
                      else:
                          for value in coords:
                              collect(value)
              for feature in features:
                  collect((feature.get('geometry') or {}).get('coordinates'))
                  if len(samples) >= 20000:
                      break
              if len(samples) < 100:
                  continue
              lambert_like = sum(0 <= x <= 300000 and 0 <= y <= 300000 for x,y in samples)
              wgs84_like = sum(-180 <= x <= 180 and -90 <= y <= 90 for x,y in samples)
              lambert_ratio = lambert_like/len(samples)
              wgs84_ratio = wgs84_like/len(samples)
              crs_text = json.dumps(obj.get('crs'),ensure_ascii=False).lower()
              explicit_crs_ok = obj.get('crs') is None or '31370' in crs_text or 'lambert' in crs_text
              if lambert_ratio >= 0.95 and wgs84_ratio <= 0.05 and explicit_crs_ok:
                  fn = out/f'candidate-{index}-lambert72.geojson'
                  fn.write_bytes(payload)
                  validated.append({
                      'candidate':candidate,
                      'payload':payload,
                      'headers':source_headers,
                      'feature_count':len(features),
                      'samples':len(samples),
                      'lambert_ratio':lambert_ratio,
                      'wgs84_ratio':wgs84_ratio,
                  })

          assert len(validated) == 1, f'expected exactly one content-validated Lambert72 GeoJSON, got {len(validated)}'
          chosen = validated[0]
          payload = chosen['payload']
          source_url = chosen['candidate']['url']
          source_sha = hashlib.sha256(payload).hexdigest()
          (out/'track-segments-lambert72.geojson').write_bytes(payload)

          hard = contract['hard_rules']
          for key in ('runtime_authorized','runtime_mount_authorized','collision_authorized','materialization_authorized','geometry_modified','semantic_names_authorized','game_world_transform_authorized','jouable_promotion_authorized'):
              assert hard.get(key) is False, f'{key} must remain false'
          assert hard.get('source_registration_only') is True
          assert contract['required_payload']['wgs84_fallback_authorized'] is False

          manifest = {
              'schema':'grand-bruxelles-infrabel-track-segments-source-manifest-v1',
              'publisher':contract['publisher'],
              'dataset_id':contract['dataset_id'],
              'dataset_page':contract['dataset_page'],
              'license':contract['license'],
              'source_url':source_url,
              'source_title':chosen['candidate']['title'],
              'source_format':'GeoJSON',
              'source_crs':'EPSG:31370',
              'feature_count':chosen['feature_count'],
              'bytes':len(payload),
              'sha256':source_sha,
              'coordinate_sample_count':chosen['samples'],
              'lambert72_range_ratio':chosen['lambert_ratio'],
              'wgs84_range_ratio':chosen['wgs84_ratio'],
              'metadata_sha256':hashlib.sha256(metadata_bytes).hexdigest(),
              'metadata_last_modified':metadata_headers.get('Last-Modified'),
              'source_last_modified':chosen['headers'].get('Last-Modified'),
              'runtime_authorized':False,
              'runtime_mount_authorized':False,
              'collision_authorized':False,
              'materialization_authorized':False,
              'geometry_modified':False,
              'semantic_names_authorized':False,
              'game_world_transform_authorized':False,
              'jouable_promotion_authorized':False,
          }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          print('INFRABEL_LAMBERT72_INTAKE_OK',f'features={chosen["feature_count"]}',f'bytes={len(payload)}',f'sha256={source_sha}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-infrabel-lambert72-source-proof
          path: ${{ runner.temp }}/infrabel
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
