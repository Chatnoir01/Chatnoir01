name: Grand Bruxelles LiDAR 2021 Intake
on:
  push:
    branches: ["intake/terrain-elevation-current"]
    paths: [".github/workflows/grand-bruxelles-intake-lidar-2021.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Discover and download official Paradigm LiDAR 2021 resources
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/brussels-lidar-2021
          mkdir -p "$OUT/data"
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,os,re,urllib.parse,urllib.request
          out='/tmp/brussels-lidar-2021'; h={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          seed='https://urbisdownload.datastore.brussels/atomfeed/ff1124e1-424e-11ee-b156-00090ffe0001-en.xml'
          def get(url,timeout=1200):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=timeout) as r:return r.read()
          seen=set(); pages=[]; resources=set(); queue=[seed]
          for depth in range(4):
              nxt=[]
              for url in queue:
                  if url in seen: continue
                  seen.add(url)
                  try:
                      raw=get(url,180); pages.append((url,raw)); text=raw.decode('utf-8','ignore').replace('&amp;','&')
                      for u in re.findall(r'https?://[^\"\'<> ]+',text):
                          u=u.rstrip('.,);]'); host=urllib.parse.urlparse(u).netloc.lower()
                          if host not in ('urbisdownload.datastore.brussels','datastore.brussels'): continue
                          if re.search(r'\.(?:las|laz|zip)(?:\?|$)',u,re.I): resources.add(u)
                          elif ('atom' in u or u.endswith('.xml')) and u not in seen: nxt.append(u)
                  except Exception: pass
              queue=nxt
          for i,(u,raw) in enumerate(pages): open(f'{out}/feed-{i:03d}.xml','wb').write(raw)
          def dl(u):
              try:
                  raw=get(u,1800); name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]) or hashlib.sha1(u.encode()).hexdigest()+'.bin'
                  name=re.sub(r'[^A-Za-z0-9_.-]+','_',name); path=f'{out}/data/{name}'
                  if os.path.exists(path): name=hashlib.sha1(u.encode()).hexdigest()[:10]+'-'+name; path=f'{out}/data/{name}'
                  open(path,'wb').write(raw)
                  return {'url':u,'file':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              except Exception as e:return {'url':u,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: results=list(ex.map(dl,sorted(resources)))
          manifest={'schema':'grand-bruxelles-lidar-2021-intake-v1','publisher':'Paradigm','dataset_id':'ff1124e1-424e-11ee-b156-00090ffe0001','dataset':'Airborne LiDAR point cloud 2021','updated_verified':'2025-12-09','license':'CC BY 4.0','coverage':'Brussels-Capital Region','seed_atom_feed':seed,'discovered_resources':len(resources),'successful_files':sum('sha256' in x for x in results),'results':results,'runtime_authorized':False,'production_authorized':False,'note':'Raw point cloud only; terrain/building derivation requires separate validated processing.'}
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if not pages: raise SystemExit('LiDAR atom feed unavailable')
          if resources and manifest['successful_files']==0: raise SystemExit('LiDAR resources discovered but none downloaded')
          print('LIDAR_2021_INTAKE_OK','resources',len(resources),'downloaded',manifest['successful_files'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-lidar-2021
          path: /tmp/brussels-lidar-2021
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
