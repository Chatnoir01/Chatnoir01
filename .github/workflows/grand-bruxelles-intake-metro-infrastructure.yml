name: Grand Bruxelles Intake Metro Infrastructure
on:
  push:
    branches: ["intake/brussels-metro-infrastructure-current"]
    paths: [".github/workflows/grand-bruxelles-intake-metro-infrastructure.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official metro station and tunnel geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/metro
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          base='https://data.mobility.brussels/geoserver/ows'; layer='bm_public_transport:Metro'; headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          url=base+'?'+urllib.parse.urlencode({'service':'WFS','version':'1.1.0','request':'GetFeature','typeName':layer,'outputFormat':'json','srsName':'EPSG:31370'})
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r: raw=r.read()
          obj=json.loads(raw); count=len(obj.get('features',[])); assert count>0
          open('/tmp/metro/metro_epsg31370.geojson','wb').write(raw)
          open('/tmp/metro/manifest.json','w').write(json.dumps({'publisher':'Paradigm via Bruxelles Mobilite','dataset':'Metro stations and tunnels','layer':layer,'license':'CC0','source_url':url,'crs':'EPSG:31370','feature_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'runtime_authorized':False},indent=2))
          print('METRO_INFRASTRUCTURE_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-metro-infrastructure
          path: /tmp/metro
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
