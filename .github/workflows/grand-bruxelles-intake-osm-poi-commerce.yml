name: Grand Bruxelles Intake OSM POI Commerce
on:
  push:
    branches: ["intake/osm-poi-commerce-current"]
    paths: [".github/workflows/grand-bruxelles-intake-osm-poi-commerce.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Brussels commerce and POI semantics from OSM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/osm-poi-commerce
          cat > /tmp/osm-poi-commerce/query.overpass <<'EOF'
          [out:json][timeout:180];
          (
            nwr["shop"](50.76,4.24,50.92,4.48);
            nwr["amenity"~"^(restaurant|cafe|bar|pub|fast_food|bank|atm|pharmacy|fuel|marketplace|post_office|cinema|theatre)$"](50.76,4.24,50.92,4.48);
            nwr["tourism"~"^(hotel|hostel|museum|attraction)$"](50.76,4.24,50.92,4.48);
            nwr["office"](50.76,4.24,50.92,4.48);
          );
          out center tags;
          EOF
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          endpoint='https://overpass-api.de/api/interpreter'
          query=open('/tmp/osm-poi-commerce/query.overpass').read()
          data=urllib.parse.urlencode({'data':query}).encode()
          req=urllib.request.Request(endpoint,data=data,headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'})
          with urllib.request.urlopen(req,timeout=240) as r: raw=r.read()
          obj=json.loads(raw); count=len(obj.get('elements',[])); assert count>0
          open('/tmp/osm-poi-commerce/osm-poi-commerce.json','wb').write(raw)
          manifest={'publisher':'OpenStreetMap contributors','license':'ODbL-1.0','endpoint':endpoint,'bbox':[50.76,4.24,50.92,4.48],'element_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'query_sha256':hashlib.sha256(query.encode()).hexdigest(),'runtime_authorized':False,'must_clip_to_official_brussels_boundary_before_runtime':True}
          open('/tmp/osm-poi-commerce/manifest.json','w').write(json.dumps(manifest,indent=2))
          print('OSM_POI_COMMERCE_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-osm-poi-commerce
          path: /tmp/osm-poi-commerce
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
