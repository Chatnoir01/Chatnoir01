name: Grand Bruxelles Intake OSM Street Rules
on:
  push:
    branches: ["intake/osm-street-rules-current"]
    paths: [".github/workflows/grand-bruxelles-intake-osm-street-rules.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download detailed street rules and restrictions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/osm-street-rules
          cat > /tmp/osm-street-rules/query.overpass <<'EOF'
          [out:json][timeout:300];
          (
            way["highway"]["oneway"](50.76,4.24,50.92,4.48);
            way["highway"]["lanes"](50.76,4.24,50.92,4.48);
            way["highway"]["access"](50.76,4.24,50.92,4.48);
            way["highway"]["bicycle"](50.76,4.24,50.92,4.48);
            way["highway"]["bus"](50.76,4.24,50.92,4.48);
            way["highway"]["maxheight"](50.76,4.24,50.92,4.48);
            way["highway"]["maxweight"](50.76,4.24,50.92,4.48);
            way["highway"]["vehicle"](50.76,4.24,50.92,4.48);
            relation["type"="restriction"](50.76,4.24,50.92,4.48);
          );
          out geom tags;
          EOF
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          endpoint='https://overpass-api.de/api/interpreter'; query=open('/tmp/osm-street-rules/query.overpass').read()
          req=urllib.request.Request(endpoint,data=urllib.parse.urlencode({'data':query}).encode(),headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'})
          with urllib.request.urlopen(req,timeout=360) as r: raw=r.read()
          obj=json.loads(raw); count=len(obj.get('elements',[])); assert count>0
          open('/tmp/osm-street-rules/osm-street-rules.json','wb').write(raw)
          open('/tmp/osm-street-rules/manifest.json','w').write(json.dumps({'publisher':'OpenStreetMap contributors','license':'ODbL-1.0','endpoint':endpoint,'bbox':[50.76,4.24,50.92,4.48],'element_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'query_sha256':hashlib.sha256(query.encode()).hexdigest(),'runtime_authorized':False,'must_clip_to_official_brussels_boundary_before_runtime':True,'official_speed_limits_remain_authoritative_when_available':True},indent=2))
          print('OSM_STREET_RULES_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-osm-street-rules
          path: /tmp/osm-street-rules
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
