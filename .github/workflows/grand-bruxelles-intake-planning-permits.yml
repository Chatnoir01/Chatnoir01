name: Grand Bruxelles Planning Permits Intake
on:
  push:
    branches: ["intake/brussels-planning-permits-current"]
    paths: [".github/workflows/grand-bruxelles-intake-planning-permits.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download City of Brussels planning permit datasets
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/brussels-planning-permits
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          out='/tmp/brussels-planning-permits'; h={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          ids=['permis-urbanisme-environnement-vbx','permis-urbanisme-delivres-vbx']
          results=[]
          for did in ids:
              for fmt in ('json','csv'):
                  url='https://opendata.brussels.be/api/explore/v2.1/catalog/datasets/'+urllib.parse.quote(did,safe='')+'/exports/'+fmt+'?lang=fr&timezone=Europe%2FBrussels'
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=180) as r: raw=r.read()
                      fn=f'{did}.{fmt}'; open(out+'/'+fn,'wb').write(raw)
                      results.append({'dataset_id':did,'format':fmt,'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                  except Exception as e: results.append({'dataset_id':did,'format':fmt,'url':url,'error':str(e)})
          manifest={'schema':'grand-bruxelles-planning-permits-intake-v1','publisher':'City of Brussels / Urban Development','dataset_ids':ids,'license':'CC0 1.0','modified_verified':'2026-07-28','purpose':'recent-change cross-check; not direct geometry truth','successful_resources':sum('sha256' in x for x in results),'results':results,'runtime_authorized':False,'production_authorized':False}
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if manifest['successful_resources']<2: raise SystemExit('planning permit datasets unavailable')
          print('PLANNING_PERMITS_INTAKE_OK',manifest['successful_resources'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-planning-permits
          path: /tmp/brussels-planning-permits
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
