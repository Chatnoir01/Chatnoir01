name: Grand Bruxelles Intake Speed Limits
on:
  push:
    branches: ["intake/brussels-speed-limits-current"]
    paths: [".github/workflows/grand-bruxelles-intake-speed-limits.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official Brussels speed-limit network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/speed-limits
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          base='https://data.mobility.brussels/geoserver/ows'; layer='bm_network:ville30'
          headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          url=base+'?'+urllib.parse.urlencode({'service':'WFS','version':'1.1.0','request':'GetFeature','typeName':layer,'outputFormat':'json','srsName':'EPSG:31370'})
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r: raw=r.read()
          obj=json.loads(raw); count=len(obj.get('features',[])); assert count>0
          open('/tmp/speed-limits/ville30_epsg31370.geojson','wb').write(raw)
          manifest={'publisher':'Bruxelles Mobilite','dataset':'Ville 30 (simplifie)','layer':layer,'license':'CC0','source_url':url,'crs':'EPSG:31370','feature_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'runtime_authorized':False,'note':'30 max includes 30 km/h or less; 3050 has special bus-site interpretation per source metadata'}
          open('/tmp/speed-limits/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('SPEED_LIMITS_INTAKE_OK',count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-speed-limits
          path: /tmp/speed-limits
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
