name: Grand Bruxelles Statbel Building Period Intake
on:
  push:
    branches: ["intake/statbel-building-period-current"]
    paths: [".github/workflows/grand-bruxelles-intake-statbel-building-period.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Statbel Census construction-period tables
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/statbel-building-period
          mkdir -p "$OUT/data"
          python3 - <<'PY'
          import hashlib,json,re,urllib.parse,urllib.request,os
          out='/tmp/statbel-building-period'; h={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          page='https://statbel.fgov.be/en/themes/census/housing/period-construction'
          with urllib.request.urlopen(urllib.request.Request(page,headers=h),timeout=180) as r: raw=r.read()
          open(out+'/source-page.html','wb').write(raw); text=raw.decode('utf-8','ignore').replace('&amp;','&')
          urls=set()
          for href in re.findall(r'href=[\"\']([^\"\']+)',text,re.I):
              u=urllib.parse.urljoin(page,href)
              if re.search(r'\.xlsx(?:\?|$)',u,re.I): urls.add(u)
          results=[]
          for u in sorted(urls):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=300) as r: data=r.read()
                  name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]); name=re.sub(r'[^A-Za-z0-9_.-]+','_',name)
                  open(out+'/data/'+name,'wb').write(data)
                  results.append({'url':u,'file':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              except Exception as e: results.append({'url':u,'error':str(e)})
          manifest={'schema':'grand-bruxelles-statbel-building-period-intake-v1','publisher':'Statbel','dataset_id':'b38424fb1bfeb7766a1a4d6aee49e5681e2cff58','census_year':2021,'subject':'dwellings/buildings by period of construction','source_page':page,'discovered_xlsx':len(urls),'successful_files':sum('sha256' in x for x in results),'results':results,'runtime_authorized':False,'production_authorized':False,'use':'statistical construction-period evidence; never treated as exact facade survey'}
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if manifest['successful_files']==0: raise SystemExit('Statbel construction-period tables not downloaded')
          print('STATBEL_BUILDING_PERIOD_INTAKE_OK',manifest['successful_files'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-statbel-building-period
          path: /tmp/statbel-building-period
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
