name: Grand Bruxelles STIB Complete Intake
on:
  push:
    branches: ["intake/stib-complete-current"]
    paths: [".github/workflows/grand-bruxelles-intake-stib-complete.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download STIB open-data catalogue and transport datasets
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/stib-complete
          mkdir -p "$OUT/data"
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request,zipfile,io
          out='/tmp/stib-complete'; headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          def get(url,timeout=180):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:return r.read()
          cat_urls=[
            'https://data.stib-mivb.be/api/explore/v2.1/catalog/exports/json?limit=-1&offset=0&timezone=UTC',
            'https://data.stib-mivb.be/api/v2/catalog/datasets?limit=100'
          ]
          cat=None; used=None
          for u in cat_urls:
              try:
                  raw=get(u); open(out+'/catalog.json','wb').write(raw); cat=json.loads(raw); used=u; break
              except Exception: pass
          if cat is None: raise SystemExit('STIB catalogue unavailable')
          rows=cat if isinstance(cat,list) else cat.get('datasets') or cat.get('results') or []
          ids=[]
          for r in rows:
              if not isinstance(r,dict): continue
              did=r.get('dataset_id') or r.get('datasetid') or r.get('id')
              if not did:
                  metas=r.get('metas') or {}
                  did=metas.get('dataset_id') or metas.get('id')
              if did: ids.append(str(did))
          ids=sorted(set(ids+['gtfs-files-production','gtfs-stops-production','shapefiles-production']))
          focus=re.compile(r'(gtfs|shape|line|route|stop|vehicle|position|waiting|traveller|network)',re.I)
          selected=[x for x in ids if focus.search(x)]
          results=[]
          for did in selected:
              base='https://data.stib-mivb.be/api/explore/v2.1/catalog/datasets/'+urllib.parse.quote(did,safe='')+'/exports/'
              saved=False
              for fmt in ('geojson','json','csv'):
                  url=base+fmt+'?lang=en&timezone=Europe%2FBrussels'
                  try:
                      raw=get(url,240)
                      if not raw: continue
                      ext={'geojson':'geojson','json':'json','csv':'csv'}[fmt]
                      rel=f'data/{did}.{ext}'
                      fn=f'{out}/{rel}'
                      open(fn,'wb').write(raw)
                      results.append({'dataset_id':did,'format':fmt,'file':rel,'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
                      saved=True; break
                  except Exception:
                      pass
              if not saved: results.append({'dataset_id':did,'error':'no export format succeeded'})

          # Complete official static GTFS feed. The STIB dataset gtfs-files-production exposes an
          # alternative gtfszip export. This is the canonical artifact for schedule normalization.
          gtfs_urls=[
            'https://stibmivb.opendatasoft.com/api/datasets/1.0/gtfs-files-production/alternative_exports/gtfszip/',
            'https://data.stib-mivb.brussels/api/datasets/1.0/gtfs-files-production/alternative_exports/gtfszip/',
            'https://data.stib-mivb.be/api/datasets/1.0/gtfs-files-production/alternative_exports/gtfszip/'
          ]
          gtfs_raw=None; gtfs_used=None; gtfs_error=[]
          for u in gtfs_urls:
              try:
                  raw=get(u,600)
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      members=sorted(n.rsplit('/',1)[-1] for n in zf.namelist() if not n.endswith('/'))
                      required={'agency.txt','stops.txt','routes.txt','trips.txt','stop_times.txt'}
                      missing=sorted(required-set(members))
                      if missing: raise RuntimeError('missing required GTFS members: '+','.join(missing))
                  gtfs_raw=raw; gtfs_used=u; break
              except Exception as e:
                  gtfs_error.append({'url':u,'error':str(e)})
          if gtfs_raw is None:
              results.append({'dataset_id':'gtfs-files-production-gtfszip','error':'all official GTFS ZIP candidates failed','attempts':gtfs_error})
          else:
              rel='data/gtfs-files-production.zip'
              open(out+'/'+rel,'wb').write(gtfs_raw)
              with zipfile.ZipFile(io.BytesIO(gtfs_raw)) as zf:
                  members=sorted(n.rsplit('/',1)[-1] for n in zf.namelist() if not n.endswith('/'))
              results.append({
                  'dataset_id':'gtfs-files-production-gtfszip',
                  'format':'zip',
                  'file':rel,
                  'url':gtfs_used,
                  'bytes':len(gtfs_raw),
                  'sha256':hashlib.sha256(gtfs_raw).hexdigest(),
                  'members':members,
                  'required_members_verified':['agency.txt','stops.txt','routes.txt','trips.txt','stop_times.txt']
              })

          terms='https://data.stib-mivb.be/terms/terms-and-conditions.pdf'
          try:
              raw=get(terms); open(out+'/terms-and-conditions.pdf','wb').write(raw)
              terms_sha=hashlib.sha256(raw).hexdigest()
              results.append({'dataset_id':'terms','format':'pdf','file':'terms-and-conditions.pdf','url':terms,'bytes':len(raw),'sha256':terms_sha})
          except Exception as e:
              terms_sha='UNAVAILABLE:'+str(e)
          gtfs_ok=any(x.get('dataset_id')=='gtfs-files-production-gtfszip' and 'sha256' in x for x in results)
          manifest={
              'schema':'grand-bruxelles-stib-complete-intake-v2',
              'publisher':'STIB-MIVB',
              'catalog_url':used,
              'catalog_dataset_count':len(ids),
              'selected_dataset_count':len(selected),
              'successful_exports':sum('sha256' in x for x in results if x.get('dataset_id')!='terms'),
              'full_static_gtfs_verified':gtfs_ok,
              'results':results,
              'terms_url':terms,
              'terms_sha256':terms_sha,
              'license':'STIB-MIVB Open Data Licence / published terms',
              'attribution_rule':'Product/service/application must identify STIB-MIVB as source and state the data last-update date; modified information must disclose modification according to published terms.',
              'line_colour_rule':'Respect producer GTFS line colours as closely as technically possible.',
              'runtime_authorized':False,
              'production_authorized':False,
              'note':'Data-only owner. Existing STIB visual/runtime branches retain ownership.'
          }
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if manifest['successful_exports']<3: raise SystemExit('core STIB exports not materialized')
          if not manifest['full_static_gtfs_verified']: raise SystemExit('complete STIB GTFS ZIP not materialized')
          print('STIB_COMPLETE_INTAKE_OK',manifest['successful_exports'],'full_gtfs',manifest['full_static_gtfs_verified'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-stib-complete
          path: /tmp/stib-complete
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
