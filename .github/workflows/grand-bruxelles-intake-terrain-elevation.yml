name: Grand Bruxelles Intake Terrain Elevation
on:
  push:
    branches: ["intake/terrain-elevation-current"]
    paths: [".github/workflows/grand-bruxelles-intake-terrain-elevation.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover-and-download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Discover official Brussels elevation resources and download direct distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/elevation/files
          python3 - <<'PY'
          import hashlib, html, json, os, re, urllib.parse, urllib.request
          base='https://geobru.irisnet.be/geonetwork/srv/eng/csw'
          params={'service':'CSW','version':'2.0.2','request':'GetRecords','resultType':'results','typeNames':'csw:Record','elementSetName':'full','constraintLanguage':'CQL_TEXT','constraint':"AnyText like '%elevation%'",'maxRecords':'100'}
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'GrandBruxellesGame-ElevationIntake/1.0'})
          xml=urllib.request.urlopen(req,timeout=120).read()
          open('/tmp/elevation/catalog.xml','wb').write(xml)
          text=html.unescape(xml.decode('utf-8','ignore'))
          urls=sorted(set(re.findall(r'https?://[^\s<>"\']+',text)))
          exts=('.tif','.tiff','.zip','.ecw','.gpkg','.geojson','.gml')
          candidates=[u.rstrip('.,;)') for u in urls if any(e in u.lower().split('?',1)[0] for e in exts)]
          results=[]
          for i,u in enumerate(candidates):
              try:
                  rq=urllib.request.Request(u,headers={'User-Agent':'GrandBruxellesGame-ElevationIntake/1.0'})
                  with urllib.request.urlopen(rq,timeout=180) as r: body=r.read()
                  suffix=os.path.basename(urllib.parse.urlparse(u).path) or f'resource-{i}'
                  suffix=re.sub(r'[^A-Za-z0-9._-]+','_',suffix)[:120]
                  fn=f'{i:02d}-{suffix}'; open('/tmp/elevation/files/'+fn,'wb').write(body)
                  results.append({'url':u,'file':fn,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
              except Exception as e:
                  results.append({'url':u,'error':str(e)})
          manifest={'publisher_catalog':'Brussels regional GeoBru/Datastore','query':'elevation','catalog_url':url,'catalog_sha256':hashlib.sha256(xml).hexdigest(),'candidate_distributions':len(candidates),'results':results}
          open('/tmp/elevation/manifest.json','w').write(json.dumps(manifest,indent=2))
          print('ELEVATION_DISCOVERY_OK',len(urls),len(candidates),sum('file' in x for x in results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-terrain-elevation
          path: /tmp/elevation
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
