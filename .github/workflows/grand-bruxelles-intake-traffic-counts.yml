name: Grand Bruxelles Traffic Counts Intake
on:
  push:
    branches: ["intake/brussels-traffic-counts-current"]
    paths: [".github/workflows/grand-bruxelles-intake-traffic-counts.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Brussels Mobility traffic counters
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/brussels-traffic-counts
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,urllib.request
          out='/tmp/brussels-traffic-counts'; h={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          def get(url,timeout=180):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=timeout) as r:return r.read()
          sources={
            'devices_json':'https://data.mobility.brussels/traffic/api/counts/?request=devices&outputFormat=json',
            'devices_csv':'https://data.mobility.brussels/traffic/api/counts/?request=devices&outputFormat=csv',
            'live_all':'https://data.mobility.brussels/traffic/api/counts/?request=live&interval=all&includeLanes=true',
            'live_15m':'https://data.mobility.brussels/traffic/api/counts/?request=live&interval=15&includeLanes=true',
            'wfs_geom':'https://data.mobility.brussels/geoserver/bm_traffic/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=bm_traffic:traffic_live_geom&outputFormat=json&srsName=EPSG:31370',
            'wfs_capabilities':'https://data.mobility.brussels/geoserver/bm_traffic/ows?service=WFS&request=GetCapabilities'
          }
          results=[]
          for key,url in sources.items():
              try:
                  raw=get(url); ext='csv' if key.endswith('csv') else ('xml' if 'capabilities' in key else 'json')
                  rel=f'{key}.{ext}'; open(f'{out}/{rel}','wb').write(raw)
                  results.append({'id':key,'file':rel,'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              except Exception as e: results.append({'id':key,'url':url,'error':str(e)})
          manifest={'schema':'grand-bruxelles-traffic-counts-intake-v1','publisher':'Brussels Mobility / Mobiris','license':'CC0','crs_geometry':'EPSG:31370','api':'https://data.mobility.brussels/traffic/api/counts/','successful_resources':sum('sha256' in x for x in results),'results':results,'historical_status':'NOT_ASSUMED_PUBLIC_BY_CURRENT_API_CONTRACT','runtime_authorized':False,'production_authorized':False}
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if manifest['successful_resources']<4: raise SystemExit('traffic intake incomplete')
          print('TRAFFIC_COUNTS_INTAKE_OK',manifest['successful_resources'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-traffic-counts
          path: /tmp/brussels-traffic-counts
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
