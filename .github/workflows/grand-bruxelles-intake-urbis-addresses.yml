name: Grand Bruxelles Intake UrbIS Addresses
on:
  push:
    branches: ["intake/urbis-addresses-current"]
    paths: [".github/workflows/grand-bruxelles-intake-urbis-addresses.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download official UrbIS address points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urbis-addresses
          python3 - <<'PY'
          import hashlib,json,urllib.parse,urllib.request
          base='https://geoservices-vector.irisnet.be/geoserver/urbisvector/wfs'
          headers={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          layers=['urbisvector:AddressNumbers','urbisvector:Addresses']
          out=[]
          for layer in layers:
              q={'service':'WFS','version':'2.0.0','request':'GetFeature','typeNames':layer,'outputFormat':'application/json','srsName':'EPSG:31370'}
              url=base+'?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=240) as r: raw=r.read()
              obj=json.loads(raw); count=len(obj.get('features',[])); assert count>0, layer
              rel=layer.split(':')[1]+'.geojson'; open('/tmp/urbis-addresses/'+rel,'wb').write(raw)
              out.append({'layer':layer,'file':rel,'url':url,'feature_count':count,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          manifest={
            'schema':'grand-bruxelles-urbis-addresses-intake-v2',
            'publisher':'Paradigm / UrbIS',
            'dataset':'UrbIS - Parcels and buildings / current address classes',
            'source_crs':'EPSG:31370',
            'wfs':base,
            'license':'Paradigm UrbIS dataset terms; dataset is publicly/freely downloadable, exact production reuse terms remain a separate gate',
            'license_status':'REQUIRES_EXACT_PRODUCTION_CONFIRMATION',
            'results':out,
            'runtime_authorized':False,
            'production_authorized':False
          }
          open('/tmp/urbis-addresses/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          print('URBIS_ADDRESSES_INTAKE_OK',[(x['layer'],x['feature_count']) for x in out])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-urbis-addresses
          path: /tmp/urbis-addresses
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
