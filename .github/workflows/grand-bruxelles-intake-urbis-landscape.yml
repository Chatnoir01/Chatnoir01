name: Grand Bruxelles UrbIS Landscape Intake
on:
  push:
    branches: ["intake/urbis-landscape-current"]
    paths: [".github/workflows/grand-bruxelles-intake-urbis-landscape.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Discover and download current UrbIS Landscape distributions
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/urbis-landscape
          mkdir -p "$OUT/data"
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,os,re,urllib.parse,urllib.request
          out='/tmp/urbis-landscape'; h={'User-Agent':'GrandBruxellesGame-DataFactory/1.0'}
          seed='https://urbisdownload.datastore.brussels/atomfeed/713171e6-65e3-11ef-b378-010101010000-en.xml'
          def get(url,timeout=600):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=timeout) as r:return r.read()
          seen=set(); pages=[]; resources=set(); queue=[seed]
          for depth in range(3):
              nxt=[]
              for url in queue:
                  if url in seen: continue
                  seen.add(url)
                  try:
                      raw=get(url,180); pages.append((url,raw))
                      text=raw.decode('utf-8','ignore').replace('&amp;','&')
                      for u in re.findall(r'https?://[^\"\'<> ]+',text):
                          u=u.rstrip('.,);]')
                          host=urllib.parse.urlparse(u).netloc.lower()
                          if host!='urbisdownload.datastore.brussels': continue
                          if re.search(r'\.(?:zip|gpkg|gml|json|tif|tiff)(?:\?|$)',u,re.I): resources.add(u)
                          elif ('atom' in u or u.endswith('.xml')) and u not in seen: nxt.append(u)
                  except Exception: pass
              queue=nxt
          for i,(u,raw) in enumerate(pages): open(f'{out}/feed-{i:02d}.xml','wb').write(raw)
          def dl(u):
              try:
                  raw=get(u,1200); name=urllib.parse.unquote(urllib.parse.urlparse(u).path.rsplit('/',1)[-1]) or hashlib.sha1(u.encode()).hexdigest()+'.bin'
                  name=re.sub(r'[^A-Za-z0-9_.-]+','_',name); path=f'{out}/data/{name}'; open(path,'wb').write(raw)
                  return {'url':u,'file':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
              except Exception as e:return {'url':u,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: results=list(ex.map(dl,sorted(resources)))
          manifest={'schema':'grand-bruxelles-urbis-landscape-intake-v1','publisher':'Paradigm','dataset_id':'713171e6-65e3-11ef-b378-010101010000','updated_verified':'2026-06-18','frequency':'monthly','product':'3D Constructions + Digital Terrain Model','seed_atom_feed':seed,'discovered_resources':len(resources),'successful_files':sum('sha256' in x for x in results),'results':results,'runtime_authorized':False,'production_authorized':False,'role':'cross-check/combined landscape source; dedicated 3D/terrain owners remain authoritative until reconciliation'}
          open(out+'/manifest.json','w').write(json.dumps(manifest,indent=2,ensure_ascii=False))
          if not pages: raise SystemExit('UrbIS Landscape feed unavailable')
          if resources and manifest['successful_files']==0: raise SystemExit('Landscape resources discovered but none downloaded')
          print('URBIS_LANDSCAPE_INTAKE_OK','resources',len(resources),'downloaded',manifest['successful_files'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-bruxelles-urbis-landscape
          path: /tmp/urbis-landscape
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
