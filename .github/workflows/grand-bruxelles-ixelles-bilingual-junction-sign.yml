name: Grand Bruxelles Ixelles Bilingual Junction Sign

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-bilingual-junction-sign.yml"
      - "grand-bruxelles-game/data/provenance/ixelles_stassart_stephanie_junction_sign.json"
      - "grand-bruxelles-game/game/scripts/brussels_bilingual_street_sign.gd"
      - "grand-bruxelles-game/game/zones/ixelles/ixelles_microslice_draped_intersection.gd"
      - "grand-bruxelles-game/game/tests/ixelles_bilingual_junction_sign_test.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/network.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ixelles-bilingual-junction-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-anchored Ixelles identity cue and A/B capture
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/ixelles_bilingual_junction_sign_test.gd 2>&1 | tee /tmp/ixelles-identity.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_BILINGUAL_JUNCTION_SIGN_FAIL" /tmp/ixelles-identity.log; then exit 1; fi
          grep -F "IXELLES_BILINGUAL_JUNCTION_SIGN_OK" /tmp/ixelles-identity.log
          test -f grand-bruxelles-game/artifacts/ixelles/ixelles_identity_before_1280x720.png
          test -f grand-bruxelles-game/artifacts/ixelles/ixelles_identity_after_1280x720.png
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-bilingual-junction-sign-evidence
          path: |
            grand-bruxelles-game/artifacts/ixelles/ixelles_identity_before_1280x720.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_identity_after_1280x720.png
            /tmp/ixelles-identity.log
          if-no-files-found: error
