name: Grand Bruxelles Ixelles BuildingFaces Schema

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/inspect_urbis_3d_buildingface_schema.py"
      - "grand-bruxelles-game/tools/test_inspect_urbis_3d_buildingface_schema.py"
      - ".github/workflows/grand-bruxelles-ixelles-buildingfaces-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-buildingfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only GeoPackage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal unzip
          ogrinfo --version
      - name: Regression-test schema profiler
        run: python3 grand-bruxelles-game/tools/test_inspect_urbis_3d_buildingface_schema.py
      - name: Discover and select latest official Ixelles GPKG
        run: |
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path('grand-bruxelles-game/tools/discover_urbis_sources.py')
          spec=importlib.util.spec_from_file_location('discover_urbis_sources',p)
          assert spec and spec.loader
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          source_id='urbis_3d_constructions'
          feed=m.parse_feed(source_id,m.DEFAULT_FEEDS[source_id])
          Path('/tmp/urbis-discovered.json').write_text(json.dumps({'schema':1,'feeds':[feed]},indent=2)+'\n')
          PY
          python3 grand-bruxelles-game/tools/select_urbis_distribution.py \
            /tmp/urbis-discovered.json /tmp/urbis-3d-selected.json \
            --source-id urbis_3d_constructions \
            --token 31370 --token GPKG \
            --candidate-token 31370 --candidate-token GPKG --candidate-token 21009 \
            --prefer-latest
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/urbis-3d-selected.json'))
          s=p['selected']; u=s['href'].casefold()
          assert s.get('title','').casefold()=='ixelles'
          assert '31370' in u and 'gpkg' in u and '21009' in u
          assert p['selected_embedded_date']>='20260101'
          print('IXELLES_GPKG_SELECTED',p['selected_embedded_date'],s['href'])
          PY
      - name: Download and safely extract selected official package
        run: |
          set -euo pipefail
          URL="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/urbis-3d-selected.json'))['selected']['href'])
          PY
          )"
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
            --user-agent 'GrandBruxellesGame/ixelles-buildingfaces-schema (+github.com/Chatnoir01/Chatnoir01)' \
            "$URL" -o /tmp/urbis-3d-distribution
          sha256sum /tmp/urbis-3d-distribution | tee /tmp/urbis-3d-distribution.sha256
          python3 - <<'PY'
          import shutil,zipfile
          from pathlib import Path
          source=Path('/tmp/urbis-3d-distribution'); root=Path('/tmp/urbis-3d-extracted'); root.mkdir(parents=True,exist_ok=True)
          def extract(a,d):
              d.mkdir(parents=True,exist_ok=True); base=d.resolve()
              with zipfile.ZipFile(a) as z:
                  for member in z.infolist():
                      target=(d/member.filename).resolve()
                      if base not in target.parents and target!=base: raise SystemExit('unsafe ZIP path')
                  z.extractall(d)
          if zipfile.is_zipfile(source): extract(source,root/'level0')
          elif source.read_bytes()[:16].startswith(b'SQLite format 3'): shutil.copy2(source,root/'selected.gpkg')
          else: raise SystemExit('unsupported official distribution container')
          for depth in range(1,4):
              archives=list(root.rglob('*.zip'))
              pending=[p for p in archives if f'-nested-{depth}-' not in str(p)]
              if not pending: break
              for i,p in enumerate(pending):
                  dest=p.parent/f'{p.stem}-nested-{depth}-{i}'
                  if not dest.exists(): extract(p,dest)
          assert list(root.rglob('*.gpkg'))
          PY
      - name: Profile real BuildingFaces fields without semantic inference
        run: |
          mkdir -p grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema
          cp /tmp/urbis-3d-selected.json grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema/selected.json
          cp /tmp/urbis-3d-distribution.sha256 grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema/distribution.sha256
          python3 grand-bruxelles-game/tools/inspect_urbis_3d_buildingface_schema.py \
            --root /tmp/urbis-3d-extracted \
            --output grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema/schema.json \
            --sample-features 5000 --max-examples 16 --require-buildingfaces
          python3 - <<'PY'
          import json
          p=json.load(open('grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema/schema.json'))
          assert p['package_count_with_buildingfaces']>=1
          assert p['policy']['semantic_inference'] is False
          assert p['policy']['runtime_approval'] is False
          for package in p['packages']:
              layer=package['building_faces']
              assert layer['feature_count_fast']>0 and layer['field_count']>0
              assert all(field['name'] for field in layer['fields'])
              print('BUILDINGFACES_SCHEMA_PROVEN',layer['feature_count_fast'],[(f['name'],f['type_name'],f['sample_non_null'],f['sample_distinct'],round(f['sample_uniqueness_ratio'],4)) for f in layer['fields']])
          PY
      - name: Upload evidence only
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-ixelles-buildingfaces-schema-evidence
          path: grand-bruxelles-game/artifacts/ixelles-buildingfaces-schema/
          if-no-files-found: error
