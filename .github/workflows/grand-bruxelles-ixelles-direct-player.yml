name: Grand Bruxelles Ixelles Direct Player

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-direct-player.yml"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/tests/ixelles_direct_spawn_test.gd"
      - "grand-bruxelles-game/game/zones/ixelles/**"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-player:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate production player entry and capture 1280x720
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/ixelles-direct-player.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_DIRECT_SPAWN_FAIL" /tmp/ixelles-direct-player.log; then exit 1; fi
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/ixelles-direct-player.log
          test -f grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png
      - name: Upload production player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-direct-player-1280x720
          path: |
            grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png
            /tmp/ixelles-direct-player.log
          if-no-files-found: warn
