name: Grand Bruxelles Ixelles DTM 2m Candidate

on:
  push:
    paths:
      - "grand-bruxelles-game/data/terrain/ixelles/ixelles_dtm_2m_candidate_evidence.json"
      - "grand-bruxelles-game/tests/test_ixelles_dtm_2m_candidate_evidence.py"
      - ".github/workflows/grand-bruxelles-ixelles-dtm-2m-candidate.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/terrain/ixelles/ixelles_dtm_2m_candidate_evidence.json"
      - "grand-bruxelles-game/tests/test_ixelles_dtm_2m_candidate_evidence.py"
      - ".github/workflows/grand-bruxelles-ixelles-dtm-2m-candidate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked 2 m candidate evidence
        working-directory: grand-bruxelles-game
        run: python3 -m unittest -v tests.test_ixelles_dtm_2m_candidate_evidence
