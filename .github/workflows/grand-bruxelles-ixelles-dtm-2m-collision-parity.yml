name: Grand Bruxelles Ixelles DTM 2m Collision Parity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-dtm-2m-collision-parity.yml"
      - "grand-bruxelles-game/tools/measure_ixelles_dtm_2m_collision_parity.py"
      - "grand-bruxelles-game/tests/test_measure_ixelles_dtm_2m_collision_parity.py"
      - "grand-bruxelles-game/tools/measure_ixelles_dtm_2m_seams.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic raster dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 rasterio==1.4.3 pytest==8.4.1
      - name: Run collision-parity regressions
        run: pytest -q grand-bruxelles-game/tests/test_measure_ixelles_dtm_2m_collision_parity.py grand-bruxelles-game/tests/test_measure_ixelles_dtm_2m_seams.py
      - name: Download and hash locked official UrbIS DTM archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixelles-dtm/149168 /tmp/ixelles-dtm/149169
          curl -fL --retry 4 --retry-delay 3 -o /tmp/149168.zip https://urbisdownload.datastore.brussels/UrbIS/Grid/DTM/DTM2021/TIFF/DTM_31370_TIFF_149168_20211009_50.zip
          curl -fL --retry 4 --retry-delay 3 -o /tmp/149169.zip https://urbisdownload.datastore.brussels/UrbIS/Grid/DTM/DTM2021/TIFF/DTM_31370_TIFF_149169_20211009_50.zip
          echo "f0277df26876c6c7cd3e00050e3d3a44b420b2df4bf4271e680717adeabb09b4  /tmp/149168.zip" | sha256sum -c -
          echo "c8135aa8456a5f2de8efb2e05dbf9c993ae9c97e4aa7f4d56c6c331345bac4f8  /tmp/149169.zip" | sha256sum -c -
          unzip -q /tmp/149168.zip -d /tmp/ixelles-dtm/149168
          unzip -q /tmp/149169.zip -d /tmp/ixelles-dtm/149169
      - name: Discover readable official raster payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import rasterio
          out=[]
          for tile in ('149168','149169'):
              candidates=[]
              for p in sorted(Path('/tmp/ixelles-dtm', tile).rglob('*')):
                  if not p.is_file():
                      continue
                  try:
                      with rasterio.open(p) as ds:
                          if ds.count >= 1 and ds.width > 0 and ds.height > 0:
                              candidates.append(p)
                  except Exception:
                      pass
              if not candidates:
                  raise SystemExit(f'No readable raster found for {tile}')
              out.append(str(candidates[0]))
          Path('/tmp/ixelles-raster-paths.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Measure exact render/collision parity on all five cells
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RASTERS < /tmp/ixelles-raster-paths.txt
          test "${#RASTERS[@]}" -eq 2
          python grand-bruxelles-game/tools/measure_ixelles_dtm_2m_collision_parity.py \
            --raster "${RASTERS[0]}" "${RASTERS[1]}" \
            --archive-hash 149168=f0277df26876c6c7cd3e00050e3d3a44b420b2df4bf4271e680717adeabb09b4 \
            --archive-hash 149169=c8135aa8456a5f2de8efb2e05dbf9c993ae9c97e4aa7f4d56c6c331345bac4f8 \
            --output /tmp/ixelles_dtm_2m_collision_parity.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/ixelles_dtm_2m_collision_parity.json'))
          a=d['aggregate']
          assert a['cell_count'] == 5
          assert a['vertices_total_before_cross_cell_dedup'] == 315005
          assert a['triangles_total'] == 625000
          assert a['failed_cell_count'] == 0
          assert a['max_abs_vertex_z_delta_m'] == 0.0
          assert a['max_abs_vertex_xy_delta_m'] == 0.0
          assert a['nonzero_vertex_z_delta_count'] == 0
          assert a['nonzero_vertex_xy_delta_count'] == 0
          assert a['collision_parity_gate_pass'] is True
          assert d['runtime_approved'] is False
          assert d['promote_runtime'] is False
          print(json.dumps(a, sort_keys=True))
          PY
      - name: Upload collision parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-dtm-2m-collision-parity
          path: |
            /tmp/ixelles_dtm_2m_collision_parity.json
            /tmp/ixelles-raster-paths.txt
          if-no-files-found: warn
