name: Grand Bruxelles Ixelles East DTM Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-east-dtm-runtime.yml"
      - "grand-bruxelles-game/game/scripts/brussels_source_dtm_streamed_cell.gd"
      - "grand-bruxelles-game/game/scripts/brussels_world_streaming_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_east_dtm_runtime_test.gd"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169000-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/ixelles_shared_vertical_datum.game.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149500-n169000-s500/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  east-dtm-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/east-dtm-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/east-dtm-import.log; then exit 1; fi
      - name: Run production east DTM seam and PhysicsServer gate
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game \
            --script res://game/tests/brussels_east_dtm_runtime_test.gd 2>&1 | tee /tmp/east-dtm-runtime.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "BRUSSELS_EAST_DTM_RUNTIME_FAIL: timed out after 90s"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_EAST_DTM_RUNTIME_FAIL" /tmp/east-dtm-runtime.log; then exit 1; fi
          grep -F "BRUSSELS_EAST_DTM_RUNTIME_OK" /tmp/east-dtm-runtime.log
