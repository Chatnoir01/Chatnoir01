name: Grand Bruxelles Ixelles Frontage Source Probe

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-frontage-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official addresses for visible candidates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://geoservices-urbis.irisnet.be/geoserver/urbisvector/wfs'
          for ID in 1737877 1633062; do
            CQL="BU_ID='https://databrussels.be/id/building/$ID'"
            Q=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$CQL")
            URL="$BASE?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application%2Fjson&srsName=EPSG%3A31370&typeNames=urbisvector%3AAddresses&CQL_FILTER=$Q"
            curl -fLsS --max-time 30 "$URL" -o "/tmp/a$ID.json"
          done
          python3 - <<'PY'
          import json
          for bid in ('1737877','1633062'):
              d=json.load(open('/tmp/a'+bid+'.json'))
              fs=d.get('features',[])
              print('CANDIDATE_ADDRESS_COUNT',bid,len(fs))
              roots=[]
              for f in fs:
                  p=f.get('properties',{})
                  if p.get('PARENTID') is None:
                      roots.append(p)
              for p in roots:
                  print('OFFICIAL_ADDRESS',bid,json.dumps({k:p.get(k) for k in ('INSPIRE_ID','BU_ID','POLICENUM','BOXNUMBER','STRNAMEFRE','STRNAMEDUT','XL72','YL72','CAPAKEY','ZIPCODE')},ensure_ascii=False,sort_keys=True))
              if not roots:
                  print('NO_ROOT_ADDRESS',bid)
          PY
