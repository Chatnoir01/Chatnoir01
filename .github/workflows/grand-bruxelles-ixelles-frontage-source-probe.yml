name: Grand Bruxelles Ixelles Frontage Source Probe

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-frontage-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official UrbIS address-building linkage
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://geoservices-urbis.irisnet.be/geoserver/urbisvector/wfs'
          BBOX='149220,169380,149275,169445,EPSG:31370'
          for TYPE in urbisvector:Buildings urbisvector:Addresses urbisvector:AddressNumbers; do
            echo "=== $TYPE ==="
            ENCODED=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$TYPE")
            URL="$BASE?service=WFS&version=2.0.0&request=GetFeature&outputFormat=application%2Fjson&srsName=EPSG%3A31370&bbox=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$BBOX")&typeNames=$ENCODED"
            curl -fLsS --max-time 30 "$URL" -o "/tmp/${TYPE#*:}.json"
          done
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          for name in ('Buildings','Addresses','AddressNumbers'):
              d=json.loads(Path('/tmp/'+name+'.json').read_text())
              fs=d.get('features',[])
              print('LAYER',name,'FEATURE_COUNT',len(fs))
              for f in fs[:100]:
                  print('FEATURE',name,f.get('id'),json.dumps(f.get('properties',{}),ensure_ascii=False,sort_keys=True))
          PY
