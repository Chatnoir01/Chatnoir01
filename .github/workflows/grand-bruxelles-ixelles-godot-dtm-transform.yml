name: Grand Bruxelles Ixelles Godot DTM Transform

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-godot-dtm-transform.yml"
      - "grand-bruxelles-game/game/tests/ixelles_dtm_godot_collision_transform_test.gd"
      - "grand-bruxelles-game/game/zones/ixelles/ixelles_microslice.gd"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/ixelles-transform-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/ixelles-transform-import.log; then exit 1; fi
      - name: Probe production DTM mesh versus PhysicsServer collision
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game \
            --script res://game/tests/ixelles_dtm_godot_collision_transform_test.gd 2>&1 | tee /tmp/ixelles-godot-transform.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "IXELLES_DTM_GODOT_TRANSFORM_FAIL: timed out after 60s"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_DTM_GODOT_TRANSFORM_FAIL" /tmp/ixelles-godot-transform.log; then exit 1; fi
          grep -F "IXELLES_DTM_GODOT_TRANSFORM_OK" /tmp/ixelles-godot-transform.log
