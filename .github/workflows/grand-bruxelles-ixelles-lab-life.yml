name: Grand Bruxelles Ixelles LABO Life

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-lab-life.yml"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/game/scripts/ixelles_lab_life.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/scripts/zone_selector_runtime.gd"
      - "grand-bruxelles-game/game/tests/ixelles_lab_life_test.gd"
      - "grand-bruxelles-game/game/tests/ixelles_direct_spawn_test.gd"
      - "grand-bruxelles-game/game/zones/ixelles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ixelles-lab-life:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Prove source-anchored Ixelles life
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/ixelles_lab_life_test.gd 2>&1 | tee /tmp/life.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_LAB_LIFE_FAIL" /tmp/life.log; then exit 1; fi
          grep -F "IXELLES_LAB_LIFE_OK" /tmp/life.log
      - name: Capture life OFF
        shell: bash
        run: |
          set -o pipefail
          GB_IXELLES_LIFE=0 xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/before.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/before.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_lab_life_before.png
      - name: Capture life ON
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/after.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/after.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_lab_life_after.png
      - name: Require player-visible gain
        run: |
          python3 - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          p=Path('grand-bruxelles-game/artifacts/ixelles')
          a=Image.open(p/'ixelles_lab_life_before.png').convert('RGB')
          b=Image.open(p/'ixelles_lab_life_after.png').convert('RGB')
          assert a.size == b.size == (1280,720)
          ap=a.load(); bp=b.load(); gt3=gt8=0; xs=[]; ys=[]
          for y in range(720):
              for x in range(1280):
                  d=max(abs(bp[x,y][i]-ap[x,y][i]) for i in range(3))
                  if d>3: gt3 += 1
                  if d>8:
                      gt8 += 1; xs.append(x); ys.append(y)
          total=1280*720
          result={
              'gt3_pixels':gt3,'gt8_pixels':gt8,
              'gt3_fraction':gt3/total,'gt8_fraction':gt8/total,
              'gt8_bbox':[min(xs),min(ys),max(xs),max(ys)] if xs else None,
              'frozen_thresholds':{'gt3_fraction_min':0.003,'gt8_fraction_min':0.001}
          }
          (p/'ixelles_lab_life_ab.json').write_text(json.dumps(result,indent=2)+'\n')
          print('IXELLES_LAB_LIFE_AB', result)
          if result['gt3_fraction'] < 0.003 or result['gt8_fraction'] < 0.001:
              raise SystemExit('Ixelles life change is not sufficiently player-visible')
          PY
      - name: Upload full-frame witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-lab-life-1280x720
          path: |
            grand-bruxelles-game/artifacts/ixelles/ixelles_lab_life_before.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_lab_life_after.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_lab_life_ab.json
            /tmp/life.log
            /tmp/before.log
            /tmp/after.log
          if-no-files-found: warn
