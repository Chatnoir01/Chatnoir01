name: Grand Bruxelles Ixelles Micro-slice Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-microslice-runtime.yml"
      - "grand-bruxelles-game/game/zones/ixelles/ixelles_microslice.gd"
      - "grand-bruxelles-game/game/tests/ixelles_microslice_runtime_test.gd"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate Ixelles terrain render-collision transform and no-invented-height gate
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/ixelles_microslice_runtime_test.gd 2>&1 | tee /tmp/ixelles-microslice-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_MICROSLICE_RUNTIME_FAIL" /tmp/ixelles-microslice-runtime.log; then exit 1; fi
          grep -F "IXELLES_MICROSLICE_RUNTIME_OK" /tmp/ixelles-microslice-runtime.log
      - name: Upload runtime gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-microslice-runtime-gate
          path: /tmp/ixelles-microslice-runtime.log
          if-no-files-found: warn
