name: Grand Bruxelles Ixelles Midi Sidewalk

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-midi-sidewalk.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/ixelles_midi_sidewalk_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_blue_stone_material.gd"
      - "grand-bruxelles-game/game/tests/ixelles_midi_sidewalk_test.gd"
      - "grand-bruxelles-game/game/tests/ixelles_direct_spawn_test.gd"
      - "grand-bruxelles-game/game/zones/ixelles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ixelles-sidewalk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/ixelles-sidewalk-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/ixelles-sidewalk-import.log; then exit 1; fi
      - name: Prove Ixelles LABO sidewalk contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/ixelles_midi_sidewalk_test.gd 2>&1 | tee /tmp/ixelles-sidewalk.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_MIDI_SIDEWALK_FAIL" /tmp/ixelles-sidewalk.log; then exit 1; fi
          grep -F "IXELLES_MIDI_SIDEWALK_OK" /tmp/ixelles-sidewalk.log
      - name: Capture player BEFORE
        shell: bash
        run: |
          set -o pipefail
          GB_IXELLES_MIDI_SIDEWALK=0 xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/ixelles-sidewalk-before.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/ixelles-sidewalk-before.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_midi_sidewalk_before.png
      - name: Capture player AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/ixelles-sidewalk-after.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/ixelles-sidewalk-after.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_midi_sidewalk_after.png
      - name: Require visible 1280x720 material change
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          root=Path('grand-bruxelles-game/artifacts/ixelles')
          before=Image.open(root/'ixelles_midi_sidewalk_before.png').convert('RGB')
          after=Image.open(root/'ixelles_midi_sidewalk_after.png').convert('RGB')
          assert before.size == (1280,720) and after.size == (1280,720)
          bp=before.load(); ap=after.load(); gt3=gt8=0; xs=[]; ys=[]
          for y in range(720):
            for x in range(1280):
              d=max(abs(ap[x,y][i]-bp[x,y][i]) for i in range(3))
              if d>3: gt3+=1
              if d>8: gt8+=1; xs.append(x); ys.append(y)
          total=1280*720
          report={'gt3_pixels':gt3,'gt8_pixels':gt8,'gt3_fraction':gt3/total,'gt8_fraction':gt8/total,'gt8_bbox':[min(xs),min(ys),max(xs),max(ys)] if xs else None}
          (root/'ixelles_midi_sidewalk_ab.json').write_text(json.dumps(report,indent=2)+'\n')
          print('IXELLES_MIDI_SIDEWALK_AB',report)
          if gt3/total < 0.0025 or gt8/total < 0.001:
            raise SystemExit('Ixelles sidewalk treatment is too weak in direct-player view')
          PY
      - name: Upload player witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-midi-sidewalk-1280x720
          path: |
            grand-bruxelles-game/artifacts/ixelles/ixelles_midi_sidewalk_before.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_midi_sidewalk_after.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_midi_sidewalk_ab.json
            /tmp/ixelles-sidewalk.log
            /tmp/ixelles-sidewalk-before.log
            /tmp/ixelles-sidewalk-after.log
          if-no-files-found: warn
