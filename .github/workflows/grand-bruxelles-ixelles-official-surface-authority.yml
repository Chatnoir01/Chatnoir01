name: Grand Bruxelles Ixelles Official Surface Authority

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_osm_road_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_ixelles_official_surface_authority_test.gd"
      - ".github/workflows/grand-bruxelles-ixelles-official-surface-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ixelles-official-surface-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/ixelles-authority-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/ixelles-authority-import.log; then exit 1; fi
      - name: Reject nested Ixelles official-surface authority clones
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_ixelles_official_surface_authority_test.gd 2>&1 | tee /tmp/ixelles-authority.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_IXELLES_OFFICIAL_SURFACE_AUTHORITY_FAIL" /tmp/ixelles-authority.log; then exit 1; fi
          grep -q "BRUSSELS_IXELLES_OFFICIAL_SURFACE_AUTHORITY_OK" /tmp/ixelles-authority.log
