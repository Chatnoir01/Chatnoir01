name: Grand Bruxelles Ixelles Shared Datum Neighbor DTM

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-shared-datum-neighbor-dtm.yml"
      - "grand-bruxelles-game/tools/materialize_ixelles_neighbor_dtm.py"
      - "grand-bruxelles-game/tests/test_materialize_ixelles_neighbor_dtm.py"
      - "grand-bruxelles-game/tools/measure_ixelles_dtm_2m_seams.py"
      - "grand-bruxelles-game/data/terrain/ixelles/ixelles_shared_vertical_datum.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169500-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169000-s500_dtm_2m.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169500-s500_dtm_2m.game.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ixelles-shared-datum-neighbor-dtm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic raster tooling
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 rasterio==1.4.3 pytest==8.4.1

      - name: Prove shared-datum regression
        run: pytest -q grand-bruxelles-game/tests/test_materialize_ixelles_neighbor_dtm.py grand-bruxelles-game/tests/test_measure_ixelles_dtm_2m_seams.py

      - name: Download and verify locked official UrbIS DTM archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ixelles-dtm/149168 /tmp/ixelles-dtm/149169
          curl -fL --retry 4 --retry-delay 3 -o /tmp/149168.zip https://urbisdownload.datastore.brussels/UrbIS/Grid/DTM/DTM2021/TIFF/DTM_31370_TIFF_149168_20211009_50.zip
          curl -fL --retry 4 --retry-delay 3 -o /tmp/149169.zip https://urbisdownload.datastore.brussels/UrbIS/Grid/DTM/DTM2021/TIFF/DTM_31370_TIFF_149169_20211009_50.zip
          echo "f0277df26876c6c7cd3e00050e3d3a44b420b2df4bf4271e680717adeabb09b4  /tmp/149168.zip" | sha256sum -c -
          echo "c8135aa8456a5f2de8efb2e05dbf9c993ae9c97e4aa7f4d56c6c331345bac4f8  /tmp/149169.zip" | sha256sum -c -
          unzip -q /tmp/149168.zip -d /tmp/ixelles-dtm/149168
          unzip -q /tmp/149169.zip -d /tmp/ixelles-dtm/149169

      - name: Discover readable official raster payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import rasterio
          out=[]
          for tile in ('149168','149169'):
              candidates=[]
              for p in sorted(Path('/tmp/ixelles-dtm', tile).rglob('*')):
                  if not p.is_file(): continue
                  try:
                      with rasterio.open(p) as ds:
                          if ds.count >= 1 and ds.width > 0 and ds.height > 0:
                              candidates.append(p)
                  except Exception:
                      pass
              if not candidates: raise SystemExit(f'No readable raster found for {tile}')
              out.append(str(candidates[0]))
          Path('/tmp/ixelles-raster-paths.txt').write_text('\n'.join(out)+'\n')
          PY

      - name: Generate three neighbor DTM contracts from one shared datum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RASTERS < /tmp/ixelles-raster-paths.txt
          test "${#RASTERS[@]}" -eq 2
          python grand-bruxelles-game/tools/materialize_ixelles_neighbor_dtm.py \
            --raster "${RASTERS[0]}" "${RASTERS[1]}" \
            --seed grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_dtm_2m.game.json \
            --datum grand-bruxelles-game/data/terrain/ixelles/ixelles_shared_vertical_datum.game.json \
            --output-dir grand-bruxelles-game/data/terrain/ixelles \
            --report /tmp/ixelles-shared-datum-neighbor-dtm-report.json

      - name: Enforce deterministic shared-datum hard gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.load(open('/tmp/ixelles-shared-datum-neighbor-dtm-report.json'))
          v=report['validation']
          assert report['reference_absolute_m'] == 62.393423
          assert report['target_cells'] == [
              'bxl-e149000-n169500-s500',
              'bxl-e149500-n169000-s500',
              'bxl-e149500-n169500-s500',
          ]
          assert v['seed_grid_max_abs_delta_m'] <= 0.0000005
          assert v['shared_edge_count'] == 4
          assert v['shared_edge_pairs'] == 1004
          assert v['max_abs_shared_edge_delta_m'] == 0.0
          assert v['max_relative_shared_edge_delta_m'] == 0.0
          for cell in report['target_cells']:
              p=json.loads(Path(f'grand-bruxelles-game/data/terrain/ixelles/{cell}_dtm_2m.game.json').read_text())
              assert p['schema']=='grand-bruxelles-ixelles-dtm-2m-runtime-candidate-v1'
              assert p['cell_id']==cell
              assert p['shape']==[251,251]
              assert p['sample_count']==63001
              assert p['spacing_m']==2.0
              assert len(p['heights_row_major_m'])==63001
              assert p['shared_vertical_datum']['reference_absolute_m']==62.393423
              assert p['runtime_approved'] is False
              assert p['promote_runtime'] is False
              print('IXELLES_SHARED_DATUM_CELL',cell,p['absolute_min_m'],p['absolute_max_m'],p['absolute_float64_sha256'])
          PY

      - name: Commit deterministic neighbor DTM contracts on PR head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169500-s500_dtm_2m.game.json \
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169000-s500_dtm_2m.game.json \
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169500-s500_dtm_2m.game.json
          if git diff --cached --quiet; then
            echo "Neighbor DTM contracts already deterministic"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(ixelles): lock shared-datum neighbor DTM candidates [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-shared-datum-neighbor-dtm
          path: |
            /tmp/ixelles-shared-datum-neighbor-dtm-report.json
            /tmp/ixelles-raster-paths.txt
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169500-s500_dtm_2m.game.json
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169000-s500_dtm_2m.game.json
            grand-bruxelles-game/data/terrain/ixelles/bxl-e149500-n169500-s500_dtm_2m.game.json
          if-no-files-found: warn
