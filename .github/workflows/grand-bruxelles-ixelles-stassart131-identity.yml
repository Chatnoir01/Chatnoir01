name: Grand Bruxelles Ixelles Stassart 131 Identity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-stassart131-identity.yml"
      - "grand-bruxelles-game/data/sources/ixelles/stassart_131_identity_cue.json"
      - "grand-bruxelles-game/game/zones/ixelles/ixelles_microslice_draped_intersection.gd"
      - "grand-bruxelles-game/game/tests/ixelles_stassart_131_identity_test.gd"
      - "grand-bruxelles-game/game/tests/ixelles_direct_spawn_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stassart-131-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and comparison dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed runtime cue
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/ixelles_stassart_131_identity_test.gd 2>&1 | tee /tmp/stassart131-identity.log
          if grep -E "SCRIPT ERROR|Parse Error:|IXELLES_STASSART131_IDENTITY_FAIL" /tmp/stassart131-identity.log; then exit 1; fi
          grep -F "IXELLES_STASSART131_IDENTITY_OK" /tmp/stassart131-identity.log
      - name: Capture direct-player baseline
        shell: bash
        run: |
          set -o pipefail
          GB_IXELLES_STASSART131_CUE=0 xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/stassart131-before.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/stassart131-before.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_stassart131_before.png
      - name: Capture direct-player treatment
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/ixelles_direct_spawn_test.gd 2>&1 | tee /tmp/stassart131-after.log
          grep -F "IXELLES_DIRECT_SPAWN_OK" /tmp/stassart131-after.log
          cp grand-bruxelles-game/artifacts/ixelles/ixelles_direct_player_1280x720.png grand-bruxelles-game/artifacts/ixelles/ixelles_stassart131_after.png
      - name: Require large normal-view impact
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          import json, hashlib
          from pathlib import Path
          root=Path('grand-bruxelles-game/artifacts/ixelles')
          before=Image.open(root/'ixelles_stassart131_before.png').convert('RGB')
          after=Image.open(root/'ixelles_stassart131_after.png').convert('RGB')
          if before.size != (1280,720) or after.size != (1280,720):
              raise SystemExit('A/B capture size drifted')
          bp=before.load(); ap=after.load(); meaningful=0; changed=0; xs=[]; ys=[]; total_abs=0
          for y in range(720):
              for x in range(1280):
                  d=max(abs(ap[x,y][i]-bp[x,y][i]) for i in range(3))
                  if d:
                      changed += 1
                      total_abs += sum(abs(ap[x,y][i]-bp[x,y][i]) for i in range(3))
                  if d >= 12:
                      meaningful += 1; xs.append(x); ys.append(y)
          bbox=[min(xs),min(ys),max(xs),max(ys)] if xs else None
          report={
            'meaningful_pixels_threshold_12': meaningful,
            'changed_pixels': changed,
            'meaningful_bbox': bbox,
            'mean_abs_rgb_over_changed': (total_abs/(changed*3.0) if changed else 0.0),
            'minimum_meaningful_pixels': 40000,
            'minimum_bbox_width': 180,
            'minimum_bbox_height': 120,
            'before_sha256': hashlib.sha256((root/'ixelles_stassart131_before.png').read_bytes()).hexdigest(),
            'after_sha256': hashlib.sha256((root/'ixelles_stassart131_after.png').read_bytes()).hexdigest()
          }
          (root/'ixelles_stassart131_ab.json').write_text(json.dumps(report,indent=2)+'\n')
          print('IXELLES_STASSART131_AB',report)
          if meaningful < 40000:
              raise SystemExit('cue does not clear the large-screen-area gate')
          if bbox is None or bbox[2]-bbox[0] < 180 or bbox[3]-bbox[1] < 120:
              raise SystemExit('cue bbox is not large enough in normal player view')
          PY
      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-stassart131-identity-ab
          path: |
            grand-bruxelles-game/artifacts/ixelles/ixelles_stassart131_before.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_stassart131_after.png
            grand-bruxelles-game/artifacts/ixelles/ixelles_stassart131_ab.json
            /tmp/stassart131-identity.log
            /tmp/stassart131-before.log
            /tmp/stassart131-after.log
          if-no-files-found: warn
