name: Grand Bruxelles Ixelles Strong Height Runtime Candidates

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-strong-height-runtime-candidates.yml"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/cell.game.json"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize-strong-heights:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_ARTIFACT_ID: "9146758228"
      SOURCE_ARTIFACT_SHA256: "b55b24ad1ccd8f5067751d3df04cc12d8a31dc804d19f760e29be9bc0ef04402"
      SOURCE_PR: "103"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Download locked merged-PR comparison artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/ixelles-height-evidence.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          echo "${SOURCE_ARTIFACT_SHA256}  /tmp/ixelles-height-evidence.zip" | sha256sum -c -
          rm -rf /tmp/ixelles-height-evidence && mkdir /tmp/ixelles-height-evidence
          unzip -q /tmp/ixelles-height-evidence.zip -d /tmp/ixelles-height-evidence
          test -f /tmp/ixelles-height-evidence/evidence.json
      - name: Intersect only already-strong validation candidates with selected runtime footprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          evidence=json.loads(Path('/tmp/ixelles-height-evidence/evidence.json').read_text())
          cell_path=Path('grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/cell.game.json')
          cell=json.loads(cell_path.read_text())
          runtime_ids={b['id'] for b in cell['buildings']}
          strong=[]
          for r in evidence['records']:
              if not r.get('strong_validation_candidate'):
                  continue
              if r['building_id'] not in runtime_ids:
                  continue
              assert r['agreement']=='strong'
              assert r['dsm_confidence']=='high'
              assert float(r['abs_delta_m']) <= 2.0
              assert float(r['semantic_match_score']) >= 0.90
              assert float(r['semantic_match_margin']) >= 0.25
              assert r['runtime_approved'] is False
              strong.append({
                  'building_id': r['building_id'],
                  'busolid_id': r['busolid_id'],
                  'semantic_height_m': round(float(r['semantic_height_m']),6),
                  'dsm_height_p50_m': round(float(r['dsm_height_p50_m']),6),
                  'dsm_height_p75_m': round(float(r['dsm_height_p75_m']),6),
                  'abs_delta_m': round(float(r['abs_delta_m']),6),
                  'semantic_match_score': float(r['semantic_match_score']),
                  'semantic_match_margin': float(r['semantic_match_margin']),
                  'visual_runtime_eligible': True,
                  'runtime_approved': False,
              })
          strong.sort(key=lambda r:r['building_id'])
          assert len(strong) >= 200, f'unexpectedly small runtime intersection: {len(strong)}'
          payload={
              'schema':'grand-bruxelles-ixelles-strong-height-candidates-v1',
              'cell_id':'bxl-e149000-n169000-s500',
              'bbox_epsg31370':[149000.0,169000.0,149500.0,169500.0],
              'policy':{
                  'source_pr':103,
                  'source_artifact_id':9146758228,
                  'source_artifact_sha256':'b55b24ad1ccd8f5067751d3df04cc12d8a31dc804d19f760e29be9bc0ef04402',
                  'semantic_source':'UrbIS 3D ROOFSURFACE median Z - GROUNDSURFACE median Z',
                  'secondary_source':'corrected DSM-DTM building evidence',
                  'max_abs_delta_m':2.0,
                  'required_dsm_confidence':'high',
                  'min_semantic_match_score':0.90,
                  'min_semantic_match_margin':0.25,
              },
              'runtime_footprint_count':len(runtime_ids),
              'eligible_count':len(strong),
              'records':strong,
              'runtime_approved':False,
              'purpose':'bounded deterministic visual-runtime candidate massing only; conflicts remain absent',
          }
          out=Path('grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps({'eligible_count':len(strong),'runtime_footprints':len(runtime_ids)},sort_keys=True))
          PY
      - name: Commit deterministic strong-height contract when changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TARGET=grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json
          if git diff --quiet -- "$TARGET" && git ls-files --error-unmatch "$TARGET" >/dev/null 2>&1; then
            echo "Strong-height contract already deterministic"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "data(ixelles): materialize strong source-backed height candidates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload strong-height contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixelles-strong-height-runtime-candidates
          path: grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json
          if-no-files-found: warn
