name: Grand Bruxelles Ixelles Visible Frontage Discovery

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-ixelles-visible-frontage-discovery.yml"
      - "grand-bruxelles-game/data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/cell.game.json"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/network.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank-visible-frontages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rank strong-source buildings in shipped Ixelles player cone
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path
          root=Path('grand-bruxelles-game')
          strong=json.loads((root/'data/terrain/ixelles/bxl-e149000-n169000-s500_strong_heights.game.json').read_text())
          cell=json.loads((root/'data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/cell.game.json').read_text())
          network=json.loads((root/'data/urbis/remaining_brussels/cells/bxl-e149000-n169000-s500/runtime/network.game.json').read_text())
          def dicts(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from dicts(v)
              elif isinstance(obj,list):
                  for v in obj: yield from dicts(v)
          def normalized_id(value):
              if value is None: return None
              s=str(value)
              if s.isdigit(): return s
              m=re.search(r'(?:physicalbuilding|building|footprint)[/:_-]?(\d+)$',s,re.I)
              return m.group(1) if m else None
          def ident(d):
              for k in ('building_id','source_building_id','physical_building_id','footprint_id','id','source_id','source_ref'):
                  if k in d:
                      bid=normalized_id(d[k])
                      if bid: return bid
              for k,v in d.items():
                  if any(token in str(k).lower() for token in ('building','footprint')):
                      bid=normalized_id(v)
                      if bid: return bid
              return None
          records=strong.get('records',[])
          strong_ids={ident(d) for d in records if isinstance(d,dict)}-{None}
          strong_by_id={ident(d):d for d in records if isinstance(d,dict) and ident(d)}
          print('STRONG_ID_COUNT',len(strong_ids),'ELIGIBLE_COUNT',strong.get('eligible_count'))
          axes={str(a.get('id')):a for a in network.get('street_axes',[]) if isinstance(a,dict)}
          ca=axes['https://databrussels.be/id/streetaxe/71374:1']['points']; ta=axes['https://databrussels.be/id/streetaxe/71306:2']['points']; t=.68
          cam=(ca[0][0]+(ca[1][0]-ca[0][0])*t,ca[0][1]+(ca[1][1]-ca[0][1])*t); target=tuple(map(float,ta[1]))
          view=(target[0]-cam[0],target[1]-cam[1]); vl=math.hypot(*view); view=(view[0]/vl,view[1]/vl)
          print('CAMERA_XZ',cam,'TARGET_XZ',target)
          def points_from(d):
              for k in ('polygon','footprint','points'):
                  v=d.get(k)
                  if isinstance(v,list) and len(v)>=3 and all(isinstance(p,list) and len(p)>=2 and all(isinstance(q,(int,float)) for q in p[:2]) for p in v):
                      return [(float(p[0]),float(p[1])) for p in v]
              return []
          rows=[]; seen=set()
          for d in dicts(cell):
              bid=ident(d); pts=points_from(d)
              if not bid or bid in seen or not pts or bid not in strong_ids: continue
              seen.add(bid); cx=sum(x for x,z in pts)/len(pts); cz=sum(z for x,z in pts)/len(pts); vx,vz=cx-cam[0],cz-cam[1]; dist=math.hypot(vx,vz)
              if dist<1e-6: continue
              dot=max(-1.0,min(1.0,(vx*view[0]+vz*view[1])/dist)); angle=math.degrees(math.acos(dot)); vals=[]
              for x,z in pts:
                  qx,qz=x-cam[0],z-cam[1]; qd=math.hypot(qx,qz)
                  if qd<1e-6: continue
                  qdot=max(-1.0,min(1.0,(qx*view[0]+qz*view[1])/qd)); sign=1.0 if view[0]*qz-view[1]*qx>=0 else -1.0; vals.append(sign*math.degrees(math.acos(qdot)))
              amin=min(vals) if vals else angle; amax=max(vals) if vals else angle; intersects=(amin<=45.0 and amax>=-45.0)
              rows.append((not intersects,dist,angle,bid,amin,amax,pts,d,strong_by_id.get(bid,{})))
          rows.sort()
          print('STRONG_CELL_FOOTPRINT_COUNT',len(rows))
          for r in rows[:12]:
              print('VISIBLE_STRONG_CANDIDATE',json.dumps({'id':r[3],'distance_m':round(r[1],2),'center_angle_deg':round(r[2],2),'span_deg':[round(r[4],2),round(r[5],2)],'points':r[6],'cell_keys':sorted(r[7].keys()),'strong_record':r[8]},ensure_ascii=False,sort_keys=True))
          if len(strong_ids)!=int(strong.get('eligible_count',-1)): raise SystemExit('Strong-height identifier extraction drifted')
          if not rows or not any(not r[0] for r in rows): raise SystemExit('No strong-source building intersects direct-player view cone')
          PY
