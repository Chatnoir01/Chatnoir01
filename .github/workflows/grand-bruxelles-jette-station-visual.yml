name: Grand Bruxelles Jette Station Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-jette-station-visual.yml"
      - "grand-bruxelles-game/game/zones/laeken_jette/jette_phase2.tscn"
      - "grand-bruxelles-game/game/zones/laeken_jette/jette_station_visual_pass.gd"
      - "grand-bruxelles-game/game/tests/jette_station_visual_test.gd"
      - "grand-bruxelles-game/game/tests/render_jette_station_visual_capture.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/jette_phase2_preview.tscn"
      - "grand-bruxelles-game/data/urbis/laeken_jette/jette_phase2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jette-station-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/jette-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/jette-import.log; then exit 1; fi

      - name: Validate Jette station articulation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/jette_station_visual_test.gd 2>&1 | tee /tmp/jette-station-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|JETTE_STATION_VISUAL_FAIL" /tmp/jette-station-visual.log; then exit 1; fi
          grep -F "JETTE_STATION_VISUAL_TEST_OK" /tmp/jette-station-visual.log

      - name: Capture Jette station witness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --script res://game/tests/render_jette_station_visual_capture.gd

      - uses: actions/upload-artifact@v4
        with:
          name: jette-station-visual-witness
          path: grand-bruxelles-game/artifacts/visual/jette_station_visual_1280x720.png
