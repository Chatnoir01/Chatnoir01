name: Grand Bruxelles Jette UrbIS Finish

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-jette-urbis-finish.yml"
      - "grand-bruxelles-game/game/scripts/brussels_urbis_finish_material.gd"
      - "grand-bruxelles-game/game/scripts/brussels_urbis_finish_runtime.gd"
      - "grand-bruxelles-game/game/tests/jette_urbis_finish_runtime_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jette-urbis-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/jette-finish-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/jette-finish-import.log; then exit 1; fi
      - name: Validate Jette UrbIS finish and capture A/B
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/jette_urbis_finish_runtime_test.gd 2>&1 | tee /tmp/jette-finish.log
          if grep -E "SCRIPT ERROR|Parse Error:|JETTE_URBIS_FINISH_FAIL" /tmp/jette-finish.log; then exit 1; fi
          grep -q "JETTE_URBIS_FINISH_OK" /tmp/jette-finish.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jette-urbis-finish-ab
          path: |
            grand-bruxelles-game/artifacts/visual/jette_urbis_finish_before.png
            grand-bruxelles-game/artifacts/visual/jette_urbis_finish_after.png
          if-no-files-found: error
