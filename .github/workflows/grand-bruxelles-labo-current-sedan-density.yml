name: Grand Bruxelles LABO Current Sedan Density

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_manager_rgsdev_vehicle_extension.gd"
      - "grand-bruxelles-game/game/tests/labo_current_sedan_density_test.gd"
      - "grand-bruxelles-game/game/tests/labo_vehicle_screen_tile_probe_test.gd"
      - ".github/workflows/grand-bruxelles-labo-current-sedan-density.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate LABO current sedan density
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/labo_current_sedan_density_test.gd 2>&1 | tee /tmp/labo-current-sedan-density.log
          if grep -E "SCRIPT ERROR|Parse Error:|LABO_CURRENT_SEDAN_DENSITY_FAIL" /tmp/labo-current-sedan-density.log; then exit 1; fi
          grep -F "LABO_CURRENT_SEDAN_DENSITY_OK" /tmp/labo-current-sedan-density.log
      - name: Identify vehicle intersecting frozen Performance tile 79
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/labo_vehicle_screen_tile_probe_test.gd 2>&1 | tee /tmp/labo-vehicle-screen-tile-probe.log
          if grep -E "SCRIPT ERROR|Parse Error:|LABO_VEHICLE_SCREEN_TILE_PROBE_FAIL" /tmp/labo-vehicle-screen-tile-probe.log; then exit 1; fi
          grep -F "LABO_VEHICLE_SCREEN_TILE_PROBE_OK" /tmp/labo-vehicle-screen-tile-probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: labo-current-sedan-density-log
          path: |
            /tmp/labo-current-sedan-density.log
            /tmp/labo-vehicle-screen-tile-probe.log
          if-no-files-found: error
