name: Grand Bruxelles Laeken Heysel Atomium Camera Candidates

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/data/reference/laeken_jette/heysel_stadium_target_evidence.json"
      - "grand-bruxelles-game/data/reference/laeken_jette/heysel_stadium_camera_candidates.json"
      - "grand-bruxelles-game/data/reference/laeken_jette/anchors.json"
      - "grand-bruxelles-game/game/tests/render_heysel_atomium_camera_candidates.gd"
      - "grand-bruxelles-game/tools/validate_heysel_atomium_camera_candidates.py"
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-heysel-atomium-camera-candidates.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/reference/laeken_jette/heysel_stadium_target_evidence.json"
      - "grand-bruxelles-game/data/reference/laeken_jette/heysel_stadium_camera_candidates.json"
      - "grand-bruxelles-game/data/reference/laeken_jette/anchors.json"
      - "grand-bruxelles-game/game/tests/render_heysel_atomium_camera_candidates.gd"
      - "grand-bruxelles-game/tools/validate_heysel_atomium_camera_candidates.py"
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-heysel-atomium-camera-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Validate source-backed provisional cameras
        run: python3 grand-bruxelles-game/tools/validate_heysel_atomium_camera_candidates.py

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 imagemagick

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Render both provisional Atomium observation levels
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --script res://game/tests/render_heysel_atomium_camera_candidates.gd 2>&1 | tee /tmp/heysel-camera.log
          if grep -E "SCRIPT ERROR|Parse Error:|HEYSEL_CAMERA_CAPTURE_FAIL" /tmp/heysel-camera.log; then exit 1; fi
          grep -q "HEYSEL_CAMERA_CAPTURE_OK" /tmp/heysel-camera.log
          test -s grand-bruxelles-game/heysel_from_atomium_92m_v1.png
          test -s grand-bruxelles-game/heysel_from_atomium_36m_v1.png
          identify grand-bruxelles-game/heysel_from_atomium_92m_v1.png
          identify grand-bruxelles-game/heysel_from_atomium_36m_v1.png

      - name: Upload comparison captures
        uses: actions/upload-artifact@v4
        with:
          name: heysel-atomium-camera-candidates
          path: |
            grand-bruxelles-game/heysel_from_atomium_92m_v1.png
            grand-bruxelles-game/heysel_from_atomium_36m_v1.png
          if-no-files-found: error
          retention-days: 14
