name: Grand Bruxelles Laeken Heysel Stadium Audit

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/data/urbis/laeken_jette/buildings.geojson"
      - "grand-bruxelles-game/tools/audit_heysel_stadium_urbis_candidates.py"
      - "grand-bruxelles-game/tools/tests/test_audit_heysel_stadium_urbis_candidates.py"
      - ".github/workflows/grand-bruxelles-laeken-heysel-stadium-audit.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/laeken_jette/buildings.geojson"
      - "grand-bruxelles-game/tools/audit_heysel_stadium_urbis_candidates.py"
      - "grand-bruxelles-game/tools/tests/test_audit_heysel_stadium_urbis_candidates.py"
      - ".github/workflows/grand-bruxelles-laeken-heysel-stadium-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-stadium-target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test geometry audit
        run: python3 grand-bruxelles-game/tools/tests/test_audit_heysel_stadium_urbis_candidates.py
      - name: Audit real UrbIS candidates
        run: |
          python3 grand-bruxelles-game/tools/audit_heysel_stadium_urbis_candidates.py \
            --output /tmp/heysel_stadium_urbis_candidates.json \
            | tee /tmp/heysel_stadium_audit.log
          grep -q "HEYSEL_STADIUM_URBIS_AUDIT_OK" /tmp/heysel_stadium_audit.log
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: heysel-stadium-urbis-candidate-audit
          path: /tmp/heysel_stadium_urbis_candidates.json
          if-no-files-found: error
