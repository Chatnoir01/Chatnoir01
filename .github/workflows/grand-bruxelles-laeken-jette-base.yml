name: Grand Bruxelles Laeken Jette Base Integration

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-laeken-jette-base.yml"
      - "grand-bruxelles-game/data/urbis/laeken_jette/**"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_osm_outline.game.json"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette_zone.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette_authoritative_base.tscn"
      - "grand-bruxelles-game/game/tests/laeken_jette_base_smoke_test.gd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-laeken-jette-base-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-base-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed source manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('grand-bruxelles-game/data/urbis/laeken_jette/manifest.json')
          d=json.loads(p.read_text())
          assert d['source_crs']=='EPSG:31370'
          expected={'buildings':9518,'street_surfaces':3572,'street_axes':955,'tram_network':326,'train_network':326,'bridges':15,'tunnels':10}
          got={k:int(v['features']) for k,v in d['layers'].items()}
          assert got==expected,(got,expected)
          for layer,v in d['layers'].items():
              assert (p.parent/v['raw']).exists(), (layer,v['raw'])
              assert (p.parent/v['game']).exists(), (layer,v['game'])
          print('LAEKEN_JETTE_MANIFEST_OK',got)
          PY
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Run authoritative base smoke
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/laeken_jette_base_smoke_test.gd 2>&1 | tee /tmp/laeken-jette-base.log
          if grep -q "LAEKEN_JETTE_BASE_SMOKE_FAIL" /tmp/laeken-jette-base.log; then exit 1; fi
          grep -q "LAEKEN_JETTE_BASE_SMOKE_OK" /tmp/laeken-jette-base.log
