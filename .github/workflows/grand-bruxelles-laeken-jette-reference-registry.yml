name: Grand Bruxelles Laeken Jette Reference Registry

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/data/reference/laeken_jette/**"
      - "grand-bruxelles-game/data/sources/laeken_jette/building_height_integration_validation.json"
      - "grand-bruxelles-game/tools/validate_laeken_jette_reference_registry.py"
      - "grand-bruxelles-game/tools/audit_atomium_ground_framing.py"
      - "grand-bruxelles-game/tests/test_laeken_photo_match_consistency.py"
      - ".github/workflows/grand-bruxelles-laeken-jette-reference-registry.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/reference/laeken_jette/**"
      - "grand-bruxelles-game/data/sources/laeken_jette/building_height_integration_validation.json"
      - "grand-bruxelles-game/tools/validate_laeken_jette_reference_registry.py"
      - "grand-bruxelles-game/tools/audit_atomium_ground_framing.py"
      - "grand-bruxelles-game/tests/test_laeken_photo_match_consistency.py"
      - ".github/workflows/grand-bruxelles-laeken-jette-reference-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reference-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate realism provenance and measured-state claims
        run: python3 grand-bruxelles-game/tools/validate_laeken_jette_reference_registry.py
      - name: Regenerate Atomium framing geometry evidence
        run: |
          cd grand-bruxelles-game
          python3 tools/audit_atomium_ground_framing.py --output /tmp/atomium_ground_framing_audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          committed = json.loads(Path('data/reference/laeken_jette/atomium_ground_framing_audit.json').read_text(encoding='utf-8'))
          regenerated = json.loads(Path('/tmp/atomium_ground_framing_audit.json').read_text(encoding='utf-8'))
          if committed != regenerated:
              print('ATOMIUM_FRAMING_EVIDENCE_STALE')
              print('committed=', json.dumps(committed, indent=2, sort_keys=True))
              print('regenerated=', json.dumps(regenerated, indent=2, sort_keys=True))
              raise SystemExit(1)
          print('ATOMIUM_FRAMING_EVIDENCE_OK')
          PY
      - name: Lock photo-match capture/finding consistency
        run: python3 grand-bruxelles-game/tests/test_laeken_photo_match_consistency.py
