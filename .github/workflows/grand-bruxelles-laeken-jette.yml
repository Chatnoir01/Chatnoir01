name: Grand Bruxelles Laeken Jette Zone

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - ".github/workflows/grand-bruxelles-laeken-jette.yml"
      - "grand-bruxelles-game/tools/fetch_urbis_laeken_jette.py"
      - "grand-bruxelles-game/tools/validate_laeken_jette_data.py"
      - "grand-bruxelles-game/data/reference/laeken_jette/**"
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - "grand-bruxelles-game/game/tests/laeken_jette_smoke_test.gd"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-laeken-jette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dedicated zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Validate zone Python tools
        run: |
          python3 -m py_compile \
            grand-bruxelles-game/tools/fetch_urbis_laeken_jette.py \
            grand-bruxelles-game/tools/validate_laeken_jette_data.py \
            grand-bruxelles-game/tools/lambert72_to_game_geojson.py

      - name: Fetch official UrbIS Bockstael Heysel Atomium slice
        working-directory: grand-bruxelles-game
        run: |
          rm -rf data/urbis/laeken_jette
          python3 tools/fetch_urbis_laeken_jette.py

      - name: Validate official clipped geometry
        working-directory: grand-bruxelles-game
        run: python3 tools/validate_laeken_jette_data.py

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Run isolated Laeken Jette Godot smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/laeken_jette_smoke_test.gd 2>&1 | tee /tmp/laeken-jette-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_JETTE_SMOKE_FAIL" /tmp/laeken-jette-smoke.log; then
            exit 1
          fi
          grep -q "LAEKEN_JETTE_SMOKE_OK" /tmp/laeken-jette-smoke.log

      - name: Commit exact clipped UrbIS data to zone branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/urbis/laeken_jette
          if git diff --cached --quiet; then
            echo "Laeken/Jette UrbIS slice already up to date."
          else
            git commit -m "data: refresh Laeken Jette UrbIS phase 1 [skip ci]"
            git push origin HEAD:zone-laeken-jette
          fi
