name: Grand Bruxelles Laeken Official Trees Smoke

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_official_trees.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette.tscn"
      - "grand-bruxelles-game/game/tests/laeken_official_trees_smoke_test.gd"
      - "grand-bruxelles-game/data/environment/laeken_jette/official_city_trees.game.json"
      - "grand-bruxelles-game/data/reference/laeken_jette/atomium_ground_foreground_inventory.json"
      - ".github/workflows/grand-bruxelles-laeken-official-trees-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Validate official tree population
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/laeken_official_trees_smoke_test.gd 2>&1 | tee /tmp/laeken-trees.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_OFFICIAL_TREES_FAIL" /tmp/laeken-trees.log; then
            exit 1
          fi
          grep -q "LAEKEN_OFFICIAL_TREES_OK" /tmp/laeken-trees.log
