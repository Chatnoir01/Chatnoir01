name: Grand Bruxelles Laeken Palais 5 Hero

on:
  push:
    branches:
      - "zone-laeken-jette"
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_palais5_hero_pass.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette.tscn"
      - "grand-bruxelles-game/game/tests/laeken_palais5_hero_smoke_test.gd"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_hero_provenance.json"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_osm_outline.game.json"
      - "grand-bruxelles-game/data/terrain/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-palais5-hero.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_palais5_hero_pass.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette.tscn"
      - "grand-bruxelles-game/game/tests/laeken_palais5_hero_smoke_test.gd"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_hero_provenance.json"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_osm_outline.game.json"
      - "grand-bruxelles-game/data/terrain/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-palais5-hero.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-palais5-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/palais5-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/palais5-import.log; then exit 1; fi
      - name: Validate sourced Palais 5 hero geometry
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/laeken_palais5_hero_smoke_test.gd 2>&1 | tee /tmp/palais5-hero.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_PALAIS5_HERO_FAIL" /tmp/palais5-hero.log; then exit 1; fi
          grep -q "LAEKEN_PALAIS5_HERO_OK" /tmp/palais5-hero.log
