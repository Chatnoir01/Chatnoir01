name: Grand Bruxelles Laeken Published Capture

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - "grand-bruxelles-game/game/tests/render_laeken_playtest_capture.gd"
      - "grand-bruxelles-game/data/urbis/laeken_jette/building_heights_dsm.game.json"
      - "grand-bruxelles-game/data/terrain/laeken_jette/**"
      - "grand-bruxelles-game/data/orthophoto/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-playtest-capture-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-laeken-published-capture
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout latest zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Render actual player camera
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --script res://game/tests/render_laeken_playtest_capture.gd 2>&1 | tee /tmp/capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYTEST_CAPTURE_FAIL" /tmp/capture.log; then
            exit 1
          fi
          grep -q "PLAYTEST_CAPTURE_OK" /tmp/capture.log
          grep -q "LAEKEN_BUILDING_HEIGHTS_READY" /tmp/capture.log
          test -s grand-bruxelles-game/laeken_playtest_current.png

      - name: Publish capture from latest branch head
        run: |
          mkdir -p /tmp/laeken-capture
          cp grand-bruxelles-game/laeken_playtest_current.png /tmp/laeken-capture/laeken_playtest_current.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin zone-laeken-jette
          git reset --hard origin/zone-laeken-jette
          mkdir -p grand-bruxelles-game/data/reference/laeken_jette/captures
          cp /tmp/laeken-capture/laeken_playtest_current.png \
            grand-bruxelles-game/data/reference/laeken_jette/captures/laeken_playtest_current.png
          git add -f grand-bruxelles-game/data/reference/laeken_jette/captures/laeken_playtest_current.png
          git diff --cached --quiet && exit 0
          git commit -m "visual: publish current Laeken player-camera capture [skip ci]"
          git push origin HEAD:zone-laeken-jette
