name: Grand Bruxelles Laeken Playtest Capture

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - "grand-bruxelles-game/game/tests/render_laeken_playtest_capture.gd"
      - "grand-bruxelles-game/data/terrain/laeken_jette/**"
      - ".github/workflows/grand-bruxelles-laeken-playtest-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-laeken-playtest-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Render actual playable camera
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --script res://game/tests/render_laeken_playtest_capture.gd 2>&1 | tee /tmp/capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYTEST_CAPTURE_FAIL" /tmp/capture.log; then
            exit 1
          fi
          grep -q "PLAYTEST_CAPTURE_OK" /tmp/capture.log
          test -s grand-bruxelles-game/laeken_playtest_current.png

      - name: Upload playable capture
        uses: actions/upload-artifact@v4
        with:
          name: laeken-playtest-current
          path: grand-bruxelles-game/laeken_playtest_current.png
          if-no-files-found: error
          retention-days: 7
