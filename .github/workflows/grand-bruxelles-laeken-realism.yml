name: Grand Bruxelles Laeken Realism

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/**"
      - "grand-bruxelles-game/game/tests/laeken_realism_smoke_test.gd"
      - "grand-bruxelles-game/game/tests/laeken_terrain_smoke_test.gd"
      - "grand-bruxelles-game/game/tests/laeken_building_visual_smoke_test.gd"
      - "grand-bruxelles-game/data/urbis/laeken_jette/**"
      - "grand-bruxelles-game/data/sources/laeken_jette/rail_layer_overlap_audit.json"
      - "grand-bruxelles-game/data/terrain/laeken_jette/**"
      - "grand-bruxelles-game/data/orthophoto/laeken_jette/**"
      - "grand-bruxelles-game/tools/audit_laeken_rail_layer_overlap.py"
      - ".github/workflows/grand-bruxelles-laeken-realism.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realism-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Audit authoritative rail layer overlap
        run: |
          python3 grand-bruxelles-game/tools/audit_laeken_rail_layer_overlap.py --check

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Run realism smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/laeken_realism_smoke_test.gd 2>&1 | tee /tmp/laeken-realism.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_REALISM_SMOKE_FAIL" /tmp/laeken-realism.log; then
            exit 1
          fi
          grep -q "LAEKEN_REALISM_SMOKE_OK" /tmp/laeken-realism.log

      - name: Run official terrain smoke test when DTM runtime exists
        shell: bash
        run: |
          if test ! -f grand-bruxelles-game/data/terrain/laeken_jette/atomium_dtm.game.json; then
            echo "Official DTM runtime not committed yet; terrain smoke deferred."
            exit 0
          fi
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/laeken_terrain_smoke_test.gd 2>&1 | tee /tmp/laeken-terrain.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_TERRAIN_SMOKE_FAIL" /tmp/laeken-terrain.log; then
            exit 1
          fi
          grep -q "LAEKEN_TERRAIN_SMOKE_OK" /tmp/laeken-terrain.log

      - name: Run building visual smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/laeken_building_visual_smoke_test.gd 2>&1 | tee /tmp/laeken-buildings.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_BUILDING_VISUAL_FAIL" /tmp/laeken-buildings.log; then
            exit 1
          fi
          grep -q "LAEKEN_BUILDING_VISUAL_OK" /tmp/laeken-buildings.log
