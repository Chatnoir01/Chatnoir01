name: Grand Bruxelles Laeken Restore Height Runtime

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - ".github/workflows/grand-bruxelles-laeken-restore-height-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette
          fetch-depth: 0

      - name: Restore exact validated DSM runtime blob
        run: |
          set -euo pipefail
          VALIDATED_COMMIT=3583c352cb2896b3cff7f76909db5a7dcf07410a
          PATH_TO_FILE=grand-bruxelles-game/data/urbis/laeken_jette/building_heights_dsm.game.json
          git cat-file -e "$VALIDATED_COMMIT:$PATH_TO_FILE"
          git show "$VALIDATED_COMMIT:$PATH_TO_FILE" > /tmp/building_heights_dsm.game.json
          python3 - <<'PY'
          import json
          p='/tmp/building_heights_dsm.game.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['feature_count']==9518,d['feature_count']
          assert len(d['records'])==9518,len(d['records'])
          assert d['derived_height_count']==9163,d['derived_height_count']
          assert d['quality_counts']=={'high':7357,'medium':1136,'low':670,'insufficient':355,'outside':0},d['quality_counts']
          print('VALIDATED_HEIGHT_RUNTIME_RESTORED',d['derived_height_median_m'],d['derived_height_max_m'])
          PY

      - name: Publish restored runtime from latest branch head
        run: |
          cp /tmp/building_heights_dsm.game.json /tmp/validated-heights.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-anchor on the branch head immediately before publication so an
          # older workflow cannot silently erase newer Laeken work.
          git fetch origin zone-laeken-jette
          git reset --hard origin/zone-laeken-jette
          mkdir -p grand-bruxelles-game/data/urbis/laeken_jette
          cp /tmp/validated-heights.json grand-bruxelles-game/data/urbis/laeken_jette/building_heights_dsm.game.json
          git add -f grand-bruxelles-game/data/urbis/laeken_jette/building_heights_dsm.game.json
          git diff --cached --quiet && exit 0
          git commit -m "data: restore validated Laeken DSM height runtime [skip ci]"
          git push origin HEAD:zone-laeken-jette
