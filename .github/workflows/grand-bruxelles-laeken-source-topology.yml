name: Grand Bruxelles Laeken Source Topology

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_jette_zone.gd"
      - "grand-bruxelles-game/game/zones/laeken_jette/laeken_building_height_pass.gd"
      - "grand-bruxelles-game/game/tests/laeken_jette_smoke_test.gd"
      - "grand-bruxelles-game/game/tests/laeken_building_heights_smoke_test.gd"
      - "grand-bruxelles-game/data/urbis/laeken_jette/buildings.game.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/building_heights_dsm.game.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/building_height_landmark_overrides.game.json"
      - "grand-bruxelles-game/data/urbis/laeken_jette/street_surfaces.game.json"
      - "grand-bruxelles-game/data/sources/laeken_jette/palais5_osm_outline.game.json"
      - ".github/workflows/grand-bruxelles-laeken-source-topology.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-laeken-source-topology
  cancel-in-progress: true

jobs:
  topology:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/laeken-topology-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/laeken-topology-import.log; then
            tail -n 40 /tmp/laeken-topology-import.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Prove UrbIS source holes and Palais 5 cutout
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/laeken_jette_smoke_test.gd 2>&1 | tee /tmp/laeken-topology-source.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_JETTE_SMOKE_FAIL" /tmp/laeken-topology-source.log; then
            tail -n 60 /tmp/laeken-topology-source.log | sed 's/^/::error::/'
            exit 1
          fi
          if ! grep -q "LAEKEN_JETTE_SMOKE_OK" /tmp/laeken-topology-source.log || ! grep -Eq "holes=[1-9][0-9]* palais5_cutouts=1" /tmp/laeken-topology-source.log; then
            tail -n 60 /tmp/laeken-topology-source.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Prove final DSM roof keeps every Expo void empty
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/laeken_building_heights_smoke_test.gd 2>&1 | tee /tmp/laeken-topology-dsm.log
          if grep -E "SCRIPT ERROR|Parse Error:|LAEKEN_BUILDING_HEIGHTS_FAIL" /tmp/laeken-topology-dsm.log; then
            tail -n 80 /tmp/laeken-topology-dsm.log | sed 's/^/::error::/'
            exit 1
          fi
          if ! grep -q "LAEKEN_BUILDING_HEIGHTS_OK" /tmp/laeken-topology-dsm.log || ! grep -Eq "expo_roofs=[1-9][0-9]* .*forbidden_overlap=0" /tmp/laeken-topology-dsm.log; then
            tail -n 80 /tmp/laeken-topology-dsm.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Upload topology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laeken-source-topology-diagnostics
          path: |
            /tmp/laeken-topology-import.log
            /tmp/laeken-topology-source.log
            /tmp/laeken-topology-dsm.log
          if-no-files-found: warn
          retention-days: 7
