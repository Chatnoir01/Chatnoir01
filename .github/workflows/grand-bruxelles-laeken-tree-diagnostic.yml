name: Grand Bruxelles Laeken Height Visual Diagnostic

on:
  push:
    branches: ["zone-laeken-jette"]
    paths:
      - ".github/workflows/grand-bruxelles-laeken-tree-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-laeken-jette

      - name: Install Godot and import resources
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit

      - name: Capture building height output
        shell: bash
        run: |
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/laeken_building_heights_smoke_test.gd > /tmp/laeken-height-diagnostic.log 2>&1
          echo "godot_exit_status=$?" >> /tmp/laeken-height-diagnostic.log
          cat /tmp/laeken-height-diagnostic.log
          exit 0

      - name: Capture building visual output
        shell: bash
        run: |
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/laeken_building_visual_smoke_test.gd > /tmp/laeken-visual-diagnostic.log 2>&1
          echo "godot_exit_status=$?" >> /tmp/laeken-visual-diagnostic.log
          cat /tmp/laeken-visual-diagnostic.log
          exit 0

      - name: Publish diagnostics from latest branch head
        run: |
          cp /tmp/laeken-height-diagnostic.log /tmp/height.log
          cp /tmp/laeken-visual-diagnostic.log /tmp/visual.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin zone-laeken-jette
          git reset --hard origin/zone-laeken-jette
          mkdir -p grand-bruxelles-game/data/sources/laeken_jette/diagnostics
          cp /tmp/height.log grand-bruxelles-game/data/sources/laeken_jette/diagnostics/building_heights_smoke.log
          cp /tmp/visual.log grand-bruxelles-game/data/sources/laeken_jette/diagnostics/building_visual_smoke.log
          git add -f grand-bruxelles-game/data/sources/laeken_jette/diagnostics/building_heights_smoke.log grand-bruxelles-game/data/sources/laeken_jette/diagnostics/building_visual_smoke.log
          git diff --cached --quiet && exit 0
          git commit -m "debug: capture Laeken height and visual smoke output [skip ci]"
          git push origin HEAD:zone-laeken-jette
