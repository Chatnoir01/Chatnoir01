name: Grand Bruxelles Lemonnier Direct Spawn

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/direct_spawn_presentation.gd"
      - "grand-bruxelles-game/game/tests/lemonnier_direct_spawn_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - ".github/workflows/grand-bruxelles-web.yml"
      - ".github/workflows/grand-bruxelles-lemonnier-direct-spawn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lemonnier-direct-spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 xvfb

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/lemonnier-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/lemonnier-import.log; then exit 1; fi

      - name: Run source-backed Lemonnier player witness
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/lemonnier_direct_spawn_test.gd \
            2>&1 | tee /tmp/lemonnier-direct-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|LEMONNIER_DIRECT_SPAWN_FAIL" /tmp/lemonnier-direct-spawn.log; then exit 1; fi
          grep -F "LEMONNIER_DIRECT_SPAWN_OK" /tmp/lemonnier-direct-spawn.log
          test -f grand-bruxelles-game/artifacts/lemonnier/lemonnier_direct_spawn.png

      - name: Verify Web allowlist wiring
        run: |
          grep -F "DIRECT_SPAWN === 'bourse' || DIRECT_SPAWN === 'atomium' || DIRECT_SPAWN === 'ixelles' || DIRECT_SPAWN === 'lemonnier'" .github/workflows/grand-bruxelles-web.yml
          grep -F "GODOT_CONFIG.args = ['--', \`spawn=\${DIRECT_SPAWN}\`];" .github/workflows/grand-bruxelles-web.yml

      - name: Upload exact player witness
        uses: actions/upload-artifact@v4
        with:
          name: lemonnier-direct-spawn-evidence
          path: |
            grand-bruxelles-game/artifacts/lemonnier/lemonnier_direct_spawn.png
            /tmp/lemonnier-direct-spawn.log
            /tmp/lemonnier-import.log
          if-no-files-found: error
          retention-days: 14
