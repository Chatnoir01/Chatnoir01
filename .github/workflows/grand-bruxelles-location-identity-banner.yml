name: Grand Bruxelles Location Identity Banner Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-location-identity-banner.yml"
      - "grand-bruxelles-game/game/scripts/location_label_controller.gd"
      - "grand-bruxelles-game/game/tests/brussels_location_identity_banner_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_location_identity_banner_witness_test.gd"
      - "grand-bruxelles-game/data/provenance/brussels_bilingual_location_banner.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  location-identity-banner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate reusable location identity banner
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/brussels_location_identity_banner_test.gd 2>&1 | tee /tmp/location-identity-banner.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_LOCATION_IDENTITY_BANNER_FAIL" /tmp/location-identity-banner.log; then exit 1; fi
          grep -F "BRUSSELS_LOCATION_IDENTITY_BANNER_OK" /tmp/location-identity-banner.log
      - name: Capture frozen-state production A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/brussels_location_identity_banner_witness_test.gd 2>&1 | tee /tmp/location-identity-banner-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_LOCATION_IDENTITY_BANNER_WITNESS_FAIL" /tmp/location-identity-banner-witness.log; then exit 1; fi
          grep -F "BRUSSELS_LOCATION_IDENTITY_BANNER_WITNESS_OK" /tmp/location-identity-banner-witness.log
      - name: Assert deterministic evidence files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/location-identity-evidence
          cp grand-bruxelles-game/artifacts/visual/brussels_location_identity_banner_before.png /tmp/location-identity-evidence/before.png
          cp grand-bruxelles-game/artifacts/visual/brussels_location_identity_banner_after.png /tmp/location-identity-evidence/after.png
          cp /tmp/location-identity-banner.log /tmp/location-identity-evidence/location-identity-banner.log
          cp /tmp/location-identity-banner-witness.log /tmp/location-identity-evidence/location-identity-banner-witness.log
          test -s /tmp/location-identity-evidence/before.png
          test -s /tmp/location-identity-evidence/after.png
          test -s /tmp/location-identity-evidence/location-identity-banner.log
          test -s /tmp/location-identity-evidence/location-identity-banner-witness.log
          python - <<'PY'
          import struct
          from pathlib import Path
          for name in ("before.png", "after.png"):
              data = (Path("/tmp/location-identity-evidence") / name).read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", name
              width, height = struct.unpack(">II", data[16:24])
              assert (width, height) == (1280, 720), (name, width, height)
          PY
          sha256sum /tmp/location-identity-evidence/* | tee /tmp/location-identity-evidence/SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-location-identity-banner-visual-evidence
          path: /tmp/location-identity-evidence
          if-no-files-found: error
