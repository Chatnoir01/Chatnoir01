name: Grand Bruxelles Locked Evidence Blob Pin

on:
  pull_request:
    paths:
      - '.github/workflows/grand-bruxelles-locked-evidence-blob-pin.yml'
      - 'grand-bruxelles-game/data/source_plans/brussels_missing_road_source_acquisition_evidence.lock.json'
      - 'grand-bruxelles-game/data/source_plans/brussels_missing_road_source_evidence_blob.pin.json'
      - 'grand-bruxelles-game/tools/city_machine/validate_locked_evidence_blob.py'
      - 'grand-bruxelles-game/tests/test_locked_evidence_blob_target_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-immutable-evidence-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Reproduce immutable target-path contract
        run: python -m pytest -q tests/test_locked_evidence_blob_target_contract.py
      - name: Verify exact immutable evidence Git blob
        run: python tools/city_machine/validate_locked_evidence_blob.py
