name: Grand Bruxelles Midi Ambient NPC Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/midi_ambient_npc_visual_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_npc_visual_bridge_test.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_test.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_npc_visual_ab_capture_test.gd"
      - "grand-bruxelles-game/data/sources/visual_assets/midi_ambient_npc_visual_bridge.json"
      - ".github/workflows/grand-bruxelles-midi-ambient-npc-visual.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/midi_ambient_npc_visual_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_npc_visual_bridge_test.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_test.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_npc_visual_ab_capture_test.gd"
      - "grand-bruxelles-game/data/sources/visual_assets/midi_ambient_npc_visual_bridge.json"
      - ".github/workflows/grand-bruxelles-midi-ambient-npc-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-midi-ambient-npc-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge truth contract
        run: |
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/sources/visual_assets/midi_ambient_npc_visual_bridge.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-midi-ambient-npc-visual-bridge-v1'
          assert d['runtime']['navigation_added'] is False
          assert d['runtime']['simulation_proxy_disabled'] is True
          assert d['truth_limits']['pedestrian_positions_changed'] is False
          assert d['truth_limits']['pedestrian_paths_changed'] is False
          assert d['authorship_and_rights']['external_assets']==[]
          print('MIDI_AMBIENT_NPC_TRUTH_OK')
          PY
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-ambient-npc-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-ambient-npc-import.log; then exit 1; fi
      - name: Production ambient visual bridge regression
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_ambient_npc_visual_bridge_test.gd 2>&1 | tee /tmp/midi-ambient-npc-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_NPC_VISUAL_FAIL" /tmp/midi-ambient-npc-runtime.log; then exit 1; fi
          grep -q "MIDI_AMBIENT_NPC_VISUAL_OK" /tmp/midi-ambient-npc-runtime.log
      - name: Prove moving profiled pedestrians have visual gait
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_profiled_npc_gait_test.gd 2>&1 | tee /tmp/midi-profiled-npc-gait.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_PROFILED_NPC_GAIT_FAIL" /tmp/midi-profiled-npc-gait.log; then exit 1; fi
          grep -q "MIDI_PROFILED_NPC_GAIT_OK" /tmp/midi-profiled-npc-gait.log
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Render frozen normal-camera crowd A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/midi_ambient_npc_visual_ab_capture_test.gd 2>&1 | tee /tmp/midi-ambient-npc-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_NPC_AB_FAIL" /tmp/midi-ambient-npc-ab.log; then exit 1; fi
          grep -q "MIDI_AMBIENT_NPC_AB_OK" /tmp/midi-ambient-npc-ab.log
          test -f grand-bruxelles-game/artifacts/qa/midi_ambient_npc_visual_ab/before.png
          test -f grand-bruxelles-game/artifacts/qa/midi_ambient_npc_visual_ab/after.png
      - name: Upload ambient crowd A/B witness
        uses: actions/upload-artifact@v4
        with:
          name: midi-ambient-npc-visual-ab
          path: grand-bruxelles-game/artifacts/qa/midi_ambient_npc_visual_ab/*.png
          if-no-files-found: error
