name: Grand Bruxelles Midi Ambient Vehicle Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/midi_urban_life.gd"
      - "grand-bruxelles-game/game/scripts/civilian_vehicle_visual.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_bridge_test.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_capture_test.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_ab_compare_test.gd"
      - ".github/workflows/grand-bruxelles-midi-ambient-vehicle-visual.yml"

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-midi-ambient-vehicle-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-midi-ambient-vehicles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Validate Midi ambient production vehicle bridge
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/midi_ambient_vehicle_visual_bridge_test.gd 2>&1 | tee /tmp/midi-ambient-vehicle.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_VEHICLE_VISUAL_FAIL" /tmp/midi-ambient-vehicle.log; then
            exit 1
          fi
          grep -q "MIDI_AMBIENT_VEHICLE_VISUAL_OK" /tmp/midi-ambient-vehicle.log

  prove-visible-midi-vehicle-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Install identical capture harness in base checkout
        run: |
          cp head/grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_capture_test.gd \
             base/grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_capture_test.gd

      - name: Import base and head projects
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/base-import.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/base-import.log /tmp/head-import.log; then
            exit 1
          fi

      - name: Capture frozen normal gameplay camera BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path base/grand-bruxelles-game \
            --script res://game/tests/midi_ambient_vehicle_visual_capture_test.gd -- /tmp/midi-vehicle-before.png 2>&1 | tee /tmp/base-capture.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path head/grand-bruxelles-game \
            --script res://game/tests/midi_ambient_vehicle_visual_capture_test.gd -- /tmp/midi-vehicle-after.png 2>&1 | tee /tmp/head-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_VEHICLE_CAPTURE_FAIL" /tmp/base-capture.log /tmp/head-capture.log; then
            exit 1
          fi
          grep -q "MIDI_AMBIENT_VEHICLE_CAPTURE_OK" /tmp/base-capture.log
          grep -q "MIDI_AMBIENT_VEHICLE_CAPTURE_OK" /tmp/head-capture.log

      - name: Enforce visible normal-camera delta
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path head/grand-bruxelles-game \
            --script res://game/tests/midi_ambient_vehicle_visual_ab_compare_test.gd -- \
            /tmp/midi-vehicle-before.png /tmp/midi-vehicle-after.png 2>&1 | tee /tmp/midi-vehicle-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_VEHICLE_AB_FAIL" /tmp/midi-vehicle-ab.log; then
            exit 1
          fi
          grep -q "MIDI_AMBIENT_VEHICLE_AB_OK" /tmp/midi-vehicle-ab.log

      - name: Stage A/B evidence
        if: always()
        run: |
          mkdir -p head/grand-bruxelles-game/artifacts/qa/midi_ambient_vehicle_visual_ab
          cp /tmp/midi-vehicle-before.png head/grand-bruxelles-game/artifacts/qa/midi_ambient_vehicle_visual_ab/before.png 2>/dev/null || true
          cp /tmp/midi-vehicle-after.png head/grand-bruxelles-game/artifacts/qa/midi_ambient_vehicle_visual_ab/after.png 2>/dev/null || true
          cp /tmp/midi-vehicle-ab.log head/grand-bruxelles-game/artifacts/qa/midi_ambient_vehicle_visual_ab/metrics.log 2>/dev/null || true

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-ambient-vehicle-visual-ab
          path: head/grand-bruxelles-game/artifacts/qa/midi_ambient_vehicle_visual_ab
          if-no-files-found: warn
