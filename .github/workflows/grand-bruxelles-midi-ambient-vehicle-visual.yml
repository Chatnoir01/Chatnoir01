name: Grand Bruxelles Midi Ambient Vehicle Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/midi_urban_life.gd"
      - "grand-bruxelles-game/game/scripts/civilian_vehicle_visual.gd"
      - "grand-bruxelles-game/game/tests/midi_ambient_vehicle_visual_bridge_test.gd"
      - ".github/workflows/grand-bruxelles-midi-ambient-vehicle-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-midi-ambient-vehicle-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-midi-ambient-vehicles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Validate Midi ambient production vehicle bridge
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/midi_ambient_vehicle_visual_bridge_test.gd 2>&1 | tee /tmp/midi-ambient-vehicle.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_AMBIENT_VEHICLE_VISUAL_FAIL" /tmp/midi-ambient-vehicle.log; then
            exit 1
          fi
          grep -q "MIDI_AMBIENT_VEHICLE_VISUAL_OK" /tmp/midi-ambient-vehicle.log
