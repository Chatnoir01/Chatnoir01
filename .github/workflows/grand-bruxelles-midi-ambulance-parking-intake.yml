name: Grand Bruxelles Midi Ambulance Parking Intake

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/traffic/midi_ambulance_parking_evidence.json'
      - 'grand-bruxelles-game/tools/validate_midi_ambulance_parking_evidence.py'
      - 'grand-bruxelles-game/tests/test_validate_midi_ambulance_parking_evidence.py'
      - '.github/workflows/grand-bruxelles-midi-ambulance-parking-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate current fail-closed registry
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/validate_midi_ambulance_parking_evidence.py \
            --registry data/traffic/midi_ambulance_parking_evidence.json \
            --snapshot data/osm/vertical_slice_01.game.json
      - name: Prove production readiness remains closed without two source records
        working-directory: grand-bruxelles-game
        run: |
          set +e
          python3 tools/validate_midi_ambulance_parking_evidence.py \
            --registry data/traffic/midi_ambulance_parking_evidence.json \
            --snapshot data/osm/vertical_slice_01.game.json \
            --require-ready > /tmp/midi_ambulance_parking_ready.log 2>&1
          rc=$?
          set -e
          cat /tmp/midi_ambulance_parking_ready.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected the empty source registry to remain fail-closed.' >&2
            exit 1
          fi
          grep -q 'ambulance parking evidence not ready' /tmp/midi_ambulance_parking_ready.log
      - name: Run parking evidence regression tests
        working-directory: grand-bruxelles-game
        run: python3 -m unittest -v tests/test_validate_midi_ambulance_parking_evidence.py
