name: Grand Bruxelles Midi Ambulance Parking Intake

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/traffic/midi_ambulance_parking_evidence.json'
      - 'grand-bruxelles-game/tools/validate_midi_ambulance_parking_evidence.py'
      - 'grand-bruxelles-game/tests/test_validate_midi_ambulance_parking_evidence.py'
      - '.github/workflows/grand-bruxelles-midi-ambulance-parking-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Discover current exact OSM parking tags on vertical-slice roads
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          snapshot = json.loads(Path('data/osm/vertical_slice_01.game.json').read_text(encoding='utf-8'))
          road_ids = sorted({int(road['osm_id']) for road in snapshot.get('roads', []) if isinstance(road, dict) and isinstance(road.get('osm_id'), int)})
          query = '[out:json][timeout:60];way(id:%s);out tags meta;' % ','.join(map(str, road_ids))
          request = urllib.request.Request(
              'https://overpass-api.de/api/interpreter',
              data=urllib.parse.urlencode({'data': query}).encode('utf-8'),
              headers={'User-Agent': 'GrandBruxellesGame/1.0 parking-evidence-intake'},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              payload = json.load(response)

          found = []
          for element in payload.get('elements', []):
              tags = element.get('tags', {}) if isinstance(element.get('tags'), dict) else {}
              evidence = {
                  key: value for key, value in tags.items()
                  if key in {'amenity'} and value in {'parking', 'parking_space'}
                  or key == 'parking:left' or key.startswith('parking:left:')
                  or key == 'parking:right' or key.startswith('parking:right:')
                  or key == 'parking:both' or key.startswith('parking:both:')
              }
              if not evidence:
                  continue
              found.append({
                  'type': element.get('type'),
                  'id': element.get('id'),
                  'version': element.get('version'),
                  'timestamp': element.get('timestamp'),
                  'tags': tags,
                  'parking_evidence_tags': evidence,
              })
          print('MIDI_OSM_PARKING_DISCOVERY_JSON=' + json.dumps(found, ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          print('MIDI_OSM_PARKING_DISCOVERY_COUNT=%d' % len(found))
          PY

      - name: Validate current fail-closed registry
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/validate_midi_ambulance_parking_evidence.py \
            --registry data/traffic/midi_ambulance_parking_evidence.json \
            --snapshot data/osm/vertical_slice_01.game.json \
            | tee /tmp/midi_ambulance_parking_registry.log
          grep -q '"versioned_source_binding": true' /tmp/midi_ambulance_parking_registry.log
      - name: Prove production readiness remains closed without two source records
        working-directory: grand-bruxelles-game
        run: |
          set +e
          python3 tools/validate_midi_ambulance_parking_evidence.py \
            --registry data/traffic/midi_ambulance_parking_evidence.json \
            --snapshot data/osm/vertical_slice_01.game.json \
            --require-ready > /tmp/midi_ambulance_parking_ready.log 2>&1
          rc=$?
          set -e
          cat /tmp/midi_ambulance_parking_ready.log
          if [ "$rc" -eq 0 ]; then
            echo 'Expected the empty source registry to remain fail-closed.' >&2
            exit 1
          fi
          grep -q 'ambulance parking evidence not ready' /tmp/midi_ambulance_parking_ready.log
      - name: Run parking evidence regression tests
        working-directory: grand-bruxelles-game
        run: python3 -m unittest -v tests/test_validate_midi_ambulance_parking_evidence.py
