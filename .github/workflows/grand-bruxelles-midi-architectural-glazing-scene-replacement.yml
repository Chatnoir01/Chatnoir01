name: Grand Bruxelles Midi Architectural Glazing Scene Replacement

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/midi_architectural_glazing_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/midi_architectural_glazing_scene_replacement_test.gd'
      - 'grand-bruxelles-game/data/visual/midi_architectural_glazing_material_identity.json'
      - '.github/workflows/grand-bruxelles-midi-architectural-glazing-scene-replacement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-architectural-glazing-scene-replacement:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact PR head and live-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: glazing scene-replacement witness checked out merge-ref/stale commit" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD || {
            echo "RED: PR base is not an ancestor of exact glazing head" >&2
            exit 1
          }

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-glazing-rebind-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/midi-glazing-rebind-import.log

      - name: Prove production-scene replacement rebind
        shell: bash
        run: |
          set -o pipefail
          timeout 180s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_architectural_glazing_scene_replacement_test.gd 2>&1 | tee /tmp/midi-glazing-scene-replacement.log
          grep -q 'MIDI_ARCHITECTURAL_GLAZING_SCENE_REPLACEMENT_OK: surfaces=340 autoload_rebind=true toggle_preserved=true geometry_changed=false' /tmp/midi-glazing-scene-replacement.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|Invalid call|previously freed|ObjectDB instances leaked|ERROR:' /tmp/midi-glazing-scene-replacement.log

      - name: Upload glazing scene-replacement diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-architectural-glazing-scene-replacement-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/midi-glazing-rebind-import.log
            /tmp/midi-glazing-scene-replacement.log
