name: Grand Bruxelles Midi Automatic Road Rejection Ledger

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/midi_automatic_road_rejection_ledger_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-midi-automatic-road-rejection-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rejection-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0

      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$PR_HEAD_SHA" origin/main)" = "$live_main"
          printf 'MIDI_REJECTION_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'MIDI_REJECTION_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install verified Godot 4.7.1
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          rm -rf /tmp/godot /tmp/godot.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          version="$(/tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version)"
          printf '%s\n' "$version" | grep -E '^4\.7\.1\.stable\.'
          printf 'MIDI_REJECTION_GODOT_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-rejection-import.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-rejection-import.log

      - name: Build deterministic Midi rejection ledger
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_rejection_ledger_test.gd 2>&1 | tee /tmp/midi-rejection-runtime.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_REJECTION_LEDGER_FAIL" /tmp/midi-rejection-runtime.log
          grep -q "MIDI_AUTOMATIC_ROAD_REJECTION_LEDGER_GREEN" /tmp/midi-rejection-runtime.log
          grep -q "resolver_instance_isolated=true" /tmp/midi-rejection-runtime.log
          grep -q "resolver_isolation=fresh_instance_per_candidate" /tmp/midi-rejection-runtime.log
          grep -q "player_state_isolated=true" /tmp/midi-rejection-runtime.log
          grep -q "metadata_isolation=automatic_road_direct_namespace" /tmp/midi-rejection-runtime.log
          grep -q "location_label_state_isolated=true" /tmp/midi-rejection-runtime.log
          grep -q "location_label_isolation=forced_label_and_text" /tmp/midi-rejection-runtime.log

      - name: Seal fail-closed rejection evidence
        shell: bash
        run: |
          set -euo pipefail
          result="grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_ledger.json"
          test -s "$result"
          stage=/tmp/midi-road-rejection-ledger
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$result" "$stage/rejection-ledger.json"
          cp /tmp/midi-rejection-runtime.log "$stage/runtime.log"
          cp /tmp/midi-rejection-import.log "$stage/import.log"
          python3 - "$stage/rejection-ledger.json" <<'PY'
          import hashlib,json,math,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text())
          assert d['schema']=='grand-bruxelles-midi-automatic-road-rejection-ledger-v5'
          assert d['source_path']=='res://data/osm/vertical_slice_01.game.json'
          assert isinstance(d['candidate_count'],int) and d['candidate_count']>0
          assert len(d['rows'])==d['candidate_count']
          assert d['resolver_instance_isolated'] is True
          assert d['resolver_isolation']=='fresh_instance_per_candidate'
          assert d['player_state_isolated'] is True
          assert d['player_metadata_isolation']=='automatic_road_direct_namespace'
          assert d['location_label_state_isolated'] is True
          assert d['location_label_isolation']=='forced_label_and_text'
          assert d['resolver_contract_unchanged'] is True
          assert d['source_geometry_changed'] is False and d['collision_changed'] is False
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['destination_advertisable'] is False and d['visual_acceptance'] is False and d['jouable_authorized'] is False
          source=pathlib.Path('grand-bruxelles-game/data/osm/vertical_slice_01.game.json')
          assert hashlib.sha256(source.read_bytes()).hexdigest()==d['source_sha256']
          allowed=('source_bundle','rendered_geometry','safe_viewpoint','exact_road_support','ready')
          counts={k:0 for k in allowed}; seen=set(); ready=[]
          for row in d['rows']:
              oid=row['osm_id']; assert isinstance(oid,int) and oid>0 and oid not in seen; seen.add(oid)
              assert row['resolver_instance_isolated'] is True
              assert row['player_state_restored'] is True
              assert row['location_label_state_restored'] is True
              blocker=row['first_blocker']; assert blocker in allowed; counts[blocker]+=1
              expected=bool(row['source_bundle'] and row['rendered_geometry'] and row['safe_viewpoint'] and row['exact_road_support'])
              assert bool(row['apply_to_player'])==expected
              if expected: ready.append(oid)
              distance=float(row['anchor_distance_m']); assert math.isfinite(distance) and distance<=80.0
              if row['spawn_xz'] is not None:
                  assert len(row['spawn_xz'])==2 and all(math.isfinite(float(v)) for v in row['spawn_xz'])
              if row['ground_y'] is not None: assert math.isfinite(float(row['ground_y']))
          assert counts=={k:int(d['blocker_counts'][k]) for k in allowed}
          assert d['first_ready_osm_id']==(ready[0] if ready else 0)
          receipt={
              'schema':'grand-bruxelles-midi-automatic-road-rejection-ledger-receipt-v5',
              'base_sha':os.environ.get('MIDI_REJECTION_BASE_SHA',''),
              'head_sha':os.environ.get('MIDI_REJECTION_HEAD_SHA',''),
              'godot_version':os.environ.get('MIDI_REJECTION_GODOT_VERSION',''),
              'source_sha256':d['source_sha256'],'candidate_count':d['candidate_count'],
              'blocker_counts':d['blocker_counts'],'first_ready_osm_id':d['first_ready_osm_id'],
              'resolver_instance_isolated':True,
              'resolver_isolation':'fresh_instance_per_candidate',
              'player_state_isolated':True,
              'player_metadata_isolation':'automatic_road_direct_namespace',
              'location_label_state_isolated':True,
              'location_label_isolation':'forced_label_and_text',
              'osm_to_urbis_crosswalk_claimed':False,
              'destination_advertisable':False,'visual_acceptance':False,'jouable_authorized':False,
          }
          pathlib.Path('/tmp/midi-road-rejection-ledger/manifest.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$stage" && find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt)

      - name: Revalidate exact proof identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MIDI_REJECTION_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MIDI_REJECTION_HEAD_SHA"

      - name: Upload rejection ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-midi-road-rejection-ledger
          path: /tmp/midi-road-rejection-ledger/
          if-no-files-found: error
