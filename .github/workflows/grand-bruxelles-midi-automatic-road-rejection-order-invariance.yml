name: Grand Bruxelles Midi Automatic Road Rejection Order Invariance

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/game/tests/midi_automatic_road_rejection_order_invariance_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - ".github/workflows/grand-bruxelles-midi-automatic-road-rejection-order-invariance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-invariance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$PR_HEAD_SHA" origin/main)" = "$live_main"
          printf 'MIDI_ORDER_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'MIDI_ORDER_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-order-import.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-order-import.log
      - name: Prove forward reverse order invariance in fresh process A
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_rejection_order_invariance_test.gd 2>&1 | tee /tmp/midi-order-runtime-a.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_FAIL" /tmp/midi-order-runtime-a.log
          grep -q "MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_GREEN" /tmp/midi-order-runtime-a.log
          cp grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_order_invariance.json /tmp/midi-order-a.json
      - name: Prove fresh-process reproducibility in process B
        shell: bash
        run: |
          set -o pipefail
          rm -f grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_order_invariance.json
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_rejection_order_invariance_test.gd 2>&1 | tee /tmp/midi-order-runtime-b.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_FAIL" /tmp/midi-order-runtime-b.log
          grep -q "MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_GREEN" /tmp/midi-order-runtime-b.log
          cp grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_order_invariance.json /tmp/midi-order-b.json
          python3 - /tmp/midi-order-a.json /tmp/midi-order-b.json <<'PY'
          import hashlib,json,pathlib,sys
          a_path,b_path=map(pathlib.Path,sys.argv[1:])
          a=json.loads(a_path.read_text()); b=json.loads(b_path.read_text())
          assert a==b, 'fresh Godot processes produced different Midi rejection evidence'
          a_canonical=json.dumps(a,sort_keys=True,separators=(',',':')).encode()
          b_canonical=json.dumps(b,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(a_canonical).digest()==hashlib.sha256(b_canonical).digest()
          print('MIDI_AUTOMATIC_ROAD_REJECTION_PROCESS_REPRODUCIBLE: sha256=%s' % hashlib.sha256(a_canonical).hexdigest())
          PY
      - name: Seal fail-closed order evidence
        shell: bash
        run: |
          set -euo pipefail
          result="grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_order_invariance.json"
          test -s "$result"
          stage=/tmp/midi-road-rejection-order-invariance
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$result" "$stage/order-invariance.json"
          cp /tmp/midi-order-a.json "$stage/order-invariance-process-a.json"
          cp /tmp/midi-order-b.json "$stage/order-invariance-process-b.json"
          cp /tmp/midi-order-runtime-a.log "$stage/runtime-process-a.log"
          cp /tmp/midi-order-runtime-b.log "$stage/runtime-process-b.log"
          cp /tmp/midi-order-import.log "$stage/import.log"
          python3 - "$stage/order-invariance.json" "$stage/order-invariance-process-a.json" "$stage/order-invariance-process-b.json" <<'PY'
          import hashlib,json,pathlib,sys
          paths=list(map(pathlib.Path,sys.argv[1:]))
          docs=[json.loads(p.read_text()) for p in paths]
          d=docs[0]
          assert docs[0]==docs[1]==docs[2]
          assert d['schema']=='grand-bruxelles-midi-automatic-road-rejection-order-invariance-v1'
          assert d['source_path']=='res://data/osm/vertical_slice_01.game.json'
          assert isinstance(d['candidate_count'],int) and d['candidate_count']>0
          assert d['mismatch_count']==0 and d['mismatches']==[] and d['order_invariant'] is True
          assert d['fresh_scene_per_pass'] is True and d['fresh_resolver_per_candidate'] is True
          assert d['player_state_restored_per_candidate'] is True and d['location_label_state_restored_per_candidate'] is True
          assert set(d['forward_rows'])==set(d['reverse_rows']) and len(d['forward_rows'])==d['candidate_count']
          for oid,row in d['forward_rows'].items():
              assert row==d['reverse_rows'][oid]
              expected=bool(row['source_bundle'] and row['rendered_geometry'] and row['safe_viewpoint'] and row['exact_road_support'])
              assert bool(row['apply_to_player'])==expected
          source=pathlib.Path('grand-bruxelles-game/data/osm/vertical_slice_01.game.json')
          assert hashlib.sha256(source.read_bytes()).hexdigest()==d['source_sha256']
          assert d['resolver_contract_unchanged'] is True and d['source_geometry_changed'] is False and d['collision_changed'] is False
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['destination_advertisable'] is False and d['visual_acceptance'] is False and d['jouable_authorized'] is False
          canonical=json.dumps(d,sort_keys=True,separators=(',',':')).encode()
          pathlib.Path('/tmp/midi-order-process-proof.txt').write_text('fresh_godot_processes=2\ncanonical_sha256=%s\n' % hashlib.sha256(canonical).hexdigest())
          PY
          cp /tmp/midi-order-process-proof.txt "$stage/process-reproducibility.txt"
          (cd "$stage" && find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt)
      - name: Revalidate exact proof identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MIDI_ORDER_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MIDI_ORDER_HEAD_SHA"
      - name: Upload order-invariance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-midi-road-rejection-order-invariance
          path: /tmp/midi-road-rejection-order-invariance/
          if-no-files-found: error
