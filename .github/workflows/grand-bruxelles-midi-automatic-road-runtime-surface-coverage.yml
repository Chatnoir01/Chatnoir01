name: Grand Bruxelles Midi Automatic Road Runtime Surface Coverage

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/tests/midi_automatic_road_runtime_surface_coverage_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - ".github/workflows/grand-bruxelles-midi-automatic-road-runtime-surface-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-surface-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$PR_HEAD_SHA" origin/main)" = "$live_main"
          printf 'MIDI_SURFACE_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'MIDI_SURFACE_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-surface-import.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-surface-import.log
      - name: Measure player-runtime road surface and collision identity coverage
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_runtime_surface_coverage_test.gd 2>&1 | tee /tmp/midi-surface-runtime.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_RUNTIME_SURFACE_COVERAGE_FAIL" /tmp/midi-surface-runtime.log
          grep -q "MIDI_AUTOMATIC_ROAD_RUNTIME_SURFACE_COVERAGE_GREEN" /tmp/midi-surface-runtime.log
      - name: Seal fail-closed coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          result=grand-bruxelles-game/artifacts/qa/midi_automatic_road_runtime_surface_coverage.json
          test -s "$result"
          stage=/tmp/midi-runtime-surface-coverage
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$result" "$stage/coverage.json"
          cp /tmp/midi-surface-runtime.log "$stage/runtime.log"
          cp /tmp/midi-surface-import.log "$stage/import.log"
          python3 - "$stage/coverage.json" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text())
          assert d['schema']=='grand-bruxelles-midi-automatic-road-runtime-surface-coverage-v1'
          ids=d['candidate_ids']; assert isinstance(ids,list) and len(ids)==d['candidate_count'] and len(ids)>0
          assert len(set(ids))==len(ids) and all(isinstance(x,int) and x>0 for x in ids)
          assert len(d['rows'])==len(ids)
          assert d['malformed_generic_support_owner_node_count']==0
          assert d['generic_support_owner_node_count']>=1
          assert d['generic_support_unique_road_id_count']>=1
          seen=set()
          for row in d['rows']:
              oid=row['osm_id']; assert oid in ids and oid not in seen; seen.add(oid)
              for key in ('exact_named_geometry','exact_visible_renderable_geometry','metadata_bound_geometry'):
                  assert isinstance(row[key],int) and row[key]>=0
              assert row['exact_visible_renderable_geometry']<=row['exact_named_geometry']
              assert isinstance(row['generic_collision_support_registered'],bool)
          assert seen==set(ids)
          assert d['candidate_visible_renderable_count']==sum(1 for r in d['rows'] if r['exact_visible_renderable_geometry']>0)
          assert d['candidate_generic_collision_support_count']==sum(1 for r in d['rows'] if r['generic_collision_support_registered'])
          assert d['diagnostic_only'] is True
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['source_geometry_changed'] is False and d['collision_changed'] is False and d['resolver_changed'] is False
          assert d['destination_advertisable'] is False and d['visual_acceptance'] is False and d['jouable_authorized'] is False
          d['base_sha']=os.environ.get('MIDI_SURFACE_BASE_SHA','')
          d['head_sha']=os.environ.get('MIDI_SURFACE_HEAD_SHA','')
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$stage" && sha256sum coverage.json runtime.log import.log > evidence-sha256.txt)
      - name: Revalidate exact proof identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MIDI_SURFACE_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MIDI_SURFACE_HEAD_SHA"
      - name: Upload runtime surface coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-automatic-road-runtime-surface-coverage
          path: /tmp/midi-runtime-surface-coverage/
          if-no-files-found: error
          retention-days: 30
