name: Grand Bruxelles Midi Automatic Road Visibility Mask Attribution

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/tests/midi_automatic_road_visibility_mask_attribution_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - ".github/workflows/grand-bruxelles-midi-automatic-road-visibility-mask-attribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-mask-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$PR_HEAD_SHA" origin/main)" = "$live_main"
          printf 'MIDI_MASK_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'MIDI_MASK_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-mask-import.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-mask-import.log
      - name: Attribute exact Fonsny visibility masking
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_visibility_mask_attribution_test.gd 2>&1 | tee /tmp/midi-mask-runtime.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_VISIBILITY_MASK_ATTRIBUTION_FAIL" /tmp/midi-mask-runtime.log
          grep -q "MIDI_AUTOMATIC_ROAD_VISIBILITY_MASK_ATTRIBUTION_GREEN" /tmp/midi-mask-runtime.log
      - name: Seal fail-closed attribution evidence
        shell: bash
        run: |
          set -euo pipefail
          result=grand-bruxelles-game/artifacts/qa/midi_automatic_road_visibility_mask_attribution.json
          test -s "$result"
          stage=/tmp/midi-visibility-mask-attribution
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$result" "$stage/attribution.json"
          cp /tmp/midi-mask-runtime.log "$stage/runtime.log"
          cp /tmp/midi-mask-import.log "$stage/import.log"
          python3 - "$stage/attribution.json" <<'PY'
          import json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text())
          assert d['schema']=='grand-bruxelles-midi-automatic-road-visibility-mask-attribution-v1'
          ids=d['candidate_ids']; assert isinstance(ids,list) and len(ids)==d['candidate_count'] and len(ids)>0
          assert len(set(ids))==len(ids) and all(isinstance(x,int) and x>0 for x in ids)
          assert d['exact_candidate_geometry_node_count']>0
          assert d['hidden_candidate_geometry_node_count']>0
          assert d['unattributed_hidden_geometry_node_count']==0
          assert len(d['rows'])==d['exact_candidate_geometry_node_count']
          for row in d['rows']:
              assert row['osm_id'] in ids
              assert isinstance(row['visible_in_tree'],bool)
              if not row['visible_in_tree']:
                  assert row['first_hidden_ancestor_path']
                  assert row['first_hidden_ancestor_name']
                  assert row['first_hidden_ancestor_class']
          assert d['diagnostic_only'] is True
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['source_geometry_changed'] is False and d['collision_changed'] is False and d['resolver_changed'] is False
          assert d['destination_advertisable'] is False and d['visual_acceptance'] is False and d['jouable_authorized'] is False
          d['base_sha']=os.environ.get('MIDI_MASK_BASE_SHA','')
          d['head_sha']=os.environ.get('MIDI_MASK_HEAD_SHA','')
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$stage" && sha256sum attribution.json runtime.log import.log > evidence-sha256.txt)
      - name: Revalidate exact proof identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MIDI_MASK_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MIDI_MASK_HEAD_SHA"
      - name: Upload visibility-mask attribution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-automatic-road-visibility-mask-attribution
          path: /tmp/midi-visibility-mask-attribution/
          if-no-files-found: error
          retention-days: 30
