name: Grand Bruxelles Midi Blue Stone Material Teardown

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/midi_blue_stone_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/midi_blue_stone_material_teardown_test.gd'
      - 'grand-bruxelles-game/data/visual/midi_blue_stone_material_identity.json'
      - 'grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json'
      - 'grand-bruxelles-game/game/tests/shared_environment_material_ownership_teardown_test.py'
      - '.github/workflows/grand-bruxelles-midi-blue-stone-material-teardown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-blue-stone-material-teardown:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact PR head and live-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: blue-stone teardown checked out merge-ref/stale commit" >&2
            exit 1
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD || {
            echo "RED: PR base is not an ancestor of exact blue-stone teardown head" >&2
            exit 1
          }

      - name: Validate durable shared material ownership contract
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          python game/tests/shared_environment_material_ownership_teardown_test.py

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-blue-stone-teardown-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/midi-blue-stone-teardown-import.log

      - name: Prove owner-aware blue-stone material teardown
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_blue_stone_material_teardown_test.gd 2>&1 | tee /tmp/midi-blue-stone-teardown.log
          grep -q 'MIDI_BLUE_STONE_MATERIAL_TEARDOWN_OK' /tmp/midi-blue-stone-teardown.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|Invalid call|previously freed|ObjectDB instances leaked|ERROR:' /tmp/midi-blue-stone-teardown.log

      - name: Upload blue-stone teardown diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-blue-stone-material-teardown-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/midi-blue-stone-teardown-import.log
            /tmp/midi-blue-stone-teardown.log
