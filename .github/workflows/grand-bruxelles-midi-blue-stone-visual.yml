name: Grand Bruxelles Midi Blue Stone Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-blue-stone-visual.yml"
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/tests/midi_blue_stone_material_test.gd"
      - "grand-bruxelles-game/game/tests/midi_blue_stone_witness_test.gd"
      - "grand-bruxelles-game/docs/provenance/midi_blue_stone_material.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-blue-stone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed blue-stone material
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/midi_blue_stone_material_test.gd 2>&1 | tee /tmp/midi-blue-stone.log
          if grep -E "SCRIPT ERROR|Parse Error:|Assertion failed" /tmp/midi-blue-stone.log; then exit 1; fi
          grep -F "Midi blue-stone material regression: PASS" /tmp/midi-blue-stone.log
      - name: Capture deterministic normal-distance A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_blue_stone_witness_test.gd 2>&1 | tee /tmp/midi-blue-stone-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_BLUE_STONE_WITNESS_FAIL" /tmp/midi-blue-stone-witness.log; then exit 1; fi
          grep -F "MIDI_BLUE_STONE_WITNESS_OK" /tmp/midi-blue-stone-witness.log
      - name: Assert evidence package
        run: |
          test -s grand-bruxelles-game/artifacts/visual/midi_blue_stone_before.png
          test -s grand-bruxelles-game/artifacts/visual/midi_blue_stone_after.png
          file grand-bruxelles-game/artifacts/visual/midi_blue_stone_before.png | grep -F "1280 x 720"
          file grand-bruxelles-game/artifacts/visual/midi_blue_stone_after.png | grep -F "1280 x 720"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-blue-stone-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/midi_blue_stone_before.png
            grand-bruxelles-game/artifacts/visual/midi_blue_stone_after.png
            /tmp/midi-blue-stone.log
            /tmp/midi-blue-stone-witness.log
          if-no-files-found: error
