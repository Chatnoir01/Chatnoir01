name: Grand Bruxelles Midi City Machine Facade LABO

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-city-machine-facade-labo.yml"
      - "grand-bruxelles-game/game/scripts/midi_city_machine_facade_material.gd"
      - "grand-bruxelles-game/game/zones/midi/midi_city_machine_zone.gd"
      - "grand-bruxelles-game/game/tests/midi_city_machine_facade_labo_contract_test.gd"
      - "grand-bruxelles-game/data/qa/midi_city_machine_facade_labo.contract.json"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midi-city-machine-facade-labo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  facade-labo-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "MIDI_CITY_MACHINE_FACADE_EXACT_HEAD_OK sha=$actual"

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit \
            2>&1 | tee /tmp/midi-city-machine-facade-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-city-machine-facade-import.log; then
            exit 1
          fi

      - name: Prove LABO-only reversible facade contract
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_city_machine_facade_labo_contract_test.gd \
            2>&1 | tee /tmp/midi-city-machine-facade.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_CITY_MACHINE_FACADE_LABO_FAIL" /tmp/midi-city-machine-facade.log; then
            exit 1
          fi
          grep -F "MIDI_CITY_MACHINE_FACADE_LABO_OK" /tmp/midi-city-machine-facade.log

      - name: Fail closed on promotion or semantic source claims
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('grand-bruxelles-game/data/qa/playable_zone_catalog.json').read_text(encoding='utf-8'))
          zones={row['id']: row for row in catalog['zones']}
          assert zones['midi']['quality']=='JOUABLE'
          assert zones['midi']['mode']=='fast_travel'
          assert zones['midi_machine_labo']['quality']=='LABO'
          assert zones['midi_machine_labo']['review_alias_of']=='midi'
          contract=json.loads(Path('grand-bruxelles-game/data/qa/midi_city_machine_facade_labo.contract.json').read_text(encoding='utf-8'))
          assert contract['schema']=='grand-bruxelles-midi-city-machine-facade-labo-contract-v1'
          assert contract['zone_id']=='midi_machine_labo'
          assert contract['review_alias_of']=='midi'
          assert contract['ab_toggle_required'] is True
          auth=contract['authorization']
          assert auth['labo_visual_material_override'] is True
          for key in ['geometry_mutation','semantic_windows','semantic_doors','building_material_identity','canonical_midi_runtime_replacement','jouable_promotion']:
              assert auth[key] is False, key
          material=Path('grand-bruxelles-game/game/scripts/midi_city_machine_facade_material.gd').read_text(encoding='utf-8')
          for marker in [
              'semantic_windows_claimed", false',
              'semantic_doors_claimed", false',
              'building_material_identity_claimed", false',
              'jouable_authorized", false',
              'promotion_performed", false',
          ]:
              assert marker in material, marker
          print('MIDI_CITY_MACHINE_FACADE_FAIL_CLOSED_OK promotion=false jouable=false semantics=false geometry_mutation=false')
          PY
