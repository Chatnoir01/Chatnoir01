name: Grand Bruxelles Midi City Machine Visual Witness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-city-machine-visual-witness.yml"
      - "grand-bruxelles-game/game/tests/midi_city_machine_post_integration_witness_test.gd"
      - "grand-bruxelles-game/game/scripts/player_issue_report_runtime.gd"
      - "grand-bruxelles-game/game/zones/midi/midi_city_machine_zone.gd"
      - "grand-bruxelles-game/game/scripts/zone_selector_runtime.gd"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/data/urbis/midi/**"
      - "grand-bruxelles-game/data/osm/zones/midi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midi-city-machine-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  midi-city-machine-visual-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          echo "MIDI_CITY_MACHINE_VISUAL_EXACT_HEAD_OK sha=$actual"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0

      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit \
            2>&1 | tee /tmp/midi-city-machine-visual-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-city-machine-visual-import.log; then
            exit 1
          fi

      - name: Capture post-integration playable candidate witness
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/midi_city_machine_post_integration_witness_test.gd \
            2>&1 | tee /tmp/midi-city-machine-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_CITY_MACHINE_POST_INTEGRATION_WITNESS_FAIL" /tmp/midi-city-machine-visual.log; then
            exit 1
          fi
          grep -F "MIDI_CITY_MACHINE_POST_INTEGRATION_WITNESS_OK" /tmp/midi-city-machine-visual.log
          test -s grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/playable_candidate_review_panel.png
          test -s grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/report.json

      - name: Validate post-integration review contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['format'] == 'grand-bruxelles-midi-city-machine-post-integration-witness-v1'
          assert report['zone_id'] == 'midi_machine_labo'
          assert report['stored_quality'] == 'LABO'
          assert report['playable_candidate_mounted'] is True
          assert report['post_integration_review_available'] is True
          assert report['review_panel_visible_in_capture'] is True
          assert report['review_actions_present'] == ['GARDER', 'AMELIORER', 'REJETER', 'SIGNALER']
          assert report['open_visual_report_created'] is True
          assert report['open_visual_report_blocks_advancement'] is False
          assert report['hard_geometry_gate_passed'] is True
          assert report['resolution'] == [1280, 720]
          assert int(report['stats'].get('buildings', 0)) > 0
          assert int(report['stats'].get('street_surfaces', 0)) > 0
          print('MIDI_CITY_MACHINE_POST_INTEGRATION_CONTRACT_OK mounted=true panel=true visual_report_blocks=false hard_geometry=true')
          PY

      - name: Preserve logs
        if: always()
        run: |
          mkdir -p grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness
          test ! -f /tmp/midi-city-machine-visual.log || cp /tmp/midi-city-machine-visual.log grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/witness.log
          test ! -f /tmp/midi-city-machine-visual-import.log || cp /tmp/midi-city-machine-visual-import.log grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/import.log
          if [ ! -e grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/report.json ]; then
            printf '%s\n' '{"format":"grand-bruxelles-midi-city-machine-post-integration-witness-v1","status":"witness_not_completed","zone_id":"midi_machine_labo","playable_candidate_mounted":false}' > grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness/diagnostic.json
          fi

      - name: Upload owner-visible review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-city-machine-post-integration-witness
          path: grand-bruxelles-game/artifacts/qa/midi_city_machine_post_integration_witness
          if-no-files-found: error
          retention-days: 30
