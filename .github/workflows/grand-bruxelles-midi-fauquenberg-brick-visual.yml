name: Grand Bruxelles Midi Fauquenberg Brick Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/visual/midi_fauquenberg_brick_material_identity.json"
      - "grand-bruxelles-game/game/scripts/brussels_fauquenberg_brick_material.gd"
      - "grand-bruxelles-game/game/scripts/midi_fauquenberg_brick_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_fauquenberg_brick_material_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-midi-fauquenberg-brick-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Midi Fauquenberg deterministic A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_fauquenberg_brick_material_witness_test.gd 2>&1 | tee /tmp/witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_FAUQUENBERG_WITNESS_FAIL" /tmp/witness.log; then exit 1; fi
          grep -q "MIDI_FAUQUENBERG_WITNESS_OK" /tmp/witness.log
      - name: Upload Midi Fauquenberg evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-fauquenberg-brick-ab
          path: |
            grand-bruxelles-game/artifacts/visual/midi_fauquenberg_before.png
            grand-bruxelles-game/artifacts/visual/midi_fauquenberg_after.png
          if-no-files-found: error
