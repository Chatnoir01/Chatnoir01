name: Grand Bruxelles Midi Fonsny Full Entrance Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-fonsny-full-entrance-visual.yml"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_architectural_concrete_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_full_entrance_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-player-eye-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Capture locked same-head BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_fonsny_full_entrance_witness_test.gd 2>&1 | tee /tmp/midi-fonsny-full-entrance-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_FONSNY_FULL_ENTRANCE_WITNESS_FAIL" /tmp/midi-fonsny-full-entrance-visual.log; then exit 1; fi
          grep -F "MIDI_FONSNY_FULL_ENTRANCE_WITNESS_OK" /tmp/midi-fonsny-full-entrance-visual.log
          test -f grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_before.png
          test -f grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_after.png
          test -f grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_metrics.json
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-fonsny-full-entrance-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_before.png
            grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_after.png
            grand-bruxelles-game/artifacts/visual/midi_fonsny_full_entrance_metrics.json
            /tmp/midi-fonsny-full-entrance-visual.log
          if-no-files-found: error
