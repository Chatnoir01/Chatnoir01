name: Grand Bruxelles Midi Fonsny Full Entrance

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-fonsny-full-entrance.yml"
      - "grand-bruxelles-game/data/visual/midi_fonsny_full_entrance_identity.json"
      - "grand-bruxelles-game/game/scripts/midi_architectural_concrete_surface_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_full_entrance_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Prove source contract and in-place replacement
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_fonsny_full_entrance_test.gd 2>&1 | tee /tmp/midi-fonsny-full-entrance.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_FONSNY_FULL_ENTRANCE_TEST_FAIL" /tmp/midi-fonsny-full-entrance.log; then exit 1; fi
          grep -F "MIDI_FONSNY_FULL_ENTRANCE_TEST_OK" /tmp/midi-fonsny-full-entrance.log
