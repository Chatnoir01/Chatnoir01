name: Grand Bruxelles Midi Fonsny Modernist Register

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-fonsny-modernist-register.yml"
      - "grand-bruxelles-game/game/scripts/brussels_modernist_facade_register.gd"
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_modernist_register_test.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_modernist_register_witness_test.gd"
      - "grand-bruxelles-game/docs/provenance/midi_fonsny_modernist_register.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-fonsny-modernist-register:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate reusable frontage register
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/midi_fonsny_modernist_register_test.gd 2>&1 | tee /tmp/midi-fonsny-register.log
          if grep -E "SCRIPT ERROR|Parse Error:|Assertion failed" /tmp/midi-fonsny-register.log; then exit 1; fi
          grep -F "Midi Fonsny modernist register regression: PASS" /tmp/midi-fonsny-register.log
      - name: Capture frozen deterministic full-frame A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_fonsny_modernist_register_witness_test.gd 2>&1 | tee /tmp/midi-fonsny-register-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_FONSNY_REGISTER_WITNESS_FAIL" /tmp/midi-fonsny-register-witness.log; then exit 1; fi
          grep -F "MIDI_FONSNY_REGISTER_WITNESS_OK" /tmp/midi-fonsny-register-witness.log
      - name: Assert evidence package
        run: |
          test -s grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_before.png
          test -s grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_after.png
          file grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_before.png | grep -F "1280 x 720"
          file grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_after.png | grep -F "1280 x 720"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-fonsny-modernist-register-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_before.png
            grand-bruxelles-game/artifacts/visual/midi_fonsny_modernist_register_after.png
            /tmp/midi-fonsny-register.log
            /tmp/midi-fonsny-register-witness.log
          if-no-files-found: error
