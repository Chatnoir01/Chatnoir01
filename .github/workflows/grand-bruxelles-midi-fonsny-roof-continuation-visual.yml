name: Grand Bruxelles Midi Fonsny Roof Continuation Visual

on:
  push:
    branches: ["integration/midi-fonsny-official-roof-continuation-v1"]
    paths:
      - ".github/workflows/grand-bruxelles-midi-fonsny-roof-continuation-visual.yml"
      - "grand-bruxelles-game/data/urbis/midi_fonsny_roof_continuation/**"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_official_roof_continuation.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_official_roof_continuation_visual_test.gd"
      - "grand-bruxelles-game/project.godot"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/urbis/midi_fonsny_roof_continuation/**"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_official_roof_continuation.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_official_roof_continuation_visual_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1, Xvfb and image metrics dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-pil python3-numpy
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Render frozen production-spawn A/B
        shell: bash
        run: |
          set -o pipefail
          cd grand-bruxelles-game
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path . --editor --quit-after 1 >/tmp/import.log 2>&1 || { cat /tmp/import.log; exit 1; }
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path . --script res://game/tests/midi_fonsny_official_roof_continuation_visual_test.gd 2>&1 | tee /tmp/roof-continuation.log
          grep -q "MIDI_FONSNY_ROOF_CONTINUATION_VISUAL_OK" /tmp/roof-continuation.log
          test -s artifacts/midi/fonsny-roof-continuation/before.png
          test -s artifacts/midi/fonsny-roof-continuation/after.png
      - name: Enforce predeclared anti-micro and anti-overreach gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          import numpy as np, json, pathlib
          root=pathlib.Path('grand-bruxelles-game/artifacts/midi/fonsny-roof-continuation')
          a=np.asarray(Image.open(root/'before.png').convert('RGB'), dtype=np.int16)
          b=np.asarray(Image.open(root/'after.png').convert('RGB'), dtype=np.int16)
          d=np.max(np.abs(a-b),axis=2)
          m3=d>3; m8=d>8
          r3=float(m3.mean()); r8=float(m8.mean())
          ys,xs=np.where(m3)
          bbox=None if len(xs)==0 else [int(xs.min()),int(ys.min()),int(xs.max()),int(ys.max())]
          bw=0 if bbox is None else bbox[2]-bbox[0]+1
          bh=0 if bbox is None else bbox[3]-bbox[1]+1
          metrics={'changed3_ratio':r3,'changed8_ratio':r8,'changed3_pixels':int(m3.sum()),'changed8_pixels':int(m8.sum()),'bbox':bbox,'bbox_width':bw,'bbox_height':bh}
          (root/'metrics.json').write_text(json.dumps(metrics,indent=2)+'\n')
          print('MIDI_FONSNY_ROOF_CONTINUATION_METRICS',json.dumps(metrics,sort_keys=True))
          # Predeclared before first render: substantial but not a whole-scene rewrite.
          assert r3 >= 0.025, f'changed3 {r3:.5f} < 0.025'
          assert r8 >= 0.010, f'changed8 {r8:.5f} < 0.010'
          assert bw >= 500 and bh >= 180, f'bbox {bw}x{bh} too localized'
          assert r3 <= 0.35, f'changed3 {r3:.5f} > 0.35 overreach guard'
          PY
      - name: Upload full-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-fonsny-roof-continuation-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/midi/fonsny-roof-continuation/before.png
            grand-bruxelles-game/artifacts/midi/fonsny-roof-continuation/after.png
            grand-bruxelles-game/artifacts/midi/fonsny-roof-continuation/metrics.json
            /tmp/roof-continuation.log
          if-no-files-found: error
