name: Grand Bruxelles Midi Fonsny Teardown

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-fonsny-teardown.yml"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_fonsny_full_entrance_teardown_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teardown-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact main ancestry
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "${{ github.event.pull_request.base.sha }}"
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-fonsny-import.log
      - name: Prove deferred wait and owned root stop at teardown
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_fonsny_full_entrance_teardown_test.gd 2>&1 | tee /tmp/midi-fonsny-teardown.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_FONSNY_FULL_ENTRANCE_TEARDOWN_FAIL" /tmp/midi-fonsny-teardown.log; then exit 1; fi
          grep -F "MIDI_FONSNY_FULL_ENTRANCE_TEARDOWN_OK" /tmp/midi-fonsny-teardown.log
      - name: Persist teardown diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-fonsny-teardown-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/midi-fonsny-import.log
            /tmp/midi-fonsny-teardown.log
          if-no-files-found: error
          retention-days: 14
