name: Grand Bruxelles Midi Architectural Glazing Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-glazing-visual.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/brussels_architectural_glazing_material.gd"
      - "grand-bruxelles-game/game/scripts/midi_architectural_glazing_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_architectural_glazing_material_witness_test.gd"
      - "grand-bruxelles-game/data/visual/midi_architectural_glazing_material_identity.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-glazing-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source-backed architectural glazing presentation and A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_architectural_glazing_material_witness_test.gd 2>&1 | tee /tmp/midi-glazing.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_GLAZING_WITNESS_FAIL" /tmp/midi-glazing.log; then exit 1; fi
          grep -F "MIDI_GLAZING_WITNESS_OK" /tmp/midi-glazing.log
          test -f grand-bruxelles-game/artifacts/visual/midi_glazing_before.png
          test -f grand-bruxelles-game/artifacts/visual/midi_glazing_after.png
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-architectural-glazing-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/midi_glazing_before.png
            grand-bruxelles-game/artifacts/visual/midi_glazing_after.png
            /tmp/midi-glazing.log
          if-no-files-found: error
