name: Grand Bruxelles Midi LoD2 1633645 Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-lod2-1633645-visual.yml"
      - "grand-bruxelles-game/data/urbis/midi_lod2/1633645.game.json"
      - "grand-bruxelles-game/game/scripts/midi_official_lod2_1633645.gd"
      - "grand-bruxelles-game/game/tests/midi_lod2_1633645_visual_test.gd"
      - "grand-bruxelles-game/project.godot"

permissions:
  contents: write
  actions: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Materialize already-audited exact 1633645 geometry
        if: ${{ !hashFiles('grand-bruxelles-game/data/urbis/midi_lod2/1633645.game.json') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/midi-source grand-bruxelles-game/data/urbis/midi_lod2
          gh run download 31837962229 --repo "$GITHUB_REPOSITORY" -n midi-lod2-1633645-source -D /tmp/midi-source
          cp /tmp/midi-source/midi_1633645.game.json grand-bruxelles-game/data/urbis/midi_lod2/1633645.game.json
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/urbis/midi_lod2/1633645.game.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['source']['building_2d_id']=='https://databrussels.be/id/building/1633645'
          assert d['source']['package_sha256']=='a760fdff222ae9431113f82fe1c8f942a9fe2bda40e32064c627ae8d3a21110f'
          assert d['evidence']['face_count']==889 and d['evidence']['triangle_count']==3428
          assert d['evidence']['face_type_counts']['WALLSURFACE']==852
          assert d['evidence']['face_type_counts']['ROOFSURFACE']==34
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add grand-bruxelles-game/data/urbis/midi_lod2/1633645.game.json
          git commit -m "data(midi): materialize audited LoD2 1633645" || true
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render deterministic Midi/Fonsny A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_lod2_1633645_visual_test.gd 2>&1 | tee /tmp/midi-lod2-1633645.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_LOD2_1633645_VISUAL_FAIL" /tmp/midi-lod2-1633645.log; then exit 1; fi
          grep -F "MIDI_LOD2_1633645_VISUAL_OK" /tmp/midi-lod2-1633645.log
          test -f grand-bruxelles-game/artifacts/midi/lod2-1633645/before.png
          test -f grand-bruxelles-game/artifacts/midi/lod2-1633645/after.png
      - name: Enforce full-frame anti-micro gate
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          a=Image.open('grand-bruxelles-game/artifacts/midi/lod2-1633645/before.png').convert('RGB')
          b=Image.open('grand-bruxelles-game/artifacts/midi/lod2-1633645/after.png').convert('RGB')
          assert a.size==(1280,720) and b.size==a.size
          pa=list(a.getdata()); pb=list(b.getdata())
          changed3=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>3)
          changed8=sum(1 for x,y in zip(pa,pb) if max(abs(x[i]-y[i]) for i in range(3))>8)
          total=1280*720
          r3=changed3/total; r8=changed8/total
          print(f'MIDI_LOD2_1633645_PIXEL_GATE changed3={changed3} ratio3={r3:.6f} changed8={changed8} ratio8={r8:.6f}')
          if changed3 < 46080 or r3 < 0.05 or r8 < 0.025:
              raise SystemExit('anti-micro gate failed: exact station LoD2 replacement is not visually substantive')
          PY
      - name: Upload A/B evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-lod2-1633645-visual
          path: |
            grand-bruxelles-game/artifacts/midi/lod2-1633645/before.png
            grand-bruxelles-game/artifacts/midi/lod2-1633645/after.png
            /tmp/midi-lod2-1633645.log
          if-no-files-found: error
