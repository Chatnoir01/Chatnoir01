name: Grand Bruxelles Midi M1 Arrival Audit

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-m1-arrival-audit.yml"
      - "grand-bruxelles-game/game/tests/midi_arrival_m1_audit_capture_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-m1-arrival-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-m1-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-m1-import.log; then exit 1; fi
      - name: Capture production Midi arrival audit
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_arrival_m1_audit_capture_test.gd 2>&1 | tee /tmp/midi-m1-audit.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_M1_AUDIT_FAIL" /tmp/midi-m1-audit.log; then exit 1; fi
          grep -q "MIDI_M1_AUDIT_OK" /tmp/midi-m1-audit.log
      - name: Upload M1 player-view evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-m1-arrival-audit
          path: |
            grand-bruxelles-game/artifacts/visual/midi_m1_arrival_audit/midi_m1_spawn.png
            grand-bruxelles-game/artifacts/visual/midi_m1_arrival_audit/midi_m1_parvis.png
            grand-bruxelles-game/artifacts/visual/midi_m1_arrival_audit/midi_m1_station_face.png
          if-no-files-found: error
