name: Grand Bruxelles Midi Material Dormant Mount

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/midi_blue_stone_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/midi_architectural_concrete_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/midi_architectural_glazing_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/midi_material_runtime_dormant_mount_test.gd'
      - '.github/workflows/grand-bruxelles-midi-material-dormant-mount.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-material-dormant-mount:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-material-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/midi-material-import.log
      - name: Validate dormant off-zone then event-driven Midi mount
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_material_runtime_dormant_mount_test.gd 2>&1 | tee /tmp/midi-material-dormant-mount.log
          grep -q 'MIDI_MATERIAL_DORMANT_MOUNT_OK' /tmp/midi-material-dormant-mount.log
          ! grep -q 'Midi blue-stone runtime: MidiHeroZone missing' /tmp/midi-material-dormant-mount.log
          ! grep -q 'Midi concrete runtime: MidiHeroZone missing' /tmp/midi-material-dormant-mount.log
          ! grep -q 'Midi glazing runtime: MidiHeroZone missing' /tmp/midi-material-dormant-mount.log
