name: Grand Bruxelles Midi Material Owner Registry

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json'
      - 'grand-bruxelles-game/game/scripts/midi_blue_stone_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/midi_architectural_glazing_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/midi_fauquenberg_brick_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/shared_environment_midi_material_owner_registry_test.py'
      - '.github/workflows/grand-bruxelles-midi-material-owner-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-material-owner-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact main ancestry
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --no-tags
          test "$(git merge-base HEAD origin/main)" = "${{ github.event.pull_request.base.sha }}"
      - name: Validate Midi material owner registry
        run: python grand-bruxelles-game/game/tests/shared_environment_midi_material_owner_registry_test.py
