name: Grand Bruxelles Midi Official Paved Forecourt A-B

on:
  push:
    branches:
      - visual/midi-official-paved-forecourt-f592344
    paths:
      - ".github/workflows/grand-bruxelles-midi-official-paved-forecourt-ab.yml"
      - "grand-bruxelles-game/game/scripts/midi_official_paved_forecourt_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_station_envelope_player_capture.gd"
      - "grand-bruxelles-game/game/tests/midi_official_paved_forecourt_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paved-forecourt-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact production base
        uses: actions/checkout@v4
        with:
          ref: f592344c5afe61533faeefc9b862621f9e3ba1ea
          path: base
      - name: Checkout candidate head
        uses: actions/checkout@v4
        with:
          ref: visual/midi-official-paved-forecourt-f592344
          path: head
      - name: Install Godot and software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers python3-pil
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import exact base and head
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/base-import.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/base-import.log /tmp/head-import.log; then exit 1; fi
      - name: Capture frozen production player witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path base/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_station_envelope_player_capture.gd -- /tmp/before.png 2>&1 | tee /tmp/before.log
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path head/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_station_envelope_player_capture.gd -- /tmp/after.png 2>&1 | tee /tmp/after.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_STATION_ENVELOPE_CAPTURE_FAIL" /tmp/before.log /tmp/after.log; then exit 1; fi
          test -s /tmp/before.png && test -s /tmp/after.png
      - name: Enforce predeclared full-frame impact
        shell: bash
        run: |
          python3 - <<'PY' | tee /tmp/metrics.log
          from PIL import Image, ImageChops
          a=Image.open('/tmp/before.png').convert('RGB')
          b=Image.open('/tmp/after.png').convert('RGB')
          assert a.size==b.size==(1280,720)
          diff=ImageChops.difference(a,b)
          px=list(diff.getdata()); n=len(px)
          gt3=sum(max(p)>3 for p in px); gt8=sum(max(p)>8 for p in px)
          r3=gt3/n; r8=gt8/n
          coords=[]
          for y in range(720):
              for x in range(1280):
                  if max(diff.getpixel((x,y))) > 3:
                      coords.append((x,y))
          if coords:
              xs=[p[0] for p in coords]; ys=[p[1] for p in coords]
              bbox=(min(xs),min(ys),max(xs)+1,max(ys)+1)
              bw=bbox[2]-bbox[0]; bh=bbox[3]-bbox[1]
          else:
              bbox=None; bw=bh=0
          print(f'changed_gt3={gt3} ratio_gt3={r3:.6f}')
          print(f'changed_gt8={gt8} ratio_gt8={r8:.6f}')
          print(f'bbox={bbox} bbox_width={bw} bbox_height={bh}')
          print('thresholds: ratio_gt3>=0.030 ratio_gt8>=0.015 bbox>=700x160')
          assert r3 >= 0.030, 'full-frame >3 RGB impact below predeclared threshold'
          assert r8 >= 0.015, 'full-frame >8 RGB impact below predeclared threshold'
          assert bw >= 700 and bh >= 160, 'changed region too localized for Midi arrival giveaway'
          print('MIDI_OFFICIAL_PAVED_FORECOURT_AB_OK human_full_frame_3_second_verdict=REQUIRED')
          PY
      - name: Verify same-scene material-only witness uses identical locked gates
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path head/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/midi_official_paved_forecourt_witness_test.gd 2>&1 | tee /tmp/same-scene.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_OFFICIAL_PAVED_FORECOURT_WITNESS_FAIL" /tmp/same-scene.log; then exit 1; fi
          grep -q "MIDI_OFFICIAL_PAVED_FORECOURT_WITNESS_OK" /tmp/same-scene.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-official-paved-forecourt-ab
          path: |
            /tmp/before.png
            /tmp/after.png
            /tmp/before.log
            /tmp/after.log
            /tmp/metrics.log
            /tmp/same-scene.log
            head/grand-bruxelles-game/artifacts/visual/midi_official_paved_forecourt_before.png
            head/grand-bruxelles-game/artifacts/visual/midi_official_paved_forecourt_after.png
          if-no-files-found: error
