name: Grand Bruxelles Midi Official Street Collision

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/urbis_midi_builder.gd"
      - "grand-bruxelles-game/game/tests/midi_official_street_surface_collision_test.gd"
      - ".github/workflows/grand-bruxelles-midi-official-street-collision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-official-street-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-collision-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-collision-import.log; then exit 1; fi
      - name: Verify player-foot collision reuses official Midi surfaces
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_official_street_surface_collision_test.gd 2>&1 | tee /tmp/midi-collision.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_OFFICIAL_STREET_COLLISION_FAIL" /tmp/midi-collision.log; then exit 1; fi
          grep -q "MIDI_OFFICIAL_STREET_COLLISION_OK" /tmp/midi-collision.log
