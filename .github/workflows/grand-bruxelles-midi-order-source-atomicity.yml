name: Grand Bruxelles Midi Order Source Atomicity

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/midi_automatic_road_rejection_order_invariance_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - ".github/workflows/grand-bruxelles-midi-order-source-atomicity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-atomicity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          test "$(git merge-base "$PR_HEAD_SHA" origin/main)" = "$live_main"
          printf 'MIDI_ATOMIC_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'MIDI_ATOMIC_HEAD_SHA=%s\n' "$PR_HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install verified Godot 4.7.1
        shell: bash
        env:
          GODOT_ZIP_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          printf '%s  %s\n' "$GODOT_ZIP_SHA256" /tmp/godot.zip | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -E '^4\.7\.1\.stable\.'
      - name: Import project before source freeze
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-atomic-import.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-atomic-import.log
      - name: Freeze exact source path read-only
        shell: bash
        run: |
          set -euo pipefail
          source="$(realpath grand-bruxelles-game/data/osm/vertical_slice_01.game.json)"
          pre_sha="$(sha256sum "$source" | awk '{print $1}')"
          printf 'MIDI_ATOMIC_SOURCE=%s\n' "$source" >> "$GITHUB_ENV"
          printf 'MIDI_ATOMIC_SOURCE_SHA=%s\n' "$pre_sha" >> "$GITHUB_ENV"
          sudo mount --bind "$source" "$source"
          sudo mount -o remount,bind,ro "$source"
          findmnt -T "$source" -no TARGET,OPTIONS | tee /tmp/midi-atomic-mount.txt
          findmnt -T "$source" -no OPTIONS | tr ',' '\n' | grep -qx ro
          : > /tmp/midi-atomic-write-denied.log
          if { printf '\n' >> "$source"; } 2>>/tmp/midi-atomic-write-denied.log; then
            echo 'source unexpectedly writable after read-only bind mount' >&2
            exit 1
          fi
          test -s /tmp/midi-atomic-write-denied.log
          test "$(sha256sum "$source" | awk '{print $1}')" = "$pre_sha"
      - name: Run order proof against frozen source
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/midi_automatic_road_rejection_order_invariance_test.gd 2>&1 | tee /tmp/midi-atomic-runtime.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_FAIL" /tmp/midi-atomic-runtime.log
          grep -q "MIDI_AUTOMATIC_ROAD_REJECTION_ORDER_INVARIANCE_GREEN" /tmp/midi-atomic-runtime.log
      - name: Seal source-to-artifact binding
        shell: bash
        run: |
          set -euo pipefail
          result="grand-bruxelles-game/artifacts/qa/midi_automatic_road_rejection_order_invariance.json"
          test -s "$result"
          post_sha="$(sha256sum "$MIDI_ATOMIC_SOURCE" | awk '{print $1}')"
          test "$post_sha" = "$MIDI_ATOMIC_SOURCE_SHA"
          stage=/tmp/midi-order-source-atomicity
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$result" "$stage/order-invariance.json"
          cp /tmp/midi-atomic-runtime.log "$stage/runtime.log"
          cp /tmp/midi-atomic-import.log "$stage/import.log"
          cp /tmp/midi-atomic-mount.txt "$stage/source-mount.txt"
          cp /tmp/midi-atomic-write-denied.log "$stage/source-write-denied.log"
          python3 - "$result" "$MIDI_ATOMIC_SOURCE_SHA" "$post_sha" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); expected=sys.argv[2]; post=sys.argv[3]
          d=json.loads(p.read_text())
          assert d['schema']=='grand-bruxelles-midi-automatic-road-rejection-order-invariance-v1'
          assert d['source_path']=='res://data/osm/vertical_slice_01.game.json'
          assert d['source_sha256']==expected==post
          assert d['mismatch_count']==0 and d['order_invariant'] is True
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['destination_advertisable'] is False and d['visual_acceptance'] is False and d['jouable_authorized'] is False
          pathlib.Path('/tmp/midi-order-source-atomicity/source-binding.txt').write_text(
              'source_binding=frozen_read_only_path\npre_sha256=%s\npost_sha256=%s\nartifact_sha256=%s\n' % (expected,post,d['source_sha256']))
          PY
          (cd "$stage" && find . -maxdepth 1 -type f ! -name evidence-sha256.txt -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > evidence-sha256.txt)
      - name: Revalidate exact proof identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MIDI_ATOMIC_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$MIDI_ATOMIC_HEAD_SHA"
      - name: Upload source atomicity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-order-source-atomicity
          path: /tmp/midi-order-source-atomicity/
          if-no-files-found: error
