name: Grand Bruxelles Midi Player Combat Feel

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/player_melee_combat_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_dodge_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_player_combat_feel_test.gd"
      - ".github/workflows/grand-bruxelles-midi-player-combat-feel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  midi-player-combat-feel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      - name: Import project
        run: godot --headless --path grand-bruxelles-game --editor --quit
      - name: Run 10s combat feel contract
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_player_combat_feel_test.gd 2>&1 | tee /tmp/midi-player-combat-feel.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_PLAYER_COMBAT_FEEL_FAIL" /tmp/midi-player-combat-feel.log; then
            exit 1
          fi
          grep -q "MIDI_PLAYER_COMBAT_FEEL_OK" /tmp/midi-player-combat-feel.log
