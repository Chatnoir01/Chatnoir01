name: Grand Bruxelles Midi Post-Mask Automatic Road Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-post-mask-automatic-road-readiness.yml"
      - "grand-bruxelles-game/game/tests/midi_post_mask_automatic_road_readiness_test.gd"
      - "grand-bruxelles-game/game/scripts/osm_midi_mask.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-mask-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
      - name: Install verified Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log
      - name: Measure post-mask visibility and player-support readiness
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/midi_post_mask_automatic_road_readiness_test.gd 2>&1 | tee /tmp/readiness.log
          ! grep -E "SCRIPT ERROR|Parse Error:|MIDI_POST_MASK_AUTOMATIC_ROAD_READINESS_FAIL" /tmp/readiness.log
          test "$(grep -c 'MIDI_POST_MASK_AUTOMATIC_ROAD_READINESS_OK' /tmp/readiness.log)" -eq 1
      - name: Seal fail-closed receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=grand-bruxelles-game/artifacts/qa/midi_post_mask_automatic_road_readiness.json
          test -s "$RECEIPT"
          python3 - "$RECEIPT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-midi-post-mask-automatic-road-readiness-v1'
          assert d['candidate_count']==8
          assert d['visible_candidate_count']>0
          assert d['osm_to_urbis_crosswalk_claimed'] is False
          assert d['destination_advertisable'] is False
          assert d['visual_acceptance'] is False
          assert d['jouable_authorized'] is False
          assert len(d['rows'])==8
          PY
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-midi-post-mask-automatic-road-readiness
          path: |
            grand-bruxelles-game/artifacts/qa/midi_post_mask_automatic_road_readiness.json
            /tmp/readiness.log
            /tmp/import.log
          if-no-files-found: warn
          retention-days: 7
