name: Grand Bruxelles Midi Realistic Authored NPCs

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/tests/midi_realistic_authored_npcs_contract_test.gd"
      - "grand-bruxelles-game/game/scripts/midi_ambient_npc_visual_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_realistic_authored_npc_runtime.gd"
      - "grand-bruxelles-game/data/runtime/modules/midi_realistic_authored_npcs.json"
      - "grand-bruxelles-game/data/qa/midi_realistic_authored_npcs_contract.json"
      - "grand-bruxelles-game/data/qa/midi_realistic_authored_npcs_candidate_verdict.json"
      - "grand-bruxelles-game/assets/characters/civilians/**"
      - "grand-bruxelles-game/assets/characters/police/**"
      - ".github/workflows/grand-bruxelles-midi-realistic-authored-npcs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-contract-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate LOT remains fidelity-gated and not merge-authorized
        run: |
          python3 - <<'PY'
          import json
          p='grand-bruxelles-game/data/qa/midi_realistic_authored_npcs_contract.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['schema']=='grand-bruxelles-midi-realistic-authored-npcs-v1'
          assert d['status']=='fidelity_iteration'
          assert d['zone']=='midi'
          assert d['scope']=='visual_only'
          assert d['runtime_authorized'] is False
          assert d['merge_authorized'] is False
          assert d['minimum_civilian_identities'] >= 6
          assert d['lod']['legacy_cuboid_fallback_allowed'] is False
          assert d['lod']['far_policy']=='authored_humanoid_lod_or_cull'
          assert d['structural_state']['legacy_cuboid_retired'] is True
          assert d['structural_state']['movement_ai_navigation_changed'] is False
          assert d['candidate_state']['rocketbox']['visual']=='JETER'
          assert d['candidate_state']['rocketbox']['production_authorized'] is False
          assert d['candidate_state']['makehuman']['production_authorized'] is False
          assert d['human_visual_verdict_required'] is True
          assert d['human_visual_verdict'] is None
          assert d['done'] is False
          print('MIDI_REALISTIC_AUTHORED_NPCS_CONTRACT_JSON_GREEN')
          PY

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/midi-realistic-npcs-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/midi-realistic-npcs-import.log; then exit 1; fi

      - name: Prove active GREEN authored-NPC infrastructure contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/midi_realistic_authored_npcs_contract_test.gd \
            2>&1 | tee /tmp/midi-realistic-npcs-contract-green.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_REALISTIC_AUTHORED_NPCS_CONTRACT_FAIL" /tmp/midi-realistic-npcs-contract-green.log; then exit 1; fi
          grep -F "MIDI_REALISTIC_AUTHORED_NPCS_CONTRACT_GREEN" /tmp/midi-realistic-npcs-contract-green.log

      - name: Archive active contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: midi-realistic-authored-npcs-contract-green
          path: |
            /tmp/midi-realistic-npcs-contract-green.log
            /tmp/midi-realistic-npcs-import.log
            grand-bruxelles-game/data/qa/midi_realistic_authored_npcs_contract.json
            grand-bruxelles-game/data/qa/midi_realistic_authored_npcs_candidate_verdict.json
