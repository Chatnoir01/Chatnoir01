name: Grand Bruxelles Midi Station Source Plan

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-station-source-plan.yml"
      - "grand-bruxelles-game/data/urbis/midi/midi_runtime.game.json"
      - "grand-bruxelles-game/game/scripts/midi_hero_zone.gd"
      - "grand-bruxelles-game/game/scripts/midi_station_source_plan.gd"
      - "grand-bruxelles-game/tests/test_midi_station_source_plan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  station-source-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify official UrbIS station plan ownership
        run: python3 grand-bruxelles-game/tests/test_midi_station_source_plan.py
