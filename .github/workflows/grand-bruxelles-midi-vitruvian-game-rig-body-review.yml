name: Grand Bruxelles Midi Vitruvian Game Rig Body Review

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-midi-vitruvian-game-rig-body-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-midi-vitruvian-game-rig-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-game-rig-body-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install source and rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-lfs rsync curl xz-utils unzip \
            libglu1-mesa libopengl0 libgl1-mesa-dri libglx-mesa0
          git lfs install

      - name: Fetch exact CharMorph code and sparse CC0 Vitruvian game-rig source
        shell: bash
        run: |
          set -euo pipefail
          CHARMORPH_COMMIT=e2e87480657c87eb17bbfbd83833bee628494a90
          VITRUVIAN_COMMIT=db7736668dfbcb090019068c8aeab28105af36a0
          ADDON=/tmp/blender-user/scripts/addons/CharMorph
          DATA=/tmp/vitruvian-game-rig-source
          rm -rf /tmp/blender-user "$DATA"
          mkdir -p /tmp/blender-user/scripts/addons

          git clone --filter=blob:none https://github.com/Upliner/CharMorph.git "$ADDON"
          git -C "$ADDON" checkout "$CHARMORPH_COMMIT"
          test "$(git -C "$ADDON" rev-parse HEAD)" = "$CHARMORPH_COMMIT"
          test -s "$ADDON/common.py"
          grep -q "GNU General Public License" "$ADDON/common.py"

          git clone --filter=blob:none --no-checkout https://github.com/seenbuklee/CharMorph-Vitruvian.git "$DATA"
          git -C "$DATA" sparse-checkout init --no-cone
          cat > "$DATA/.git/info/sparse-checkout" <<'SPARSE'
          /.gitattributes
          /README.md
          /config.yaml
          /char.blend
          /rigs.blend
          /bones_rigify.yaml
          /faces.npy
          /morphs/L1/Default.npy
          /weights/gamerig.npz
          /joints/gamerig.npz
          SPARSE
          GIT_LFS_SKIP_SMUDGE=1 git -C "$DATA" checkout "$VITRUVIAN_COMMIT"
          test "$(git -C "$DATA" rev-parse HEAD)" = "$VITRUVIAN_COMMIT"
          git -C "$DATA" lfs pull --include="char.blend,rigs.blend" --exclude=""

          for f in char.blend rigs.blend config.yaml bones_rigify.yaml faces.npy morphs/L1/Default.npy weights/gamerig.npz joints/gamerig.npz; do test -s "$DATA/$f"; done
          grep -q '^license: CC0' "$DATA/config.yaml"
          grep -q '^   game-rig:' "$DATA/config.yaml"
          grep -q 'obj_name: game_rig_vitruvian' "$DATA/config.yaml"
          grep -q 'weights: weights/gamerig.npz' "$DATA/config.yaml"
          grep -q 'joints: joints/gamerig.npz' "$DATA/config.yaml"
          if find "$DATA" -type f \( -iname '*mixamo*' -o -iname '*adobe*' \) -print -quit | grep -q .; then
            echo 'Forbidden Mixamo/Adobe file entered sparse checkout' >&2; exit 1
          fi

          rm -rf "$ADDON/data"
          mkdir -p "$ADDON/data/characters/Vitruvian/morphs/L2" "$ADDON/data/characters/Vitruvian/morphs/L3"
          rsync -a --exclude='.git' "$DATA/" "$ADDON/data/characters/Vitruvian/"
          printf '%s\n' "$CHARMORPH_COMMIT" > /tmp/charmorph-commit.txt
          printf '%s\n' "$VITRUVIAN_COMMIT" > /tmp/vitruvian-game-rig-commit.txt
          (cd "$DATA" && sha256sum config.yaml char.blend rigs.blend bones_rigify.yaml faces.npy morphs/L1/Default.npy weights/gamerig.npz joints/gamerig.npz) | tee /tmp/source-sha256.txt
          echo "GB_VITRUVIAN_GAME_RIG_SOURCE_OK charmorph=$CHARMORPH_COMMIT vitruvian=$VITRUVIAN_COMMIT rig=game-rig mixamo_files=0"

      - name: Install pinned Blender 4.5.12 LTS
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://download.blender.org/release/Blender4.5
          A=blender-4.5.12-linux-x64.tar.xz
          curl -fL --retry 3 -o /tmp/$A "$BASE/$A"
          curl -fL --retry 3 -o /tmp/blender.sha256 "$BASE/blender-4.5.12.sha256"
          grep " $A$" /tmp/blender.sha256 > /tmp/linux.sha256
          (cd /tmp && sha256sum -c linux.sha256)
          tar -C /tmp -xf /tmp/$A
          /tmp/blender-4.5.12-linux-x64/blender --version | tee /tmp/blender-version.txt
          grep -q 'Blender 4.5.12' /tmp/blender-version.txt

      - name: Build clean static game-rig GLB and prove deformation
        shell: bash
        env:
          BLENDER_USER_SCRIPTS: /tmp/blender-user/scripts
        run: |
          set -euo pipefail
          cat > /tmp/build_body.py <<'PY'
          import bpy, json, math, pathlib, sys, traceback
          OUT=pathlib.Path('/tmp/vitruvian_game_rig_body.glb')
          REP=pathlib.Path('/tmp/vitruvian_game_rig_body.report.json')
          def fail(m): print('GB_VITRUVIAN_GAME_RIG_FAIL',m); raise RuntimeError(m)
          try:
              try: bpy.ops.preferences.addon_enable(module='CharMorph')
              except Exception:
                  sys.path.insert(0,'/tmp/blender-user/scripts/addons'); import CharMorph; CharMorph.register()
              from CharMorph.common import manager
              obj=bpy.data.objects.get('cm_vitruvian')
              if obj is None: fail('cm_vitruvian missing')
              bpy.ops.object.select_all(action='DESELECT'); obj.hide_set(False); obj.select_set(True); bpy.context.view_layer.objects.active=obj
              manager.create_charmorphs(obj); m=manager.morpher
              if not m or getattr(m,'error',None): fail('CharMorph recognition failed: %s'%getattr(m,'error',None))
              rigs=sorted(str(k) for k in m.core.char.armature.keys()); print('GB_AVAILABLE_RIGS',rigs)
              if 'game-rig' not in rigs: fail('game-rig unavailable')
              ui=bpy.context.window_manager.charmorph_ui; ui.rig='game-rig'; ui.rig_manual_sculpt=False; ui.rig_manual_joints=False; ui.rig_manual_weights=False
              if 'FINISHED' not in bpy.ops.charmorph.rig(): fail('charmorph.rig did not finish')
              rig=obj.find_armature()
              if rig is None: fail('armature missing')
              rig_type=str(rig.data.get('charmorph_rig_type',''))
              if rig_type!='game-rig': fail('wrong rig type '+rig_type)
              bones=[b.name for b in rig.data.bones]
              bad=[n for n in bones if any(t in n.lower() for t in ('mixamo','adobe'))]
              if bad or len(bones)<35: fail('bone gate failed count=%d bad=%s'%(len(bones),bad[:10]))
              if not any(mod.type=='ARMATURE' and mod.object==rig for mod in obj.modifiers): fail('armature modifier missing')
              active=[]
              for d in (obj,rig):
                  ad=getattr(d,'animation_data',None)
                  if ad and ad.action: active.append(ad.action.name)
              if active: fail('active animation actions '+str(active))

              bone_set=set(bones); candidates=[]
              for vg in obj.vertex_groups:
                  if vg.name not in bone_set or not any(t in vg.name.lower() for t in ('arm','thigh','leg','shin')): continue
                  ids=[]
                  for v in obj.data.vertices:
                      if any(g.group==vg.index and g.weight>.15 for g in v.groups): ids.append(v.index)
                  if len(ids)>=20: candidates.append((len(ids),vg.name,ids[:400]))
              candidates.sort(reverse=True)
              if not candidates: fail('weighted limb group missing')
              _,probe,ids=candidates[0]; pb=rig.pose.bones.get(probe)
              deps=bpy.context.evaluated_depsgraph_get(); ev=obj.evaluated_get(deps); mesh=ev.to_mesh(); before=[mesh.vertices[i].co.copy() for i in ids]; ev.to_mesh_clear()
              pb.rotation_mode='XYZ'; pb.rotation_euler[0]+=math.radians(18); bpy.context.view_layer.update()
              ev=obj.evaluated_get(deps); mesh=ev.to_mesh(); disp=[(mesh.vertices[i].co-before[j]).length for j,i in enumerate(ids)]; ev.to_mesh_clear(); pb.rotation_euler=(0,0,0); bpy.context.view_layer.update()
              moved=sum(d>.001 for d in disp); maxd=max(disp)
              if moved<10 or maxd<=.003: fail('deformation proof failed probe=%s moved=%d max=%f'%(probe,moved,maxd))

              neutral=bpy.data.materials.new('GB_Body_Smoke_Neutral'); neutral.diffuse_color=(.42,.30,.24,1); neutral.roughness=.72
              obj.data.materials.clear(); obj.data.materials.append(neutral)
              for p in obj.data.polygons: p.material_index=0
              for a in list(bpy.data.actions): bpy.data.actions.remove(a)
              for d in (obj,rig):
                  if d.animation_data: d.animation_data_clear()
              bpy.ops.object.select_all(action='DESELECT'); obj.select_set(True); rig.select_set(True); bpy.context.view_layer.objects.active=rig
              bpy.ops.export_scene.gltf(filepath=str(OUT),export_format='GLB',use_selection=True,export_animations=False,export_skins=True,export_morph=False,export_materials='EXPORT')
              if not OUT.exists() or OUT.stat().st_size<10000: fail('GLB export missing')
              r={'schema':'grand-bruxelles-vitruvian-game-rig-body-smoke-v2','production_authorized':False,'rig_type':rig_type,'available_rigs':rigs,'bone_count':len(bones),'bone_names':bones,'forbidden_bones':bad,'animation_actions_before_export':active,'deformation_probe_bone':probe,'deformation_moved_vertices':moved,'deformation_max_local_m':maxd,'glb_bytes':OUT.stat().st_size,'character_license':'CC0','tool_license':'GPL-3.0'}
              REP.write_text(json.dumps(r,indent=2)+'\n'); print('GB_VITRUVIAN_GAME_RIG_OK',json.dumps({k:r[k] for k in ('rig_type','bone_count','deformation_probe_bone','deformation_moved_vertices','deformation_max_local_m','glb_bytes')},sort_keys=True))
          except Exception as e: traceback.print_exc(); fail(str(e))
          PY
          /tmp/blender-4.5.12-linux-x64/blender --background /tmp/vitruvian-game-rig-source/char.blend --python /tmp/build_body.py 2>&1 | tee /tmp/blender-body.log
          grep -q 'GB_VITRUVIAN_GAME_RIG_OK' /tmp/blender-body.log
          ! grep -q 'GB_VITRUVIAN_GAME_RIG_FAIL' /tmp/blender-body.log
          test -s /tmp/vitruvian_game_rig_body.glb
          test -s /tmp/vitruvian_game_rig_body.report.json

      - name: Prove GLB is static skinned and Mixamo-free
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,struct
          b=pathlib.Path('/tmp/vitruvian_game_rig_body.glb').read_bytes(); off=12; d=None
          while off+8<=len(b):
              n,t=struct.unpack_from('<II',b,off);off+=8;x=b[off:off+n];off+=n
              if t==0x4E4F534A:d=json.loads(x.rstrip(b'\x00 \t\r\n').decode())
          if d is None: raise SystemExit('no GLB JSON')
          if d.get('animations'): raise SystemExit('animations entered GLB')
          s=json.dumps(d).lower()
          if any(t in s for t in ('mixamo','mixamorig','adobe')): raise SystemExit('forbidden token in GLB')
          skins=d.get('skins') or []; joints=max((len(x.get('joints') or []) for x in skins),default=0)
          if not skins or joints<35: raise SystemExit(f'skin gate failed skins={len(skins)} joints={joints}')
          r={'animations':0,'skins':len(skins),'joint_count':joints,'nodes':len(d.get('nodes') or []),'meshes':len(d.get('meshes') or []),'mixamo_tokens':0,'production_authorized':False}
          pathlib.Path('/tmp/glb-audit.json').write_text(json.dumps(r,indent=2)+'\n');print('GB_VITRUVIAN_GAME_RIG_GLB_AUDIT_OK',json.dumps(r,sort_keys=True))
          PY

      - name: Install Godot 4.7.1 and import body in Compatibility
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot; chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          R=grand-bruxelles-game/assets/characters/_review/vitruvian_game_rig_v1; mkdir -p "$R"; cp /tmp/vitruvian_game_rig_body.glb "$R/body.glb"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit --rendering-method gl_compatibility 2>&1 | tee /tmp/godot-body-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load|couldn.t be loaded|Clamped index' /tmp/godot-body-import.log; then exit 1; fi
          echo 'GB_VITRUVIAN_GAME_RIG_GODOT_IMPORT_OK'

      - name: Stage body smoke evidence
        if: always()
        shell: bash
        run: |
          OUT=grand-bruxelles-game/artifacts/qa/midi_vitruvian_game_rig_body_smoke; mkdir -p "$OUT"
          cp /tmp/vitruvian_game_rig_body.report.json "$OUT/blender_body_report.json" 2>/dev/null || true
          cp /tmp/glb-audit.json "$OUT/glb_audit.json" 2>/dev/null || true
          cp /tmp/blender-body.log "$OUT/blender.log" 2>/dev/null || true
          cp /tmp/godot-body-import.log "$OUT/godot_import.log" 2>/dev/null || true
          cp /tmp/source-sha256.txt "$OUT/source_sha256.txt" 2>/dev/null || true
          cp /tmp/charmorph-commit.txt "$OUT/charmorph_commit.txt" 2>/dev/null || true
          cp /tmp/vitruvian-game-rig-commit.txt "$OUT/vitruvian_commit.txt" 2>/dev/null || true
          cp /tmp/blender-version.txt "$OUT/blender_version.txt" 2>/dev/null || true
          cp /tmp/blender-user/scripts/addons/CharMorph/common.py "$OUT/charmorph_gpl_header_proof.py" 2>/dev/null || true
          cp /tmp/vitruvian-game-rig-source/config.yaml "$OUT/vitruvian_config_CC0.yaml" 2>/dev/null || true
          printf '%s\n' '{"status":"body_smoke_review_only","production_authorized":false,"rig":"game-rig","mixamo_payload_allowed":false,"animations_allowed":false,"final_materials":false,"hair_included":false,"human_visual_verdict_required_before_promotion":true}' > "$OUT/authorization.json"

      - name: Upload clean Vitruvian game-rig body smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midi-realistic-authored-npcs-vitruvian-game-rig-body-smoke
          path: grand-bruxelles-game/artifacts/qa/midi_vitruvian_game_rig_body_smoke
          if-no-files-found: warn
