name: Grand Bruxelles Missing Road Source Artifact Lock

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/brussels_missing_road_source_artifact_lock.json'
      - 'grand-bruxelles-game/tests/test_missing_road_source_artifact_lock.py'
      - '.github/workflows/grand-bruxelles-missing-road-source-artifact-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-locked-acquisition-evidence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate immutable 16-commune acquisition lock
        run: python -m pytest -q tests/test_missing_road_source_artifact_lock.py
