name: Grand Bruxelles Missing Road Source Batch

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/source_plans/brussels_missing_road_source_registry.json'
      - 'grand-bruxelles-game/data/source_plans/brussels_missing_road_source_acquisition_evidence.lock.json'
      - 'grand-bruxelles-game/tools/city_machine/acquire_municipality_road_source.py'
      - 'grand-bruxelles-game/tests/test_brussels_missing_road_source_registry.py'
      - 'grand-bruxelles-game/tests/test_brussels_missing_road_source_acquisition_evidence_lock.py'
      - 'grand-bruxelles-game/tests/test_municipality_road_source_acquisition.py'
      - '.github/workflows/grand-bruxelles-missing-road-source-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression runner
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"
      - name: Validate exact missing-source registry and immutable acquisition evidence
        run: |
          python -m pytest -q \
            tests/test_brussels_missing_road_source_registry.py \
            tests/test_brussels_missing_road_source_acquisition_evidence_lock.py \
            tests/test_municipality_road_source_acquisition.py

  acquire-unresolved-road-sources:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {nis: '21003', id: berchem_sainte_agathe}
          - {nis: '21006', id: evere}
          - {nis: '21008', id: ganshoren}
          - {nis: '21009', id: ixelles}
          - {nis: '21010', id: jette}
          - {nis: '21012', id: molenbeek_saint_jean}
          - {nis: '21014', id: saint_josse_ten_noode}
          - {nis: '21015', id: schaerbeek}
          - {nis: '21018', id: woluwe_saint_lambert}
    defaults:
      run:
        working-directory: grand-bruxelles-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build locked municipality manifest
        run: |
          python tools/city_machine/acquire_municipality_road_source.py \
            --registry data/source_plans/brussels_missing_road_source_registry.json \
            --municipality-nis '${{ matrix.nis }}' \
            --municipality-id '${{ matrix.id }}' \
            --manifest-output artifacts/${{ matrix.id }}.manifest.json
      - name: Acquire unresolved source-backed roads
        run: |
          python tools/city_machine/acquire_municipality_road_source.py \
            --manifest artifacts/${{ matrix.id }}.manifest.json \
            --raw-output artifacts/${{ matrix.id }}_road_source.raw.json \
            --game-output artifacts/${{ matrix.id }}_road_source.game.json \
            --receipt-output artifacts/${{ matrix.id }}_road_source.receipt.json
      - name: Upload immutable municipality candidate
        uses: actions/upload-artifact@v4
        with:
          name: road-source-${{ matrix.nis }}-${{ matrix.id }}
          path: |
            grand-bruxelles-game/artifacts/${{ matrix.id }}.manifest.json
            grand-bruxelles-game/artifacts/${{ matrix.id }}_road_source.raw.json
            grand-bruxelles-game/artifacts/${{ matrix.id }}_road_source.game.json
            grand-bruxelles-game/artifacts/${{ matrix.id }}_road_source.receipt.json
          if-no-files-found: error
          retention-days: 30
