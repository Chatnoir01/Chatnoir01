name: Grand Bruxelles Mission GPS

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/osm_minimap.gd"
      - "grand-bruxelles-game/game/tests/mission_gps_test.gd"
      - ".github/workflows/grand-bruxelles-mission-gps.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/osm_minimap.gd"
      - "grand-bruxelles-game/game/tests/mission_gps_test.gd"
      - ".github/workflows/grand-bruxelles-mission-gps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-gps:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Mission GPS runtime test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/mission_gps_test.gd 2>&1 | tee /tmp/gps.log
          if grep -E "SCRIPT ERROR|Parse Error:|MISSION_GPS_FAIL" /tmp/gps.log; then exit 1; fi
          grep -q "MISSION_GPS_OK" /tmp/gps.log
