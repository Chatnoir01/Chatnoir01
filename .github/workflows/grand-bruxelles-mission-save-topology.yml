name: Grand Bruxelles Mission Save Topology

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/mission_save_coordinator.gd"
      - "grand-bruxelles-game/game/tests/mission_save_topology_test.gd"
      - ".github/workflows/grand-bruxelles-mission-save-topology.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/mission_save_coordinator.gd"
      - "grand-bruxelles-game/game/tests/mission_save_topology_test.gd"
      - ".github/workflows/grand-bruxelles-mission-save-topology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Reject incompatible mission save topology
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/mission_save_topology_test.gd 2>&1 | tee /tmp/mission-save-topology.log
          if grep -E "SCRIPT ERROR|Parse Error:|MISSION_SAVE_TOPOLOGY_FAIL" /tmp/mission-save-topology.log; then
            exit 1
          fi
          grep -q "MISSION_SAVE_TOPOLOGY_OK" /tmp/mission-save-topology.log
