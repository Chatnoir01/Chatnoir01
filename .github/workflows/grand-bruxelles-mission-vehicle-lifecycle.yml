name: Grand Bruxelles Mission Vehicle Lifecycle

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/mission_drive_to_center.gd"
      - "grand-bruxelles-game/game/tests/mission_vehicle_lifecycle_test.gd"
      - ".github/workflows/grand-bruxelles-mission-vehicle-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-vehicle-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -F "4.7.1.stable"
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path grand-bruxelles-game --quit 2>&1 | tee /tmp/mission-vehicle-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script|Failed to import" /tmp/mission-vehicle-import.log; then exit 1; fi
      - name: Prove mission survives production vehicle cleanup
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/mission_vehicle_lifecycle_test.gd 2>&1 | tee /tmp/mission-vehicle-lifecycle.log
          if grep -E "SCRIPT ERROR|Parse Error:|MISSION_VEHICLE_LIFECYCLE_FAIL" /tmp/mission-vehicle-lifecycle.log; then exit 1; fi
          grep -F "MISSION_VEHICLE_LIFECYCLE_GREEN production_vehicle=PrototypeCar removed_prototype=true reference_valid=true" /tmp/mission-vehicle-lifecycle.log
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-mission-vehicle-lifecycle
          path: |
            /tmp/mission-vehicle-import.log
            /tmp/mission-vehicle-lifecycle.log
          if-no-files-found: error
