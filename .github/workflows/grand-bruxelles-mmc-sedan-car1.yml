name: Grand Bruxelles MMC Sedan CAR-1

on:
  push:
    branches:
      - visual/mmc-generic-sedan-car1-3d720b7
  pull_request:
    paths:
      - "grand-bruxelles-game/assets/vehicles/mmc_generic_sedan/**"
      - "grand-bruxelles-game/game/scripts/mmc_generic_sedan_car1_runtime.gd"
      - "grand-bruxelles-game/game/tests/mmc_generic_sedan_car1_runtime_test.gd"
      - "grand-bruxelles-game/data/runtime/modules/mmc_generic_sedan_car1.json"
      - ".github/workflows/grand-bruxelles-mmc-sedan-car1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-mmc-sedan-car1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify controlled provenance
        shell: bash
        run: |
          set -euo pipefail
          PROVENANCE=grand-bruxelles-game/assets/vehicles/mmc_generic_sedan/PROVENANCE.md
          test -s "$PROVENANCE"
          grep -q "MMC Works" "$PROVENANCE"
          grep -q "58c33766470d46e7b2aed542650494e5" "$PROVENANCE"
          grep -q "Creative Commons Attribution" "$PROVENANCE"
          grep -q "production_authorized=false" "$PROVENANCE"

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/mmc-car1-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script|ERROR: Couldn't load project data" /tmp/mmc-car1-import.log; then
            exit 1
          fi

      - name: Run fail-closed CAR-1 runtime test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/mmc_generic_sedan_car1_runtime_test.gd 2>&1 | tee /tmp/mmc-car1-test.log
          if grep -E "SCRIPT ERROR|Parse Error:|MMC_GENERIC_SEDAN_CAR1_FAIL" /tmp/mmc-car1-test.log; then
            exit 1
          fi
          grep -q "MMC_GENERIC_SEDAN_CAR1_OK" /tmp/mmc-car1-test.log

      - name: Enforce authenticated-byte gate
        shell: bash
        run: |
          set -euo pipefail
          MODEL=grand-bruxelles-game/assets/vehicles/mmc_generic_sedan/generic_sedan.glb
          if [ -f "$MODEL" ]; then
            test -s "$MODEL"
            grep -Eq "SHA-256|SHA256|sha256" grand-bruxelles-game/assets/vehicles/mmc_generic_sedan/PROVENANCE.md
            echo "MMC_CAR1_ASSET_PRESENT: full visual/size/performance owner review is now required before merge"
          else
            echo "MMC_CAR1_ASSET_PENDING: official authenticated download not committed; fallback contract proven only"
          fi
