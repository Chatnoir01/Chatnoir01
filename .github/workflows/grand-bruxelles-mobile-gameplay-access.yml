name: Grand Bruxelles Mobile Gameplay Access

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/mobile_controls.gd"
      - "grand-bruxelles-game/game/tests/mobile_gameplay_access_test.gd"
      - ".github/workflows/grand-bruxelles-mobile-gameplay-access.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/mobile_controls.gd"
      - "grand-bruxelles-game/game/tests/mobile_gameplay_access_test.gd"
      - ".github/workflows/grand-bruxelles-mobile-gameplay-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then
            exit 1
          fi

      - name: Mobile gameplay access runtime test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/mobile_gameplay_access_test.gd 2>&1 | tee /tmp/mobile-gameplay.log
          if grep -E "SCRIPT ERROR|Parse Error:|MOBILE_GAMEPLAY_ACCESS_FAIL" /tmp/mobile-gameplay.log; then
            exit 1
          fi
          grep -q "MOBILE_GAMEPLAY_ACCESS_OK" /tmp/mobile-gameplay.log
