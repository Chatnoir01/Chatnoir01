name: Grand Bruxelles Mobile Playability

on:
  push:
    branches: ["agent/mobile-playability-vehicle-ab"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-mobile-playability.yml"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/mobile_controls.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/scripts/mobile_playability_collision_runtime.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_dynamics_60hz.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_physics_controller.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1655673.gd"
      - "grand-bruxelles-game/game/scripts/grand_place_official_lod2_1786758.gd"
      - "grand-bruxelles-game/game/tests/mobile_playability_runtime_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-playability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/mobile-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/mobile-import.log; then exit 1; fi
      - name: Run mobile playability runtime probe
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/mobile_playability_runtime_test.gd 2>&1 | tee /tmp/mobile-playability.log
          if grep -E "SCRIPT ERROR|Parse Error:|MOBILE_PLAYABILITY_FAIL" /tmp/mobile-playability.log; then exit 1; fi
          grep -F "MOBILE_PLAYABILITY_OK" /tmp/mobile-playability.log
