name: Grand Bruxelles MPFB 2.0.17 Identity Probe

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-mpfb-2017-identity-probe.yml"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe approved Blender Extensions MPFB 2.0.17 archive
        run: |
          set -euo pipefail
          API="https://extensions.blender.org/api/v1/extensions/?blender_version=4.2.0&platform=linux-x64"
          curl --fail --location --retry 3 --retry-all-errors \
            -H 'Accept: application/json' "$API" -o /tmp/extensions.json
          python3 - <<'PY' > /tmp/mpfb-identity.env
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/extensions.json').read_text(encoding='utf-8'))
          matches = [item for item in data.get('data', []) if item.get('id') == 'mpfb']
          assert len(matches) == 1, f'mpfb matches={len(matches)}'
          item = matches[0]
          assert item.get('version') == '2.0.17', item.get('version')
          assert item.get('blender_version_min') == '4.2.0', item.get('blender_version_min')
          archive_hash = item.get('archive_hash', '')
          assert archive_hash.startswith('sha256:'), archive_hash
          print(f"MPFB_URL={item['archive_url']}")
          print(f"MPFB_SIZE={item['archive_size']}")
          print(f"MPFB_SHA256={archive_hash.split(':', 1)[1]}")
          PY
          cat /tmp/mpfb-identity.env
          source /tmp/mpfb-identity.env
          curl --fail --location --retry 3 --retry-all-errors "$MPFB_URL" -o /tmp/mpfb-2.0.17.zip
          test "$(stat -c '%s' /tmp/mpfb-2.0.17.zip)" = "$MPFB_SIZE"
          test "$(sha256sum /tmp/mpfb-2.0.17.zip | awk '{print $1}')" = "$MPFB_SHA256"
          python3 - <<'PY'
          import hashlib, re, zipfile
          from pathlib import Path, PurePosixPath

          p = Path('/tmp/mpfb-2.0.17.zip')
          raw = p.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              assert bad is None, bad
              names = [n for n in z.namelist() if not n.endswith('/')]
              manifests = [n for n in names if PurePosixPath(n).name == 'blender_manifest.toml']
              assert manifests, 'blender_manifest.toml not found'
              manifest_name = min(manifests, key=lambda n: (n.count('/'), len(n)))
              parent = str(PurePosixPath(manifest_name).parent)
              init_name = '__init__.py' if parent == '.' else f'{parent}/__init__.py'
              assert init_name in names, f'__init__.py next to manifest not found: manifest={manifest_name}'
              manifest = z.read(manifest_name).decode('utf-8')
              init_py = z.read(init_name).decode('utf-8')
          version = re.search(r'^version\s*=\s*"([^"]+)"', manifest, re.M)
          build = re.search(r'^BUILD_INFO\s*=\s*"([^"]+)"', init_py, re.M)
          blender_min = re.search(r'^blender_version_min\s*=\s*"([^"]+)"', manifest, re.M)
          assert version and version.group(1) == '2.0.17', version.group(1) if version else None
          assert blender_min and blender_min.group(1) == '4.2.0', blender_min.group(1) if blender_min else None
          assert build, 'BUILD_INFO not found'
          print(
              'MPFB_2017_STABLE_IDENTITY_OK '
              f'bytes={len(raw)} sha256={digest} version={version.group(1)} '
              f'build={build.group(1)} blender_min={blender_min.group(1)} '
              f'manifest_path={manifest_name}'
          )
          PY
