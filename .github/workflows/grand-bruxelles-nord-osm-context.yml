name: Grand Bruxelles Gare du Nord OSM context

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/grand-bruxelles-nord-osm-context.yml'
      - 'grand-bruxelles-game/tools/fetch_osm_slice.py'
      - 'grand-bruxelles-game/tools/transform_osm_to_game.py'
      - 'grand-bruxelles-game/tools/validate_nord_osm_context.py'
  push:
    branches:
      - feat/gare-du-nord-source-truth
    paths:
      - '.github/workflows/grand-bruxelles-nord-osm-context.yml'
      - 'grand-bruxelles-game/tools/fetch_osm_slice.py'
      - 'grand-bruxelles-game/tools/transform_osm_to_game.py'
      - 'grand-bruxelles-game/tools/validate_nord_osm_context.py'

permissions:
  contents: read

concurrency:
  group: gare-du-nord-osm-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          echo "NORD_OSM_EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Compile OSM tools
        working-directory: grand-bruxelles-game
        run: |
          python -m py_compile tools/fetch_osm_slice.py tools/transform_osm_to_game.py tools/validate_nord_osm_context.py

      - name: Acquire modest Nord OSM envelope
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          rm -rf artifacts/qa/nord_osm_context
          mkdir -p artifacts/qa/nord_osm_context
          python tools/fetch_osm_slice.py \
            --bbox '50.8583895,4.3545482,50.8628851,4.3687525' \
            --retries 4 \
            --output artifacts/qa/nord_osm_context/nord.raw.json

      - name: Transform around corrected Nord origin
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          python tools/transform_osm_to_game.py \
            --input artifacts/qa/nord_osm_context/nord.raw.json \
            --output artifacts/qa/nord_osm_context/nord.game.json \
            --origin '50.860637490313074,4.361650664440722'

      - name: Validate before runtime binding
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          python tools/validate_nord_osm_context.py artifacts/qa/nord_osm_context/nord.game.json

      - name: Record non-promotion receipt
        working-directory: grand-bruxelles-game
        run: |
          cat > artifacts/qa/nord_osm_context/receipt.txt <<'EOF'
          NORD_OSM_CONTEXT_RECEIPT
          source=OpenStreetMap contributors via Overpass API
          license=ODbL-1.0
          runtime_bound=false
          photo_match=false
          promotion=false
          jouable=false
          purpose=street_context_preflight_only
          EOF

      - name: Upload OSM preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: nord-osm-context-${{ github.event.pull_request.head.sha || github.sha }}
          path: grand-bruxelles-game/artifacts/qa/nord_osm_context
          if-no-files-found: error
          retention-days: 30
