name: Grand Bruxelles NPC Daily Schedule

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/npc_daily_schedule.gd"
      - "grand-bruxelles-game/game/scripts/npc_civilian_schedule_resume.gd"
      - "grand-bruxelles-game/game/tests/npc_daily_schedule_recovery_test.gd"
      - ".github/workflows/grand-bruxelles-npc-daily-schedule.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import scripts
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Civilian daily schedule recovery test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/npc_daily_schedule_recovery_test.gd 2>&1 | tee /tmp/test.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_DAILY_SCHEDULE_RECOVERY_FAIL" /tmp/test.log; then exit 1; fi
          grep -q "NPC_DAILY_SCHEDULE_RECOVERY_OK" /tmp/test.log
