name: Grand Bruxelles NPC Dialogue Visible

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-npc-dialogue-visible.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/npc/dialogue/midi_resident.game.json"
      - "grand-bruxelles-game/game/scripts/npc_dialogue_interaction_runtime.gd"
      - "grand-bruxelles-game/game/scripts/npc_llm_session.gd"
      - "grand-bruxelles-game/game/scripts/npc_dialogue_catalog.gd"
      - "grand-bruxelles-game/game/tests/npc_dialogue_interaction_runtime_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-dialogue-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/npc-dialogue-visible-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/npc-dialogue-visible-import.log; then exit 1; fi
      - name: Prove production-pedestrian dialogue contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/npc_dialogue_interaction_runtime_test.gd 2>&1 | tee /tmp/npc-dialogue-visible.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_DIALOGUE_VISIBLE_FAIL" /tmp/npc-dialogue-visible.log; then exit 1; fi
          grep -F "NPC_DIALOGUE_VISIBLE_OK" /tmp/npc-dialogue-visible.log
      - name: Capture visible NPC dialogue witness
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --script res://game/tests/npc_dialogue_interaction_runtime_test.gd -- capture=1 \
            2>&1 | tee /tmp/npc-dialogue-visible-capture.log
          grep -F "NPC_DIALOGUE_VISIBLE_WITNESS_OK" /tmp/npc-dialogue-visible-capture.log
      - uses: actions/upload-artifact@v4
        with:
          name: npc-dialogue-visible-witness
          path: grand-bruxelles-game/artifacts/visual/npc_dialogue_visible_1280x720.png
