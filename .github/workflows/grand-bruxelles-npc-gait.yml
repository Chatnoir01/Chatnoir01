name: Grand Bruxelles NPC Gait

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/midi_profiled_npc_gait_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_test.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_lod_reentry_test.gd"
      - ".github/workflows/grand-bruxelles-npc-gait.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/midi_profiled_npc_gait_runtime.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_test.gd"
      - "grand-bruxelles-game/game/tests/midi_profiled_npc_gait_lod_reentry_test.gd"
      - ".github/workflows/grand-bruxelles-npc-gait.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-npc-gait-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npc-gait:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor \
            --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Profiled NPC gait regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/midi_profiled_npc_gait_test.gd 2>&1 | tee /tmp/npc-gait.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_PROFILED_NPC_GAIT_FAIL" /tmp/npc-gait.log; then
            exit 1
          fi
          grep -q "MIDI_PROFILED_NPC_GAIT_OK" /tmp/npc-gait.log

      - name: NPC gait LOD re-entry continuity regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/midi_profiled_npc_gait_lod_reentry_test.gd 2>&1 | tee /tmp/npc-gait-lod-reentry.log
          if grep -E "SCRIPT ERROR|Parse Error:|MIDI_PROFILED_NPC_GAIT_LOD_REENTRY_FAIL" /tmp/npc-gait-lod-reentry.log; then
            exit 1
          fi
          grep -q "MIDI_PROFILED_NPC_GAIT_LOD_REENTRY_OK" /tmp/npc-gait-lod-reentry.log
