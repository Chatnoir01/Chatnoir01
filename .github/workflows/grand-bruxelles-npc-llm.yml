name: Grand Bruxelles NPC LLM Lot 1

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/npc_dialogue_*.gd"
      - "grand-bruxelles-game/game/scripts/npc_llm_*.gd"
      - "grand-bruxelles-game/game/tests/npc_dialogue_*.gd"
      - "grand-bruxelles-game/game/tests/npc_llm_*.gd"
      - "grand-bruxelles-game/config/npc_llm_model.json"
      - "grand-bruxelles-game/tools/download_npc_llm.py"
      - "grand-bruxelles-game/tools/run_npc_llm.sh"
      - ".github/workflows/grand-bruxelles-npc-llm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-npc-llm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import NPC LLM scripts headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/npc-llm-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/npc-llm-import.log; then
            exit 1
          fi

      - name: Dialogue rules test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/npc_dialogue_rules_test.gd 2>&1 | tee /tmp/npc-dialogue-rules.log
          grep -q "NPC_DIALOGUE_RULES_OK" /tmp/npc-dialogue-rules.log

      - name: Isolated NPC session test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/npc_dialogue_session_test.gd 2>&1 | tee /tmp/npc-dialogue-session.log
          grep -q "NPC_DIALOGUE_SESSION_OK" /tmp/npc-dialogue-session.log

      - name: Offline fallback test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/npc_llm_offline_test.gd 2>&1 | tee /tmp/npc-llm-offline.log
          grep -q "NPC_LLM_OFFLINE_OK" /tmp/npc-llm-offline.log

      - name: Download pinned Qwen model
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/download_npc_llm.py
          sha256sum -c <(echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  .models/npc/qwen2.5-0.5b-instruct-q4_k_m.gguf")

      - name: Install pinned llama.cpp server
        run: |
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 20 \
            -o /tmp/llama.tar.gz \
            https://github.com/ggml-org/llama.cpp/releases/download/b10173/llama-b10173-bin-ubuntu-x64.tar.gz
          echo "0dd14e9ffd6564263ef46b259818eee5addea453281f3572ffaa93c01949b32f  /tmp/llama.tar.gz" | sha256sum -c -
          mkdir -p /tmp/llama
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          find /tmp/llama -type f -name llama-server -exec chmod +x {} \;
          LLAMA_SERVER_PATH="$(find /tmp/llama -type f -name llama-server | head -n 1)"
          test -n "$LLAMA_SERVER_PATH"
          echo "LLAMA_SERVER_PATH=$LLAMA_SERVER_PATH" >> "$GITHUB_ENV"

      - name: Start real Qwen server
        working-directory: grand-bruxelles-game
        run: |
          LLAMA_SERVER="$LLAMA_SERVER_PATH" bash tools/run_npc_llm.sh >/tmp/npc-llm-server.log 2>&1 &
          echo $! >/tmp/npc-llm-server.pid
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8089/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/npc-llm-server.log
          exit 1

      - name: Real Qwen NPC conversation test
        env:
          GB_NPC_LLM_ENDPOINT: http://127.0.0.1:8089/v1/chat/completions
          GB_NPC_LLM_MODEL: grand-bruxelles-npc-qwen
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/npc_llm_live_test.gd 2>&1 | tee /tmp/npc-llm-live.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_LLM_LIVE_FAIL" /tmp/npc-llm-live.log; then
            exit 1
          fi
          grep -q "NPC_LLM_LIVE_OK" /tmp/npc-llm-live.log

      - name: Server diagnostics on failure
        if: failure()
        run: cat /tmp/npc-llm-server.log || true
