name: Grand Bruxelles NPC Pack Bake

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-npc-pack-bake.yml"
      - "grand-bruxelles-game/tools/bake_npc_pack.py"
      - "grand-bruxelles-game/tests/test_npc_pack_bake.py"
      - "grand-bruxelles-game/game/scripts/npc_profile_pack.gd"
      - "grand-bruxelles-game/game/tests/npc_profile_pack_test.gd"
      - "grand-bruxelles-game/data/npc/packs/*.pack.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npc-pack-bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate LLM-authored pack baker
        run: python3 -m unittest grand-bruxelles-game/tests/test_npc_pack_bake.py
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/npc-pack-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/npc-pack-import.log; then exit 1; fi
      - name: Prove model-off runtime pack
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/npc_profile_pack_test.gd 2>&1 | tee /tmp/npc-pack.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_PROFILE_PACK_FAIL" /tmp/npc-pack.log; then exit 1; fi
          grep -F "NPC_PROFILE_PACK_OK" /tmp/npc-pack.log
