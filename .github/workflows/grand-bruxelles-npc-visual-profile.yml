name: Grand Bruxelles NPC Visual Profile

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/scripts/npc_appearance_profile.gd"
      - "grand-bruxelles-game/game/scripts/visible_city_runtime.gd"
      - "grand-bruxelles-game/game/tests/npc_visual_profile_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/npc_visual_profile_capture_test.gd"
      - ".github/workflows/grand-bruxelles-npc-visual-profile.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/scripts/npc_appearance_profile.gd"
      - "grand-bruxelles-game/game/scripts/visible_city_runtime.gd"
      - "grand-bruxelles-game/game/tests/npc_visual_profile_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/npc_visual_profile_capture_test.gd"
      - ".github/workflows/grand-bruxelles-npc-visual-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production-crowd-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/npc-visual-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/npc-visual-import.log; then exit 1; fi
      - name: Production crowd visual profile regression
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/npc_visual_profile_runtime_test.gd 2>&1 | tee /tmp/npc-visual-profile.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_VISUAL_PROFILE_RUNTIME_FAIL" /tmp/npc-visual-profile.log; then exit 1; fi
          grep -q "NPC_VISUAL_PROFILE_RUNTIME_OK" /tmp/npc-visual-profile.log
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Render reproducible crowd witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1024x720 \
            --script res://game/tests/npc_visual_profile_capture_test.gd 2>&1 | tee /tmp/npc-visual-profile-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|NPC_VISUAL_PROFILE_CAPTURE_FAIL" /tmp/npc-visual-profile-capture.log; then exit 1; fi
          grep -q "NPC_VISUAL_PROFILE_CAPTURE_OK" /tmp/npc-visual-profile-capture.log
          test -f grand-bruxelles-game/artifacts/npc/npc_visual_profile.png
      - name: Upload crowd visual witness
        uses: actions/upload-artifact@v4
        with:
          name: npc-visual-profile-witness
          path: grand-bruxelles-game/artifacts/npc/npc_visual_profile.png
          if-no-files-found: error
