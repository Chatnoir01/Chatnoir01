name: Grand Bruxelles OSM Bounds Integrity

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-bounds-integrity.yml"
      - "grand-bruxelles-game/data/osm/zones/**/environment.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_bounds_integrity_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounds-integrity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-bounds-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-bounds-import.log; then exit 1; fi
      - name: Prove source bounds integrity
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_bounds_integrity_test.gd 2>&1 | tee /tmp/osm-bounds.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_BOUNDS_INTEGRITY_FAIL" /tmp/osm-bounds.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_BOUNDS_INTEGRITY_OK" /tmp/osm-bounds.log
