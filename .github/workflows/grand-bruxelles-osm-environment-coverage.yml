name: Grand Bruxelles OSM Environment Coverage

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-environment-coverage.yml"
      - "grand-bruxelles-game/tools/measure_osm_environment_coverage.py"
      - "grand-bruxelles-game/tools/test_measure_osm_environment_coverage.py"
      - "grand-bruxelles-game/tools/fetch_osm_slice.py"
      - "grand-bruxelles-game/tools/make_runtime_slice.py"
      - "grand-bruxelles-game/tools/transform_osm_to_game.py"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic measurement regression
        run: python3 grand-bruxelles-game/tools/test_measure_osm_environment_coverage.py
      - name: Measure live OSM point coverage in playable corridor
        run: python3 grand-bruxelles-game/tools/measure_osm_environment_coverage.py --output /tmp/osm_environment_coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: osm-environment-coverage
          path: /tmp/osm_environment_coverage.json
          if-no-files-found: error
