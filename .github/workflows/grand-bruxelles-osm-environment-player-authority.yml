name: Grand Bruxelles OSM Environment Player Authority

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-environment-player-authority.yml"
      - "grand-bruxelles-game/data/osm/zones/jette/environment.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_environment_player_authority_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-authority-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry and exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD origin/main)"
          test "$MERGE_BASE" = "$LIVE_MAIN"
          printf '%s\n' "$LIVE_MAIN" > /tmp/osm-environment-player-authority-main.sha
          printf '%s\n' "$PR_HEAD_SHA" > /tmp/osm-environment-player-authority-head.sha
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable\.'
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-environment-player-authority-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-environment-player-authority-import.log; then exit 1; fi
      - name: Prove current-scene Player authority
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_environment_player_authority_test.gd 2>&1 | tee /tmp/osm-environment-player-authority.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_ENVIRONMENT_PLAYER_AUTHORITY_FAIL" /tmp/osm-environment-player-authority.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_ENVIRONMENT_PLAYER_AUTHORITY_OK" /tmp/osm-environment-player-authority.log
          grep -q "config_recovery=true" /tmp/osm-environment-player-authority.log
      - name: Revalidate live main and exact head after witness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat /tmp/osm-environment-player-authority-head.sha)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$(cat /tmp/osm-environment-player-authority-main.sha)"
