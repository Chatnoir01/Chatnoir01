name: Grand Bruxelles OSM Facade Deferred Teardown

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_facade_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_facade_articulation_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_osm_facade_deferred_teardown_test.gd'
      - 'grand-bruxelles-game/game/tests/shared_environment_external_signal_terminal_cleanup_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_material_ownership_teardown_test.py'
      - 'grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json'
      - 'grand-bruxelles-game/game/tests/shared_environment_lifecycle_contract_test.py'
      - '.github/workflows/grand-bruxelles-osm-facade-deferred-teardown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade-deferred-teardown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: facade teardown witness checked out stale/merge ref" >&2
            exit 1
          }
      - name: Verify terminal external-signal cleanup contract
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/shared_environment_external_signal_terminal_cleanup_test.py
      - name: Verify facade material ownership teardown contract
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/shared_environment_material_ownership_teardown_test.py
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/facade-teardown-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/facade-teardown-import.log
      - name: Prove facade deferred callbacks stop at teardown
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/brussels_osm_facade_deferred_teardown_test.gd 2>&1 | tee /tmp/facade-teardown.log
          grep -q 'BRUSSELS_OSM_FACADE_DEFERRED_TEARDOWN_OK' /tmp/facade-teardown.log
