name: Grand Bruxelles OSM Facade Readability

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_osm_facade_surface_material.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_facade_readability_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_facade_readability_witness_test.gd"
      - ".github/workflows/grand-bruxelles-osm-facade-readability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade-readability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/facade-readability-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/facade-readability-import.log; then exit 1; fi
      - name: Validate generic facade readability contract
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_facade_readability_test.gd 2>&1 | tee /tmp/facade-readability-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_FACADE_READABILITY_FAIL" /tmp/facade-readability-contract.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_FACADE_READABILITY_OK" /tmp/facade-readability-contract.log
      - name: 1280x720 normal-player generic facade A/B
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_facade_readability_witness_test.gd 2>&1 | tee /tmp/facade-readability-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_FACADE_READABILITY_VISUAL_FAIL" /tmp/facade-readability-witness.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_FACADE_READABILITY_VISUAL_OK" /tmp/facade-readability-witness.log
      - name: Upload generic facade readability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-osm-facade-readability-ab
          path: |
            grand-bruxelles-game/artifacts/visual/facade_readability_before.png
            grand-bruxelles-game/artifacts/visual/facade_readability_after.png
            grand-bruxelles-game/artifacts/visual/facade_readability_control.png
            /tmp/facade-readability-witness.log
          if-no-files-found: warn
