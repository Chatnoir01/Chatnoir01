name: Grand Bruxelles OSM Facade Readability

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_facade_surface_material.gd'
      - 'grand-bruxelles-game/game/tests/brussels_osm_facade_readability_test.gd'
      - '.github/workflows/grand-bruxelles-osm-facade-readability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade-readability:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/facade-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/facade-import.log; then exit 1; fi
      - name: Validate generic facade readability contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_facade_readability_test.gd 2>&1 | tee /tmp/facade-readability.log
          grep -q 'BRUSSELS_OSM_FACADE_READABILITY_OK' /tmp/facade-readability.log
