name: Grand Bruxelles OSM Facade Surface

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_facade_surface_material.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_facade_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_facade_surface_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_facade_surface_witness_test.gd"
      - ".github/workflows/grand-bruxelles-osm-facade-surface.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facade-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-facade-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-facade-import.log; then exit 1; fi
      - name: Validate shared facade surface contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_facade_surface_test.gd 2>&1 | tee /tmp/osm-facade-surface.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_FACADE_SURFACE_FAIL" /tmp/osm-facade-surface.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_FACADE_SURFACE_OK" /tmp/osm-facade-surface.log
      - name: 1280x720 normal-player facade A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_facade_surface_witness_test.gd 2>&1 | tee /tmp/osm-facade-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_FACADE_SURFACE_VISUAL_FAIL" /tmp/osm-facade-witness.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_FACADE_SURFACE_VISUAL_OK" /tmp/osm-facade-witness.log
      - name: Upload facade surface evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-osm-facade-surface-ab
          path: |
            grand-bruxelles-game/artifacts/visual/osm_facade_surface_before.png
            grand-bruxelles-game/artifacts/visual/osm_facade_surface_after.png
          if-no-files-found: error
