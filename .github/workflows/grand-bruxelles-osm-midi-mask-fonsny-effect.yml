name: Grand Bruxelles OSM Midi Mask Fonsny Effect

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-midi-mask-fonsny-effect.yml"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/osm_midi_mask.gd"
      - "grand-bruxelles-game/game/scripts/generic_osm_surface_collision_runtime.gd"
      - "grand-bruxelles-game/game/tests/osm_midi_mask_fonsny_effect_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fonsny-effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main ancestry and exact head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            test "$HEAD_SHA" = "$PR_HEAD_SHA"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
          printf 'FONSNY_BASE_SHA=%s\n' "$MAIN_SHA" >> "$GITHUB_ENV"
          printf 'FONSNY_HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install verified Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "$GODOT_SHA256  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'
      - name: Prepare exact base worktree with revision-neutral witness
        run: |
          set -euo pipefail
          witness=grand-bruxelles-game/game/tests/osm_midi_mask_fonsny_effect_test.gd
          cp "$witness" /tmp/osm_midi_mask_fonsny_effect_test.gd
          rm -rf /tmp/gbg-fonsny-base
          git worktree add --detach /tmp/gbg-fonsny-base "$FONSNY_BASE_SHA"
          mkdir -p /tmp/gbg-fonsny-base/grand-bruxelles-game/game/tests
          cp /tmp/osm_midi_mask_fonsny_effect_test.gd /tmp/gbg-fonsny-base/$witness
      - name: Import exact base and head projects
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path /tmp/gbg-fonsny-base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/base-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/base-import.log; then exit 1; fi
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/head-import.log; then exit 1; fi
      - name: Measure exact base Fonsny visibility and player-support collision
        run: |
          set -euo pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path /tmp/gbg-fonsny-base/grand-bruxelles-game --script res://game/tests/osm_midi_mask_fonsny_effect_test.gd 2>&1 | tee /tmp/base-effect.log
          if grep -E "SCRIPT ERROR|Parse Error:|OSM_MIDI_MASK_FONSNY_EFFECT_FAIL" /tmp/base-effect.log; then exit 1; fi
          test "$(grep -c 'OSM_MIDI_MASK_FONSNY_EFFECT_OK' /tmp/base-effect.log)" -eq 1
      - name: Measure exact head Fonsny visibility and player-support collision
        run: |
          set -euo pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/osm_midi_mask_fonsny_effect_test.gd 2>&1 | tee /tmp/head-effect.log
          if grep -E "SCRIPT ERROR|Parse Error:|OSM_MIDI_MASK_FONSNY_EFFECT_FAIL" /tmp/head-effect.log; then exit 1; fi
          test "$(grep -c 'OSM_MIDI_MASK_FONSNY_EFFECT_OK' /tmp/head-effect.log)" -eq 1
      - name: Seal exact base-head effect evidence
        run: |
          set -euo pipefail
          base_result=/tmp/gbg-fonsny-base/grand-bruxelles-game/artifacts/qa/osm_midi_mask_fonsny_effect.json
          head_result=grand-bruxelles-game/artifacts/qa/osm_midi_mask_fonsny_effect.json
          test -s "$base_result"
          test -s "$head_result"
          stage=/tmp/osm-midi-mask-fonsny-effect
          rm -rf "$stage" && mkdir -p "$stage"
          cp "$base_result" "$stage/base-effect.json"
          cp "$head_result" "$stage/head-effect.json"
          cp /tmp/base-effect.log "$stage/base-effect.log"
          cp /tmp/head-effect.log "$stage/head-effect.log"
          cp /tmp/base-import.log "$stage/base-import.log"
          cp /tmp/head-import.log "$stage/head-import.log"
          python3 - "$stage/base-effect.json" "$stage/head-effect.json" "$stage/ab.json" <<'PY'
          import json, os, pathlib, sys
          bp,hp,op=map(pathlib.Path,sys.argv[1:])
          b=json.loads(bp.read_text()); h=json.loads(hp.read_text())
          for d in (b,h):
              assert d['schema']=='grand-bruxelles-osm-midi-mask-fonsny-effect-v2'
              assert d['candidate_count']==8
              assert len(d['candidate_ids'])==8 and len(set(d['candidate_ids']))==8
              assert d['exact_geometry_count'] >= 8
              assert 0 <= d['visible_renderable_geometry_count'] <= d['exact_geometry_count']
              assert 0 <= d['visible_candidate_count'] <= 8
              assert 0 <= d['player_support_collision_candidate_count'] <= 8
              assert d['player_support_collision_layer'] == 1 << 19
              assert d['player_support_collision_mask'] == 0
              assert d['player_support_collision_mode'] == 'top_surfaces_only'
              assert d['collision_contract_preserved'] is True
              assert len(d['rows'])==8
              for row in d['rows']:
                  assert row['osm_id'] in d['candidate_ids']
                  assert row['exact_geometry'] > 0
                  assert 0 <= row['visible_renderable_geometry'] <= row['exact_geometry']
                  if row['player_support_collision']:
                      assert row['visible_renderable_geometry'] > 0
              assert d['diagnostic_only'] is True
              for key in ('osm_to_urbis_crosswalk_claimed','source_geometry_changed','resolver_changed','destination_advertisable','visual_acceptance','jouable_authorized'):
                  assert d[key] is False
          assert b['source_sha256'] == h['source_sha256']
          assert b['candidate_ids'] == h['candidate_ids']
          assert b['exact_geometry_count'] == h['exact_geometry_count']
          # #2011 shipped the Fonsny fallback repair into main. From that point on this
          # workflow is a preservation gate: every exact Fonsny geometry must stay
          # rendered and every candidate must stay in canonical player-support collision.
          assert b['visible_renderable_geometry_count'] == b['exact_geometry_count']
          assert b['visible_candidate_count'] == b['candidate_count']
          assert b['player_support_collision_candidate_count'] == b['candidate_count']
          assert h['visible_renderable_geometry_count'] == h['exact_geometry_count']
          assert h['visible_candidate_count'] == h['candidate_count']
          assert h['player_support_collision_candidate_count'] == h['candidate_count']
          assert h['visible_renderable_geometry_count'] == b['visible_renderable_geometry_count']
          assert h['visible_candidate_count'] == b['visible_candidate_count']
          assert h['player_support_collision_candidate_count'] == b['player_support_collision_candidate_count']
          ab={
              'schema':'grand-bruxelles-osm-midi-mask-fonsny-preservation-ab-v1',
              'contract_mode':'post-2011-full-coverage-preservation',
              'base_sha':os.environ['FONSNY_BASE_SHA'],
              'head_sha':os.environ['FONSNY_HEAD_SHA'],
              'source_sha256':h['source_sha256'],
              'candidate_ids':h['candidate_ids'],
              'exact_geometry_count':h['exact_geometry_count'],
              'base_visible_geometry':b['visible_renderable_geometry_count'],
              'head_visible_geometry':h['visible_renderable_geometry_count'],
              'base_visible_candidates':b['visible_candidate_count'],
              'head_visible_candidates':h['visible_candidate_count'],
              'base_player_support_collision_candidates':b['player_support_collision_candidate_count'],
              'head_player_support_collision_candidates':h['player_support_collision_candidate_count'],
              'collision_contract_preserved':True,
              'source_geometry_changed':False,
              'diagnostic_only':True,
              'visual_acceptance':False,
              'jouable_authorized':False,
          }
          op.write_text(json.dumps(ab,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$stage" && sha256sum base-effect.json head-effect.json ab.json base-effect.log head-effect.log base-import.log head-import.log > evidence-sha256.txt)
      - name: Revalidate exact proof identity
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$FONSNY_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$FONSNY_HEAD_SHA"
      - name: Upload Fonsny exact A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-midi-mask-fonsny-effect
          path: /tmp/osm-midi-mask-fonsny-effect/
          if-no-files-found: error
          retention-days: 7
