name: Grand Bruxelles OSM Nearby Allocation Prefilter

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd'
      - 'grand-bruxelles-game/game/tests/test_osm_environment_nearby_allocation_prefilter_contract.py'
      - '.github/workflows/grand-bruxelles-osm-nearby-allocation-prefilter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify allocation-free rejection contract
        run: python3 grand-bruxelles-game/game/tests/test_osm_environment_nearby_allocation_prefilter_contract.py
