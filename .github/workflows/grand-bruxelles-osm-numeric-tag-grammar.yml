name: Grand Bruxelles OSM Numeric Tag Grammar

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/validate_osm_numeric_tag_grammar.py'
      - 'grand-bruxelles-game/tools/transform_osm_to_game.py'
      - 'grand-bruxelles-game/tests/test_transform_osm_numeric_tag_grammar.py'
      - '.github/workflows/grand-bruxelles-osm-numeric-tag-grammar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-tag-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main base and exact head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
            test "$HEAD_SHA" = "$PR_HEAD_SHA"
          else
            PR_BASE_SHA="$(git merge-base HEAD origin/main)"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$PR_BASE_SHA"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
      - name: Compile shared numeric grammar tools
        run: |
          python -m py_compile grand-bruxelles-game/tools/transform_osm_to_game.py
          python -m py_compile grand-bruxelles-game/tools/validate_osm_numeric_tag_grammar.py
      - name: Prove shared fail-closed numeric grammar
        run: |
          python grand-bruxelles-game/tools/validate_osm_numeric_tag_grammar.py --self-test
          python grand-bruxelles-game/tests/test_transform_osm_numeric_tag_grammar.py
