name: Grand Bruxelles OSM Owned Batch Visibility Repair

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-owned-batch-visibility-repair.yml"
      - "grand-bruxelles-game/data/osm/zones/jette/environment.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_owned_batch_visibility_repair_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-batch-visibility-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact-current-main ancestry and exact PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$PR_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$PR_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "pr_head=$PR_HEAD_SHA"
          echo "checked_out_head=$checked_out_head"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
          printf 'VISIBILITY_REPAIR_VALIDATED_BASE_SHA=%s\n' "$live_main" >> "$GITHUB_ENV"
          printf 'VISIBILITY_REPAIR_VALIDATED_HEAD_SHA=%s\n' "$checked_out_head" >> "$GITHUB_ENV"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/godot /tmp/godot.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4.7.1.stable'
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-owned-batch-visibility-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-owned-batch-visibility-import.log; then exit 1; fi
      - name: Prove owned batch visibility repair
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_owned_batch_visibility_repair_test.gd 2>&1 | tee /tmp/osm-owned-batch-visibility-repair.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_OWNED_BATCH_VISIBILITY_REPAIR_FAIL" /tmp/osm-owned-batch-visibility-repair.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_OWNED_BATCH_VISIBILITY_REPAIR_OK" /tmp/osm-owned-batch-visibility-repair.log
      - name: Revalidate proof identity before success
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$VISIBILITY_REPAIR_VALIDATED_BASE_SHA"
          test "$(git rev-parse HEAD)" = "$VISIBILITY_REPAIR_VALIDATED_HEAD_SHA"
