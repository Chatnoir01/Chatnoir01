name: Grand Bruxelles OSM Rail Surface

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-rail-surface.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_rail_surface_material.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_rail_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_rail_surface_authority_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_rail_surface_visual_test.gd"
      - "grand-bruxelles-game/tests/test_brussels_osm_rail_surface_contract.py"
      - "grand-bruxelles-game/tests/check_brussels_osm_rail_surface_ab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm-rail-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit source proximity and require reusable existing-geometry owner
        run: python grand-bruxelles-game/tests/test_brussels_osm_rail_surface_contract.py
      - name: Install visual dependencies
        if: success()
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        if: success()
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        if: success()
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-rail-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-rail-import.log; then exit 1; fi
      - name: Prove OSM rail surface ownership topology
        if: success()
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_rail_surface_authority_test.gd 2>&1 | tee /tmp/osm-rail-authority.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_RAIL_SURFACE_AUTHORITY_FAIL" /tmp/osm-rail-authority.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_RAIL_SURFACE_AUTHORITY_OK" /tmp/osm-rail-authority.log
      - name: Capture legitimate normal-player rail A/B
        if: success()
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_rail_surface_visual_test.gd 2>&1 | tee /tmp/osm-rail-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_RAIL_SURFACE_VISUAL_FAIL" /tmp/osm-rail-visual.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_RAIL_SURFACE_VISUAL_OK" /tmp/osm-rail-visual.log
      - name: Enforce locked anti-micro thresholds
        if: success()
        run: python grand-bruxelles-game/tests/check_brussels_osm_rail_surface_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brussels-osm-rail-surface-ab
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_osm_rail_surface_before.png
            grand-bruxelles-game/artifacts/visual/brussels_osm_rail_surface_after.png
            /tmp/osm-rail-import.log
            /tmp/osm-rail-authority.log
            /tmp/osm-rail-visual.log
