name: Grand Bruxelles OSM Road Extension Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-road-extension-reconciliation.yml"
      - "grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json"
      - "grand-bruxelles-game/tools/qa/reconcile_osm_road_extension_candidate.py"
      - "grand-bruxelles-game/tests/test_osm_road_extension_reconciliation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTRACT: grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json
  TOOL: grand-bruxelles-game/tools/qa/reconcile_osm_road_extension_candidate.py
  PREDECESSOR: grand-bruxelles-game/data/osm/vertical_slice_01.game.json

jobs:
  reconcile-source-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry and closed rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA"
          python3 - "$LIVE_MAIN_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          c=json.loads(Path("grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json").read_text())
          assert c["schema"] == "grand-bruxelles-osm-road-extension-reconciliation-v1"
          assert c["status"] == "LOCKED_RECONCILIATION_MEASUREMENT"
          assert c["production_base_sha"] == sys.argv[1], (c["production_base_sha"], sys.argv[1])
          assert c["predecessor"]["sha256"] == "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398"
          assert c["extension"]["artifact_id"] == 9617302727
          assert c["extension"]["artifact_zip_sha256"] == "8e5bd2508c5827cb9d14dc4a319044cbc6fbe2f96ed14fbca06b4db6e79933e3"
          assert c["extension"]["raw_sha256"] == "80544caed58414f3f3c58274659fcb9ec9487621976c263843af7c59d007b4ab"
          assert c["extension"]["acquisition_semantic_sha256"] == "7264a311b7688350126a9faa4a1e16eab7e7eea0cbc231217c3080488d7a41bf"
          frame=c["historical_coverage_frame"]
          assert frame["crs"] == "EPSG:31370"
          assert frame["origin_easting_m"] == 147868.29422791934
          assert frame["origin_northing_m"] == 169538.62414926197
          assert frame["formula"] == "E=origin_easting_m+x;N=origin_northing_m-z"
          assert c["review_verdict"]["status"] == "HOLD_FRAME_RECONCILIATION_REQUIRED"
          assert c["review_verdict"]["historical_coverage_frame_compatible_with_extension"] is False
          assert c["review_verdict"]["projected_source_origin_frame_is_supported_candidate"] is True
          assert c["review_verdict"]["projected_source_origin_frame_authorized_for_production"] is False
          assert c["review_verdict"]["source_merge_decision"] == "HOLD"
          assert all(value is False for value in c["authorization"].values())
          print("OSM_ROAD_EXTENSION_RECONCILIATION_CONTRACT_OK locked rails=closed")
          PY

      - name: Verify exact predecessor and acquisition contracts
        shell: bash
        run: |
          set -euo pipefail
          echo "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398  $PREDECESSOR" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500.contract.json").read_text())
          assert c["schema"] == "grand-bruxelles-osm-road-extension-acquisition-v2"
          assert c["status"] == "LOCKED_SOURCE_ONLY_ARTIFACT"
          assert c["locked_evidence"]["artifact_id"] == 9617302727
          assert c["locked_evidence"]["raw_sha256"] == "80544caed58414f3f3c58274659fcb9ec9487621976c263843af7c59d007b4ab"
          assert c["locked_evidence"]["semantic_sha256"] == "7264a311b7688350126a9faa4a1e16eab7e7eea0cbc231217c3080488d7a41bf"
          assert c["predecessor"]["source_sha256"] == "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398"
          assert all(value is False for value in c["authorization"].values())
          print("LOCKED_EXTENSION_INPUT_OK")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned projection dependency
        run: python -m pip install --disable-pip-version-check "pyproj==3.7.2"

      - name: Run reconciliation regressions
        working-directory: grand-bruxelles-game
        run: python -m unittest tests/test_osm_road_extension_reconciliation.py -v

      - name: Restore immutable source and reviewed reconciliation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SRC_ZIP="$RUNNER_TEMP/osm-road-extension-e148500-n170500-red-first.zip"
          SRC_OUT="$RUNNER_TEMP/osm-road-extension-locked"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9617302727/zip" -o "$SRC_ZIP"
          echo "8e5bd2508c5827cb9d14dc4a319044cbc6fbe2f96ed14fbca06b4db6e79933e3  $SRC_ZIP" | sha256sum -c -
          test "$(wc -c < "$SRC_ZIP")" -eq 79621
          mkdir -p "$SRC_OUT"
          unzip -q "$SRC_ZIP" -d "$SRC_OUT"
          echo "80544caed58414f3f3c58274659fcb9ec9487621976c263843af7c59d007b4ab  $SRC_OUT/overpass.raw.json" | sha256sum -c -
          test "$(wc -c < "$SRC_OUT/overpass.raw.json")" -eq 538236

          LOCK_ZIP="$RUNNER_TEMP/reconciliation-first-run.zip"
          LOCK_OUT="$RUNNER_TEMP/reconciliation-first-run"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9628947559/zip" -o "$LOCK_ZIP"
          echo "93eccce67e657da4d9cc289a01478221e222ec39009a628b4cc2a4c8f9182d62  $LOCK_ZIP" | sha256sum -c -
          test "$(wc -c < "$LOCK_ZIP")" -eq 4105
          mkdir -p "$LOCK_OUT"
          unzip -q "$LOCK_ZIP" -d "$LOCK_OUT"
          echo "4fa712348ff1e8f699c90b413e4187f5e6b0fce608804e4e2d9d6f0cf584388b  $LOCK_OUT/reconciliation.measurement.json" | sha256sum -c -
          test "$(wc -c < "$LOCK_OUT/reconciliation.measurement.json")" -eq 26813

      - name: Regenerate and byte-compare reviewed measurement
        shell: bash
        run: |
          set -euo pipefail
          python "$TOOL" \
            --contract "$CONTRACT" \
            --predecessor "$PREDECESSOR" \
            --extension-raw "$RUNNER_TEMP/osm-road-extension-locked/overpass.raw.json" \
            --output "$RUNNER_TEMP/reconciliation.measurement.json"
          echo "4fa712348ff1e8f699c90b413e4187f5e6b0fce608804e4e2d9d6f0cf584388b  $RUNNER_TEMP/reconciliation.measurement.json" | sha256sum -c -
          test "$(wc -c < "$RUNNER_TEMP/reconciliation.measurement.json")" -eq 26813
          cmp "$RUNNER_TEMP/reconciliation-first-run/reconciliation.measurement.json" "$RUNNER_TEMP/reconciliation.measurement.json"

      - name: Require exact locked accounting and frame verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          c=json.loads(Path("grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json").read_text())
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"reconciliation.measurement.json").read_text())
          lock=c["locked_measurement"]
          assert d["semantic_sha256"] == lock["semantic_sha256"] == "32f3b83ccedacc98f48cb4824b82a1758e436df87cf6849806340d10b5d0ec8d"
          assert d["accounting"] == lock["accounting"]
          assert d["duplicate_osm_way_ids"] == lock["duplicate_osm_way_ids"]
          assert d["extension_only_way_ids_sha256"] == lock["extension_only_way_ids_sha256"]
          assert d["frame_comparison"]["projected_source_origin_lambert72"] == lock["frame_comparison"]["projected_source_origin_lambert72"]
          assert d["frame_comparison"]["projected_minus_historical_origin_m"] == lock["frame_comparison"]["projected_minus_historical_origin_m"]
          assert d["frame_comparison"]["origin_delta_magnitude_m"] == lock["frame_comparison"]["origin_delta_magnitude_m"]
          assert d["historical_frame_fit"] == lock["historical_frame_fit"]
          assert d["projected_source_origin_frame_fit"] == lock["projected_source_origin_frame_fit"]
          assert lock["workflow_run_id"] == 33027454450 and lock["artifact_id"] == 9628947559
          assert lock["artifact_zip_sha256"] == "93eccce67e657da4d9cc289a01478221e222ec39009a628b4cc2a4c8f9182d62"
          assert lock["measurement_sha256"] == "4fa712348ff1e8f699c90b413e4187f5e6b0fce608804e4e2d9d6f0cf584388b"
          assert d["interpretation"]["source_merge_decision"] == "HOLD_PENDING_REVIEW"
          assert all(value is False for value in d["authorization"].values())
          print("OSM_ROAD_EXTENSION_RECONCILIATION_LOCKED_EXACT duplicates=14 extension_only=577 historical_residual_m=917.673964 projected_residual_m=0.544052 source_merge_authorized=false")
          PY

      - name: Upload reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: osm-road-extension-e148500-n170500-reconciliation-reproduction
          path: ${{ runner.temp }}/reconciliation.measurement.json
          if-no-files-found: error
          retention-days: 30
