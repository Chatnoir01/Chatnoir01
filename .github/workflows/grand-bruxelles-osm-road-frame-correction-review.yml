name: Grand Bruxelles OSM Road Frame Correction Review

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-road-frame-correction-review.yml"
      - "grand-bruxelles-game/data/qa/osm_road_frame_correction_review.contract.json"
      - "grand-bruxelles-game/tools/qa/review_osm_road_frame_correction.py"
      - "grand-bruxelles-game/tests/test_osm_road_frame_correction_review.py"
      - "grand-bruxelles-game/data/qa/osm_road_extension_e148500_n170500_reconciliation.contract.json"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-frame-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Require exact live-main ancestry and review-only rails
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA"
          python3 - "$LIVE_MAIN_SHA" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          c=json.loads(Path("grand-bruxelles-game/data/qa/osm_road_frame_correction_review.contract.json").read_text())
          evidence_base=c["production_base_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", evidence_base), evidence_base
          subprocess.run(["git", "merge-base", "--is-ancestor", evidence_base, sys.argv[1]], check=True)
          assert c["status"] == "READY_FOR_FRAME_CORRECTION_REVIEW_SOURCE_ORIGIN"
          assert c["review_semantic_sha256"] == "03242b68dac6541bce21052e1e869fd577e4b08045b4999c0f4c3ac9cb5fd7f9"
          assert all(value is False for value in c["authorization"].values())
          print("OSM_ROAD_FRAME_CORRECTION_REVIEW_CONTRACT_OK", f"evidence_base={evidence_base}", f"live_main={sys.argv[1]}")
          PY

      - name: Verify immutable road source
        shell: bash
        run: |
          set -euo pipefail
          echo "899bc73ee0eea3623d7cc45455a542c1704039ef0239c13c33b3c74b4a241398  grand-bruxelles-game/data/osm/vertical_slice_01.game.json" | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned projection dependency
        run: python -m pip install --disable-pip-version-check "pyproj==3.7.2"

      - name: Run frame review regressions
        working-directory: grand-bruxelles-game
        run: python -m unittest tests/test_osm_road_frame_correction_review.py -v

      - name: Reproduce projected source-origin frame review
        working-directory: grand-bruxelles-game
        run: |
          python tools/qa/review_osm_road_frame_correction.py \
            --contract data/qa/osm_road_frame_correction_review.contract.json \
            --repo-root . \
            --live-main-sha "$(git rev-parse origin/main)" \
            --output "$RUNNER_TEMP/osm-road-frame-correction-review.json"

      - name: Assert correction remains un-authorized and engine-bound
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/osm-road-frame-correction-review.json" "$(git rev-parse origin/main)" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1]))
          assert r["status"] == "READY_FOR_FRAME_CORRECTION_REVIEW_SOURCE_ORIGIN"
          assert r["live_main_sha"] == sys.argv[2]
          assert r["duplicate_osm_way_count"] == 14
          assert r["candidate_worst_residual_m"] <= 1.0
          assert r["historical_worst_residual_m"] >= 900.0
          assert r["improvement_ratio"] >= 1000.0
          assert r["projection_engine"] == {"name": "pyproj", "version": "3.7.2"}
          assert all(value is False for value in r["authorization"].values())
          assert r["production_frame_update_authorized"] is False
          assert r["source_merge_authorized"] is False
          assert r["road_cell_mapping_authorized"] is False
          assert r["runtime_mount_authorized"] is False
          assert r["jouable_promotion_authorized"] is False
          print("OSM_ROAD_FRAME_CORRECTION_REVIEW_READY production_authorization=false engine=pyproj-3.7.2")
          PY

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: osm-road-frame-correction-review
          path: ${{ runner.temp }}/osm-road-frame-correction-review.json
          if-no-files-found: error
          retention-days: 30
