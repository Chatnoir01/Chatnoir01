name: Grand Bruxelles OSM Road Lifecycle State

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_road_surface_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_osm_road_lifecycle_state_test.py'
      - '.github/workflows/grand-bruxelles-osm-road-lifecycle-state.yml'

permissions:
  contents: read

jobs:
  lifecycle-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Validate road node-removal lifecycle state
        run: python3 grand-bruxelles-game/game/tests/brussels_osm_road_lifecycle_state_test.py
