name: Grand Bruxelles OSM Road Material Teardown

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_osm_road_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_road_surface_material_ownership_teardown_test.gd"
      - ".github/workflows/grand-bruxelles-osm-road-material-teardown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-material-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/road-material-teardown-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/road-material-teardown-import.log; then exit 1; fi
      - name: Prove road material ownership stops at teardown
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_road_surface_material_ownership_teardown_test.gd 2>&1 | tee /tmp/road-material-teardown.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_ROAD_MATERIAL_TEARDOWN_FAIL" /tmp/road-material-teardown.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_ROAD_MATERIAL_TEARDOWN_OK" /tmp/road-material-teardown.log
