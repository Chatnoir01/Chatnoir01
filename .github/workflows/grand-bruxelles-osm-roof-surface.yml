name: Grand Bruxelles OSM Roof Surface

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-roof-surface.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_roof_surface_material.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_roof_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_roof_surface_visual_test.gd"
      - "grand-bruxelles-game/tests/test_brussels_osm_roof_surface_material.py"
      - "grand-bruxelles-game/tests/check_brussels_osm_roof_surface_ab.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osm-roof-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require provenance-safe material-only roof contract
        run: python grand-bruxelles-game/tests/test_brussels_osm_roof_surface_material.py
      - name: Install visual dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-roof-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-roof-import.log; then exit 1; fi
      - name: Capture legitimate normal-player roof A/B
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_roof_surface_visual_test.gd 2>&1 | tee /tmp/osm-roof-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_ROOF_SURFACE_VISUAL_FAIL" /tmp/osm-roof-visual.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_ROOF_SURFACE_VISUAL_OK" /tmp/osm-roof-visual.log
      - name: Enforce fixed anti-micro A/B thresholds
        run: python grand-bruxelles-game/tests/check_brussels_osm_roof_surface_ab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brussels-osm-roof-surface-ab
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_osm_roof_surface_before.png
            grand-bruxelles-game/artifacts/visual/brussels_osm_roof_surface_after.png
            /tmp/osm-roof-import.log
            /tmp/osm-roof-visual.log
