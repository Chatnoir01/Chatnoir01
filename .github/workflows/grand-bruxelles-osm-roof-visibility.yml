name: Grand Bruxelles OSM Roof Visibility Audit

on:
  push:
    branches:
      - "qa/osm-roof-visibility-*"
    paths:
      - ".github/workflows/grand-bruxelles-osm-roof-visibility.yml"
      - "grand-bruxelles-game/game/tests/brussels_osm_roof_visibility_audit.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/main.tscn"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-roof-visibility.yml"
      - "grand-bruxelles-game/game/tests/brussels_osm_roof_visibility_audit.gd"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/roof-visibility-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/roof-visibility-import.log; then exit 1; fi
      - name: 1280x720 canonical Anneessens roof visibility audit
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_roof_visibility_audit.gd 2>&1 | tee /tmp/roof-visibility.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_ROOF_VISIBILITY_FAIL" /tmp/roof-visibility.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_ROOF_VISIBILITY_OK" /tmp/roof-visibility.log
      - name: Upload roof visibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-osm-roof-visibility-audit
          path: |
            grand-bruxelles-game/artifacts/visual/osm_roof_visibility_before.png
            grand-bruxelles-game/artifacts/visual/osm_roof_visibility_overlay.png
          if-no-files-found: warn
