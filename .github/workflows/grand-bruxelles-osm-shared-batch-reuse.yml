name: Grand Bruxelles OSM Shared Batch Reuse

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd'
      - 'grand-bruxelles-game/game/tests/test_osm_environment_shared_batch_reuse_contract.py'
      - '.github/workflows/grand-bruxelles-osm-shared-batch-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify shared environment MultiMesh reuse contract
        run: python3 grand-bruxelles-game/game/tests/test_osm_environment_shared_batch_reuse_contract.py
