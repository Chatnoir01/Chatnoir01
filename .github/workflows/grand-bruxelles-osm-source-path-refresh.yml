name: Grand Bruxelles OSM Source Path Refresh

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-source-path-refresh.yml"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_source_path_refresh_test.gd"
      - "grand-bruxelles-game/data/osm/zones/**/environment.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-path-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact-current-main ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$MAIN_SHA"
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip"
          rm -rf /tmp/godot /tmp/godot.zip
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o /tmp/godot.zip "$GODOT_URL"
          unzip -tq /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version | grep -q '^4\.7\.1\.stable'
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-source-path-refresh-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-source-path-refresh-import.log; then exit 1; fi
      - name: Prove OSM source path refresh is fail-closed and recoverable
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_source_path_refresh_test.gd 2>&1 | tee /tmp/osm-source-path-refresh.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_SOURCE_PATH_REFRESH_FAIL" /tmp/osm-source-path-refresh.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_SOURCE_PATH_REFRESH_OK" /tmp/osm-source-path-refresh.log
