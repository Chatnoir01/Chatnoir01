name: Grand Bruxelles OSM Static Resource Reuse

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-static-resource-reuse.yml"
      - "grand-bruxelles-game/data/osm/zones/jette/environment.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_static_resource_reuse_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-resource-reuse-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/osm-static-resource-reuse-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/osm-static-resource-reuse-import.log; then exit 1; fi
      - name: Prove static presentation resource reuse
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_static_resource_reuse_test.gd 2>&1 | tee /tmp/osm-static-resource-reuse.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OSM_STATIC_RESOURCE_REUSE_FAIL" /tmp/osm-static-resource-reuse.log; then exit 1; fi
          grep -q "BRUSSELS_OSM_STATIC_RESOURCE_REUSE_OK" /tmp/osm-static-resource-reuse.log
