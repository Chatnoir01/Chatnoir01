name: Grand Bruxelles OSM Transform JSON Strict

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-osm-transform-json-strict.yml"
      - "grand-bruxelles-game/tools/transform_osm_to_game.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_json_strict.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_building_semantics.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_explicit_dimensions.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_explicit_lanes.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_explicit_way_semantics.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_environment_lifecycle.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_drivable_access.py"
      - "grand-bruxelles-game/tests/test_transform_osm_numeric_tag_grammar.py"
      - "grand-bruxelles-game/tests/test_transform_osm_to_game_origin_grammar.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-osm-transform-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main base and exact head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
            test "$HEAD_SHA" = "$PR_HEAD_SHA"
          else
            PR_BASE_SHA="$(git merge-base HEAD origin/main)"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$PR_BASE_SHA"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
      - name: Prove transform source JSON parser fails closed
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          python3 tests/test_transform_osm_to_game_json_strict.py
          python3 tests/test_transform_osm_to_game_building_semantics.py
          python3 tests/test_transform_osm_to_game_explicit_dimensions.py
          python3 tests/test_transform_osm_to_game_explicit_lanes.py
          python3 tests/test_transform_osm_to_game_explicit_way_semantics.py
          python3 tests/test_transform_osm_to_game_environment_lifecycle.py
          python3 tests/test_transform_osm_to_game_drivable_access.py
          python3 tests/test_transform_osm_numeric_tag_grammar.py
          python3 tests/test_transform_osm_to_game_origin_grammar.py
