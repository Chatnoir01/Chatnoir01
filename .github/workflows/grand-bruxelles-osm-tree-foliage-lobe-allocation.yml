name: Grand Bruxelles OSM Tree Foliage Lobe Allocation

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd'
      - 'grand-bruxelles-game/game/tests/test_osm_environment_tree_foliage_lobe_allocation_contract.py'
      - '.github/workflows/grand-bruxelles-osm-tree-foliage-lobe-allocation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tree foliage lobe allocation contract
        run: python3 grand-bruxelles-game/game/tests/test_osm_environment_tree_foliage_lobe_allocation_contract.py
