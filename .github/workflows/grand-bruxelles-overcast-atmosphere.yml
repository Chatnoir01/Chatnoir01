name: Grand Bruxelles Overcast Atmosphere

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-overcast-atmosphere.yml"
      - "grand-bruxelles-game/game/scripts/brussels_overcast_atmosphere.gd"
      - "grand-bruxelles-game/game/tests/brussels_overcast_atmosphere_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_overcast_atmosphere_witness_test.gd"
      - "grand-bruxelles-game/docs/provenance/brussels_overcast_atmosphere.json"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overcast-atmosphere:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate source/runtime contract
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/brussels_overcast_atmosphere_test.gd 2>&1 | tee /tmp/brussels-overcast.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OVERCAST_ATMOSPHERE_FAIL" /tmp/brussels-overcast.log; then exit 1; fi
          grep -F "BRUSSELS_OVERCAST_ATMOSPHERE_OK" /tmp/brussels-overcast.log
      - name: Capture frozen-state Bourse and Midi A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/brussels_overcast_atmosphere_witness_test.gd 2>&1 | tee /tmp/brussels-overcast-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_OVERCAST_WITNESS_FAIL" /tmp/brussels-overcast-witness.log; then exit 1; fi
          grep -F "BRUSSELS_OVERCAST_WITNESS_OK" /tmp/brussels-overcast-witness.log
          grep -F "frozen_dynamic_state=true same_world_instance=true" /tmp/brussels-overcast-witness.log
      - name: Assert deterministic evidence package
        shell: bash
        run: |
          set -euo pipefail
          for location in midi bourse; do
            for phase in before after; do
              f="grand-bruxelles-game/artifacts/visual/brussels_overcast_${location}_${phase}.png"
              test -s "$f"
              file "$f" | grep -F "1280 x 720"
            done
          done
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-overcast-atmosphere-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_overcast_midi_before.png
            grand-bruxelles-game/artifacts/visual/brussels_overcast_midi_after.png
            grand-bruxelles-game/artifacts/visual/brussels_overcast_bourse_before.png
            grand-bruxelles-game/artifacts/visual/brussels_overcast_bourse_after.png
            /tmp/brussels-overcast.log
            /tmp/brussels-overcast-witness.log
          if-no-files-found: error
