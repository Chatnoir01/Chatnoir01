name: Grand Bruxelles Playable Link

on:
  pull_request:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/web-preview/**"
      - ".github/workflows/grand-bruxelles-pages.yml"
      - ".github/workflows/grand-bruxelles-web.yml"
      - "grand-bruxelles-game/PLAY.md"
      - "grand-bruxelles-game/README.md"
      - "grand-bruxelles-game/tools/test_playable_link_contract.py"
      - "grand-bruxelles-game/tools/test_web_publication_discipline.py"
      - "grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.external_cell_delivery.lock.json"
      - "grand-bruxelles-game/tools/qa/lock_region_lod2_c01_external_cell_delivery.py"
  workflow_run:
    workflows: ["Grand Bruxelles Playable Web Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: "grand-bruxelles-playable-link"
  cancel-in-progress: true

jobs:
  verify_local:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Web source commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout proposed source
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v6

      - name: Replace committed snapshot with triggering Web artifact
        if: github.event_name == 'workflow_run'
        run: rm -rf grand-bruxelles-game/web-preview

      - name: Download triggering playable Web artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: grand-bruxelles-playable-web
          path: grand-bruxelles-game/web-preview
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify playable Godot export and Pages contract
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/test_playable_link_contract.py
          python3 grand-bruxelles-game/tools/test_web_publication_discipline.py
          python3 grand-bruxelles-game/tools/qa/lock_region_lod2_c01_external_cell_delivery.py \
            --contract grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.external_cell_delivery.lock.json \
            --validate-only
          test -f grand-bruxelles-game/web-preview/index.html
          test -f grand-bruxelles-game/web-preview/index.js
          test -f grand-bruxelles-game/web-preview/index.wasm
          test -f grand-bruxelles-game/web-preview/index.pck
          grep -q 'index.pck' grand-bruxelles-game/web-preview/index.html
          python3 - <<'PY'
          from pathlib import Path
          root = Path('grand-bruxelles-game/web-preview')
          total = sum(p.stat().st_size for p in root.iterdir() if p.is_file())
          pck = (root / 'index.pck').stat().st_size
          wasm = (root / 'index.wasm').stat().st_size
          print(f'PLAYABLE_ACCESS_WEIGHT total_bytes={total} total_mib={total / 1024 / 1024:.2f} pck={pck} wasm={wasm}')
          if total > 150 * 1024 * 1024:
              raise SystemExit(f'PLAYABLE_ACCESS_FAIL build exceeds 150 MiB: {total}')
          if total > 90 * 1024 * 1024:
              print('::warning::Playable Web build exceeds 90 MiB; mobile first-load optimization remains required.')
          PY

  pages_state:
    if: github.event_name != 'pull_request'
    needs: verify_local
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Detect one-time GitHub Pages enablement
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          code="$(curl --silent --show-error --location \
            --output "$response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "PAGES_SITE_READY"
          elif [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PAGES_ENABLEMENT_REQUIRED: repository Settings → Pages → Build and deployment → Source = GitHub Actions. This is a one-time administrator action; the game build itself is present."
            echo "PAGES_ENABLEMENT_REQUIRED"
          else
            cat "$response"
            echo "::error::Unexpected GitHub Pages API status: $code"
            exit 1
          fi

  deploy_pages:
    if: github.event_name != 'pull_request' && needs.pages_state.outputs.enabled == 'true'
    needs: [verify_local, pages_state]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact Web source commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout latest main for manual deployment
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Replace committed snapshot with triggering Web artifact
        if: github.event_name == 'workflow_run'
        run: rm -rf grand-bruxelles-game/web-preview

      - name: Download triggering playable Web artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: grand-bruxelles-playable-web
          path: grand-bruxelles-game/web-preview
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Stage locked C01 external LoD2 cells outside Web PCK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock="grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.external_cell_delivery.lock.json"
          tool="grand-bruxelles-game/tools/qa/lock_region_lod2_c01_external_cell_delivery.py"
          python3 "$tool" --contract "$lock" --validate-only

          read -r artifact_id artifact_name artifact_digest workflow_run_id source_head_sha archive_sha index_sha expected_cells expected_world_bytes < <(
            python3 - "$lock" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          upstream = lock["upstream_final_world_geometry"]
          expected = lock["expected"]
          print(
              upstream["artifact_id"],
              upstream["artifact_name"],
              upstream["artifact_digest"],
              upstream["workflow_run_id"],
              upstream["source_head_sha"],
              upstream["artifact_archive_sha256"],
              upstream["world_geometry_index_sha256"],
              expected["spatial_cells"],
              expected["world_payload_bytes"],
          )
          PY
          )

          meta="$RUNNER_TEMP/c01-artifact.json"
          archive="$RUNNER_TEMP/c01-final-world.zip"
          source_root="$RUNNER_TEMP/c01-final-world"
          delivery_root="$RUNNER_TEMP/c01-external-delivery"
          target="grand-bruxelles-game/web-preview/region-lod2/C01"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$meta"
          python3 - "$meta" "$artifact_id" "$artifact_name" "$artifact_digest" "$workflow_run_id" "$source_head_sha" <<'PY'
          import json, sys
          meta = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact_id = int(sys.argv[2])
          artifact_name = sys.argv[3]
          artifact_digest = sys.argv[4]
          workflow_run_id = int(sys.argv[5])
          source_head_sha = sys.argv[6]
          assert meta["id"] == artifact_id
          assert meta["name"] == artifact_name
          assert meta["digest"] == artifact_digest
          assert meta["expired"] is False
          assert meta["workflow_run"]["id"] == workflow_run_id
          assert meta["workflow_run"]["head_sha"] == source_head_sha
          print("C01_PAGES_UPSTREAM_ARTIFACT_IDENTITY_OK")
          PY

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"
          echo "$archive_sha  $archive" | sha256sum -c -
          rm -rf "$source_root" "$delivery_root" "$target"
          mkdir -p "$source_root" "$target"
          unzip -q "$archive" -d "$source_root"
          echo "$index_sha  $source_root/world_geometry_index.json" | sha256sum -c -

          python3 "$tool" \
            --contract "$lock" \
            --artifact-dir "$RUNNER_TEMP/c01-final-world" \
            --output-dir "$delivery_root"

          cp "$source_root/world_geometry_index.json" "$target/world_geometry_index.json"
          cp "$delivery_root/external_cell_delivery_manifest.json" "$target/external_cell_delivery_manifest.json"
          cp "$delivery_root/external_cell_delivery_cells.csv" "$target/external_cell_delivery_cells.csv"
          cp "$delivery_root/result.sha256.json" "$target/result.sha256.json"
          cp -a "$RUNNER_TEMP/c01-final-world/cells" "$target/cells"

          test "$(find "$target/cells" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq "$expected_cells"
          python3 - "$target" "$expected_world_bytes" <<'PY'
          import sys
          from pathlib import Path
          target = Path(sys.argv[1])
          expected = int(sys.argv[2])
          payloads = list(target.glob("cells/*/world.ndjson"))
          total = sum(path.stat().st_size for path in payloads)
          if len(payloads) != 132:
              raise SystemExit(f"C01 Pages cell count drift: {len(payloads)}")
          if total != expected:
              raise SystemExit(f"C01 Pages payload byte drift: {total} != {expected}")
          pck = target.parents[1] / "index.pck"
          if not pck.is_file():
              raise SystemExit("playable index.pck missing after C01 external staging")
          print(f"C01_PAGES_EXTERNAL_DELIVERY_STAGED cells={len(payloads)} world_payload_bytes={total} web_pck_embedded=false")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload playable build
        uses: actions/upload-pages-artifact@v4
        with:
          path: grand-bruxelles-game/web-preview

      - name: Deploy playable build
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public:
    if: github.event_name != 'pull_request' && needs.pages_state.outputs.enabled == 'true'
    needs: [pages_state, deploy_pages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify stable Pages URL and Godot assets
        env:
          PLAYABLE_PUBLIC_BASE: ${{ needs.deploy_pages.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PLAYABLE_PUBLIC_BASE%/}"
          public_index="$(mktemp)"
          c01_manifest="$(mktemp)"
          c01_index="$(mktemp)"
          trap 'rm -f "$public_index" "$c01_manifest" "$c01_index"' EXIT
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 \
            "$base/" --output "$public_index"
          grep -q '<title>Grand Bruxelles Game</title>' "$public_index"
          grep -q 'index.pck' "$public_index"
          for asset in index.js index.wasm index.pck; do
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 180 \
              --range 0-0 \
              "$base/$asset" --output /dev/null
          done
          echo "PLAYABLE_PAGES_OK url=$base/"

          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 \
            "$base/region-lod2/C01/external_cell_delivery_manifest.json" --output "$c01_manifest"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 \
            "$base/region-lod2/C01/world_geometry_index.json" --output "$c01_index"
          echo "5bbbc104019046aa3418439ddf41f93d81ab1468beebc19edbb0e1f73ac1f181  $c01_manifest" | sha256sum -c -
          echo "af8c37bd501ed076a45d1c12eafc3b2208e071e3961c3fd07eabede36befc35c  $c01_index" | sha256sum -c -

          mapfile -t sample_paths < <(python3 - "$c01_manifest" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["campaign_id"] == "region-lod2-C01-30000"
          assert manifest["accounting"]["owners"] == 30000
          assert manifest["accounting"]["spatial_cells"] == 132
          assert len(manifest["cells"]) == 132
          assert manifest["delivery"]["web_pck_embedded"] is False
          assert manifest["delivery"]["public_base_url_locked"] is False
          for key in ("runtime_authorized", "runtime_mount_authorized", "collision_authorized", "terrain_runtime_authorized", "jouable_promotion_authorized"):
              assert manifest["hard_rules"][key] is False, key
          print(manifest["cells"][0]["relative_path"])
          print(manifest["cells"][-1]["relative_path"])
          PY
          )
          for rel in "${sample_paths[@]}"; do
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 120 \
              --range 0-0 \
              "$base/region-lod2/C01/$rel" --output /dev/null
          done
          echo "C01_PUBLIC_EXTERNAL_DELIVERY_OK base=$base/region-lod2/C01/ cells=132 runtime_mount_authorized=false"

  access_status:
    if: always() && github.event_name != 'pull_request'
    needs: [verify_local, pages_state, deploy_pages, verify_public]
    runs-on: ubuntu-latest
    steps:
      - name: Publish access state
        run: |
          set -euo pipefail
          if [ "${{ needs.verify_local.result }}" != "success" ]; then
            echo "::error::PLAYABLE_ACCESS_BUILD_INVALID"
            exit 1
          fi
          if [ "${{ needs.pages_state.outputs.enabled }}" != "true" ]; then
            echo "PAGES_ENABLEMENT_REQUIRED: Settings → Pages → Build and deployment → Source = GitHub Actions"
            exit 0
          fi
          if [ "${{ needs.deploy_pages.result }}" != "success" ] || [ "${{ needs.verify_public.result }}" != "success" ]; then
            echo "::error::PLAYABLE_PAGES_DEPLOYMENT_FAILED"
            exit 1
          fi
          echo "PLAYABLE_ACCESS_READY"
