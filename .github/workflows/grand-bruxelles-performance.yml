name: Grand Bruxelles Performance Baseline

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/data/**"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/perf-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/perf-import.log; then
            exit 1
          fi

      - name: Record baseline
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/performance_baseline_test.gd 2>&1 | tee /tmp/performance-baseline.log
          if grep -E "SCRIPT ERROR|Parse Error:|PERFORMANCE_BASELINE_FAIL" /tmp/performance-baseline.log; then
            exit 1
          fi
          grep -q "PERFORMANCE_BASELINE_JSON:" /tmp/performance-baseline.log
          grep -q "PERFORMANCE_BASELINE_OK" /tmp/performance-baseline.log
          grep "PERFORMANCE_BASELINE_JSON:" /tmp/performance-baseline.log | sed 's/^.*PERFORMANCE_BASELINE_JSON: //' > performance-baseline.json

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-performance-baseline
          path: performance-baseline.json
