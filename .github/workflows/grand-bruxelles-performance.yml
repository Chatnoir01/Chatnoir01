name: Grand Bruxelles Performance Baseline

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/data/**"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/perf-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/perf-import.log; then
            exit 1
          fi

      - name: Record baseline
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/performance_baseline_test.gd 2>&1 | tee /tmp/performance-baseline.log
          if grep -E "SCRIPT ERROR|Parse Error:|PERFORMANCE_BASELINE_FAIL" /tmp/performance-baseline.log; then
            exit 1
          fi
          grep -q "PERFORMANCE_BASELINE_JSON:" /tmp/performance-baseline.log
          grep -q "PERFORMANCE_BASELINE_OK" /tmp/performance-baseline.log
          grep "PERFORMANCE_BASELINE_JSON:" /tmp/performance-baseline.log | sed 's/^.*PERFORMANCE_BASELINE_JSON: //' > performance-baseline.json

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-performance-baseline
          path: |
            /tmp/perf-import.log
            /tmp/performance-baseline.log
            performance-baseline.json
          if-no-files-found: error

  rendered-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 16

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import candidate project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/rendered-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/rendered-import.log; then
            exit 1
          fi

      - name: Capture candidate rendered baseline
        id: candidate
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -uo pipefail
          mkdir -p grand-bruxelles-game/artifacts
          set +e
          timeout 120s xvfb-run -a \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --fixed-fps 60 \
            --script res://game/tests/rendered_main_baseline_test.gd 2>&1 | tee /tmp/rendered-main-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/rendered-main-baseline.log; then
            exit 1
          fi
          grep -q "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/rendered-main-baseline.log
          grep "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/rendered-main-baseline.log \
            | tail -n 1 \
            | sed 's/^.*RENDERED_MAIN_VISUAL_FINGERPRINT_JSON: //' \
            > grand-bruxelles-game/artifacts/rendered-main-fingerprint.json
          test -s grand-bruxelles-game/artifacts/rendered-main-fingerprint.json
          if [[ "$status" -eq 0 ]]; then
            grep -q "RENDERED_MAIN_BASELINE_JSON:" /tmp/rendered-main-baseline.log
            grep -q "RENDERED_MAIN_BASELINE_OK" /tmp/rendered-main-baseline.log
            grep "RENDERED_MAIN_BASELINE_JSON:" /tmp/rendered-main-baseline.log \
              | sed 's/^.*RENDERED_MAIN_BASELINE_JSON: //' \
              > grand-bruxelles-game/artifacts/rendered-main-baseline.json
            test -s grand-bruxelles-game/artifacts/rendered-main-baseline.png
          else
            grep -q "RENDERED_MAIN_BASELINE_FAIL:" /tmp/rendered-main-baseline.log
          fi

      - name: Localize frozen visual drift
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="grand-bruxelles-game/artifacts/rendered-main-fingerprint.json"
          FROZEN="grand-bruxelles-game/data/qa/rendered_main_baseline.json"
          OUTPUT="grand-bruxelles-game/artifacts/rendered-main-drift-localization.json"
          test -s "$CURRENT"
          test -s "$FROZEN"
          python3 - "$CURRENT" "$FROZEN" "$OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          current_path, frozen_path, output_path = map(pathlib.Path, sys.argv[1:])
          current = json.loads(current_path.read_text())["fingerprint"]
          frozen = json.loads(frozen_path.read_text())["fingerprint"]
          if current.get("schema") != frozen.get("schema"):
              raise SystemExit("fingerprint schema mismatch")
          for key in ("width", "height", "tile_cols", "tile_rows"):
              if int(current[key]) != int(frozen[key]):
                  raise SystemExit(f"fingerprint geometry mismatch: {key}")
          current_tiles = current["tiles_rgbl"]
          frozen_tiles = frozen["tiles_rgbl"]
          if len(current_tiles) != len(frozen_tiles) or not current_tiles:
              raise SystemExit("tile vector mismatch")
          deltas = [abs(float(a[3]) - float(b[3])) for a, b in zip(current_tiles, frozen_tiles)]
          index = max(range(len(deltas)), key=deltas.__getitem__)
          cols = int(current["tile_cols"])
          width = int(current["width"])
          height = int(current["height"])
          col = index % cols
          row = index // cols
          tile_width = width // cols
          tile_height = height // int(current["tile_rows"])
          result = {
              "schema": "grand-bruxelles-rendered-main-drift-localization-v1",
              "max_tile_index": index,
              "max_tile_row": row,
              "max_tile_col": col,
              "pixel_bbox": [col * tile_width, row * tile_height, min(width, (col + 1) * tile_width), min(height, (row + 1) * tile_height)],
              "current_tile_luma": float(current_tiles[index][3]),
              "frozen_tile_luma": float(frozen_tiles[index][3]),
              "max_tile_luma_delta": deltas[index],
              "threshold_changed": False,
              "baseline_changed": False,
          }
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print("RENDERED_MAIN_DRIFT_LOCALIZATION_JSON: " + json.dumps(result, sort_keys=True))
          PY

      - name: Capture exact PR base fingerprint on inherited RED
        if: steps.candidate.outputs.status != '0' && github.event_name == 'pull_request'
        id: base
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          rm -rf /tmp/grand-bruxelles-base
          git worktree add --detach /tmp/grand-bruxelles-base "$BASE_SHA"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path /tmp/grand-bruxelles-base/grand-bruxelles-game --editor --quit \
            2>&1 | tee /tmp/rendered-base-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/rendered-base-import.log; then
            exit 1
          fi
          set +e
          timeout 120s xvfb-run -a \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path /tmp/grand-bruxelles-base/grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --fixed-fps 60 \
            --script res://game/tests/rendered_main_baseline_test.gd \
            2>&1 | tee /tmp/rendered-base-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/rendered-base-baseline.log; then
            exit 1
          fi
          grep -q "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/rendered-base-baseline.log
          grep "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/rendered-base-baseline.log \
            | tail -n 1 \
            | sed 's/^.*RENDERED_MAIN_VISUAL_FINGERPRINT_JSON: //' \
            > grand-bruxelles-game/artifacts/rendered-main-base-fingerprint.json
          test -s grand-bruxelles-game/artifacts/rendered-main-base-fingerprint.json

      - name: Attribute inherited visual drift to PR base
        if: steps.candidate.outputs.status != '0' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CANDIDATE="grand-bruxelles-game/artifacts/rendered-main-fingerprint.json"
          BASE="grand-bruxelles-game/artifacts/rendered-main-base-fingerprint.json"
          OUTPUT="grand-bruxelles-game/artifacts/rendered-main-base-attribution.json"
          test -s "$CANDIDATE"
          test -s "$BASE"
          python3 - "$CANDIDATE" "$BASE" "$OUTPUT" "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import json
          import pathlib
          import sys

          candidate_path, base_path, output_path = map(pathlib.Path, sys.argv[1:4])
          base_sha, head_sha = sys.argv[4:6]
          candidate = json.loads(candidate_path.read_text())["fingerprint"]
          base = json.loads(base_path.read_text())["fingerprint"]
          for key in ("schema", "width", "height", "tile_cols", "tile_rows"):
              if candidate.get(key) != base.get(key):
                  raise SystemExit(f"PR/base fingerprint contract mismatch: {key}")
          ct = candidate["tiles_rgbl"]
          bt = base["tiles_rgbl"]
          if len(ct) != len(bt) or not ct:
              raise SystemExit("PR/base tile vector mismatch")
          max_channel_delta = max(abs(float(a) - float(b)) for ca, cb in zip(ct, bt) for a, b in zip(ca, cb))
          ch = candidate.get("luma_histogram", [])
          bh = base.get("luma_histogram", [])
          if len(ch) != len(bh) or not ch:
              raise SystemExit("PR/base histogram mismatch")
          max_histogram_delta = max(abs(float(a) - float(b)) for a, b in zip(ch, bh))
          tolerance = 0.002
          inherited = max_channel_delta <= tolerance and max_histogram_delta <= tolerance
          result = {
              "schema": "grand-bruxelles-rendered-main-base-attribution-v1",
              "base_sha": base_sha,
              "head_sha": head_sha,
              "max_tile_channel_delta": max_channel_delta,
              "max_histogram_delta": max_histogram_delta,
              "tolerance": tolerance,
              "inherited_frozen_baseline_drift": inherited,
              "frozen_baseline_changed": False,
              "frozen_threshold_changed": False,
          }
          output_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print("RENDERED_MAIN_BASE_ATTRIBUTION_JSON: " + json.dumps(result, sort_keys=True))
          if not inherited:
              raise SystemExit(
                  f"candidate introduces rendered drift beyond exact PR base: "
                  f"tile={max_channel_delta:.6f} histogram={max_histogram_delta:.6f} tolerance={tolerance:.6f}"
              )
          PY

      - name: Enforce rendered baseline outcome
        shell: bash
        run: |
          set -euo pipefail
          status="${{ steps.candidate.outputs.status }}"
          if [[ "$status" == "0" ]]; then
            echo "RENDERED_MAIN_BASELINE_GATE_OK: frozen_baseline=true inherited_attribution=false"
            exit 0
          fi
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "candidate failed frozen baseline outside pull request attribution path" >&2
            exit 1
          fi
          test -s grand-bruxelles-game/artifacts/rendered-main-base-attribution.json
          python3 - grand-bruxelles-game/artifacts/rendered-main-base-attribution.json <<'PY'
          import json, pathlib, sys
          doc = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not doc.get("inherited_frozen_baseline_drift", False):
              raise SystemExit("frozen baseline RED is not inherited from exact PR base")
          print("RENDERED_MAIN_BASELINE_GATE_OK: frozen_baseline=false inherited_attribution=true")
          PY

      - name: Stage rendered baseline evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="grand-bruxelles-game/artifacts/performance-rendered-evidence"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          test -s /tmp/rendered-import.log
          test -s /tmp/rendered-main-baseline.log
          test -s grand-bruxelles-game/artifacts/rendered-main-fingerprint.json
          test -s grand-bruxelles-game/artifacts/rendered-main-drift-localization.json
          cp /tmp/rendered-import.log "$EVIDENCE/rendered-import.log"
          cp /tmp/rendered-main-baseline.log "$EVIDENCE/rendered-main-baseline.log"
          cp grand-bruxelles-game/artifacts/rendered-main-fingerprint.json "$EVIDENCE/rendered-main-fingerprint.json"
          cp grand-bruxelles-game/artifacts/rendered-main-drift-localization.json "$EVIDENCE/rendered-main-drift-localization.json"
          for optional in rendered-main-baseline.json rendered-main-baseline.png rendered-main-base-fingerprint.json rendered-main-base-attribution.json; do
            if [[ -s "grand-bruxelles-game/artifacts/$optional" ]]; then
              cp "grand-bruxelles-game/artifacts/$optional" "$EVIDENCE/$optional"
            fi
          done
          if [[ -s /tmp/rendered-base-import.log ]]; then cp /tmp/rendered-base-import.log "$EVIDENCE/rendered-base-import.log"; fi
          if [[ -s /tmp/rendered-base-baseline.log ]]; then cp /tmp/rendered-base-baseline.log "$EVIDENCE/rendered-base-baseline.log"; fi
          test "$(find "$EVIDENCE" -maxdepth 1 -type f | wc -l)" -ge 4
          echo "RENDERED_MAIN_EVIDENCE_STAGED: $(find "$EVIDENCE" -maxdepth 1 -type f -printf '%f ' | sort)"

      - name: Upload rendered baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-rendered-main-baseline
          path: grand-bruxelles-game/artifacts/performance-rendered-evidence/
          if-no-files-found: error
