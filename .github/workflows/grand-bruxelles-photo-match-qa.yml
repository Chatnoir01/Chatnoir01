name: Grand Bruxelles Photo Match QA

on:
  push:
    branches:
      - "integration/photo-match-qa"
      - "integration/bourse-photo-match-capture"
    paths:
      - "grand-bruxelles-game/data/qa/photo_match/**"
      - "grand-bruxelles-game/tools/validate_photo_match.py"
      - "grand-bruxelles-game/tests/test_validate_photo_match.py"
      - "grand-bruxelles-game/docs/PHOTO_MATCH_QA.md"
      - "grand-bruxelles-game/game/tests/photo_match_capture_test.gd"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/vertical_slice_control_points.json"
      - "grand-bruxelles-game/tools/make_runtime_slice.py"
      - ".github/workflows/grand-bruxelles-photo-match-qa.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/photo_match/**"
      - "grand-bruxelles-game/tools/validate_photo_match.py"
      - "grand-bruxelles-game/tests/test_validate_photo_match.py"
      - "grand-bruxelles-game/docs/PHOTO_MATCH_QA.md"
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/vertical_slice_control_points.json"
      - "grand-bruxelles-game/tools/make_runtime_slice.py"
      - ".github/workflows/grand-bruxelles-photo-match-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-photo-match:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate photo-match registry and completion claims
        run: python3 grand-bruxelles-game/tools/validate_photo_match.py
      - name: Prove provisional completion is rejected
        run: python3 -m unittest grand-bruxelles-game/tests/test_validate_photo_match.py
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Render reproducible Bourse capture
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x960 \
            --script res://game/tests/photo_match_capture_test.gd 2>&1 | tee /tmp/photo-match-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|PHOTO_MATCH_CAPTURE_FAIL" /tmp/photo-match-capture.log; then exit 1; fi
          grep -q "PHOTO_MATCH_CAPTURE_OK: bourse_2024_cc0_01 .* (1280x960)" /tmp/photo-match-capture.log
          test -f grand-bruxelles-game/artifacts/photo-match/bourse_2024_cc0_01.png
      - name: Upload Bourse capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: bourse-photo-match-capture
          path: grand-bruxelles-game/artifacts/photo-match/bourse_2024_cc0_01.png
          if-no-files-found: error
