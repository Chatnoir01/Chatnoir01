name: Grand Bruxelles Photorealism Foundation

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/scripts/photorealism_runtime.gd"
      - "grand-bruxelles-game/game/tests/photorealism_foundation_test.gd"
      - "grand-bruxelles-game/game/tests/photorealism_pbr_witness_test.gd"
      - ".github/workflows/grand-bruxelles-photorealism-foundation.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/scripts/photorealism_runtime.gd"
      - "grand-bruxelles-game/game/tests/photorealism_foundation_test.gd"
      - "grand-bruxelles-game/game/tests/photorealism_pbr_witness_test.gd"
      - ".github/workflows/grand-bruxelles-photorealism-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photorealism-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then
            exit 1
          fi

      - name: Verify compatibility-safe PBR foundation
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/photorealism_foundation_test.gd 2>&1 | tee /tmp/photorealism.log
          if grep -E "SCRIPT ERROR|Parse Error:|PHOTOREALISM_FOUNDATION_FAIL" /tmp/photorealism.log; then
            exit 1
          fi
          grep -q "PHOTOREALISM_FOUNDATION_OK" /tmp/photorealism.log

      - name: Capture isolated pedestrian-frame PBR A/B
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/photorealism_pbr_witness_test.gd 2>&1 | tee /tmp/photoreal-pbr-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|PHOTOREAL_PBR_WITNESS_FAIL" /tmp/photoreal-pbr-witness.log; then
            exit 1
          fi
          grep -q "PHOTOREAL_PBR_WITNESS_OK" /tmp/photoreal-pbr-witness.log
          test -s grand-bruxelles-game/artifacts/visual/photoreal_pbr_before.png
          test -s grand-bruxelles-game/artifacts/visual/photoreal_pbr_after.png

      - name: Smoke real main scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --quit-after 6 2>&1 | tee /tmp/main.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/main.log; then
            exit 1
          fi

      - name: Upload isolated PBR evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-photoreal-pbr-ab
          path: |
            grand-bruxelles-game/artifacts/visual/photoreal_pbr_before.png
            grand-bruxelles-game/artifacts/visual/photoreal_pbr_after.png
            /tmp/photorealism.log
            /tmp/photoreal-pbr-witness.log
          if-no-files-found: error
