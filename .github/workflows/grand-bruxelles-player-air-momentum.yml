name: Grand Bruxelles Player Air Momentum

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-player-air-momentum.yml"
      - "grand-bruxelles-game/game/scripts/player_locomotion_profile.gd"
      - "grand-bruxelles-game/game/tests/player_air_momentum_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-air-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import production project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Run player air-momentum regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/player_air_momentum_test.gd \
            2>&1 | tee /tmp/player-air-momentum.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_AIR_MOMENTUM_FAIL" /tmp/player-air-momentum.log; then exit 1; fi
          grep -F "PLAYER_AIR_MOMENTUM_OK" /tmp/player-air-momentum.log
