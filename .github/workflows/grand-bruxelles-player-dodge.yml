name: Grand Bruxelles Player Dodge

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-player-dodge.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/player_dodge_runtime.gd"
      - "grand-bruxelles-game/game/tests/player_dodge_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-dodge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/player-dodge-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/player-dodge-import.log; then exit 1; fi
      - name: Validate player dodge verb
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_dodge_test.gd 2>&1 | tee /tmp/player-dodge.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_DODGE_FAIL" /tmp/player-dodge.log; then exit 1; fi
          grep -F "PLAYER_DODGE_OK" /tmp/player-dodge.log
