name: Grand Bruxelles Player GTA Scale Camera

on:
  push:
    branches: ["agent/player-gta-scale-camera"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-player-gta-scale-camera.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/gta_scale_camera_runtime.gd"
      - "grand-bruxelles-game/game/tests/player_gta_scale_camera_runtime_test.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-gta-scale-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/player-gta-scale-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/player-gta-scale-import.log; then exit 1; fi
      - name: Run player GTA scale camera runtime probe
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_gta_scale_camera_runtime_test.gd 2>&1 | tee /tmp/player-gta-scale-camera.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_GTA_SCALE_CAMERA_FAIL" /tmp/player-gta-scale-camera.log; then exit 1; fi
          grep -F "PLAYER_GTA_SCALE_CAMERA_OK" /tmp/player-gta-scale-camera.log
