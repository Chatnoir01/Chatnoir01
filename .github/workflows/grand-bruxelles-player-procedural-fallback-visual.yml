name: Grand Bruxelles Player Procedural Fallback Visual

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_shape_test.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_capture_test.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_ab_compare_test.gd"
      - ".github/workflows/grand-bruxelles-player-procedural-fallback-visual.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/humanoid_visual.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_shape_test.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_capture_test.gd"
      - "grand-bruxelles-game/game/tests/player_procedural_fallback_ab_compare_test.gd"
      - ".github/workflows/grand-bruxelles-player-procedural-fallback-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-player-procedural-fallback-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-player-fallback-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/player-fallback-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/player-fallback-import.log; then exit 1; fi
      - name: Production player fallback structure
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/player_procedural_fallback_shape_test.gd 2>&1 | tee /tmp/player-fallback-shape.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_PROCEDURAL_FALLBACK_SHAPE_FAIL" /tmp/player-fallback-shape.log; then exit 1; fi
          grep -q "PLAYER_PROCEDURAL_FALLBACK_SHAPE_OK" /tmp/player-fallback-shape.log

  prove-visible-player-fallback-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install identical capture harness in base checkout
        run: |
          cp head/grand-bruxelles-game/game/tests/player_procedural_fallback_capture_test.gd base/grand-bruxelles-game/game/tests/player_procedural_fallback_capture_test.gd
      - name: Import base and head projects
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path base/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/player-base-import.log
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/player-head-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/player-base-import.log /tmp/player-head-import.log; then exit 1; fi
      - name: Capture frozen normal gameplay camera BEFORE and AFTER
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path base/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/player_procedural_fallback_capture_test.gd -- /tmp/player-before.png 2>&1 | tee /tmp/player-before.log
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path head/grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/player_procedural_fallback_capture_test.gd -- /tmp/player-after.png 2>&1 | tee /tmp/player-after.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_PROCEDURAL_FALLBACK_CAPTURE_FAIL" /tmp/player-before.log /tmp/player-after.log; then exit 1; fi
          grep -q "PLAYER_PROCEDURAL_FALLBACK_CAPTURE_OK" /tmp/player-before.log
          grep -q "PLAYER_PROCEDURAL_FALLBACK_CAPTURE_OK" /tmp/player-after.log
          test -f /tmp/player-before.png
          test -f /tmp/player-after.png
      - name: Enforce visible player delta
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path head/grand-bruxelles-game --script res://game/tests/player_procedural_fallback_ab_compare_test.gd -- /tmp/player-before.png /tmp/player-after.png 2>&1 | tee /tmp/player-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|PLAYER_PROCEDURAL_FALLBACK_AB_FAIL" /tmp/player-ab.log; then exit 1; fi
          grep -q "PLAYER_PROCEDURAL_FALLBACK_AB_OK" /tmp/player-ab.log
      - name: Stage A/B evidence
        if: always()
        run: |
          mkdir -p head/grand-bruxelles-game/artifacts/qa/player_procedural_fallback_ab
          cp /tmp/player-before.png head/grand-bruxelles-game/artifacts/qa/player_procedural_fallback_ab/before.png 2>/dev/null || true
          cp /tmp/player-after.png head/grand-bruxelles-game/artifacts/qa/player_procedural_fallback_ab/after.png 2>/dev/null || true
          cp /tmp/player-ab.log head/grand-bruxelles-game/artifacts/qa/player_procedural_fallback_ab/metrics.log 2>/dev/null || true
      - name: Upload player A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-procedural-fallback-ab
          path: head/grand-bruxelles-game/artifacts/qa/player_procedural_fallback_ab
          if-no-files-found: warn
