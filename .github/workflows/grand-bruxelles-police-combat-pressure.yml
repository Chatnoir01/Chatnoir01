name: Grand Bruxelles Police Combat Pressure

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-police-combat-pressure.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/npc_police_action_request.gd"
      - "grand-bruxelles-game/game/scripts/npc_police_combat_runtime.gd"
      - "grand-bruxelles-game/game/scripts/npc_police_combat_feedback_runtime.gd"
      - "grand-bruxelles-game/game/tests/npc_police_combat_pressure_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  police-combat-pressure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://godot-releases.nbg1.your-objectstorage.com/4.7.1-stable/Godot_v4.7.1-stable_linux.arm64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.arm64
      - name: Import production project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.arm64 --headless --path grand-bruxelles-game --editor --quit
      - name: Run police combat pressure regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.arm64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/npc_police_combat_pressure_test.gd \
            2>&1 | tee /tmp/police-combat-pressure.log
          if grep -E "SCRIPT ERROR|Parse Error:|POLICE_COMBAT_PRESSURE_FAIL" /tmp/police-combat-pressure.log; then exit 1; fi
          grep -F "POLICE_COMBAT_PRESSURE_OK" /tmp/police-combat-pressure.log
