name: Grand Bruxelles Police Vehicles

on:
  push:
    branches: ["systems-police-vehicles"]
    paths:
      - "grand-bruxelles-game/game/vehicles/police_*.tscn"
      - "grand-bruxelles-game/game/scripts/police_vehicle_visuals.gd"
      - "grand-bruxelles-game/game/tests/police_vehicle_component_test.gd"
      - "grand-bruxelles-game/assets/police/**"
      - ".github/workflows/grand-bruxelles-police-vehicles.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/vehicles/police_*.tscn"
      - "grand-bruxelles-game/game/scripts/police_vehicle_visuals.gd"
      - "grand-bruxelles-game/game/tests/police_vehicle_component_test.gd"
      - "grand-bruxelles-game/assets/police/**"
      - ".github/workflows/grand-bruxelles-police-vehicles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log
      - name: Police vehicle component test
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/police_vehicle_component_test.gd 2>&1 | tee /tmp/police.log
          ! grep -E "SCRIPT ERROR|Parse Error:|POLICE_VEHICLE_COMPONENT_FAIL" /tmp/police.log
          grep -q "POLICE_VEHICLE_COMPONENT_OK" /tmp/police.log
