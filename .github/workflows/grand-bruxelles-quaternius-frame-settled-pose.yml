name: Grand Bruxelles Quaternius Frame Settled Pose

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_quaternius_frame_settled_pose_probe.gd"
      - "grand-bruxelles-game/tests/test_quaternius_frame_settled_pose_contract.py"
      - ".github/workflows/grand-bruxelles-quaternius-frame-settled-pose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-settled-pose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_quaternius_frame_settled_pose_contract.py
      - name: Fetch exact CC0 source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/qfsp/source /tmp/qfsp/evidence
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/qfsp/source.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/qfsp/source.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/qfsp/source.zip)" = "38687957"
          unzip -q /tmp/qfsp/source.zip -d /tmp/qfsp/source
          grep -Eqi 'cc0|creative commons zero' "$(find /tmp/qfsp/source -iname 'LICENSE*' -type f -print -quit)"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/qfsp/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/qfsp/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/qfsp/engine
          GODOT_BIN=/tmp/qfsp/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/qfsp/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/qfsp/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and run frame-settled pose probe
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/qfsp/source -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/qfsp/source -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="QuaterniusFrameSettledPose"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp grand-bruxelles-game/tools/godot_quaternius_frame_settled_pose_probe.gd "$PROJECT_ROOT/gb_frame_settled_pose_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/qfsp/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_frame_settled_pose_probe.gd -- /tmp/qfsp/evidence/frame-settled-pose.json 2>&1 | tee /tmp/qfsp/evidence/probe.log
          grep -Fq 'QUATERNIUS_FRAME_SETTLED_POSE_OK' /tmp/qfsp/evidence/probe.log
      - name: Validate frame-settled local/global pose evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/qfsp/evidence/frame-settled-pose.json').read_text(encoding='utf-8'))
          v = p['godot_version']
          assert p['format'] == 'grand-bruxelles-quaternius-frame-settled-pose-v1'
          assert (v['major'], v['minor'], v['patch'], v['status']) == (4, 7, 1, 'stable')
          assert p['sample_count'] == 61
          assert p['settlement_method'] == 'process_frame_after_scene_mount_and_each_seek'
          assert p['semantic_selection_allowed'] is False
          assert p['civ1_retarget_authorized'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['visual_approval_claimed'] is False
          rows = p['measurements']
          assert len(rows) == 3
          assert {r['animation'] for r in rows} == {'UAL1_Standard/Walk','UAL1_Standard/Jog_Fwd','UAL1_Standard/Sprint'}
          for r in rows:
              assert r['valid'] is True
              assert r['sample_count'] == 61
              assert len(r['samples']) == 61
              assert r['bilateral_local_pose_motion'] is True, f'local foot poses remain static after frame settlement: {r}'
              assert r['bilateral_global_pose_motion'] is True, f'global foot poses remain static after frame settlement: {r}'
          Path('/tmp/qfsp/evidence/frame-settled-summary.json').write_text(json.dumps({
              'format': 'grand-bruxelles-quaternius-frame-settled-summary-v1',
              'measurements': [{
                  'animation': r['animation'],
                  'left_local_m': r['left_foot_local_position_range_m'],
                  'right_local_m': r['right_foot_local_position_range_m'],
                  'left_global_m': r['left_foot_global_position_range_m'],
                  'right_global_m': r['right_foot_global_position_range_m'],
                  'left_rotation_deg': r['left_foot_local_rotation_range_deg'],
                  'right_rotation_deg': r['right_foot_local_rotation_range_deg'],
              } for r in rows],
              'semantic_selection_allowed': False,
              'civ1_retarget_authorized': False,
          }, indent=2), encoding='utf-8')
          print('QUATERNIUS_FRAME_SETTLED_POSE_GATE_OK')
          PY
      - name: Keep source ephemeral
        run: |
          set -euo pipefail
          git diff --exit-code
      - name: Upload frame-settled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-frame-settled-pose-${{ github.sha }}
          path: |
            /tmp/qfsp/evidence/godot-version.log
            /tmp/qfsp/evidence/import.log
            /tmp/qfsp/evidence/probe.log
            /tmp/qfsp/evidence/frame-settled-pose.json
            /tmp/qfsp/evidence/frame-settled-summary.json
          if-no-files-found: warn
          retention-days: 14
