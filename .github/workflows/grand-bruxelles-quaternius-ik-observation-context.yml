name: Grand Bruxelles Quaternius IK Observation Context

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_quaternius_ik_observation_probe.gd"
      - "grand-bruxelles-game/tools/godot_quaternius_frame_settled_pose_probe.gd"
      - "grand-bruxelles-game/tests/test_quaternius_ik_observation_contract.py"
      - ".github/workflows/grand-bruxelles-quaternius-ik-observation-context.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_quaternius_ik_observation_contract.py
      - name: Fetch exact CC0 source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/qio/source /tmp/qio/evidence
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/qio/source.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/qio/source.zip' | sha256sum -c -
          stat -c '%s' /tmp/qio/source.zip | tee /tmp/qio/evidence/archive-size.txt
          test "$(cat /tmp/qio/evidence/archive-size.txt)" = "38687957"
          unzip -q /tmp/qio/source.zip -d /tmp/qio/source
          find /tmp/qio/source -type f -printf '%P\n' | sort > /tmp/qio/evidence/archive-files.txt
          grep -Eqi 'cc0|creative commons zero' "$(find /tmp/qio/source -iname 'LICENSE*' -type f -print -quit)"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/qio/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/qio/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/qio/engine
          GODOT_BIN=/tmp/qio/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/qio/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/qio/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and measure source tracks plus frame-settled applied poses
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/qio/source -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/qio/source -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="QuaterniusIKObservationContext"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp grand-bruxelles-game/tools/godot_quaternius_ik_observation_probe.gd "$PROJECT_ROOT/gb_observation_probe.gd"
          cp grand-bruxelles-game/tools/godot_quaternius_frame_settled_pose_probe.gd "$PROJECT_ROOT/gb_frame_settled_pose_probe.gd"
          printf '%s\n' "$PROJECT_ROOT" > /tmp/qio/evidence/project-root.txt
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/qio/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_observation_probe.gd -- /tmp/qio/evidence/observation-context.json 2>&1 | tee /tmp/qio/evidence/probe.log
          grep -Fq 'QUATERNIUS_IK_OBSERVATION_PROBE_OK' /tmp/qio/evidence/probe.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_frame_settled_pose_probe.gd -- /tmp/qio/evidence/frame-settled-pose.json 2>&1 | tee /tmp/qio/evidence/frame-settled-probe.log
          grep -Fq 'QUATERNIUS_FRAME_SETTLED_POSE_OK' /tmp/qio/evidence/frame-settled-probe.log
      - name: Validate source-track and canonical frame-settled pose proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('/tmp/qio/evidence/observation-context.json').read_text(encoding='utf-8'))
          frame = json.loads(Path('/tmp/qio/evidence/frame-settled-pose.json').read_text(encoding='utf-8'))
          v = source['godot_version']
          assert source['format'] == 'grand-bruxelles-quaternius-ik-observation-context-v4'
          assert frame['format'] == 'grand-bruxelles-quaternius-frame-settled-pose-v1'
          assert (v['major'], v['minor'], v['patch'], v['status']) == (4, 7, 1, 'stable')
          fv = frame['godot_version']
          assert (fv['major'], fv['minor'], fv['patch'], fv['status']) == (4, 7, 1, 'stable')
          assert source['sample_count'] == frame['sample_count'] == 61
          assert source['semantic_selection_allowed'] is False
          assert source['civ1_retarget_authorized'] is False
          assert source['grounding_verified'] is False
          assert source['foot_slide_verified'] is False
          assert frame['semantic_selection_allowed'] is False
          assert frame['civ1_retarget_authorized'] is False
          assert frame['grounding_verified'] is False
          assert frame['foot_slide_verified'] is False
          assert frame['visual_approval_claimed'] is False

          observations = source['observations']
          ids = [o['observation_id'] for o in observations]
          assert observations and len(ids) == len(set(ids))
          targets = {'UAL1_Standard/Walk','UAL1_Standard/Jog_Fwd','UAL1_Standard/Sprint'}
          assert targets.issubset({o['animation'] for o in observations})
          bilateral = [o for o in observations if o['bilateral_chain_motion']]
          assert bilateral, 'no context shows bilateral source leg-chain motion'
          refs = source['reference_context_candidates']
          assert len(refs) == 3
          by_id = {o['observation_id']: o for o in observations}
          direct_rows = []
          for ref in refs:
              m = by_id[ref]['pose_measurement']
              assert m['valid'] is True
              direct = m['direct_track_pose_measurement']
              assert direct['valid'] is True
              assert direct['method'] == 'direct_imported_transform_tracks_to_skeleton'
              assert direct['minimum_applied_track_count'] > 0, f'no imported transform tracks resolved for {ref}'
              direct_rows.append({
                  'observation_id': ref,
                  'minimum_applied_track_count': direct['minimum_applied_track_count'],
                  'same_transaction_left_global_m': direct['left_foot_pose_range_m'],
                  'same_transaction_right_global_m': direct['right_foot_pose_range_m'],
                  'same_transaction_restored': direct['direct_pose_state_restored_after_measurement'],
              })

          frame_rows = frame['measurements']
          assert len(frame_rows) == 3
          assert {r['animation'] for r in frame_rows} == targets
          for r in frame_rows:
              assert r['valid'] is True
              assert r['sample_count'] == 61
              assert len(r['samples']) == 61
              assert r['settlement_method'] == 'process_frame_after_scene_mount_and_each_seek'
              assert r['bilateral_local_pose_motion'] is True, f'local pose static after frame settlement: {r}'
              assert r['bilateral_global_pose_motion'] is True, f'global pose static after frame settlement: {r}'
              assert r['left_foot_global_position_range_m'] > 0
              assert r['right_foot_global_position_range_m'] > 0

          summary = {
              'format': 'grand-bruxelles-quaternius-ik-observation-summary-v5',
              'observation_count': len(observations),
              'bilateral_motion_observation_count': len(bilateral),
              'reference_context_candidates': refs,
              'same_transaction_direct_diagnostic': direct_rows,
              'canonical_pose_method': frame['settlement_method'],
              'canonical_frame_settled_measurements': [{
                  'animation': r['animation'],
                  'left_local_position_m': r['left_foot_local_position_range_m'],
                  'right_local_position_m': r['right_foot_local_position_range_m'],
                  'left_global_position_m': r['left_foot_global_position_range_m'],
                  'right_global_position_m': r['right_foot_global_position_range_m'],
                  'left_local_rotation_deg': r['left_foot_local_rotation_range_deg'],
                  'right_local_rotation_deg': r['right_foot_local_rotation_range_deg'],
              } for r in frame_rows],
              'semantic_selection_allowed': False,
              'civ1_retarget_authorized': False,
              'grounding_verified': False,
              'foot_slide_verified': False,
              'visual_approval_claimed': False,
          }
          Path('/tmp/qio/evidence/observation-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print('QUATERNIUS_IK_OBSERVATION_CONTEXT_OK frame_settled_pose=canonical')
          PY
      - name: Keep source ephemeral
        run: |
          set -euo pipefail
          test ! -e grand-bruxelles-game/assets/characters/civilians/civ1/source/quaternius_ik_rigged.zip
          git diff --exit-code
      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-ik-observation-${{ github.sha }}
          path: |
            /tmp/qio/evidence/archive-size.txt
            /tmp/qio/evidence/archive-files.txt
            /tmp/qio/evidence/godot-version.log
            /tmp/qio/evidence/project-root.txt
            /tmp/qio/evidence/import.log
            /tmp/qio/evidence/probe.log
            /tmp/qio/evidence/frame-settled-probe.log
            /tmp/qio/evidence/observation-context.json
            /tmp/qio/evidence/frame-settled-pose.json
            /tmp/qio/evidence/observation-summary.json
          if-no-files-found: warn
          retention-days: 14
