name: Grand Bruxelles Quaternius Low Foot Speed

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_quaternius_low_foot_speed_probe.gd"
      - "grand-bruxelles-game/tests/test_quaternius_low_foot_speed_contract.py"
      - ".github/workflows/grand-bruxelles-quaternius-low-foot-speed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  low-foot-speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_quaternius_low_foot_speed_contract.py
      - name: Fetch exact CC0 source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/qfls/source /tmp/qfls/evidence
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/qfls/source.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/qfls/source.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/qfls/source.zip)" = "38687957"
          unzip -q /tmp/qfls/source.zip -d /tmp/qfls/source
          grep -Eqi 'cc0|creative commons zero' "$(find /tmp/qfls/source -iname 'LICENSE*' -type f -print -quit)"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/qfls/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/qfls/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/qfls/engine
          GODOT_BIN=/tmp/qfls/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/qfls/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/qfls/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and run low-foot speed probe
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/qfls/source -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/qfls/source -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="QuaterniusLowFootSpeed"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp grand-bruxelles-game/tools/godot_quaternius_low_foot_speed_probe.gd "$PROJECT_ROOT/gb_low_foot_speed_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/qfls/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_low_foot_speed_probe.gd -- /tmp/qfls/evidence/low-foot-speed.json 2>&1 | tee /tmp/qfls/evidence/probe.log
          grep -Fq 'QUATERNIUS_LOW_FOOT_SPEED_OK' /tmp/qfls/evidence/probe.log
      - name: Validate diagnostic evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/qfls/evidence/low-foot-speed.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-quaternius-low-foot-speed-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['sample_count']==121
          assert p['low_band_definition']=='source_relative_bottom_10_percent_of_each_foot_vertical_excursion'
          assert p['diagnostic_only'] is True
          assert p['world_ground_assumed'] is False
          assert p['semantic_selection_allowed'] is False
          assert p['selected_run_alias']==''
          assert p['civ1_retarget_authorized'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['visual_approval_claimed'] is False
          rows=p['measurements']
          assert len(rows)==2
          assert {r['animation'] for r in rows}=={'UAL1_Standard/Jog_Fwd','UAL1_Standard/Sprint'}
          for r in rows:
              assert r['valid'] is True
              assert r['sample_count']==121
              for side in ('left_foot','right_foot'):
                  m=r[side]
                  assert m['vertical_range_m']>0.0
                  assert m['low_band_sample_count']>0
                  assert m['low_band_horizontal_speed_mps_median']>=0.0
                  assert m['low_band_horizontal_speed_mps_p90']>=m['low_band_horizontal_speed_mps_median']
                  assert m['low_band_horizontal_speed_mps_max']>=m['low_band_horizontal_speed_mps_p90']
          print('QUATERNIUS_LOW_FOOT_SPEED_GATE_OK')
          PY
      - name: Keep source ephemeral
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-low-foot-speed-${{ github.sha }}
          path: |
            /tmp/qfls/evidence/godot-version.log
            /tmp/qfls/evidence/import.log
            /tmp/qfls/evidence/probe.log
            /tmp/qfls/evidence/low-foot-speed.json
          if-no-files-found: warn
          retention-days: 14
