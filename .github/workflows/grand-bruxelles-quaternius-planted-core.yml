name: Grand Bruxelles Quaternius Planted Core

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_quaternius_planted_core_probe.gd"
      - "grand-bruxelles-game/tests/test_quaternius_planted_core_contract.py"
      - ".github/workflows/grand-bruxelles-quaternius-planted-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planted-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_quaternius_planted_core_contract.py
      - name: Fetch exact CC0 source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/qpc/source /tmp/qpc/evidence
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/qpc/source.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/qpc/source.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/qpc/source.zip)" = "38687957"
          unzip -q /tmp/qpc/source.zip -d /tmp/qpc/source
          grep -Eqi 'cc0|creative commons zero' "$(find /tmp/qpc/source -iname 'LICENSE*' -type f -print -quit)"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/qpc/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/qpc/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/qpc/engine
          GODOT_BIN=/tmp/qpc/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/qpc/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/qpc/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and run planted-core probe
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/qpc/source -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/qpc/source -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="QuaterniusPlantedCore"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp grand-bruxelles-game/tools/godot_quaternius_planted_core_probe.gd "$PROJECT_ROOT/gb_planted_core_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/qpc/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_planted_core_probe.gd -- /tmp/qpc/evidence/planted-core.json 2>&1 | tee /tmp/qpc/evidence/probe.log
          grep -Fq 'QUATERNIUS_PLANTED_CORE_OK' /tmp/qpc/evidence/probe.log
      - name: Validate planted-core evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/qpc/evidence/planted-core.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-quaternius-planted-core-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['sample_count']==121
          assert p['core_definition']=='middle_50_percent_of_each_ordered_support_window_trim_25_percent_each_edge'
          assert p['diagnostic_only'] is True
          assert p['world_ground_assumed'] is False
          assert p['contact_verified'] is False
          assert p['semantic_selection_allowed'] is False
          assert p['selected_run_alias']==''
          assert p['civ1_retarget_authorized'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['visual_approval_claimed'] is False
          by_name={r['animation']:r for r in p['measurements']}
          assert set(by_name)=={'UAL1_Standard/Jog_Fwd','UAL1_Standard/Sprint'}
          for row in by_name.values():
              assert row['valid'] is True
              assert row['sample_count']==121
              assert row['terminal_loop_sample_excluded_from_support_mask'] is True
              for foot in ('left_foot','right_foot'):
                  f=row[foot]
                  assert f['vertical_range_m'] > 0.01
                  assert f['support_window_count'] >= 1
                  assert len(f['planted_core_windows'])==f['support_window_count']
                  for w in f['planted_core_windows']:
                      assert w['support_sample_count'] >= 4
                      assert w['core_trim_fraction_each_edge']==0.25
                      assert w['core_sample_count'] >= 2
                      assert len(w['core_sample_indices'])==w['core_sample_count']
                      assert w['core_segment_count'] >= 1
                      assert w['core_segment_speed_mps_median'] >= 0.0
                      assert w['core_segment_speed_mps_p90'] >= 0.0
                      assert w['core_segment_speed_mps_max'] >= w['core_segment_speed_mps_median'] - 1e-9
                      assert w['edge_segment_speed_mps_median'] >= 0.0
                      assert isinstance(w['support_window_wraps_cycle'], bool)
          sprint=by_name['UAL1_Standard/Sprint']
          assert sprint['left_foot']['planted_core_windows'][0]['support_window_wraps_cycle'] is True
          print('QUATERNIUS_PLANTED_CORE_EVIDENCE_OK')
          PY
      - name: Upload planted-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-planted-core-evidence
          path: /tmp/qpc/evidence
          if-no-files-found: warn
