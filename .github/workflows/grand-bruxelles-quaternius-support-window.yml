name: Grand Bruxelles Quaternius Support Windows

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/godot_quaternius_support_window_probe.gd"
      - "grand-bruxelles-game/tests/test_quaternius_support_window_contract.py"
      - ".github/workflows/grand-bruxelles-quaternius-support-window.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Contract regression
        run: python3 grand-bruxelles-game/tests/test_quaternius_support_window_contract.py
      - name: Fetch exact CC0 source archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/qsw/source /tmp/qsw/evidence
          URL='https://codeberg.org/jamesonBradfield/Quaternius_IK_Rigged_with_animations/archive/5c4dae72e49ad4e5959571e00a25d3d872cacba5.zip'
          curl --fail --location --retry 3 "$URL" --output /tmp/qsw/source.zip
          echo 'f868b316facd04d7686784b254f6f1bbcd7e14bc06f3ec70f92a3144dc462767  /tmp/qsw/source.zip' | sha256sum -c -
          test "$(stat -c '%s' /tmp/qsw/source.zip)" = "38687957"
          unzip -q /tmp/qsw/source.zip -d /tmp/qsw/source
          grep -Eqi 'cc0|creative commons zero' "$(find /tmp/qsw/source -iname 'LICENSE*' -type f -print -quit)"
      - name: Install exact official Godot 4.7.1
        run: |
          set -euo pipefail
          GODOT_ZIP=/tmp/qsw/Godot_v4.7.1-stable_linux.x86_64.zip
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip --output "$GODOT_ZIP"
          echo 'c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/qsw/Godot_v4.7.1-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp/qsw/engine
          GODOT_BIN=/tmp/qsw/engine/Godot_v4.7.1-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version | tee /tmp/qsw/evidence/godot-version.log
          grep -Eq '^4\.7\.1\.stable\.official\.' /tmp/qsw/evidence/godot-version.log
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Import and run support-window probe
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find /tmp/qsw/source -name project.godot -type f -print -quit)"
          if [ -n "$PROJECT_FILE" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT_FILE")"
          else
            PROJECT_ROOT="$(find /tmp/qsw/source -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_ROOT"
            cat > "$PROJECT_ROOT/project.godot" <<'EOF'
          [application]
          config/name="QuaterniusSupportWindows"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          fi
          cp grand-bruxelles-game/tools/godot_quaternius_support_window_probe.gd "$PROJECT_ROOT/gb_support_window_probe.gd"
          "$GODOT_BIN" --headless --editor --path "$PROJECT_ROOT" --quit 2>&1 | tee /tmp/qsw/evidence/import.log
          "$GODOT_BIN" --headless --path "$PROJECT_ROOT" --script res://gb_support_window_probe.gd -- /tmp/qsw/evidence/support-windows.json 2>&1 | tee /tmp/qsw/evidence/probe.log
          grep -Fq 'QUATERNIUS_SUPPORT_WINDOWS_OK' /tmp/qsw/evidence/probe.log
      - name: Validate diagnostic evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/qsw/evidence/support-windows.json').read_text())
          v=p['godot_version']
          assert p['format']=='grand-bruxelles-quaternius-support-windows-v1'
          assert (v['major'],v['minor'],v['patch'],v['status'])==(4,7,1,'stable')
          assert p['sample_count']==241
          assert p['support_plane_definition']=='minimum_bilateral_source_local_foot_height_per_clip'
          assert p['support_window_definition']=='contiguous_nonterminal_samples_within_bottom_10_percent_of_foot_vertical_excursion'
          assert p['diagnostic_only'] is True
          assert p['world_ground_assumed'] is False
          assert p['contact_verified'] is False
          assert p['semantic_selection_allowed'] is False
          assert p['selected_run_alias']==''
          assert p['civ1_retarget_authorized'] is False
          assert p['grounding_verified'] is False
          assert p['foot_slide_verified'] is False
          assert p['visual_approval_claimed'] is False
          rows=p['measurements']
          assert len(rows)==2
          assert {r['animation'] for r in rows}=={'UAL1_Standard/Jog_Fwd','UAL1_Standard/Sprint'}
          for r in rows:
              assert r['valid'] is True
              assert r['sample_count']==241
              assert isinstance(r['support_plane_y_m'], (int,float))
              for side in ('left_foot','right_foot'):
                  m=r[side]
                  assert m['vertical_range_m'] > 0.0
                  assert m['candidate_window_count'] > 0
                  assert m['terminal_loop_sample_excluded'] is True
                  assert 240 not in m['candidate_sample_indices']
                  for w in m['candidate_windows']:
                      assert 0 <= w['start_sample_index'] <= w['end_sample_index'] < 240
                      assert w['sample_count'] >= 1
                      assert w['horizontal_path_length_m'] >= 0.0
                      assert w['min_distance_to_support_plane_m'] >= -1e-6
                      assert w['max_distance_to_support_plane_m'] >= w['min_distance_to_support_plane_m']
          print('QUATERNIUS_SUPPORT_WINDOWS_GATE_OK')
          PY
      - name: Keep source ephemeral
        run: git diff --exit-code
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quaternius-support-windows-${{ github.sha }}
          path: |
            /tmp/qsw/evidence/godot-version.log
            /tmp/qsw/evidence/import.log
            /tmp/qsw/evidence/probe.log
            /tmp/qsw/evidence/support-windows.json
          if-no-files-found: warn
          retention-days: 14
