name: Grand Bruxelles Real Player Acquire

on:
  push:
    branches:
      - agent/real-authored-player-binary
    paths:
      - ".github/workflows/grand-bruxelles-real-player-acquire.yml"
      - "grand-bruxelles-game/game/tests/production_player_binary_test.gd"
      - "grand-bruxelles-game/game/tests/production_player_binary_capture_test.gd"
      - "grand-bruxelles-game/assets/characters/player_character.PROVENANCE.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-audit-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire pinned CC0 authored character
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p grand-bruxelles-game/assets/characters
          SOURCE_COMMIT=672074b73ba276876a19e8816ecdc5241817ab47
          BASE="https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/${SOURCE_COMMIT}"
          curl -fL --retry 3 "$BASE/addons/kaykit_character_pack_adventures/Characters/gltf/Mage.glb" \
            -o grand-bruxelles-game/assets/characters/player_character.glb
          curl -fL --retry 3 "$BASE/addons/kaykit_character_pack_adventures/Characters/gltf/mage_texture.png" \
            -o grand-bruxelles-game/assets/characters/mage_texture.png
          curl -fL --retry 3 "$BASE/LICENSE.txt" \
            -o grand-bruxelles-game/assets/characters/LICENSE-KAYKIT-ADVENTURERS.txt
          test -s grand-bruxelles-game/assets/characters/player_character.glb
          test -s grand-bruxelles-game/assets/characters/mage_texture.png
          test -s grand-bruxelles-game/assets/characters/LICENSE-KAYKIT-ADVENTURERS.txt
          test "$(git hash-object grand-bruxelles-game/assets/characters/player_character.glb)" = "c89f19f6e707f6e07e4632a08876bd6d0172b082"
          test "$(git hash-object grand-bruxelles-game/assets/characters/mage_texture.png)" = "d0b91fba111e8b9c952aab6698807c0200061100"
          sha256sum grand-bruxelles-game/assets/characters/player_character.glb \
            grand-bruxelles-game/assets/characters/mage_texture.png \
            | tee /tmp/player-binary-sha256.txt

      - name: Audit raw GLB skin materials and animations
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          path = Path('grand-bruxelles-game/assets/characters/player_character.glb')
          data = path.read_bytes()
          if len(data) < 20:
              raise SystemExit('GLB too small')
          magic, version, total = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF', magic
          assert version == 2, version
          assert total == len(data), (total, len(data))
          offset = 12
          document = None
          while offset < len(data):
              chunk_len, chunk_type = struct.unpack_from('<II', data, offset)
              offset += 8
              chunk = data[offset:offset + chunk_len]
              offset += chunk_len
              if chunk_type == 0x4E4F534A:
                  document = json.loads(chunk.rstrip(b'\x00 \t\r\n').decode('utf-8'))
                  break
          assert document is not None, 'JSON chunk missing'
          skins = document.get('skins', [])
          materials = document.get('materials', [])
          animations = document.get('animations', [])
          meshes = document.get('meshes', [])
          weighted = 0
          for mesh in meshes:
              for primitive in mesh.get('primitives', []):
                  attrs = primitive.get('attributes', {})
                  if 'JOINTS_0' in attrs and 'WEIGHTS_0' in attrs:
                      weighted += 1
          names = [a.get('name', '') for a in animations]
          lowered = [n.lower() for n in names]
          assert skins, 'no skins in GLB'
          assert weighted > 0, 'no weighted mesh primitive'
          assert materials, 'no materials in GLB'
          assert animations, 'no animations in GLB'
          assert any('idle' in n for n in lowered), names
          assert any(any(k in n for k in ('walk', 'run', 'jog', 'sprint')) for n in lowered), names
          print(f'RAW_PLAYER_GLTF_OK skins={len(skins)} weighted_primitives={weighted} materials={len(materials)} animations={len(animations)}')
          print('RAW_PLAYER_ANIMATIONS=' + ','.join(names))
          PY

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Import project with real binary
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/real-player-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/real-player-import.log; then exit 1; fi

      - name: Prove production Player selects real binary
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path grand-bruxelles-game \
            --script res://game/tests/production_player_binary_test.gd 2>&1 | tee /tmp/real-player-test.log
          if grep -E "SCRIPT ERROR|Parse Error:|PRODUCTION_PLAYER_BINARY_FAIL" /tmp/real-player-test.log; then exit 1; fi
          grep -q "Grand Bruxelles authored player loaded: res://assets/characters/player_character.glb" /tmp/real-player-test.log
          grep -q "PRODUCTION_PLAYER_BINARY_OK" /tmp/real-player-test.log

      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers

      - name: Render deterministic playable witness
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a godot \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/production_player_binary_capture_test.gd 2>&1 | tee /tmp/real-player-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|PRODUCTION_PLAYER_CAPTURE_FAIL" /tmp/real-player-capture.log; then exit 1; fi
          grep -q "PRODUCTION_PLAYER_CAPTURE_OK" /tmp/real-player-capture.log
          test -s grand-bruxelles-game/artifacts/player/production_authored_player.png

      - name: Upload binary audit and playable witness
        uses: actions/upload-artifact@v4
        with:
          name: real-authored-player-evidence
          path: |
            /tmp/player-binary-sha256.txt
            /tmp/real-player-import.log
            /tmp/real-player-test.log
            /tmp/real-player-capture.log
            grand-bruxelles-game/artifacts/player/production_authored_player.png
          if-no-files-found: error

      - name: Commit proven binary to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            grand-bruxelles-game/assets/characters/player_character.glb \
            grand-bruxelles-game/assets/characters/mage_texture.png \
            grand-bruxelles-game/assets/characters/LICENSE-KAYKIT-ADVENTURERS.txt
          git commit -m "asset(player): add proven CC0 authored pilot binary [skip acquire]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
