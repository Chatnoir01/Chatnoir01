name: Grand Bruxelles Real Player Current Build

on:
  push:
    branches:
      - integration/real-player-kaykit-rogue-current
    paths:
      - .github/workflows/grand-bruxelles-real-player-current-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-real-player-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/real-player-kaykit-rogue-current
          fetch-depth: 0
      - name: Assert exact production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = '1fd12d238f18ae19d61f2a03e947a3819f2d14c9'
      - name: Acquire exact pinned CC0 GLB
        shell: bash
        run: |
          set -euo pipefail
          dst='grand-bruxelles-game/assets/characters/player/kaykit_rogue/Rogue.glb'
          mkdir -p "$(dirname "$dst")"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0/672074b73ba276876a19e8816ecdc5241817ab47/addons/kaykit_character_pack_adventures/Characters/gltf/Rogue.glb' \
            --output "$dst"
          test "$(stat -c '%s' "$dst")" = '3616284'
          test "$(git hash-object "$dst")" = 'c8827661105eef7b2bfbef3bc676d41a47625733'
      - name: Bring proven non-workflow integration files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/real-player-kaykit-rogue-live
          git checkout origin/integration/real-player-kaykit-rogue-live -- \
            grand-bruxelles-game/tools/integrate_real_player.py \
            grand-bruxelles-game/game/tests/real_authored_player_asset_test.gd \
            grand-bruxelles-game/assets/characters/player/kaykit_rogue/PROVENANCE.md \
            grand-bruxelles-game/assets/LICENSE_REGISTRY.tsv
          python3 grand-bruxelles-game/tools/integrate_real_player.py
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      - name: Import exact GLB
        run: godot --headless --path grand-bruxelles-game --import
      - name: Prove real player on exact-current-main branch
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path grand-bruxelles-game \
            --script res://game/tests/real_authored_player_asset_test.gd 2>&1 | tee /tmp/real-player.log
          if grep -E 'SCRIPT ERROR|Parse Error:|REAL_AUTHORED_PLAYER_FAIL' /tmp/real-player.log; then exit 1; fi
          grep -q 'REAL_AUTHORED_PLAYER_OK' /tmp/real-player.log
      - name: Commit production lot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            grand-bruxelles-game/assets/characters/player/kaykit_rogue/Rogue.glb \
            grand-bruxelles-game/assets/characters/player/kaykit_rogue/PROVENANCE.md \
            grand-bruxelles-game/assets/LICENSE_REGISTRY.tsv \
            grand-bruxelles-game/game/scripts/humanoid_visual.gd \
            grand-bruxelles-game/game/tests/real_authored_player_asset_test.gd
          git commit -m 'visual(player): add real rigged animated CC0 character'
          git push origin HEAD:integration/real-player-kaykit-rogue-current
