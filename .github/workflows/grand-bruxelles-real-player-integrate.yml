name: Grand Bruxelles Real Player Integrate

on:
  push:
    branches:
      - integration/real-player-kaykit-rogue-live
    paths:
      - .github/workflows/grand-bruxelles-real-player-integrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-real-player:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/real-player-kaykit-rogue-live
          fetch-depth: 0
      - name: Verify pinned authored binary
        shell: bash
        run: |
          set -euo pipefail
          dst='grand-bruxelles-game/assets/characters/player/kaykit_rogue/Rogue.glb'
          test -f "$dst"
          test "$(stat -c '%s' "$dst")" = '3616284'
          test "$(git hash-object "$dst")" = 'c8827661105eef7b2bfbef3bc676d41a47625733'
      - name: Apply bounded production integration
        run: python3 grand-bruxelles-game/tools/integrate_real_player.py
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
      - name: Import real authored GLB
        run: godot --headless --path grand-bruxelles-game --editor --quit-after 3
      - name: Prove rig materials animations and production selection
        shell: bash
        run: |
          set -o pipefail
          timeout 60s godot --headless --path grand-bruxelles-game \
            --script res://game/tests/real_authored_player_asset_test.gd 2>&1 | tee /tmp/real-player.log
          if grep -E 'SCRIPT ERROR|Parse Error:|REAL_AUTHORED_PLAYER_FAIL' /tmp/real-player.log; then
            exit 1
          fi
          grep -q 'REAL_AUTHORED_PLAYER_OK' /tmp/real-player.log
      - name: Commit proven runtime integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grand-bruxelles-game/game/scripts/humanoid_visual.gd \
            .github/workflows/grand-bruxelles-character-loader.yml
          if git diff --cached --quiet; then
            echo 'Runtime integration already committed.'
            exit 0
          fi
          git commit -m 'visual(player): select real rigged animated CC0 character'
          git push origin HEAD:integration/real-player-kaykit-rogue-live
