name: Grand Bruxelles Real Player Stef Acquire

on:
  push:
    branches: ["visual/real-player-stef-current"]
    paths:
      - ".github/workflows/grand-bruxelles-real-player-stef-acquire.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-legacy-material-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public CC0 package
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/stef_npc1.zip https://opengameart.org/sites/default/files/stef_npc1_1.zip
          echo '3b1f65c188ffd91dd237dae3d670d8b1d390ce7e96a251dd13ec5b8fb5d6fe22  /tmp/stef_npc1.zip' | sha256sum -c -
          mkdir -p /tmp/stef
          unzip -q /tmp/stef_npc1.zip -d /tmp/stef
      - name: Download official Blender 2.79b compatibility reader
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/blender279.tar.bz2 https://download.blender.org/release/Blender2.79/blender-2.79b-linux-glibc219-x86_64.tar.bz2
          mkdir -p /tmp/blender279
          tar -xjf /tmp/blender279.tar.bz2 -C /tmp/blender279 --strip-components=1
          /tmp/blender279/blender --version
      - name: Recover exact legacy texture-slot to material mapping
        run: |
          cat > /tmp/legacy_bindings.py <<'PY'
          import bpy, json, os
          report={'materials':{},'meshes':{},'images':{}}
          for mat in bpy.data.materials:
              slots=[]
              for idx,slot in enumerate(mat.texture_slots):
                  if slot is None or slot.texture is None:
                      continue
                  tex=slot.texture
                  image=None
                  if tex.type=='IMAGE' and tex.image is not None:
                      image={'name':tex.image.name,'filepath':bpy.path.abspath(tex.image.filepath)}
                  slots.append({
                      'index':idx,'texture':tex.name,'type':tex.type,
                      'texture_coords':slot.texture_coords,
                      'uv_layer':slot.uv_layer,
                      'use_map_color_diffuse':bool(slot.use_map_color_diffuse),
                      'diffuse_color_factor':float(slot.diffuse_color_factor),
                      'image':image,
                  })
              report['materials'][mat.name]={'texture_slots':slots,'diffuse_color':[float(x) for x in mat.diffuse_color]}
          for obj in bpy.data.objects:
              if obj.type!='MESH': continue
              report['meshes'][obj.name]={
                  'uv_textures':[u.name for u in obj.data.uv_textures],
                  'uv_layers':[u.name for u in obj.data.uv_layers],
                  'materials':[s.material.name if s.material else None for s in obj.material_slots],
              }
          for img in bpy.data.images:
              if img.name=='Render Result': continue
              report['images'][img.name]={'filepath':bpy.path.abspath(img.filepath),'size':[int(img.size[0]),int(img.size[1])]}
          print('STEF_LEGACY_BINDINGS='+json.dumps(report,sort_keys=True))
          open('/tmp/stef-legacy-bindings.json','w').write(json.dumps(report,indent=2,sort_keys=True))
          linked=sum(1 for m in report['materials'].values() for s in m['texture_slots'] if s['image'])
          assert linked >= 1, 'no legacy image texture bindings recovered'
          print('STEF_LEGACY_BINDINGS_OK linked_image_slots=%d' % linked)
          PY
          /tmp/blender279/blender -b '/tmp/stef/npc girl stef!.blend' --python /tmp/legacy_bindings.py
      - name: Upload legacy material evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-player-stef-legacy-material-bindings
          path: /tmp/stef-legacy-bindings.json
          if-no-files-found: error
