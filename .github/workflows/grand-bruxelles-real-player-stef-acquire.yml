name: Grand Bruxelles Real Player Stef Acquire

on:
  push:
    branches: ["visual/real-player-stef-current"]
    paths:
      - ".github/workflows/grand-bruxelles-real-player-stef-acquire.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-export-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact public CC0 package
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/stef_npc1.zip https://opengameart.org/sites/default/files/stef_npc1_1.zip
          echo '3b1f65c188ffd91dd237dae3d670d8b1d390ce7e96a251dd13ec5b8fb5d6fe22  /tmp/stef_npc1.zip' | sha256sum -c -
          mkdir -p /tmp/stef
          unzip -q /tmp/stef_npc1.zip -d /tmp/stef
          find /tmp/stef -type f -printf '%P\t%s bytes\n' | sort | tee /tmp/stef-inventory.txt
          test -f '/tmp/stef/npc girl stef!.blend'

      - name: Install Blender and glTF Python dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr 'import numpy; print("BLENDER_NUMPY_OK=" + numpy.__version__)'

      - name: Inspect source rig, UVs, skin bindings, actions and materials
        run: |
          cat > /tmp/inspect_stef.py <<'PY'
          import bpy, json, os
          armatures=[o for o in bpy.data.objects if o.type=='ARMATURE']
          meshes=[o for o in bpy.data.objects if o.type=='MESH']
          actions=list(bpy.data.actions)
          bound=[]
          mesh_report={}
          for o in meshes:
              if any(m.type=='ARMATURE' and m.object is not None for m in o.modifiers):
                  bound.append(o.name)
              uv=[]
              for i,layer in enumerate(o.data.uv_layers):
                  uv.append({'index':i,'name':layer.name,'active':bool(layer.active),'active_render':bool(layer.active_render),'loops':len(layer.data)})
              slots=[]
              for idx,slot in enumerate(o.material_slots):
                  slots.append({'index':idx,'material':slot.material.name if slot.material else None})
              mesh_report[o.name]={
                  'vertices':len(o.data.vertices),'polygons':len(o.data.polygons),
                  'uv_layers':uv,'active_uv':o.data.uv_layers.active.name if o.data.uv_layers.active else None,
                  'material_slots':slots,
                  'material_indices':sorted(set(int(p.material_index) for p in o.data.polygons)),
              }
          mat_report={}
          for m in bpy.data.materials:
              nodes=[]
              if m.use_nodes and m.node_tree:
                  for n in m.node_tree.nodes:
                      item={'type':n.bl_idname,'name':n.name}
                      if hasattr(n,'image') and n.image:
                          item['image']=n.image.name
                      nodes.append(item)
              mat_report[m.name]={
                  'use_nodes':bool(m.use_nodes),
                  'diffuse_color':[float(x) for x in m.diffuse_color],
                  'nodes':nodes,
              }
          image_report={}
          for i in bpy.data.images:
              if i.name=='Render Result': continue
              image_report[i.name]={
                  'filepath':bpy.path.abspath(i.filepath) if i.filepath else '',
                  'source':i.source,
                  'size':[int(i.size[0]),int(i.size[1])],
                  'packed':bool(i.packed_file),
              }
          report={
              'armatures':[o.name for o in armatures],
              'armature_bones':{o.name:len(o.data.bones) for o in armatures},
              'meshes':mesh_report,
              'armature_bound_meshes':bound,
              'actions':[a.name for a in actions],
              'materials':mat_report,
              'images':image_report,
              'material_slot_count':sum(len(o.material_slots) for o in meshes),
          }
          print('STEF_BLENDER_REPORT='+json.dumps(report, sort_keys=True))
          assert armatures and meshes and bound and actions
          assert report['material_slot_count'] > 0
          assert image_report
          open('/tmp/stef-blender-report.json','w').write(json.dumps(report, indent=2, sort_keys=True))
          PY
          blender -b '/tmp/stef/npc girl stef!.blend' --python /tmp/inspect_stef.py

      - name: Stop after source texture diagnostics
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/stef-blender-report.json'))
          for name,m in r['meshes'].items():
              print('MESH',name,'active_uv=',m['active_uv'],'uv_layers=',m['uv_layers'],'materials=',m['material_slots'])
          for name,m in r['materials'].items():
              print('MATERIAL',name,'nodes=',m['nodes'])
          for name,i in r['images'].items():
              print('IMAGE',name,i)
          PY
          exit 1

      - name: Upload deterministic source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-player-stef-source-diagnostics
          path: |
            /tmp/stef-inventory.txt
            /tmp/stef-blender-report.json
          if-no-files-found: warn
