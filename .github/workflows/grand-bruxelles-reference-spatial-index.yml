name: Grand Bruxelles Reference Spatial Index
on:
  pull_request:
    paths: ["grand-bruxelles-game/tools/visual_dataset/index_references_epsg31370.py", "grand-bruxelles-game/tools/visual_dataset/test_index_references_epsg31370.py", "grand-bruxelles-game/data/cell_manifests/**", ".github/workflows/grand-bruxelles-reference-spatial-index.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  spatial-index-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned projection library
        run: python3 -m pip install --disable-pip-version-check pyproj==3.7.2
      - run: python3 grand-bruxelles-game/tools/visual_dataset/test_index_references_epsg31370.py
      - name: Exercise repository cell manifests
        run: |
          python3 - <<'PY'
          import json
          p={'records':[{'canonical_id':'brussels-center','lat':50.8503,'lon':4.3517},{'canonical_id':'missing','lat':None,'lon':None}]}
          json.dump(p,open('/tmp/refs.json','w'))
          PY
          python3 grand-bruxelles-game/tools/visual_dataset/index_references_epsg31370.py --input /tmp/refs.json --cells grand-bruxelles-game/data/cell_manifests --output /tmp/index.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/index.json'))
          assert p['crs']=='EPSG:31370'
          assert p['summary']['records']==2 and p['summary']['missing_coordinates']==1
          assert all((x['easting_31370'] is None) == (x['spatial_status']=='MISSING_COORDINATES') for x in p['records'])
          print('REFERENCE_SPATIAL_INDEX_CLI_OK',p['summary'])
          PY
