name: Grand Bruxelles Region LoD2 C01 World-Y Datum

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.world_y_datum.lock.json"
      - "grand-bruxelles-game/tools/qa/lock_region_lod2_c01_world_y_datum.py"
      - ".github/workflows/grand-bruxelles-region-lod2-c01-world-y-datum.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lock-world-y-datum:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install raster reader
        run: python -m pip install --disable-pip-version-check rasterio

      - name: Validate lock contract and RED rails
        run: |
          python grand-bruxelles-game/tools/qa/lock_region_lod2_c01_world_y_datum.py \
            --contract grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.world_y_datum.lock.json \
            --validate-only
          python - <<'PY'
          import copy, json, sys
          from pathlib import Path
          sys.path.insert(0, "grand-bruxelles-game/tools/qa")
          import lock_region_lod2_c01_world_y_datum as lock
          p = Path("grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.world_y_datum.lock.json")
          c = json.loads(p.read_text())

          bad = copy.deepcopy(c)
          bad["world_anchor"]["lambert72_origin"][0] += 0.5
          try: lock.validate_contract(bad)
          except RuntimeError: pass
          else: raise SystemExit("RED failed: horizontal anchor drift was accepted")

          bad = copy.deepcopy(c)
          bad["dtm_tile_lock"]["archive_sha256"] = "0" * 64
          try: lock.validate_contract(bad)
          except RuntimeError: pass
          else: raise SystemExit("RED failed: DTM hash drift was accepted")

          bad = copy.deepcopy(c)
          bad["hard_rules"]["runtime_mount_authorized"] = True
          try: lock.validate_contract(bad)
          except RuntimeError: pass
          else: raise SystemExit("RED failed: runtime mount was accepted")

          bad = copy.deepcopy(c)
          bad["hard_rules"]["final_world_y_authorized"] = True
          try: lock.validate_contract(bad)
          except RuntimeError: pass
          else: raise SystemExit("RED failed: unmeasured final world Y was accepted")
          print("C01_WORLD_Y_DATUM_RED_OK")
          PY

      - name: Recover exact merged #975 rigid-anchor artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9387662517/zip" \
            > "$RUNNER_TEMP/rigid-anchor.zip"
          echo "05e4dcb02385a3e50ee492b87a83191e65ae65fe60694157903eea944cd1adc1  $RUNNER_TEMP/rigid-anchor.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rigid-anchor"
          unzip -q "$RUNNER_TEMP/rigid-anchor.zip" -d "$RUNNER_TEMP/rigid-anchor"

      - name: Download exact locked official DTM datum tile
        run: |
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 240 \
            "https://urbisdownload.datastore.brussels/UrbIS/Grid/DTM/DTM2021/TIFF/DTM_31370_TIFF_147169_20211009_50.zip" \
            -o "$RUNNER_TEMP/dtm-147169.zip"
          echo "b2bb34689ff35f080cb060fb8091e5d347342615575a24eedad89fe70467f803  $RUNNER_TEMP/dtm-147169.zip" | sha256sum -c -

      - name: Build deterministic C01 world-Y datum and 30k owner offsets
        run: |
          python grand-bruxelles-game/tools/qa/lock_region_lod2_c01_world_y_datum.py \
            --contract grand-bruxelles-game/data/qa/region_lod2_campaigns/region_lod2_C01_30000.world_y_datum.lock.json \
            --rigid-anchor-dir "$RUNNER_TEMP/rigid-anchor" \
            --dtm-archive "$RUNNER_TEMP/dtm-147169.zip" \
            --output-dir "$RUNNER_TEMP/world-y"

      - name: Require exact accounting and closed runtime rails
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "world-y"
          report = json.loads((root / "world_y_datum_locked.json").read_text())
          owners = json.loads((root / "owner_world_y_offset_by_owner.json").read_text())
          with (root / "owner_world_y_offset_per_owner.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert report["owners"] == len(owners) == len(rows) == 30000
          assert report["dtm"]["tile"] == 147169
          assert report["dtm"]["archive_sha256"] == "b2bb34689ff35f080cb060fb8091e5d347342615575a24eedad89fe70467f803"
          assert report["dtm"]["raster_sha256"] == "f7312e66081eb8f99f35793a55cf346364f76c7b0b6c915b6d25b057caf189a6"
          for key in ["runtime_authorized", "runtime_mount_authorized", "collision_authorized", "terrain_runtime_authorized", "source_geometry_modified", "jouable_promotion_authorized"]:
              assert report[key] is False, key
          assert report["owner_rigid_translation_only"] is True
          assert report["artifact_only"] is True
          print(f"C01_WORLD_Y_DATUM_GREEN: datum={report['dtm']['anchor_absolute_elevation_m']:.9f} owners=30000 final_world_y={report['final_world_y_authorized']}")
          PY

      - name: Publish result hashes
        run: cat "$RUNNER_TEMP/world-y/result.sha256.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: region-lod2-c01-30000-world-y-datum
          path: |
            ${{ runner.temp }}/world-y/world_y_datum_locked.json
            ${{ runner.temp }}/world-y/owner_world_y_offset_by_owner.json
            ${{ runner.temp }}/world-y/owner_world_y_offset_per_owner.csv
            ${{ runner.temp }}/world-y/result.sha256.json
          if-no-files-found: error
          compression-level: 9
