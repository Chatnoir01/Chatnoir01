name: Grand Bruxelles Region LoD2 Cell Batch Plan

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/qa/region_lod2_cell_batch_plan.py"
      - ".github/workflows/grand-bruxelles-region-lod2-cell-batch-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-lod2-cell-batch-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install spatial reader dependencies
        run: python -m pip install --disable-pip-version-check pyshp shapely

      - name: Build exact Brussels-Capital source batch plan
        run: |
          python grand-bruxelles-game/tools/qa/region_lod2_cell_batch_plan.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/region_lod2_cell_batch_plan" \
            --workers 10 \
            --cell-size 500 \
            --max-batch 250

      - name: Publish plan summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "region_lod2_cell_batch_plan" / "region_lod2_cell_batch_plan.json").read_text()
          )
          lines = [
              "## Brussels-Capital official UrbIS LoD2 cell batch plan",
              "",
              f"- Official owners: **{report['official_unique_building_ids']:,}**",
              f"- Already persisted: **{report['already_persisted_official_ids']:,}**",
              f"- Missing: **{report['missing_official_building_ids']:,}**",
              f"- Assigned to one official municipality: **{report['assigned_missing_owners']:,}**",
              f"- Boundary HOLD: **{report['boundary_ambiguous_missing_owners']:,}**",
              f"- Unassigned HOLD: **{report['unassigned_missing_owners']:,}**",
              f"- 500 m planning cells: **{report['planning_cell_count']:,}**",
              f"- Source micro-batches (max {report['max_source_owners_per_batch']} owners): **{report['source_batch_count']:,}**",
              "",
              "Planning only — runtime_authorized=false; materialization_authorized=false.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload complete regional batch plan
        uses: actions/upload-artifact@v4
        with:
          name: region-lod2-cell-batch-plan
          path: ${{ runner.temp }}/region_lod2_cell_batch_plan/*
          if-no-files-found: error
