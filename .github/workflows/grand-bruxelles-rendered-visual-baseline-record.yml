name: Grand Bruxelles Rendered Visual Baseline Record

on:
  push:
    branches:
      - "integration/main-visual-baseline-contract-v2"
    paths:
      - "grand-bruxelles-game/game/tests/rendered_main_baseline_test.gd"
      - ".github/workflows/grand-bruxelles-rendered-visual-baseline-record.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-visual-fingerprint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/visual-record-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/visual-record-import.log; then exit 1; fi
      - name: Record deterministic visual fingerprint
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GB_VISUAL_BASELINE_RECORD: "1"
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts
          timeout 120s xvfb-run -a \
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --rendering-method gl_compatibility \
            --script res://game/tests/rendered_main_baseline_test.gd 2>&1 | tee /tmp/visual-record.log
          if grep -E "SCRIPT ERROR|Parse Error:|RENDERED_MAIN_BASELINE_FAIL" /tmp/visual-record.log; then exit 1; fi
          grep -q "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/visual-record.log
          grep -q "RENDERED_MAIN_BASELINE_OK" /tmp/visual-record.log
          grep "RENDERED_MAIN_VISUAL_FINGERPRINT_JSON:" /tmp/visual-record.log | sed 's/^.*RENDERED_MAIN_VISUAL_FINGERPRINT_JSON: //' > grand-bruxelles-game/artifacts/rendered-main-fingerprint-candidate.json
          test -s grand-bruxelles-game/artifacts/rendered-main-fingerprint-candidate.json
          test -s grand-bruxelles-game/artifacts/rendered-main-baseline.png
      - name: Build versioned baseline JSON
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          candidate = Path('grand-bruxelles-game/artifacts/rendered-main-fingerprint-candidate.json')
          output = Path('grand-bruxelles-game/data/qa/rendered_main_baseline.json')
          data = json.loads(candidate.read_text(encoding='utf-8'))
          data['established_from'] = {
              'git_sha': os.environ['SOURCE_SHA'],
              'godot': '4.7.1',
              'rendering_method': 'gl_compatibility',
              'software_renderer': 'Mesa llvmpipe',
              'capture': 'game/main.tscn after 120 warmup + 120 sample frames',
              'review_contract': 'docs/RENDERED_VISUAL_BASELINE.md',
          }
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('VISUAL_BASELINE_JSON_READY', output, os.environ['SOURCE_SHA'])
          PY
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-rendered-visual-baseline-candidate-v2
          path: |
            grand-bruxelles-game/data/qa/rendered_main_baseline.json
            grand-bruxelles-game/artifacts/rendered-main-baseline.png
      - name: Commit lightweight visual baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/qa/rendered_main_baseline.json
          if git diff --cached --quiet; then
            echo "Visual baseline JSON already matches this capture."
          else
            git commit -m "qa: establish current-main rendered visual fingerprint baseline"
            git push origin HEAD:integration/main-visual-baseline-contract-v2
          fi
