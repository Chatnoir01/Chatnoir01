name: Grand Bruxelles Rgsdev Visual Proof

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/assets/vehicles/rgsdev/**"
      - "grand-bruxelles-game/game/scripts/rgsdev_vehicle_visual.gd"
      - "grand-bruxelles-game/game/tests/rgsdev_vehicle_visual_proof.gd"
      - ".github/workflows/grand-bruxelles-rgsdev-visual-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install software renderer and Godot 4.7.1
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Isolate unrelated autoloads and import FBX resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('grand-bruxelles-game/project.godot')
          lines=path.read_text(encoding='utf-8').splitlines(keepends=True)
          out=[]; in_autoload=False
          for line in lines:
              s=line.strip()
              if s == '[autoload]':
                  out.append(line); in_autoload=True; continue
              if in_autoload and s.startswith('[') and s.endswith(']'):
                  out.append('\n'); out.append(line); in_autoload=False; continue
              if in_autoload:
                  continue
              out.append(line)
          if in_autoload:
              out.append('\n')
          path.write_text(''.join(out), encoding='utf-8')
          PY
          rm -rf grand-bruxelles-game/.godot
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path grand-bruxelles-game --quit 2>&1 | tee /tmp/rgsdev-import.log
          if grep -E "Parse Error:|SCRIPT ERROR|ERROR: Failed to load script|Failed to import" /tmp/rgsdev-import.log; then exit 1; fi
          test -s grand-bruxelles-game/.godot/global_script_class_cache.cfg
          for model in ambulance bus firetruck hatchback limousine monster_truck muscle muscle_2 pickup police_muscle police_sedan police_sports police_suv roadster sedan sports suv taxi truck truck_with_trailer van; do
            test -f "grand-bruxelles-game/game/assets/vehicles/rgsdev/${model}.fbx"
          done

      - name: Render real Godot vehicle proof
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path grand-bruxelles-game \
            --script res://game/tests/rgsdev_vehicle_visual_proof.gd \
            -- --output=/tmp/rgsdev_vehicle_visual_proof.png 2>&1 | tee /tmp/rgsdev-visual-proof.log
          if grep -E "SCRIPT ERROR|Parse Error:|RGSDEV_VISUAL_PROOF_FAIL" /tmp/rgsdev-visual-proof.log; then exit 1; fi
          grep -q "RGSDEV_VISUAL_PROOF_OK vehicles=21 engine=4.7.1" /tmp/rgsdev-visual-proof.log
          test -s /tmp/rgsdev_vehicle_visual_proof.png
          file /tmp/rgsdev_vehicle_visual_proof.png

      - name: Upload Godot visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rgsdev-21-vehicles-godot-visual-proof
          path: |
            /tmp/rgsdev_vehicle_visual_proof.png
            /tmp/rgsdev-visual-proof.log
            /tmp/rgsdev-import.log
          if-no-files-found: warn
