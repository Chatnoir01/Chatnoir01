name: Grand Bruxelles Road Cell Frame Audit

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json'
      - 'grand-bruxelles-game/data/osm/**'
      - 'grand-bruxelles-game/tools/qa/road_registered_cell_frame_audit.py'
      - 'grand-bruxelles-game/tools/qa/test_road_registered_cell_frame_audit.py'
      - '.github/workflows/grand-bruxelles-road-cell-frame-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA" || {
            echo "RED: road-cell frame candidate does not contain live main" >&2
            exit 1
          }
          echo "ROAD_CELL_FRAME_LIVE_MAIN_OK live=$LIVE_MAIN_SHA candidate=$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed frame regressions
        working-directory: grand-bruxelles-game/tools/qa
        run: python test_road_registered_cell_frame_audit.py
      - name: Measure current road-to-Lambert72 frame readiness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/road-cell-frame-audit"
          python grand-bruxelles-game/tools/qa/road_registered_cell_frame_audit.py \
            --road-index grand-bruxelles-game/data/runtime/road_destination_runtime_index.json \
            --cell-index grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json \
            --crosswalk grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json \
            --report "$RUNNER_TEMP/road-cell-frame-audit/report.json" | tee "$RUNNER_TEMP/road-cell-frame-audit/run.log"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('grand-bruxelles-game')
          report_path = Path(os.environ['RUNNER_TEMP']) / 'road-cell-frame-audit' / 'report.json'
          r = json.loads(report_path.read_text())
          road_index = json.loads((root / 'data/runtime/road_destination_runtime_index.json').read_text())
          cell_index = json.loads((root / 'data/provenance/brussels_registered_cell_manifest_index.json').read_text())

          documents = road_index.get('documents') or []
          entries = cell_index.get('entries') or []
          expected_road_count = sum(len(d.get('road_ids') or []) for d in documents)

          assert r['status'] == 'HOLD_UNPROVEN_ROAD_TO_LAMBERT72_FRAME', r
          assert r['road_source_document_count'] == len(documents), r
          assert r['indexed_road_count'] == expected_road_count, r
          assert r['registered_cell_count'] == len(entries), r
          assert r['registered_cell_crs'] == 'EPSG:31370', r
          assert r['road_cell_crosswalk_present'] is False, r
          assert all(v is False for k, v in r.items() if k.endswith('_authorized')), r

          report_frames = {frame['path']: frame for frame in r['source_frames']}
          assert len(report_frames) == len(documents), (report_frames, documents)
          for descriptor in documents:
              path = descriptor['path']
              expected_sha = str(descriptor['sha256']).lower()
              frame = report_frames[path]
              source_path = root / path
              actual_sha = hashlib.sha256(source_path.read_bytes()).hexdigest()
              assert len(expected_sha) == 64, descriptor
              assert actual_sha == expected_sha, (path, actual_sha, expected_sha)
              assert frame['sha256'] == expected_sha, frame
              assert frame['origin'] == {'lat': 50.8419, 'lon': 4.348}, frame
              assert frame['explicit_crs'] is None, frame
              assert frame['coordinate_transform_present'] is False, frame
              assert frame['frame_proven'] is False, frame

          print(
              'ROAD_CELL_FRAME_HOLD_LOCKED_CURRENT '
              f'roads={expected_road_count} cells={len(entries)} '
              f'documents={len(documents)} frame_proven=false crosswalk=false'
          )
          PY
      - name: Upload coordinate-frame HOLD proof
        uses: actions/upload-artifact@v4
        with:
          name: road-cell-frame-audit
          path: ${{ runner.temp }}/road-cell-frame-audit
          if-no-files-found: error
