name: Grand Bruxelles Road Cell Grid Identity

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/tools/validate_road_destination_grid_identity.py'
      - 'grand-bruxelles-game/tools/tests/test_road_destination_grid_identity.py'
      - 'grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json'
      - '.github/workflows/grand-bruxelles-road-cell-grid-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-cell-grid-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate road cell grid identity
        working-directory: grand-bruxelles-game
        run: python tools/tests/test_road_destination_grid_identity.py
