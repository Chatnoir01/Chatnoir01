name: Grand Bruxelles Road Destination Municipality Binding

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json"
      - "grand-bruxelles-game/data/cell_manifests/**"
      - "grand-bruxelles-game/tools/validate_road_destination_municipality_binding.py"
      - "grand-bruxelles-game/tools/tests/test_road_destination_municipality_binding.py"
      - ".github/workflows/grand-bruxelles-road-destination-municipality-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  municipality-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate destination municipality binding
        working-directory: grand-bruxelles-game
        run: python tools/validate_road_destination_municipality_binding.py
      - name: Run municipality drift regressions
        working-directory: grand-bruxelles-game
        run: python tools/tests/test_road_destination_municipality_binding.py
