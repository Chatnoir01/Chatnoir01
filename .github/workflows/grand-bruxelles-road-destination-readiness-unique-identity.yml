name: Grand Bruxelles Road Destination Readiness Unique Identity

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/provenance/brussels_road_destination_readiness_catalog.json"
      - "grand-bruxelles-game/tests/validate_road_destination_readiness_unique_identity.py"
      - ".github/workflows/grand-bruxelles-road-destination-readiness-unique-identity.yml"

permissions:
  contents: read

jobs:
  unique-road-destination-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32
      - name: Require branch built from live main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
      - name: Reject duplicate destination identities
        shell: bash
        run: |
          set -euo pipefail
          cd grand-bruxelles-game
          python3 tests/validate_road_destination_readiness_unique_identity.py \
            data/provenance/brussels_road_destination_readiness_catalog.json \
            --self-test | tee /tmp/road-destination-unique-identity.log
          grep -F "duplicate_identity_fail_closed=true" /tmp/road-destination-unique-identity.log
          grep -F "finite_json_required=true" /tmp/road-destination-unique-identity.log
          grep -F "self_test=true" /tmp/road-destination-unique-identity.log
