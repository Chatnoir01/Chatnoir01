name: Grand Bruxelles Road Material Player Witness

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/tests/brussels_road_material_player_witness_test.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_road_surface_material.gd'
      - 'grand-bruxelles-game/game/scripts/brussels_osm_road_surface_runtime.gd'
      - 'grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd'
      - 'grand-bruxelles-game/game/main.tscn'
      - 'grand-bruxelles-game/data/osm/vertical_slice_01.game.json'
      - 'grand-bruxelles-game/data/qa/corridor_road_source_chain.contract.json'
      - 'grand-bruxelles-game/tests/test_road_material_player_witness_source_lock.py'
      - '.github/workflows/grand-bruxelles-road-material-player-witness.yml'
  workflow_dispatch:

jobs:
  road-material-player-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Require canonical corridor source identity and target coverage
        run: python3 grand-bruxelles-game/tests/test_road_material_player_witness_source_lock.py

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa

      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/road-material-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/road-material-import.log; then
            exit 1
          fi

      - name: Capture legitimate Lemonnier, Fonsny and Orts player witnesses
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts/road_material_player_witness
          for target in 359177328 408211693 411724192; do
            GB_ROAD_WITNESS_OSM_ID="$target" \
            xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
              --path grand-bruxelles-game \
              --resolution 1280x720 \
              --script res://game/tests/brussels_road_material_player_witness_test.gd \
              2>&1 | tee "grand-bruxelles-game/artifacts/road_material_player_witness/witness-${target}.log"
            grep -q "BRUSSELS_ROAD_MATERIAL_PLAYER_WITNESS_OK: osm_id=${target}" \
              "grand-bruxelles-game/artifacts/road_material_player_witness/witness-${target}.log"
          done

      - name: Validate exact full-frame evidence
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path('grand-bruxelles-game/artifacts/road_material_player_witness')
          contract = json.loads(Path('grand-bruxelles-game/data/qa/corridor_road_source_chain.contract.json').read_text())
          representatives = {int(item['osm_id']): item for item in contract['representatives']}
          targets = {
              'lemmonnier': (359177328, 'Maurice Lemonnier'),
              'fonsny': (408211693, 'Fonsny'),
              'orts': (411724192, 'Auguste Orts'),
          }
          for slug, (osm_id, name_fragment) in targets.items():
              assert osm_id in representatives, (osm_id, representatives)
              for suffix in ('before', 'control'):
                  name = f'road_material_{slug}_{suffix}.png'
                  data = (root / name).read_bytes()
                  assert data[:8] == b'\x89PNG\r\n\x1a\n', name
                  assert data[12:16] == b'IHDR', name
                  width, height = struct.unpack('>II', data[16:24])
                  assert (width, height) == (1280, 720), (name, width, height)
              report = json.loads((root / f'road_material_{slug}_player_witness.json').read_text())
              assert report['schema'] == 'grand-bruxelles-road-material-player-witness-v2'
              assert report['target_osm_id'] == osm_id
              assert name_fragment in report['target_name']
              assert report['source_license'] == 'ODbL-1.0'
              assert report['source_path'] == 'res://' + contract['source_document']
              assert report['source_sha256'] == contract['source_sha256']
              assert report['lookup_mode'] == 'deterministic_runtime_index'
              assert report['resolution'] == [1280, 720]
              assert report['dynamic_review_noise_hidden'] is True
              assert report['road_control_is_test_only'] is True
              assert report['camera_copied_from_legitimate_player_witness'] is True
              assert report['geometry_changed'] is False
              assert report['runtime_material_changed'] is False
              assert report['destination_advertisable'] is False
              assert report['playability_claimed'] is False
              assert report['jouable_authorized'] is False
              assert report['human_review_status'] == 'pending'
              assert isinstance(report['ground_y'], (int, float))
              metrics = report['metrics']
              assert metrics['changed_fraction'] >= 0.0015
              assert metrics['bbox_width'] >= 180
              assert metrics['bbox_height'] >= 24
              print('ROAD_MATERIAL_PLAYER_WITNESS_EVIDENCE_OK', slug, osm_id, metrics)
          PY

      - name: Bind evidence hashes
        run: |
          cd grand-bruxelles-game/artifacts/road_material_player_witness
          sha256sum \
            road_material_lemmonnier_before.png \
            road_material_lemmonnier_control.png \
            road_material_lemmonnier_player_witness.json \
            road_material_fonsny_before.png \
            road_material_fonsny_control.png \
            road_material_fonsny_player_witness.json \
            road_material_orts_before.png \
            road_material_orts_control.png \
            road_material_orts_player_witness.json \
            > evidence-sha256.txt
          test "$(wc -l < evidence-sha256.txt)" -eq 9
          sha256sum --check evidence-sha256.txt

      - name: Upload exact witness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-road-material-player-witness
          path: grand-bruxelles-game/artifacts/road_material_player_witness
          if-no-files-found: error
