name: Grand Bruxelles Road Registered Cell Crosswalk

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/city_machine/road_cell_coverage_candidates.json'
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json'
      - 'grand-bruxelles-game/tools/qa/build_road_registered_cell_crosswalk.py'
      - 'grand-bruxelles-game/tools/qa/test_build_road_registered_cell_crosswalk.py'
      - '.github/workflows/grand-bruxelles-road-registered-cell-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-cell-crosswalk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" HEAD || {
            echo "RED: road-cell crosswalk candidate does not contain live main" >&2
            exit 1
          }
          echo "ROAD_CELL_CROSSWALK_LIVE_MAIN_OK live=$LIVE_MAIN_SHA candidate=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run road-cell crosswalk regressions
        working-directory: grand-bruxelles-game/tools/qa
        run: python test_build_road_registered_cell_crosswalk.py
      - name: Regenerate deterministic crosswalk
        run: |
          python grand-bruxelles-game/tools/qa/build_road_registered_cell_crosswalk.py \
            --coverage grand-bruxelles-game/data/city_machine/road_cell_coverage_candidates.json \
            --cells grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json \
            --road-index grand-bruxelles-game/data/runtime/road_destination_runtime_index.json \
            --output /tmp/brussels_road_registered_cell_crosswalk.json
      - name: Upload regenerated crosswalk before lock decision
        uses: actions/upload-artifact@v4
        with:
          name: brussels-road-registered-cell-crosswalk-candidate
          path: /tmp/brussels_road_registered_cell_crosswalk.json
          if-no-files-found: error
          compression-level: 0
      - name: Require exact persisted semantic lock
        env:
          PERSISTED: grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json
          CANDIDATE: /tmp/brussels_road_registered_cell_crosswalk.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def semantic_digest(payload):
              basis = dict(payload)
              embedded = basis.pop("semantic_sha256", None)
              digest = hashlib.sha256(
                  json.dumps(basis, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest()
              if embedded != digest:
                  raise SystemExit(
                      f"RED: embedded road-cell semantic digest does not match full canonical payload: {embedded} != {digest}"
                  )
              return digest

          persisted_path = Path(os.environ["PERSISTED"])
          candidate_path = Path(os.environ["CANDIDATE"])
          persisted_bytes = persisted_path.read_bytes()
          candidate_bytes = candidate_path.read_bytes()
          persisted = json.loads(persisted_bytes)
          candidate = json.loads(candidate_bytes)

          persisted_semantic = semantic_digest(persisted)
          candidate_semantic = semantic_digest(candidate)
          if persisted_semantic != candidate_semantic:
              raise SystemExit(
                  f"RED: persisted/candidate road-cell semantic drift: {persisted_semantic} != {candidate_semantic}"
              )

          print(
              "ROAD_CELL_CROSSWALK_LOCK_SEMANTIC_EXACT "
              f"semantic_sha256={persisted_semantic} "
              f"persisted_raw_sha256={hashlib.sha256(persisted_bytes).hexdigest()} "
              f"candidate_raw_sha256={hashlib.sha256(candidate_bytes).hexdigest()}"
          )
          PY
      - name: Validate existing handshake fail-closed rails
        working-directory: grand-bruxelles-game/tools/qa
        run: |
          python road_registered_cell_handshake.py \
            --road-index ../../data/runtime/road_destination_runtime_index.json \
            --cell-index ../../data/provenance/brussels_registered_cell_manifest_index.json \
            --crosswalk ../../data/provenance/brussels_road_registered_cell_crosswalk.json
