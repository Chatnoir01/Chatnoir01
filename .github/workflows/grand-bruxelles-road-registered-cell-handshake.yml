name: Grand Bruxelles Road Registered Cell Handshake

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json'
      - 'grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json'
      - 'grand-bruxelles-game/tools/qa/road_registered_cell_handshake.py'
      - 'grand-bruxelles-game/tools/qa/test_road_registered_cell_handshake.py'
      - '.github/workflows/grand-bruxelles-road-registered-cell-handshake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handshake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact live-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LIVE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$LIVE_MAIN_SHA" "$CANDIDATE_SHA" || {
            echo "RED: road-cell handshake candidate does not contain live main" >&2
            exit 1
          }
          echo "ROAD_CELL_HANDSHAKE_LIVE_MAIN_OK live=$LIVE_MAIN_SHA candidate=$CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed regressions
        working-directory: grand-bruxelles-game/tools/qa
        run: python test_road_registered_cell_handshake.py
      - name: Validate HOLD or explicit evidence-only crosswalk
        run: |
          set -euo pipefail
          CROSSWALK=grand-bruxelles-game/data/provenance/brussels_road_registered_cell_crosswalk.json
          if [ ! -e "$CROSSWALK" ]; then
            echo "ROAD_CELL_HANDSHAKE_HOLD_OK explicit_crosswalk=absent runtime_mount=false rendered_geometry=false collision=false safe_spawn=false jouable=false"
            exit 0
          fi
          python grand-bruxelles-game/tools/qa/road_registered_cell_handshake.py \
            --road-index grand-bruxelles-game/data/runtime/road_destination_runtime_index.json \
            --cell-index grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json \
            --crosswalk "$CROSSWALK"
          echo "ROAD_CELL_HANDSHAKE_EVIDENCE_ONLY_OK explicit_crosswalk=present runtime_mount=false rendered_geometry=false collision=false safe_spawn=false jouable=false"
