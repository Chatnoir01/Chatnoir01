name: Grand Bruxelles Road Runtime Index Transactional Load

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_transactional_load_contract.py"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_source_digest_registration_contract.py"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_verified_digest_staging_contract.py"
      - ".github/workflows/grand-bruxelles-road-runtime-index-transactional-load.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transactional-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main ancestry and checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$EXPECTED_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "expected_head=$EXPECTED_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Require atomic runtime-index registration and verified source bytes
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import runpy
          from pathlib import Path

          def load(name: str, path: Path):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(f"cannot load {path}")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          transactional_path = Path("tests/test_automatic_road_runtime_index_transactional_load_contract.py")
          transactional = load("transactional_load", transactional_path)
          transactional.test_runtime_index_registration_is_transactional_until_full_validation()
          print(f"PASS {transactional_path}:test_runtime_index_registration_is_transactional_until_full_validation")

          digest_path = Path("tests/test_automatic_road_runtime_index_source_digest_registration_contract.py")
          digest = load("source_digest_registration", digest_path)
          digest.test_runtime_index_locked_source_bytes_match_declared_sha256()
          print(f"PASS {digest_path}:test_runtime_index_locked_source_bytes_match_declared_sha256")
          digest.test_runtime_index_verifies_source_bytes_before_registration()
          print(f"PASS {digest_path}:test_runtime_index_verifies_source_bytes_before_registration")
          digest.test_per_road_lookup_keeps_defense_in_depth_digest_check()
          print(f"PASS {digest_path}:test_per_road_lookup_keeps_defense_in_depth_digest_check")

          staging_path = Path("tests/test_automatic_road_runtime_index_verified_digest_staging_contract.py")
          runpy.run_path(str(staging_path), run_name="__main__")
          print(f"PASS {staging_path}:verified digest staging before road intake")
          PY
