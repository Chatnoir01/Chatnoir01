name: Grand Bruxelles Road Runtime Index Typed Authority

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_typed_authority_contract.py"
      - ".github/workflows/grand-bruxelles-road-runtime-index-typed-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact current main ancestry and checked-out head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main
          live_main="$(git rev-parse origin/main)"
          merge_base="$(git merge-base "$EXPECTED_HEAD_SHA" origin/main)"
          echo "live_main=$live_main"
          echo "expected_head=$EXPECTED_HEAD_SHA"
          echo "merge_base=$merge_base"
          test "$merge_base" = "$live_main"
      - name: Run typed authority regression
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("tests/test_automatic_road_runtime_index_typed_authority_contract.py")
          spec = importlib.util.spec_from_file_location("typed_authority", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"cannot load {path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_runtime_index_authority_is_typed_and_fail_closed_before_documents()
          print(f"PASS {path}:test_runtime_index_authority_is_typed_and_fail_closed_before_documents")
          PY