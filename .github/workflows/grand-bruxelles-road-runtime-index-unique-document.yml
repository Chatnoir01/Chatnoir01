name: Grand Bruxelles Road Runtime Index Unique Document

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_unique_document_contract.py"
      - "grand-bruxelles-game/tests/test_automatic_road_runtime_index_duplicate_guard_order.py"
      - ".github/workflows/grand-bruxelles-road-runtime-index-unique-document.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unique-document-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head and PR base ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha }}"
          expected_base="${{ github.event.pull_request.base.sha }}"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head"
          git cat-file -e "${expected_base}^{commit}"
          actual_merge_base="$(git merge-base "$expected_head" "$expected_base")"
          test "$actual_merge_base" = "$expected_base"
      - name: Verify checked-out dispatch head
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Run unique source-document descriptor regression
        working-directory: grand-bruxelles-game
        run: python -m pytest -q tests/test_automatic_road_runtime_index_unique_document_contract.py tests/test_automatic_road_runtime_index_duplicate_guard_order.py
