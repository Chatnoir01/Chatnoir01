name: Grand Bruxelles Road Source Geometry Index

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/build_road_source_geometry_index.py"
      - "grand-bruxelles-game/tools/build_road_destination_catalog.py"
      - "grand-bruxelles-game/data/osm/**"
      - "grand-bruxelles-game/tests/test_road_source_geometry_index_authorization_contract.py"
      - ".github/workflows/grand-bruxelles-road-source-geometry-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-index-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact head and PR base ancestry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha }}"
          expected_base="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "${expected_base}^{commit}"
          test "$(git merge-base "$expected_head" "$expected_base")" = "$expected_base"
      - name: Verify checked-out dispatch head
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run locked geometry-index authorization contract
        working-directory: grand-bruxelles-game
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/test_road_source_geometry_index_authorization_contract.py")
          spec = importlib.util.spec_from_file_location("geometry_index_contract", path)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"cannot load {path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in (
              "test_geometry_index_is_lookup_only_and_cannot_self_promote",
              "test_geometry_index_payload_preserves_closed_authorization_rails",
          ):
              getattr(module, name)()
              print(f"PASS {path}:{name}")
          PY
