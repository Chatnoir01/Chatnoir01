name: Grand Bruxelles Rogue Native Crossbow Witness

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-rogue-native-crossbow-witness.yml"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_rogue_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_touch_rogue_runtime.gd"
      - "grand-bruxelles-game/game/tests/rogue_native_crossbow_player_witness_test.gd"
      - "grand-bruxelles-game/game/tests/rogue_native_crossbow_visual_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rogue-native-crossbow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-loadout:
    runs-on: ubuntu-slim
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euxo pipefail
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            curl unzip xvfb xauth \
            libgl1 libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxinerama1 libxrender1 libxfixes3 \
            libasound2t64 libfontconfig1
          command -v Xvfb
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/rogue-crossbow-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/rogue-crossbow-import.log; then exit 1; fi
      - name: Run native loadout contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/rogue_native_crossbow_player_witness_test.gd 2>&1 | tee /tmp/rogue-crossbow-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|ROGUE_NATIVE_CROSSBOW_WITNESS_FAIL" /tmp/rogue-crossbow-contract.log; then exit 1; fi
          grep -F "ROGUE_NATIVE_CROSSBOW_WITNESS_OK" /tmp/rogue-crossbow-contract.log
      - name: Capture player-view loadout proof
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/rogue_native_crossbow_visual_witness_test.gd \
            2>&1 | tee /tmp/rogue-crossbow-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|ROGUE_NATIVE_CROSSBOW_VISUAL_FAIL" /tmp/rogue-crossbow-visual.log; then exit 1; fi
          grep -F "ROGUE_NATIVE_CROSSBOW_VISUAL_OK" /tmp/rogue-crossbow-visual.log
          test -s grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/unarmed.png
          test -s grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/crossbow.png
          test -s grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/bx9.png
          cp /tmp/rogue-crossbow-import.log grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/import.log
          cp /tmp/rogue-crossbow-contract.log grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/contract.log
          cp /tmp/rogue-crossbow-visual.log grand-bruxelles-game/artifacts/qa/rogue_native_crossbow/visual.log
      - name: Upload Rogue native crossbow evidence
        uses: actions/upload-artifact@v4
        with:
          name: rogue-native-crossbow-player-witness
          path: grand-bruxelles-game/artifacts/qa/rogue_native_crossbow
          if-no-files-found: error
