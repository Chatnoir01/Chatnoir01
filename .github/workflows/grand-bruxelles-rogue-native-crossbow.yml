name: Grand Bruxelles Rogue Native Crossbow

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-rogue-native-crossbow.yml"
      - "grand-bruxelles-game/game/scripts/player_combat_arsenal_rogue_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_combat_touch_rogue_runtime.gd"
      - "grand-bruxelles-game/game/tests/rogue_native_crossbow_player_witness_test.gd"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rogue-native-crossbow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  player-witness:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot.app/Contents/MacOS/Godot
      - name: Import and parse project
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/rogue-crossbow-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/rogue-crossbow-import.log; then exit 1; fi
      - name: Run native crossbow true-player witness
        run: |
          set -o pipefail
          /tmp/godot/Godot.app/Contents/MacOS/Godot --headless --path grand-bruxelles-game --script res://game/tests/rogue_native_crossbow_player_witness_test.gd 2>&1 | tee /tmp/rogue-crossbow.log
          if grep -E "SCRIPT ERROR|Parse Error:|ROGUE_NATIVE_CROSSBOW_WITNESS_FAIL" /tmp/rogue-crossbow.log; then exit 1; fi
          grep -F "ROGUE_NATIVE_CROSSBOW_WITNESS_OK" /tmp/rogue-crossbow.log
