name: Grand Bruxelles Runtime Bootstrap

on:
  push:
    branches:
      - "infra/runtime-bootstrap-*"
    paths:
      - ".github/workflows/grand-bruxelles-runtime-bootstrap.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/grand_brussels_runtime_bootstrap.gd"
      - "grand-bruxelles-game/game/tests/grand_brussels_runtime_bootstrap_test.gd"
      - "grand-bruxelles-game/data/runtime/runtime_registry.json"
      - "grand-bruxelles-game/data/runtime/modules/**"
      - "grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-runtime-bootstrap.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/grand_brussels_runtime_bootstrap.gd"
      - "grand-bruxelles-game/game/tests/grand_brussels_runtime_bootstrap_test.gd"
      - "grand-bruxelles-game/data/runtime/runtime_registry.json"
      - "grand-bruxelles-game/data/runtime/modules/**"
      - "grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime registry contract
        run: python3 grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py

  godot:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/bootstrap-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/bootstrap-import.log; then exit 1; fi
      - name: Validate bootstrap root loading
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_brussels_runtime_bootstrap_test.gd 2>&1 | tee /tmp/bootstrap-test.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_BRUSSELS_RUNTIME_BOOTSTRAP_FAIL" /tmp/bootstrap-test.log; then exit 1; fi
          grep -q "GRAND_BRUSSELS_RUNTIME_BOOTSTRAP_OK" /tmp/bootstrap-test.log
