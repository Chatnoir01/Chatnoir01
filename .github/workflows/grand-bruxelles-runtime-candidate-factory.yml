name: Grand Bruxelles Runtime Candidate Factory

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/**"
      - ".github/workflows/grand-bruxelles-runtime-candidate-factory.yml"
  workflow_run:
    workflows: ["Grand Bruxelles Autonomous CityGen"]
    types: [completed]
  workflow_dispatch:
    inputs:
      upgrade_batch:
        description: "Maximum legacy source cells to enrich with all five UrbIS base-city layers"
        required: false
        default: "8"
      compile_batch:
        description: "Maximum complete source cells to compile or refresh into runtime candidates"
        required: false
        default: "16"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove source and runtime-candidate factory regressions
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_materialize_urbis_source_cell.py
          python3 grand-bruxelles-game/tools/citygen/test_build_runtime_candidate_bundle.py
          python3 grand-bruxelles-game/tools/citygen/test_seal_runtime_candidate_bundle.py

  factory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Only the state-branch writer needs the shared lock. PR validation must not
    # be cancelled merely because Autonomous CityGen or readiness is persisting.
    concurrency:
      group: grand-bruxelles-autonomous-citygen
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover durable CityGen caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runtime-factory-prev
          mkdir -p /tmp/runtime-factory-prev
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          if git cat-file -e "origin/citygen-autonomous-state:grand-bruxelles-game/data/qa" 2>/dev/null; then
            git archive origin/citygen-autonomous-state grand-bruxelles-game/data/qa | tar -x -C /tmp/runtime-factory-prev
          fi
          rm -rf grand-bruxelles-game/data/qa/autonomous_sources grand-bruxelles-game/data/qa/autonomous_candidates
          mkdir -p grand-bruxelles-game/data/qa/autonomous_sources grand-bruxelles-game/data/qa/autonomous_candidates/runtime
          cp -a /tmp/runtime-factory-prev/grand-bruxelles-game/data/qa/autonomous_sources/. grand-bruxelles-game/data/qa/autonomous_sources/ 2>/dev/null || true
          cp -a /tmp/runtime-factory-prev/grand-bruxelles-game/data/qa/autonomous_candidates/. grand-bruxelles-game/data/qa/autonomous_candidates/ 2>/dev/null || true

      - name: Plan legacy source enrichment
        env:
          INPUT_UPGRADE_BATCH: ${{ inputs.upgrade_batch }}
        run: |
          set -euo pipefail
          UPGRADE_BATCH="${INPUT_UPGRADE_BATCH:-8}"
          python3 - "$UPGRADE_BATCH" <<'PY'
          import json, sys
          from pathlib import Path

          root=Path('grand-bruxelles-game/data/qa/autonomous_sources')
          required={
              'buildings':'raw/buildings.geojson',
              'street_surfaces':'raw/street_surfaces.geojson',
              'street_axes':'raw/street_axes.geojson',
              'tram_network':'raw/tram_network.geojson',
              'train_network':'raw/train_network.geojson',
          }
          limit=int(sys.argv[1])
          if limit < 1 or limit > 32:
              raise SystemExit('upgrade_batch must be between 1 and 32')
          rows=[]
          for cell in sorted(p for p in root.iterdir() if p.is_dir()) if root.exists() else []:
              manifest_path=cell/'manifest.json'
              if not manifest_path.is_file():
                  continue
              try:
                  manifest=json.loads(manifest_path.read_text())
              except Exception:
                  continue
              bbox=manifest.get('bbox')
              if not isinstance(bbox,list) or len(bbox)!=4:
                  continue
              layers=manifest.get('layers') if isinstance(manifest.get('layers'),dict) else {}
              missing=[]
              for logical,relative in required.items():
                  spec=layers.get(logical)
                  if not isinstance(spec,dict) or spec.get('file')!=relative or not (cell/relative).is_file():
                      missing.append(logical)
              if missing:
                  rows.append((cell.name,bbox,missing))
          selected=rows[:limit]
          work=Path('/tmp/runtime-factory-upgrade.tsv')
          work.write_text(''.join(f"{cell}\t{','.join(str(v) for v in bbox)}\t{','.join(missing)}\n" for cell,bbox,missing in selected))
          report={'legacy_incomplete_cells':len(rows),'selected_upgrade_cells':[r[0] for r in selected]}
          Path('/tmp/runtime-factory-upgrade-plan.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(f"RUNTIME_FACTORY_UPGRADE_PLAN incomplete={len(rows)} selected={len(selected)}")
          PY

      - name: Enrich selected source cells from official UrbIS
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/runtime-factory-upgrade-logs
          : > /tmp/runtime-factory-upgrade-success.txt
          : > /tmp/runtime-factory-upgrade-failed.txt
          while IFS=$'\t' read -r CELL BBOX MISSING; do
            [ -n "$CELL" ] || continue
            LOG="/tmp/runtime-factory-upgrade-logs/${CELL}.log"
            if python3 grand-bruxelles-game/tools/citygen/materialize_urbis_source_cell.py \
              --cell-id "$CELL" \
              --bbox "$BBOX" \
              --output-dir "grand-bruxelles-game/data/qa/autonomous_sources/${CELL}" >"$LOG" 2>&1; then
              echo "$CELL" >> /tmp/runtime-factory-upgrade-success.txt
              cat "$LOG"
            else
              echo "$CELL" >> /tmp/runtime-factory-upgrade-failed.txt
              echo "RUNTIME_FACTORY_SOURCE_ENRICHMENT_PENDING cell=${CELL} missing=${MISSING}"
              cat "$LOG"
            fi
          done < /tmp/runtime-factory-upgrade.tsv

      - name: Plan stale or missing runtime candidates
        env:
          INPUT_COMPILE_BATCH: ${{ inputs.compile_batch }}
        run: |
          set -euo pipefail
          COMPILE_BATCH="${INPUT_COMPILE_BATCH:-16}"
          python3 - "$COMPILE_BATCH" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          sources=Path('grand-bruxelles-game/data/qa/autonomous_sources')
          candidates=Path('grand-bruxelles-game/data/qa/autonomous_candidates/runtime')
          required=[
              ('buildings','raw/buildings.geojson'),
              ('street_surfaces','raw/street_surfaces.geojson'),
              ('street_axes','raw/street_axes.geojson'),
              ('tram_network','raw/tram_network.geojson'),
              ('train_network','raw/train_network.geojson'),
          ]
          limit=int(sys.argv[1])
          if limit < 1 or limit > 64:
              raise SystemExit('compile_batch must be between 1 and 64')

          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
              return h.hexdigest()

          complete=[]; stale=[]
          for cell in sorted(p for p in sources.iterdir() if p.is_dir()) if sources.exists() else []:
              manifest_path=cell/'manifest.json'
              if not manifest_path.is_file():
                  continue
              try:
                  manifest=json.loads(manifest_path.read_text())
              except Exception:
                  continue
              layers=manifest.get('layers') if isinstance(manifest.get('layers'),dict) else {}
              ok=True
              input_paths={'manifest.json':manifest_path}
              for logical,relative in required:
                  spec=layers.get(logical)
                  path=cell/relative
                  if not isinstance(spec,dict) or spec.get('file')!=relative or not path.is_file():
                      ok=False; break
                  input_paths[relative]=path
              if not ok:
                  continue
              complete.append(cell.name)
              candidate_path=candidates/cell.name/'candidate.json'
              fresh=False
              if candidate_path.is_file():
                  try:
                      candidate=json.loads(candidate_path.read_text())
                      expected={key:sha(path) for key,path in input_paths.items()}
                      fresh=(
                          candidate.get('input_sha256')==dict(sorted(expected.items()))
                          and candidate.get('sealed',{}).get('production_discovery_eligible') is False
                      )
                  except Exception:
                      fresh=False
              if not fresh:
                  stale.append(cell.name)
          selected=stale[:limit]
          Path('/tmp/runtime-factory-compile.txt').write_text(''.join(cell+'\n' for cell in selected))
          report={
              'complete_source_cells':len(complete),
              'stale_or_missing_candidates':len(stale),
              'selected_compile_cells':selected,
          }
          Path('/tmp/runtime-factory-compile-plan.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(f"RUNTIME_FACTORY_COMPILE_PLAN complete={len(complete)} stale={len(stale)} selected={len(selected)}")
          PY

      - name: Compile and seal deterministic candidate bundles
        shell: bash
        run: |
          set -u
          CANDIDATES="grand-bruxelles-game/data/qa/autonomous_candidates/runtime"
          mkdir -p "$CANDIDATES" /tmp/runtime-factory-compile-logs /tmp/runtime-factory-build
          : > /tmp/runtime-factory-compile-success.txt
          : > /tmp/runtime-factory-compile-failed.txt
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            SRC="grand-bruxelles-game/data/qa/autonomous_sources/${CELL}"
            TMP="/tmp/runtime-factory-build/${CELL}"
            LOG="/tmp/runtime-factory-compile-logs/${CELL}.log"
            rm -rf "$TMP"
            if python3 grand-bruxelles-game/tools/citygen/build_runtime_candidate_bundle.py \
              --cell-dir "$SRC" --output-dir "$TMP" >"$LOG" 2>&1 \
              && python3 grand-bruxelles-game/tools/citygen/seal_runtime_candidate_bundle.py \
              --bundle-dir "$TMP" >>"$LOG" 2>&1; then
              rm -rf "$CANDIDATES/$CELL"
              mv "$TMP" "$CANDIDATES/$CELL"
              echo "$CELL" >> /tmp/runtime-factory-compile-success.txt
              cat "$LOG"
            else
              rm -rf "$CANDIDATES/$CELL" "$TMP"
              echo "$CELL" >> /tmp/runtime-factory-compile-failed.txt
              echo "RUNTIME_FACTORY_CANDIDATE_PENDING cell=${CELL}"
              cat "$LOG"
            fi
          done < /tmp/runtime-factory-compile.txt

      - name: Build factory report and enforce systemic-failure guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          up=json.loads(Path('/tmp/runtime-factory-upgrade-plan.json').read_text())
          cp=json.loads(Path('/tmp/runtime-factory-compile-plan.json').read_text())
          def lines(path):
              p=Path(path)
              return [x.strip() for x in p.read_text().splitlines() if x.strip()] if p.exists() else []
          report={
              **up,
              **cp,
              'upgrade_success':lines('/tmp/runtime-factory-upgrade-success.txt'),
              'upgrade_failed':lines('/tmp/runtime-factory-upgrade-failed.txt'),
              'compile_success':lines('/tmp/runtime-factory-compile-success.txt'),
              'compile_failed':lines('/tmp/runtime-factory-compile-failed.txt'),
              'policy':{
                  'production_mutation':False,
                  'candidate_sealed':True,
                  'production_discovery_eligible':False,
                  'runtime_mount_authorized':False,
                  'collision_authorized':False,
                  'building_height_invention':False,
                  'candidate_cache':'citygen-autonomous-state only',
              },
          }
          Path('/tmp/runtime-candidate-factory-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('RUNTIME_CANDIDATE_FACTORY_REPORT',json.dumps({k:len(v) if isinstance(v,list) else v for k,v in report.items() if k!='policy'},sort_keys=True))
          selected_up=len(report['selected_upgrade_cells'])
          selected_cp=len(report['selected_compile_cells'])
          if selected_up and not report['upgrade_success']:
              raise SystemExit('all selected source enrichments failed; probable systemic UrbIS/source failure')
          if selected_cp and not report['compile_success']:
              raise SystemExit('all selected runtime candidate compilations failed; probable systemic compiler/sealing failure')
          PY

      - name: Persist candidate factory state off main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/runtime-factory-save
          mkdir -p /tmp/runtime-factory-save
          cp -a grand-bruxelles-game/data/qa/autonomous_sources /tmp/runtime-factory-save/
          cp -a grand-bruxelles-game/data/qa/autonomous_candidates /tmp/runtime-factory-save/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fd
          git switch -C citygen-autonomous-state origin/main

          if [ -d /tmp/runtime-factory-prev/grand-bruxelles-game/data/qa ]; then
            mkdir -p grand-bruxelles-game/data/qa
            cp -a /tmp/runtime-factory-prev/grand-bruxelles-game/data/qa/. grand-bruxelles-game/data/qa/
          fi
          rm -rf grand-bruxelles-game/data/qa/autonomous_sources grand-bruxelles-game/data/qa/autonomous_candidates
          cp -a /tmp/runtime-factory-save/autonomous_sources grand-bruxelles-game/data/qa/
          cp -a /tmp/runtime-factory-save/autonomous_candidates grand-bruxelles-game/data/qa/
          cp /tmp/runtime-candidate-factory-report.json grand-bruxelles-game/data/qa/runtime_candidate_factory_latest_report.json

          git add -- grand-bruxelles-game/data/qa
          if git diff --cached --quiet; then
            echo "RUNTIME_CANDIDATE_FACTORY_NO_CHANGE"
            exit 0
          fi
          git commit -m "citygen: persist runtime candidate factory pass"
          git push --force-with-lease origin citygen-autonomous-state

      - name: Upload candidate factory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-candidate-factory-${{ github.run_number }}
          path: |
            /tmp/runtime-candidate-factory-report.json
            /tmp/runtime-factory-upgrade-plan.json
            /tmp/runtime-factory-compile-plan.json
            /tmp/runtime-factory-upgrade-logs/
            /tmp/runtime-factory-compile-logs/
          retention-days: 30
