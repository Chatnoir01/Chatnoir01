name: Grand Bruxelles Runtime Candidate Frontier

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/grand-bruxelles-runtime-candidate-frontier.yml"
      - "grand-bruxelles-game/tools/citygen/build_regional_runtime_candidates.py"
      - "grand-bruxelles-game/tools/citygen/test_build_regional_runtime_candidates.py"
      - "grand-bruxelles-game/tools/citygen/test_runtime_frontier_source_completeness.py"
      - "grand-bruxelles-game/tools/citygen/build_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_build_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/seal_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_seal_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/validate_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_validate_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_runtime_candidate_seal_validation_pipeline.py"
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-runtime-candidate-frontier.yml"
      - "grand-bruxelles-game/tools/citygen/build_regional_runtime_candidates.py"
      - "grand-bruxelles-game/tools/citygen/test_build_regional_runtime_candidates.py"
      - "grand-bruxelles-game/tools/citygen/test_runtime_frontier_source_completeness.py"
      - "grand-bruxelles-game/tools/citygen/build_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_build_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/seal_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_seal_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/validate_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_validate_runtime_candidate_bundle.py"
      - "grand-bruxelles-game/tools/citygen/test_runtime_candidate_seal_validation_pipeline.py"

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-runtime-candidate-frontier
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime candidate contracts
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_build_runtime_candidate_bundle.py
          python3 grand-bruxelles-game/tools/citygen/test_build_regional_runtime_candidates.py
          python3 grand-bruxelles-game/tools/citygen/test_runtime_frontier_source_completeness.py
          python3 grand-bruxelles-game/tools/citygen/test_seal_runtime_candidate_bundle.py
          python3 grand-bruxelles-game/tools/citygen/test_validate_runtime_candidate_bundle.py
          python3 grand-bruxelles-game/tools/citygen/test_runtime_candidate_seal_validation_pipeline.py

  build-frontier:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover durable regional sources and scheduler state
        run: |
          set -euo pipefail
          rm -rf /tmp/citygen-runtime-input /tmp/citygen-runtime-existing /tmp/citygen-runtime-new /tmp/citygen-runtime-out
          mkdir -p /tmp/citygen-runtime-input /tmp/citygen-runtime-existing /tmp/citygen-runtime-new /tmp/citygen-runtime-out
          : > /tmp/citygen-runtime-remote-sha
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          STATE_ROOT="grand-bruxelles-game/data/qa"
          git show "origin/citygen-autonomous-state:${STATE_ROOT}/autonomous_citygen_state.json" > /tmp/citygen-runtime-input/state.json
          git show "origin/citygen-autonomous-state:${STATE_ROOT}/brussels_regional_target_grid.json" > /tmp/citygen-runtime-input/grid.json
          git archive origin/citygen-autonomous-state "${STATE_ROOT}/autonomous_sources" | tar -x -C /tmp/citygen-runtime-input
          test -d "/tmp/citygen-runtime-input/${STATE_ROOT}/autonomous_sources"

          if git fetch origin citygen-runtime-candidates:refs/remotes/origin/citygen-runtime-candidates 2>/dev/null; then
            git rev-parse refs/remotes/origin/citygen-runtime-candidates > /tmp/citygen-runtime-remote-sha
            if git cat-file -e "origin/citygen-runtime-candidates:${STATE_ROOT}/runtime_candidates" 2>/dev/null; then
              git archive origin/citygen-runtime-candidates "${STATE_ROOT}/runtime_candidates" | tar -x -C /tmp/citygen-runtime-existing
            fi
          fi

      - name: Requeue previously blocked candidate validations
        run: |
          set -euo pipefail
          ROOT="/tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates"
          python3 - "$ROOT" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          requeued = []
          if root.is_dir():
              for bundle in sorted(path for path in root.iterdir() if path.is_dir()):
                  validation = bundle / 'validation.json'
                  if not validation.is_file():
                      continue
                  try:
                      payload = json.loads(validation.read_text(encoding='utf-8'))
                  except Exception:
                      payload = {"status": "blocked"}
                  if payload.get('status') != 'validated':
                      requeued.append(bundle.name)
                      shutil.rmtree(bundle)
          print(f'RUNTIME_CANDIDATE_REQUEUE_BLOCKED count={len(requeued)} cells={",".join(requeued)}')
          PY

      - name: Compile next municipality-balanced runtime candidate batch
        run: |
          set -euo pipefail
          EXISTING_ARGS=()
          EXISTING_ROOT="/tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates"
          if [ -d "$EXISTING_ROOT" ]; then EXISTING_ARGS=(--existing-root "$EXISTING_ROOT"); fi

          COMPILER_RC=0
          python3 grand-bruxelles-game/tools/citygen/build_regional_runtime_candidates.py \
            --source-root /tmp/citygen-runtime-input/grand-bruxelles-game/data/qa/autonomous_sources \
            --state /tmp/citygen-runtime-input/state.json \
            --target-grid /tmp/citygen-runtime-input/grid.json \
            --output-root /tmp/citygen-runtime-new \
            --report /tmp/citygen-runtime-out/runtime_candidate_frontier_report.json \
            --limit 32 \
            "${EXISTING_ARGS[@]}" || COMPILER_RC=$?
          printf '%s\n' "$COMPILER_RC" > /tmp/citygen-runtime-compiler-rc
          cat /tmp/citygen-runtime-out/runtime_candidate_frontier_report.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/citygen-runtime-out/runtime_candidate_frontier_report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          selected = int(report.get('selected_count', 0))
          built = int(report.get('built_count', 0))
          failures = int(report.get('failure_count', 0))
          if selected > 0 and built == 0:
              raise SystemExit(f'RUNTIME_CANDIDATE_FRONTIER_NO_DURABLE_PROGRESS selected={selected} failures={failures}')
          if report.get('runtime_mount_authorized') is not False:
              raise SystemExit('runtime mount authorization unexpectedly enabled')
          if report.get('jouable_promotion_authorized') is not False:
              raise SystemExit('JOUABLE promotion authorization unexpectedly enabled')
          print(f'RUNTIME_CANDIDATE_PARTIAL_PROGRESS_OK selected={selected} built={built} failures={failures}')
          PY

      - name: Seal candidate bundles as QA-only before validation
        run: |
          set -euo pipefail
          for ROOT in \
            /tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates \
            /tmp/citygen-runtime-new; do
            [ -d "$ROOT" ] || continue
            while IFS= read -r -d '' BUNDLE; do
              FORMAT="$(python3 - "$BUNDLE/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8'))
          print(payload.get('format', ''))
          PY
          )"
              case "$FORMAT" in
                grand-bruxelles-urbis-built-cell-v1)
                  python3 grand-bruxelles-game/tools/citygen/seal_runtime_candidate_bundle.py --bundle-dir "$BUNDLE"
                  ;;
                grand-bruxelles-urbis-built-cell-candidate-v1)
                  echo "RUNTIME_CANDIDATE_ALREADY_SEALED cell=$(basename "$BUNDLE")"
                  ;;
                *)
                  echo "RUNTIME_CANDIDATE_SEAL_BLOCKED cell=$(basename "$BUNDLE") format=${FORMAT}" >&2
                  exit 1
                  ;;
              esac
            done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          done

      - name: Refresh frontier digests after QA sealing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('/tmp/citygen-runtime-out/runtime_candidate_frontier_report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          new_root = Path('/tmp/citygen-runtime-new')
          refreshed = 0
          for row in report.get('built_cells', []):
              if not isinstance(row, dict):
                  continue
              cell_id = row.get('cell_id')
              candidate_path = new_root / str(cell_id) / 'candidate.json'
              if not candidate_path.is_file():
                  continue
              candidate = json.loads(candidate_path.read_text(encoding='utf-8'))
              row['candidate_digest'] = candidate.get('candidate_digest')
              refreshed += 1
          report['sealed_candidate_count'] = refreshed
          report['candidate_root_format'] = 'grand-bruxelles-urbis-built-cell-candidate-v1'
          report['runtime_mount_authorized'] = False
          report['jouable_promotion_authorized'] = False
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f'RUNTIME_CANDIDATE_SEALED_DIGESTS_OK refreshed={refreshed} production_discovery=false')
          PY

      - name: Validate candidate bundles against current durable sources
        run: |
          set -u
          : > /tmp/citygen-runtime-validation-failures.tsv
          SOURCE_ROOT="/tmp/citygen-runtime-input/grand-bruxelles-game/data/qa/autonomous_sources"
          for ROOT in \
            /tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates \
            /tmp/citygen-runtime-new; do
            [ -d "$ROOT" ] || continue
            while IFS= read -r -d '' BUNDLE; do
              CELL="$(basename "$BUNDLE")"
              SOURCE="${SOURCE_ROOT}/${CELL}"
              LOG="/tmp/citygen-runtime-out/validate-${CELL}.log"
              if python3 grand-bruxelles-game/tools/citygen/validate_runtime_candidate_bundle.py \
                --bundle-dir "$BUNDLE" \
                --source-dir "$SOURCE" \
                --output "$BUNDLE/validation.json" >"$LOG" 2>&1; then
                rm -f "$LOG"
              else
                printf '%s\t%s\n' "$CELL" "$(tail -n 1 "$LOG" | tr '\t\r\n' '   ')" >> /tmp/citygen-runtime-validation-failures.tsv
                echo "RUNTIME_CANDIDATE_VALIDATION_BLOCKED ${CELL}"
              fi
            done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          done

          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path('/tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates'),
              Path('/tmp/citygen-runtime-new'),
          ]
          rows = []
          for root in roots:
              if not root.is_dir():
                  continue
              for bundle in sorted(path for path in root.iterdir() if path.is_dir()):
                  path = bundle / 'validation.json'
                  if not path.is_file():
                      rows.append({"cell_id": bundle.name, "status": "blocked", "blockers": ["validation_evidence_missing"]})
                      continue
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  rows.append({
                      "cell_id": payload.get('cell_id', bundle.name),
                      "status": payload.get('status'),
                      "validation_digest": payload.get('validation_digest'),
                      "blockers": payload.get('blockers', []),
                      "promotion_ready": payload.get('promotion_ready'),
                  })
          validated = sum(row.get('status') == 'validated' for row in rows)
          blocked = len(rows) - validated
          report = {
              "format": "grand-bruxelles-runtime-candidate-validation-report-v1",
              "candidate_count": len(rows),
              "validated_count": validated,
              "blocked_count": blocked,
              "runtime_mount_authorized": False,
              "jouable_promotion_authorized": False,
              "candidates": rows,
          }
          Path('/tmp/citygen-runtime-out/runtime_candidate_validation_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(f'RUNTIME_CANDIDATE_VALIDATION_REPORT candidates={len(rows)} validated={validated} blocked={blocked}')
          PY

      - name: Persist candidate-only runtime bundles off main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA="$(cat /tmp/citygen-runtime-remote-sha 2>/dev/null || true)"
          git switch -C citygen-runtime-candidates
          DEST="grand-bruxelles-game/data/qa/runtime_candidates"
          mkdir -p "$DEST"
          cp -a /tmp/citygen-runtime-existing/grand-bruxelles-game/data/qa/runtime_candidates/. "$DEST/" 2>/dev/null || true
          cp -a /tmp/citygen-runtime-new/. "$DEST/" 2>/dev/null || true
          cp /tmp/citygen-runtime-out/runtime_candidate_frontier_report.json grand-bruxelles-game/data/qa/runtime_candidate_frontier_report.json
          cp /tmp/citygen-runtime-out/runtime_candidate_validation_report.json grand-bruxelles-game/data/qa/runtime_candidate_validation_report.json
          git add "$DEST" \
                  grand-bruxelles-game/data/qa/runtime_candidate_frontier_report.json \
                  grand-bruxelles-game/data/qa/runtime_candidate_validation_report.json
          if git diff --cached --quiet; then
            echo "RUNTIME_CANDIDATE_FRONTIER_NO_CHANGE"
          else
            git commit -m "citygen: persist regional runtime candidate frontier"
            if [ -n "$REMOTE_SHA" ]; then
              git push \
                --force-with-lease="refs/heads/citygen-runtime-candidates:${REMOTE_SHA}" \
                origin HEAD:refs/heads/citygen-runtime-candidates
            else
              git push origin HEAD:refs/heads/citygen-runtime-candidates
            fi
          fi

      - name: Upload runtime candidate frontier evidence
        uses: actions/upload-artifact@v4
        with:
          name: regional-runtime-candidate-frontier-${{ github.run_number }}
          path: |
            /tmp/citygen-runtime-out/
            /tmp/citygen-runtime-new/
          retention-days: 30

      - name: Surface compilation or validation failures after durable progress
        run: |
          set -euo pipefail
          COMPILER_RC="$(cat /tmp/citygen-runtime-compiler-rc 2>/dev/null || echo 1)"
          python3 - "$COMPILER_RC" <<'PY'
          import json
          import sys
          from pathlib import Path

          compiler_rc = int(sys.argv[1])
          build_report = json.loads(Path('/tmp/citygen-runtime-out/runtime_candidate_frontier_report.json').read_text(encoding='utf-8'))
          validation_report = json.loads(Path('/tmp/citygen-runtime-out/runtime_candidate_validation_report.json').read_text(encoding='utf-8'))
          failures = int(build_report.get('failure_count', 0))
          blocked = int(validation_report.get('blocked_count', 0))
          if failures or compiler_rc or blocked:
              raise SystemExit(
                  'RUNTIME_CANDIDATE_FRONTIER_PARTIAL_FAILURES '
                  f'persisted_successes=true compilation_failures={failures} compiler_rc={compiler_rc} validation_blocked={blocked}'
              )
          print('RUNTIME_CANDIDATE_FRONTIER_COMPLETE compilation_failures=0 validation_blocked=0 promotion_bypass=false')
          PY
