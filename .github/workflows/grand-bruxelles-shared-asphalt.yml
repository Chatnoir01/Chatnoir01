name: Grand Bruxelles Shared Asphalt

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_shared_asphalt_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/tests/shared_asphalt_material_ab_test.gd"
      - ".github/workflows/grand-bruxelles-shared-asphalt.yml"
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_shared_asphalt_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_hero_zone_materials.gd"
      - "grand-bruxelles-game/game/tests/shared_asphalt_material_ab_test.gd"
      - ".github/workflows/grand-bruxelles-shared-asphalt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shared-asphalt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/shared-asphalt-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/shared-asphalt-import.log; then exit 1; fi
      - name: Validate reusable authored-material contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('grand-bruxelles-game/game/scripts/brussels_shared_asphalt_runtime.gd').read_text()
          assert 'class_name BrusselsSharedAsphaltRuntime' in p
          assert 'shared_asphalt' in p
          assert 'procedural_original_asset' in p
          assert 'source_geometry_unchanged' in p
          assert 'location_specific_repairs_added' in p
          assert 'Image.create_empty' in p
          print('SHARED_ASPHALT_CONTRACT_OK')
          PY
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Render frozen same-camera A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/shared_asphalt_material_ab_test.gd 2>&1 | tee /tmp/shared-asphalt-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|SHARED_ASPHALT_AB_FAIL" /tmp/shared-asphalt-ab.log; then exit 1; fi
          grep -q "SHARED_ASPHALT_AB_OK" /tmp/shared-asphalt-ab.log
          test -f grand-bruxelles-game/artifacts/qa/shared_asphalt_material_ab/before_flat.png
          test -f grand-bruxelles-game/artifacts/qa/shared_asphalt_material_ab/after_asphalt.png
      - name: Upload asphalt A/B witness
        uses: actions/upload-artifact@v4
        with:
          name: shared-asphalt-player-ab-witness
          path: grand-bruxelles-game/artifacts/qa/shared_asphalt_material_ab/*.png
          if-no-files-found: error
