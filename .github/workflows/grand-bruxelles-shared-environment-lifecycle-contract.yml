name: Grand Bruxelles Shared Environment Lifecycle Contract

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/project.godot'
      - 'grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json'
      - 'grand-bruxelles-game/data/qa/shared_environment_visibility_ownership_contract.json'
      - 'grand-bruxelles-game/data/qa/shared_environment_owned_child_runtime_lifecycle_contract.json'
      - 'grand-bruxelles-game/game/scripts/**'
      - 'grand-bruxelles-game/game/tests/shared_environment_lifecycle_contract_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_node_added_lifecycle_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_node_removed_lifecycle_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_material_ownership_teardown_test.py'
      - 'grand-bruxelles-game/game/tests/brussels_osm_sidewalk_material_ownership_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_visibility_ownership_contract_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_visibility_lifecycle_bridge_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_owned_child_runtime_lifecycle_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_owned_child_lifecycle_bridge_test.py'
      - 'grand-bruxelles-game/game/tests/shared_environment_sidewalk_material_ownership_lifecycle_bridge_test.py'
      - '.github/workflows/grand-bruxelles-shared-environment-lifecycle-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-environment-lifecycle-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}" || {
            echo "RED: shared Environment lifecycle contract checked out stale/merge ref" >&2
            echo "actual=$(git rev-parse HEAD) expected=${{ github.event.pull_request.head.sha }}" >&2
            exit 1
          }
      - name: Validate durable shared Environment lifecycle contract
        shell: bash
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/game/tests/shared_environment_lifecycle_contract_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_node_added_lifecycle_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_node_removed_lifecycle_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_material_ownership_teardown_test.py
          python3 grand-bruxelles-game/game/tests/brussels_osm_sidewalk_material_ownership_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_visibility_ownership_contract_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_visibility_lifecycle_bridge_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_owned_child_runtime_lifecycle_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_owned_child_lifecycle_bridge_test.py
          python3 grand-bruxelles-game/game/tests/shared_environment_sidewalk_material_ownership_lifecycle_bridge_test.py
