name: Grand Bruxelles Shared Environment Node Added Lifecycle

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json'
      - 'grand-bruxelles-game/game/scripts/*.gd'
      - 'grand-bruxelles-game/game/tests/shared_environment_node_added_lifecycle_test.py'
      - '.github/workflows/grand-bruxelles-shared-environment-node-added-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Validate node-added lifecycle governance
        run: python3 grand-bruxelles-game/game/tests/shared_environment_node_added_lifecycle_test.py
