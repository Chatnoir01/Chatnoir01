name: Grand Bruxelles Shared Environment Owned Child Lifecycle

on:
  push:
    paths:
      - "grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_architectural_concrete_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/shared_environment_owned_child_runtime_lifecycle_test.py"
      - ".github/workflows/grand-bruxelles-shared-environment-owned-child-lifecycle.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/shared_environment_lifecycle_contract.json"
      - "grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd"
      - "grand-bruxelles-game/game/scripts/midi_architectural_concrete_surface_runtime.gd"
      - "grand-bruxelles-game/game/tests/shared_environment_owned_child_runtime_lifecycle_test.py"
      - ".github/workflows/grand-bruxelles-shared-environment-owned-child-lifecycle.yml"
  workflow_dispatch:

jobs:
  owned-child-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD

      - name: Validate owned child runtime lifecycle
        working-directory: grand-bruxelles-game
        run: python3 game/tests/shared_environment_owned_child_runtime_lifecycle_test.py
