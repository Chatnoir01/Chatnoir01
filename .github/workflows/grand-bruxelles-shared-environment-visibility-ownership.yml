name: Grand Bruxelles Shared Environment Visibility Ownership

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/shared_environment_visibility_ownership_contract.json'
      - 'grand-bruxelles-game/game/scripts/midi_fonsny_full_entrance_runtime.gd'
      - 'grand-bruxelles-game/game/tests/shared_environment_visibility_ownership_contract_test.py'
      - '.github/workflows/grand-bruxelles-shared-environment-visibility-ownership.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify live-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Validate visibility ownership contract
        working-directory: grand-bruxelles-game
        run: python3 game/tests/shared_environment_visibility_ownership_contract_test.py
