name: Grand Bruxelles Shared Environment Prop Teardown

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-shared-prop-teardown.yml"
      - "grand-bruxelles-game/game/scripts/brussels_bollard_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_lamp_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_corridor_tree_runtime.gd"
      - "grand-bruxelles-game/game/tests/shared_environment_prop_teardown_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-prop-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact PR head ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor origin/main HEAD
      - name: Install Godot 4.7.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Prove shared prop callbacks and owned roots stop at teardown
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/shared_environment_prop_teardown_test.gd 2>&1 | tee /tmp/teardown.log
          if grep -E "SCRIPT ERROR|Parse Error:|SHARED_ENVIRONMENT_PROP_TEARDOWN_FAIL" /tmp/teardown.log; then exit 1; fi
          grep -F "SHARED_ENVIRONMENT_PROP_TEARDOWN_OK" /tmp/teardown.log
