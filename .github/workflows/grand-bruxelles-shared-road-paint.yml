name: Grand Bruxelles Shared Road Paint

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-shared-road-paint.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/brussels_shared_road_paint_runtime.gd"
      - "grand-bruxelles-game/game/tests/shared_brussels_road_paint_witness_test.gd"
      - "grand-bruxelles-game/tests/test_shared_brussels_road_paint.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared road-paint contract
        run: python grand-bruxelles-game/tests/test_shared_brussels_road_paint.py
      - name: Install software renderer dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/shared-road-paint-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/shared-road-paint-import.log; then exit 1; fi
      - name: Prove normal-player material impact without geometry change
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/shared_brussels_road_paint_witness_test.gd 2>&1 | tee /tmp/shared-road-paint-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|SHARED_BRUSSELS_ROAD_PAINT_VISUAL_FAIL" /tmp/shared-road-paint-visual.log; then exit 1; fi
          grep -q "SHARED_BRUSSELS_ROAD_PAINT_VISUAL_OK" /tmp/shared-road-paint-visual.log
      - name: Upload road-paint A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-brussels-road-paint-ab
          path: |
            grand-bruxelles-game/artifacts/visual/shared_road_paint_before.png
            grand-bruxelles-game/artifacts/visual/shared_road_paint_after.png
            /tmp/shared-road-paint-visual.log
          if-no-files-found: warn
