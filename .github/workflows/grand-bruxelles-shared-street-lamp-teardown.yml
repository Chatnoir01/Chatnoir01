name: Grand Bruxelles Shared Street Lamp Teardown

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_street_lamp_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_street_lamp_teardown_contract_test.gd'
      - '.github/workflows/grand-bruxelles-shared-street-lamp-teardown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-street-lamp-teardown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact PR head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/street-lamp-teardown-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/street-lamp-teardown-import.log
      - name: Prove teardown ownership contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/brussels_street_lamp_teardown_contract_test.gd 2>&1 | tee /tmp/street-lamp-teardown.log
          grep -q 'BRUSSELS_STREET_LAMP_TEARDOWN_OK' /tmp/street-lamp-teardown.log
          ! grep -q 'Parent node is busy adding/removing children' /tmp/street-lamp-teardown.log
