name: Grand Bruxelles Shared Street Lamps

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-shared-street-lamps.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/data/osm/corridor_street_lamps.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_street_lamp_asset.gd"
      - "grand-bruxelles-game/game/scripts/brussels_street_lamp_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_street_lamp_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_street_lamp_witness_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  street-lamp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/shared-street-lamps-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/shared-street-lamps-import.log; then exit 1; fi
      - name: Validate source-backed shared street lamps
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_street_lamp_runtime_test.gd 2>&1 | tee /tmp/shared-street-lamps-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_STREET_LAMP_FAIL" /tmp/shared-street-lamps-runtime.log; then exit 1; fi
          grep -q "BRUSSELS_STREET_LAMP_OK" /tmp/shared-street-lamps-runtime.log
