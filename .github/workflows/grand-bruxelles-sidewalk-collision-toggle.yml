name: Grand Bruxelles Sidewalk Collision Toggle

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/anneessens_midi_sidewalk_runtime.gd'
      - 'grand-bruxelles-game/tests/shared_environment_sidewalk_collision_toggle_test.py'
      - '.github/workflows/grand-bruxelles-sidewalk-collision-toggle.yml'
  workflow_dispatch:

jobs:
  sidewalk-collision-toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail close sidewalk visibility/collision synchronization
        run: python grand-bruxelles-game/tests/shared_environment_sidewalk_collision_toggle_test.py
