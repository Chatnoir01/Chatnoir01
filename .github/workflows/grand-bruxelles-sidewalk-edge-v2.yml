name: Grand Bruxelles Shared Sidewalk Edge v2

on:
  push:
    branches:
      - "env/sidewalk-edge-registry-*"
    paths:
      - "grand-bruxelles-game/data/runtime/modules/brussels_sidewalk_edge.json"
      - "grand-bruxelles-game/game/scripts/brussels_sidewalk_edge_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_witness_test.gd"
      - "grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py"
  pull_request:
    paths:
      - "grand-bruxelles-game/data/runtime/modules/brussels_sidewalk_edge.json"
      - "grand-bruxelles-game/game/scripts/brussels_sidewalk_edge_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_witness_test.gd"
      - "grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent runtime registry
        run: python3 grand-bruxelles-game/tools/qa/validate_runtime_bootstrap.py
      - name: Validate sidewalk edge source contract
        run: python3 grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py

  visual:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/sidewalk-v2-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/sidewalk-v2-import.log; then exit 1; fi
      - name: Validate runtime geometry invariants
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_sidewalk_edge_runtime_test.gd 2>&1 | tee /tmp/sidewalk-v2-runtime.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_EDGE_RUNTIME_FAIL" /tmp/sidewalk-v2-runtime.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_EDGE_RUNTIME_OK" /tmp/sidewalk-v2-runtime.log
      - name: 1280x720 normal-player sidewalk edge A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_sidewalk_edge_witness_test.gd 2>&1 | tee /tmp/sidewalk-v2-witness.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_EDGE_VISUAL_FAIL" /tmp/sidewalk-v2-witness.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_EDGE_VISUAL_OK" /tmp/sidewalk-v2-witness.log
      - name: Upload sidewalk edge evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-sidewalk-edge-v2-ab
          path: |
            grand-bruxelles-game/artifacts/visual/sidewalk_edge_before.png
            grand-bruxelles-game/artifacts/visual/sidewalk_edge_after.png
          if-no-files-found: error
