name: Grand Bruxelles Shared Sidewalk Edge

on:
  push:
    branches:
      - "env/sidewalk-edge-*"
    paths:
      - ".github/workflows/grand-bruxelles-sidewalk-edge.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_sidewalk_surface_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_sidewalk_edge_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_witness_test.gd"
      - "grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-sidewalk-edge.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/osm_city_builder.gd"
      - "grand-bruxelles-game/game/scripts/brussels_osm_sidewalk_surface_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_sidewalk_edge_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_sidewalk_edge_witness_test.gd"
      - "grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sidewalk-edge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed shared sidewalk edge contract
        run: python3 grand-bruxelles-game/tools/qa/validate_sidewalk_edge_runtime.py

  sidewalk-edge-visual:
    needs: sidewalk-edge-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ success() && hashFiles('grand-bruxelles-game/game/scripts/brussels_sidewalk_edge_runtime.gd') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/sidewalk-edge-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/sidewalk-edge-import.log; then exit 1; fi
      - name: Validate runtime geometry invariants
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_sidewalk_edge_runtime_test.gd 2>&1 | tee /tmp/sidewalk-edge-runtime.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_EDGE_RUNTIME_FAIL" /tmp/sidewalk-edge-runtime.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_EDGE_RUNTIME_OK" /tmp/sidewalk-edge-runtime.log
      - name: 1280x720 normal-player sidewalk edge A/B
        shell: bash
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_sidewalk_edge_witness_test.gd 2>&1 | tee /tmp/sidewalk-edge-witness.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_EDGE_VISUAL_FAIL" /tmp/sidewalk-edge-witness.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_EDGE_VISUAL_OK" /tmp/sidewalk-edge-witness.log
      - name: Upload sidewalk edge evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-sidewalk-edge-ab
          path: |
            grand-bruxelles-game/artifacts/visual/sidewalk_edge_before.png
            grand-bruxelles-game/artifacts/visual/sidewalk_edge_after.png
          if-no-files-found: error

  publish-locator:
    needs: [sidewalk-edge-contract, sidewalk-edge-visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish isolated witness run locator
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          CONTRACT_RESULT: ${{ needs.sidewalk-edge-contract.result }}
          VISUAL_RESULT: ${{ needs.sidewalk-edge-visual.result }}
        run: |
          BODY=$(printf 'SIDEWALK_EDGE_ISOLATED_RUN\nrun_id=%s\nhead_sha=%s\ncontract=%s\nvisual=%s\nartifact=brussels-sidewalk-edge-ab' "$RUN_ID" "$HEAD_SHA" "$CONTRACT_RESULT" "$VISUAL_RESULT")
          gh pr comment 800 --repo "$REPOSITORY" --body "$BODY"
