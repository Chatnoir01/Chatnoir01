name: Grand Bruxelles Sidewalk Paving Rhythm

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/brussels_osm_sidewalk_surface_material.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_sidewalk_paving_rhythm_test.gd"
      - "grand-bruxelles-game/game/tests/brussels_osm_sidewalk_paving_rhythm_witness_test.gd"
      - ".github/workflows/grand-bruxelles-sidewalk-paving-rhythm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidewalk-paving-rhythm:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/sidewalk-paving-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/sidewalk-paving-import.log; then exit 1; fi
      - name: Validate authored paving rhythm contract
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_osm_sidewalk_paving_rhythm_test.gd 2>&1 | tee /tmp/sidewalk-paving-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_PAVING_RHYTHM_FAIL" /tmp/sidewalk-paving-contract.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_PAVING_RHYTHM_OK" /tmp/sidewalk-paving-contract.log
      - name: 1280x720 normal-player paving-rhythm A/B
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_osm_sidewalk_paving_rhythm_witness_test.gd 2>&1 | tee /tmp/sidewalk-paving-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_SIDEWALK_PAVING_RHYTHM_VISUAL_FAIL" /tmp/sidewalk-paving-witness.log; then exit 1; fi
          grep -q "BRUSSELS_SIDEWALK_PAVING_RHYTHM_VISUAL_OK" /tmp/sidewalk-paving-witness.log
      - name: Upload paving-rhythm evidence
        uses: actions/upload-artifact@v4
        with:
          name: brussels-sidewalk-paving-rhythm-ab
          path: |
            grand-bruxelles-game/artifacts/visual/sidewalk_paving_rhythm_before.png
            grand-bruxelles-game/artifacts/visual/sidewalk_paving_rhythm_after.png
          if-no-files-found: error
