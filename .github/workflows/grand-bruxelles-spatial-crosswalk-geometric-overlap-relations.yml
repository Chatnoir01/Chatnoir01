name: Grand Bruxelles Spatial Crosswalk Geometric Overlap Relations

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-spatial-crosswalk-geometric-overlap-relations.yml"
      - "grand-bruxelles-game/data/source_plans/brussels_spatial_crosswalk_geometric_overlap_relations.lock.json"
      - "grand-bruxelles-game/data/source_plans/brussels_spatial_crosswalk_origin_artifact_payload.lock.json"
      - "grand-bruxelles-game/data/osm/vertical_slice_01.game.json"
      - "grand-bruxelles-game/data/runtime/road_destination_runtime_index.json"
      - "grand-bruxelles-game/data/provenance/brussels_registered_cell_manifest_index.json"
      - "grand-bruxelles-game/data/cell_manifests/*.json"
      - "grand-bruxelles-game/tools/city_machine/validate_registered_cell_manifest_index_identity.py"
      - "grand-bruxelles-game/tools/city_machine/validate_spatial_crosswalk_geometric_overlap_relations.py"
      - "grand-bruxelles-game/tests/test_spatial_crosswalk_geometric_overlap_relations.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometric-overlap-relations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact-current-main base and exact head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
            test "$HEAD_SHA" = "$PR_HEAD_SHA"
          else
            PR_BASE_SHA="$(git merge-base HEAD origin/main)"
          fi
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$MAIN_SHA" = "$PR_BASE_SHA"
          test "$(git merge-base "$HEAD_SHA" "$MAIN_SHA")" = "$MAIN_SHA"
      - name: Validate exact registered-cell provenance identity
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          python3 tools/city_machine/validate_registered_cell_manifest_index_identity.py
      - name: Validate exact geometric road-cell relation evidence
        working-directory: grand-bruxelles-game
        run: |
          set -euo pipefail
          python3 tools/city_machine/validate_spatial_crosswalk_geometric_overlap_relations.py
          python3 tests/test_spatial_crosswalk_geometric_overlap_relations.py
