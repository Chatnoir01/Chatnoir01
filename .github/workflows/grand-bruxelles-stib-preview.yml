name: Grand Bruxelles STIB Preview

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/inspect_stib_open_data.py"
      - "grand-bruxelles-game/tools/fetch_stib_*"
      - "grand-bruxelles-game/tools/convert_stib_gtfs.py"
      - "grand-bruxelles-game/tools/test_stib_gtfs_converter.py"
      - "grand-bruxelles-game/data/stib/**"
      - ".github/workflows/grand-bruxelles-stib-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-stib-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate STIB tools
        run: |
          python3 -m py_compile \
            grand-bruxelles-game/tools/inspect_stib_open_data.py \
            grand-bruxelles-game/tools/fetch_stib_gtfs.py \
            grand-bruxelles-game/tools/convert_stib_gtfs.py \
            grand-bruxelles-game/tools/test_stib_gtfs_converter.py

      - name: Validate current public STIB GTFS endpoint
        run: python3 grand-bruxelles-game/tools/inspect_stib_open_data.py

      - name: Validate GTFS converter with synthetic feed
        run: python3 grand-bruxelles-game/tools/test_stib_gtfs_converter.py

      - name: Fetch and convert current official STIB GTFS
        run: |
          python3 grand-bruxelles-game/tools/fetch_stib_gtfs.py /tmp/stib-gtfs.zip
          python3 grand-bruxelles-game/tools/convert_stib_gtfs.py \
            /tmp/stib-gtfs.zip /tmp/stib-corridor.game.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/stib-corridor.game.json', encoding='utf-8'))
          assert data['format'] == 'grand-bruxelles-stib-gtfs-v1'
          assert data['license'] == 'CC-BY-4.0'
          assert data['stats']['routes'] > 0, data['stats']
          assert data['stats']['shapes'] > 0, data['stats']
          print('STIB_OFFICIAL_PREVIEW_OK:', data['stats'])
          print('STIB_ROUTES:', [(r['mode'], r['short_name']) for r in data['routes']])
          PY

      - name: Upload official STIB preview
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-stib-official-preview
          path: /tmp/stib-corridor.game.json
          if-no-files-found: error
