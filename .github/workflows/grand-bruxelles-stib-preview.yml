name: Grand Bruxelles STIB Preview

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/inspect_stib_open_data.py"
      - "grand-bruxelles-game/tools/fetch_stib_*"
      - "grand-bruxelles-game/tools/convert_stib_gtfs.py"
      - "grand-bruxelles-game/tools/test_stib_gtfs_converter.py"
      - "grand-bruxelles-game/data/stib/**"
      - ".github/workflows/grand-bruxelles-stib-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stib-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate STIB tools
        run: |
          python3 -m py_compile \
            grand-bruxelles-game/tools/inspect_stib_open_data.py \
            grand-bruxelles-game/tools/fetch_stib_gtfs.py \
            grand-bruxelles-game/tools/convert_stib_gtfs.py \
            grand-bruxelles-game/tools/test_stib_gtfs_converter.py

      - name: Validate GTFS converter and freshness gate
        run: python3 grand-bruxelles-game/tools/test_stib_gtfs_converter.py

      - name: Probe verified STIB producer source
        id: remote_probe
        continue-on-error: true
        run: python3 grand-bruxelles-game/tools/inspect_stib_open_data.py

      - name: Fetch and convert official STIB preview when source is reachable
        if: steps.remote_probe.outcome == 'success'
        id: remote_fetch
        continue-on-error: true
        run: |
          python3 grand-bruxelles-game/tools/fetch_stib_gtfs.py /tmp/stib-gtfs.zip
          python3 grand-bruxelles-game/tools/convert_stib_gtfs.py \
            /tmp/stib-gtfs.zip /tmp/stib-corridor.game.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/stib-corridor.game.json', encoding='utf-8'))
          assert data['format'] == 'grand-bruxelles-stib-gtfs-v1'
          assert data['stats']['routes'] > 0, data['stats']
          assert data['stats']['shapes'] > 0, data['stats']
          print('STIB_OFFICIAL_PREVIEW_OK:', data['stats'])
          print('STIB_FRESHNESS:', data['freshness'])
          print('STIB_ROUTES:', [(r['mode'], r['short_name']) for r in data['routes']])
          if data['freshness']['runtime_current_eligible']:
              print('STIB_RUNTIME_CURRENT_ELIGIBLE: yes')
          else:
              print('STIB_RUNTIME_CURRENT_ELIGIBLE: no — preview only; current runtime activation blocked')
          PY

      - name: Report external source state
        if: always()
        run: |
          if [ "${{ steps.remote_probe.outcome }}" != "success" ]; then
            echo "STIB_REMOTE_SOURCE_ADVISORY: official producer URL is currently unavailable; converter and freshness gate remain green; no STIB runtime data is activated."
          elif [ "${{ steps.remote_fetch.outcome }}" = "failure" ]; then
            echo "STIB_REMOTE_SOURCE_ADVISORY: source responded but preview conversion/download failed; no runtime activation."
          else
            echo "STIB_REMOTE_SOURCE_OK"
          fi

      - name: Upload official STIB preview
        if: steps.remote_fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-stib-official-preview
          path: /tmp/stib-corridor.game.json
          if-no-files-found: error
