name: Grand Bruxelles STIB Suede Runtime Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-stib-suede-runtime-visual.yml"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/stib_suede_runtime.gd"
      - "grand-bruxelles-game/game/tests/stib_suede_runtime_test.gd"
      - "grand-bruxelles-game/game/tests/stib_suede_runtime_witness_test.gd"
      - "grand-bruxelles-game/data/provenance/stib_suede_runtime.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stib-suede-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate sourced runtime contract
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/stib_suede_runtime_test.gd 2>&1 | tee /tmp/stib-suede-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|STIB_SUEDE_RUNTIME_FAIL" /tmp/stib-suede-runtime.log; then exit 1; fi
          grep -F "STIB_SUEDE_RUNTIME_OK" /tmp/stib-suede-runtime.log
      - name: Capture deterministic production witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/stib_suede_runtime_witness_test.gd 2>&1 | tee /tmp/stib-suede-runtime-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|STIB_SUEDE_RUNTIME_WITNESS_FAIL" /tmp/stib-suede-runtime-witness.log; then exit 1; fi
          grep -F "STIB_SUEDE_RUNTIME_WITNESS_OK" /tmp/stib-suede-runtime-witness.log
          test -s grand-bruxelles-game/artifacts/visual/stib_suede_runtime_before.png
          test -s grand-bruxelles-game/artifacts/visual/stib_suede_runtime_after.png
          file grand-bruxelles-game/artifacts/visual/stib_suede_runtime_before.png | grep -F "1280 x 720"
          file grand-bruxelles-game/artifacts/visual/stib_suede_runtime_after.png | grep -F "1280 x 720"
      - name: Upload inspectable evidence
        uses: actions/upload-artifact@v4
        with:
          name: stib-suede-runtime-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/visual/stib_suede_runtime_before.png
            grand-bruxelles-game/artifacts/visual/stib_suede_runtime_after.png
            /tmp/stib-suede-runtime.log
            /tmp/stib-suede-runtime-witness.log
          if-no-files-found: error
