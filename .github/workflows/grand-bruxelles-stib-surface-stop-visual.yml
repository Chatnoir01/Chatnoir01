name: Grand Bruxelles STIB Surface Stop Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-stib-surface-stop-visual.yml"
      - "grand-bruxelles-game/game/scripts/stib_surface_stop_visual.gd"
      - "grand-bruxelles-game/game/tests/stib_surface_stop_visual_test.gd"
      - "grand-bruxelles-game/game/tests/stib_surface_stop_witness_test.gd"
      - "grand-bruxelles-game/data/provenance/stib_surface_stop_visual.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-stop-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate reusable stop vocabulary
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/stib_surface_stop_visual_test.gd 2>&1 | tee /tmp/stib-stop-visual.log
          if grep -E "SCRIPT ERROR|Parse Error:|STIB_SURFACE_STOP_VISUAL_FAIL" /tmp/stib-stop-visual.log; then exit 1; fi
          grep -F "STIB_SURFACE_STOP_VISUAL_OK" /tmp/stib-stop-visual.log
      - name: Capture production-camera witness
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 --script res://game/tests/stib_surface_stop_witness_test.gd 2>&1 | tee /tmp/stib-stop-witness.log
          if grep -E "SCRIPT ERROR|Parse Error:|STIB_SURFACE_STOP_WITNESS_FAIL" /tmp/stib-stop-witness.log; then exit 1; fi
          grep -F "STIB_SURFACE_STOP_WITNESS_OK" /tmp/stib-stop-witness.log
          test -f grand-bruxelles-game/artifacts/stib/stib_surface_stop_witness.png
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: stib-surface-stop-visual-evidence
          path: |
            grand-bruxelles-game/artifacts/stib/stib_surface_stop_witness.png
            /tmp/stib-stop-visual.log
            /tmp/stib-stop-witness.log
          if-no-files-found: error
