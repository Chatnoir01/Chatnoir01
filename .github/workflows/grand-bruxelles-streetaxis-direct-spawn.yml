name: Grand Bruxelles Automatic StreetAxis Spawn

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/scripts/automatic_streetaxis_direct_spawn.gd"
      - "grand-bruxelles-game/game/scripts/brussels_world_streaming_runtime.gd"
      - "grand-bruxelles-game/game/scripts/brussels_cell_streaming_manager.gd"
      - "grand-bruxelles-game/game/scripts/brussels_cell_node_backend.gd"
      - "grand-bruxelles-game/game/zones/ixelles/**"
      - "grand-bruxelles-game/game/tests/automatic_streetaxis_direct_spawn_test.gd"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/**"
      - ".github/workflows/grand-bruxelles-web.yml"
      - ".github/workflows/grand-bruxelles-streetaxis-direct-spawn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automatic-streetaxis-spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 xvfb

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/streetaxis-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/streetaxis-import.log; then exit 1; fi

      - name: Prove streamed StreetAxis destination handshake
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/automatic_streetaxis_direct_spawn_test.gd \
            2>&1 | tee /tmp/streetaxis-direct-spawn.log
          if grep -E "SCRIPT ERROR|Parse Error:|AUTOMATIC_STREETAXIS_DIRECT_SPAWN_FAIL" /tmp/streetaxis-direct-spawn.log; then exit 1; fi
          grep -F "AUTOMATIC_STREETAXIS_THIRD_DTM_CELL_GREEN" /tmp/streetaxis-direct-spawn.log
          test -f grand-bruxelles-game/artifacts/streetaxis/streetaxis_100383_third_dtm_cell.png

      - name: Verify safe Web request grammar
        run: |
          grep -F "const DIRECT_SPAWN_STREETAXIS = /^streetaxis-[1-9][0-9]{0,17}$/.test(DIRECT_SPAWN || '');" .github/workflows/grand-bruxelles-web.yml
          grep -F "if (DIRECT_SPAWN_STATIC || DIRECT_SPAWN_ROAD || DIRECT_SPAWN_STREETAXIS)" .github/workflows/grand-bruxelles-web.yml
          grep -F "GODOT_CONFIG.args = ['--', \`spawn=\${DIRECT_SPAWN}\`];" .github/workflows/grand-bruxelles-web.yml
          if grep -E "DIRECT_SPAWN.*(x=|y=|z=|lat=|lon=)" .github/workflows/grand-bruxelles-web.yml; then exit 1; fi

      - name: Upload exact player witness
        uses: actions/upload-artifact@v4
        with:
          name: automatic-streetaxis-spawn-evidence
          path: |
            grand-bruxelles-game/artifacts/streetaxis/streetaxis_100383_third_dtm_cell.png
            /tmp/streetaxis-direct-spawn.log
            /tmp/streetaxis-import.log
          if-no-files-found: error
          retention-days: 14
