name: Grand Bruxelles Terrain Runtime Gate Evidence

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/citygen/**"
      - "grand-bruxelles-game/game/tests/terrain_collision_shape_probe.gd"
      - ".github/workflows/grand-bruxelles-terrain-runtime-gate-evidence.yml"
      - ".github/workflows/grand-bruxelles-terrain-runtime-readiness.yml"
  workflow_run:
    workflows:
      - "Grand Bruxelles Terrain Candidate Factory"
      - "Grand Bruxelles Secondary Height Factory"
      - "Grand Bruxelles Runtime Candidate Factory"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deterministic geometry stack
        run: python3 -m pip install --disable-pip-version-check "numpy>=1.26,<3"
      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Prove measured per-cell terrain gate contracts
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_terrain_runtime_gate_evidence.py
          python3 grand-bruxelles-game/tools/citygen/test_build_terrain_runtime_readiness.py
      - name: Prepare exact collision fixture
        run: |
          set -euo pipefail
          rm -rf /tmp/terrain-collision-fixture-probes /tmp/terrain-collision-fixture-results /tmp/terrain-collision-fixture-measurements
          python3 grand-bruxelles-game/tools/citygen/test_terrain_collision_gate.py \
            --emit-probe-root /tmp/terrain-collision-fixture-probes
      - name: Prove HeightMapShape3D collision in Godot 4.7.1
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/terrain_collision_shape_probe.gd \
            -- \
            --probe-root=/tmp/terrain-collision-fixture-probes \
            --result-root=/tmp/terrain-collision-fixture-results 2>&1 | tee /tmp/terrain-collision-godot-fixture.log
          if grep -E "SCRIPT ERROR|Parse Error:|TERRAIN_COLLISION_GODOT_FAIL" /tmp/terrain-collision-godot-fixture.log; then
            exit 1
          fi
          grep -q "TERRAIN_COLLISION_GODOT_OK" /tmp/terrain-collision-godot-fixture.log
      - name: Verify exact Godot collision measurement
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/citygen/test_terrain_collision_gate.py \
            --verify-probe-root /tmp/terrain-collision-fixture-probes \
            --godot-result-root /tmp/terrain-collision-fixture-results \
            --measurement-root /tmp/terrain-collision-fixture-measurements

  measure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    concurrency:
      group: grand-bruxelles-autonomous-citygen
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover durable CityGen state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/terrain-gates-prev
          mkdir -p /tmp/terrain-gates-prev
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          if git cat-file -e "origin/citygen-autonomous-state:grand-bruxelles-game/data/qa" 2>/dev/null; then
            git archive origin/citygen-autonomous-state grand-bruxelles-game/data/qa | tar -x -C /tmp/terrain-gates-prev
          fi
          rm -rf grand-bruxelles-game/data/qa
          mkdir -p grand-bruxelles-game/data/qa
          cp -a /tmp/terrain-gates-prev/grand-bruxelles-game/data/qa/. grand-bruxelles-game/data/qa/ 2>/dev/null || true

      - name: Prepare deterministic geometry stack
        run: python3 -m pip install --disable-pip-version-check "numpy>=1.26,<3"

      - name: Install Godot 4.7.1
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Select cells with exact prerequisite artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/terrain-runtime-gate-worklist.txt
          import json
          from pathlib import Path

          qa=Path('grand-bruxelles-game/data/qa')
          sources=qa/'autonomous_sources'
          candidates=qa/'autonomous_candidates'/'runtime'
          target=qa/'brussels_regional_target_grid.json'
          if not target.is_file() or not sources.exists():
              raise SystemExit(0)
          try:
              grid=json.loads(target.read_text())
          except Exception as exc:
              raise SystemExit(f'invalid regional target grid: {exc}')
          if grid.get('format') != 'grand-bruxelles-regional-target-grid-v1' or grid.get('crs') != 'EPSG:31370':
              raise SystemExit('unsupported regional target grid contract')
          target_ids={row.get('cell_id') for row in (grid.get('cells') or []) if isinstance(row,dict)}
          for cell in sorted(p for p in sources.iterdir() if p.is_dir() and p.name in target_ids):
              required=[
                  cell/'terrain_lod_evidence.json',
                  cell/'terrain_runtime_candidate.json',
                  cell/'secondary_height_validation.json',
                  candidates/cell.name/'candidate.json',
              ]
              if not all(path.is_file() for path in required):
                  continue
              try:
                  secondary=json.loads((cell/'secondary_height_validation.json').read_text())
              except Exception:
                  continue
              if secondary.get('secondary_validation_complete') is not True:
                  continue
              if secondary.get('runtime_promotion_allowed') is not False:
                  continue
              print(cell.name)
          PY
          echo "TERRAIN_RUNTIME_GATE_WORKLIST selected=$(grep -cve '^$' /tmp/terrain-runtime-gate-worklist.txt || true)"

      - name: Prepare exact per-cell collision probes
        shell: bash
        run: |
          set -u
          QA="grand-bruxelles-game/data/qa"
          SOURCES="$QA/autonomous_sources"
          CANDIDATES="$QA/autonomous_candidates/runtime"
          rm -rf /tmp/terrain-collision-probes /tmp/terrain-collision-results /tmp/terrain-collision-measurements /tmp/terrain-collision-logs
          mkdir -p /tmp/terrain-collision-probes /tmp/terrain-collision-results /tmp/terrain-collision-measurements /tmp/terrain-collision-logs
          : > /tmp/terrain-collision-prepared.txt
          : > /tmp/terrain-collision-pending.txt
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="$SOURCES/$CELL"
            C="$CANDIDATES/$CELL/candidate.json"
            P="/tmp/terrain-collision-probes/${CELL}.json"
            LOG="/tmp/terrain-collision-logs/${CELL}.prepare.log"
            if python3 grand-bruxelles-game/tools/citygen/terrain_collision_gate.py prepare \
                --terrain-lod "$D/terrain_lod_evidence.json" \
                --terrain-runtime-candidate "$D/terrain_runtime_candidate.json" \
                --secondary-height-validation "$D/secondary_height_validation.json" \
                --runtime-candidate "$C" \
                --output "$P" >"$LOG" 2>&1; then
              echo "$CELL" >> /tmp/terrain-collision-prepared.txt
              cat "$LOG"
            else
              rm -f "$P"
              echo "$CELL" >> /tmp/terrain-collision-pending.txt
              echo "TERRAIN_COLLISION_PROBE_PENDING cell=${CELL}"
              cat "$LOG"
            fi
          done < /tmp/terrain-runtime-gate-worklist.txt
          echo "TERRAIN_COLLISION_PROBE_BATCH prepared=$(grep -cve '^$' /tmp/terrain-collision-prepared.txt || true) pending=$(grep -cve '^$' /tmp/terrain-collision-pending.txt || true)"

      - name: Run exact collision probes once in Godot 4.7.1
        shell: bash
        run: |
          set -u
          PREPARED=$(find /tmp/terrain-collision-probes -maxdepth 1 -name '*.json' -type f | wc -l)
          if [ "$PREPARED" -eq 0 ]; then
            echo "TERRAIN_COLLISION_GODOT_NO_PROBES"
            exit 0
          fi
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/terrain_collision_shape_probe.gd \
            -- \
            --probe-root=/tmp/terrain-collision-probes \
            --result-root=/tmp/terrain-collision-results 2>&1 | tee /tmp/terrain-collision-godot-batch.log
          GODOT_RC=${PIPESTATUS[0]}
          set -e
          RESULTS=$(find /tmp/terrain-collision-results -maxdepth 1 -name '*.json' -type f | wc -l)
          echo "TERRAIN_COLLISION_GODOT_BATCH prepared=${PREPARED} results=${RESULTS} godot_rc=${GODOT_RC}"
          if [ "$RESULTS" -eq 0 ]; then
            echo "::error::Godot collision probe produced no per-cell results for ${PREPARED} prepared probes"
            exit 1
          fi

      - name: Finalize exact per-cell collision measurements
        shell: bash
        run: |
          set -u
          : > /tmp/terrain-collision-measured.txt
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            P="/tmp/terrain-collision-probes/${CELL}.json"
            R="/tmp/terrain-collision-results/${CELL}.json"
            M="/tmp/terrain-collision-measurements/${CELL}.json"
            LOG="/tmp/terrain-collision-logs/${CELL}.finalize.log"
            if [ -f "$P" ] && [ -f "$R" ] \
              && python3 grand-bruxelles-game/tools/citygen/terrain_collision_gate.py finalize \
                --probe "$P" \
                --godot-result "$R" \
                --output "$M" >"$LOG" 2>&1; then
              echo "$CELL" >> /tmp/terrain-collision-measured.txt
              cat "$LOG"
            else
              rm -f "$M"
              echo "TERRAIN_COLLISION_MEASUREMENT_PENDING cell=${CELL}"
              [ -f "$LOG" ] && cat "$LOG" || true
            fi
          done < /tmp/terrain-runtime-gate-worklist.txt
          echo "TERRAIN_COLLISION_MEASUREMENT_BATCH measured=$(grep -cve '^$' /tmp/terrain-collision-measured.txt || true)"

      - name: Measure geometry gates aggregate evidence and refresh readiness
        shell: bash
        run: |
          set -u
          QA="grand-bruxelles-game/data/qa"
          SOURCES="$QA/autonomous_sources"
          CANDIDATES="$QA/autonomous_candidates/runtime"
          TARGET="$QA/brussels_regional_target_grid.json"
          mkdir -p /tmp/terrain-runtime-gate-measurements /tmp/terrain-runtime-gate-logs
          : > /tmp/terrain-runtime-gate-success.txt
          : > /tmp/terrain-runtime-gate-pending.txt
          while IFS= read -r CELL; do
            [ -n "$CELL" ] || continue
            D="$SOURCES/$CELL"
            C="$CANDIDATES/$CELL/candidate.json"
            M="/tmp/terrain-runtime-gate-measurements/${CELL}.json"
            CM="/tmp/terrain-collision-measurements/${CELL}.json"
            OUT="$D/terrain_runtime_gate_evidence.json"
            READINESS="$D/terrain_runtime_readiness.json"
            LOG="/tmp/terrain-runtime-gate-logs/${CELL}.log"
            rm -f "$M" "$OUT" "$READINESS"
            if python3 grand-bruxelles-game/tools/citygen/measure_terrain_geometry_gates.py \
                --terrain-lod "$D/terrain_lod_evidence.json" \
                --terrain-runtime-candidate "$D/terrain_runtime_candidate.json" \
                --secondary-height-validation "$D/secondary_height_validation.json" \
                --runtime-candidate "$C" \
                --target-grid "$TARGET" \
                --candidate-root "$SOURCES" \
                --output "$M" >"$LOG" 2>&1; then
              MEASURE_ARGS=(--measurement "$M")
              if [ -f "$CM" ]; then
                MEASURE_ARGS+=(--measurement "$CM")
              fi
              if python3 grand-bruxelles-game/tools/citygen/build_terrain_runtime_gate_evidence.py \
                  --terrain-lod "$D/terrain_lod_evidence.json" \
                  --terrain-runtime-candidate "$D/terrain_runtime_candidate.json" \
                  --secondary-height-validation "$D/secondary_height_validation.json" \
                  --runtime-candidate "$C" \
                  "${MEASURE_ARGS[@]}" \
                  --output "$OUT" >>"$LOG" 2>&1 \
                && python3 grand-bruxelles-game/tools/citygen/build_terrain_runtime_readiness.py \
                  --terrain-lod "$D/terrain_lod_evidence.json" \
                  --terrain-runtime-candidate "$D/terrain_runtime_candidate.json" \
                  --secondary-height-validation "$D/secondary_height_validation.json" \
                  --runtime-candidate "$C" \
                  --runtime-gate-evidence "$OUT" \
                  --output "$READINESS" >>"$LOG" 2>&1; then
                echo "$CELL" >> /tmp/terrain-runtime-gate-success.txt
                cat "$LOG"
                continue
              fi
            fi
            rm -f "$OUT" "$READINESS"
            echo "$CELL" >> /tmp/terrain-runtime-gate-pending.txt
            echo "TERRAIN_RUNTIME_GATE_EVIDENCE_PENDING cell=${CELL}"
            cat "$LOG"
          done < /tmp/terrain-runtime-gate-worklist.txt

      - name: Build measured gate report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def lines(path):
              p=Path(path)
              return [row.strip() for row in p.read_text().splitlines() if row.strip()] if p.exists() else []

          root=Path('grand-bruxelles-game/data/qa/autonomous_sources')
          rows=[]
          if root.exists():
              for cell in sorted(p for p in root.iterdir() if p.is_dir()):
                  path=cell/'terrain_runtime_gate_evidence.json'
                  readiness_path=cell/'terrain_runtime_readiness.json'
                  if not path.is_file() or not readiness_path.is_file():
                      continue
                  try:
                      payload=json.loads(path.read_text())
                      readiness=json.loads(readiness_path.read_text())
                  except Exception:
                      continue
                  gates=payload.get('gates') or {}
                  rows.append({
                      'cell_id':cell.name,
                      'measured_gate_count':payload.get('measured_gate_count'),
                      'passed_gates':sorted(name for name,row in gates.items() if isinstance(row,dict) and row.get('passed') is True),
                      'blocked_gates':sorted(name for name,row in gates.items() if isinstance(row,dict) and row.get('passed') is not True),
                      'missing_runtime_gates':payload.get('missing_runtime_gates'),
                      'gate_evidence_digest':payload.get('gate_evidence_digest'),
                      'passed_runtime_gate_count':readiness.get('passed_runtime_gate_count'),
                      'runtime_gate_count':readiness.get('runtime_gate_count'),
                      'promotion_ready_for_explicit_review':readiness.get('promotion_ready_for_explicit_review') is True,
                      'runtime_promotion_allowed':readiness.get('runtime_promotion_allowed'),
                      'readiness_digest':readiness.get('readiness_digest'),
                  })
          report={
              'format':'grand-bruxelles-terrain-runtime-gate-evidence-report-v1',
              'cells':rows,
              'measured_success':lines('/tmp/terrain-runtime-gate-success.txt'),
              'measurement_pending':lines('/tmp/terrain-runtime-gate-pending.txt'),
              'collision_prepared':lines('/tmp/terrain-collision-prepared.txt'),
              'collision_measurement_pending':lines('/tmp/terrain-collision-pending.txt'),
              'collision_measured':lines('/tmp/terrain-collision-measured.txt'),
              'policy':{
                  'currently_measured_gates':['seams','normals','collisions'],
                  'unmeasured_gates':['streaming','performance','photo_match'],
                  'global_workflow_green_is_not_cell_proof':True,
                  'regional_target_grid_defines_expected_neighbors':True,
                  'neighbor_candidate_bbox_must_match_target_grid':True,
                  'missing_neighbor_candidate_remains_pending':True,
                  'collision_requires_exact_candidate_heightmapshape3d_raycast':True,
                  'collision_engine_version':'4.7.1',
                  'collision_probe_is_qa_only':True,
                  'readiness_refreshed_atomically_with_gate_evidence':True,
                  'runtime_promotion_allowed':False,
                  'automatic_production_mutation':False,
              },
          }
          Path('/tmp/terrain-runtime-gate-evidence-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print('TERRAIN_RUNTIME_GATE_EVIDENCE_REPORT',json.dumps({
              'cells':len(rows),
              'seams_passed':sum(1 for row in rows if 'seams' in row['passed_gates']),
              'normals_passed':sum(1 for row in rows if 'normals' in row['passed_gates']),
              'collisions_measured':sum(1 for row in rows if 'collisions' in row['passed_gates'] or 'collisions' in row['blocked_gates']),
              'collisions_passed':sum(1 for row in rows if 'collisions' in row['passed_gates']),
              'ready_for_explicit_review':sum(1 for row in rows if row['promotion_ready_for_explicit_review']),
              'pending':len(report['measurement_pending']),
          },sort_keys=True))
          PY

      - name: Persist measured gate evidence off main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/terrain-runtime-gate-save
          mkdir -p /tmp/terrain-runtime-gate-save
          cp -a grand-bruxelles-game/data/qa /tmp/terrain-runtime-gate-save/qa
          cp /tmp/terrain-runtime-gate-evidence-report.json /tmp/terrain-runtime-gate-save/qa/terrain_runtime_gate_evidence_latest_report.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard
          git clean -fd
          git switch -C citygen-autonomous-state origin/main
          rm -rf grand-bruxelles-game/data/qa
          mkdir -p grand-bruxelles-game/data
          cp -a /tmp/terrain-runtime-gate-save/qa grand-bruxelles-game/data/qa

          git add -- grand-bruxelles-game/data/qa
          if git diff --cached --quiet; then
            echo "TERRAIN_RUNTIME_GATE_EVIDENCE_NO_CHANGE"
            exit 0
          fi
          git commit -m "citygen: persist measured terrain runtime gates"
          git push --force-with-lease origin citygen-autonomous-state

      - name: Upload measured gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-runtime-gate-evidence-${{ github.run_number }}
          path: |
            /tmp/terrain-runtime-gate-evidence-report.json
            /tmp/terrain-runtime-gate-worklist.txt
            /tmp/terrain-runtime-gate-logs/
            /tmp/terrain-runtime-gate-measurements/
            /tmp/terrain-collision-probes/
            /tmp/terrain-collision-results/
            /tmp/terrain-collision-measurements/
            /tmp/terrain-collision-logs/
            /tmp/terrain-collision-godot-batch.log
          retention-days: 30
