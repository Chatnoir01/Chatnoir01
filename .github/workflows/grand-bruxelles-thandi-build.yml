name: Grand Bruxelles Thandi Build

on:
  push:
    branches:
      - main
    paths:
      - "grand-bruxelles-game/assets/characters/player/thandi/source/**"
      - "grand-bruxelles-game/assets/characters/player/thandi/textures/**"
      - "grand-bruxelles-game/assets/characters/player/thandi/source_status.json"
      - "grand-bruxelles-game/tools/prepare_thandi_character.py"
      - "grand-bruxelles-game/tools/validate_thandi_source_status.py"
      - ".github/workflows/grand-bruxelles-thandi-build.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/assets/characters/player/thandi/**"
      - "grand-bruxelles-game/tools/prepare_thandi_character.py"
      - "grand-bruxelles-game/tools/validate_thandi_source_status.py"
      - "grand-bruxelles-game/tools/test_validate_thandi_source_status.py"
      - ".github/workflows/grand-bruxelles-thandi-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-thandi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source status regression
        run: python3 grand-bruxelles-game/tools/test_validate_thandi_source_status.py
      - name: Validate current source status
        run: |
          python3 grand-bruxelles-game/tools/validate_thandi_source_status.py \
            --root grand-bruxelles-game/assets/characters/player/thandi \
            --status grand-bruxelles-game/assets/characters/player/thandi/source_status.json

  build-thandi-glb:
    if: github.event_name != 'pull_request'
    needs: validate-source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source package
        id: source
        shell: bash
        run: |
          FBX="grand-bruxelles-game/assets/characters/player/thandi/source/Thandi.fbx"
          if [ ! -s "$FBX" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Thandi source package is explicitly pending; authored build remains blocked."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          test -s grand-bruxelles-game/assets/characters/player/thandi/textures/Thandi_Body_Diffuse.png
          test -s grand-bruxelles-game/assets/characters/player/thandi/textures/Thandi_Hair_Diffuse.png
          test -s grand-bruxelles-game/assets/characters/player/thandi/textures/Thandi_Top_Diffuse.png

      - name: Install Blender
        if: steps.source.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build authored Thandi GLB
        if: steps.source.outputs.present == 'true'
        run: |
          blender --background \
            --python grand-bruxelles-game/tools/prepare_thandi_character.py \
            -- \
            grand-bruxelles-game/assets/characters/player/thandi/source/Thandi.fbx \
            grand-bruxelles-game/assets/characters/player/thandi/Thandi.glb
          test -s grand-bruxelles-game/assets/characters/player/thandi/Thandi.glb

      - name: Setup Godot 4.7.1 with export templates
        if: steps.source.outputs.present == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Import and test authored character in Godot
        if: steps.source.outputs.present == 'true'
        run: |
          godot --headless --path grand-bruxelles-game --editor --quit-after 5
          godot --headless --path grand-bruxelles-game --script res://game/tests/pink_tracksuit_player_visual_test.gd

      - name: Export playable Web build with Thandi
        if: steps.source.outputs.present == 'true'
        run: |
          rm -rf grand-bruxelles-game/web-preview
          mkdir -p grand-bruxelles-game/web-preview
          godot --headless --path grand-bruxelles-game --export-release Web web-preview/index.html
          test -s grand-bruxelles-game/web-preview/index.html
          test -s grand-bruxelles-game/web-preview/index.wasm
          test -s grand-bruxelles-game/web-preview/index.pck
          touch grand-bruxelles-game/web-preview/.nojekyll

      - name: Commit generated GLB and playable Web build
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f grand-bruxelles-game/assets/characters/player/thandi/Thandi.glb
          git add -f grand-bruxelles-game/web-preview
          if git diff --cached --quiet; then
            echo "Thandi GLB and Web build are already up to date"
            exit 0
          fi
          git commit -m "Build Thandi player and playable Web preview [skip ci]"
          git push origin HEAD:main
