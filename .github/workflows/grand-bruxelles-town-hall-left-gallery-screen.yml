name: Grand Bruxelles Town Hall Left Gallery Screen

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_left_gallery_screen_contract.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_left_gallery_screen_test.gd"
      - ".github/workflows/grand-bruxelles-town-hall-left-gallery-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-space:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Capture exact current-main left-gallery face witness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/grand_place_town_hall_left_gallery_screen_test.gd
      - name: Show evidence
        run: cat grand-bruxelles-game/artifacts/qa/grand_place_left_gallery_screen_evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-place-left-gallery-screen
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_left_gallery_face_before.png
            grand-bruxelles-game/artifacts/qa/grand_place_left_gallery_face_after.png
            grand-bruxelles-game/artifacts/qa/grand_place_left_gallery_screen_evidence.json
