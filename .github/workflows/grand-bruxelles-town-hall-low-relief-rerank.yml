name: Grand Bruxelles Town Hall Low Relief Rerank

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-low-relief-rerank.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_low_relief_rerank.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/game/scripts/brussels_white_stone_material.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_low_relief_rerank_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  town-hall-low-relief-rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject script errors
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-low-relief-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-low-relief-import.log; then exit 1; fi
      - name: Rerank exact Town Hall WALLSURFACE with realistic shaded probe
        shell: bash
        run: |
          set -o pipefail
          timeout 900s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/grand_place_town_hall_low_relief_rerank_test.gd \
            2>&1 | tee /tmp/grand-place-low-relief.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_LOW_RELIEF_RERANK_FAIL" /tmp/grand-place-low-relief.log; then exit 1; fi
          grep -F "GRAND_PLACE_LOW_RELIEF_RERANK_OK" /tmp/grand-place-low-relief.log
      - name: Upload low-relief rerank evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-town-hall-low-relief-rerank
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_low_relief_rerank.json
            /tmp/grand-place-low-relief-baseline.png
            /tmp/grand-place-low-relief-candidate-*.png
            /tmp/grand-place-low-relief.log
            /tmp/grand-place-low-relief-import.log
          if-no-files-found: warn
