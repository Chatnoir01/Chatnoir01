name: Grand Bruxelles Town Hall Realistic Wall Rerank

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-realistic-wall-rerank.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_realistic_wall_rerank.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_realistic_wall_rerank_test.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/project.godot"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realistic-wall-rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/grand-place-realistic-wall-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/grand-place-realistic-wall-import.log; then exit 1; fi
      - name: Rank Town Hall walls with realistic shaded probe
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --resolution 1280x720 \
            --script res://game/tests/grand_place_town_hall_realistic_wall_rerank_test.gd \
            2>&1 | tee /tmp/grand-place-realistic-wall.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_REALISTIC_WALL_RERANK_FAIL" /tmp/grand-place-realistic-wall.log; then exit 1; fi
          grep -F "GRAND_PLACE_REALISTIC_WALL_RERANK_OK" /tmp/grand-place-realistic-wall.log
      - name: Upload current-main realistic wall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-realistic-wall-rerank
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_realistic_wall_rerank.json
            /tmp/grand-place-realistic-wall-baseline.png
            /tmp/grand-place-realistic-wall-winner.png
            /tmp/grand-place-realistic-wall.log
            /tmp/grand-place-realistic-wall-import.log
          if-no-files-found: warn
