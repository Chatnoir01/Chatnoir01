name: Grand Bruxelles Town Hall Roof Semantic Registration

on:
  push:
    branches:
      - "qa/grand-place-roof-9369301-semantic-*"
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-roof-semantic-registration.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_roof_semantic_registration.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_roof_semantic_registration_test.gd"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_right_gallery_contract.json"
      - "grand-bruxelles-game/data/visual/grand_place_1655673_roof_material_identity.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-roof-semantic-registration.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_roof_semantic_registration.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_roof_semantic_registration_test.gd"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_right_gallery_contract.json"
      - "grand-bruxelles-game/data/visual/grand_place_1655673_roof_material_identity.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/roof-semantic-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/roof-semantic-import.log; then exit 1; fi
      - name: Prove roof-to-gallery semantic registration
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_roof_semantic_registration_test.gd 2>&1 | tee /tmp/roof-semantic.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWN_HALL_ROOF_SEMANTIC_FAIL" /tmp/roof-semantic.log; then exit 1; fi
          grep -F "GRAND_PLACE_TOWN_HALL_ROOF_SEMANTIC_OK" /tmp/roof-semantic.log
