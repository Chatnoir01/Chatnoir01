name: Grand Bruxelles Town Hall Roof Winner Strict

on:
  push:
    branches:
      - "qa/grand-place-town-hall-roof-faces-*"
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-roof-winner-strict.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_roof_winner_strict.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_roof_winner_strict_test.gd"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-roof-winner-strict.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_roof_winner_strict.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_roof_winner_strict_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-clean-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/roof-strict-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/roof-strict-import.log; then exit 1; fi
      - name: Run strict clean witness
        shell: bash
        run: |
          set -o pipefail
          timeout 150s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --resolution 1280x720 --script res://game/tests/grand_place_town_hall_roof_winner_strict_test.gd 2>&1 | tee /tmp/roof-strict.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWN_HALL_ROOF_WINNER_STRICT_FAIL" /tmp/roof-strict.log; then exit 1; fi
          grep -q "GRAND_PLACE_TOWN_HALL_ROOF_WINNER_STRICT_OK" /tmp/roof-strict.log
      - name: Upload strict evidence
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-town-hall-roof-winner-strict
          path: |
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_roof_winner_strict.json
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_roof_winner_strict_before.png
            grand-bruxelles-game/artifacts/qa/grand_place_town_hall_roof_winner_strict_after.png
          if-no-files-found: error
