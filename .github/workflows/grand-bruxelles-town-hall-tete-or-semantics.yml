name: Grand Bruxelles Town Hall Tete d'Or Semantics

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-tete-or-semantics.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_tete_or_semantics.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_tete_or_semantics_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/tete-or-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/tete-or-import.log; then exit 1; fi
      - name: Validate exact face and heritage semantics
        shell: bash
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/grand_place_town_hall_tete_or_semantics_test.gd 2>&1 | tee /tmp/tete-or-semantics.log || true
          if grep -E "SCRIPT ERROR|Parse Error:|TOWN_HALL_TETE_OR_SEMANTICS_FAIL" /tmp/tete-or-semantics.log; then exit 1; fi
          grep -F "TOWN_HALL_TETE_OR_SEMANTICS_OK" /tmp/tete-or-semantics.log
