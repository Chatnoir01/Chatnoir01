name: Grand Bruxelles Town Hall Tete d'Or Visual

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-town-hall-tete-or-visual.yml"
      - "grand-bruxelles-game/data/qa/grand_place_town_hall_tete_or_visual_contract.json"
      - "grand-bruxelles-game/data/urbis/grand_place_lod2/1655673.game.json"
      - "grand-bruxelles-game/data/qa/grand_place_clean_player_witness.json"
      - "grand-bruxelles-game/game/scripts/grand_place_town_hall_tete_or_facade_runtime.gd"
      - "grand-bruxelles-game/game/tests/grand_place_town_hall_tete_or_visual_test.gd"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/game/main.tscn"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/tete-or-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/tete-or-import.log; then exit 1; fi
      - name: Run source contract and deterministic player A/B
        run: |
          set -o pipefail
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --resolution 1280x720 \
            --script res://game/tests/grand_place_town_hall_tete_or_visual_test.gd 2>&1 | tee /tmp/tete-or-test.log
          if grep -E "SCRIPT ERROR|Parse Error:|GRAND_PLACE_TOWN_HALL_TETE_OR_VISUAL_FAIL" /tmp/tete-or-test.log; then exit 1; fi
          grep -F "GRAND_PLACE_TOWN_HALL_TETE_OR_VISUAL_OK" /tmp/tete-or-test.log
      - name: Upload witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-place-town-hall-tete-or-visual
          path: |
            /tmp/grand-place-town-hall-tete-or-before.png
            /tmp/grand-place-town-hall-tete-or-after.png
            /tmp/grand-place-town-hall-tete-or-metrics.json
            /tmp/tete-or-test.log
            /tmp/tete-or-import.log
          if-no-files-found: warn
