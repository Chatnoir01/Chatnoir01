name: Grand Bruxelles Brussels Mobility Traffic Calibration

on:
  push:
    branches:
      - "integration/traffic-brussels-mobility-calibration"
    paths:
      - "grand-bruxelles-game/tools/build_brussels_mobility_traffic_snapshot.py"
      - "grand-bruxelles-game/tools/test_build_brussels_mobility_traffic_snapshot.py"
      - ".github/workflows/grand-bruxelles-traffic-brussels-mobility.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/build_brussels_mobility_traffic_snapshot.py"
      - "grand-bruxelles-game/tools/test_build_brussels_mobility_traffic_snapshot.py"
      - "grand-bruxelles-game/data/traffic/brussels_mobility_snapshot.json"
      - ".github/workflows/grand-bruxelles-traffic-brussels-mobility.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-official-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Offline normalizer regression test
        run: |
          python3 grand-bruxelles-game/tools/test_build_brussels_mobility_traffic_snapshot.py

      - name: Download official Brussels Mobility sources
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --compressed \
            'https://data.mobility.brussels/traffic/api/counts/?request=devices&outputFormat=json' \
            -o /tmp/bm-traffic-devices.json
          curl --fail --location --retry 3 --compressed \
            'https://data.mobility.brussels/traffic/api/counts/?request=live&interval=1&includeLanes=false&singleValue=true' \
            -o /tmp/bm-traffic-live.json
          curl --fail --location --retry 3 --compressed \
            'https://data.mobility.brussels/geoserver/bm_traffic/wfs?service=wfs&version=1.1.0&request=GetFeature&typeName=bm_traffic:traffic_live_geom&outputFormat=json&srsName=EPSG:31370' \
            -o /tmp/bm-traffic-geometry.json
          python3 - <<'PY'
          import json
          devices = json.load(open('/tmp/bm-traffic-devices.json', encoding='utf-8'))
          live = json.load(open('/tmp/bm-traffic-live.json', encoding='utf-8'))
          geometry = json.load(open('/tmp/bm-traffic-geometry.json', encoding='utf-8'))
          print('devices_features=', len(devices.get('features', [])))
          print('live_traverses=', len(live.get('data', {})))
          print('geometry_features=', len(geometry.get('features', [])))
          PY

      - name: Build official Brussels Mobility traffic snapshot
        run: |
          python3 grand-bruxelles-game/tools/build_brussels_mobility_traffic_snapshot.py \
            --devices-file /tmp/bm-traffic-devices.json \
            --live-file /tmp/bm-traffic-live.json \
            --geometry-file /tmp/bm-traffic-geometry.json \
            --output grand-bruxelles-game/data/traffic/brussels_mobility_snapshot.json \
            --min-geometry-sensors 5 \
            --min-fresh-measured-sensors 1

      - name: Validate provenance, freshness and coordinate contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('grand-bruxelles-game/data/traffic/brussels_mobility_snapshot.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['format'] == 'grand-bruxelles-brussels-mobility-traffic-v1'
          assert data['source']['license'] == 'CC0-1.0'
          assert data['source']['geometry_crs'] == 'EPSG:31370'
          assert data['source']['measurement_interval'] == '1m'
          assert data['coordinate_system']['source_crs'] == 'EPSG:31370'
          assert len(data['raw_sha256']['devices']) == 64
          assert len(data['raw_sha256']['live']) == 64
          assert len(data['raw_sha256']['geometry']) == 64
          assert data['stats']['geometry_sensor_count'] >= 5
          assert data['stats']['fresh_measured_sensor_count'] >= 1
          fresh = [s for s in data['sensors'] if s['measurement'].get('fresh')]
          assert fresh
          assert all(s['measurement'].get('duration_minutes') == 1.0 for s in fresh)
          assert all('speed' not in s['measurement'] for s in data['sensors'])
          print('BRUSSELS_MOBILITY_TRAFFIC_PROVENANCE_OK', data['stats'])
          PY

      - name: Commit live official snapshot on calibration branch
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/traffic/brussels_mobility_snapshot.json
          if git diff --cached --quiet; then
            echo "Official traffic snapshot already unchanged."
          else
            git commit -m "data(traffic): capture Brussels Mobility calibration [skip ci]"
            git push origin HEAD:integration/traffic-brussels-mobility-calibration
          fi
