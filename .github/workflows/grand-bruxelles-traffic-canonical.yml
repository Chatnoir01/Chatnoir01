name: Grand Bruxelles Traffic Canonical

on:
  push:
    branches:
      - "integration/traffic-canonical-core-v4"
      - "integration/traffic-canonical-vehicle-core"
      - "integration/traffic-canonical-manager-foundation"
      - "integration/traffic-canonical-manager-core"
      - "integration/traffic-tow-extension"
      - "integration/traffic-main-scene-wiring"
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_*.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_damage_model.gd"
      - "grand-bruxelles-game/game/tests/traffic_*.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - ".github/workflows/grand-bruxelles-traffic-canonical.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_*.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_damage_model.gd"
      - "grand-bruxelles-game/game/tests/traffic_*.gd"
      - "grand-bruxelles-game/game/main.tscn"
      - ".github/workflows/grand-bruxelles-traffic-canonical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import traffic contract headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/traffic-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/traffic-import.log; then exit 1; fi
      - name: Canonical traffic parity contract test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_runtime_contract_test.gd 2>&1 | tee /tmp/traffic-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_RUNTIME_CONTRACT_FAIL" /tmp/traffic-contract.log; then exit 1; fi
          grep -q "TRAFFIC_RUNTIME_CONTRACT_OK" /tmp/traffic-contract.log
      - name: Canonical traffic vehicle core test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_vehicle_core_test.gd 2>&1 | tee /tmp/traffic-vehicle-core.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CANONICAL_VEHICLE_FAIL" /tmp/traffic-vehicle-core.log; then exit 1; fi
          grep -q "TRAFFIC_CANONICAL_VEHICLE_OK" /tmp/traffic-vehicle-core.log
      - name: Canonical traffic manager foundation test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_manager_foundation_test.gd 2>&1 | tee /tmp/traffic-manager-foundation.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_MANAGER_FOUNDATION_FAIL" /tmp/traffic-manager-foundation.log; then exit 1; fi
          grep -q "TRAFFIC_MANAGER_FOUNDATION_OK" /tmp/traffic-manager-foundation.log
      - name: Canonical traffic manager core test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_manager_core_test.gd 2>&1 | tee /tmp/traffic-manager-core.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CANONICAL_MANAGER_FAIL" /tmp/traffic-manager-core.log; then exit 1; fi
          grep -q "TRAFFIC_CANONICAL_MANAGER_OK" /tmp/traffic-manager-core.log
      - name: Traffic intersection evidence test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_intersection_evidence_test.gd 2>&1 | tee /tmp/traffic-intersection-evidence.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_INTERSECTION_EVIDENCE_FAIL" /tmp/traffic-intersection-evidence.log; then exit 1; fi
          grep -q "TRAFFIC_INTERSECTION_EVIDENCE_OK" /tmp/traffic-intersection-evidence.log
      - name: Optional traffic tow extension test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_tow_extension_test.gd 2>&1 | tee /tmp/traffic-tow-extension.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_TOW_EXTENSION_FAIL" /tmp/traffic-tow-extension.log; then exit 1; fi
          grep -q "TRAFFIC_TOW_EXTENSION_OK" /tmp/traffic-tow-extension.log
      - name: Main scene traffic integration test
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_main_scene_integration_test.gd 2>&1 | tee /tmp/traffic-main-scene.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_MAIN_SCENE_FAIL" /tmp/traffic-main-scene.log; then exit 1; fi
          grep -q "TRAFFIC_MAIN_SCENE_OK" /tmp/traffic-main-scene.log
