name: Grand Bruxelles Traffic Canonical

on:
  push:
    branches: ["integration/traffic-canonical-runtime"]
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_*.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_damage_model.gd"
      - "grand-bruxelles-game/game/tests/traffic_*.gd"
      - ".github/workflows/grand-bruxelles-traffic-canonical.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_*.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_damage_model.gd"
      - "grand-bruxelles-game/game/tests/traffic_*.gd"
      - ".github/workflows/grand-bruxelles-traffic-canonical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import traffic contract headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/traffic-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/traffic-import.log; then exit 1; fi
      - name: Canonical traffic parity contract test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_runtime_contract_test.gd 2>&1 | tee /tmp/traffic-contract.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_RUNTIME_CONTRACT_FAIL" /tmp/traffic-contract.log; then exit 1; fi
          grep -q "TRAFFIC_RUNTIME_CONTRACT_OK" /tmp/traffic-contract.log
      - name: Canonical runtime implementation test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_runtime_test.gd 2>&1 | tee /tmp/traffic-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CANONICAL_RUNTIME_FAIL" /tmp/traffic-runtime.log; then exit 1; fi
          grep -q "TRAFFIC_CANONICAL_RUNTIME_OK" /tmp/traffic-runtime.log
      - name: Canonical vehicle archetype and damage parity test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_vehicle_core_test.gd 2>&1 | tee /tmp/traffic-vehicle.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CANONICAL_VEHICLE_FAIL" /tmp/traffic-vehicle.log; then exit 1; fi
          grep -q "TRAFFIC_CANONICAL_VEHICLE_OK" /tmp/traffic-vehicle.log
      - name: Canonical visual tow lifecycle parity test
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_canonical_tow_test.gd 2>&1 | tee /tmp/traffic-tow.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CANONICAL_TOW_FAIL" /tmp/traffic-tow.log; then exit 1; fi
          grep -q "TRAFFIC_CANONICAL_TOW_OK" /tmp/traffic-tow.log
