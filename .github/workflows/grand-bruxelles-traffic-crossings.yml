name: Grand Bruxelles Traffic Crossings

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_*"
      - "grand-bruxelles-game/game/tests/traffic_*"
      - "grand-bruxelles-game/data/traffic/**"
      - ".github/workflows/grand-bruxelles-traffic-crossings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-crossings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crossing-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then
            exit 1
          fi

      - name: Pedestrian crossing state test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/traffic_crossing_test.gd 2>&1 | tee /tmp/crossing.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_CROSSING_FAIL" /tmp/crossing.log; then
            exit 1
          fi
          grep -q "TRAFFIC_CROSSING_OK" /tmp/crossing.log

      - name: Traffic density model test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/traffic_density_test.gd 2>&1 | tee /tmp/density.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_DENSITY_FAIL" /tmp/density.log; then
            exit 1
          fi
          grep -q "TRAFFIC_DENSITY_OK" /tmp/density.log

      - name: Mixed vehicle archetype test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/traffic_vehicle_mix_test.gd 2>&1 | tee /tmp/mix.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_MIX_FAIL" /tmp/mix.log; then
            exit 1
          fi
          grep -q "TRAFFIC_MIX_OK" /tmp/mix.log

      - name: Live traffic crossing smoke test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/traffic_smoke_test.gd 2>&1 | tee /tmp/traffic.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_SMOKE_FAIL" /tmp/traffic.log; then
            exit 1
          fi
          grep -q "TRAFFIC_SMOKE_OK" /tmp/traffic.log
