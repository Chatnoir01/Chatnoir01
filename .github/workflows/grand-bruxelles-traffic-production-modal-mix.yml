name: Grand Bruxelles Traffic Production Modal Mix

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/tests/traffic_production_modal_mix_test.gd"
      - ".github/workflows/grand-bruxelles-traffic-production-modal-mix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production-modal-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/traffic-modal-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/traffic-modal-import.log; then exit 1; fi
      - name: Validate production modal mix
        shell: bash
        run: |
          set -o pipefail
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/traffic_production_modal_mix_test.gd 2>&1 | tee /tmp/traffic-modal.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_PRODUCTION_MODAL_MIX_FAIL" /tmp/traffic-modal.log; then exit 1; fi
          grep -q "TRAFFIC_PRODUCTION_MODAL_MIX_OK" /tmp/traffic-modal.log
