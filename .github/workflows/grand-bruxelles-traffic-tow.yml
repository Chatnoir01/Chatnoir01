name: Grand Bruxelles Traffic Tow Service

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/traffic_manager_core_v9.gd"
      - "grand-bruxelles-game/game/tests/traffic_tow_service_test.gd"
      - ".github/workflows/grand-bruxelles-traffic-tow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-traffic-tow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-tow-service:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project headless
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then
            exit 1
          fi

      - name: Visual tow service lifecycle test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game \
            --script res://game/tests/traffic_tow_service_test.gd 2>&1 | tee /tmp/tow.log
          if grep -E "SCRIPT ERROR|Parse Error:|TRAFFIC_TOW_SERVICE_FAIL" /tmp/tow.log; then
            exit 1
          fi
          grep -q "TRAFFIC_TOW_SERVICE_OK" /tmp/tow.log
