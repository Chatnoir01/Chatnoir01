name: Grand Bruxelles Tree Distance LOD

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/brussels_osm_environment_runtime.gd'
      - 'grand-bruxelles-game/game/tests/brussels_tree_distance_lod_test.gd'
      - 'grand-bruxelles-game/game/tests/brussels_tree_distance_lod_witness_test.gd'
      - '.github/workflows/grand-bruxelles-tree-distance-lod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-distance-lod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/tree-lod-import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/tree-lod-import.log; then exit 1; fi
      - name: Validate distance-aware tree LOD
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_tree_distance_lod_test.gd 2>&1 | tee /tmp/tree-distance-lod.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BRUSSELS_TREE_DISTANCE_LOD_FAIL' /tmp/tree-distance-lod.log; then exit 1; fi
          grep -q 'BRUSSELS_TREE_DISTANCE_LOD_OK' /tmp/tree-distance-lod.log
      - name: 1280x720 full-frame tree LOD preservation A/B
        shell: bash
        run: |
          set -o pipefail
          mkdir -p grand-bruxelles-game/artifacts/visual
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_tree_distance_lod_witness_test.gd 2>&1 | tee /tmp/tree-distance-lod-witness.log
          cp /tmp/tree-distance-lod-witness.log grand-bruxelles-game/artifacts/visual/tree_lod_witness.log
          if grep -E 'SCRIPT ERROR|Parse Error:|BRUSSELS_TREE_DISTANCE_LOD_VISUAL_FAIL' /tmp/tree-distance-lod-witness.log; then exit 1; fi
          grep -q 'BRUSSELS_TREE_DISTANCE_LOD_VISUAL_OK' /tmp/tree-distance-lod-witness.log
      - name: Upload exact tree LOD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-tree-distance-lod-ab
          path: |
            grand-bruxelles-game/artifacts/visual/tree_lod_full_detail_before.png
            grand-bruxelles-game/artifacts/visual/tree_lod_distance_after.png
            grand-bruxelles-game/artifacts/visual/tree_lod_signal_before.png
            grand-bruxelles-game/artifacts/visual/tree_lod_signal_after.png
            grand-bruxelles-game/artifacts/visual/tree_lod_witness.log
          if-no-files-found: warn
