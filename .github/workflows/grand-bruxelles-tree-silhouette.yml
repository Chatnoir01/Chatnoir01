name: Grand Bruxelles Shared Tree Silhouette

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-tree-silhouette.yml"
      - "grand-bruxelles-game/game/scripts/brussels_street_tree_asset.gd"
      - "grand-bruxelles-game/game/scripts/brussels_corridor_tree_runtime.gd"
      - "grand-bruxelles-game/game/tests/brussels_tree_silhouette_visual_test.gd"
      - "grand-bruxelles-game/tests/test_brussels_tree_silhouette_revision.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tree-silhouette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require source-safe reusable tree silhouette
        run: python grand-bruxelles-game/tests/test_brussels_tree_silhouette_revision.py
      - name: Install display dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/tree-import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/tree-import.log; then exit 1; fi
      - name: Prove normal-player tree silhouette impact
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --display-driver x11 --rendering-method gl_compatibility --path grand-bruxelles-game --script res://game/tests/brussels_tree_silhouette_visual_test.gd 2>&1 | tee /tmp/tree-silhouette.log
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_TREE_SILHOUETTE_VISUAL_FAIL" /tmp/tree-silhouette.log; then exit 1; fi
          grep -q "BRUSSELS_TREE_SILHOUETTE_VISUAL_OK" /tmp/tree-silhouette.log
      - name: Upload player A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brussels-tree-silhouette-ab
          path: |
            grand-bruxelles-game/artifacts/visual/brussels_tree_silhouette_before.png
            grand-bruxelles-game/artifacts/visual/brussels_tree_silhouette_after.png
            /tmp/tree-silhouette.log
          if-no-files-found: warn
