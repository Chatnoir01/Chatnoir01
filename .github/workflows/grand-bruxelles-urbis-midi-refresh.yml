name: Grand Bruxelles UrbIS Midi Refresh

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/tools/fetch_urbis_wfs_bbox.py"
      - "grand-bruxelles-game/tools/lambert72_to_game_geojson.py"
      - "grand-bruxelles-game/tools/make_urbis_midi_runtime.py"
      - ".github/workflows/grand-bruxelles-urbis-midi-refresh.yml"
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: write

concurrency:
  group: grand-bruxelles-urbis-midi-refresh
  cancel-in-progress: true

jobs:
  refresh-midi:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official UrbIS Midi geometry
        run: |
          rm -rf /tmp/urbis-midi
          python3 grand-bruxelles-game/tools/fetch_urbis_wfs_bbox.py \
            --output-dir /tmp/urbis-midi \
            --bbox 147250,168900,148500,170250 \
            --retries 4

      - name: Convert Lambert 72 layers to Godot local metres
        run: |
          mkdir -p grand-bruxelles-game/data/urbis/midi
          for layer in buildings street_surfaces street_axes tram_network train_network; do
            cp "/tmp/urbis-midi/${layer}.geojson" "grand-bruxelles-game/data/urbis/midi/${layer}.geojson"
            python3 grand-bruxelles-game/tools/lambert72_to_game_geojson.py \
              "/tmp/urbis-midi/${layer}.geojson" \
              "grand-bruxelles-game/data/urbis/midi/${layer}.game.json"
          done
          cp /tmp/urbis-midi/manifest.json grand-bruxelles-game/data/urbis/midi/manifest.json

      - name: Build compact exact-plan runtime dataset
        run: |
          python3 grand-bruxelles-game/tools/make_urbis_midi_runtime.py \
            --buildings grand-bruxelles-game/data/urbis/midi/buildings.game.json \
            --surfaces grand-bruxelles-game/data/urbis/midi/street_surfaces.game.json \
            --output grand-bruxelles-game/data/urbis/midi/midi_runtime.game.json \
            --radius 610

      - name: Validate exact Midi extract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('grand-bruxelles-game/data/urbis/midi')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          runtime = json.loads((root / 'midi_runtime.game.json').read_text(encoding='utf-8'))
          assert manifest['crs'] == 'EPSG:31370'
          expected = ['buildings', 'street_surfaces', 'street_axes', 'tram_network', 'train_network']
          for layer in expected:
              raw = json.loads((root / f'{layer}.geojson').read_text(encoding='utf-8'))
              game = json.loads((root / f'{layer}.game.json').read_text(encoding='utf-8'))
              assert raw['type'] == 'FeatureCollection', layer
              assert game['type'] == 'FeatureCollection', layer
              assert len(raw.get('features', [])) == len(game.get('features', [])), layer
              assert game['grand_bruxelles_coordinate_system']['source_crs'] == 'EPSG:31370'
              print(layer, len(raw.get('features', [])), 'features')
          assert manifest['layers']['buildings']['features'] > 100
          assert manifest['layers']['street_surfaces']['features'] > 50
          assert manifest['layers']['street_axes']['features'] > 50
          assert runtime['accuracy']['plan_geometry'] == 'official_urbis'
          assert runtime['accuracy']['street_surface_levels'] == 'official_urbis'
          assert runtime['stats']['buildings'] > 500, runtime['stats']
          assert runtime['stats']['street_surfaces'] > 300, runtime['stats']
          assert runtime['stats']['street_surfaces_surface_level'] > 300, runtime['stats']
          assert runtime['stats']['street_surfaces_non_surface_level'] > 0, runtime['stats']
          assert (
              runtime['stats']['street_surfaces_surface_level']
              + runtime['stats']['street_surfaces_non_surface_level']
              == runtime['stats']['street_surfaces']
          ), runtime['stats']
          assert all('level' in surface for surface in runtime['street_surfaces'])
          print('runtime', runtime['stats'])
          PY

      - name: Commit refreshed Midi UrbIS data
        run: |
          if [ -z "$(git status --porcelain -- grand-bruxelles-game/data/urbis/midi)" ]; then
            echo "UrbIS Midi data unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grand-bruxelles-game/data/urbis/midi
          git commit -m "data: refresh exact UrbIS Midi geometry [skip ci]"
          git push
