name: Grand Bruxelles UrbIS3D Missing Building Spatial Diagnostic

on:
  pull_request:
    paths:
      - "grand-bruxelles-game/tools/diagnose_urbis3d_missing_buildings.py"
      - "grand-bruxelles-game/tools/test_diagnose_urbis3d_missing_buildings.py"
      - ".github/workflows/grand-bruxelles-urbis3d-missing-building-spatial-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install read-only GeoPackage tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal unzip

      - name: Regression-test spatial diagnostic
        run: |
          set -euo pipefail
          python3 grand-bruxelles-game/tools/test_diagnose_urbis3d_missing_buildings.py

      - name: Select current fully-evidenced Anderlecht witness
        run: |
          set -euo pipefail
          git fetch origin citygen-autonomous-state:refs/remotes/origin/citygen-autonomous-state
          SOURCES="grand-bruxelles-game/data/qa/autonomous_sources"
          REPORT="grand-bruxelles-game/data/qa/autonomous_citygen_latest_report.json"
          git show "origin/citygen-autonomous-state:${REPORT}" > /tmp/report.json
          git ls-tree --name-only "origin/citygen-autonomous-state:${SOURCES}" > /tmp/available.txt
          python3 grand-bruxelles-game/tools/citygen/select_secondary_height_validation_cell.py \
            --report /tmp/report.json --available-cells /tmp/available.txt \
            --municipality anderlecht --output /tmp/target.json
          CELL="$(python3 -c "import json; print(json.load(open('/tmp/target.json'))['cell_id'])")"
          mkdir -p /tmp/citygen-state
          git archive origin/citygen-autonomous-state "${SOURCES}/${CELL}" | tar -x -C /tmp/citygen-state
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=json.load(open('/tmp/target.json',encoding='utf-8'))
          src=Path('/tmp/citygen-state/grand-bruxelles-game/data/qa/autonomous_sources')/target['cell_id']
          bbox=target['bbox_epsg31370']
          candidates=json.load((src/'building_height_candidates.json').open(encoding='utf-8'))
          assert target['municipality']=='anderlecht'
          assert target['evidence_progress']==target['evidence_stage_count'] > 0
          assert target['runtime_promotion_allowed'] is False
          assert target['runtime_approved'] is False
          assert candidates['format']=='grand-bruxelles-cell-building-height-candidates-v1'
          assert candidates['cell_id']==target['cell_id']
          assert candidates['crs']=='EPSG:31370'
          assert candidates['runtime_promotion_allowed'] is False
          assert candidates['runtime_approved_count']==0
          assert (src/'raw/buildings.geojson').is_file()
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as h:
              h.write(f"CELL={target['cell_id']}\nSRC={src}\n")
              h.write(f"MIN_E={bbox[0]}\nMIN_N={bbox[1]}\nMAX_E={bbox[2]}\nMAX_N={bbox[3]}\n")
          print('MISSING_BUILDING_TARGET_OK',target['cell_id'],f"evidence={target['evidence_progress']}/{target['evidence_stage_count']}",'runtime_promotion=false')
          PY

      - name: Discover latest official Anderlecht UrbIS3D package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json
          from pathlib import Path
          p=Path('grand-bruxelles-game/tools/discover_urbis_sources.py')
          s=importlib.util.spec_from_file_location('discover',p); assert s and s.loader
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          feed=m.parse_feed('urbis_3d_constructions',m.DEFAULT_FEEDS['urbis_3d_constructions'])
          Path('/tmp/discovered.json').write_text(json.dumps({'schema':1,'feeds':[feed]}),encoding='utf-8')
          PY
          python3 grand-bruxelles-game/tools/select_urbis_distribution.py \
            /tmp/discovered.json /tmp/selected.json \
            --source-id urbis_3d_constructions --token 31370 --token GPKG \
            --candidate-token 31370 --candidate-token GPKG --candidate-token 21001 --prefer-latest
          python3 - <<'PY'
          import json
          from urllib.parse import urlparse
          d=json.load(open('/tmp/selected.json')); url=str(d['selected']['href']); host=(urlparse(url).hostname or '').lower()
          assert url.startswith('https://') and all(x in url.casefold() for x in ('31370','gpkg','21001'))
          assert host=='urbisdownload.datastore.brussels' or host.endswith('.datastore.brussels')
          print('MISSING_BUILDING_PACKAGE_OK',d['selected_embedded_date'],url)
          PY

      - name: Download and safely extract package
        run: |
          set -euo pipefail
          URL="$(python3 -c "import json; print(json.load(open('/tmp/selected.json'))['selected']['href'])")"
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 "$URL" -o /tmp/urbis.zip
          sha256sum /tmp/urbis.zip | tee /tmp/distribution.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('/tmp/urbis.zip'); dest=Path('/tmp/urbis3d'); dest.mkdir()
          assert zipfile.is_zipfile(src)
          base=dest.resolve()
          with zipfile.ZipFile(src) as z:
              for member in z.infolist():
                  target=(dest/member.filename).resolve()
                  if target != base and base not in target.parents:
                      raise SystemExit(f'unsafe ZIP path: {member.filename}')
              z.extractall(dest)
          packages=sorted(dest.rglob('*.gpkg')); assert packages
          print('MISSING_BUILDING_EXTRACTION_OK',len(packages))
          PY

      - name: Rebuild semantic evidence and diagnose eight missing probes
        run: |
          set -euo pipefail
          mkdir -p /tmp/missing-spatial
          PACKAGE_DATE="$(python3 -c "import json; print(json.load(open('/tmp/selected.json'))['selected_embedded_date'])")"
          python3 grand-bruxelles-game/tools/match_urbis3d_semantic_heights.py \
            --root /tmp/urbis3d --buildings "$SRC/raw/buildings.geojson" \
            --output /tmp/missing-spatial/semantic.json --cell-id "$CELL" --municipality anderlecht \
            --bbox "$MIN_E" "$MIN_N" "$MAX_E" "$MAX_N"
          python3 grand-bruxelles-game/tools/diagnose_urbis3d_missing_buildings.py \
            --root /tmp/urbis3d --buildings "$SRC/raw/buildings.geojson" \
            --bbox "$MIN_E" "$MIN_N" "$MAX_E" "$MAX_N" --package-date "$PACKAGE_DATE" \
            --probe-id 1828139 --probe-id 235182 --probe-id 243181 --probe-id 247396 \
            --probe-id 88966 --probe-id 88988 --probe-id 89344 --probe-id 89349 \
            --output /tmp/missing-spatial/spatial.json

      - name: Build compact cause report without authorizing matches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spatial=json.load(open('/tmp/missing-spatial/spatial.json',encoding='utf-8'))
          semantic=json.load(open('/tmp/missing-spatial/semantic.json',encoding='utf-8'))
          assert spatial['policy']['read_only'] is True
          assert spatial['policy']['identity_authorization'] is False
          assert spatial['policy']['runtime_approval'] is False
          assert spatial['policy']['thresholds_changed'] is False
          assert spatial['counts']['probe_count']==8
          by_building={}
          for match in semantic['matches']:
              building=match.get('best_candidate_inspire_id')
              if building:
                  by_building.setdefault(building,[]).append({
                      'busolid_id':match['busolid_id'],
                      'status':match['status'],
                      'match_score':match.get('match_score'),
                      'match_margin':match.get('match_margin'),
                      'semantic_height_m':match.get('semantic_height_m'),
                      'height_plausible':match.get('height_plausible'),
                  })
          rows=[]
          for probe in spatial['probes']:
              rows.append({
                  'probe_id':probe['probe_id'],
                  'building_id':probe['building_id'],
                  'block_id':probe['block_id'],
                  'declared_area_m2':probe['declared_area_m2'],
                  'geometry_area_m2':probe['geometry_area_m2'],
                  'spatial_observation':probe['spatial_observation'],
                  'intersecting_groundsolid_count':probe['intersecting_groundsolid_count'],
                  'best_overlap':probe['best_overlap'],
                  'nearest_groundsolid':probe['nearest_groundsolid'],
                  'semantic_candidates':by_building.get(probe['building_id'],[]),
                  'identity_authorized':False,
                  'runtime_approved':False,
              })
          report={
              'schema':'grand-bruxelles-urbis3d-missing-secondary-cause-report-v1',
              'source_2d':spatial['source_2d'],
              'source_3d':spatial['source_3d'],
              'policy':{
                  'diagnostic_only':True,
                  'identity_authorization':False,
                  'runtime_approval':False,
                  'matcher_thresholds_changed':False,
              },
              'probes':rows,
          }
          Path('/tmp/missing-spatial/summary.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('MISSING_SECONDARY_CAUSE_REPORT',json.dumps([
              {
                  'id':row['probe_id'],
                  'block_id':row['block_id'],
                  'overlap_count':row['intersecting_groundsolid_count'],
                  'nearest_m':None if row['nearest_groundsolid'] is None else row['nearest_groundsolid']['distance_m'],
                  'semantic_statuses':[item['status'] for item in row['semantic_candidates']],
                  'semantic_heights_m':[item['semantic_height_m'] for item in row['semantic_candidates']],
              }
              for row in rows
          ],sort_keys=True))
          PY
          cp /tmp/selected.json /tmp/missing-spatial/selected.json
          cp /tmp/distribution.sha256 /tmp/missing-spatial/distribution.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: grand-bruxelles-urbis3d-missing-building-spatial-diagnostic
          path: /tmp/missing-spatial/
          if-no-files-found: error
