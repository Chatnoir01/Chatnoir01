name: Grand Bruxelles Vehicle A-B Sandbox

on:
  push:
    branches: ["agent/vehicle-ab-real-car"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-vehicle-ab-sandbox.yml"
      - "grand-bruxelles-game/game/scripts/vehicle_dynamics_60hz.gd"
      - "grand-bruxelles-game/game/scripts/vehicle_physics_controller.gd"
      - "grand-bruxelles-game/game/prototypes/vehicle/vehicle_ab_sandbox.tscn"
      - "grand-bruxelles-game/game/tests/vehicle_ab_sandbox_test.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/scripts/civilian_vehicle_visual.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vehicle-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import production project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Run playable A-B vehicle probe
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/vehicle_ab_sandbox_test.gd 2>&1 | tee /tmp/vehicle-ab.log
          if grep -E "SCRIPT ERROR|Parse Error:|VEHICLE_AB_SANDBOX_FAIL" /tmp/vehicle-ab.log; then exit 1; fi
          grep -F "VEHICLE_AB_SANDBOX_OK" /tmp/vehicle-ab.log
