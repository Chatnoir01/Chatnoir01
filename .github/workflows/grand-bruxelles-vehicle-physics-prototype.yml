name: Grand Bruxelles Vehicle Physics Prototype

on:
  push:
    branches: ["agent/prototype-vehicle-physics"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-vehicle-physics-prototype.yml"
      - "grand-bruxelles-game/game/prototypes/vehicle/**"
      - "grand-bruxelles-game/game/tests/vehicle_dynamics_60hz_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import production project unchanged
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Run 60 Hz vehicle dynamics contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/vehicle_dynamics_60hz_test.gd 2>&1 | tee /tmp/vehicle60.log
          if grep -E "SCRIPT ERROR|Parse Error:|VEHICLE_DYNAMICS_60HZ_FAIL" /tmp/vehicle60.log; then exit 1; fi
          grep -F "VEHICLE_DYNAMICS_60HZ_OK" /tmp/vehicle60.log
