name: Grand Bruxelles Visible Living City

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/game/scripts/visible_city_runtime.gd"
      - "grand-bruxelles-game/game/tests/visible_city_runtime_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-visible-city.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/scripts/visible_city_runtime.gd"
      - "grand-bruxelles-game/game/tests/visible_city_runtime_test.gd"
      - "grand-bruxelles-game/project.godot"
      - ".github/workflows/grand-bruxelles-visible-city.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-city:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then
            exit 1
          fi

      - name: Visible living-city runtime test
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --script res://game/tests/visible_city_runtime_test.gd 2>&1 | tee /tmp/visible-city.log
          if grep -E "SCRIPT ERROR|Parse Error:|VISIBLE_CITY_RUNTIME_FAIL" /tmp/visible-city.log; then
            exit 1
          fi
          grep -q "VISIBLE_CITY_RUNTIME_OK" /tmp/visible-city.log

      - name: Load real main scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path grand-bruxelles-game \
            --quit-after 8 2>&1 | tee /tmp/main.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/main.log; then
            exit 1
          fi
          grep -q "VISIBLE_CITY_RUNTIME_READY" /tmp/main.log
