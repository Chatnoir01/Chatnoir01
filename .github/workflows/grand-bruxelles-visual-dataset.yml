name: Grand Bruxelles Visual Dataset
on:
  pull_request:
    paths: ["grand-bruxelles-game/tools/visual_dataset/**", ".github/workflows/grand-bruxelles-visual-dataset.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  catalog-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 grand-bruxelles-game/tools/visual_dataset/test_visual_catalog.py
      - name: Build live Brussels reference catalog
        run: |
          python3 grand-bruxelles-game/tools/visual_dataset/build_wikimedia_catalog.py --max-images 100 --output /tmp/brussels-visual-catalog.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/brussels-visual-catalog.json'))
          assert p['format']=='grand-bruxelles-visual-catalog-v3'
          assert p['shard']=={'index':0,'count':1}
          assert p['summary']['global_seen']==p['summary']['seen']
          assert p['summary']['seen']>0
          assert p['summary']['reusable'] + p['summary']['reference_only'] == p['summary']['seen']
          assert p['summary']['downloaded']==0 and p['summary']['download_bytes']==0
          assert all(x['usage_class'] in {'REUSABLE_ASSET_SOURCE','REFERENCE_ONLY'} for x in p['images'])
          assert all((x['usage_class']!='REUSABLE_ASSET_SOURCE') or (x['license'] in p['reusable_license_allowlist'] and x['url']) for x in p['images'])
          geolocated=[x for x in p['images'] if x['lat'] is not None and x['lon'] is not None]
          assert geolocated, 'live query must return at least one coordinate-bearing image'
          print('VISUAL_DATASET_LIVE_OK',p['summary'],'geolocated=',len(geolocated))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: brussels-visual-catalog
          path: /tmp/brussels-visual-catalog.json
