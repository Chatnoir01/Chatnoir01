name: Grand Bruxelles Web Export

on:
  push:
    branches: [main]
    paths:
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/assets/characters/player/**"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/export_presets.cfg"
      - ".github/workflows/grand-bruxelles-web-export.yml"
  pull_request:
    paths:
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/assets/characters/player/**"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/export_presets.cfg"
      - ".github/workflows/grand-bruxelles-web-export.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-bruxelles-web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Verify project imports
        run: godot --headless --path grand-bruxelles-game --editor --quit-after 3

      - name: Validate playable Web export without publishing
        run: |
          WEB_DIR="$RUNNER_TEMP/grand-bruxelles-web-export"
          rm -rf "$WEB_DIR"
          mkdir -p "$WEB_DIR"
          godot --headless --path grand-bruxelles-game --export-release Web "$WEB_DIR/index.html"
          test -s "$WEB_DIR/index.html"
          test -s "$WEB_DIR/index.wasm"
          test -s "$WEB_DIR/index.pck"
          test -s "$WEB_DIR/index.js"
          du -h "$WEB_DIR"/*

      - name: Confirm validation did not modify production preview
        run: |
          if ! git diff --quiet -- grand-bruxelles-game/web-preview; then
            echo "Validation-only Web Export modified tracked production preview files."
            git diff -- grand-bruxelles-game/web-preview
            exit 1
          fi
          echo "Secondary Web export validated without writing to main or web-preview."
