name: Grand Bruxelles Playable Web Build

on:
  push:
    branches: ["main"]
    paths:
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/export_presets.cfg"
      - "grand-bruxelles-game/game/**"
      - "grand-bruxelles-game/assets/characters/player/**"
      - "grand-bruxelles-game/data/osm/**"
      - ".github/workflows/grand-bruxelles-web.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grand-bruxelles-web-main
  cancel-in-progress: true

jobs:
  build-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        run: |
          curl -fL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.1.stable
          key: godot-4.7.1-stable-export-templates-v1

      - name: Install Godot export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 --retry-delay 5 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p /tmp/templates-unpack
          unzip -q /tmp/templates.tpz -d /tmp/templates-unpack
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cp -a /tmp/templates-unpack/templates/. ~/.local/share/godot/export_templates/4.7.1.stable/
          test -f ~/.local/share/godot/export_templates/4.7.1.stable/web_release.zip

      - name: Import project
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path grand-bruxelles-game --editor --quit

      - name: Export playable Web build
        run: |
          WEB_DIR="$GITHUB_WORKSPACE/grand-bruxelles-game/web-preview"
          rm -rf "$WEB_DIR"
          mkdir -p "$WEB_DIR"
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless \
            --path "$GITHUB_WORKSPACE/grand-bruxelles-game" \
            --export-release "Web" "$WEB_DIR/index.html"
          test -f "$WEB_DIR/index.html"
          test -f "$WEB_DIR/index.wasm"
          test -f "$WEB_DIR/index.pck"
          test -f "$WEB_DIR/index.js"
          du -h "$WEB_DIR"/*

      - name: Wire direct location test spawns
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("grand-bruxelles-game/web-preview/index.html")
          text = path.read_text(encoding="utf-8")
          needle = "const GODOT_THREADS_ENABLED = false;"
          injection = """const DIRECT_SPAWN = new URLSearchParams(window.location.search).get('spawn');
          if (DIRECT_SPAWN === 'bourse' || DIRECT_SPAWN === 'atomium' || DIRECT_SPAWN === 'ixelles') {
          \tGODOT_CONFIG.args = ['--', `spawn=${DIRECT_SPAWN}`];
          }
          
          """
          if needle not in text:
              raise SystemExit("Godot Web template marker missing")
          text = text.replace(needle, injection + needle, 1)
          path.write_text(text, encoding="utf-8")
          PY
          grep -F "DIRECT_SPAWN === 'bourse' || DIRECT_SPAWN === 'atomium' || DIRECT_SPAWN === 'ixelles'" grand-bruxelles-game/web-preview/index.html
          grep -F "GODOT_CONFIG.args = ['--', \`spawn=\${DIRECT_SPAWN}\`];" grand-bruxelles-game/web-preview/index.html

      - name: Verify Web files are servable and report access weight
        run: |
          python3 -m http.server 8765 --directory grand-bruxelles-game/web-preview >/tmp/web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl -fI http://127.0.0.1:8765/index.html
          curl -fI http://127.0.0.1:8765/index.wasm
          curl -fI http://127.0.0.1:8765/index.pck
          curl -fI http://127.0.0.1:8765/index.js
          python3 - <<'PY'
          from pathlib import Path
          root = Path('grand-bruxelles-game/web-preview')
          required = ['index.html', 'index.js', 'index.wasm', 'index.pck']
          sizes = {name: (root / name).stat().st_size for name in required}
          total = sum(p.stat().st_size for p in root.iterdir() if p.is_file())
          print('WEB_ACCESS_BYTES', total)
          print('WEB_ACCESS_MIB', round(total / 1024 / 1024, 2))
          for name, size in sizes.items():
              print(f'WEB_FILE {name} {size}')
          if total > 150 * 1024 * 1024:
              raise SystemExit('Web build exceeds 150 MiB access hard limit')
          if total > 90 * 1024 * 1024:
              print('::warning::Web build exceeds 90 MiB; mobile first-load optimization remains required.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload playable build to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: grand-bruxelles-game/web-preview

      - name: Deploy playable build to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit playable Web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f grand-bruxelles-game/web-preview
          if git diff --cached --quiet; then
            echo "Playable Web build already up to date."
          else
            git commit -m "web: publish playable Grand Bruxelles build [skip ci]"
            for publish_attempt in 1 2 3; do
              git fetch origin main:refs/remotes/origin/main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Playable Web build push attempt $publish_attempt raced with another main update."
            done
            echo "::error::Playable Web build push lost three main-branch races."
            exit 1
          fi
