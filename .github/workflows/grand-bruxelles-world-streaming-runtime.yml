name: Grand Bruxelles World Streaming Runtime

on:
  push:
    branches: ["agent/brussels-world-streaming-runtime-v2"]
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-world-streaming-runtime.yml"
      - "grand-bruxelles-game/game/main.tscn"
      - "grand-bruxelles-game/game/scripts/brussels_world_streamer.gd"
      - "grand-bruxelles-game/game/scripts/brussels_cell_streaming_manager.gd"
      - "grand-bruxelles-game/game/scripts/brussels_cell_node_backend.gd"
      - "grand-bruxelles-game/game/scripts/brussels_asset_cache.gd"
      - "grand-bruxelles-game/game/scripts/mobile_controls_streaming_extension.gd"
      - "grand-bruxelles-game/game/zones/ixelles/ixelles_streamed_microslice.gd"
      - "grand-bruxelles-game/game/tests/brussels_world_streaming_runtime_test.gd"
      - "grand-bruxelles-game/data/urbis/remaining_brussels/cells/**"
      - "grand-bruxelles-game/data/terrain/ixelles/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 2 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/world-streaming-import.log
          if grep -E "SCRIPT ERROR|Parse Error:" /tmp/world-streaming-import.log; then exit 1; fi
      - name: Run cached main-scene streaming lifecycle and mobile Ixelles travel
        shell: bash
        run: |
          set -o pipefail
          timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/brussels_world_streaming_runtime_test.gd 2>&1 | tee /tmp/world-streaming-runtime.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 124 ]; then
            echo "BRUSSELS_WORLD_STREAMING_RUNTIME_FAIL: timed out after 60s"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -E "SCRIPT ERROR|Parse Error:|BRUSSELS_WORLD_STREAMING_RUNTIME_FAIL" /tmp/world-streaming-runtime.log; then exit 1; fi
          grep -F "BRUSSELS_WORLD_STREAMING_RUNTIME_OK" /tmp/world-streaming-runtime.log
