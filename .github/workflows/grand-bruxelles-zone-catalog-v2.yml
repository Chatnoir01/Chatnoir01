name: Grand Bruxelles Zone Catalog v2

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/data/qa/playable_zone_catalog.json'
      - 'grand-bruxelles-game/game/scripts/zone_selector_runtime.gd'
      - 'grand-bruxelles-game/game/tests/zone_catalog_v2_contract_test.gd'
      - '.github/workflows/grand-bruxelles-zone-catalog-v2.yml'
  workflow_dispatch:

jobs:
  prove-catalog-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject parse errors
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ERROR: Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Prove LABO v2 schema and compatibility
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/zone_catalog_v2_contract_test.gd 2>&1 | tee /tmp/catalog-v2.log
          if grep -E 'SCRIPT ERROR|Parse Error:|ZONE_CATALOG_V2_FAIL' /tmp/catalog-v2.log; then exit 1; fi
          grep -F 'ZONE_CATALOG_V2_OK' /tmp/catalog-v2.log
