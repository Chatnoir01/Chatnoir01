name: Grand Bruxelles Zone Promotion Readiness

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/data/qa/zone_promotion_contract.json"
      - "grand-bruxelles-game/data/qa/zone_promotion/**"
      - "grand-bruxelles-game/data/visual/**"
      - "grand-bruxelles-game/game/tests/**"
      - "grand-bruxelles-game/tools/validate_zone_promotion_readiness.py"
      - "grand-bruxelles-game/tools/test_zone_promotion_readiness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-promotion-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test fail-closed promotion rules
        run: python3 grand-bruxelles-game/tools/test_zone_promotion_readiness.py
      - name: Validate live playable-zone catalog
        run: python3 grand-bruxelles-game/tools/validate_zone_promotion_readiness.py
