name: Grand Bruxelles Zone Selector LABO v2

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-zone-selector-labo-v2.yml"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/game/scripts/zone_selector_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_issue_report_runtime.gd"
      - "grand-bruxelles-game/game/tests/zone_selector_labo_v2_ui_test.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-selector-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project and reject parse errors
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error:|ERROR: Failed to load script" /tmp/import.log; then exit 1; fi
      - name: Prove listing states and report badge
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/zone_selector_labo_v2_ui_test.gd 2>&1 | tee /tmp/labo-v2.log
          if grep -E "SCRIPT ERROR|Parse Error:|ZONE_SELECTOR_LABO_V2_FAIL" /tmp/labo-v2.log; then exit 1; fi
          grep -F "ZONE_SELECTOR_LABO_V2_OK" /tmp/labo-v2.log
      - name: Capture ZONES truth witness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/zone_selector_labo_v2_ui_test.gd -- capture=1 2>&1 | tee /tmp/labo-v2-capture.log
          if grep -E "SCRIPT ERROR|Parse Error:|ZONE_SELECTOR_LABO_V2_FAIL" /tmp/labo-v2-capture.log; then exit 1; fi
          grep -F "ZONE_SELECTOR_LABO_V2_WITNESS_OK" /tmp/labo-v2-capture.log
      - uses: actions/upload-artifact@v4
        with:
          name: zone-selector-labo-v2-witness
          path: grand-bruxelles-game/artifacts/visual/zone_selector_labo_v2_1280x720.png
