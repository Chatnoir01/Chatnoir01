name: Grand Bruxelles Zone Selector

on:
  pull_request:
    paths:
      - ".github/workflows/grand-bruxelles-zone-selector.yml"
      - "grand-bruxelles-game/data/qa/playable_zone_catalog.json"
      - "grand-bruxelles-game/game/scripts/zone_selector_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_issue_report_runtime.gd"
      - "grand-bruxelles-game/game/scripts/player_controller.gd"
      - "grand-bruxelles-game/game/tests/zone_selector_runtime_test.gd"
      - "grand-bruxelles-game/project.godot"
      - "grand-bruxelles-game/docs/VISUAL_MASTERLIST.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zone-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --editor --quit
      - name: Validate zones, reports and promotion gate
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path grand-bruxelles-game --script res://game/tests/zone_selector_runtime_test.gd
      - name: Capture SIGNALER over production main
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 && xvfb-run -a /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path grand-bruxelles-game --display-driver x11 --rendering-method gl_compatibility --script res://game/tests/zone_selector_runtime_test.gd -- capture=1
      - uses: actions/upload-artifact@v4
        with:
          name: player-report-witness
          path: grand-bruxelles-game/artifacts/visual/player_report_1280x720.png
