name: Import Rgsdev CC0 vehicles

on:
  push:
    branches:
      - codex/rgsdev-drivable-vehicles
    paths:
      - .github/workflows/import-rgsdev-vehicles.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/rgsdev-drivable-vehicles
          fetch-depth: 0
          persist-credentials: true

      - name: Download CC0 source pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://opengameart.org/sites/default/files/free_low_poly_vehicles_pack_by_rgsdev.zip' \
            --output /tmp/rgsdev.zip
          rm -rf /tmp/rgsdev-pack
          mkdir -p /tmp/rgsdev-pack
          unzip -q /tmp/rgsdev.zip -d /tmp/rgsdev-pack

      - name: Normalize and verify the 21 FBX models
        shell: python
        run: |
          from pathlib import Path
          import shutil

          source = Path('/tmp/rgsdev-pack')
          destination = Path('grand-bruxelles-game/game/assets/vehicles/rgsdev')
          destination.mkdir(parents=True, exist_ok=True)

          expected = {
              'Ambulance.fbx': 'ambulance.fbx',
              'Bus.fbx': 'bus.fbx',
              'Firetruck.fbx': 'firetruck.fbx',
              'Hatchback.fbx': 'hatchback.fbx',
              'Limousine.fbx': 'limousine.fbx',
              'Monster Truck.fbx': 'monster_truck.fbx',
              'Muscle.fbx': 'muscle.fbx',
              'Muscle 2.fbx': 'muscle_2.fbx',
              'Pickup.fbx': 'pickup.fbx',
              'Police Muscle.fbx': 'police_muscle.fbx',
              'Police Sedan.fbx': 'police_sedan.fbx',
              'Police Sports.fbx': 'police_sports.fbx',
              'Police SUV.fbx': 'police_suv.fbx',
              'Roadster.fbx': 'roadster.fbx',
              'Sedan.fbx': 'sedan.fbx',
              'Sports.fbx': 'sports.fbx',
              'SUV.fbx': 'suv.fbx',
              'Taxi.fbx': 'taxi.fbx',
              'Truck.fbx': 'truck.fbx',
              'Truck with trailer.fbx': 'truck_with_trailer.fbx',
              'Van.fbx': 'van.fbx',
          }

          found = {}
          for path in source.rglob('*.fbx'):
              if path.name == 'All vehicles.fbx':
                  continue
              if path.name in expected:
                  if path.name in found:
                      raise SystemExit(f'Duplicate FBX source: {path.name}')
                  found[path.name] = path

          missing = sorted(set(expected) - set(found))
          extra_expected_names = sorted(set(found) - set(expected))
          if missing or extra_expected_names or len(found) != 21:
              raise SystemExit(f'Expected exactly 21 mapped FBX files; missing={missing}, unexpected={extra_expected_names}, found={len(found)}')

          for source_name, target_name in expected.items():
              src = found[source_name]
              header = src.read_bytes()[:18]
              if not header.startswith(b'Kaydara FBX Binary'):
                  raise SystemExit(f'Invalid FBX binary header: {src}')
              shutil.copyfile(src, destination / target_name)

          outputs = sorted(destination.glob('*.fbx'))
          if len(outputs) != 21:
              raise SystemExit(f'Expected 21 output FBX files, got {len(outputs)}')
          print('Imported 21 verified Rgsdev CC0 FBX vehicles.')

      - name: Commit vehicle assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- grand-bruxelles-game/game/assets/vehicles/rgsdev/*.fbx
          if git diff --cached --quiet; then
            echo 'Vehicle FBX assets already match the source pack.'
            exit 0
          fi
          git commit -m 'assets(vehicles): import 21 Rgsdev CC0 FBX models'
          git push origin HEAD:codex/rgsdev-drivable-vehicles
