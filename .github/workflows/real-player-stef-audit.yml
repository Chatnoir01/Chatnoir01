name: Grand Bruxelles Real Player Stef Audit

on:
  push:
    branches:
      - visual/real-player-stef-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-source-package:
    if: ${{ !contains(github.event.head_commit.message, '[stef-audit-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact branch base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cac4f7f1b131d5675dffb6c6a03e5ed0e644de2b HEAD

      - name: Download CC0 Stef archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/stef_npc1.zip \
            https://opengameart.org/sites/default/files/stef_npc1_1.zip
          test -s /tmp/stef_npc1.zip
          sha256sum /tmp/stef_npc1.zip

      - name: Inspect package without modifying source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stef
          mkdir -p /tmp/stef
          unzip -q /tmp/stef_npc1.zip -d /tmp/stef
          echo '--- FILES ---'
          find /tmp/stef -type f -printf '%P\t%k KiB\n' | sort
          echo '--- CANDIDATE 3D FILES ---'
          find /tmp/stef -type f \
            \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.dae' -o -iname '*.blend' \) \
            -print | sort
          echo '--- TEXTURES ---'
          find /tmp/stef -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.tga' \) \
            -print | sort
          echo '--- HASHES ---'
          find /tmp/stef -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Persist deterministic audit manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/player-audit
          {
            echo 'source_page=https://opengameart.org/content/npc-girl-stef'
            echo 'download_url=https://opengameart.org/sites/default/files/stef_npc1_1.zip'
            echo 'declared_license=CC0'
            echo -n 'archive_sha256='; sha256sum /tmp/stef_npc1.zip | awk '{print $1}'
            echo
            echo '[files]'
            find /tmp/stef -type f -printf '%P\t%s bytes\n' | sort
            echo
            echo '[candidate_3d_files]'
            find /tmp/stef -type f \
              \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.fbx' -o -iname '*.dae' -o -iname '*.blend' \) \
              -printf '%P\n' | sort
            echo
            echo '[textures]'
            find /tmp/stef -type f \
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.tga' \) \
              -printf '%P\n' | sort
            echo
            echo '[sha256]'
            while IFS= read -r -d '' f; do
              rel="${f#/tmp/stef/}"
              printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$rel"
            done < <(find /tmp/stef -type f -print0 | sort -z)
          } > .github/player-audit/stef-manifest.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/player-audit/stef-manifest.txt
          if git diff --cached --quiet; then
            echo 'Manifest unchanged.'
          else
            git commit -m 'docs(player): record Stef source audit [stef-audit-output]'
            git push origin HEAD:visual/real-player-stef-audit
          fi

      - name: Upload immutable audit package
        uses: actions/upload-artifact@v4
        with:
          name: real-player-stef-source-audit
          path: |
            /tmp/stef_npc1.zip
            /tmp/stef
          if-no-files-found: error
          retention-days: 7
