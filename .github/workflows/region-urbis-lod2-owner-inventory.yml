name: Grand Bruxelles Region UrbIS LoD2 Owner Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/region-urbis-lod2-owner-inventory.yml"
      - "grand-bruxelles-game/tools/qa/region_urbis_lod2_owner_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  region-urbis-lod2-owner-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reader dependency
        run: python -m pip install --disable-pip-version-check pyshp

      - name: Inventory official UrbIS LoD2 owners across Brussels-Capital
        run: |
          python grand-bruxelles-game/tools/qa/region_urbis_lod2_owner_inventory.py \
            --feed-url "https://urbisdownload.datastore.brussels/atomfeed/e9ec2aa4-cffd-11ee-bccc-00090ffe0001-fr.xml" \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/region_urbis_lod2_inventory"

      - name: Publish inventory summary
        if: success()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "region_urbis_lod2_inventory" / "region_urbis_lod2_inventory.json").read_text()
          )
          lines = [
              "## Brussels-Capital official UrbIS LoD2 owner inventory",
              "",
              f"- Current distributions: **{report['selected_current_distributions']}**",
              f"- Revision dates: **{', '.join(report['revision_dates']) or 'not encoded'}**",
              f"- LoD2 source records: **{report['lod2_records']}**",
              f"- Unique official building owners: **{report['official_unique_building_ids']}**",
              f"- Already persisted in repo data: **{report['already_persisted_official_ids']}**",
              f"- Missing official building IDs: **{report['missing_official_building_ids']}**",
              "",
              "Evidence-only inventory; runtime_authorized=false.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload complete regional inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: region-urbis-lod2-owner-inventory
          path: ${{ runner.temp }}/region_urbis_lod2_inventory/*
          if-no-files-found: warn
