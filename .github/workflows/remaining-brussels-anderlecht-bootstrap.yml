name: Bootstrap Anderlecht UrbIS cell

on:
  push:
    branches:
      - zone-reste-bruxelles
    paths:
      - '.github/workflows/remaining-brussels-anderlecht-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-brussels-anderlecht-bootstrap
  cancel-in-progress: false

jobs:
  materialize-first-cell:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dedicated zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-reste-bruxelles
          fetch-depth: 0

      - name: Validate Python pipeline
        working-directory: grand-bruxelles-game
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fetch official Anderlecht boundary and generate intersecting global cells
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/bootstrap_remaining_brussels.py \
            --zone anderlecht \
            --output-root data/processed/remaining_brussels

      - name: Select contiguous Anderlecht seed outside the reserved Midi cell
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/select_zone_seed_cell.py \
            --manifest data/processed/remaining_brussels/cells/anderlecht.json \
            --anchor-e 147868.29422791934 \
            --anchor-n 169538.62414926197 \
            --exclude-containing-anchor \
            --output /tmp/anderlecht-seed.json

      - name: Remove only accidental bootstrap cells
        working-directory: grand-bruxelles-game
        run: |
          rm -rf \
            data/urbis/remaining_brussels/cells/bxl-e143500-n166000-s500 \
            data/urbis/remaining_brussels/cells/bxl-e147500-n169500-s500

      - name: Rebuild contiguous Anderlecht seed from UrbIS WFS
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/materialize_zone_cells.py \
            --manifest /tmp/anderlecht-seed.json \
            --output-root data/urbis/remaining_brussels/cells \
            --force

      - name: Build Godot streaming index
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/build_urbis_runtime_index.py \
            --source-root data/urbis/remaining_brussels/cells \
            --resource-prefix res://data/urbis/remaining_brussels/cells \
            --output data/urbis/remaining_brussels/runtime_index.json

      - name: Capture official orthophoto reference for contiguous seed
        working-directory: grand-bruxelles-game
        run: |
          mkdir -p data/processed/remaining_brussels/references /tmp/anderlecht-ortho
          BBOX=$(python3 - <<'PY'
          import json
          seed = json.load(open('/tmp/anderlecht-seed.json', encoding='utf-8'))
          print(','.join(str(value) for value in seed['cells'][0]['bbox']))
          PY
          )
          python3 tools/capture_urbis_orthophoto.py \
            --bbox "$BBOX" \
            --width 1024 \
            --height 1024 \
            --output /tmp/anderlecht-ortho/seed.png \
            --metadata data/processed/remaining_brussels/references/anderlecht_seed_orthophoto.json

      - name: Verify generated data, branch ownership and rail classification
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reserved_midi = 'bxl-e147500-n169500-s500'
          accidental_far = 'bxl-e143500-n166000-s500'

          zone = json.loads(Path('data/processed/remaining_brussels/cells/anderlecht.json').read_text())
          seed = json.loads(Path('/tmp/anderlecht-seed.json').read_text())
          assert zone['format'] == 'grand-bruxelles-zone-cells-v2'
          assert zone['cell_count'] > 0
          assert zone['cell_count'] <= zone['envelope_cell_count']
          assert all(cell['id'].startswith('bxl-e') for cell in zone['cells'])
          assert seed['cell_count'] == 1
          assert seed['seed_selection']['exclude_containing_anchor'] is True
          assert reserved_midi in seed['seed_selection']['excluded_anchor_cell_ids']
          seed_id = seed['seed_selection']['selected_cell_id']
          assert seed_id not in {reserved_midi, accidental_far}

          index = json.loads(Path('data/urbis/remaining_brussels/runtime_index.json').read_text())
          assert index['format'] == 'grand-bruxelles-urbis-runtime-index-v1'
          indexed_ids = {cell['cell_id'] for cell in index['cells']}
          assert seed_id in indexed_ids, (seed_id, sorted(indexed_ids))
          assert reserved_midi not in indexed_ids, sorted(indexed_ids)
          assert accidental_far not in indexed_ids, sorted(indexed_ids)

          manifest_path = Path('data/urbis/remaining_brussels/cells') / seed_id / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['runtime']['geometry_format'] == 'grand-bruxelles-urbis-cell-runtime-v1'
          assert manifest['runtime']['network_format'] == 'grand-bruxelles-urbis-network-cell-runtime-v2'

          network_path = manifest_path.parent / manifest['runtime']['network_file']
          network = json.loads(network_path.read_text())
          assert network['format'] == 'grand-bruxelles-urbis-network-cell-runtime-v2'
          assert all(str(item.get('type', '')).startswith('TW') for item in network['tram_network'])
          assert all(str(item.get('type', '')).startswith('RW') for item in network['train_network'])
          tram_ids = {item['source_id'] for item in network['tram_network']}
          train_ids = {item['source_id'] for item in network['train_network']}
          assert tram_ids.isdisjoint(train_ids), 'tram/train runtime source IDs overlap after TYPE filtering'

          ortho = json.loads(Path('data/processed/remaining_brussels/references/anderlecht_seed_orthophoto.json').read_text())
          assert ortho['provider'] == 'Paradigm / UrbIS'
          assert ortho['layer'] == 'inspire:Ortho'
          assert ortho['crs'] == 'EPSG:31370'
          assert ortho['service'] == 'WMS 1.1.0'
          assert ortho['bbox'] == seed['cells'][0]['bbox']
          assert ortho['download']['bytes'] > 1000
          assert len(ortho['download']['sha256']) == 64

          print('Contiguous official seed:', seed_id)
          print('Seed distance from Midi anchor (m):', seed['seed_selection']['distance_m'])
          print('Excluded reserved cells:', seed['seed_selection']['excluded_anchor_cell_ids'])
          print('Runtime cells retained:', sorted(indexed_ids))
          print('Geometry stats:', manifest['runtime']['geometry_stats'])
          print('Network stats:', manifest['runtime']['network_stats'])
          print('Rail source TYPE counts:', network['source_type_counts'])
          print('Orthophoto sha256:', ortho['download']['sha256'])
          PY

      - name: Upload orthophoto validation preview
        uses: actions/upload-artifact@v4
        with:
          name: anderlecht-seed-official-orthophoto
          path: /tmp/anderlecht-ortho/seed.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit reproducible official data snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            grand-bruxelles-game/data/processed/remaining_brussels/boundaries/anderlecht.geojson \
            grand-bruxelles-game/data/processed/remaining_brussels/cells/anderlecht.json \
            grand-bruxelles-game/data/processed/remaining_brussels/bootstrap_manifest.json \
            grand-bruxelles-game/data/processed/remaining_brussels/references/anderlecht_seed_orthophoto.json \
            grand-bruxelles-game/data/urbis/remaining_brussels
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            exit 0
          fi
          git commit -m 'data: rebuild Anderlecht seed outside Midi ownership'
          git push origin HEAD:zone-reste-bruxelles
