name: Materialize Anderlecht Saint-Guidon

on:
  push:
    branches:
      - zone-reste-bruxelles
    paths:
      - '.github/workflows/remaining-brussels-anderlecht-saint-guidon.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-brussels-anderlecht-saint-guidon
  cancel-in-progress: false

jobs:
  materialize-saint-guidon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout dedicated zone branch
        uses: actions/checkout@v4
        with:
          ref: zone-reste-bruxelles
          fetch-depth: 0

      - name: Validate reconstruction pipeline
        working-directory: grand-bruxelles-game
        run: |
          python3 -m compileall -q tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Refresh official Anderlecht boundary and global cell grid
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/bootstrap_remaining_brussels.py \
            --zone anderlecht \
            --output-root data/processed/remaining_brussels

      - name: Select the official cell containing Place de la Vaillance / Saint-Guidon
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/select_zone_seed_cell.py \
            --manifest data/processed/remaining_brussels/cells/anderlecht.json \
            --anchor-e 145611.15627840292 \
            --anchor-n 169471.81357855164 \
            --output /tmp/saint-guidon-cell.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          selection = json.loads(Path('/tmp/saint-guidon-cell.json').read_text())
          selected = selection['seed_selection']['selected_cell_id']
          assert selected == 'bxl-e145500-n169000-s500', selected
          assert selection['seed_selection']['distance_m'] == 0.0
          print('Saint-Guidon official cell:', selected)
          PY

      - name: Materialize Saint-Guidon from official UrbIS WFS
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/materialize_zone_cells.py \
            --manifest /tmp/saint-guidon-cell.json \
            --output-root data/urbis/remaining_brussels/cells \
            --force

      - name: Build shared Godot streaming index
        working-directory: grand-bruxelles-game
        run: |
          python3 tools/build_urbis_runtime_index.py \
            --source-root data/urbis/remaining_brussels/cells \
            --resource-prefix res://data/urbis/remaining_brussels/cells \
            --output data/urbis/remaining_brussels/runtime_index.json

      - name: Capture official Saint-Guidon orthophoto reference
        working-directory: grand-bruxelles-game
        run: |
          mkdir -p data/processed/remaining_brussels/references /tmp/saint-guidon-ortho
          python3 tools/capture_urbis_orthophoto.py \
            --bbox 145500,169000,146000,169500 \
            --width 1024 \
            --height 1024 \
            --output /tmp/saint-guidon-ortho/saint-guidon.png \
            --metadata data/processed/remaining_brussels/references/anderlecht_saint_guidon_orthophoto.json

      - name: Verify urban geometry, network and provenance
        working-directory: grand-bruxelles-game
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cell_id = 'bxl-e145500-n169000-s500'
          cell_dir = Path('data/urbis/remaining_brussels/cells') / cell_id
          manifest = json.loads((cell_dir / 'manifest.json').read_text())
          geometry = json.loads((cell_dir / manifest['runtime']['geometry_file']).read_text())
          network = json.loads((cell_dir / manifest['runtime']['network_file']).read_text())
          index = json.loads(Path('data/urbis/remaining_brussels/runtime_index.json').read_text())
          ortho = json.loads(Path('data/processed/remaining_brussels/references/anderlecht_saint_guidon_orthophoto.json').read_text())

          assert manifest['bbox'] == [145500.0, 169000.0, 146000.0, 169500.0]
          assert manifest['runtime']['geometry_format'] == 'grand-bruxelles-urbis-cell-runtime-v1'
          assert manifest['runtime']['network_format'] == 'grand-bruxelles-urbis-network-cell-runtime-v2'
          assert geometry['stats']['buildings'] > 0
          assert geometry['stats']['street_surfaces'] > 0
          assert network['stats']['street_segments'] > 0
          assert all(item['type'].startswith('TW') for item in network['tram_network'])
          assert all(item['type'].startswith('RW') for item in network['train_network'])
          assert {item['source_id'] for item in network['tram_network']}.isdisjoint(
              {item['source_id'] for item in network['train_network']}
          )
          assert cell_id in {item['cell_id'] for item in index['cells']}
          assert ortho['provider'] == 'Paradigm / UrbIS'
          assert ortho['layer'] == 'inspire:Ortho'
          assert ortho['download']['bytes'] > 1000

          print('Saint-Guidon geometry:', geometry['stats'])
          print('Saint-Guidon network:', network['stats'])
          print('Rail source TYPE counts:', network['source_type_counts'])
          print('Orthophoto SHA256:', ortho['download']['sha256'])
          PY

      - name: Upload official orthophoto validation preview
        uses: actions/upload-artifact@v4
        with:
          name: anderlecht-saint-guidon-official-orthophoto
          path: /tmp/saint-guidon-ortho/saint-guidon.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit reproducible Saint-Guidon snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            grand-bruxelles-game/data/processed/remaining_brussels/boundaries/anderlecht.geojson \
            grand-bruxelles-game/data/processed/remaining_brussels/cells/anderlecht.json \
            grand-bruxelles-game/data/processed/remaining_brussels/bootstrap_manifest.json \
            grand-bruxelles-game/data/processed/remaining_brussels/references/anderlecht_saint_guidon_orthophoto.json \
            grand-bruxelles-game/data/urbis/remaining_brussels
          if git diff --cached --quiet; then
            echo 'No generated Saint-Guidon data changes to commit.'
            exit 0
          fi
          git commit -m 'data: add official Saint-Guidon Anderlecht cell'
          git push origin HEAD:zone-reste-bruxelles
