name: Remaining Brussels Schaerbeek compact pass 4

on:
  push:
    branches: ["zone-reste-bruxelles-clean"]
    paths:
      - ".github/workflows/remaining-brussels-schaerbeek-compact-pass4.yml"
      - "grand-bruxelles-game/tools/fetch_urbis_wfs_bbox.py"
      - "grand-bruxelles-game/tests/test_fetch_urbis_wfs_bbox.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-brussels-schaerbeek-compact-pass4
  cancel-in-progress: false

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zone-reste-bruxelles-clean
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Schaerbeek official grid and mapping pipeline
        working-directory: grand-bruxelles-game
        run: |
          python -m compileall -q tools tests
          python -m unittest \
            tests.test_fetch_urbis_wfs_bbox \
            tests.test_make_zone_cells \
            tests.test_materialize_zone_cells \
            tests.test_build_urbis_cell \
            tests.test_make_urbis_cell_runtime \
            tests.test_make_urbis_network_cell_runtime \
            tests.test_build_urbis_runtime_index \
            tests.test_build_remaining_brussels_coverage \
            tests.test_capture_urbis_orthophoto -v
          python - <<'PY'
          import json
          from pathlib import Path
          grid=json.loads(Path('data/processed/remaining_brussels/cells/schaerbeek.json').read_text())
          boundary=json.loads(Path('data/processed/remaining_brussels/boundaries/schaerbeek.geojson').read_text())
          assert grid['format']=='grand-bruxelles-zone-cells-v2' and grid['zone_id']=='schaerbeek'
          assert grid['crs']=='EPSG:31370' and grid['cell_count']==49
          assert boundary['source']['layer']=='urbisvector:Municipalities'
          print('SCHAERBEEK_OFFICIAL_GRID_VALID', grid['cell_count'])
          PY

      - name: Select four compact Schaerbeek frontier cells
        working-directory: grand-bruxelles-game
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          grid=json.loads(Path('data/processed/remaining_brussels/cells/schaerbeek.json').read_text())
          cells={c['id']:c for c in grid['cells']}
          root=Path('data/urbis/remaining_brussels/cells')

          def edge(a,b):
              ae,an,ae2,an2=a; be,bn,be2,bn2=b
              return (((ae2==be or be2==ae) and max(an,bn)<min(an2,bn2)) or
                      ((an2==bn or bn2==an) and max(ae,be)<min(ae2,be2)))
          def centre(c):
              e,n,e2,n2=c['bbox']; return ((e+e2)/2.0,(n+n2)/2.0)

          existing={cid for cid in cells if (root/cid/'manifest.json').exists()}
          assert len(existing)>=23, ('expected Schaerbeek pass-3 checkpoint', len(existing))
          selected=[]; connected=set(existing)
          for _ in range(4):
              cc=[centre(cells[cid]) for cid in connected]
              cx=sum(x for x,_ in cc)/len(cc); cy=sum(y for _,y in cc)/len(cc)
              frontier=[]
              for c in cells.values():
                  if c['id'] in connected: continue
                  neighbours=[cid for cid in connected if edge(c['bbox'],cells[cid]['bbox'])]
                  if not neighbours: continue
                  x,y=centre(c)
                  compact=abs(x-cx)+abs(y-cy)
                  # Prioritize infill touching multiple existing cells, then stay close to the
                  # current mass. This avoids unrealistic thin corridors and maximizes playable continuity.
                  frontier.append((len(neighbours),-compact,-abs(x-150750.0),-abs(y-172000.0),c))
              assert frontier, ('no contiguous Schaerbeek frontier remains', sorted(connected))
              frontier.sort(reverse=True,key=lambda item:item[:-1])
              chosen=frontier[0][-1]; selected.append(chosen); connected.add(chosen['id'])

          payload={'format':'grand-bruxelles-zone-cells-v2','zone_id':'schaerbeek-compact-pass-4','crs':'EPSG:31370','cell_size_m':500.0,'cell_count':4,'cells':selected,'continuity':{'preexisting_ids':sorted(existing),'ordered_ids':[c['id'] for c in selected],'strategy':'compact edge-contiguous infill; prefer multi-neighbour closure and source-faithful playable mass'}}
          Path('/tmp/schaerbeek-pass4.json').write_text(json.dumps(payload,indent=2)+'\n')
          Path('/tmp/schaerbeek-pass4.tsv').write_text('\n'.join(f"{c['id']}\t{','.join(str(v) for v in c['bbox'])}" for c in selected)+'\n')
          print('SCHAERBEEK_PASS4_SELECTION', payload['continuity']['ordered_ids'])
          PY

      - name: Materialize authoritative UrbIS geometry and transport networks
        working-directory: grand-bruxelles-game
        run: |
          python tools/materialize_zone_cells.py --manifest /tmp/schaerbeek-pass4.json --output-root data/urbis/remaining_brussels/cells --force
          python tools/build_urbis_runtime_index.py --source-root data/urbis/remaining_brussels/cells --resource-prefix res://data/urbis/remaining_brussels/cells --output data/urbis/remaining_brussels/runtime_index.json
          python tools/build_remaining_brussels_coverage.py --output data/processed/remaining_brussels/coverage_report.json

      - name: Capture official UrbIS orthophoto evidence
        working-directory: grand-bruxelles-game
        run: |
          mkdir -p /tmp/schaerbeek-pass4-ortho data/processed/remaining_brussels/references
          while IFS=$'\t' read -r CELL BBOX; do
            python tools/capture_urbis_orthophoto.py --bbox "$BBOX" --width 1024 --height 1024 --output "/tmp/schaerbeek-pass4-ortho/${CELL}.png" --metadata "data/processed/remaining_brussels/references/schaerbeek_${CELL}_orthophoto.json"
          done < /tmp/schaerbeek-pass4.tsv

      - name: Validate continuity fidelity and runtime inclusion
        working-directory: grand-bruxelles-game
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sel=json.loads(Path('/tmp/schaerbeek-pass4.json').read_text()); root=Path('data/urbis/remaining_brussels/cells')
          def edge(a,b):
              ae,an,ae2,an2=a; be,bn,be2,bn2=b
              return (((ae2==be or be2==ae) and max(an,bn)<min(an2,bn2)) or ((an2==bn or bn2==an) and max(ae,be)<min(ae2,be2)))
          connected=set(sel['continuity']['preexisting_ids']); ids=[]
          for c in sel['cells']:
              cid=c['id']; ids.append(cid); m=json.loads((root/cid/'manifest.json').read_text())
              assert m['crs']=='EPSG:31370'
              assert any(edge(m['bbox'],json.loads((root/o/'manifest.json').read_text())['bbox']) for o in connected if (root/o/'manifest.json').exists()), cid
              g=json.loads((root/cid/m['runtime']['geometry_file']).read_text()); n=json.loads((root/cid/m['runtime']['network_file']).read_text())
              assert g['stats']['buildings']>0 and g['stats']['street_surfaces']>0 and n['stats']['street_segments']>0
              ortho=json.loads(Path(f'data/processed/remaining_brussels/references/schaerbeek_{cid}_orthophoto.json').read_text())
              assert ortho['provider']=='Paradigm / UrbIS' and ortho['bbox']==m['bbox'] and ortho['download']['bytes']>1000
              connected.add(cid)
          coverage=json.loads(Path('data/processed/remaining_brussels/coverage_report.json').read_text()); sc=next(z for z in coverage['zones'] if z['zone_id']=='schaerbeek')
          assert set(ids)<=set(sc['materialized_cell_ids']) and sc['materialized_cells']>=27
          runtime=json.loads(Path('data/urbis/remaining_brussels/runtime_index.json').read_text()); assert set(ids)<={c['cell_id'] for c in runtime['cells']}
          print('SCHAERBEEK_PASS4_VALIDATED', ids, sc['materialized_cells'], sc['coverage_percent'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: schaerbeek-pass4-official-orthophotos
          path: /tmp/schaerbeek-pass4-ortho/*.png
          retention-days: 14
          if-no-files-found: error

      - name: Commit validated Schaerbeek compact pass 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Chatnoir01@users.noreply.github.com'
          git add grand-bruxelles-game/data/processed/remaining_brussels grand-bruxelles-game/data/urbis/remaining_brussels
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: compact Schaerbeek authoritative coverage pass 4'
          git push origin HEAD:zone-reste-bruxelles-clean
