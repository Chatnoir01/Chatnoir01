name: Road Runtime-Index Source Auth

on:
  pull_request:
    paths:
      - 'game/**'
      - 'data/runtime/road_destination_runtime_index.json'
      - 'data/osm/**'
      - 'tests/test_automatic_road_runtime_index_live_byte_authority.py'
      - 'tests/test_automatic_road_runtime_index_prepublication_auth.py'
      - 'tests/test_automatic_road_runtime_index_atomic_publication.py'
      - '.github/workflows/road-runtime-index-source-auth.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'data/runtime/road_destination_runtime_index.json'
      - 'data/osm/**'
      - 'tests/test_automatic_road_runtime_index_live_byte_authority.py'
      - 'tests/test_automatic_road_runtime_index_prepublication_auth.py'
      - 'tests/test_automatic_road_runtime_index_atomic_publication.py'
      - '.github/workflows/road-runtime-index-source-auth.yml'

permissions:
  contents: read

jobs:
  source-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          echo "checked_out_sha=$(git rev-parse HEAD)"
          git status --short
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run runtime-index source-auth regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_automatic_road_runtime_index_live_byte_authority.py \
            tests/test_automatic_road_runtime_index_prepublication_auth.py \
            tests/test_automatic_road_runtime_index_atomic_publication.py
