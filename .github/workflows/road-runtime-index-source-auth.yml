name: Road Runtime-Index Source Auth

on:
  pull_request:
    paths:
      - 'grand-bruxelles-game/game/scripts/automatic_road_direct_spawn.gd'
      - 'grand-bruxelles-game/data/runtime/road_destination_runtime_index.json'
      - 'grand-bruxelles-game/data/osm/**'
      - 'grand-bruxelles-game/tests/test_road_runtime_index_prepublication_auth.py'
      - '.github/workflows/road-runtime-index-source-auth.yml'

permissions:
  contents: read

jobs:
  prepublication-source-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run prepublication source-auth regression
        working-directory: grand-bruxelles-game
        run: python -m pytest -q tests/test_road_runtime_index_prepublication_auth.py
