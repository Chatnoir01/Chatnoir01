name: Rogue Native Weapon Inventory

on:
  push:
    branches:
      - agent/rogue-native-weapon-inventory-a215fd2
  pull_request:
    branches:
      - main
    paths:
      - grand-bruxelles-game/assets/characters/player_character.glb
      - .github/workflows/rogue-native-weapon-inventory.yml

jobs:
  inspect-glb:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse Rogue GLB node and mesh inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import json, struct, pathlib
          path = pathlib.Path('grand-bruxelles-game/assets/characters/player_character.glb')
          data = path.read_bytes()
          magic, version, total_len = struct.unpack_from('<III', data, 0)
          assert magic == 0x46546C67, hex(magic)
          assert version == 2, version
          chunk_len, chunk_type = struct.unpack_from('<II', data, 12)
          assert chunk_type == 0x4E4F534A, hex(chunk_type)
          doc = json.loads(data[20:20+chunk_len].decode('utf-8').rstrip('\x00 \t\r\n'))
          nodes = doc.get('nodes', [])
          meshes = doc.get('meshes', [])
          skins = doc.get('skins', [])
          print(f'GLB_OK nodes={len(nodes)} meshes={len(meshes)} skins={len(skins)} bytes={len(data)}')
          print('--- MESHES ---')
          for i, mesh in enumerate(meshes):
              print(f'MESH {i}: name={mesh.get("name", "")!r} primitives={len(mesh.get("primitives", []))}')
          print('--- NODES WITH MESH ---')
          for i, node in enumerate(nodes):
              if 'mesh' not in node:
                  continue
              mi = node['mesh']
              mesh_name = meshes[mi].get('name', '') if isinstance(mi, int) and 0 <= mi < len(meshes) else ''
              print(f'NODE {i}: name={node.get("name", "")!r} mesh={mi} mesh_name={mesh_name!r} skin={node.get("skin")} children={node.get("children", [])}')
          print('--- WEAPON-LIKE TOKENS ---')
          tokens = ('cross', 'bow', 'dagger', 'knife', 'blade', 'weapon', 'sword', 'axe', 'quiver', 'arrow', 'bolt')
          found = 0
          for i, node in enumerate(nodes):
              mi = node.get('mesh')
              mesh_name = meshes[mi].get('name', '') if isinstance(mi, int) and 0 <= mi < len(meshes) else ''
              hay = (str(node.get('name','')) + ' ' + str(mesh_name)).lower()
              if any(t in hay for t in tokens):
                  print(f'WEAPON_NODE {i}: node={node.get("name", "")!r} mesh={mesh_name!r} skin={node.get("skin")}')
                  found += 1
          print(f'WEAPON_TOKEN_MATCHES={found}')
          print('--- ROOT / SKELETON CONTEXT ---')
          parent = {}
          for i, node in enumerate(nodes):
              for c in node.get('children', []):
                  parent[c] = i
          for i, node in enumerate(nodes):
              name = str(node.get('name',''))
              if name.lower() in ('hand.r','hand.l','wrist.r','wrist.l') or 'hand' in name.lower():
                  chain=[]; cur=i
                  while cur in parent and len(chain)<6:
                      cur=parent[cur]; chain.append((cur, nodes[cur].get('name','')))
                  print(f'HAND_NODE {i}: name={name!r} parent_chain={chain}')
          PY
