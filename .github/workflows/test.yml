name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  kenney-car-intake:
    if: github.event_name == 'pull_request' && github.head_ref == 'asset-intake/kenney-car-kit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Checkout isolated intake branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download exact official Kenney Car Kit archive
        shell: bash
        run: |
          set -euo pipefail
          URL='https://kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/kenney_car-kit.zip
          test -s /tmp/kenney_car-kit.zip
          sha256sum /tmp/kenney_car-kit.zip | tee /tmp/kenney_car-kit.sha256

      - name: Verify source license and extract complete GLB dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kenney-car-kit
          mkdir -p /tmp/kenney-car-kit
          unzip -q /tmp/kenney_car-kit.zip -d /tmp/kenney-car-kit
          LICENSE_FILE=$(find /tmp/kenney-car-kit -type f -iname 'license*' | head -n 1 || true)
          test -n "$LICENSE_FILE"
          if ! grep -Eqi 'CC0|Creative Commons Zero|public domain' "$LICENSE_FILE"; then
            echo 'KENNEY_CAR_INTAKE_FAIL: source license is not recognizably CC0' >&2
            cat "$LICENSE_FILE" >&2
            exit 1
          fi
          mapfile -t GLBS < <(find /tmp/kenney-car-kit -type f -iname '*.glb' | sort)
          if [ "${#GLBS[@]}" -lt 8 ]; then
            echo "KENNEY_CAR_INTAKE_FAIL: expected >=8 GLBs, found ${#GLBS[@]}" >&2
            find /tmp/kenney-car-kit -maxdepth 5 -type f | sort >&2
            exit 1
          fi
          COLORMAP_FILE=$(find /tmp/kenney-car-kit -type f -iname 'colormap.png' | head -n 1 || true)
          if [ -z "$COLORMAP_FILE" ]; then
            echo 'KENNEY_CAR_INTAKE_FAIL: GLB colormap dependency missing from official archive' >&2
            exit 1
          fi
          TARGET='grand-bruxelles-game/assets/vehicles/kenney_car_kit'
          mkdir -p "$TARGET/models/Textures"
          rm -f "$TARGET/models"/*.glb
          for src in "${GLBS[@]}"; do cp "$src" "$TARGET/models/$(basename "$src")"; done
          cp "$COLORMAP_FILE" "$TARGET/models/Textures/colormap.png"
          cp "$LICENSE_FILE" "$TARGET/LICENSE.txt"
          ARCHIVE_SHA=$(cut -d' ' -f1 /tmp/kenney_car-kit.sha256)
          COUNT=${#GLBS[@]}
          printf '%s\n' "${GLBS[@]##*/}" > "$TARGET/MODEL_INDEX.txt"
          {
            echo '# Kenney Car Kit provenance'
            echo
            echo '- Creator: Kenney'
            echo '- Official page: https://kenney.nl/assets/car-kit'
            echo '- License: Creative Commons CC0 1.0 Universal'
            echo '- Exact archive URL: https://kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/kenney_car-kit.zip'
            echo "- Archive SHA-256: $ARCHIVE_SHA"
            echo '- Intake date: 2026-08-19'
            echo '- Imported format: GLB plus required shared colormap texture'
            echo "- Imported GLB count: $COUNT"
            echo '- Imported dependency: models/Textures/colormap.png'
            echo '- Runtime authorization: false pending in-game owner visual/performance review'
          } > "$TARGET/PROVENANCE.md"
          echo "KENNEY_CAR_INTAKE_OK count=$COUNT colormap=$COLORMAP_FILE sha256=$ARCHIVE_SHA"

      - name: Commit isolated asset intake and consume trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'grand-bruxelles-intake-bot'
          git config user.email 'grand-bruxelles-intake-bot@users.noreply.github.com'
          git add grand-bruxelles-game/assets/vehicles/kenney_car_kit
          git rm -f .asset-intake/kenney-car-kit.request || true
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'assets(vehicle): intake complete Kenney Car Kit CC0 dependencies'
          git push origin HEAD:${{ github.head_ref }}
