name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  kenney-car-intake-pr900:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 900
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout intake branch
        uses: actions/checkout@v4
        with:
          ref: codex/kenney-car-kit-intake-pilot

      - name: Download official Kenney Car Kit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/car-kit.zip'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/kenney_car-kit.zip
          test -s /tmp/kenney_car-kit.zip
          sha256sum /tmp/kenney_car-kit.zip | tee /tmp/kenney_car-kit.sha256

      - name: Extract and stage CC0 GLBs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kenney-car-kit
          mkdir -p /tmp/kenney-car-kit
          unzip -q /tmp/kenney_car-kit.zip -d /tmp/kenney-car-kit
          mapfile -t GLBS < <(find /tmp/kenney-car-kit -type f -iname '*.glb' | sort)
          if [ "${#GLBS[@]}" -lt 8 ]; then
            echo "Expected at least 8 GLB vehicle models, found ${#GLBS[@]}" >&2
            find /tmp/kenney-car-kit -maxdepth 5 -type f | sort >&2
            exit 1
          fi

          TARGET='grand-bruxelles-game/assets/vehicles/kenney_car_kit'
          mkdir -p "$TARGET/models"
          rm -f "$TARGET/models"/*.glb
          for src in "${GLBS[@]}"; do
            cp "$src" "$TARGET/models/$(basename "$src")"
          done

          LICENSE_FILE=$(find /tmp/kenney-car-kit -type f \( -iname 'license.txt' -o -iname 'license.md' -o -iname 'license*' \) | head -n 1 || true)
          if [ -n "$LICENSE_FILE" ]; then
            cp "$LICENSE_FILE" "$TARGET/LICENSE.txt"
          else
            cat > "$TARGET/LICENSE.txt" <<'EOF'
Kenney Car Kit
License: Creative Commons CC0 1.0 Universal
Official asset page: https://kenney.nl/assets/car-kit
CC0 legal text: https://creativecommons.org/publicdomain/zero/1.0/
EOF
          fi

          ARCHIVE_SHA=$(cut -d' ' -f1 /tmp/kenney_car-kit.sha256)
          COUNT=${#GLBS[@]}
          cat > "$TARGET/PROVENANCE.md" <<EOF
# Kenney Car Kit provenance

- Creator: Kenney
- Official page: https://kenney.nl/assets/car-kit
- License: Creative Commons CC0 1.0 Universal
- Exact archive URL: https://kenney.nl/media/pages/assets/car-kit/1a312ec241-1775131960/car-kit.zip
- Archive SHA-256: \`$ARCHIVE_SHA\`
- Intake date: 2026-08-19
- Imported format: GLB only
- Imported GLB count: $COUNT
- Runtime authorization: false until owner in-game visual review
EOF
          printf '%s\n' "${GLBS[@]##*/}" > "$TARGET/MODEL_INDEX.txt"
          echo "KENNEY_CAR_INTAKE_OK count=$COUNT sha256=$ARCHIVE_SHA"

      - name: Commit asset intake to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'grand-bruxelles-intake-bot'
          git config user.email 'grand-bruxelles-intake-bot@users.noreply.github.com'
          git add grand-bruxelles-game/assets/vehicles/kenney_car_kit
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'assets(vehicle): intake Kenney Car Kit CC0 GLBs'
          git push origin HEAD:codex/kenney-car-kit-intake-pilot
