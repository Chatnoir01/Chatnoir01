name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "grand-bruxelles-game/docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
